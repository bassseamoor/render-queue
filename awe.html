<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AWE — the standing-there generator</title>
<style>
:root{--bg:#0d0b08;--ink:#efe3cb;--mut:#a89272;--gold:#e8a33d;--card:#161210;--line:#3a2d20}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif}
.top{position:sticky;top:0;z-index:5;background:rgba(13,11,8,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.brand{font-size:20px;letter-spacing:.28em;color:var(--gold);margin-right:6px}
.seedchip{font-family:monospace;font-size:12px;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;background:var(--card)}
.seedchip:hover{color:var(--gold);border-color:var(--gold)}
button.act{background:var(--gold);border:0;color:#1a1208;font-weight:700;border-radius:999px;padding:8px 18px;font-size:14px;cursor:pointer;font-family:inherit}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:8px 16px;font-size:14px;cursor:pointer;font-family:inherit}
button.ghost:hover{color:var(--gold);border-color:var(--gold)}
button.ghost.on{color:#1a1208;background:var(--gold);border-color:var(--gold)}
.locks{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mut);flex-wrap:wrap}
.wrap{max-width:680px;margin:0 auto;padding:34px 20px 90px}
.mvmt{margin:0 0 8px}
.mvmt .num{font-size:12px;letter-spacing:.35em;color:var(--gold);margin:30px 0 4px}
.mvmt .mtitle{font-size:15px;color:var(--mut);font-style:italic;margin:0 0 12px}
.mvmt p{font-size:18.5px;line-height:1.75;margin:0 0 1em}
.mvmt:first-child .num{margin-top:0}
.mvmt p:first-of-type::first-letter{font-size:2.6em;float:left;line-height:.9;padding:2px 8px 0 0;color:var(--gold)}
.custom{display:none;gap:8px;flex-wrap:wrap;margin:6px 0}
.custom.open{display:flex}
.custom select{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-family:inherit;font-size:13.5px;max-width:300px}
.saved{margin-top:26px;border-top:1px solid var(--line);padding-top:14px}
.saved h4{font-size:12px;letter-spacing:.25em;color:var(--mut);margin:0 0 10px;font-weight:400}
.srow{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:14px}
.srow code{font-family:monospace;font-size:12px;color:var(--gold);cursor:pointer;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow button{background:none;border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:2px 10px;cursor:pointer;font-size:12px}
.hintline{color:var(--mut);font-size:13.5px;font-style:italic;margin:18px 0 0}
@media(max-width:560px){.mvmt p{font-size:17px}.brand{font-size:16px}}
</style>
</head>
<body>
<div class="top">
  <span class="brand">AWE</span>
  <span class="seedchip" id="seedChip" title="tap to copy share link">seed …</span>
  <button class="act" id="btnNew">New hour</button>
  <button class="ghost" id="btnCopy">Copy</button>
  <button class="ghost" id="btnSave">Keep</button>
  <div class="locks">
    <span>lock:</span>
    <button class="ghost" id="lockPlace">place</button>
    <button class="ghost" id="lockHour">hour</button>
    <button class="ghost" id="lockLight">light</button>
    <button class="ghost" id="btnCustom">customize</button>
  </div>
</div>
<div class="wrap">
  <div class="custom" id="customRow">
    <select id="selPlace"></select>
    <select id="selHour"></select>
    <button class="act" id="btnApplyCustom">Stand here</button>
  </div>
  <div id="hour"></div>
  <p class="hintline" id="hintline">Stand still. Read slowly. This hour is yours — keep it with the seed above.</p>
  <div class="saved" id="savedBox" style="display:none">
    <h4>KEPT HOURS</h4>
    <div id="savedList"></div>
  </div>
</div>

<script>
'use strict';
/* ---------- seeded RNG ---------- */
function xmur3(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return (h^=h>>>16)>>>0;};}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function pickN(rng,arr,n,used,tag){const pool=arr.map((_,i)=>i).filter(i=>!used.has(tag+':'+i));const out=[];for(let k=0;k<n&&pool.length;k++){const j=Math.floor(rng()*pool.length);const idx=pool.splice(j,1)[0];used.add(tag+':'+idx);out.push(arr[idx]);}return out;}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
const ROMAN=['I','II','III','IV','V','VI'];
const MTITLES=['arrival','settling','the wide look','close noticing','the deep hour','staying'];

/* ---------- movement frames (prose; atoms fill the {slots}) ---------- */
const FRAMES=[
[ /* 1 arrival — place, hour, light0, sky */
 p=>`You come to ${p.place} ${p.hour}. For a moment you just stand at the edge of it, not quite believing your luck \u2014 and then the believing stops mattering, because ${p.light0}.\n\nOverhead, ${p.sky}. You take one breath, then another, and feel the particular unclenching that happens when a place turns out to be real.`,
 p=>`This is the place: ${p.place}. The time is ${p.hour}. You arrive the way you arrive at all the best things \u2014 slightly out of breath, slightly late, and exactly on time.\n\n${cap(p.light0)}. Above you, ${p.sky} \u2014 and you understand, suddenly, that you will remember this hour for the rest of your life.`,
 p=>`${cap(p.hour)} \u2014 and here: ${p.place}. You stop walking the way you stop talking when someone says something true.\n\n${cap(p.light0)}. ${cap(p.sky)}, and the sky seems to be showing off just for you, which is ridiculous, and you don't care.`
],
[ /* 2 settling — air, mat0, ground */
 p=>`${cap(p.air)}. You let your shoulders down; you hadn't realized they were up.\n\nUnder your hand, before you've decided to touch it: ${p.mat0}. Under your feet: ${p.ground}. Some things you touch the way you touch museum pieces when no one is looking \u2014 and some things you touch because they ask.`,
 p=>`Your body takes a minute to catch up with where you are. ${cap(p.air)}.\n\nYou find a place to stand that feels like it was waiting. What meets your hand there is exactly as it should be: ${p.mat0} \u2014 present, honest, beautiful without trying. The ground under you, ${p.ground}, holds you like it means it.`,
 p=>`${cap(p.air)}. Breath comes easier here, as if the air had been expecting you.\n\nYou lean, lightly, into ${p.mat0}, and feel the day stored in it coming back out into your palm. Beneath you, ${p.ground} \u2014 you shift your weight and feel completely, boringly, miraculously supported.`
],
[ /* 3 the wide look — vista, light1, mat1 */
 p=>`Then you look up \u2014 really look \u2014 and ${p.vista}.\n\n${cap(p.light1)}. Off to one side, ${p.mat1}, catching the light and holding it a moment longer than it should, as if reluctant to give it back.`,
 p=>`${cap(p.vista)}. You turn slowly, taking it in the way you drink water when you're truly thirsty.\n\n${cap(p.light1)} \u2014 and where it touches the ${p.mat1}, it seems lit from within, like something remembering being made.`,
 p=>`The whole of it, all at once: ${p.vista}.\n\n${cap(p.light1)}. Somewhere in the middle distance, ${p.mat1} does something with the light that stops your breath for half a second \u2014 and then gives it back changed.`
],
[ /* 4 close noticing — micro x6, craft x2 */
 p=>`The big thing is almost too much, so your eyes do what eyes do: they go small. ${cap(p.micro0)}. ${cap(p.micro1)}.\n\nAnd then \u2014 ${p.craft0} \u2014 you stop breathing for a second, because somebody's hands made that, and they cared. ${cap(p.micro4)} nearby, as if the place were showing off its jewelry, and you let it.`,
 p=>`You crouch without deciding to. ${cap(p.micro0)}. A little further on, ${p.micro2}.\n\nAnd here is the thing that undoes you: ${p.craft0}. Not grand. Just true. ${cap(p.micro4)} \u2014 you lean closer, and closer still, until your nose nearly touches it.`,
 p=>`Down at the level of small things, the place is even more itself. ${cap(p.micro1)}. ${cap(p.micro3)}.\n\n${cap(p.craft1)} \u2014 the kind of care you can feel in your chest like a hand. You find ${p.micro5} and look at it for a long time, the way you look at a face you love.`
],
[ /* 5 the deep hour — sounds x5, smells x2, light2, mat2, feel[4], feel[6] */
 p=>`Time does something strange then. It stops passing and starts pooling. ${cap(p.snd0)}; ${p.snd1}.\n\n${cap(p.sml0)}, and underneath it, ${p.sml1}. ${cap(p.mat2)} is cool under your palm. ${cap(p.feel4)}.

Somewhere in the middle of it you stop observing and start belonging. That is the whole secret, and there is no secret.`,
 p=>`Has it been an hour? Has it been ten minutes? ${cap(p.snd2)}. The light has shifted \u2014 ${p.light2} \u2014 and the shift feels like the place turning a page just for you.\n\n${cap(p.snd4)}. ${cap(p.sml0)}. ${cap(p.feel4)} \u2014 and you realize you have been smiling for some time without knowing it.

You could stay until the light goes completely, and part of you already has.`,
 p=>`The senses stop taking turns and start arriving together: ${p.snd1} over ${p.sml0}, ${p.sml1} underneath everything like a bass note.\n\n${cap(p.light2)}. Your palm rests on ${p.mat2}, cool and real. ${cap(p.feel4)} ${cap(p.feel6)}.

This is the hour you will come back to, later, when you need it. It will be here.`
],
[ /* 6 staying — feel[5], snd3 */
 p=>`You don't leave. That's the whole of it \u2014 you don't leave, not yet, maybe not for a long while.\n\n${cap(p.feel5)}. The place keeps being itself, indifferent and generous at once, and you are lucky enough to be standing in it. ${cap(p.snd3)}, far off, like a door closing gently on the ordinary world.`,
 p=>`Later you will try to describe this and fail in the particular way people fail at describing the best things.\n\nFor now there is only this: ${p.feel5}, and the knowledge, quiet as stone, that you were here. You stay.`,
 p=>`Eventually the light will change and the hour will end, the way all hours end. But not yet.\n\n${cap(p.snd3)}. ${cap(p.feel5)}. And you stay a little longer, and then a little longer than that.`
]
];

function picks(seedStr, locks){
  const rng=mulberry32(xmur3(seedStr)());
  const I=AWE_INTENT, used=new Set();
  const one=(k)=>pickN(rng,I[k],1,used,k)[0];
  const p={};
  const pl = locks.place || one('places');
  p.place = pl.t; p.vista = pl.v; p._pl = pl;
  const hr = locks.hour || one('hours');
  p.hour = hr.t; p.period = hr.p; p._hr = hr;
  p.sky = one('sky'); p.ground = one('ground');
  const lsrc=I.light.filter(l=>l.ps.includes(hr.p));
  const lpool=(lsrc.length>=3?lsrc:I.light);
  const lused=new Set();
  const lpick=()=>{ const pool=lpool.map((_,i)=>i).filter(i=>!lused.has(i));
    const j=Math.floor(rng()*pool.length); const idx=pool.splice(j,1)[0];
    lused.add(idx); return lpool[idx].t; };
  p.light0 = locks.light || lpick(); p.light1=lpick(); p.light2=lpick();
  const mats=pickN(rng,I.materials,3,used,'materials'); p.mat0=mats[0]; p.mat1=mats[1]; p.mat2=mats[2];
  const snds=pickN(rng,I.sounds,5,used,'sounds'); p.snd0=snds[0]; p.snd1=snds[1]; p.snd2=snds[2]; p.snd3=snds[3]; p.snd4=snds[4];
  const smls=pickN(rng,I.smells,2,used,'smells'); p.sml0=smls[0]; p.sml1=smls[1];
  p.air=one('air');
  const micros=pickN(rng,I.micro,6,used,'micro'); p.micro0=micros[0]; p.micro1=micros[1]; p.micro2=micros[2]; p.micro3=micros[3]; p.micro4=micros[4]; p.micro5=micros[5];
  const crafts=pickN(rng,I.craft,2,used,'craft'); p.craft0=crafts[0]; p.craft1=crafts[1];
  const feels=pickN(rng,I.feelings,7,used,'feelings'); p.feel4=feels[4]; p.feel5=feels[5]; p.feel6=feels[6];
  p.fi=Math.floor(rng()*FRAMES[0].length);
  return p;
}
function compose(seedStr, locks){
  const p=picks(seedStr, locks);
  const fi=p.fi;
  
  const html=FRAMES.map((variants,mi)=>{
    const text=variants[fi](p);
    const paras=text.split(/\n\n|\.\s(?=[A-Z])/).filter(s=>s.trim().length>0);
    return `<div class="mvmt"><div class="num">${ROMAN[mi]}</div><div class="mtitle">${MTITLES[mi]}</div>`+
      paras.map(t=>`<p>${t.trim()}</p>`).join('')+`</div>`;
  }).join('');
  return {html,
          words: html.replace(/<[^>]+>/g,' ').split(/\s+/).filter(Boolean).length};
}

/* ---------- app state ---------- */
const S={seed:'',locks:{place:null,hour:null,light:null}};
const $=(id)=>document.getElementById(id);
function randSeed(){return Math.random().toString(36).slice(2,8);}
function render(){
  const r=compose(S.seed,S.locks);
  $('hour').innerHTML=r.html;
  $('seedChip').textContent='seed '+S.seed;
  document.title='AWE · '+S.seed;
  try{history.replaceState(null,'','?seed='+encodeURIComponent(S.seed));}catch(e){}
  S.words=r.words;
}
function newHour(keepLocks){
  if(!keepLocks) S.locks={place:null,hour:null,light:null};
  S.seed=randSeed(); syncLockBtns(); render();
}
function syncLockBtns(){
  $('lockPlace').classList.toggle('on',!!S.locks.place);
  $('lockHour').classList.toggle('on',!!S.locks.hour);
  $('lockLight').classList.toggle('on',!!S.locks.light);
}
/* locks capture current atoms: re-compose quietly to read them */
function currentAtoms(){
  const p=picks(S.seed,S.locks);
  return {place:p._pl,hour:p._hr,light:p.light0};
}
function toggleLock(kind){
  if(S.locks[kind]){ S.locks[kind]=null; }
  else{ const a=currentAtoms(); S.locks[kind]=a[kind==='light'?'light':kind]; }
  syncLockBtns(); render();
}
/* customize */
function fillCustom(){
  const sp=$('selPlace'), sh=$('selHour');
  sp.innerHTML=AWE_INTENT.places.map((p,i)=>`<option value="${i}">${p.t.slice(0,64)}…</option>`).join('');
  sh.innerHTML=AWE_INTENT.hours.map((h,i)=>`<option value="${i}">${h.t} (${h.p})</option>`).join('');
}
/* saved */
function getSaved(){try{return JSON.parse(localStorage.getItem('awe_seeds')||'[]');}catch(e){return[];}}
function setSaved(a){try{localStorage.setItem('awe_seeds',JSON.stringify(a));}catch(e){}}
function renderSaved(){
  const a=getSaved(), box=$('savedBox'), list=$('savedList');
  box.style.display=a.length?'block':'none';
  list.innerHTML=a.map(s=>`<div class="srow"><code data-s="${s}">seed ${s}</code><button data-d="${s}">forget</button></div>`).join('');
  list.querySelectorAll('[data-s]').forEach(el=>el.onclick=()=>{S.seed=el.dataset.s;S.locks={place:null,hour:null,light:null};syncLockBtns();render();window.scrollTo(0,0);});
  list.querySelectorAll('[data-d]').forEach(el=>el.onclick=()=>{setSaved(getSaved().filter(s=>s!==el.dataset.d));renderSaved();});
}
/* wire */
$('btnNew').onclick=()=>newHour(true);
$('seedChip').onclick=()=>{const u=location.origin+location.pathname+'?seed='+encodeURIComponent(S.seed);(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>{$('seedChip').textContent='copied ✓';setTimeout(()=>$('seedChip').textContent='seed '+S.seed,1200);}).catch(()=>{prompt('Share link:',u);});};
$('btnCopy').onclick=()=>{const t=$('hour').innerText;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{$('btnCopy').textContent='copied ✓';setTimeout(()=>$('btnCopy').textContent='Copy',1200);}).catch(()=>{});};
$('btnSave').onclick=()=>{const a=getSaved();if(!a.includes(S.seed)){a.unshift(S.seed);setSaved(a.slice(0,40));}renderSaved();$('btnSave').textContent='kept ✓';setTimeout(()=>$('btnSave').textContent='Keep',1200);};
$('lockPlace').onclick=()=>toggleLock('place');
$('lockHour').onclick=()=>toggleLock('hour');
$('lockLight').onclick=()=>toggleLock('light');
$('btnCustom').onclick=()=>{$('customRow').classList.toggle('open');$('btnCustom').classList.toggle('on');};
$('btnApplyCustom').onclick=()=>{S.locks.place=AWE_INTENT.places[+$('selPlace').value];S.locks.hour=AWE_INTENT.hours[+$('selHour').value];S.locks.light=null;S.seed=randSeed();syncLockBtns();render();window.scrollTo(0,0);};
/* init */
(function init(){
  fillCustom(); renderSaved();
  let seed=null;
  try{seed=new URLSearchParams(location.search).get('seed');}catch(e){}
  S.seed=(seed&&/^[a-z0-9]{3,12}$/i.test(seed))?seed:randSeed();
  render();
})();
/* debug surface */
window.__awe={compose,seed:()=>S.seed,words:()=>S.words||0};
</script>
