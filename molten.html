<script id="scene-shader" type="x-shader/x-fragment">#version 300 es
precision highp float;
in vec2 vUv;
out vec4 fragColor;
uniform vec2 uRes;
uniform vec4 uBlobs[24];
uniform int uCount,uShape,uView,uBackground,uMetal,uSteps;
uniform vec3 uWax,uHot,uLiquid,uBack;
uniform float uMerge,uWarp,uTime,uGlow,uGloss,uTranslucence,uGlass,uExposure,uHalo,uZoom,uYaw,uPitch,uGrain,uFloor,uPulse,uSoftness,uSpread,uIridescence,uMarble,uLightAngle,uLightHeight;
const float PI=3.14159265359;
float smin(float a,float b,float k){float h=clamp(.5+.5*(b-a)/k,0.,1.);return mix(b,a,h)-k*h*(1.-h);}
float radiusAt(float y){
 if(uView>0)return 9.;
 if(uShape==0)return mix(.86,.46,smoothstep(-1.9,1.9,y))+.035*sin((y+1.9)*.826);
 if(uShape==1)return .75;
 if(uShape==2)return sqrt(max(.001,1.-pow(y/1.95,2.)))*1.39;
 return .52+.35*pow(abs(y)/1.9,1.25);
}
float vessel(vec3 p){
 if(uShape==2)return (length(p/vec3(1.39,1.95,1.39))-1.)*1.32;
 return max(length(p.xz)-radiusAt(p.y),abs(p.y)-1.91);
}
float waxMap(vec3 p){
 float d=8.;
 vec3 q=p;
 q.x+=uWarp*.10*sin(p.y*3.1+uTime)*sin(p.z*3.7+uTime*2.);
 q.z+=uWarp*.09*sin(p.y*4.4-uTime*2.)*cos(p.x*3.5+uTime);
 for(int i=0;i<24;i++){if(i>=uCount)break;
  vec3 c=q-uBlobs[i].xyz;
  float stretch=1.+uSoftness*.32*sin(float(i)*2.67+uTime*2.);
  c.y/=stretch;
  float wob=1.+.024*sin(uTime*2.+float(i)*2.39)+.016*sin(uTime*3.+float(i)*4.07);
  float sphere=(length(c)-uBlobs[i].w*wob)*min(1.,stretch);
  d=smin(d,sphere,uMerge);
 }
 if(uView==0){
  float bottom=length((q-vec3(0.,-1.92,0.))/vec3(.66,.18,.66))-1.;
  d=smin(d,bottom*.18,.20+uMerge*.2);
  d=max(d,vessel(p)+.072);
 }

}
vec3 waxNormal(vec3 p){vec2 e=vec2(.0015,0.);return normalize(vec3(waxMap(p+e.xyy)-waxMap(p-e.xyy),waxMap(p+e.yxy)-waxMap(p-e.yxy),waxMap(p+e.yyx)-waxMap(p-e.yyx)));}
float cappedCone(vec3 p,float h,float r1,float r2){vec2 q=vec2(length(p.xz),p.y);vec2 k1=vec2(r2,h),k2=vec2(r2-r1,2.*h);vec2 ca=vec2(q.x-min(q.x,(q.y<0.)?r1:r2),abs(q.y)-h);vec2 cb=q-k1+k2*clamp(dot(k1-q,k2)/dot(k2,k2),0.,1.);float s=(cb.x<0.&&ca.y<0.)?-1.:1.;return s*sqrt(min(dot(ca,ca),dot(cb,cb)));}
float metalMap(vec3 p){
 if(uShape==2){float a=cappedCone(p-vec3(0.,-2.04,0.),.19,.75,.5);float b=length(vec2(length(p.xz)-.49,p.y+1.89))-.044;return min(a,b);}
 float rb=uShape==1?.80:.94;float rt=uShape==0?.50:uShape==1?.8:.93;
 float base=cappedCone(p-vec3(0.,-2.21,0.),.32,rb*.82,rb);
 float foot=cappedCone(p-vec3(0.,-2.54,0.),.045,rb*.89,rb*.82);
 float cap=cappedCone(p-vec3(0.,2.065,0.),.155,rt,rt*.70);

}
vec3 metalNormal(vec3 p){vec2 e=vec2(.001,0.);return normalize(vec3(metalMap(p+e.xyy)-metalMap(p-e.xyy),metalMap(p+e.yxy)-metalMap(p-e.yxy),metalMap(p+e.yyx)-metalMap(p-e.yyx)));}
vec3 env(vec3 d){
 vec3 c=mix(vec3(.025,.027,.04),vec3(.18,.19,.24),smoothstep(-.3,1.,d.y));
 float softbox=pow(max(0.,dot(d,normalize(vec3(-3.,2.,4.)))),28.);
 float strip=pow(max(0.,dot(d,normalize(vec3(3.,1.,1.)))),60.);
 c+=vec3(.95,.80,.68)*softbox*1.6+mix(uHot,vec3(.7,.75,1.),.7)*strip*1.8;
 c+=uWax*pow(max(0.,dot(d,normalize(vec3(-1.,-.4,-2.)))),8.)*.2;
 return c;
}
vec3 backdrop(vec2 uv,vec3 rd){

 vec3 c=uBack*(.35+halo*1.5);
 c+=mix(uWax,uHot,.2)*halo*(uBackground==0?.017:.075)*uHalo;

}
vec2 cylinderHit(vec3 ro,vec3 rd,float r,float h){

 vec2 t=vec2(-b-sqrt(det),-b+sqrt(det))/max(a,.00001);
 if(abs(rd.y)>.00001){vec2 ty=vec2(-h-ro.y,h-ro.y)/rd.y;if(ty.x>ty.y)ty=ty.yx;t=vec2(max(t.x,ty.x),min(t.y,ty.y));}

vec3 film(vec3 x){return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.);}

 vec3 target=vec3(0.,uView==0?-.18:0.,0.);
 vec3 ro=target+vec3(sin(yaw)*cos(pitch),sin(pitch),cos(yaw)*cos(pitch))*distance;
 vec3 ww=normalize(target-ro),uu=normalize(cross(ww,vec3(0.,1.,0.))),vv=cross(uu,ww);

 if(uFloor>.5&&uView==0&&tf>0.){
  vec3 fp=ro+rd*tf;

  float reflection=exp(-pow(fp.x*.85,2.)-pow((fp.z-1.2)*.9,2.));
  col+=mix(uWax,uHot,.55)*pool*.038*uGlow+uHot*reflection*.013;
  col*=1.-.55*exp(-dot(fp.xz,fp.xz)*2.5);
  if(pool>.015){
   vec3 rr=reflect(rd,vec3(0.,1.,0.)),origin=fp+rr*.025;
   vec2 rb=cylinderHit(origin,rr,uShape==2?1.43:1.06,2.6);
   float rt=max(0.,rb.x);
   for(int i=0;i<40;i++){
    if(rt>rb.y)break;
    vec3 rp=origin+rr*rt;
    float wd=waxMap(rp),md=metalMap(rp),d=min(wd,md);
    if(d<.009){
     vec3 reflectionColor=wd<md?mix(uHot,uWax,smoothstep(-1.7,1.7,rp.y))*.8:env(reflect(rr,metalNormal(rp)))*.25;
     col+=reflectionColor*.10*pool;break;
    }
    rt+=max(d*.76,.012);
   }
  }
 }
 float metalT=1e3;
 if(uView==0){vec2 bound=cylinderHit(ro,rd,1.06,2.6);float t=max(0.,bound.x);
  for(int i=0;i<64;i++){if(t>bound.y)break;vec3 p=ro+rd*t;float d=metalMap(p);if(d<.0015){metalT=t;break;}t+=max(d*.8,.003);}
 }
 float entry=0.,exitT=0.;vec3 glassN=vec3(0.);bool inGlass=false;
 if(uView==0){
  vec2 bound=cylinderHit(ro,rd,uShape==2?1.43:.96,1.95);
  float t=max(0.,bound.x);
  for(int i=0;i<70;i++){if(t>bound.y)break;float d=vessel(ro+rd*t);if(d<.0015){entry=t;inGlass=true;break;}t+=max(d*.78,.002);}
  if(inGlass){
   float back=bound.y;
   for(int i=0;i<60;i++){if(back<entry)break;float d=vessel(ro+rd*back);if(d<.0015){exitT=back;break;}back-=max(d*.78,.002);}
   vec3 gp=ro+rd*entry;vec2 e=vec2(.002,0.);glassN=normalize(vec3(vessel(gp+e.xyy)-vessel(gp-e.xyy),vessel(gp+e.yxy)-vessel(gp-e.yxy),vessel(gp+e.yyx)-vessel(gp-e.yyx)));
  }
 }else{vec2 b=cylinderHit(ro,rd,4.6,4.3);entry=max(0.,b.x);exitT=b.y;inGlass=exitT>entry;}
 float lavaT=1e3;
 if(inGlass&&entry<metalT){
  vec3 rayStart=ro+rd*entry;
  vec3 lr=rd;
  if(uView==0)lr=normalize(mix(rd,refract(rd,glassN,1./1.18),uGlass*.28));
  float t=.014;float travel=max(.0,exitT-entry);
  float nearest=9.;float glowAccum=0.;

   if(i>=uSteps||t>travel||t+entry>metalT)break;

  }

  inner+=mix(uWax,uHot,.35)*pow(max(0.,1.-abs(rayStart.x)*.6),3.)*.04*uGlow;
  if(lavaT<999.){
   vec3 p=rayStart+lr*lavaT;vec3 n=waxNormal(p);vec3 v=-lr;
   vec3 l=normalize(vec3(sin(uLightAngle)*4.6,uLightHeight,cos(uLightAngle)*4.6)-p);
   vec3 l2=normalize(vec3(2.5,-2.3,1.3)-p);
   float diff=max(dot(n,l),0.);float diff2=max(dot(n,l2),0.);
   float fres=pow(1.-max(dot(n,v),0.),3.);

   vec3 pigment=mix(uHot,uWax,gradient*.86);
   float ribbons=.5+.5*sin(p.y*5.+sin(p.x*3.+uTime)*2.+cos(p.z*3.-uTime)*1.5);
   pigment=mix(pigment,mix(uWax,uHot,ribbons),uMarble*.7);
   pigment=mix(pigment,mix(uLiquid,uHot,.5+.5*sin(fres*8.+p.y*2.)),uIridescence*fres*.7);

   float ao=clamp(waxMap(p+n*.12)/.12,.3,1.);

   vec3 halfV=normalize(l+v);
   float spec=pow(max(dot(n,halfV),0.),mix(12.,180.,uGloss));
   shade+=vec3(1.,.88,.74)*spec*(.16+.95*uGloss);

   inner=shade;
  }
  inner+=mix(uWax,uHot,.4)*min(.28,glowAccum)*uGlow*.35;
  if(uView==0){
   float fres=pow(1.-abs(dot(glassN,-rd)),3.);
   vec3 refl=env(reflect(rd,glassN));
   float edge=pow(1.-abs(dot(glassN,-rd)),9.);

   inner+=refl*(.02+.16*fres)*uGlass+mix(uLiquid,vec3(.5,.58,.7),.65)*edge*.18*uGlass;
   vec3 gp=ro+rd*entry;
   float stripe=exp(-pow((glassN.x+.58)*18.,2.))*(1.-smoothstep(1.35,1.86,abs(gp.y)));
   float stripe2=exp(-pow((glassN.x-.82)*40.,2.))*(1.-smoothstep(1.3,1.86,abs(gp.y)));
   inner+=vec3(.56,.59,.68)*stripe*.13*uGlass+uHot*stripe2*.18*uGlass;
   float stripe3=exp(-pow((glassN.x+.14)*30.,2.))*(1.-smoothstep(1.2,1.86,abs(gp.y)));
   inner+=vec3(.60,.61,.69)*stripe3*.045*uGlass;
   float lip=exp(-pow((abs(gp.y)-1.87)*40.,2.));inner+=vec3(.35,.38,.46)*lip*.15*uGlass;
  }
  col=inner;
 }
 if(metalT<100.&&(!inGlass||metalT<entry)){
  vec3 p=ro+rd*metalT,n=metalNormal(p);
  vec3 refl=env(reflect(rd,n));
  vec3 tint=uMetal==0?vec3(.12,.13,.15):uMetal==1?vec3(.70,.73,.78):uMetal==2?vec3(.75,.49,.23):vec3(.75,.31,.17);
  float stripe=.96+.04*sin(p.y*900.);
  col=tint*(.09+.16*max(dot(n,normalize(vec3(-3.,4.,5.))),0.))+refl*tint*stripe*(uMetal==0?.55:1.15);
  col+=uHot*pow(max(0.,n.y),3.)*.055*uGlow;
  float rim=exp(-pow((p.y+1.902)*95.,2.));col+=uHot*rim*.3*uGlow;
 }
 float dust=0.;
 for(int i=0;i<9;i++){
  float fi=float(i);
  vec2 dh=vec2(fract(sin(fi*127.1)*43758.5453),fract(sin(fi*311.7)*12543.1234))-.5;
  vec2 dp=dh*vec2(2.8,2.3)+vec2(0.,.12)+vec2(sin(uTime+fi*2.1),cos(uTime*2.+fi*3.7))*.10;
  float dd=length(uv-dp);
  dust+=exp(-dd*dd*4200.)*(.6+.4*sin(uTime*3.+fi*7.3));
 }
 col+=mix(uHot,vec3(1.),.35)*dust*.026*min(uGlow,1.5);
 col*=1.-.12*dot(vUv-.5,vUv-.5);
 col=film(col*uExposure);
 col=pow(col,vec3(1./2.2));
 fragColor=vec4(col,1.);
}
</script>
<script id="post-shader" type="x-shader/x-fragment">#version 300 es

</script>

      seedChip.title = 'Tap to copy seed';
      seedChip.addEventListener('click', function () {
        var s = A.getSeed();
        function done() { self.toast('Seed copied: ' + s); }
        if (navigator.clipboard && navigator.clipboard.writeText)
          navigator.clipboard.writeText(s).then(done, done);
        else done();
      });
      function btn(txt, title, fn, cls) {
        var b = el('button', 'sc-btn' + (cls ? ' ' + cls : ''), txt);
        b.title = title; b.setAttribute('aria-label', title);
        b.addEventListener('click', function (ev) { ev.stopPropagation(); fn(b); });
        return b;
      }
      this.bRandom = btn('🎲', 'Random — brand new world', function () { self.doRandom(); });
      this.bRemix = btn('🌀', 'Remix — same vibe, new details (respects locks)', function () { self.doRemix(); });
      this.bFav = btn('☆', 'Save this seed to favorites', function (b) { self.toggleFav(b); });
      this.bRec = btn('●', 'Record video', function () { self.togglePanelSection('rec'); }, 'rec');
      this.bMore = btn('⚙️', 'Customize: seed, parameters, history', function () { self.togglePanel(); });
      pill.appendChild(seedChip);
      pill.appendChild(this.bRandom); pill.appendChild(this.bRemix);
      pill.appendChild(this.bFav); pill.appendChild(this.bRec); pill.appendChild(this.bMore);
      document.body.appendChild(pill);
      this.pill = pill; this.seedChip = seedChip;

      // dot (restores chrome when hidden)
      var dot = el('div', 'sc-dot hidden');
      dot.title = 'Show controls';
      dot.addEventListener('click', function () { self.toggleChrome(); });
      document.body.appendChild(dot);
      this.dot = dot;

      // panel
      var p = el('div', 'sc-panel hidden');
      p.innerHTML =
        '<div class="sc-row"><input class="sc-seedinput" id="sc-seedfield" spellcheck="false">' +
        '<button class="sc-btn" id="sc-apply" style="font-size:13px">Apply</button></div>' +
        '<div class="sc-sec">Parameters (🔒 = kept on Remix)</div><div id="sc-params"></div>' +
        '<div class="sc-sec">Record video</div><div class="sc-durs" id="sc-durs"></div>' +
        '<div class="sc-row"><button class="sc-btn" id="sc-recbtn" style="font-size:13px">● Start recording</button>' +
        '<button class="sc-btn" id="sc-hideui" style="font-size:13px">Hide UI</button></div>' +
        '<div class="sc-status" id="sc-status"></div><div id="sc-dl"></div>' +
        '<div class="sc-sec">⭐ Favorites</div><div class="sc-list" id="sc-favs"></div>' +
        '<div class="sc-sec">🕘 Recent seeds</div><div class="sc-list" id="sc-hist"></div>';
      document.body.appendChild(p);
      this.panel = p;
      var self2 = this;
      p.querySelector('#sc-apply').addEventListener('click', function () {
        var v = p.querySelector('#sc-seedfield').value.trim();
        if (v) self2.applySeed(v);
      });
      p.querySelector('#sc-hideui').addEventListener('click', function () { self2.toggleChrome(); });
      p.querySelector('#sc-recbtn').addEventListener('click', function () { self2.toggleRecord(); });
      var durs = [['30s', 30], ['5 min', 300], ['30 min', 1800], ['∞ until stopped', 0]];
      var dz = p.querySelector('#sc-durs');
      this.durBtns = [];
      durs.forEach(function (d, i) {
        var b = el('button', 'sc-dur' + (i === 3 ? ' on' : ''), d[0]);
        b.addEventListener('click', function () {
          self2.recState.dur = d[1];
          self2.durBtns.forEach(function (x) { x.classList.remove('on'); });
          b.classList.add('on');
        });
        dz.appendChild(b); self2.durBtns.push(b);
      });
      this.recState.dur = 0;

      // toast
      var t = el('div', 'sc-toast');
      document.body.appendChild(t);
      this.toastEl = t;

      this.renderHist(); this.renderFavs(); this.updateFavBtn();
    },

    toast: function (msg) {
      var t = this.toastEl, self = this;
      t.textContent = msg; t.classList.add('show');
      clearTimeout(this._tt);
      this._tt = setTimeout(function () { t.classList.remove('show'); }, 2200);
    },

    togglePanel: function () { this.panel.classList.toggle('hidden'); },
    togglePanelSection: function () {
      if (this.panel.classList.contains('hidden')) this.panel.classList.remove('hidden');
      this.panel.scrollTop = this.panel.querySelector('.sc-sec').offsetTop - 60;
    },
    toggleChrome: function () {
      var hidden = this.pill.classList.toggle('hidden');
      this.panel.classList.add('hidden');
      this.dot.classList.toggle('hidden', !hidden);
    },

    applySeed: function (s, opts) {
      var self = this;
      opts = opts || {};
      function done() {
        self.seedChip.textContent = s;
        var f = self.panel.querySelector('#sc-seedfield');
        if (f) f.value = s;
        // re-apply locked params after regen so Remix/customize locks hold
        self.applyLocks();
        self.refreshParams();
        if (!opts.silent) self.toast('Seed: ' + s);
        var h = self.hist.get([]);
        h = [s].concat(h.filter(function (x) { return x !== s; })).slice(0, 30);
        self.hist.set(h);
        self.renderHist(); self.updateFavBtn();
      }
      try {
        var r = this.A.setSeed(s);
        if (r && typeof r.then === 'function') r.then(done, function (e) {
          console.error(e); self.toast('Could not apply seed');
        });
        else done();
      } catch (e) { console.error(e); this.toast('Could not apply seed'); }
    },

    doRandom: function () { this.applySeed(this.A.randomSeed()); },
    doRemix: function () { this.applySeed(this.A.remixSeed(this.A.getSeed())); },

    applyLocks: function () {
      var locks = this.locks.get({});
      var self = this;
      (this.A.params || []).forEach(function (p) {
        if (locks[p.key] && self._lockedVals && self._lockedVals[p.key] != null) {
          try { p.set(self._lockedVals[p.key]); } catch (e) {}
        }
      });
    },
    snapshotLocks: function () {
      var locks = this.locks.get({}), vals = {};
      (this.A.params || []).forEach(function (p) {
        if (locks[p.key]) { try { vals[p.key] = p.get(); } catch (e) {} }
      });
      this._lockedVals = vals;
    },

    refreshParams: function () {
      var self = this, A = this.A;
      var box = this.panel.querySelector('#sc-params');
      box.innerHTML = '';
      var locks = this.locks.get({});
      (A.params || []).forEach(function (p) {
        var wrap = el('div', 'sc-param');
        var top = el('div', 'top');
        var lab = el('label', '', esc(p.label));
        var val = el('span', 'val', '');
        var lock = el('button', 'sc-lock' + (locks[p.key] ? ' on' : ''), locks[p.key] ? '🔒' : '🔓');
        lock.title = 'Lock: kept on Remix';
        var cur = null;
        try { cur = p.get(); } catch (e) {}
        function fmt(v) { return (typeof v === 'number' && Math.abs(v) < 10 && p.step < 1) ? v.toFixed(2) : String(v); }
        val.textContent = fmt(cur);
        var slider = document.createElement('input');
        slider.type = 'range'; slider.min = p.min; slider.max = p.max; slider.step = p.step;
        if (cur != null) slider.value = cur;
        slider.addEventListener('input', function () {
          var v = parseFloat(slider.value);
          try { p.set(v); } catch (e) {}
          val.textContent = fmt(v);
          if (locks[p.key]) { self.snapshotLocks(); }
        });
        slider.addEventListener('change', function () { self.snapshotLocks(); });
        lock.addEventListener('click', function () {
          var L = self.locks.get({});
          L[p.key] = !L[p.key];
          self.locks.set(L);
          lock.classList.toggle('on', !!L[p.key]);
          lock.textContent = L[p.key] ? '🔒' : '🔓';
          self.snapshotLocks();
          self.toast(L[p.key] ? p.label + ' locked for Remix' : p.label + ' unlocked');
        });
        top.appendChild(lab); top.appendChild(val); top.appendChild(lock);
        wrap.appendChild(top); wrap.appendChild(slider);
        box.appendChild(wrap);
      });
      this.snapshotLocks();
    },

    toggleFav: function (b) {
      var s = this.A.getSeed();
      var favs = this.favs.get([]);
      var i = favs.findIndex(function (f) { return f.seed === s; });
      var snap = {};
      try {
        (this.A.params || []).forEach(function (p) { snap[p.key] = p.get(); });
      } catch (e) {}
      if (i === -1) {
        favs.unshift({ seed: s, params: snap, ts: Date.now() });
        this.toast('⭐ Saved to favorites');
      } else {
        favs.splice(i, 1);
        this.toast('Removed from favorites');
      }
      this.favs.set(favs.slice(0, 100));
      this.renderFavs(); this.updateFavBtn();
    },
    updateFavBtn: function () {
      var s = this.A.getSeed();
      var favs = this.favs.get([]);
      var on = favs.some(function (f) { return f.seed === s; });
      this.bFav.textContent = on ? '★' : '☆';
      this.bFav.classList.toggle('on', on);
    },
    renderFavs: function () {
      var self = this, box = this.panel.querySelector('#sc-favs');
      box.innerHTML = '';
      var favs = this.favs.get([]);
      if (!favs.length) box.innerHTML = '<div class="meta" style="color:#9aa0a6;font-size:12px">Nothing saved yet — tap ☆ on a seed you love.</div>';
      favs.forEach(function (f) {
        var it = el('div', 'sc-item');
        it.innerHTML = '<span class="grow">' + esc(f.seed) + '</span><span class="meta">' +
          new Date(f.ts).toLocaleDateString() + '</span>';
        it.addEventListener('click', function () {
          self.applySeed(f.seed);
          if (f.params) {
            setTimeout(function () {
              (self.A.params || []).forEach(function (p) {
                if (f.params[p.key] != null) { try { p.set(f.params[p.key]); } catch (e) {} }
              });
              self.refreshParams();
            }, 50);
          }
          self.toast('Loaded favorite: ' + f.seed);
        });
        box.appendChild(it);
      });
    },
    renderHist: function () {
      var self = this, box = this.panel.querySelector('#sc-hist');
      box.innerHTML = '';
      var h = this.hist.get([]);
      if (!h.length) box.innerHTML = '<div style="color:#9aa0a6;font-size:12px">Your recent seeds will appear here.</div>';
      h.forEach(function (s) {
        var it = el('div', 'sc-item');
        it.innerHTML = '<span class="grow">' + esc(s) + '</span>';
        it.addEventListener('click', function () { self.applySeed(s); });
        box.appendChild(it);
      });
    },

    // ---- recording ----
    bestMime: function () {
      if (!window.MediaRecorder) return '';
      var cands = ['video/mp4', 'video/mp4;codecs=avc1.42E01E', 'video/webm;codecs=vp9', 'video/webm'];
      for (var i = 0; i < cands.length; i++) {
        try { if (MediaRecorder.isTypeSupported(cands[i])) return cands[i]; } catch (e) {}
      }
      return '';
    },
    toggleRecord: function () {
      if (this.recState.rec) this.stopRecord();
      else this.startRecord();
    },
    startRecord: function () {
      var self = this;
      var canvas = null;
      try { canvas = this.A.canvas(); } catch (e) {}
      if (!canvas || !canvas.captureStream) { this.setStatus('Recording not supported on this canvas.'); return; }
      var mime = this.bestMime();
      if (!mime) { this.setStatus('No supported recording format in this browser.'); return; }
      this.recState.mime = mime;
      this.recState.chunks = [];
      var stream;
      try { stream = canvas.captureStream(60); } catch (e) { this.setStatus('Could not capture stream.'); return; }
      var rec;
      try {
        rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 14000000 });
      } catch (e) { this.setStatus('Recorder failed to start.'); return; }
      rec.ondataavailable = function (ev) { if (ev.data && ev.data.size) self.recState.chunks.push(ev.data); };
      rec.onstop = function () { self.finishRecord(); };
      try { rec.start(4000); } catch (e) { this.setStatus('Recorder failed to start.'); return; }
      this.recState.rec = rec;
      this.recState.t0 = Date.now();
      this.bRec.classList.add('on');
      this.panel.querySelector('#sc-recbtn').textContent = '■ Stop recording';
      this.tickStatus();
      if (this.recState.dur > 0) {
        this.recState.timer = setTimeout(function () { self.stopRecord(); }, this.recState.dur * 1000);
      }
      this.toast('● Recording…');
    },
    tickStatus: function () {
      var self = this;
      if (!this.recState.rec) return;
      var s = Math.floor((Date.now() - this.recState.t0) / 1000);
      var mm = Math.floor(s / 60), ss = ('0' + (s % 60)).slice(-2);
      this.setStatus('● REC ' + mm + ':' + ss + ' — tap Stop when done', true);
      setTimeout(function () { self.tickStatus(); }, 1000);
    },
    stopRecord: function () {
      clearTimeout(this.recState.timer);
      try { this.recState.rec.stop(); } catch (e) {}
      this.setStatus('Finishing…');
    },
    finishRecord: function () {
      var self = this;
      this.recState.rec = null;
      this.bRec.classList.remove('on');
      this.panel.querySelector('#sc-recbtn').textContent = '● Start recording';
      var ext = this.recState.mime.indexOf('mp4') !== -1 ? 'mp4' : 'webm';
      var blob = new Blob(this.recState.chunks, { type: this.recState.mime.split(';')[0] });
      this.recState.chunks = [];
      var base = 'seedconsole';
      try { base = this.A.fileBase(this.A.getSeed()) || base; } catch (e) {}
      var name = base + '.' + ext;
      var file = null;
      try { file = new File([blob], name, { type: blob.type }); } catch (e) {}
      this.setStatus('Done — ' + (blob.size / 1048576).toFixed(1) + ' MB. Share it to Files → your SSD.');
      var dl = this.panel.querySelector('#sc-dl');
      dl.innerHTML = '';
      function fallbackLink() {
        var url = URL.createObjectURL(blob);
        var a = el('a', 'sc-link', '⬇ Download ' + esc(name));
        a.href = url; a.download = name;
        dl.appendChild(a);
      }
      if (file && navigator.canShare && navigator.share) {
        try {
          if (navigator.canShare({ files: [file] })) {
            navigator.share({ files: [file], title: name }).then(function () {
              self.toast('Shared — pick Save to Files → your SSD');
            }, function () { fallbackLink(); });
            return;
          }
        } catch (e) {}
      }
      fallbackLink();
      this.toast('Recording ready below');
    },
    setStatus: function (msg, rec) {
      var s = this.panel.querySelector('#sc-status');
      s.textContent = msg;
      s.classList.toggle('rec', !!rec);
    }
  };

  window.SeedConsole = SeedConsole;
})();
</script>
<script>
'use strict';
/* Seed Console adapter for the Molten studio. The console is the only UI that
 * mutates generation state: seed, hero parameters, favorites, and recording.
 * setSeed() fully rebuilds the scene (new blob choreography from the seed,
 * motion restarted) while leaving the seamless loop guarantee intact - the
 * loop closes on integer motion harmonics, which hold for every seed. */
(function () {
  var H = window.__moltenHooks;
  if (!H) { console.error('[molten] SeedConsole adapter: studio hooks missing'); return; }
  var SEED_MIN = 1, SEED_MAX = 999999;
  function cryptoUint() {
    var a = new Uint32Array(1);
    if (window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(a);
    else a[0] = Math.floor(Math.random() * 4294967296);
    return a[0];
  }
  function randomSeed() { return String(SEED_MIN + (cryptoUint() % (SEED_MAX - SEED_MIN + 1))); }
  /* Sibling seed: a small random hop from the current seed, so the new world
   * is a variant of this one (same look/palette family, new blob details).
   * Locked hero params are re-applied by the console after regeneration. */
  function remixSeed(s) {
    var cur = parseInt(String(s).trim(), 10);
    if (!isFinite(cur)) cur = SEED_MIN;
    var off = 1 + (cryptoUint() % 5000);
    var dir = (cryptoUint() % 2) ? 1 : -1;
    var n = (((cur - 1 + dir * off) % SEED_MAX) + SEED_MAX) % SEED_MAX + 1;
    return String(n);
  }
  function param(key, label, min, max, step, custom) {
    return {
      key: key, label: label, min: min, max: max, step: step,
      get: function () { return H.getState()[key]; },
      set: function (v) { H.update(key, v, custom !== false); }
    };
  }
  var viewParam = param('view', 'Framing \u00b7 Sculpture / Liquid / Macro', 0, 2, 1, false);
  var setView = viewParam.set;
  viewParam.set = function (v) { setView(v); H.resetCamera(); };
  window.SeedConsoleAdapter = {
    studio: 'molten',
    title: 'Molten',
    getSeed: function () { return String(H.getState().seed); },
    setSeed: function (s) {
      var n = parseInt(String(s).trim(), 10);
      if (!isFinite(n)) n = SEED_MIN;
      n = Math.max(SEED_MIN, Math.min(SEED_MAX, Math.round(n)));
      H.setSeed(n);
    },
    randomSeed: randomSeed,
    remixSeed: remixSeed,
    params: [
      param('count', 'Wax bodies', 4, 24, 1),
      param('size', 'Blob size', 0.5, 1.65, 0.01),
      param('speed', 'Flow speed', 0.15, 3, 0.01),
      param('glow', 'Luminous glow', 0, 3, 0.01),
      param('merge', 'Fusion', 0.06, 0.65, 0.01),
      param('heat', 'Thermal lift', 0, 1, 0.01),
      param('marble', 'Color marbling', 0, 1, 0.01),
      param('warp', 'Surface turbulence', 0, 1.5, 0.01),
      param('exposure', 'Brightness', 0.35, 2.8, 0.01),
      viewParam
    ],
    canvas: function () { return H.canvas(); },
    fileBase: function (seedStr) { return 'molten-' + String(seedStr).replace(/[^\w\-]+/g, '_'); }
  };
  SeedConsole.init(window.SeedConsoleAdapter);
})();
</script>
