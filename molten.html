<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101012"><meta name="description" content="Sculpt light in liquid. A procedural lava lamp studio with custom materials, motion, lighting and clean video recording.">
<title>MOLTEN — Lava Studio</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23101012'/%3E%3Cpath d='M16 4C14 11 8 12 8 20a8 8 0 0016 0C24 13 18 10 16 4' fill='%23ff794d'/%3E%3C/svg%3E">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101012;color:#eeeae5;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#scene:active{cursor:grabbing}
.scene-meta{position:fixed;top:24px;left:28px;pointer-events:none;z-index:2}
.eyebrow{font-size:11px;letter-spacing:.2em;font-weight:550;color:#8c878a;text-transform:uppercase}
.scene-meta h1{font-family:Georgia,"Times New Roman",serif;font-size:30px;font-weight:400;margin:8px 0;color:#f2e6dc;letter-spacing:-.015em}
.scene-meta p{font-size:12px;color:#a19a9b;margin:0}
.toast{position:fixed;bottom:90px;left:50%;transform:translate(-50%,12px);background:#29232bee;border:1px solid #ffffff23;border-radius:10px;padding:12px 18px;font-size:13px;line-height:1.5;max-width:min(480px,90vw);z-index:20;opacity:0;pointer-events:none;transition:.2s;box-shadow:0 12px 50px #0007}
.toast.show{opacity:1;transform:translate(-50%,0)}
#error-panel{position:fixed;inset:0;display:none;place-content:center;padding:40px;text-align:center;background:#141216;z-index:6}
#error-panel h2{font:32px Georgia,serif;margin:0 0 12px}
#error-panel p{max-width:440px;color:#b5a8b7;line-height:1.7;font-size:14px}
@media(max-width:700px){.scene-meta{top:15px;left:16px}.scene-meta .eyebrow{font-size:9px}.scene-meta h1{font-size:22px;margin:5px 0}.scene-meta p{font-size:10px}}
</style>
</head>
<body>
<canvas id="scene" aria-label="Interactive three-dimensional lava lamp. Drag to orbit, scroll to zoom."></canvas>
<div class="scene-meta"><div class="eyebrow">Live composition <span id="scene-number">01</span></div><h1 id="scene-title">Ember &amp; obsidian</h1><p id="scene-subtitle">Warm wax. Midnight glass.</p></div>
<div id="error-panel" role="alert"><h2>Let’s turn the light on.</h2><p id="error-text"></p></div>
<div class="toast" id="toast" role="status"></div>










<script type="module" src="studios/molten/main.js"></script>
</body></html>
