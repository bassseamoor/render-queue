<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070a">
<title>Moor</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#f2f5f1; --dim:#a9b8ac; --faint:#6f7d72;
  --acc:#4ade80; --teal:#5eead4; --vio:#c4b5fd; --blue:#93c5fd; --amber:#fcd34d; --pink:#f9a8d4;
  --glass:rgba(255,255,255,.055); --line:rgba(255,255,255,.10);
}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink);overflow:hidden;user-select:none;-webkit-user-select:none;
  background:
    radial-gradient(900px 520px at 16% 10%, rgba(45,212,191,.13), transparent 60%),
    radial-gradient(1000px 620px at 84% 16%, rgba(139,92,246,.15), transparent 62%),
    radial-gradient(1000px 700px at 50% 100%, rgba(59,130,246,.12), transparent 60%),
    #05070a;}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(74,222,128,.28);border-radius:99px}
::-webkit-scrollbar-track{background:transparent}
button{font-family:inherit}

/* ============ ONBOARDING ============ */
.ob-veil{position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(900px 520px at 16% 10%, rgba(45,212,191,.15), transparent 60%),
    radial-gradient(1000px 620px at 84% 16%, rgba(139,92,246,.17), transparent 62%),
    radial-gradient(1000px 700px at 50% 100%, rgba(59,130,246,.13), transparent 60%),
    radial-gradient(760px 520px at 50% 42%, rgba(110,190,125,.07), transparent 60%),
    #05070a;
  animation:ob-in .35s ease;padding:16px}
@keyframes ob-in{from{opacity:0}to{opacity:1}}
.ob-veil.bye{opacity:0;transition:opacity .3s ease;pointer-events:none}
.ob-card{position:relative;width:640px;max-width:94vw;max-height:92vh;max-height:92dvh;overflow-y:auto;text-align:center;
  background:linear-gradient(165deg, rgba(255,255,255,.075), rgba(255,255,255,.02) 45%, rgba(139,92,246,.055));
  border:1px solid rgba(255,255,255,.13);border-radius:26px;padding:48px 40px;
  box-shadow:0 40px 120px rgba(0,0,0,.65), 0 0 90px rgba(45,212,191,.07), 0 0 140px rgba(139,92,246,.08);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
.ob-card h1{font-size:44px;margin:0 0 12px;letter-spacing:-.025em;font-weight:700}
.ob-grad{background:linear-gradient(92deg,#fff 15%,#a7f3d0 55%,#5eead4 85%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.ob-card h2{font-size:28px;margin:0 0 10px;font-weight:700;letter-spacing:-.02em}
.ob-sub{color:#b6c2ba;font-size:15px;line-height:1.65;margin:0 0 28px}
.ob-fine{font-size:12.5px;color:var(--faint);margin:24px 0 0;letter-spacing:.02em}
.ob-cta-row{display:flex;flex-direction:column;align-items:center;gap:14px}
.ob-pill{border:none;cursor:pointer;font-weight:700;font-size:17px;color:#06110a;
  background:linear-gradient(180deg,#b8f5d0,#4ade80 55%,#22c55e);border-radius:999px;padding:15px 60px;
  box-shadow:0 0 38px rgba(74,222,128,.45), 0 10px 26px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.5)}
.ob-pill:active{transform:scale(.97)}
.ob-ghost{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10);color:#c9d4cb;
  border-radius:999px;padding:12px 32px;font-size:14.5px;cursor:pointer}
.ob-cards{display:flex;gap:14px;margin:0 0 8px;text-align:left}
.ob-choice{flex:1;background:linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.015));
  border:1px solid rgba(255,255,255,.10);border-radius:20px;padding:26px 22px;cursor:pointer;color:var(--ink);
  box-shadow:0 18px 44px rgba(0,0,0,.35);text-align:left}
.ob-choice:active{transform:scale(.98)}
.ob-choice .tile{width:60px;height:60px;border-radius:18px;display:flex;align-items:center;justify-content:center;
  border:1px solid;margin-bottom:28px;box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 8px 22px rgba(0,0,0,.35)}
.ob-choice .tile svg{width:27px;height:27px;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ob-choice .t{font-size:20px;font-weight:700;margin-bottom:8px;letter-spacing:-.01em}
.ob-choice .d{font-size:13px;color:#a9b8ac;line-height:1.6}
.ob-choice.acc-a .tile{background:linear-gradient(135deg,rgba(45,212,191,.30),rgba(45,212,191,.08));border-color:rgba(45,212,191,.38)}
.ob-choice.acc-a .tile svg{stroke:#5eead4}
.ob-choice.acc-b .tile{background:linear-gradient(135deg,rgba(139,92,246,.32),rgba(59,130,246,.10));border-color:rgba(139,92,246,.42)}
.ob-choice.acc-b .tile svg{stroke:#c4b5fd}
.ob-back{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10);color:#c9d4cb;
  border-radius:999px;padding:13px 38px;font-size:14.5px;cursor:pointer;display:inline-block;margin-top:14px}
.ob-status{font-size:15px;color:#b6c2ba;line-height:1.75;margin:0 0 22px}
.ob-status b{color:#fff}
.ob-row{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap;align-items:center}
.ob-btn{border-radius:999px;padding:13px 32px;font-size:15px;border:none;cursor:pointer;font-weight:600;color:#06110a;
  background:linear-gradient(180deg,#b8f5d0,#4ade80 55%,#22c55e);box-shadow:0 0 26px rgba(74,222,128,.35)}
.ob-btn.ghost{background:rgba(255,255,255,.08);color:#dfe6df;box-shadow:none;border:1px solid rgba(255,255,255,.12);font-weight:500}
.ob-bar{height:10px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin:18px 0 6px}
.ob-bar i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,#5eead4,#4ade80);box-shadow:0 0 18px rgba(74,222,128,.6);transition:width .25s}
.ob-prov{display:flex;gap:14px;align-items:flex-start;text-align:left;
  background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.015));
  border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:15px 16px;margin-bottom:10px;cursor:pointer}
.ob-prov .tile{width:44px;height:44px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center;
  border:1px solid;font-size:19px;font-weight:700}
.ob-prov .pt{flex:1;min-width:0}
.ob-prov .n{font-size:15px;font-weight:650}
.ob-prov .s{font-size:12.5px;color:#a9b8ac;margin-top:4px}
.ob-keyform{display:none;margin-top:12px;gap:8px}
.ob-keyform.open{display:flex}
.ob-keyform input{flex:1;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12);
  border-radius:12px;color:var(--ink);padding:11px 14px;font-size:16px;min-width:0}
.ob-verdict{font-size:13px;margin-top:10px;min-height:20px}
.ob-verdict.ok{color:#5eead4}.ob-verdict.no{color:#f2b8b8}
@media (max-width:580px){.ob-cards{flex-direction:column}.ob-card{padding:36px 24px}.ob-card h1{font-size:34px}}

/* ============ OS SHELL ============ */
#os{position:fixed;inset:0;display:none}
#os.on{display:block}
#topbar{position:absolute;top:0;left:0;right:0;height:46px;display:flex;align-items:center;gap:10px;
  padding:0 14px;z-index:50;background:rgba(5,7,10,.45);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(255,255,255,.07)}
#topbar .logo{font-weight:800;font-size:16px;letter-spacing:-.01em}
#topbar .logo span{background:linear-gradient(92deg,#fff,#5eead4);-webkit-background-clip:text;background-clip:text;color:transparent}
#preview-tag{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:#0a0f0c;background:linear-gradient(180deg,#fcd34d,#f59e0b);
  border-radius:99px;padding:3px 10px}
#clock{margin-left:auto;font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
#replay-ob{font-size:12px;color:var(--faint);background:none;border:1px solid rgba(255,255,255,.1);
  border-radius:99px;padding:5px 12px;color:var(--dim)}
#rail{position:absolute;left:10px;top:58px;bottom:64px;width:60px;z-index:60;display:flex;flex-direction:column;
  align-items:center;gap:6px;padding:10px 0;border-radius:20px;
  background:rgba(10,14,12,.5);border:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 18px 50px rgba(0,0,0,.5)}
.rail-btn{width:44px;height:44px;border-radius:14px;border:1px solid transparent;background:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:#c6d2c7}
.rail-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rail-btn.active{background:rgba(94,234,212,.14);border-color:rgba(94,234,212,.35);color:#5eead4}
.rail-btn:active{transform:scale(.92)}
#desk{position:absolute;inset:46px 0 0 0;overflow:hidden}
#taskbar{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;z-index:200;display:flex;gap:8px;
  padding:8px 12px;border-radius:18px;background:rgba(10,14,12,.55);border:1px solid rgba(255,255,255,.09);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);max-width:94vw;overflow-x:auto}
.tb-chip{display:flex;align-items:center;gap:8px;border-radius:12px;padding:8px 14px 8px 10px;font-size:13px;
  background:rgba(255,255,255,.06);border:1px solid transparent;color:#dfe6df;white-space:nowrap;cursor:pointer}
.tb-chip svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tb-chip.active{border-color:rgba(94,234,212,.4);background:rgba(94,234,212,.1)}
.tb-empty{font-size:12px;color:var(--faint);padding:8px 6px}

/* ============ WINDOWS ============ */
.win{position:absolute;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(170deg, rgba(24,30,26,.92), rgba(12,16,13,.94));
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 30px 80px rgba(0,0,0,.6), 0 0 60px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.08);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  min-width:280px;min-height:200px;touch-action:none}
.win.maxed{border-radius:12px}
.w-titlebar{height:44px;flex:none;display:flex;align-items:center;gap:10px;padding:0 8px 0 14px;
  cursor:grab;border-bottom:1px solid rgba(255,255,255,.07);touch-action:none}
.w-titlebar:active{cursor:grabbing}
.w-icon{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none}
.w-icon svg{width:15px;height:15px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.w-title{font-size:14px;font-weight:650;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-ctl{display:flex;gap:2px}
.w-ctl button{width:32px;height:32px;border-radius:9px;border:none;background:none;color:#9fb0a2;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.w-ctl button svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.w-ctl button:active{background:rgba(255,255,255,.12)}
.w-ctl .close:active{background:rgba(248,113,113,.35);color:#fff}
.w-body{flex:1;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;position:relative}
.w-body.pad{padding:16px}

/* ============ SHARED BITS ============ */
.card{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:14px}
.row{display:flex;align-items:center;gap:12px}
.muted{color:var(--dim)}.small{font-size:12.5px}.tiny{font-size:11px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chipbtn{background:rgba(255,255,255,.07);border:1px solid var(--line);color:#dfe6df;border-radius:99px;
  padding:9px 16px;font-size:13.5px;cursor:pointer}
.chipbtn:active{transform:scale(.96)}
.pill-cta{border:none;cursor:pointer;font-weight:700;color:#06110a;border-radius:999px;padding:12px 28px;font-size:14.5px;
  background:linear-gradient(180deg,#b8f5d0,#4ade80 55%,#22c55e);box-shadow:0 0 22px rgba(74,222,128,.35)}
.pill-cta:active{transform:scale(.96)}
input[type=text],input[type=password],textarea{background:rgba(0,0,0,.35);border:1px solid var(--line);
  border-radius:12px;color:var(--ink);padding:11px 14px;font-size:16px;font-family:inherit;width:100%}
input:focus,textarea:focus{outline:none;border-color:rgba(94,234,212,.5)}
.sec-t{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--faint);margin:18px 0 10px}
.sec-t:first-child{margin-top:0}
</style>
</head>
<body>
<div id="ob-root"></div>

<div id="os">
  <div id="topbar">
    <div class="logo">Moor <span>OS</span></div>
    <div id="preview-tag">v1.0</div>
    <button id="replay-ob">↺ Onboarding</button>
    <div id="clock"></div>
  </div>
  <div id="rail"></div>
  <div id="desk"></div>
  <div id="taskbar"></div>
</div>

<script>
"use strict";
/* ================= ICONS ================= */
const P = {
  chat:'<path d="M21 12a8 8 0 0 1-8 8H4l2-3a8 8 0 1 1 15-5z"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01"/>',
  grid:'<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',
  folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  layers:'<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>',
  note:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/>',
  check:'<path d="M4 12l5 5L20 6"/>',
  checkSq:'<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 12.5l2.5 2.5 5-6"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  gear:'<circle cx="12" cy="12" r="3.2"/><path d="M19 12a7 7 0 0 0-.14-1.4l2-1.55-2-3.46-2.35.95A7 7 0 0 0 14.1 5.1L13.75 2.6h-3.5L9.9 5.1a7 7 0 0 0-2.42 1.42l-2.35-.95-2 3.46 2 1.55a7 7 0 0 0 0 2.8l-2 1.55 2 3.46 2.35-.95a7 7 0 0 0 2.41 1.42l.36 2.54h3.5l.35-2.54a7 7 0 0 0 2.42-1.42l2.35.95 2-3.46-2-1.55c.09-.46.14-.93.14-1.4z"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  minus:'<path d="M5 12h14"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  max:'<rect x="5" y="5" width="14" height="14" rx="2"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  spark:'<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 16l.9 2.1L22 19l-2.1.9L19 22l-.9-2.1L16 19l2.1-.9z"/>',
  dl:'<path d="M12 4v11"/><path d="M7 11l5 5 5-5"/><path d="M4 20h16"/>',
  key:'<circle cx="8" cy="14" r="4"/><path d="M11 11l8-8M16 4l3 3M13 7l3 3"/>',
  cpu:'<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/>',
  clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2"/>',
  star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.8-5.4 2.8 1-6.1L3.2 9.5l6.1-.9z"/>',
  chevR:'<path d="M9 6l6 6-6 6"/>',
  play:'<path d="M7 4l13 8-13 8z"/>',
  img:'<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 3 3 4-4 4 4"/>',
  music:'<circle cx="7" cy="17" r="2.6"/><circle cx="17" cy="15" r="2.6"/><path d="M9.6 17V6l10-2.5V15"/>',
  game:'<rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 11v4M5 13h4"/><circle cx="16" cy="11.5" r=".8"/><circle cx="18.2" cy="14" r=".8"/>',
  doc:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/>',
  book:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19a2 2 0 0 1 2-2h13"/>',
  flame:'<path d="M12 3s5 4.5 5 9a5 5 0 0 1-10 0c0-2 1-3.5 1-3.5s.5 1.5 2 1.5c-1-3 2-7 2-7z"/>',
  drop:'<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',
  moon:'<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/>'
};
function ic(n, s){ return '<svg '+(s?'style="'+s+'"':'')+' viewBox="0 0 24 24">'+P[n]+'</svg>'; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* ================= BRAIN: real, browser-direct (BYOK) =================
   Your key is stored only in this phone's browser localStorage and sent
   only to the provider you pick. Nothing passes through any Moor server. */
const BRAIN_PROVIDERS = {
  groq:      { name:'Groq',       endpoint:'https://api.groq.com/openai/v1/chat/completions',
               models:'https://api.groq.com/openai/v1/models', chatModel:'openai/gpt-oss-20b', hint:'gsk_…' },
  cerebras:  { name:'Cerebras',   endpoint:'https://api.cerebras.ai/v1/chat/completions',
               models:'https://api.cerebras.ai/v1/models',     chatModel:'llama-3.3-70b',      hint:'csk-…' },
  openrouter:{ name:'OpenRouter', endpoint:'https://openrouter.ai/api/v1/chat/completions',
               models:'https://openrouter.ai/api/v1/models',   chatModel:'openai/gpt-oss-20b', hint:'sk-or-…' }
};
const Brain = {
  keyFor(p){ try{ return localStorage.getItem('moor.preview.key.'+p)||''; }catch(e){ return ''; } },
  saveKey(p,k){ try{ localStorage.setItem('moor.preview.key.'+p,k); localStorage.setItem('moor.preview.provider',p); }catch(e){} },
  clearKey(p){ try{ localStorage.removeItem('moor.preview.key.'+p);
    if(localStorage.getItem('moor.preview.provider')===p) localStorage.removeItem('moor.preview.provider'); }catch(e){} },
  activeProvider(){ try{ const p=localStorage.getItem('moor.preview.provider'); return (p&&this.keyFor(p))?p:null; }catch(e){ return null; } },
  headers(p,key){
    const h = { 'Content-Type':'application/json', 'Authorization':'Bearer '+key };
    if(p==='openrouter'){ h['HTTP-Referer']='https://bassseamoor.github.io/render-queue/moor-os-preview.html'; h['X-Title']='Moor OS Preview'; }
    return h;
  },
  async testKey(p,key){
    const cfg = BRAIN_PROVIDERS[p];
    // Groq/Cerebras validate keys on GET /models; OpenRouter's /models is public, so the chat probe is the test there.
    if(p !== 'openrouter'){
      let r;
      try{ r = await fetch(cfg.models, { headers:{ 'Authorization':'Bearer '+key } }); }
      catch(e){ return { ok:false, msg:'Network error — are you online?' }; }
      if(r.status===401||r.status===403) return { ok:false, msg:'That key was rejected. Double-check it.' };
      if(!r.ok) return { ok:false, msg:cfg.name+' said '+r.status+'. Try again in a bit.' };
    }
    let r2;
    try{
      r2 = await fetch(cfg.endpoint, { method:'POST', headers:this.headers(p,key),
        body: JSON.stringify({ model:cfg.chatModel, messages:[{role:'user',content:'Reply with exactly: ok'}], max_tokens:10 }) });
    }catch(e){ return { ok:false, msg:'Key looks valid, but the chat probe failed to send. Are you online?' }; }
    if(r2.status===401||r2.status===403) return { ok:false, msg:'That key was rejected. Double-check it.' };
    if(!r2.ok) return { ok:false, msg:cfg.name+' said '+r2.status+'. Try again in a bit.' };
    return { ok:true, msg:'Key works. Brain online.' };
  },
  async chat(p,key,messages){
    const cfg = BRAIN_PROVIDERS[p];
    const r = await fetch(cfg.endpoint, { method:'POST', headers:this.headers(p,key),
      body: JSON.stringify({ model:cfg.chatModel, messages:messages, temperature:0.7, max_tokens:8000 }) });
    if(!r.ok){ const t = await r.text().catch(()=> ''); throw new Error(cfg.name+' '+r.status+(t?': '+t.slice(0,140):'')); }
    const d = await r.json();
    const c = d.choices && d.choices[0] && d.choices[0].message;
    return c ? c.content.trim() : '(empty reply)';
  }
};

/* Blobs: file contents live in IndexedDB (localStorage is too small for uploads) */
const Blobs = {
  db:null,
  open(){ const self=this; return new Promise(function(res,rej){
    try{
      const q = indexedDB.open('moor-blobs',1);
      q.onupgradeneeded = function(e){ e.target.result.createObjectStore('blobs'); };
      q.onsuccess = function(e){ self.db=e.target.result; res(); };
      q.onerror = function(){ rej(new Error('db')); };
    }catch(e){ rej(e); }
  }); },
  put(id,val){ const self=this; return new Promise(function(res,rej){
    if(!self.db) return rej(new Error('nodb'));
    const t = self.db.transaction('blobs','readwrite').objectStore('blobs').put(val,id);
    t.onsuccess=res; t.onerror=function(){rej(new Error('put'));}; }); },
  get(id){ const self=this; return new Promise(function(res,rej){
    if(!self.db) return rej(new Error('nodb'));
    const t = self.db.transaction('blobs','readonly').objectStore('blobs').get(id);
    t.onsuccess=function(){res(t.result);}; t.onerror=function(){rej(new Error('get'));}; }); },
  del(id){ const self=this; return new Promise(function(res){
    if(!self.db) return res();
    try{ const t=self.db.transaction('blobs','readwrite').objectStore('blobs').delete(id); t.onsuccess=res; t.onerror=res; }
    catch(e){ res(); } }); },
  all(){ const self=this; return new Promise(function(res){
    if(!self.db) return res([]);
    try{ const t=self.db.transaction('blobs','readonly').objectStore('blobs').getAllKeys();
      t.onsuccess=function(){res(t.result||[]);}; t.onerror=function(){res([]);}; }
    catch(e){ res([]); } }); }
};

    const msgs = body.querySelector('#as-msgs'), inp = body.querySelector('#as-in');
    body.querySelector('#as-disc').onclick = ()=>{ Brain.clearKey(prov); OS.apps.assistant.render(body); };
    function bubble(txt, me){
      const d = document.createElement('div');
      d.style.cssText = 'max-width:85%;padding:10px 14px;border-radius:16px;font-size:14.5px;line-height:1.6;white-space:pre-wrap;'+

files: { title:'Files', icon:'folder', tint:'linear-gradient(135deg,#93c5fd,#3b82f6)', w:620, h:460,
  render(body){
    body.style.display='flex'; body.style.padding='0'; body.style.gap='0';
    const D = Store.data;
    let dirId = D.files.root;
    body.innerHTML =
      '<div style="flex:1;display:flex;flex-direction:column;min-width:0">'+
      '<div id="fi-crumb" style="flex:none;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.07)" class="small"></div>'+
      '<div style="flex:1;padding:12px;overflow-y:auto;touch-action:pan-y" id="fi-main"></div>'+

      '<button class="chipbtn" id="fi-upload">Upload</button><input type="file" id="fi-file" style="display:none" multiple></div></div>';
    const main = body.querySelector('#fi-main'), crumb = body.querySelector('#fi-crumb');
    function item(id){ return D.files.items[id]; }
    function kids(id){ const d=item(id); return (d.children||[]).map(item).filter(Boolean)
      .sort((a,b)=> (a.type===b.type) ? a.name.localeCompare(b.name) : (a.type==='dir'?-1:1)); }
    function pathTo(id){ const out=[]; let c=item(id); while(c){ out.unshift(c); c=c.parent?item(c.parent):null; } return out; }
    async function ensureSeed(f){ try{ if(f.seed && !(await Blobs.get(f.id))){ await Blobs.put(f.id,{kind:'text',text:f.seed,mime:f.mime}); } }catch(e){} }
    function draw(){
      const d = item(dirId);
      crumb.innerHTML = '';
      pathTo(dirId).forEach((c,i,arr)=>{
        const b = document.createElement('button');
        b.style.cssText='background:none;border:none;color:'+(i===arr.length-1?'#fff':'#93c5fd')+';font-size:13px;cursor:pointer;padding:2px 4px';

        crumb.appendChild(b);
        if(i<arr.length-1){ const s2=document.createElement('span'); s2.className='muted'; s2.textContent=' / '; crumb.appendChild(s2); }
      });
      main.innerHTML='';
      const ks = kids(dirId);
      if(!ks.length) main.innerHTML = '<div class="small muted" style="padding:20px;text-align:center">Empty folder.</div>';
      ks.forEach(f=>{
        const isDir = f.type==='dir';
        const c = isDir ? '#fcd34d' : '#93c5fd';
        const r = document.createElement('div');
        r.className='row'; r.style.cssText+=';padding:10px;border-radius:12px;cursor:pointer';
        r.innerHTML = '<div style="width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:'+c+'1c;border:1px solid '+c+'44;flex:none">'+
          ic(isDir?'folder':'doc','width:18px;height:18px;stroke:'+c+';fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round')+'</div>'+
          '<div style="flex:1;min-width:0"><div style="font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(f.name)+'</div>'+
          '<div class="tiny muted">'+(isDir?((f.children||[]).length+' items'):(f.size?fmtSize(f.size):''))+'</div></div>'+
          '<button data-fdel="'+f.id+'" style="background:none;border:none;color:var(--faint);font-size:16px;cursor:pointer;flex:none">×</button>';
        r.onclick = (e)=>{
          if(e.target.closest('[data-fdel]')) return;
          if(isDir){ dirId=f.id; draw(); } else openFile(f);
        };
        r.querySelector('[data-fdel]').onclick = async ()=>{
          if(!confirm('Delete "'+f.name+'"?')) return;
          async function rm(x){ if(x.type==='dir'){ for(const c of (x.children||[])){ const ci=item(c); if(ci) await rm(ci); } }
            else await Blobs.del(x.id); delete D.files.items[x.id]; }
          const par = item(f.parent);
          if(par) par.children = (par.children||[]).filter(c=>c!==f.id);
          await rm(f); Store.save(); draw(); toast('Deleted');
        };
        main.appendChild(r);
      });
    }
    function isText(f){ return (f.mime||'').indexOf('text/')===0 || /\.(txt|md|json|js|html|css|csv)$/i.test(f.name); }
    async function openFile(f){
      await ensureSeed(f);
      let v = null;
      try{ v = await Blobs.get(f.id); }catch(e){}
      if(isText(f)){
        const txt = v&&v.kind==='text' ? v.text : '';
        OS.openEditor(f.name, txt, async (nv)=>{ await Blobs.put(f.id,{kind:'text',text:nv,mime:f.mime||'text/plain'});
          f.size = nv.length; f.updated=Date.now(); Store.save(); draw(); });
      } else if((f.mime||'').indexOf('image/')===0){
        if(v && v.blob){ const url = URL.createObjectURL(v.blob); OS.openViewer(f.name, '<img src="'+url+'" style="max-width:100%;border-radius:12px">'); }
        else toast('No preview available');
      } else {
        if(v && v.blob){ const a=document.createElement('a'); a.href=URL.createObjectURL(v.blob); a.download=f.name; a.click(); }
        else toast('Nothing stored for this file yet');
      }
    }
    body.querySelector('#fi-mkdir').onclick = ()=>{
      const n = prompt('Folder name:'); if(!n||!n.trim()) return;
      const id = uid(), d = item(dirId);
      D.files.items[id] = {id:id,name:n.trim(),type:'dir',parent:dirId,children:[],updated:Date.now()};
      d.children.push(id); Store.save(); draw();
    };
    body.querySelector('#fi-newfile').onclick = ()=>{
      const n = prompt('File name:', 'Note.txt'); if(!n||!n.trim()) return;
      const id = uid(), d = item(dirId);
      D.files.items[id] = {id:id,name:n.trim(),type:'file',parent:dirId,mime:'text/plain',size:0,updated:Date.now()};
      d.children.push(id); Store.save(); draw();
      openFile(D.files.items[id]);
    };
    const fi = body.querySelector('#fi-file');
    body.querySelector('#fi-upload').onclick = ()=>fi.click();
    fi.onchange = async ()=>{
      const d = item(dirId);
      try{
        for(const file of fi.files){
          const id = uid();
          const txt = file.type.indexOf('text/')===0 || /\.(txt|md|json|js|html|css|csv)$/i.test(file.name);
          if(txt){ const t = await file.text(); await Blobs.put(id,{kind:'text',text:t,mime:file.type||'text/plain'}); }
          else await Blobs.put(id,{kind:'blob',blob:file,mime:file.type||'application/octet-stream'});
          D.files.items[id] = {id:id,name:file.name,type:'file',parent:dirId,mime:file.type||'',size:file.size,updated:Date.now()};
          d.children.push(id);
        }
        Store.save(); draw(); toast('Uploaded');
      }catch(e){ toast('Upload failed — storage unavailable'); }
      fi.value='';
    };
    draw();
  }},

habits: { title:'Habits', icon:'checkSq', tint:'linear-gradient(135deg,#5eead4,#14b8a6)', w:520, h:500,
  render(body){
    const D = Store.data;
    const dayNames = ['M','T','W','T','F','S','S'];
    function weekDays(){ // Monday-first dates of this week
      const now = new Date(), dow = (now.getDay()+6)%7, mon = new Date(now);
      mon.setDate(now.getDate()-dow);
      const out=[]; for(let i=0;i<7;i++){ const d=new Date(mon); d.setDate(mon.getDate()+i); out.push(d); } return out;
    }
    function streak(h){
      let s=0; const d=new Date();
      if(!h.log[todayStr(d)]) d.setDate(d.getDate()-1); // allow today pending
      while(h.log[todayStr(d)]){ s++; d.setDate(d.getDate()-1); }
      return s;
    }
    function draw(){
      const days = weekDays();
      let html = '<div class="row" style="justify-content:space-between;align-items:center;margin-top:0"><div class="sec-t" style="margin:0">This week — tap to toggle</div>'+
        '<button class="chipbtn" id="hb-add" style="padding:7px 14px">+ Habit</button></div><div id="hb"></div>';
      body.innerHTML = html;
      const hb = body.querySelector('#hb');
      if(!D.habits.length) hb.innerHTML = '<div class="card small muted">No habits yet. Add one above.</div>';
      D.habits.forEach(h=>{
        const st = streak(h);
        const card = document.createElement('div'); card.className='card'; card.style.marginBottom='10px';
        let cells='';
        days.forEach((d,i)=>{
          const k = todayStr(d), v = !!h.log[k], isToday = k===todayStr();
          cells += '<button data-h="'+h.id+'" data-k="'+k+'" title="'+k+'" style="flex:1;aspect-ratio:1;max-width:40px;border-radius:10px;border:1px solid '+(v?h.color+'99':'rgba(255,255,255,.12)')+';background:'+(v?h.color+'33':'rgba(255,255,255,.04)')+';color:'+(v?h.color:'var(--faint)')+';font-size:12px;cursor:pointer;'+(isToday?'box-shadow:0 0 0 1.5px '+h.color+'88;':'')+'">'+(v?'✓':dayNames[i])+'</button>';
        });
        card.innerHTML = '<div class="row" style="justify-content:space-between;margin-bottom:10px"><div style="font-weight:650;font-size:14.5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(h.name)+'</div>'+
          '<div class="small" style="color:'+h.color+';margin:0 8px;flex:none">'+(st?('🔥 '+st):'0')+'</div>'+
          '<button data-del="'+h.id+'" style="background:none;border:none;color:var(--faint);font-size:15px;cursor:pointer;flex:none">×</button></div>'+
          '<div style="display:flex;gap:6px">'+cells+'</div>';
        hb.appendChild(card);
      });
      hb.querySelectorAll('button[data-h]').forEach(b=>{
        b.onclick = ()=>{ const h=D.habits.find(x=>x.id===b.dataset.h); if(!h) return;
          if(h.log[b.dataset.k]) delete h.log[b.dataset.k]; else h.log[b.dataset.k]=1;
          Store.save(); draw(); };
      });
      hb.querySelectorAll('button[data-del]').forEach(b=>{
        b.onclick = ()=>{ const i=D.habits.findIndex(x=>x.id===b.dataset.del); if(i>=0){ D.habits.splice(i,1); Store.save(); draw(); toast('Habit deleted'); } };
      });
      body.querySelector('#hb-add').onclick = ()=>{
        const wrap = document.createElement('div'); wrap.className='card'; wrap.style.marginBottom='10px';
        wrap.innerHTML = '<div class="row" style="gap:8px"><input type="text" id="hb-name" placeholder="Habit name…" style="flex:1"><button class="pill-cta" id="hb-save">Add</button></div>';
        hb.prepend(wrap);
        const inp = wrap.querySelector('#hb-name'); inp.focus();
        const colors = ['#4ade80','#5eead4','#c4b5fd','#93c5fd','#fcd34d','#f9a8d4'];
        function save(){ const n=inp.value.trim(); if(!n) return;
          D.habits.push({id:uid(),name:n,color:colors[D.habits.length%colors.length],log:{}}); Store.save(); draw(); }
        wrap.querySelector('#hb-save').onclick = save;
        inp.addEventListener('keydown',e=>{ if(e.key==='Enter') save(); });
      };
    }
    draw();
  }},
calendar: { title:'Calendar', icon:'cal', tint:'linear-gradient(135deg,#f9a8d4,#ec4899)', w:520, h:500,
  render(body){
    const D = Store.data;
    if(!D.events) D.events = {};
    let view = new Date(); view.setDate(1);
    const MN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    function draw(){
      const y = view.getFullYear(), m = view.getMonth();
      const first = (new Date(y,m,1).getDay()+6)%7, dim = new Date(y,m+1,0).getDate();
      let html = '<div class="row" style="justify-content:space-between;align-items:center;margin-bottom:10px">'+
        '<button class="chipbtn" id="cal-prev">‹</button><div class="sec-t" style="margin:0">'+MN[m]+' '+y+'</div><button class="chipbtn" id="cal-next">›</button></div>';
      html += '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center" class="tiny muted"><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div><div>S</div>';
      for(let i=0;i<first;i++) html += '<div></div>';
      for(let d=1; d<=dim; d++){
        const k = y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
        const evs = D.events[k]||[], isToday = k===todayStr();
        html += '<button data-day="'+k+'" style="aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:13px;position:relative;cursor:pointer;background:'+(isToday?'rgba(249,168,212,.18)':'none')+';border:1px solid '+(isToday?'rgba(249,168,212,.5)':'transparent')+';color:#dfe6df">'+d+
          (evs.length?'<div style="position:absolute;bottom:4px;width:5px;height:5px;border-radius:99px;background:#f9a8d4"></div>':'')+'</button>';
      }
      html += '</div><div id="cal-day" style="margin-top:6px"></div>';
      body.innerHTML = html;
      body.querySelector('#cal-prev').onclick = ()=>{ view.setMonth(view.getMonth()-1); draw(); };
      body.querySelector('#cal-next').onclick = ()=>{ view.setMonth(view.getMonth()+1); draw(); };
      body.querySelectorAll('button[data-day]').forEach(b=>{ b.onclick = ()=>drawDay(b.dataset.day); });
      drawDay(todayStr());
    }
    function drawDay(k){
      const host = body.querySelector('#cal-day'); if(!host) return;
      const evs = (D.events[k]||[]).slice().sort((a,b)=>(a.time||'').localeCompare(b.time||''));
      let html = '<div class="sec-t">'+k+'</div>';
      if(!evs.length) html += '<div class="small muted" style="margin-bottom:8px">Nothing scheduled.</div>';
      evs.forEach(e=>{
        html += '<div class="card" style="margin-bottom:8px;padding:10px 14px"><div class="row"><div class="small" style="color:#f9a8d4;font-weight:700;flex:none;min-width:52px">'+esc(e.time||'--:--')+'</div>'+
          '<div style="font-size:14px;flex:1">'+esc(e.title)+'</div>'+
          '<button data-evid="'+e.id+'" style="background:none;border:none;color:var(--faint);font-size:15px;cursor:pointer">×</button></div></div>';
      });
      html += '<div class="row" style="gap:8px;margin-top:4px"><input type="time" id="cal-time" value="09:00" style="width:96px;flex:none">'+
        '<input type="text" id="cal-title" placeholder="Add event…" style="flex:1"><button class="pill-cta" id="cal-add">Add</button></div>';
      host.innerHTML = html;
      host.querySelectorAll('button[data-evid]').forEach(b=>{
        b.onclick = ()=>{ D.events[k] = (D.events[k]||[]).filter(e=>e.id!==b.dataset.evid);
          if(!D.events[k].length) delete D.events[k]; Store.save(); draw(); };
      });
      const ti = host.querySelector('#cal-title'), tm = host.querySelector('#cal-time');
      function add(){ const t=ti.value.trim(); if(!t) return;
        (D.events[k] = D.events[k]||[]).push({id:uid(),title:t,time:tm.value}); Store.save(); draw(); }
      host.querySelector('#cal-add').onclick = add;
      ti.addEventListener('keydown',e=>{ if(e.key==='Enter') add(); });
    }
    draw();
  }},
settings: { title:'Settings', icon:'gear', tint:'linear-gradient(135deg,#94a3b8,#64748b)', w:520, h:520,
  render(body){
    const hues = [['Green','#4ade80'],['Teal','#5eead4'],['Violet','#c4b5fd'],['Blue','#93c5fd'],['Amber','#fcd34d']];
    const prov = Brain.activeProvider();
    const brainLine = prov
      ? '<b style="color:#5eead4">'+BRAIN_PROVIDERS[prov].name+'</b> · '+BRAIN_PROVIDERS[prov].chatModel+' — live'
      : 'Not connected — open Assistant to add a key';
    body.innerHTML =
      '<div class="sec-t">Intelligence</div>'+
      '<div class="card"><div class="small" id="st-brain" style="line-height:1.6">'+brainLine+'</div>'+
      '<div class="row" style="margin-top:10px;gap:8px">'+
      (prov ? '<button class="chipbtn" id="st-disc">Disconnect key</button>'
            : '<button class="chipbtn" id="st-conn">Connect a key</button>')+'</div>'+
      '<div class="tiny muted" style="margin-top:8px">Keys stay in this browser and go straight to the provider.</div></div>'+
      '<div class="sec-t">Accent color</div><div class="row" id="st-acc" style="gap:10px"></div>'+
      '<div class="sec-t">Your data</div><div class="card"><div class="small" id="st-meter" style="line-height:1.6">Measuring…</div>'+
      '<div class="row" style="margin-top:10px;gap:8px;flex-wrap:wrap">'+
      '<button class="chipbtn" id="st-export">Export backup</button>'+
      '<button class="chipbtn" id="st-import">Import</button>'+
      '<input type="file" id="st-file" accept=".json" style="display:none">'+
      '<button class="chipbtn" id="st-wipe" style="color:#f2b8b8">Erase everything</button></div>'+
      '<div class="tiny muted" style="margin-top:8px">Your stuff lives only in this browser. Export a backup before you clear site data.</div></div>'+
      '<div class="sec-t">About</div><div class="card small muted">Moor · v1.0<br>Brain: bring-your-own-key, direct to provider.<br>Sync with your PC is coming.</div>';
    const bd = body.querySelector('#st-disc'), bc = body.querySelector('#st-conn');
    if(bd) bd.onclick = ()=>{ Brain.clearKey(prov); OS.apps.settings.render(body); toast('Key removed from this browser'); };
    if(bc) bc.onclick = ()=>OS.open('assistant');
    const acc = body.querySelector('#st-acc');
    hues.forEach(([n,c])=>{
      const b = document.createElement('button');
      b.title=n; b.style.cssText='width:40px;height:40px;border-radius:99px;border:2px solid rgba(255,255,255,.2);background:'+c+';cursor:pointer';
      b.onclick = ()=>{ document.documentElement.style.setProperty('--acc', c);
        Store.data.settings.accent = c; Store.save(); toast('Accent: '+n); };
      acc.appendChild(b);
    });
    // storage meter
    (async ()=>{
      let bytes = 0;
      try{ bytes = (localStorage.getItem(DB_KEY)||'').length; }catch(e){}
      let nBlobs = 0, blobBytes = 0;
      try{
        const keys = await Blobs.all(); nBlobs = keys.length;
        for(const k of keys){ const v = await Blobs.get(k);
          if(v){ blobBytes += v.kind==='text' ? (v.text||'').length : (v.blob ? v.blob.size : 0); } }
      }catch(e){}
      const m = body.querySelector('#st-meter');
      if(m) m.innerHTML = 'Using <b>'+fmtSize(bytes+blobBytes)+'</b> on this device — '+
        Store.data.notes.length+' notes · '+Store.data.habits.length+' habits · '+
        Store.data.apps.length+' apps · '+Object.keys(Store.data.files.items).length+' files.';
    })();
    body.querySelector('#st-export').onclick = async ()=>{
      const keys = await Blobs.all().catch(()=>[]);
      const blobs = {};
      for(const k of keys){ const v = await Blobs.get(k).catch(()=>null);
        if(v && v.kind==='text') blobs[k]=v; /* binary blobs skip in JSON backup */ }
      const payload = { moor:1, exported:new Date().toISOString(), db:Store.data, blobs:blobs };
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(payload)],{type:'application/json'}));
      a.download = 'moor-backup-'+todayStr()+'.json'; a.click();
      toast('Backup downloaded');
    };
    const sfi = body.querySelector('#st-file');
    body.querySelector('#st-import').onclick = ()=>sfi.click();
    sfi.onchange = async ()=>{
      const f = sfi.files[0]; if(!f) return;
      try{
        const p = JSON.parse(await f.text());
        if(!p.db || !p.db.files) throw new Error('bad backup');
        if(!confirm('Replace everything with this backup?')) return;
        Store.data = p.db; Store.save();
        if(p.blobs) for(const k of Object.keys(p.blobs)) await Blobs.put(k, p.blobs[k]).catch(()=>{});
        toast('Backup restored — restarting'); setTimeout(()=>location.reload(), 800);
      }catch(e){ toast('That file is not a Moor backup'); }
      sfi.value='';
    };
    body.querySelector('#st-wipe').onclick = ()=>{
      if(!confirm('Erase ALL Moor data on this device? This cannot be undone.')) return;
      if(!confirm('Really erase everything? Export a backup first if you want to keep it.')) return;
      try{ localStorage.removeItem(DB_KEY); }catch(e){}
      try{ indexedDB.deleteDatabase('moor-blobs'); }catch(e){}
      location.reload();
    };
  }}
};

function drawAppsGrid(body){
  const D = Store.data;
  const items = [
    ['Assistant','chat','#4ade80','assistant'],['Notes','note','#fcd34d','notes'],
    ['Habits','checkSq','#5eead4','habits'],['Files','folder','#93c5fd','files'],
    ['Calendar','cal','#f9a8d4','calendar'],['Templates','layers','#c4b5fd','templates'],
    ['Settings','gear','#94a3b8','settings']
  ];
  let html = '<div class="sec-t" style="margin-top:0">All apps</div><div id="ap-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:14px;margin-bottom:6px"></div>';
  html += '<div class="sec-t">Made by you</div><div id="ap-made"></div>';
  body.innerHTML = html;
  const g = body.querySelector('#ap-grid');
  items.forEach(function(it){
    const n=it[0], icn=it[1], c=it[2], app=it[3];
    const d = document.createElement('button');
    d.style.cssText='background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;color:#dfe6df;font-size:12px';
    d.innerHTML = '<div style="width:58px;height:58px;border-radius:17px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,'+c+'44,'+c+'14);border:1px solid '+c+'55;box-shadow:0 8px 22px rgba(0,0,0,.35)">'+ic(icn,'width:26px;height:26px;stroke:'+c+';fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round')+'</div>'+esc(n);
    d.onclick = ()=>OS.open(app);
    g.appendChild(d);
  });
  const made = body.querySelector('#ap-made');
  if(!D.apps.length){ made.innerHTML = '<div class="small muted">Nothing yet. Ask the Assistant to <b>make you an app</b> &mdash; it will appear here.</div>'; return; }
  D.apps.slice().reverse().forEach(a=>{
    const r = document.createElement('div'); r.className='card'; r.style.marginBottom='8px';
    r.innerHTML = '<div class="row"><div style="width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:'+(a.color||'#4ade80')+'22;border:1px solid '+(a.color||'#4ade80')+'55;flex:none">'+ic('spark','width:19px;height:19px;stroke:'+(a.color||'#4ade80')+';fill:none;stroke-width:1.7')+'</div>'+
      '<div style="flex:1;min-width:0"><div style="font-weight:650;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(a.name)+'</div><div class="tiny muted">Built '+new Date(a.created).toLocaleDateString()+'</div></div>'+
      '<button class="chipbtn" data-open="'+a.id+'" style="padding:7px 12px">Open</button>'+
      '<button class="chipbtn" data-tpl="'+a.id+'" title="Save as template" style="padding:7px 10px">⧉</button>'+
      '<button data-adel="'+a.id+'" style="background:none;border:none;color:var(--faint);font-size:16px;cursor:pointer">×</button></div>';
    made.appendChild(r);
  });
  made.querySelectorAll('[data-open]').forEach(b=>{ b.onclick = ()=>{ const a=D.apps.find(x=>x.id===b.dataset.open); if(a) OS.openHTML(a); }; });
  made.querySelectorAll('[data-tpl]').forEach(b=>{ b.onclick = ()=>{
    const a=D.apps.find(x=>x.id===b.dataset.tpl); if(!a) return;
    D.templates.push({id:uid(),name:a.name,code:a.code,color:a.color,created:Date.now()});
    Store.save(); toast('Saved as template'); }; });
  made.querySelectorAll('[data-adel]').forEach(b=>{ b.onclick = ()=>{
    if(!confirm('Delete this app?')) return;
    D.apps = D.apps.filter(x=>x.id!==b.dataset.adel); Store.save(); drawAppsGrid(body); toast('Deleted'); }; });
}
/* Save a model-generated HTML app into the OS */
function saveGeneratedApp(code, msgs){
  const D = Store.data;
  const colors = ['#4ade80','#5eead4','#c4b5fd','#93c5fd','#fcd34d','#f9a8d4'];
  const wrap = document.createElement('div');
  wrap.style.cssText='align-self:flex-start;display:flex;gap:8px;margin:2px 0 6px;flex-wrap:wrap;align-items:center';
  wrap.innerHTML = '<input type="text" id="sg-name" placeholder="Name this app&hellip;" style="width:170px;padding:9px 12px">'+
    '<button class="pill-cta" id="sg-save" style="padding:9px 16px">Save app</button>';
  msgs.appendChild(wrap); msgs.scrollTop = msgs.scrollHeight;
  const inp = wrap.querySelector('#sg-name'); inp.focus();
  wrap.querySelector('#sg-save').onclick = ()=>{
    const name = inp.value.trim()||'Untitled app';
    const app = { id:uid(), name:name, code:code, color:colors[D.apps.length%colors.length], created:Date.now() };
    D.apps.push(app); Store.save();
    wrap.innerHTML = '<button class="pill-cta" id="sg-open">Open '+esc(name)+' &rarr;</button>';
    wrap.querySelector('#sg-open').onclick = ()=>OS.openHTML(app);
    toast('Saved to your Apps');
  };
}
/* ================= INIT ================= */
(function(){
  Store.load();
  Blobs.open().catch(()=>{});
  try{
    const a = Store.data.settings && Store.data.settings.accent;
    if(a) document.documentElement.style.setProperty('--acc', a);
  }catch(e){}
  let onboarded = false;
  try{ onboarded = localStorage.getItem('moor.preview.onboarded') === '1'; }catch(e){}
  if(onboarded){ OS.boot(); } else { OB.show('welcome'); }
})();
