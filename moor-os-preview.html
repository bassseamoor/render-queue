<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070a">
<title>Moor — OS Preview</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#f2f5f1; --dim:#a9b8ac; --faint:#6f7d72;
  --acc:#4ade80; --teal:#5eead4; --vio:#c4b5fd; --blue:#93c5fd; --amber:#fcd34d; --pink:#f9a8d4;
  --glass:rgba(255,255,255,.055); --line:rgba(255,255,255,.10);
}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink);overflow:hidden;user-select:none;-webkit-user-select:none;
  background:
    radial-gradient(900px 520px at 16% 10%, rgba(45,212,191,.13), transparent 60%),
    radial-gradient(1000px 620px at 84% 16%, rgba(139,92,246,.15), transparent 62%),
    radial-gradient(1000px 700px at 50% 100%, rgba(59,130,246,.12), transparent 60%),
    #05070a;}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(74,222,128,.28);border-radius:99px}
::-webkit-scrollbar-track{background:transparent}
button{font-family:inherit}

/* ============ ONBOARDING ============ */
.ob-veil{position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(900px 520px at 16% 10%, rgba(45,212,191,.15), transparent 60%),
    radial-gradient(1000px 620px at 84% 16%, rgba(139,92,246,.17), transparent 62%),
    radial-gradient(1000px 700px at 50% 100%, rgba(59,130,246,.13), transparent 60%),
    radial-gradient(760px 520px at 50% 42%, rgba(110,190,125,.07), transparent 60%),
    #05070a;
  animation:ob-in .35s ease;padding:16px}
@keyframes ob-in{from{opacity:0}to{opacity:1}}
.ob-veil.bye{opacity:0;transition:opacity .3s ease;pointer-events:none}
.ob-card{position:relative;width:640px;max-width:94vw;max-height:92vh;max-height:92dvh;overflow-y:auto;text-align:center;
  background:linear-gradient(165deg, rgba(255,255,255,.075), rgba(255,255,255,.02) 45%, rgba(139,92,246,.055));
  border:1px solid rgba(255,255,255,.13);border-radius:26px;padding:48px 40px;
  box-shadow:0 40px 120px rgba(0,0,0,.65), 0 0 90px rgba(45,212,191,.07), 0 0 140px rgba(139,92,246,.08);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
.ob-card h1{font-size:44px;margin:0 0 12px;letter-spacing:-.025em;font-weight:700}
.ob-grad{background:linear-gradient(92deg,#fff 15%,#a7f3d0 55%,#5eead4 85%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.ob-card h2{font-size:28px;margin:0 0 10px;font-weight:700;letter-spacing:-.02em}
.ob-sub{color:#b6c2ba;font-size:15px;line-height:1.65;margin:0 0 28px}
.ob-fine{font-size:12.5px;color:var(--faint);margin:24px 0 0;letter-spacing:.02em}
.ob-cta-row{display:flex;flex-direction:column;align-items:center;gap:14px}
.ob-pill{border:none;cursor:pointer;font-weight:700;font-size:17px;color:#06110a;
  background:linear-gradient(180deg,#b8f5d0,#4ade80 55%,#22c55e);border-radius:999px;padding:15px 60px;
  box-shadow:0 0 38px rgba(74,222,128,.45), 0 10px 26px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.5)}
.ob-pill:active{transform:scale(.97)}
.ob-ghost{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10);color:#c9d4cb;
  border-radius:999px;padding:12px 32px;font-size:14.5px;cursor:pointer}
.ob-cards{display:flex;gap:14px;margin:0 0 8px;text-align:left}
.ob-choice{flex:1;background:linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.015));
  border:1px solid rgba(255,255,255,.10);border-radius:20px;padding:26px 22px;cursor:pointer;color:var(--ink);
  box-shadow:0 18px 44px rgba(0,0,0,.35);text-align:left}
.ob-choice:active{transform:scale(.98)}
.ob-choice .tile{width:60px;height:60px;border-radius:18px;display:flex;align-items:center;justify-content:center;
  border:1px solid;margin-bottom:28px;box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 8px 22px rgba(0,0,0,.35)}
.ob-choice .tile svg{width:27px;height:27px;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ob-choice .t{font-size:20px;font-weight:700;margin-bottom:8px;letter-spacing:-.01em}
.ob-choice .d{font-size:13px;color:#a9b8ac;line-height:1.6}
.ob-choice.acc-a .tile{background:linear-gradient(135deg,rgba(45,212,191,.30),rgba(45,212,191,.08));border-color:rgba(45,212,191,.38)}
.ob-choice.acc-a .tile svg{stroke:#5eead4}
.ob-choice.acc-b .tile{background:linear-gradient(135deg,rgba(139,92,246,.32),rgba(59,130,246,.10));border-color:rgba(139,92,246,.42)}
.ob-choice.acc-b .tile svg{stroke:#c4b5fd}
.ob-back{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10);color:#c9d4cb;
  border-radius:999px;padding:13px 38px;font-size:14.5px;cursor:pointer;display:inline-block;margin-top:14px}
.ob-status{font-size:15px;color:#b6c2ba;line-height:1.75;margin:0 0 22px}
.ob-status b{color:#fff}
.ob-row{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap;align-items:center}
.ob-btn{border-radius:999px;padding:13px 32px;font-size:15px;border:none;cursor:pointer;font-weight:600;color:#06110a;
  background:linear-gradient(180deg,#b8f5d0,#4ade80 55%,#22c55e);box-shadow:0 0 26px rgba(74,222,128,.35)}
.ob-btn.ghost{background:rgba(255,255,255,.08);color:#dfe6df;box-shadow:none;border:1px solid rgba(255,255,255,.12);font-weight:500}
.ob-bar{height:10px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin:18px 0 6px}
.ob-bar i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,#5eead4,#4ade80);box-shadow:0 0 18px rgba(74,222,128,.6);transition:width .25s}
.ob-prov{display:flex;gap:14px;align-items:flex-start;text-align:left;
  background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.015));
  border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:15px 16px;margin-bottom:10px;cursor:pointer}
.ob-prov .tile{width:44px;height:44px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center;
  border:1px solid;font-size:19px;font-weight:700}
.ob-prov .pt{flex:1;min-width:0}
.ob-prov .n{font-size:15px;font-weight:650}
.ob-prov .s{font-size:12.5px;color:#a9b8ac;margin-top:4px}
.ob-keyform{display:none;margin-top:12px;gap:8px}
.ob-keyform.open{display:flex}
.ob-keyform input{flex:1;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12);
  border-radius:12px;color:var(--ink);padding:11px 14px;font-size:16px;min-width:0}
.ob-verdict{font-size:13px;margin-top:10px;min-height:20px}
.ob-verdict.ok{color:#5eead4}.ob-verdict.no{color:#f2b8b8}
@media (max-width:580px){.ob-cards{flex-direction:column}.ob-card{padding:36px 24px}.ob-card h1{font-size:34px}}

/* ============ OS SHELL ============ */
#os{position:fixed;inset:0;display:none}
#os.on{display:block}
#topbar{position:absolute;top:0;left:0;right:0;height:46px;display:flex;align-items:center;gap:10px;
  padding:0 14px;z-index:50;background:rgba(5,7,10,.45);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(255,255,255,.07)}
#topbar .logo{font-weight:800;font-size:16px;letter-spacing:-.01em}
#topbar .logo span{background:linear-gradient(92deg,#fff,#5eead4);-webkit-background-clip:text;background-clip:text;color:transparent}
#preview-tag{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:#0a0f0c;background:linear-gradient(180deg,#fcd34d,#f59e0b);
  border-radius:99px;padding:3px 10px}
#clock{margin-left:auto;font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
#replay-ob{font-size:12px;color:var(--faint);background:none;border:1px solid rgba(255,255,255,.1);
  border-radius:99px;padding:5px 12px;color:var(--dim)}
#rail{position:absolute;left:10px;top:58px;bottom:64px;width:60px;z-index:60;display:flex;flex-direction:column;
  align-items:center;gap:6px;padding:10px 0;border-radius:20px;
  background:rgba(10,14,12,.5);border:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 18px 50px rgba(0,0,0,.5)}
.rail-btn{width:44px;height:44px;border-radius:14px;border:1px solid transparent;background:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:#c6d2c7}
.rail-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rail-btn.active{background:rgba(94,234,212,.14);border-color:rgba(94,234,212,.35);color:#5eead4}
.rail-btn:active{transform:scale(.92)}
#desk{position:absolute;inset:46px 0 0 0;overflow:hidden}
#taskbar{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;z-index:200;display:flex;gap:8px;
  padding:8px 12px;border-radius:18px;background:rgba(10,14,12,.55);border:1px solid rgba(255,255,255,.09);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);max-width:94vw;overflow-x:auto}
.tb-chip{display:flex;align-items:center;gap:8px;border-radius:12px;padding:8px 14px 8px 10px;font-size:13px;
  background:rgba(255,255,255,.06);border:1px solid transparent;color:#dfe6df;white-space:nowrap;cursor:pointer}
.tb-chip svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tb-chip.active{border-color:rgba(94,234,212,.4);background:rgba(94,234,212,.1)}
.tb-empty{font-size:12px;color:var(--faint);padding:8px 6px}

/* ============ WINDOWS ============ */
.win{position:absolute;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(170deg, rgba(24,30,26,.92), rgba(12,16,13,.94));
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 30px 80px rgba(0,0,0,.6), 0 0 60px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.08);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  min-width:280px;min-height:200px;touch-action:none}
.win.maxed{border-radius:12px}
.w-titlebar{height:44px;flex:none;display:flex;align-items:center;gap:10px;padding:0 8px 0 14px;
  cursor:grab;border-bottom:1px solid rgba(255,255,255,.07);touch-action:none}
.w-titlebar:active{cursor:grabbing}
.w-icon{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none}
.w-icon svg{width:15px;height:15px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.w-title{font-size:14px;font-weight:650;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-ctl{display:flex;gap:2px}
.w-ctl button{width:32px;height:32px;border-radius:9px;border:none;background:none;color:#9fb0a2;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.w-ctl button svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.w-ctl button:active{background:rgba(255,255,255,.12)}
.w-ctl .close:active{background:rgba(248,113,113,.35);color:#fff}
.w-body{flex:1;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;position:relative}
.w-body.pad{padding:16px}

/* ============ SHARED BITS ============ */
.card{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:14px}
.row{display:flex;align-items:center;gap:12px}
.muted{color:var(--dim)}.small{font-size:12.5px}.tiny{font-size:11px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chipbtn{background:rgba(255,255,255,.07);border:1px solid var(--line);color:#dfe6df;border-radius:99px;
  padding:9px 16px;font-size:13.5px;cursor:pointer}
.chipbtn:active{transform:scale(.96)}
.pill-cta{border:none;cursor:pointer;font-weight:700;color:#06110a;border-radius:999px;padding:12px 28px;font-size:14.5px;
  background:linear-gradient(180deg,#b8f5d0,#4ade80 55%,#22c55e);box-shadow:0 0 22px rgba(74,222,128,.35)}
.pill-cta:active{transform:scale(.96)}
input[type=text],input[type=password],textarea{background:rgba(0,0,0,.35);border:1px solid var(--line);
  border-radius:12px;color:var(--ink);padding:11px 14px;font-size:16px;font-family:inherit;width:100%}
input:focus,textarea:focus{outline:none;border-color:rgba(94,234,212,.5)}
.sec-t{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--faint);margin:18px 0 10px}
.sec-t:first-child{margin-top:0}
</style>
</head>
<body>
<div id="ob-root"></div>

<div id="os">
  <div id="topbar">
    <div class="logo">Moor <span>OS</span></div>
    <div id="preview-tag">PREVIEW</div>
    <button id="replay-ob">↺ Onboarding</button>
    <div id="clock"></div>
  </div>
  <div id="rail"></div>
  <div id="desk"></div>
  <div id="taskbar"></div>
</div>

<script>
"use strict";
/* ================= ICONS ================= */
const P = {
  chat:'<path d="M21 12a8 8 0 0 1-8 8H4l2-3a8 8 0 1 1 15-5z"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01"/>',
  grid:'<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',
  folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  layers:'<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>',
  note:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/>',
  check:'<path d="M4 12l5 5L20 6"/>',
  checkSq:'<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 12.5l2.5 2.5 5-6"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  gear:'<circle cx="12" cy="12" r="3.2"/><path d="M19 12a7 7 0 0 0-.14-1.4l2-1.55-2-3.46-2.35.95A7 7 0 0 0 14.1 5.1L13.75 2.6h-3.5L9.9 5.1a7 7 0 0 0-2.42 1.42l-2.35-.95-2 3.46 2 1.55a7 7 0 0 0 0 2.8l-2 1.55 2 3.46 2.35-.95a7 7 0 0 0 2.41 1.42l.36 2.54h3.5l.35-2.54a7 7 0 0 0 2.42-1.42l2.35.95 2-3.46-2-1.55c.09-.46.14-.93.14-1.4z"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  minus:'<path d="M5 12h14"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  max:'<rect x="5" y="5" width="14" height="14" rx="2"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  spark:'<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 16l.9 2.1L22 19l-2.1.9L19 22l-.9-2.1L16 19l2.1-.9z"/>',
  dl:'<path d="M12 4v11"/><path d="M7 11l5 5 5-5"/><path d="M4 20h16"/>',
  key:'<circle cx="8" cy="14" r="4"/><path d="M11 11l8-8M16 4l3 3M13 7l3 3"/>',
  cpu:'<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/>',
  clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2"/>',
  star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.8-5.4 2.8 1-6.1L3.2 9.5l6.1-.9z"/>',
  chevR:'<path d="M9 6l6 6-6 6"/>',
  play:'<path d="M7 4l13 8-13 8z"/>',
  img:'<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 3 3 4-4 4 4"/>',
  music:'<circle cx="7" cy="17" r="2.6"/><circle cx="17" cy="15" r="2.6"/><path d="M9.6 17V6l10-2.5V15"/>',
  game:'<rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 11v4M5 13h4"/><circle cx="16" cy="11.5" r=".8"/><circle cx="18.2" cy="14" r=".8"/>',
  doc:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/>',
  book:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19a2 2 0 0 1 2-2h13"/>',
  flame:'<path d="M12 3s5 4.5 5 9a5 5 0 0 1-10 0c0-2 1-3.5 1-3.5s.5 1.5 2 1.5c-1-3 2-7 2-7z"/>',
  drop:'<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',
  moon:'<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/>'
};
function ic(n, s){ return '<svg '+(s?'style="'+s+'"':'')+' viewBox="0 0 24 24">'+P[n]+'</svg>'; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* ================= ONBOARDING (mockup) ================= */
const OB = {
  root: document.getElementById('ob-root'),
  show(screen){
    const R = this.root;
    const back = '<button class="ob-back" data-ob="back">← Back</button>';
    if(screen === 'welcome'){
      R.innerHTML = '<div class="ob-veil"><div class="ob-card">'+
        '<h1>Meet <span class="ob-grad">Moor</span></h1>'+
        '<p class="ob-sub">Your computer, finally working the way you think.<br>Ask for anything. Moor figures out the rest.</p>'+
        '<div class="ob-cta-row"><button class="ob-pill" data-ob="start">Get started</button>'+
        '<button class="ob-ghost" data-ob="skip">Skip for now →</button></div>'+
        '<p class="ob-fine">Free forever · Private by design · Yours</p></div></div>';
    }
    if(screen === 'choose'){
      R.innerHTML = '<div class="ob-veil"><div class="ob-card">'+
        '<h2>How do you want smarts?</h2>'+
        '<p class="ob-sub">Choose how smart features will run on your device. You can change this any time in Settings.</p>'+
        '<div class="ob-cards">'+
        '<button class="ob-choice acc-a" data-ob="local"><div class="tile">'+ic('dl')+'</div><div class="t">This computer</div>'+
        '<div class="d">Free forever. Private. Downloads a model to your machine.</div></button>'+
        '<button class="ob-choice acc-b" data-ob="key"><div class="tile">'+ic('key')+'</div><div class="t">I have a key</div>'+
        '<div class="d">Groq, Cerebras, OpenAI and more. Paste one key and you&rsquo;re in.</div></button>'+
        '</div>'+back+'</div></div>';
    }
    if(screen === 'local'){
      R.innerHTML = '<div class="ob-veil"><div class="ob-card">'+
        '<h2>This computer</h2>'+
        '<p class="ob-status" id="ob-local-status"><b>Looking</b> for a model on your machine…</p>'+
        '<div class="ob-bar" id="ob-dlbar" style="display:none"><i></i></div>'+
        '<p class="ob-status small" id="ob-dltext"></p>'+
        '<div class="ob-row" id="ob-local-row"></div>'+back+'</div></div>';
      const st = R.querySelector('#ob-local-status'), row = R.querySelector('#ob-local-row');
      const bar = R.querySelector('#ob-dlbar'), fill = bar.querySelector('i'), dt = R.querySelector('#ob-dltext');
      setTimeout(()=>{
        st.innerHTML = 'No model found yet. Let&rsquo;s grab you a starter — <b>qwen3:4b</b>, small and quick, about 2.5 GB.';
        const b = document.createElement('button'); b.className='ob-btn'; b.textContent='Download qwen3:4b';
        b.onclick = ()=>{
          row.innerHTML=''; bar.style.display='block'; dt.textContent='Downloading… 0%';
          let p = 0;
          const t = setInterval(()=>{
            p = Math.min(100, p + 2 + Math.random()*5);
            fill.style.width = p+'%'; dt.textContent = 'Downloading… '+Math.floor(p)+'%';
            if(p >= 100){ clearInterval(t);
              st.innerHTML = '<b>qwen3:4b</b> is ready. Your machine can think now.';
              dt.textContent='';
              const e = document.createElement('button'); e.className='ob-btn'; e.textContent='Enter Moor →';
              e.onclick = ()=>OB.finish(); row.appendChild(e);
            }
          }, 160);
        };
        row.appendChild(b);
      }, 1200);
    }
    if(screen === 'key'){

/* ================= OS: WINDOW MANAGER ================= */
const OS = {
  z: 100, wins: {}, order: [],
  boot(){
    const os = document.getElementById('os');
    os.classList.add('on');
    this.buildRail(); this.tickClock(); setInterval(()=>this.tickClock(), 10000);
    document.getElementById('replay-ob').onclick = ()=>{
      try{ localStorage.removeItem('moor.preview.onboarded'); }catch(e){}
      os.classList.remove('on');
      Object.keys(this.wins).forEach(id=>this.close(id, true));
      OB._hist = []; OB.show('welcome');
    };
    // welcome mat: open Assistant after a beat
    setTimeout(()=>this.open('assistant'), 600);
  },
  tickClock(){
    const d = new Date();
    let h = d.getHours(), m = String(d.getMinutes()).padStart(2,'0'), ap = h>=12?'PM':'AM';
    h = h%12 || 12;
    document.getElementById('clock').textContent = h+':'+m+' '+ap;
  },
  apps: {},
  buildRail(){
    const rail = document.getElementById('rail');
    rail.innerHTML = '';
    Object.keys(this.apps).forEach(id=>{
      const a = this.apps[id];
      const b = document.createElement('button');
      b.className = 'rail-btn'; b.title = a.title; b.innerHTML = ic(a.icon);
      b.onclick = ()=>this.open(id);
      b.dataset.app = id;
      rail.appendChild(b);
    });
  },
  open(id){
    if(this.wins[id]){ this.focus(id); if(this.wins[id].min){ this.unmin(id); } return; }
    const a = this.apps[id];
    const desk = document.getElementById('desk');
    const el = document.createElement('div');
    el.className = 'win';
    const narrow = desk.clientWidth < 640;
    const W = Math.min(a.w || 560, desk.clientWidth - 16);
    const H = Math.min(a.h || 480, desk.clientHeight - 16);
    if(narrow){ el.classList.add('maxed'); el.style.cssText = 'left:78px;top:8px;right:8px;bottom:70px'; }
    else {
      const n = this.order.length;
      const x = 90 + (n*36)%220, y = 40 + (n*30)%160;
      el.style.cssText = 'left:'+x+'px;top:'+y+'px;width:'+W+'px;height:'+H+'px';
    }
    el.innerHTML =
      '<div class="w-titlebar"><div class="w-icon" style="background:'+a.tint+'">'+ic(a.icon)+'</div>'+
      '<div class="w-title">'+esc(a.title)+'</div>'+
      '<div class="w-ctl"><button data-c="min" title="Minimize">'+ic('minus')+'</button>'+
      (narrow?'':'<button data-c="max" title="Maximize">'+ic('max')+'</button>')+
      '<button data-c="close" class="close" title="Close">'+ic('x')+'</button></div></div>'+
      '<div class="w-body'+(a.pad===false?'':' pad')+'"></div>';
    desk.appendChild(el);
    const body = el.querySelector('.w-body');
    a.render(body, el);
    const win = { id, el, min:false, maxed:narrow };
    this.wins[id] = win; this.order.push(id);
    el.querySelectorAll('.w-ctl button').forEach(b=>{
      b.onclick = (e)=>{ e.stopPropagation(); const c=b.dataset.c;
        if(c==='close') this.close(id);
        if(c==='min') this.min(id);
        if(c==='max') this.toggleMax(id);
      };
    });
    el.addEventListener('pointerdown', ()=>this.focus(id), true);
    this.makeDraggable(el, el.querySelector('.w-titlebar'), win);
    this.focus(id); this.renderTaskbar();
    document.querySelectorAll('.rail-btn').forEach(b=>b.classList.toggle('active', b.dataset.app===id));
  },
  focus(id){
    const w = this.wins[id]; if(!w) return;
    this.z++;
    w.el.style.zIndex = this.z;
    document.querySelectorAll('.rail-btn').forEach(b=>b.classList.toggle('active', b.dataset.app===id));
    this.renderTaskbar();
  },
  close(id, silent){
    const w = this.wins[id]; if(!w) return;
    w.el.remove(); delete this.wins[id];
    this.order = this.order.filter(x=>x!==id);
    if(!silent) this.renderTaskbar();
    const rb = document.querySelector('.rail-btn[data-app="'+id+'"]');
    if(rb) rb.classList.remove('active');
  },
  min(id){
    const w = this.wins[id]; if(!w) return;
    w.min = true; w.el.style.display = 'none'; this.renderTaskbar();
  },
  unmin(id){
    const w = this.wins[id]; if(!w) return;
    w.min = false; w.el.style.display = 'flex'; this.focus(id);
  },
  toggleMax(id){
    const w = this.wins[id]; if(!w) return;
    const desk = document.getElementById('desk');
    if(w.maxed){ w.maxed=false; w.el.classList.remove('maxed');
      w.el.style.left='90px'; w.el.style.top='40px'; w.el.style.right=''; w.el.style.bottom='';
      w.el.style.width='560px'; w.el.style.height='480px';
    } else { w.maxed=true; w.el.classList.add('maxed');
      w.el.style.left='8px'; w.el.style.top='8px'; w.el.style.right='8px'; w.el.style.bottom='8px';
      w.el.style.width=''; w.el.style.height='';
    }
    this.focus(id);
  },
  makeDraggable(el, handle, win){
    let sx, sy, ox, oy, dragging=false;
    handle.addEventListener('pointerdown', e=>{
      if(e.target.closest('.w-ctl') || win.maxed) return;
      dragging = true; sx=e.clientX; sy=e.clientY;
      const r = el.getBoundingClientRect(), d = document.getElementById('desk').getBoundingClientRect();
      ox = r.left - d.left; oy = r.top - d.top;
      try{ handle.setPointerCapture(e.pointerId); }catch(_){}
    });
    handle.addEventListener('pointermove', e=>{
      if(!dragging) return;
      const d = document.getElementById('desk').getBoundingClientRect();
      let nx = ox + e.clientX - sx, ny = oy + e.clientY - sy;
      nx = Math.max(-el.offsetWidth+80, Math.min(d.width-80, nx));
      ny = Math.max(0, Math.min(d.height-60, ny));
      el.style.left = nx+'px'; el.style.top = ny+'px';
      el.style.right=''; el.style.bottom='';
    });
    const stop = ()=>{ dragging=false; };
    handle.addEventListener('pointerup', stop);
    handle.addEventListener('pointercancel', stop);
  },
  renderTaskbar(){
    const tb = document.getElementById('taskbar');
    const ids = this.order;
    if(!ids.length){ tb.innerHTML = '<div class="tb-empty">Tap an icon to open an app</div>'; return; }
    tb.innerHTML = '';
    ids.forEach(id=>{
      const a = this.apps[id], w = this.wins[id];
      const c = document.createElement('button');
      c.className = 'tb-chip'+(w.min?'':' active');
      c.innerHTML = ic(a.icon)+'<span>'+esc(a.title)+'</span>';
      c.onclick = ()=>{ w.min ? this.unmin(id) : (w.el.style.zIndex==this.z ? this.min(id) : this.focus(id)); };
      tb.appendChild(c);
    });
  }
};

function toast(msg){
  let t = document.getElementById('toast');
  if(!t){ t = document.createElement('div'); t.id='toast'; document.body.appendChild(t);
    t.style.cssText = 'position:fixed;left:50%;bottom:70px;transform:translateX(-50%);z-index:500;background:rgba(20,26,22,.92);border:1px solid rgba(255,255,255,.14);color:#fff;padding:11px 22px;border-radius:99px;font-size:13.5px;opacity:0;transition:opacity .25s;pointer-events:none;backdrop-filter:blur(12px)'; }
  t.textContent = msg; t.style.opacity = '1';
  clearTimeout(t._h); t._h = setTimeout(()=>t.style.opacity='0', 1800);
}

        b.innerHTML = '<div style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(n.t)+'</div><div class="tiny muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(n.b.split('\n')[0])+'</div>';
        b.onclick = ()=>{cur=i;drawList();drawEd();}; listEl.appendChild(b);
      });
      const add = document.createElement('button');
      add.className='chipbtn'; add.style.cssText+=';width:100%;margin-top:6px'; add.textContent='+ New note';
      add.onclick = ()=>{ notes.push({t:'Untitled',b:''}); cur=notes.length-1; save(); drawList(); drawEd(); };
      listEl.appendChild(add);
    }
    function drawEd(){ ti.value = notes[cur]?notes[cur].t:''; ta.value = notes[cur]?notes[cur].b:''; }
    ti.oninput = ()=>{ if(notes[cur]){notes[cur].t=ti.value;save();drawList();} };
    ta.oninput = ()=>{ if(notes[cur]){notes[cur].b=ta.value;save();} };
    drawList(); drawEd();
  }},
habits: { title:'Habits', icon:'checkSq', tint:'linear-gradient(135deg,#5eead4,#14b8a6)', w:520, h:500,
  render(body){
    const days = ['M','T','W','T','F','S','S'];
    let state;
    try{ state = JSON.parse(localStorage.getItem('moor.preview.habits')||'null') || {
      'Morning walk':[1,1,1,0,1,1,0],'Read 20 min':[1,1,0,1,1,0,0],'No sugar':[1,0,1,1,0,1,0],'Ship something':[0,1,1,1,1,0,0]
    }; }catch(e){ state={}; }
    function save(){ try{localStorage.setItem('moor.preview.habits',JSON.stringify(state));}catch(e){} }
    function draw(){
      body.innerHTML = '<div class="sec-t" style="margin-top:0">This week — tap to toggle</div><div id="hb"></div>';
      const hb = body.querySelector('#hb');
      Object.keys(state).forEach(name=>{
        const vals = state[name], done = vals.filter(Boolean).length;
        const card = document.createElement('div'); card.className='card'; card.style.marginBottom='10px';
        let cells = '';
        vals.forEach((v,i)=>{
          cells += '<button data-h="'+esc(name)+'" data-d="'+i+'" style="width:34px;height:34px;border-radius:10px;border:1px solid '+(v?'rgba(94,234,212,.6)':'rgba(255,255,255,.12)')+';background:'+(v?'rgba(94,234,212,.22)':'rgba(255,255,255,.04)')+';color:'+(v?'#5eead4':'var(--faint)')+';font-size:12px;cursor:pointer">'+(v?'✓':days[i])+'</button>';
        });
        card.innerHTML = '<div class="row" style="justify-content:space-between;margin-bottom:10px"><div style="font-weight:650;font-size:14.5px">'+esc(name)+'</div><div class="small" style="color:#5eead4">'+done+'/7 · '+Math.round(done/7*100)+'%</div></div>'+
          '<div style="display:flex;gap:7px">'+cells+'</div>'+
          '<div class="ob-bar" style="margin:12px 0 0"><i style="width:'+(done/7*100)+'%"></i></div>';
        hb.appendChild(card);
      });
      hb.querySelectorAll('button[data-h]').forEach(b=>{
        b.onclick = ()=>{ const h=b.dataset.h; state[h][+b.dataset.d]^=1; save(); draw(); };
      });
    }
    draw();
  }},
calendar: { title:'Calendar', icon:'cal', tint:'linear-gradient(135deg,#f9a8d4,#ec4899)', w:520, h:500,
  render(body){
    // September 2026: Sep 1 is a Tuesday
    const events = {3:[['10:00','Ship Moor preview']],9:[['09:00','Morning walk'],['15:30','Dentist']],14:[['12:00','Lunch with Priya']],21:[['18:00','Demo night']],28:[['09:00','Review onboarding']]};
    let html = '<div class="sec-t" style="margin-top:0">September 2026</div>';
    html += '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center" class="tiny muted"><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div><div>S</div>';
    for(let i=0;i<1;i++) html += '<div></div>'; // Sep 1 = Tuesday -> 1 blank
    for(let d=1; d<=30; d++){
      const has = events[d], today = d===28;
      html += '<div style="aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:13px;position:relative;'+
        (today?'background:rgba(249,168,212,.18);border:1px solid rgba(249,168,212,.5);font-weight:700':'border:1px solid transparent')+'">'+d+
        (has?'<div style="position:absolute;bottom:4px;width:5px;height:5px;border-radius:99px;background:#f9a8d4"></div>':'')+'</div>';
    }
    html += '</div><div class="sec-t">Upcoming</div>';
    Object.keys(events).sort((a,b)=>a-b).forEach(d=>{
      events[d].forEach(([t,n])=>{
        html += '<div class="card" style="margin-bottom:8px;padding:10px 14px"><div class="row"><div class="small" style="color:#f9a8d4;font-weight:700;width:52px;flex:none">'+t+'</div><div style="font-size:14px">Sep '+d+' — '+esc(n)+'</div></div></div>';
      });
    });
    body.innerHTML = html;
  }},
settings: { title:'Settings', icon:'gear', tint:'linear-gradient(135deg,#94a3b8,#64748b)', w:520, h:520,
  render(body){
    const hues = [['Green','#4ade80'],['Teal','#5eead4'],['Violet','#c4b5fd'],['Blue','#93c5fd'],['Amber','#fcd34d']];
    body.innerHTML =
      '<div class="sec-t">Intelligence</div>'+
      '<div class="grid2"><button class="chipbtn" id="st-local">This computer</button><button class="chipbtn" id="st-key">I have a key</button></div>'+
      '<div class="small muted" style="margin-top:8px" id="st-brain">Currently: this computer (qwen3:4b) — preview</div>'+
      '<div class="sec-t">Accent color</div><div class="row" id="st-acc" style="gap:10px"></div>'+
      '<div class="sec-t">Storage</div><div class="card small muted">Everything lives on this device. 4.2 GB free.</div>'+
      '<div class="sec-t">About</div><div class="card small muted">Moor OS · UI preview v0.1<br>Nothing here is real yet — it&rsquo;s all furniture.</div>';
    body.querySelector('#st-local').onclick = ()=>{ body.querySelector('#st-brain').textContent='Currently: this computer (qwen3:4b) — preview'; toast('Switched to local (preview)'); };
    body.querySelector('#st-key').onclick = ()=>{ body.querySelector('#st-brain').textContent='Currently: API key — preview'; toast('Switched to key (preview)'); };
    const acc = body.querySelector('#st-acc');
    hues.forEach(([n,c])=>{
      const b = document.createElement('button');
      b.title=n; b.style.cssText='width:40px;height:40px;border-radius:99px;border:2px solid rgba(255,255,255,.2);background:'+c+';cursor:pointer';
      b.onclick = ()=>{ document.documentElement.style.setProperty('--acc', c); toast('Accent: '+n); };
      acc.appendChild(b);
    });
  }}
};
