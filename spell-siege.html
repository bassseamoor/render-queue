<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0d14">
<title>Spell Siege — spawn-director</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; padding:0; height:100%; background:#0a0d14; color:#e8eef7;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif; overscroll-behavior:none; }
  #hud { display:flex; align-items:center; gap:8px; padding:10px 12px calc(10px);
    padding-top:calc(10px + env(safe-area-inset-top)); background:#0d1220; border-bottom:1px solid #1d2a42; }
  .stat { flex:1; text-align:center; }
  .stat .v { font-size:19px; font-weight:700; }
  .stat .k { font-size:10px; color:#8fa0b8; text-transform:uppercase; letter-spacing:1px; }
  #restart { min-height:48px; min-width:88px; border-radius:12px; border:1px solid #2a3a52;
    background:#16202f; color:#e8eef7; font-size:14px; font-weight:700; touch-action:manipulation; cursor:pointer; }
  #wrap { position:relative; flex:1; }
  body { display:flex; flex-direction:column; }
  #cv { display:block; width:100%; height:100%; touch-action:none; }
  #banner { position:absolute; left:0; right:0; top:38%; text-align:center; font-size:34px; font-weight:800;
    color:#ffe9a8; text-shadow:0 2px 18px rgba(0,0,0,.8); opacity:0; transition:opacity .3s; pointer-events:none; }
  #over { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center;
    gap:12px; background:rgba(5,8,13,.88); z-index:5; }
  #over h2 { margin:0; font-size:28px; }
  #over .sc { font-size:16px; color:#9fd8ff; }
  #over button { min-height:56px; min-width:200px; border-radius:14px; font-size:17px; font-weight:700;
    border:1px solid #3fa7ff; background:#14324a; color:#dff1ff; touch-action:manipulation; cursor:pointer; }
  #hint { position:absolute; left:0; right:0; bottom:10px; text-align:center; font-size:12px; color:#7d8ea6; pointer-events:none; }
</style>
</head>
<body>
<div id="hud">
  <div class="stat"><div class="v" id="h-wave">1</div><div class="k">wave</div></div>
  <div class="stat"><div class="v" id="h-score">0</div><div class="k">score</div></div>
  <div class="stat"><div class="v" id="h-alive">0</div><div class="k">alive</div></div>
  <div class="stat"><div class="v" id="h-base">❤️❤️❤️</div><div class="k">base</div></div>
  <button id="restart">↻<br>restart</button>
</div>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="banner"></div>
  <div id="hint">tap an enemy to blast it</div>
  <div id="over">
    <h2>💀 base fallen</h2>
    <div class="sc" id="final"></div>
    <button id="again">↻ fight again</button>
  </div>
</div>

<script>
'use strict';
/* =====================================================================
 * PROVENANCE:
 *   mulberry32 <- moor-recovery/components/seed-rng/rng.js (verbatim)
 *   createSpawnDirector <- moor-recovery/components/spawn-director/spawn-director.js
 *     (verbatim — director brain preserved exactly; game specifics injected
 *      via opts: types, seeded rand, onSpawn, onSwarm, maxAlive)
 *   spellSprite <- moor-recovery/pulse-v2/tools/tool-wonder.js:2506 (verbatim)
 *   Spell FX (fireball burst+ring, frost-nova rings+shards, lightning bolts)
 *     adapted from tool-wonder.js TYPES renderers #22/#23/#24 (lines 2583-2910).
 *     NOTE: moor-pc-mirror/moor-city/particle-pack.mjs was inspected; its
 *     format is pure data for the moor-city GPU particle engine (behaviors,
 *     burst tables, color curves + a 16-frame VFX texture atlas) — not directly
 *     usable on a bare 2D canvas — so the 2D canvas spell renderers above were
 *     lifted instead, per the brief.
 * Kills feed back: every removal (kill or escape) calls director.reportKill(),
 * and the HUD alive count reads director.state().alive.
 * ===================================================================== */

/* ---- seed-rng (verbatim) ---- */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---- spawn-director (verbatim) ---- */
function createSpawnDirector(opts) {
  var types = opts.types;                       // {name:{hp,sp,dmg,r,xp,score,unlock,elite?}}
  var rand = opts.rand || Math.random;
  var onSpawn = opts.onSpawn || function () {};
  var onSwarm = opts.onSwarm || function () {};
  var maxAlive = opts.maxAlive != null ? opts.maxAlive : 320;
  var swarmType = opts.swarmType || Object.keys(types)[0];
  var swarmSize = opts.swarmSize != null ? opts.swarmSize : 26;
  var alive = 0;                                 // game reports kills via reportKill()

  var t = 0, spawnT = 1, swarmT = 50;

  function reset() { t = 0; spawnT = 1; swarmT = 50; alive = 0; }

  function pickType() {
    var pool = Object.keys(types).filter(function (k) { return types[k].unlock <= t; });
    var tot = 0, i;
    for (i = 0; i < pool.length; i++) tot += types[pool[i]].score;
    var r = rand() * tot;
    for (i = 0; i < pool.length; i++) { r -= types[pool[i]].score; if (r <= 0) return pool[i]; }
    return pool[0];
  }

  function statsFor(name) {
    var T = types[name];
    var hpMul = 1 + t / 70, dmgMul = 1 + t / 300;   // original scaling
    return { type: name, hp: T.hp * hpMul, maxhp: T.hp * hpMul,
      sp: T.sp * (0.9 + rand() * 0.2), dmg: T.dmg * dmgMul,
      r: T.r * (T.elite ? 1.25 : 1), xp: T.xp, elite: !!T.elite };
  }

  function spawnOne(force) {
    if (alive >= maxAlive) return null;
    var s = statsFor(force || pickType());
    alive++;
    onSpawn(s.type, s);
    return s;
  }

  function swarm() {
    for (var i = 0; i < swarmSize; i++) spawnOne(swarmType);
    onSwarm(swarmType, swarmSize);
  }

  function update(dt) {
    t += dt;
    spawnT -= dt;
    if (spawnT <= 0) {
      spawnT = Math.max(0.22, 1.05 - t * 0.0015);   // original interval curve
      var n = 1 + Math.floor(t / 40);              // original batch growth
      for (var i = 0; i < n; i++) spawnOne();
    }
    swarmT -= dt;
    if (swarmT <= 0) { swarmT = 45 + rand() * 25; swarm(); }  // original: R(45,70)
  }

  function reportKill() { if (alive > 0) alive--; }

  return { reset: reset, update: update, pickType: pickType, spawnOne: spawnOne,
           swarm: swarm, reportKill: reportKill,
           state: function () { return { t: t, alive: alive }; } };
}

/* ---- spellSprite (verbatim, tool-wonder.js:2506) ---- */
function spellSprite(hue, sat, li){
  var c = document.createElement('canvas'); c.width = c.height = 64;
  var x = c.getContext('2d');
  var g = x.createRadialGradient(32,32,1,32,32,32);
  g.addColorStop(0,'hsla('+hue+','+sat+'%,'+Math.min(97,li+32)+'%,1)');
  g.addColorStop(0.35,'hsla('+hue+','+sat+'%,'+li+'%,0.8)');
  g.addColorStop(1,'hsla('+hue+','+sat+'%,'+li+'%,0)');
  x.fillStyle = g; x.fillRect(0,0,64,64);
  return c;
}

/* ================= demo code (spell-siege) ================= */
var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
var W = 0, H = 0, DPR = 1;
function fit(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  var r = cv.getBoundingClientRect();
  W = Math.max(1, r.width); H = Math.max(1, r.height);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', fit);

var TYPES = {
  grunt:  { hp:3,  sp:46, dmg:1, r:17, xp:5,  score:10, unlock:0 },
  runner: { hp:2,  sp:95, dmg:1, r:12, xp:8,  score:20, unlock:12 },
  brute:  { hp:12, sp:26, dmg:3, r:26, xp:20, score:40, unlock:40 },
  elite:  { hp:20, sp:60, dmg:4, r:20, xp:35, score:80, unlock:90, elite:true }
};
var ECOL = { grunt:'#4caf50', runner:'#ff9800', brute:'#f44336', elite:'#b366ff' };
var SPELLKIND = ['fireball', 'frostnova', 'lightning'];  // rotates per cast
var SPELLDMG = 4;

var ents = [], fx = [], score = 0, base = 3, over = false, spellN = 0;
var rng = mulberry32(1337);
var sprFire = spellSprite(18, 95, 58), sprFireW = spellSprite(30, 100, 80);
var sprFrost = spellSprite(195, 85, 70), sprBolt = spellSprite(215, 95, 70);

function banner(txt, ms){
  var b = document.getElementById('banner');
  b.textContent = txt; b.style.opacity = 1;
  setTimeout(function(){ b.style.opacity = 0; }, ms || 1400);
}

var director = createSpawnDirector({
  types: TYPES,
  rand: rng,
  maxAlive: 60,
  swarmType: 'grunt',
  swarmSize: 14,
  onSpawn: function(type, s){
    ents.push({ type:type, x: 24 + rng() * (W - 48), y: -s.r - 4,
      hp:s.hp, maxhp:s.maxhp, r:s.r, sp:s.sp, xp:s.xp, elite:s.elite,
      wob: rng() * 6.28 });
  },
  onSwarm: function(type, n){ banner('⚔️ ' + type.toUpperCase() + ' SWARM ×' + n); }
});

function reset(){
  director.reset(); ents.length = 0; fx.length = 0;
  score = 0; base = 3; over = false; spellN = 0;
  document.getElementById('over').style.display = 'none';
  document.getElementById('hint').style.display = '';
}
document.getElementById('restart').addEventListener('click', reset);
document.getElementById('again').addEventListener('click', reset);

/* ---- spell FX: one-shot bursts adapted from tool-wonder.js #22/#23/#24 ---- */
function castSpell(x, y){
  var kind = SPELLKIND[spellN++ % SPELLKIND.length];
  var i, a, sp;
  if (kind === 'fireball') {
    // #22 fireball: radial burst + shock ring + flash
    var parts = [];
    for (i = 0; i < 46; i++) {
      a = rng() * 6.2832; sp = 60 + rng() * 340;
      parts.push({ x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 60,
        life:0, max:0.6 + rng() * 0.9, s:8 + rng() * 22, h:18 + (rng() - 0.5) * 26 });
    }
    fx.push({ kind:'fireball', parts:parts, ring:0, flash:1, x:x, y:y });
  } else if (kind === 'frostnova') {
    // #23 frost nova: expanding rings + crystalline shards
    var shards = [];
    for (i = 0; i < 40; i++) {
      shards.push({ ang:rng() * 6.2832, d0:14 + rng() * 26, sp:180 + rng() * 240,
        rot:rng() * 6.2832, vr:(rng() - 0.5) * 6, len:12 + rng() * 26, w:2 + rng() * 3 });
    }
    fx.push({ kind:'frostnova', shards:shards, nt:0, x:x, y:y });
  } else {
    // #24 lightning: branching bolt from sky + strike flash
    var pts = [[x, -20]];
    for (i = 1; i <= 18; i++) {
      var u = i / 18, gy = y;
      pts.push([x + (rng() - 0.5) * 90 * Math.sin(u * Math.PI) + (rng() - 0.5) * 30, -20 + u * (gy + 20)]);
    }
    var branches = [];
    for (var bb = 0; bb < 3; bb++) {
      var si = 3 + ((rng() * 11) | 0), bp = [[pts[si][0], pts[si][1]]];
      var bx2 = pts[si][0], by2 = pts[si][1], bdir = rng() < 0.5 ? -1 : 1;
      for (var s2 = 0; s2 < 5; s2++) { bx2 += bdir * (14 + rng() * 26); by2 += 10 + rng() * 26; bp.push([bx2, by2]); }
      branches.push(bp);
    }
    fx.push({ kind:'lightning', pts:pts, branches:branches, life:0, max:0.34, x:x, y:y });
  }
  return kind;
}
function drawBolt(pts, w, style, alpha){
  ctx.strokeStyle = style; ctx.lineWidth = w; ctx.globalAlpha = alpha;
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.stroke();
}
function updateFx(dt){
  for (var k = fx.length - 1; k >= 0; k--) {
    var f = fx[k], done = false, i;
    if (f.kind === 'fireball') {
      for (i = f.parts.length - 1; i >= 0; i--) {
        var p = f.parts[i]; p.life += dt;
        if (p.life >= p.max) { f.parts.splice(i, 1); continue; }
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.vx *= (1 - 1.9 * dt); p.vy *= (1 - 1.9 * dt); p.vy += 160 * dt;
      }
      f.ring += dt * 2.4; f.flash = Math.max(0, f.flash - dt * 3.2);
      if (!f.parts.length && f.ring >= 1 && f.flash <= 0) done = true;
    } else if (f.kind === 'frostnova') {
      f.nt += dt;
      if (f.nt > 1.7) done = true;
    } else {
      f.life += dt;
      if (f.life >= f.max) done = true;
    }
    if (done) fx.splice(k, 1);
  }
}
function drawFx(){
  ctx.globalCompositeOperation = 'lighter';
  for (var k = 0; k < fx.length; k++) {
    var f = fx[k], i;
    if (f.kind === 'fireball') {
      for (i = 0; i < f.parts.length; i++) {
        var p = f.parts[i], a3 = 1 - p.life / p.max, s3 = p.s * (0.5 + a3 * 0.5);
        ctx.globalAlpha = a3;
        ctx.drawImage(sprFire, p.x - s3 / 2, p.y - s3 / 2, s3, s3);
      }
      if (f.flash > 0) {
        var fg = ctx.createRadialGradient(f.x, f.y, 2, f.x, f.y, 190);
        fg.addColorStop(0, 'rgba(255,244,214,' + (0.85 * f.flash) + ')');
        fg.addColorStop(0.4, 'hsla(18,95%,60%,' + (0.4 * f.flash) + ')');
        fg.addColorStop(1, 'hsla(18,95%,55%,0)');
        ctx.globalAlpha = 1; ctx.fillStyle = fg;
        ctx.fillRect(f.x - 190, f.y - 190, 380, 380);
      }
      if (f.ring < 1) {
        ctx.globalAlpha = (1 - f.ring) * 0.8;
        ctx.strokeStyle = 'hsla(18,95%,65%,1)'; ctx.lineWidth = 3.5;
        ctx.beginPath(); ctx.arc(f.x, f.y, 12 + f.ring * 250, 0, 6.2832); ctx.stroke();
      }
    } else if (f.kind === 'frostnova') {
      var nt = f.nt, cx = f.x, cy = f.y, hue = 195;
      if (nt < 0.6) {
        var fl = ctx.createRadialGradient(cx, cy, 2, cx, cy, 220), fa = 1 - nt / 0.6;
        fl.addColorStop(0, 'rgba(240,250,255,' + (0.8 * fa) + ')');
        fl.addColorStop(0.5, 'hsla(' + hue + ',85%,70%,' + (0.35 * fa) + ')');
        fl.addColorStop(1, 'hsla(' + hue + ',85%,70%,0)');
        ctx.globalAlpha = 1; ctx.fillStyle = fl;
        ctx.fillRect(cx - 220, cy - 220, 440, 440);
      }
      for (var pr = 0; pr < 2; pr++) {
        var rr = nt * 380 - pr * 70;
        if (rr <= 0) continue;
        var ra = Math.max(0, 1 - nt / 1.7) * 0.55;
        if (ra <= 0) continue;
        ctx.globalAlpha = ra; ctx.strokeStyle = 'hsla(' + hue + ',85%,72%,1)';
        ctx.lineWidth = 3 - pr * 0.6;
        ctx.beginPath(); ctx.arc(cx, cy, rr, 0, 6.2832); ctx.stroke();
      }
      for (i = 0; i < f.shards.length; i++) {
        var sd = f.shards[i], d = sd.d0 + nt * sd.sp, sa = Math.max(0, 1 - nt / 1.5);
        if (sa <= 0) continue;
        var sx = cx + Math.cos(sd.ang) * d, sy = cy + Math.sin(sd.ang) * d * 0.9;
        ctx.save(); ctx.translate(sx, sy); ctx.rotate(sd.rot + nt * sd.vr);
        ctx.globalAlpha = sa * 0.9; ctx.fillStyle = 'hsla(' + hue + ',85%,74%,1)';
        ctx.beginPath();
        ctx.moveTo(0, -sd.len / 2); ctx.lineTo(sd.w, 0);
        ctx.lineTo(0, sd.len / 2); ctx.lineTo(-sd.w, 0);
        ctx.closePath(); ctx.fill();
        ctx.restore();
      }
    } else {
      var kk = f.life / f.max, hue2 = 215;
      var flick = kk < 0.45 ? 1 : (0.12 + 0.88 * Math.abs(Math.sin(f.life * 220 + f.x)));
      drawBolt(f.pts, 8, 'hsla(' + hue2 + ',90%,62%,1)', 0.22 * flick);
      drawBolt(f.pts, 3, 'hsla(' + hue2 + ',95%,72%,1)', 0.65 * flick);
      drawBolt(f.pts, 1.3, '#f4fbff', 0.95 * flick);
      for (var b2 = 0; b2 < f.branches.length; b2++)
        drawBolt(f.branches[b2], 2, 'hsla(' + hue2 + ',95%,72%,1)', 0.5 * flick);
      var ig = ctx.createRadialGradient(f.x, f.y, 2, f.x, f.y, 130);
      ig.addColorStop(0, 'rgba(240,250,255,' + (0.55 * flick * (1 - kk)) + ')');
      ig.addColorStop(1, 'hsla(' + hue2 + ',90%,60%,0)');
      ctx.globalAlpha = 1; ctx.fillStyle = ig;
      ctx.fillRect(f.x - 130, f.y - 130, 260, 260);
    }
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

/* ---- combat ---- */
function hitTest(x, y){
  for (var k = ents.length - 1; k >= 0; k--) {
    var e = ents[k], dx = x - e.x, dy = y - e.y;
    if (dx * dx + dy * dy <= (e.r + 14) * (e.r + 14)) {
      castSpell(e.x, e.y);
      e.hp -= SPELLDMG;
      if (e.hp <= 0) {
        ents.splice(k, 1);
        score += e.xp;
        director.reportKill();           // kill feeds back into the director
      }
      return e.type;
    }
  }
  return null;
}
cv.addEventListener('pointerdown', function(ev){
  if (over) return;
  ev.preventDefault();
  var r = cv.getBoundingClientRect();
  hitTest(ev.clientX - r.left, ev.clientY - r.top);
});

function drawEnemy(e, t){
  var col = ECOL[e.type] || '#999';
  ctx.save(); ctx.translate(e.x, e.y + Math.sin(t * 3 + e.wob) * 2);
  var g = ctx.createRadialGradient(-e.r * 0.3, -e.r * 0.3, e.r * 0.2, 0, 0, e.r);
  g.addColorStop(0, '#fff'); g.addColorStop(0.25, col); g.addColorStop(1, '#0a0d14');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, e.r, 0, 6.2832); ctx.fill();
  if (e.elite) { ctx.strokeStyle = '#ffd76a'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(0, 0, e.r + 3, 0, 6.2832); ctx.stroke(); }
  // eyes
  ctx.fillStyle = '#0a0d14';
  ctx.beginPath(); ctx.arc(-e.r * 0.32, -e.r * 0.12, e.r * 0.16, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.arc(e.r * 0.32, -e.r * 0.12, e.r * 0.16, 0, 6.2832); ctx.fill();
  // hp bar
  var bw = e.r * 1.8;
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(-bw / 2, -e.r - 9, bw, 5);
  ctx.fillStyle = e.hp / e.maxhp > 0.4 ? '#7dff8a' : '#ff6b6b';
  ctx.fillRect(-bw / 2, -e.r - 9, bw * Math.max(0, e.hp / e.maxhp), 5);
  ctx.restore();
}

var last = performance.now(), waveShown = 0;
function frame(now){
  requestAnimationFrame(frame);
  var dt = Math.min(0.1, (now - last) / 1000); last = now;
  var t = director.state().t;
  if (!over) {
    director.update(dt);
    for (var k = ents.length - 1; k >= 0; k--) {
      var e = ents[k];
      e.y += e.sp * dt;
      if (e.y > H + e.r + 8) {
        ents.splice(k, 1);
        director.reportKill();           // escaped enemy leaves the field
        base--;
        if (base <= 0) {
          over = true;
          document.getElementById('final').textContent =
            'score ' + score + ' · wave ' + (1 + Math.floor(t / 30)) + ' · survived ' + Math.floor(t) + 's';
          document.getElementById('over').style.display = 'flex';
        }
      }
    }
    updateFx(dt);
  }
  // draw
  ctx.fillStyle = '#0a0d14'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(120,160,220,.08)'; ctx.lineWidth = 1;
  for (var gx = 0; gx < W; gx += 40) { ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke(); }
  for (var gy = 0; gy < H; gy += 40) { ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke(); }
  // base line
  ctx.strokeStyle = base > 1 ? 'rgba(125,255,138,.5)' : 'rgba(255,107,107,.8)';
  ctx.lineWidth = 3; ctx.setLineDash([10, 8]);
  ctx.beginPath(); ctx.moveTo(0, H - 6); ctx.lineTo(W, H - 6); ctx.stroke();
  ctx.setLineDash([]);
  for (k = 0; k < ents.length; k++) drawEnemy(ents[k], t);
  drawFx();
  // HUD
  var wave = 1 + Math.floor(t / 30);
  if (wave !== waveShown) { waveShown = wave; if (wave > 1) banner('🌊 WAVE ' + wave); }
  document.getElementById('h-wave').textContent = wave;
  document.getElementById('h-score').textContent = score;
  document.getElementById('h-alive').textContent = director.state().alive;
  document.getElementById('h-base').textContent = '❤️'.repeat(Math.max(0, base)) || '💀';
}

/* headless/test hooks */
window.__game = {
  tapAt: hitTest,
  enemies: function(){ return ents.map(function(e){ return { x:e.x, y:e.y, r:e.r, type:e.type, hp:e.hp }; }); },
  score: function(){ return score; },
  alive: function(){ return director.state().alive; },
  t: function(){ return director.state().t; },
  reset: reset
};

fit();
