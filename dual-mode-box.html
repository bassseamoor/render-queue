<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>dual-mode box — mesh-builder</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#0b0d12; color:#e8eaf0;
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, sans-serif; }
  #cv { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #top { position:fixed; top:0; left:0; right:0; padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 0;
    pointer-events:none; z-index:5; }
  #top h1 { font-size:22px; font-weight:700; letter-spacing:-.01em; }
  #top h1 .amber { color:#e8a33d; }
  #top p { font-size:13px; color:#9aa0ae; margin-top:4px; max-width:340px; line-height:1.45; }
  #hud { position:fixed; top:calc(env(safe-area-inset-top,0px) + 14px); right:16px; z-index:5;
    font-size:11px; color:#8a90a0; text-align:right; line-height:1.7; pointer-events:none;
    font-variant-numeric:tabular-nums; }
  #hud b { color:#e8a33d; font-weight:700; }
  #bar { position:fixed; left:0; right:0; bottom:0; z-index:5;
    padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 14px);
    display:flex; gap:10px; align-items:center; justify-content:center;
    background:linear-gradient(180deg, transparent, rgba(5,6,10,.78) 45%); }
  .seg { display:flex; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.1);
    border-radius:999px; padding:3px; }
  .seg button { border:0; background:transparent; color:#9aa0ae; font-size:14px; font-weight:600;
    padding:9px 16px; border-radius:999px; cursor:pointer; }
  .seg button.on { background:#e8a33d; color:#14100a; }
  .act { border:1px solid rgba(232,163,61,.45); background:rgba(232,163,61,.12); color:#f0c884;
    font-size:14px; font-weight:700; padding:11px 18px; border-radius:999px; cursor:pointer; }
  .act:active { transform:scale(.96); }
  #hint { position:fixed; bottom:calc(env(safe-area-inset-bottom,0px) + 76px); left:0; right:0;
    text-align:center; font-size:12px; color:#6b7180; z-index:4; pointer-events:none; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="top">
  <h1>dual-mode <span class="amber">box</span></h1>
  <p>One builder call. <b style="color:#cfd4e0">Triangles</b> for the eyes — or flip it to
  <b style="color:#e8a33d">solids</b> and get the exact collision volumes. Same numbers, never drift.</p>
</div>
<div id="hud"><b id="h-box">–</b> boxes → <b id="h-abb">–</b> AABBs<br><span id="h-ball">0</span> balls live</div>
<div id="hint">drag to orbit · tap + ball to drop</div>
<div id="bar">
  <div class="seg" id="seg">
    <button data-m="mesh" class="on">mesh</button><button data-m="solids">solids</button><button data-m="both">both</button>
  </div>
  <button class="act" id="drop">+ ball</button>
  <button class="act" id="reset" style="border-color:rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#aab0c0">reset</button>
</div>
<script>
'use strict';
/* ============ mesh-builder (verbatim from moor-recovery/components/mesh-builder/mesh-builder.js) ============ */
const TAU = Math.PI * 2;
const mix=(a,b,t)=>a+(b-a)*t;
const color=(c,m=1,a=1)=>[c[0]*m,c[1]*m,c[2]*m,a];
const dot3=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const norm3=a=>{const l=Math.hypot(...a)||1;return a.map(v=>v/l)};
const cross3=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
class CityMesh{
 constructor(){this.data=[];this.indices=[];this.construction=[0,0,0,0];this.material=0;this.phase=0;this.kind=0;this.anchor=0;this.lots=[];this.turn=0;this.pivot=[0,0];this.route=[0,0,0,0]}
 vertex(p,n,c,uv){let route=this.route;if(this.turn){const co=Math.cos(this.turn),si=Math.sin(this.turn),x=p[0]-this.pivot[0],z=p[2]-this.pivot[1];p=[this.pivot[0]+co*x+si*z,p[1],this.pivot[1]-si*x+co*z];n=[co*n[0]+si*n[2],n[1],-si*n[0]+co*n[2]];if(this.kind===2){const xx=route[0]-this.pivot[0],zz=route[1]-this.pivot[1];route=[this.pivot[0]+co*xx+si*zz,this.pivot[1]-si*xx+co*zz,route[2],route[3]];}if(this.kind===3&&route[3]>.5)uv=[co*uv[0]+si*uv[1],-si*uv[0]+co*uv[1]];}this.data.push(...p,...n,c[0],c[1],c[2],...this.construction,...uv,this.material,this.phase,this.kind,this.anchor,...route)}
 face(a,b,c,d,color,normal,uvScale=1,uvOrigin=[0,0]){const ab=b.map((v,i)=>v-a[i]),ac=c.map((v,i)=>v-a[i]),ad=d.map((v,i)=>v-a[i]),geometric=cross3(ab,ac),fallback=cross3(ac,ad),raw=norm3(Math.hypot(...geometric)>1e-9?geometric:fallback),n=normal&&dot3(raw,normal)<0?raw.map(v=>-v):raw,w=Math.hypot(...ab)*uvScale,h=Math.hypot(...ad)*uvScale,base=this.data.length/23;this.vertex(a,n,color,uvOrigin);this.vertex(b,n,color,[uvOrigin[0]+w,uvOrigin[1]]);this.vertex(c,n,color,[uvOrigin[0]+w,uvOrigin[1]+h]);this.vertex(d,n,color,[uvOrigin[0],uvOrigin[1]+h]);const reverse=dot3(cross3(ab,ac),n)<0;if(Math.hypot(...ab)>1e-8&&Math.hypot(...ac)>1e-8)this.indices.push(base,base+(reverse?2:1),base+(reverse?1:2));if(Math.hypot(...ad)>1e-8)this.indices.push(base,base+(reverse?3:2),base+(reverse?2:3));}
 box(x,y,z,w,h,d,c,mat=this.material){if(w<=0||h<=0||d<=0)return;if(this.solids&&this.kind<1.5){this.solids.push({lo:[x,y,z],hi:[x+w,y+h,z+d],c,mat,kind:this.kind,anchor:this.anchor});return;}const old=this.material;this.material=mat;const a=[x,y,z],b=[x+w,y,z],e=[x,y+h,z],f=[x+w,y+h,z],j=[x,y,z+d],k=[x+w,y,z+d],l=[x,y+h,z+d],q=[x+w,y+h,z+d];this.face(a,b,f,e,c,[0,0,-1]);this.face(k,j,l,q,c,[0,0,1]);this.face(j,a,e,l,c,[-1,0,0]);this.face(b,k,q,f,c,[1,0,0]);this.face(e,f,q,l,c,[0,1,0]);this.material=old;}
 sphere(x,y,z,rx,ry,rz,c,segments=10,rings=6){for(let j=0;j<rings;j++)for(let i=0;i<segments;i++){const p=(a,b)=>[x+Math.cos(a)*Math.sin(b)*rx,y+Math.cos(b)*ry,z+Math.sin(a)*Math.sin(b)*rz];const a=i/segments*TAU,b=(i+1)/segments*TAU,c0=j/rings*Math.PI,d=(j+1)/rings*Math.PI;const n=norm3([Math.cos((a+b)/2)*Math.sin((c0+d)/2),Math.cos((c0+d)/2),Math.sin((a+b)/2)*Math.sin((c0+d)/2)]);this.face(p(a,c0),p(b,c0),p(b,d),p(a,d),c,n)}if(this.material===8)this.roundCap(x,y-ry,z,rx,rz,ry*2,0,segments,rings);}
 upload(){this.vertexCount=this.data.length/23;this.count=this.indices.length;this.buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,this.buffer);if(this.vertexCount<=65535){gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(this.data),gl.STATIC_DRAW);this.indexBuffer=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,this.indexBuffer);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(this.indices),gl.STATIC_DRAW);}else{const expanded=new Float32Array(this.count*23);for(let j=0;j<this.count;j++)for(let k=0;k<23;k++)expanded[j*23+k]=this.data[this.indices[j]*23+k];gl.bufferData(gl.ARRAY_BUFFER,expanded,gl.STATIC_DRAW);this.vertexCount=this.count;}this.data=null;this.indices=null;return this}
 dispose(){gl.deleteBuffer(this.buffer);if(this.indexBuffer)gl.deleteBuffer(this.indexBuffer)}
}
/* ============ end verbatim mesh-builder ============ */

/* ---------- the scene: ONE build function, run twice ---------- */
function buildScene(m){
  const C=(r,g,b)=>[r,g,b];
  m.box(-14,-1,-10, 28,1,20, C(.15,.16,.20));   // floor
  m.box(-13, 0,-2,   3,4,4,  C(.36,.30,.52));   // stairs down
  m.box(-10, 0,-2,   3,3,4,  C(.36,.30,.52));
  m.box( -7, 0,-2,   3,2,4,  C(.36,.30,.52));
  m.box( -4, 0,-2,   3,1,4,  C(.36,.30,.52));
  m.box(  4, 0,-2,   6,2.5,4,C(.22,.42,.38));   // platform
  m.box(  6, 2.5,-1, 2,4,2,  C(.55,.38,.22));   // tower
  m.box(-14, 0, 6,  28,5,1,  C(.20,.20,.26));   // back wall
  m.box( -2, 5,-4,   4,.6,3,  C(.50,.26,.30));   // floating ledge
}

/* ---------- WebGL ---------- */
const cv = document.getElementById('cv');
const gl = cv.getContext('webgl', {antialias:true}) || cv.getContext('experimental-webgl');
window.gl = gl;
if (!gl){ document.body.innerHTML = '<p style="padding:40px">WebGL unavailable.</p>'; throw new Error('no gl'); }

function resize(){
  const dpr = Math.min(devicePixelRatio||1, 2);
  cv.width = Math.floor(innerWidth*dpr); cv.height = Math.floor(innerHeight*dpr);
  gl.viewport(0,0,cv.width,cv.height);
}
addEventListener('resize', resize); resize();

const VS = 'attribute vec3 p; attribute vec3 n; attribute vec3 c;\n'+
 'uniform mat4 uMVP; varying vec3 vN; varying vec3 vC;\n'+
 'void main(){ vN=n; vC=c; gl_Position=uMVP*vec4(p,1.); }';
const FS = 'precision mediump float; varying vec3 vN; varying vec3 vC;\n'+
 'void main(){ vec3 L=normalize(vec3(.5,.8,.6)); float d=max(dot(normalize(vN),L),0.);\n'+
 ' vec3 col=vC*(.32+.68*d); gl_FragColor=vec4(col,1.); }';
function sh(t,src){ const s=gl.createShader(t); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog); gl.useProgram(prog);
const aP=gl.getAttribLocation(prog,'p'), aN=gl.getAttribLocation(prog,'n'), aC=gl.getAttribLocation(prog,'c');
const uMVP=gl.getUniformLocation(prog,'uMVP');
gl.enableVertexAttribArray(aP); gl.enableVertexAttribArray(aN); gl.enableVertexAttribArray(aC);
gl.enable(gl.DEPTH_TEST); gl.clearColor(.043,.05,.07,1);

function bindMesh(m){
  gl.bindBuffer(gl.ARRAY_BUFFER, m.buffer);
  const S=23*4;
  gl.vertexAttribPointer(aP,3,gl.FLOAT,false,S,0);
  gl.vertexAttribPointer(aN,3,gl.FLOAT,false,S,12);
  gl.vertexAttribPointer(aC,3,gl.FLOAT,false,S,24);
  if (m.indexBuffer) gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, m.indexBuffer);
}
function drawMesh(m, mvp){
  bindMesh(m); gl.uniformMatrix4fv(uMVP,false,mvp);
  if (m.indexBuffer) gl.drawElements(gl.TRIANGLES, m.count, gl.UNSIGNED_SHORT, 0);
  else gl.drawArrays(gl.TRIANGLES, 0, m.vertexCount);
}

/* wireframe AABB lines */
let lineBuf=null, lineCount=0;
function buildLines(solids){
  const v=[];
  solids.forEach(s=>{
    const x0=s.lo[0],y0=s.lo[1],z0=s.lo[2],x1=s.hi[0],y1=s.hi[1],z1=s.hi[2];
    const c=[[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1],[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]];
    const e=[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
    e.forEach(([a,b])=>{ v.push(...c[a], ...c[b]); });
  });
  lineCount = v.length/3;
  lineBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, lineBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(v), gl.STATIC_DRAW);
}
const progL = gl.createProgram();
gl.attachShader(progL, sh(gl.VERTEX_SHADER,'attribute vec3 p; uniform mat4 uMVP; void main(){ gl_Position=uMVP*vec4(p,1.); }'));
gl.attachShader(progL, sh(gl.FRAGMENT_SHADER,'precision mediump float; uniform vec3 uC; void main(){ gl_FragColor=vec4(uC,1.); }'));
gl.linkProgram(progL);
const aLP=gl.getAttribLocation(progL,'p'), uLMVP=gl.getUniformLocation(progL,'uMVP'), uLC=gl.getUniformLocation(progL,'uC');
gl.enableVertexAttribArray(aLP);
function drawLines(mvp, rgb){
  gl.useProgram(progL);
  gl.bindBuffer(gl.ARRAY_BUFFER, lineBuf);
  gl.vertexAttribPointer(aLP,3,gl.FLOAT,false,0,0);
  gl.uniformMatrix4fv(uLMVP,false,mvp); gl.uniform3fv(uLC,rgb);
  gl.drawArrays(gl.LINES,0,lineCount);
  gl.useProgram(prog);
}

/* ---------- build both passes ---------- */
const meshPass = new CityMesh(); buildScene(meshPass); meshPass.upload();
const solidPass = new CityMesh(); solidPass.solids=[]; buildScene(solidPass);
const SOLIDS = solidPass.solids;
buildLines(SOLIDS);
// one shared ball mesh
const ballMesh = new CityMesh(); ballMesh.sphere(0,0,0, .45,.45,.45, [.92,.62,.24], 14, 10); ballMesh.upload();

document.getElementById('h-box').textContent = SOLIDS.length;
document.getElementById('h-abb').textContent = SOLIDS.length;

/* ---------- camera ---------- */
let yaw=.65, pitch=.58, radius=32;
const target=[0,2.8,-1];
function mat4persp(fov,asp,n,f){ const t=1/Math.tan(fov/2), o=new Float32Array(16);
  o[0]=t/asp; o[5]=t; o[10]=(f+n)/(n-f); o[11]=-1; o[14]=2*f*n/(n-f); return o; }
function mat4look(eye,c,up){ const z=norm3([eye[0]-c[0],eye[1]-c[1],eye[2]-c[2]]);
  const x=norm3(cross3(up,z)), y=cross3(z,x); const o=new Float32Array(16);
  o[0]=x[0];o[1]=y[0];o[2]=z[0];o[3]=0; o[4]=x[1];o[5]=y[1];o[6]=z[1];o[7]=0;
  o[8]=x[2];o[9]=y[2];o[10]=z[2];o[11]=0;
  o[12]=-(x[0]*eye[0]+x[1]*eye[1]+x[2]*eye[2]); o[13]=-(y[0]*eye[0]+y[1]*eye[1]+y[2]*eye[2]);
  o[14]=-(z[0]*eye[0]+z[1]*eye[1]+z[2]*eye[2]); o[15]=1; return o; }
function mat4mul(a,b){ const o=new Float32Array(16);
  for(let c=0;c<4;c++)for(let r=0;r<4;r++){ o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3]; }
  return o; }
function mat4trans(x,y,z){ const o=new Float32Array(16); o[0]=o[5]=o[10]=o[15]=1; o[12]=x;o[13]=y;o[14]=z; return o; }
function viewProj(){
  const eye=[target[0]+radius*Math.cos(pitch)*Math.sin(yaw), target[1]+radius*Math.sin(pitch), target[2]+radius*Math.cos(pitch)*Math.cos(yaw)];
  return mat4mul(mat4persp(.9, cv.width/cv.height, .1, 200), mat4look(eye,target,[0,1,0]));
}
let dragging=false, lx=0, ly=0;
cv.addEventListener('pointerdown',e=>{dragging=true;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{ if(!dragging)return;
  yaw-=(e.clientX-lx)*.008; pitch=Math.min(1.4,Math.max(.08,pitch+(e.clientY-ly)*.008)); lx=e.clientX;ly=e.clientY; });
cv.addEventListener('pointerup',()=>dragging=false);

/* ---------- physics: balls vs the AABBs ---------- */
const balls=[];
function dropBall(){
  if (balls.length>=12) balls.shift();
  balls.push({ p:[-11.5+Math.random()*1.5, 9, -1+Math.random()*2], v:[1.5+Math.random(),0,0], r:.45 });
  document.getElementById('h-ball').textContent = balls.length;
}
function collide(b,s){
  const cx=Math.max(s.lo[0],Math.min(b.p[0],s.hi[0]));
  const cy=Math.max(s.lo[1],Math.min(b.p[1],s.hi[1]));
  const cz=Math.max(s.lo[2],Math.min(b.p[2],s.hi[2]));
  let dx=b.p[0]-cx, dy=b.p[1]-cy, dz=b.p[2]-cz;
  const d2=dx*dx+dy*dy+dz*dz;
  if (d2 >= b.r*b.r) return;
  let d=Math.sqrt(d2), nx,ny,nz;
  if (d>1e-6){ nx=dx/d; ny=dy/d; nz=dz/d; }
  else {
    const px=Math.min(b.p[0]-s.lo[0], s.hi[0]-b.p[0]);
    const py=Math.min(b.p[1]-s.lo[1], s.hi[1]-b.p[1]);
    const pz=Math.min(b.p[2]-s.lo[2], s.hi[2]-b.p[2]);
    if (px<=py&&px<=pz){ nx=(b.p[0]>(s.lo[0]+s.hi[0])/2)?1:-1; ny=0; nz=0; d=-px; }
    else if (py<=pz){ ny=(b.p[1]>(s.lo[1]+s.hi[1])/2)?1:-1; nx=0; nz=0; d=-py; }
    else { nz=(b.p[2]>(s.lo[2]+s.hi[2])/2)?1:-1; nx=0; ny=0; d=-pz; }
  }
  const push=b.r-d; b.p[0]+=nx*push; b.p[1]+=ny*push; b.p[2]+=nz*push;
  const vn=b.v[0]*nx+b.v[1]*ny+b.v[2]*nz;
  if (vn<0){ const k=1.55;
    b.v[0]-=k*vn*nx; b.v[1]-=k*vn*ny; b.v[2]-=k*vn*nz;
    b.v[0]*=.985; b.v[2]*=.985;
    if (Math.abs(b.v[1])<.35 && ny>.9) b.v[1]=0;
  }
}
function step(dt){
  balls.forEach(b=>{
    b.v[1]-=22*dt;
    b.p[0]+=b.v[0]*dt; b.p[1]+=b.v[1]*dt; b.p[2]+=b.v[2]*dt;
    SOLIDS.forEach(s=>collide(b,s));
    if (b.p[1]<-8){ b.p[1]=9; b.p[0]=-11.5+Math.random()*1.5; b.v=[1.5+Math.random(),0,0]; }
  });
}

/* ---------- ui ---------- */
let mode='mesh';
document.getElementById('seg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  mode=b.dataset.m;
  document.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x===b));
});
document.getElementById('drop').onclick=dropBall;
document.getElementById('reset').onclick=()=>{ balls.length=0; document.getElementById('h-ball').textContent='0'; };
dropBall(); dropBall();

/* ---------- main loop ---------- */
let last=performance.now();
function frame(t){
  const dt=Math.min(.033,(t-last)/1000); last=t;
  step(dt);
  const vp=viewProj();
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  if (mode==='mesh'||mode==='both'){
    gl.useProgram(prog);
    drawMesh(meshPass, vp);
    balls.forEach(b=>drawMesh(ballMesh, mat4mul(vp, mat4trans(b.p[0],b.p[1],b.p[2]))));
  }
  if (mode==='solids'||mode==='both'){
    drawLines(vp, [.91,.64,.24]);
    if (mode==='solids') balls.forEach(b=>{ gl.useProgram(prog); drawMesh(ballMesh, mat4mul(vp, mat4trans(b.p[0],b.p[1],b.p[2]))); });
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
