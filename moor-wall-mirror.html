<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#111313" />
<title>MOOR · Wall Mirror Foundry</title>
<style>

:var(--muted);margin-top:2px}.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;background:#0d100f;border:1px solid #242b29;border-radius:10px}.seg button{border:0;border-radius:7px;padding:9px 8px;background:transparent;color:#97a19c;cursor:pointer}.seg button.active{background:#242a28;color:#fff;box-shadow:inset 0 0 0 1px #343c39}.profiles{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.profile{height:48px;border:1px solid #2a322f;border-radius:10px;background:#0f1211;display:grid;place-items:center;cursor:pointer;padding:0}.profile.active{border-color:#71876f;background:#1b211e;box-shadow:0 0 0 1px rgba(201,255,125,.18)}.profile span{width:22px;height:22px;border:var(--fw,3px) solid #c3b58b;border-radius:var(--fr,4px);display:block;position:relative}.profile[data-p="thin"] span{--fw:2px}.profile[data-p="wide"] span{--fw:6px}.profile[data-p="bevel"] span{--fw:5px;box-shadow:inset 0 0 0 2px #755f35}.profile[data-p="fluted"] span{--fw:6px;border-style:double}.profile[data-p="floating"] span{--fw:2px;box-shadow:0 0 0 4px #1d2421}.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin:8px 0}.row label{color:#cbd2ce;font-size:12px}.val{font-variant-numeric:tabular-nums;color:#9fe0ca;font-size:11px;min-width:48px;text-align:right}.row input[type=range]{grid-column:1/-1;width:100%;accent-color:#b7e879}.row select,.seedRow input{width:100%;background:#0c0f0e;border:1px solid #2b3431;border-radius:9px;padding:8px 9px;outline:none}.seedRow{display:grid;grid-template-columns:1fr auto;gap:7px}.btn{border:1px solid #313a37;border-radius:9px;background:#191e1c;color:#e9eeeb;padding:8px 10px;cursor:pointer}.btn:hover{background:#222825}.btn.primary{background:#d8ff9d;color:#13200d;border-color:#d8ff9d;font-weight:760}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.actions .wide{grid-column:1/-1}.metaGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.metaCell{padding:8px 9px;border:1px solid # <body>
<div class="app">
  <header class="top"><span class="mark"></span><div><div class="title">WALL MIRROR FOUNDRY</div><div class="sub">Furniture · parametric component generator</div></div><div class="grow"></div><div class="status"><i></i><span id="renderMode">WebGL</span></div></header>
  <main class="work">
    <aside class="controls">
      <div class="heroControls">
        <section class="section">
          <h2>Knob 01 · Shape</h2>
          <div class="bigKnob">
            <div><div class="knobName">Silhouette</div><div class="knobHint">Outer + mirror cut</div></div>
            <div class="seg" id="shapeSeg"><button data-shape="round">Round</button><button data-shape="rect">Rect</button></div>
          </div>
        </section>
        <section class="section">
          <h2>Knob 02 · Frame</h2>
          <div class="profiles" id="frameProfiles">
            <button class="profile" data-p="thin" title="Thin"><span></span></button>
            <button class="profile" data-p="wide" title="Wide"><span></span></button>
            <button class="profile" data-p="bevel" title="Bevel"><span></span></button>
            <button class="profile" data-p="fluted" title="Fluted"><span></span></button>
            <button class="profile" data-p="floating" title="Floating"><span></span></button>
          </div>
        </section>
        <section class="section">
          <h2>Dimensions</h2>
          <div class="row"><label for="width">Width</label><span class="val" id="widthVal"></span><input id="width" type="range" min="0.45" max="2.2" step="0.01"></div>
          <div class="row" id="heightRow"><label for="height">Height</label><span class="val" id="heightVal"></span><input id="height" type="range" min="0.45" max="2.5" step="0.01"></div>
          <div class="row"><label for="frameWidth">Frame width</label><span class="val" id="frameWidthVal"></span><input id="frameWidth" type="range" min="0.015" max="0.22" step="0.005"></div>
          <div class="row"><label for="depth">Depth</label><span class="val" id="depthVal"></span><input id="depth" type="range" min="0.018" max="0.16" step="0.002"></div>
        </section>
        <section class="section">
          <h2>Finish</h2>
          <div class="row"><label for="finish">Frame material</label><select id="finish"><option value="brass">Brushed brass</option><option value="black">Black metal</option><option value="chrome">Chrome</option><option value="walnut">Walnut</option><option value="white">Warm white</option></select></div>
          <div class="row"><label for="tint">Mirror tint</label><select id="tint"><option value="neutral">Neutral</option><option value="cool">Cool</option><option value="warm">Warm</option><option value="smoke">Smoke</option></select></div>
          <div class="seedRow"><input id="seed" value="MIRROR-001" spellcheck="false" aria-label="Seed"><button class="btn" id="randomize">Randomize</button></div>
          <details><summary>Fine controls</summary><div class="advanced">
            <div class="row" id="cornerRow"><label for="corner">Corner radius</label><span class="val" id="cornerVal"></span><input id="corner" type="range" min="0" max="0.28" step="0.01"></div>
            <div class="row"><label for="roughness">Mirror roughness</label><span class="val" id="roughVal"></span><input id="roughness" type="range" min="0" max="0.22" step="0.01"></div>
          </div></details>
        </section>
        <section class="section">
          <h2>Output</h2>
          <div class="actions"><button class="btn primary wide" id="downloadSpec">Download .moor.json</button><button class="btn" id="copySpec">Copy recipe</button><button class="btn" id="downloadPng">PNG</button></div>
          <div class="metaGrid" style="margin-top:8px"><div class="metaCell"><b id="innerSize">—</b><span>mirror opening</span></div><div class="metaCell"><b id="profileName">—</b><span>frame profile</span></div></div>
        </section>
      </div>
    </aside>
    <section class="viewport" id="viewport"><canvas id="stage"></canvas><canvas id="fallback" class="fallback"></canvas><div class="badge">Drag to orbit · wheel/pinch to zoom</div><div class="toast" id="toast"></div></section>
  </main>
</div>
