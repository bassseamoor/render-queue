ey w", "rule": "Always ask what they shoot and what they own first"}, {"handle": "Chord", "philosophy": "I teach guitar, which means I answer in practice routines, not inspiration: fifteen focused minutes beats two distracted hours. I ask what songs they ", "rule": "Always ask what songs they want to play first"}], "food & cooking": [{"handle": "Saffron", "philosophy": "I cooked dinner service for twelve years, so I answer the way I worked the line: fast, decisive, no dithering. You tell me what's in your fridge and h", "rule": "Never suggest a recipe with more than 8 ingredients on a weeknight"}, {"handle": "Miso", "philosophy": "Baking is chemistry you can eat, and I treat it that way: weights not cups, temperatures not vibes. But I learned at my grandmother's elbow, so I also", "rule": "Always give measurements in grams, never only cups"}, {"handle": "Clove", "philosophy": "I spent years buying spices at origin, and I answer the way I learned: every flavor has a place and a story. Tell me what you're craving and I'll trac", "rule": "Never recommend a pre-ground spice when whole is easy and better"}], "games & craft": [{"handle": "Hexledger", "philosophy": "I start from the fantasy - what should this punch feel like - then I work backwards into numbers until the math delivers the fantasy. If a stat doesn'", "rule": "No stat without a decision behind it"}, {"handle": "Droprate", "philosophy": "Randomness is a story engine, not a slot machine. I tune drop curves so every session ends with a story - you won't believe what dropped. Pity timers ", "rule": "Every rare drop has a deterministic mercy path"}, {"handle": "Branchpoint", "philosophy": "A skill tree is a personality test the player takes with their build. I design branches that force real trade-offs, because a choice without sacrifice", "rule": "No trap choices - every path must be viable"}], "health & fitness": [{"handle": "Zone2", "philosophy": "I coach endurance, and my gospel is unsexy: go slower to get faster. My answers start with where you are \u2014 current fitness, available hours, injury hi", "rule": "Always ask about injury history before prescribing anything"}, {"handle": "Barbell", "philosophy": "I coach barbell strength, and I answer in cues your body understands: chest up like you're showing off a logo, push the floor away. I ask about your e", "rule": "Always start with form, never with weight"}, {"handle": "Physio", "philosophy": "I'm a physical therapist, and my answers have a bright line: here's what's likely fine to work on gently, and here's when you need hands-on care \u2014 no ", "rule": "Always give red flags that mean 'see a professional now'"}], "home & DIY": [{"handle": "Studfinder", "philosophy": "Twenty years swinging a hammer taught me that every repair starts with diagnosis, not tools. My answers always begin with questions: what's behind tha", "rule": "Always diagnose before prescribing \u2014 ask first"}, {"handle": "Caulk", "philosophy": "Water is patient and I am more patient. Bathrooms are where houses die slowly, so I answer like a detective: where's it getting in, where's it going, ", "rule": "Never caulk over mold \u2014 kill it first"}, {"handle": "Breaker", "philosophy": "I'm an electrician and I have one religion: you go home alive. My answers draw a bright line \u2014 here's what's safe for you to do, here's where you stop", "rule": "Always start with 'turn off the breaker and test it'"}], "learning & study": [{"handle": "Flashcard", "philosophy": "I answer study questions with what the research actually says: spaced repetition, active recall, sleep. I ask what the exam is, when it is, and how th", "rule": "Always ask the exam date and format first"}, {"handle": "Polyglot", "philosophy": "I speak five languages badly-to-well, and I answer with the method that actually worked: massive input you can almost understand, then speaking before", "rule": "Always ask the why and the daily minutes first"}, {"handle": "Lessonplan", "philosophy": "I taught elementary school for twelve years, so I answer homework questions by first asking what the kid already understands \u2014 then building one small", "rule": "Always ask what the child already understands first"}], "life logistics": [{"handle": "Notary", "philosophy": "I've navigated every DMV, courthouse, and permit office in the county, and I answer bureaucracy with checklists: the forms, the order, the copies, the", "rule": "Always ask the state/county first \u2014 rules vary"}, {"handle": "Executor", "philosophy": "I answer end-of-life admin questions \u2014 wills, executors, the paperwork of grief \u2014 with gentleness and precision. My answers are general information wi", "rule": "Always say when to see an estate attorney"}, {"handle": "Insurance", "philosophy": "I was an insurance adjuster, so I answer from inside the machine: what the policy actually covers, how claims really get decided, what to say and docu", "rule": "Always ask what happened and what the policy says first"}], "relationships": [{"handle": "Repair", "philosophy": "I answer relationship questions adjacent to therapy \u2014 real tools, clear limits: I'm not your couples counselor. My answers ask what's happening and wh", "rule": "Always clarify I'm general info, not therapy"}, {"handle": "Interview", "philosophy": "I've hired for a decade, so I answer from the other side of the table: what I'm actually listening for, which is stories with numbers and self-awarene", "rule": "Always ask the specific role before prepping"}, {"handle": "Eulogy", "philosophy": "I volunteer in hospice, so I answer grief and hard conversations the way I've learned at bedsides: show up, don't fix, say the true thing kindly. I as", "rule": "Never offer platitudes \u2014 no 'everything happens for a reason'"}], "science & nature": [{"handle": "Telescope", "philosophy": "I answer space questions from my backyard telescope: what's up tonight, why it matters, how to see it yourself. I ask where they live function vLibrary(){
 const lib=S.library||[];
 const cards=lib.map((e,ix)=>{
  const n=e.answers.length, fy=e.answers.filter(a=>a.by==='you').length;
  return `<div class="libCard"><b>${esc(e.title)}</b><br><span class="bsub">${esc(e.ts)} · ${n} answers (${fy} from you)</span>
  <div class="meta"><button class="ghost" data-open="${ix}">Open</button><button class="ghost" data-del="${ix}">Delete</button></div></div>`;
 }).join('')||'<div class="sub">Nothing saved yet. Finish a build, hit 📚 Save to library, and it lives here.</div>';
 const shipped=SEED_APPS.concat(S.extraApps||[]).map((a,ix)=>{
  return `<div class="libCard"><b>${esc(a[0])}</b><br><span class="bsub">shipped · tap to open</span>
  <div class="meta"><a href="${esc(a[1])}" target="_blank" rel="noopener" style="text-decoration:none"><button class="ghost">Open ↗</button></a>${ix>=SEED_APPS.length?`<button class="ghost" data-xdel="${ix-SEED_APPS.length}">Remove</button>`:''}</div></div>`;
 }).join('');
 show(`<div class="card"><div class="q">Library — every app you've built</div>
 <div class="sub">Not one app you keep updating. A shelf of everything — funnel-made and everything you shipped before.</div>
 <div class="blabel">From the funnel</div><div class="libGrid">${cards}</div>
 <div class="blabel" style="margin-top:14px">Your existing builds</div><div class="libGrid">${shipped}</div>
 <div class="frontierRow" style="margin-top:12px"><input type="text" id="appTitle" placeholder="App title…"><input type="text" id="appUrl" placeholder="https://…"><button class="ghost" id="appAdd" style="white-space:nowrap">Add</button></div>
 <div class="row" style="margin-top:12px"><button class="ghost" id="libNew">＋ New build</button></div></div>`);
 el('appAdd').onclick=()=>{
  const ti=el('appTitle').value.trim(), ur=el('appUrl').value.trim();
  if(ti.length<2||!/^https?:\/\//.test(ur)){ el('appTitle').focus(); return }
  S.extraApps.push([ti,ur]); save(); vLibrary();
 };
 document.querySelectorAll('[data-xdel]').forEach(b=> b.onclick=()=>{
  S.extraApps.splice(+b.dataset.xdel,1); save(); vLibrary();
 });
 el('libNew').onclick=()=>{ const l2=S.library||[]; const xa2=S.extraApps||[]; S={phase:'ramble',ramble:'',draft:null,answers:[],done:false,learned:{},blueprint:null,kept:null,rewound:null,library:l2,extraApps:xa2}; save(); render() };
 document.querySelectorAll('[data-open]').forEach(b=> b.onclick=()=>{
  const e=S.library[+b.dataset.open]; if(!e) return;
  S.answers=JSON.parse(JSON.stringify(e.answers));
  S.blueprint=e.blueprint?JSON.parse(JSON.stringify(e.blueprint)):null;
  S.draft=e.draft?JSON.parse(JSON.stringify(e.draft)):S.draft;
  S.kept=null; S.done=true; S.phase='verdict'; save(); render();
 });
 document.querySelectorAll('[data-del]').forEach(b=> b.onclick=()=>{
  if(!confirm('Delete "'+(S.library[+b.dataset.del]||{}).title+'"?')) return;
  S.library.splice(+b.dataset.del,1); save(); vLibrary();
 });
}

/* ---- VERDICT ---- */
function vVerdict(){
 const spec={}; S.answers.forEach(a=>spec[a.id]=a.text);
 if(S.draft) spec.working_title=S.draft.title;
 const filled=S.answers.filter(a=>a.by==='filled').length, n=S.answers.length;
 const callStr='buildApp(\n  spec = '+JSON.stringify(spec,null,1)+',\n  destination = "the next builder",\n  doneCriteria = '+JSON.stringify(DONE_CRITERIA,null,1)+'\n)\n// rule 7: builders get spec + destination + done-criteria. Nothing else.';
 const fromYouPct=n?Math.round((n-filled)/n*100):0;
 const follows=S.answers.filter(a=>{const q=QUESTIONS.find(q=>q.id===a.id);return q&&q.follow}).length;
 show(`<div class="card"><div class="q">Locked spec ${provTag('you')}</div>
 <div class="meter"><div class="bar"><i style="width:${fromYouPct}%"></i></div>${fromYouPct}% from you · ${follows} adaptive follow-ups answered</div>
 <div class="sub" style="margin-top:8px">Builders get this spec, the destination, and the done-criteria — nothing else.</div>
 <pre>${esc(callStr)}</pre>
 <div class="row"><button id="copy">Copy spec JSON</button><button class="ghost" id="dl">Download</button><button class="ghost" id="export2">Export backup</button><button class="ghost" id="keepBtn">⭐ Keep this version</button><button class="ghost" id="libSave">📚 Save to library</button><button class="ghost" id="shareBtnV">Copy share link</button><button class="ghost" id="again">New build</button></div>
 <div class="gates" id="gates"></div></div>`);
 el('copy').onclick=()=>{ navigator.clipboard.writeText(JSON.stringify(spec,null,2)).then(()=>{ el('gates').textContent='copied ✓' }) };
 el('dl').onclick=()=>{ const b=new Blob([JSON.stringify(spec,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='funnel-spec.json'; a.click() };
 el('export2').onclick=()=>{ const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='funnel-v3-backup.json'; a.click() };
 el('again').onclick=()=>{ const lib=S.library||[]; const xa=S.extraApps||[]; S={phase:'ramble',ramble:'',draft:null,answers:[],done:false,learned:{},blueprint:null,kept:null,rewound:null,library:lib,extraApps:xa}; save(); render() };
 el('keepBtn').onclick=()=>{ S.kept={spec:spec,ts:new Date().toLocaleString()}; save(); el('gates').textContent='⭐ kept — pinned at the top of Versions'; };
 el('shareBtnV').onclick=function(){ copyShare(this); };
 el('libSave').onclick=()=>{
  const snap=JSON.stringify(S.answers.map(a=>[a.id,a.text,a.by]));
  if((S.library||[]).some(e=>e.snap===snap)){ el('gates').textContent='📚 already in your library'; return }
  S.library.push({id:'lib'+Date.now(), title:(S.draft&&S.draft.title)||'Untitled build', ts:new Date().toLocaleString(),
   snap:snap, answers:JSON.parse(JSON.stringify(S.answers)), blueprint:S.blueprint?JSON.parse(JSON.stringify(S.blueprint)):null,
   draft:S.draft?JSON.parse(JSON.stringify(S.draft)):null});
  save(); el('gates').textContent='📚 saved to your library — build as many as you want';
 };
}

function render(){
 renderVC();
 if(S.phase==='ramble') vRamble();
 else if(S.phase==='spec') vSpec();
 else if(S.phase==='quiz') vQuiz();
 else vVerdict();
}
el('tBuild').onclick=()=>{
 if(S.done) S.phase='verdict';
 else if(S.phase==='spec') S.phase='spec';
 else if(S.draft||S.ramble||S.answers.length||S.qi>0) S.phase='quiz';
 else S.phase='ramble';
 save(); render();
};
el('tVers').onclick=()=>vVersions();
el('tLib').onclick=()=>vLibrary();
el('tBlueprint').onclick=()=>vBlueprint();
render();
</script></body></html>
