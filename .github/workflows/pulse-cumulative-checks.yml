name: Pulse cumulative checks
on:
  push:
    paths:
      - 'moor-capability-memory.js'
      - 'pulse-capability-memory.html'
      - 'pulse-spine.js'
      - 'pulse-component-extensions.js'
      - 'pulse-manifest.json'
      - 'pulse-dashboard.html'
      - 'pulse-version.txt'
      - 'blueprint/pulse-cumulative-reconsideration.blueprint.json'
      - 'tests/pulse-cumulative-reconsideration-ultra-run.cjs'
      - 'tests/refinery-creation-deck-checks.cjs'
      - '.github/workflows/pulse-cumulative-checks.yml'
  pull_request:
    paths:
      - 'moor-capability-memory.js'
      - 'pulse-capability-memory.html'
      - 'pulse-spine.js'
      - 'pulse-component-extensions.js'
      - 'pulse-manifest.json'
      - 'pulse-dashboard.html'
      - 'pulse-version.txt'
      - 'blueprint/pulse-cumulative-reconsideration.blueprint.json'
      - 'tests/pulse-cumulative-reconsideration-ultra-run.cjs'
      - 'tests/refinery-creation-deck-checks.cjs'
      - '.github/workflows/pulse-cumulative-checks.yml'
jobs:
  cumulative:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check cumulative memory syntax
        run: node --check moor-capability-memory.js
      - name: Check Pulse spine syntax
        run: node --check pulse-spine.js
      - name: Verify cumulative blueprint through Ultra Funnel
        run: node tests/pulse-cumulative-reconsideration-ultra-run.cjs
      - name: Verify cumulative Refinery behavior and Pulse wiring
        run: node tests/refinery-creation-deck-checks.cjs
