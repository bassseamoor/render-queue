name: Publish Pulse

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulse-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check published bundle
        run: |
          node tests/funnel-checks.cjs
          node tests/blueprint-checks.cjs
          node tests/pulse-checks.cjs
          node tests/wonder-haven-checks.cjs
          node tests/wonder-scroll-checks.cjs
          node tests/procedural-assets-checks.mjs
          node tests/procedural-scene-checks.mjs
          node scripts/run-procedural-quiz.cjs
          node tests/effects-checks.cjs
          node tests/effects-workbench-checks.cjs
          node tests/funnel-kernel-checks.cjs
          node tests/canvas-mix-checks.cjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: pulse-pages-${{ github.run_id }}-${{ github.run_attempt }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish checked Pulse
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: pulse-pages-${{ github.run_id }}-${{ github.run_attempt }}




