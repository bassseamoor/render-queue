      - 'funnel-law-*.js'
      - 'funnel-receipt-core.js'
      - 'funnel-capability-core.js'
      - 'funnel-budget-core.js'
      - 'funnel-consensus-core.js'
      - 'funnel-case-runtime.js'
      - 'funnel-society-core.js'
      - 'funnel-package-registry.js'
      - 'funnel-promotion-core.js'
      - 'funnel-resource-governor.js'
      - 'funnel-maintenance-state.js'
      - 'funnel-maintenance-status.json'
      - 'build_pulse_v2.py'
      - 'funnel-environment*.js'
      - 'funnel-environment.html'
      - 'environment-engine*.js'
      - 'environment-engine.html'
      - 'quick-notes*.js'
      - 'quick-notes.html'
