name: Pulse recovery checks
on:
  push:
    paths: ['pulse-*.js', 'wonder-*.js', 'wonder-feed.html', 'pulse-dashboard.html', 'pulse-version.txt', 'moor-blueprint.html', 'blueprint/**', 'tests/*.cjs', '.github/workflows/pulse-checks.yml']
  pull_request:
    paths: ['pulse-*.js', 'wonder-*.js', 'wonder-feed.html', 'pulse-dashboard.html', 'pulse-version.txt', 'moor-blueprint.html', 'blueprint/**', 'tests/*.cjs', '.github/workflows/pulse-checks.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/pulse-checks.cjs
      - run: node tests/blueprint-checks.cjs
      - run: node tests/funnel-checks.cjs
      - run: node tests/wonder-haven-checks.cjs
