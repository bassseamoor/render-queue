name: Pulse recovery checks
on:
  push:
    paths: ['more-canvas.html', 'moor-canvas-mix.js', 'pulse-*.js', 'wonder-*.js', 'wonder-feed.html', 'pulse-dashboard.html', 'moor-luxe.css', 'moor-luxe.js', 'pulse-funnel-fabric-library.json', 'quiz-funnel-v3.html', 'moor-harness-runtime-v1.html', 'pulse-capability-memory.html', 'pulse-creation-deck.css', 'pulse-beam-standards.html', 'pulse-beam-funnel-hall.html', 'pulse-beam.css', 'funnel-capability-handoff.js', 'moor-capability-refinery.js', 'moor-capability-memory.js', 'moor-assembly-core.js', 'pulse-version.txt', 'moor-blueprint.html', 'funnel-kernel.js', 'FUNNEL.md', 'BUSTER.md', 'MOOR-WORLDBUILDING.md', 'moor-agent.json', 'blueprint/**', 'tests/*.cjs', 'funnel-law-*.js', 'funnel-receipt-core.js', 'funnel-capability-core.js', 'funnel-budget-core.js', 'funnel-consensus-core.js', 'funnel-case-runtime.js', 'funnel-society-core.js', 'funnel-package-registry.js', 'funnel-promotion-core.js', 'funnel-resource-governor.js', 'funnel-environment*.js', 'funnel-environment.html', 'funnel-foundry-core.js', 'sebastian-solver-core.js', '.github/workflows/pulse-checks.yml']
  pull_request:
    paths: ['more-canvas.html', 'moor-canvas-mix.js', 'pulse-*.js', 'wonder-*.js', 'wonder-feed.html', 'pulse-dashboard.html', 'moor-luxe.css', 'moor-luxe.js', 'pulse-funnel-fabric-library.json', 'pulse-version.txt', 'moor-blueprint.html', 'funnel-kernel.js', 'FUNNEL.md', 'BUSTER.md', 'MOOR-WORLDBUILDING.md', 'moor-agent.json', 'blueprint/**', 'tests/*.cjs', '.github/workflows/pulse-checks.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/pulse-checks.cjs
      - run: node tests/blueprint-checks.cjs
      - run: node tests/funnel-checks.cjs
      - run: node tests/funnel-environment-checks.cjs
      - run: node --input-type=module --check < funnel-environment.js
      - run: node tests/funnel-kernel-checks.cjs
      - run: node tests/moor-funnel-citadel-v44-run.cjs
      - run: node tests/moor-funnel-citadel-checks.cjs
      - run: node --input-type=module --check < pulse-beam-funnel-hall.js
      - run: node tests/pulse-beam-six-hour-citadel-run.cjs
      - run: node tests/pulse-beam-laser-citadel-checks.cjs
      - run: node tests/sebastian-solver-checks.cjs
      - run: node tests/funnel-fabric-meta-run.cjs
      - run: node tests/funnel-law-ultra-meta-run.cjs
      - run: node tests/funnel-law-ultra-checks.cjs
      - run: node tests/funnel-maintenance-checks.cjs
      - run: node tests/software-manufacturing-checks.cjs
      - run: node tests/grounded-readiness-ultra-run.cjs
      - run: node tests/pulse-luxe-ultra-run.cjs
      - run: node tests/pulse-luxe-ui-checks.cjs
      - run: node tests/capability-crystallizer-ultra-run.cjs
      - run: node tests/pulse-creation-deck-ultra-run.cjs
      - run: node tests/refinery-creation-deck-checks.cjs
      - run: node tests/pulse-beam-ultra-run.cjs
      - run: node tests/pulse-beam-checks.cjs
      - run: node --check pulse-beam.js
      - run: node --check pulse-beam-audit.js
      - run: node --check pulse-beam-component-adapter.js
      - run: node tests/funnel-runtime-checks.cjs
      - run: node tests/harness-funnel-gate-checks.cjs
      - run: node tests/wonder-haven-checks.cjs
      - run: node tests/canvas-mix-checks.cjs
