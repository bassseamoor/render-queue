name: Pulse recovery checks
on:
  push:
    paths: ['more-canvas.html', 'moor-canvas-mix.js', 'pulse-*.js', 'wonder-*.js', 'wonder-feed.html', 'pulse-dashboard.html', 'quiz-funnel-v3.html', 'pulse-version.txt', 'moor-blueprint.html', 'funnel-kernel.js', 'FUNNEL.md', 'BUSTER.md', 'moor-agent.json', 'blueprint/**', 'tests/*.cjs', '.github/workflows/pulse-checks.yml']
  pull_request:
    paths: ['more-canvas.html', 'moor-canvas-mix.js', 'pulse-*.js', 'wonder-*.js', 'wonder-feed.html', 'pulse-dashboard.html', 'pulse-version.txt', 'moor-blueprint.html', 'funnel-kernel.js', 'FUNNEL.md', 'BUSTER.md', 'moor-agent.json', 'blueprint/**', 'tests/*.cjs', '.github/workflows/pulse-checks.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/pulse-checks.cjs
      - run: node tests/blueprint-checks.cjs
      - run: node tests/funnel-checks.cjs
      - run: node tests/funnel-kernel-checks.cjs
      - run: node tests/funnel-runtime-checks.cjs
      - run: node tests/wonder-haven-checks.cjs
      - run: node tests/canvas-mix-checks.cjs
