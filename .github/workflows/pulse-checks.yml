      - '.github/workflows/moor-auto-release.yml'
      - 'scripts/moor-auto-release-policy.cjs'
      - 'auto-release-contract.json'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m py_compile build_pulse_v2.py
      - run: node tests/pulse-checks.cjs
      - run: node tests/blueprint-checks.cjs
      - run: node tests/funnel-checks.cjs
      - run: node tests/funnel-environment-checks.cjs
      - run: node --check environment-engine-core.js
      - run: node --check environment-engine-render.js
      - run: node tests/environment-engine-funnel-run.cjs
      - run: node tests/environment-engine-checks.cjs
      - run: node --check quick-notes-core.js
      - run: node tests/quick-notes-funnel-run.cjs
      - run: node tests/quick-notes-checks.cjs
      - run: node --check moor-local-files.js
      - run: node tests/local-app-storage-funnel-run.cjs
      - run: node tests/local-app-storage-checks.cjs
      - run: node tests/trajectory-hydration-funnel-run.cjs
      - run: node tests/trajectory-hydration-checks.cjs
      - run: node --check dev-feed-core.js
      - run: node tests/dev-feed-funnel-run.cjs
      - run: node tests/dev-feed-checks.cjs
      - run: node tests/worker-response-sop-funnel-run.cjs
      - run: node tests/worker-response-sop-checks.cjs
      - run: node tests/auto-release-funnel-run.cjs
      - run: node tests/auto-release-checks.cjs
      - run: node --input-type=module --check < funnel-environment.js
      - run: node tests/funnel-kernel-checks.cjs
      - run: node tests/moor-funnel-citadel-v44-run.cjs
      - run: node tests/moor-funnel-citadel-checks.cjs
      - run: node --input-type=module --check < pulse-beam-funnel-hall.js
      - run: node tests/pulse-beam-six-hour-citadel-run.cjs
      - run: node tests/pulse-beam-laser-citadel-checks.cjs
      - run: node tests/sebastian-solver-checks.cjs
      - run: node tests/funnel-fabric-meta-run.cjs
      - run: node tests/funnel-law-ultra-meta-run.cjs
      - run: node tests/funnel-law-ultra-checks.cjs
      - run: node tests/funnel-maintenance-checks.cjs
      - run: node tests/software-manufacturing-checks.cjs
      - run: node tests/software-manufacturing-machine-ultra-run.cjs
      - run: node tests/software-factory-core-checks.cjs
      - run: node tests/factory-twin-core-checks.cjs
      - run: node tests/moor-request-factory-checks.cjs
      - run: node tests/factory-accumulation-checks.cjs
      - run: node tests/grounded-readiness-ultra-run.cjs
      - run: node tests/blueprint-farm-ultra-run.cjs
      - run: node tests/blueprint-farm-checks.cjs
      - run: node tests/blueprint-choreography-core-checks.cjs
      - run: node tests/blueprint-comparison-core-checks.cjs
      - run: node tests/dt06-blueprint-funnel-run.cjs
      - run: node tests/dt06-blueprint-standard-checks.cjs
      - run: node tests/citadel-v2-blueprint-funnel-run.cjs
      - run: node tests/citadel-v2-blueprint-checks.cjs --registered
      - run: node tests/slice-release-ledger-checks.cjs
      - run: node tests/owner-start-building-funnel-run.cjs
      - run: node tests/funnel-mechanism-inventory-checks.cjs
      - run: node tests/funnel-exercise-map-checks.cjs
      - run: node tests/procedural-generator-inventory-checks.cjs
      - run: node tests/procedural-recipe-core-checks.cjs
      - run: node tests/pg03-blueprint-funnel-run.cjs
      - run: node tests/pg03-blueprint-standard-checks.cjs
      - run: node tests/worker-release-core-checks.cjs
      - run: node tests/worker-reservation-core-checks.cjs
      - run: node tests/maintenance-receipt-core-checks.cjs
      - run: node tests/pulse-luxe-ultra-run.cjs
      - run: node tests/pulse-luxe-ui-checks.cjs
      - run: node tests/capability-crystallizer-ultra-run.cjs
      - run: node tests/pulse-creation-deck-ultra-run.cjs
      - run: node tests/refinery-creation-deck-checks.cjs
      - run: node tests/pulse-beam-ultra-run.cjs
      - run: node tests/pulse-beam-checks.cjs
      - run: node --check pulse-beam.js
      - run: node --check pulse-beam-audit.js
      - run: node --check pulse-beam-component-adapter.js
      - run: node tests/funnel-runtime-checks.cjs
      - run: node tests/harness-funnel-gate-checks.cjs
      - run: node tests/wonder-haven-checks.cjs
      - run: node tests/canvas-mix-checks.cjs

  maintenance-sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect critical software-factory stations independently
        run: node tests/funnel-maintenance-sweep.cjs
      - name: Verify Blueprint Farm independently
        run: node tests/blueprint-farm-ultra-run.cjs && node tests/blueprint-farm-checks.cjs
