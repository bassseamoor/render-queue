name: Evergreen Library World checks

on:
  push:
    branches: ["funnel/evergreen-public-library-world", "main"]
    paths:
      - "morverse-evergreen-library.html"
      - "morverse-evergreen-library.js"
      - "blueprints/evergreen-public-library-world.json"
      - "pulse-component-extensions.js"
      - "pulse-manifest.json"
      - "pulse-workspace.js"
      - "tests/evergreen-library-checks.cjs"
      - "funnel-kernel.js"
      - ".github/workflows/evergreen-library-checks.yml"
  pull_request:
    paths:
      - "morverse-evergreen-library.html"
      - "morverse-evergreen-library.js"
      - "blueprints/evergreen-public-library-world.json"
      - "pulse-component-extensions.js"
      - "pulse-manifest.json"
      - "pulse-workspace.js"
      - "tests/evergreen-library-checks.cjs"
      - "funnel-kernel.js"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/evergreen-library-checks.cjs
      - run: node tests/funnel-kernel-checks.cjs
      - run: node tests/pulse-checks.cjs
