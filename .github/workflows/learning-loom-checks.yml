name: Learning Loom and Funnel usage-plan checks
on:
  push:
    paths:
      - 'funnel-usage-plan-core.js'
      - 'funnel-kernel.js'
      - 'funnel-law-core.js'
      - 'FUNNEL.md'
      - 'moor-agent.json'
      - 'pulse-learning-spine-blueprints.json'
      - 'blueprint/evergreen-learning-loom.blueprint.json'
      - 'moor-learning-loom.js'
      - 'pulse-learning-loom.html'
      - 'pulse-component-extensions.js'
      - 'pulse-manifest.json'
      - 'pulse-dashboard.html'
      - 'pulse-version.txt'
      - 'tests/funnel-usage-plan-checks.cjs'
      - 'tests/funnel-kernel-checks.cjs'
      - 'tests/learning-loom-checks.cjs'
      - 'tests/evergreen-learning-loom-ultra-run.cjs'
      - '.github/workflows/learning-loom-checks.yml'
  pull_request:
    paths:
      - 'funnel-usage-plan-core.js'
      - 'funnel-kernel.js'
      - 'funnel-law-core.js'
      - 'FUNNEL.md'
      - 'moor-agent.json'
      - 'pulse-learning-spine-blueprints.json'
      - 'blueprint/evergreen-learning-loom.blueprint.json'
      - 'moor-learning-loom.js'
      - 'pulse-learning-loom.html'
      - 'pulse-component-extensions.js'
      - 'pulse-manifest.json'
      - 'pulse-dashboard.html'
      - 'pulse-version.txt'
      - 'tests/funnel-usage-plan-checks.cjs'
      - 'tests/funnel-kernel-checks.cjs'
      - 'tests/learning-loom-checks.cjs'
      - 'tests/evergreen-learning-loom-ultra-run.cjs'
      - '.github/workflows/learning-loom-checks.yml'
jobs:
  learning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check funnel-usage-plan-core.js
      - run: node --check funnel-kernel.js
      - run: node --check funnel-law-core.js
      - run: node --check moor-learning-loom.js
      - run: node tests/funnel-usage-plan-checks.cjs
      - run: node tests/funnel-kernel-checks.cjs
      - run: node tests/funnel-law-ultra-checks.cjs
      - run: node tests/learning-loom-checks.cjs
      - run: node tests/evergreen-learning-loom-ultra-run.cjs
      - run: node tests/pulse-checks.cjs
