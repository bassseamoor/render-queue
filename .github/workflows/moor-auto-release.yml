name: MOOR Auto Release

on:
  workflow_run:
    workflows:
      - "Pulse recovery checks"
      - "Pulse cumulative checks"
      - "Pulse learning + planned Funnel checks"
      - "Learning Loom and Funnel usage-plan checks"
      - "Evergreen Library World checks"
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: moor-auto-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted main policy only
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Evaluate and release eligible PR
        uses: actions/github-script@v9
        with:
          script: |
            const policy = require('./scripts/moor-auto-release-policy.cjs');
            const { owner, repo } = context.repo;
            const refs = context.payload.workflow_run.pull_requests || [];
            if (!refs.length) {
              core.info('No pull request associated with this workflow run.');
              return;
            }

            for (const ref of refs) {
              const { data: pr } = await github.rest.pulls.get({
                owner, repo, pull_number: ref.number
              });

              const parsed = policy.parse(pr.body);
              if (!parsed.enabled) {
                if (parsed.error) core.warning(parsed.error);
                continue;
              }
              const metaCheck = policy.metadataValid(parsed.metadata);
              if (!metaCheck.ok) {
                core.warning('Auto-release metadata invalid: ' + metaCheck.errors.join('; '));
                continue;
              }
              if (pr.state !== 'open' || pr.draft) {
                core.info('PR #' + pr.number + ' is not an open ready PR.');
                continue;
              }
              if (!pr.head || !pr.head.repo || pr.head.repo.full_name !== context.repo.owner + '/' + context.repo.repo) {
                core.warning('Fork/external PRs are not eligible for MOOR auto-release.');
                continue;
              }
              if (!pr.base || pr.base.ref !== 'main') {
                core.warning('Auto-release only targets main.');
                continue;
              }

              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner, repo, pull_number: pr.number, per_page: 100
              });
              const pathGate = policy.evaluatePaths(files.map(f => f.filename));
              if (!pathGate.ok) {
                core.warning('Authority-sensitive paths require manual release: ' + pathGate.blocked.join(', '));
                continue;
              }

              if (pr.mergeable_state === 'behind') {
                core.info('PR #' + pr.number + ' is stale; updating from main and waiting for fresh CI.');
                await github.request('PUT /repos/{owner}/{repo}/pulls/{pull_number}/update-branch', {
                  owner, repo, pull_number: pr.number, expected_head_sha: pr.head.sha
                });
                continue;
              }
              if (['dirty','blocked','draft'].includes(String(pr.mergeable_state || ''))) {
                core.warning('PR #' + pr.number + ' is not mergeable: ' + pr.mergeable_state);
                continue;
              }
              if (!['clean','unstable','has_hooks','unknown',null].includes(pr.mergeable_state)) {
                core.info('PR #' + pr.number + ' mergeability not ready: ' + pr.mergeable_state);
                continue;
              }

              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner, repo, head_sha: pr.head.sha, event: 'pull_request', per_page: 100
              });
              const gate = policy.workflowGate(runs);
              if (!gate.ready) {
                core.info('PR #' + pr.number + ' waiting: ' + gate.reason +
                  (gate.pending.length ? ' pending=' + gate.pending.join(',') : '') +
                  (gate.failed.length ? ' failed=' + gate.failed.join(',') : ''));
                continue;
              }

              const current = await github.rest.pulls.get({owner, repo, pull_number: pr.number});
              if (current.data.head.sha !== pr.head.sha) {
                core.info('Head moved while evaluating; wait for fresh CI.');
                continue;
              }
              if (current.data.mergeable_state === 'behind') {
                core.info('Base moved while evaluating; updating branch.');
                await github.request('PUT /repos/{owner}/{repo}/pulls/{pull_number}/update-branch', {
                  owner, repo, pull_number: pr.number, expected_head_sha: current.data.head.sha
                });
                continue;
              }

              const merged = await github.rest.pulls.merge({
                owner,
                repo,
                pull_number: pr.number,
                merge_method: 'squash',
                sha: pr.head.sha,
                commit_title: pr.title,
                commit_message: 'MOOR Auto Release: Funnel/CI-gated same-repo release.'
              });
              if (!merged.data.merged) {
                core.warning('GitHub declined merge: ' + (merged.data.message || 'unknown reason'));
                continue;
              }

              const at = new Date().toISOString();
              const receipt = policy.receipt({
                pr,
                metadata: parsed.metadata,
                mergeSha: merged.data.sha,
                workflowRuns: runs,
                at
              });
              const receiptPath = 'dev-feed/events/' + policy.dateStamp(at) +
                '-pr-' + pr.number + '-auto-release.json';
              await github.rest.repos.createOrUpdateFileContents({
                owner,
                repo,
                path: receiptPath,
                message: 'Auto-release receipt for PR #' + pr.number,
                content: Buffer.from(JSON.stringify(receipt, null, 2) + '\n').toString('base64'),
                branch: 'main'
              });

              const trajectory = policy.trajectoryCheckpoint({
                pr,
                metadata: parsed.metadata,
                mergeSha: merged.data.sha,
                at
              });
              if (trajectory) {
                const trajectoryPath = 'trajectory/events/' + policy.dateStamp(at) +
                  '-pr-' + pr.number + '-auto-release.json';
                await github.rest.repos.createOrUpdateFileContents({
                  owner,
                  repo,
                  path: trajectoryPath,
                  message: 'Auto-release Trajectory checkpoint for PR #' + pr.number,
                  content: Buffer.from(JSON.stringify(trajectory, null, 2) + '\n').toString('base64'),
                  branch: 'main'
                });
              }

              core.notice('MOOR auto-released PR #' + pr.number + ' at ' + merged.data.sha);
            }
