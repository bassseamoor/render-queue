name: Repair AWE inline syntax
on:
  push:
    branches: [pulse-publish-repair]
    paths: ['.github/workflows/repair-awe-inline.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pulse-publish-repair
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove accidental line-continuation slashes from every AWE card copy
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='pulse-dashboard.html';
          let s=fs.readFileSync(p,'utf8'),cursor=0,count=0;
          while(true){
            const a=s.indexOf("{id:'awe'",cursor); if(a<0) break;
            const b=s.indexOf("{id:'comp-asset-vault'",a); if(b<0) throw new Error('AWE card end not found');
            const before=s.slice(a,b),fixed=before.replace(/\\\r?\n/g,'\n');
            if(fixed!==before){s=s.slice(0,a)+fixed+s.slice(b);count++;cursor=a+fixed.length}else cursor=b;
          }
          if(!count) throw new Error('No accidental AWE continuations found');
          fs.writeFileSync(p,s);console.log('repaired AWE copies',count);
          NODE
          node tests/pulse-checks.cjs
      - name: Commit repair
        run: |
          git config user.name "pulse-repair-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pulse-dashboard.html
          git commit -m "Repair embedded AWE card syntax blocking Pulse publish"
          git push origin HEAD:pulse-publish-repair
