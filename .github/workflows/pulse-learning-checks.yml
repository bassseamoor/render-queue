name: Pulse learning + planned Funnel checks
on:
  push:
    paths:
      - 'funnel-usage-plan-core.js'
      - 'funnel-kernel.js'
      - 'funnel-law-core.js'
      - 'moor-request.js'
      - 'FUNNEL.md'
      - 'moor-agent.json'
      - 'quiz-funnel-v3.html'
      - 'moor-learning-loom.js'
      - 'pulse-learning-loom.html'
      - 'blueprint/evergreen-learning-loom.blueprint.json'
      - 'pulse-component-extensions.js'
      - 'pulse-manifest.json'
      - 'pulse-dashboard.html'
      - 'pulse-version.txt'
      - 'pulse-learning-spine-blueprints.json'
      - 'tests/evergreen-learning-loom-checks.cjs'
      - 'tests/evergreen-learning-loom-funnel-run.cjs'
      - 'tests/funnel-kernel-checks.cjs'
      - 'tests/funnel-runtime-checks.cjs'
      - 'tests/moor-request-checks.cjs'
      - '.github/workflows/pulse-learning-checks.yml'
  pull_request:
    paths:
      - 'funnel-usage-plan-core.js'
      - 'funnel-kernel.js'
      - 'funnel-law-core.js'
      - 'moor-request.js'
      - 'FUNNEL.md'
      - 'moor-agent.json'
      - 'quiz-funnel-v3.html'
      - 'moor-learning-loom.js'
      - 'pulse-learning-loom.html'
      - 'blueprint/evergreen-learning-loom.blueprint.json'
      - 'pulse-component-extensions.js'
      - 'pulse-manifest.json'
      - 'pulse-dashboard.html'
      - 'pulse-version.txt'
      - 'pulse-learning-spine-blueprints.json'
      - 'tests/evergreen-learning-loom-checks.cjs'
      - 'tests/evergreen-learning-loom-funnel-run.cjs'
      - 'tests/funnel-kernel-checks.cjs'
      - 'tests/funnel-runtime-checks.cjs'
      - 'tests/moor-request-checks.cjs'
      - '.github/workflows/pulse-learning-checks.yml'
jobs:
  learning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check funnel-usage-plan-core.js
          node --check funnel-kernel.js
          node --check funnel-law-core.js
          node --check moor-request.js
          node --check moor-learning-loom.js
      - name: Planned v44 kernel
        run: node tests/funnel-kernel-checks.cjs
      - name: Funnel runtime wiring
        run: node tests/funnel-runtime-checks.cjs
      - name: MOOR request routing
        run: node tests/moor-request-checks.cjs
      - name: Learning Loom behavior
        run: node tests/evergreen-learning-loom-checks.cjs
      - name: Learning Loom Funnel execution
        run: node tests/evergreen-learning-loom-funnel-run.cjs
      - name: Pulse dashboard recovery smoke
        run: node tests/pulse-checks.cjs
