name: MOOR request entry checks

on:
  push:
    branches:
      - main
      - funnel/universal-request-entry
    paths:
      - "AGENTS.md"
      - "FUNNEL.md"
      - "moor-agent.json"
      - "moor-request.js"
      - "pulse-dashboard.html"
      - "pulse-spine.js"
      - "pulse-workspace.js"
      - "quiz-funnel-v3.html"
      - "tests/pulse-checks.cjs"
      - "tests/moor-request-checks.cjs"
      - ".github/workflows/moor-request-checks.yml"
  pull_request:
    paths:
      - "AGENTS.md"
      - "FUNNEL.md"
      - "moor-agent.json"
      - "moor-request.js"
      - "pulse-dashboard.html"
      - "pulse-spine.js"
      - "pulse-workspace.js"
      - "quiz-funnel-v3.html"
      - "tests/pulse-checks.cjs"
      - "tests/moor-request-checks.cjs"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/pulse-checks.cjs
      - run: node tests/moor-request-checks.cjs
