<script>
/* MOOR Character Stream Core v1 — procedural animated background.
 *
 * A clean, elegant, continuously-generated field of vertically flowing characters
 * (numbers, letters, symbols) in vivid blue and white. MOOR's visual identity —
 * not glitchy, not retro-terminal, not cyberpunk. Extremely clean, precise, modern,
 * smooth, visually deep. Readable as moving characters without demanding to be read.
 *
 * ~10 perceptual depth layers varying in speed, scale, brightness, opacity, density.
 * Deterministic seeded: same seed -> same stream. No short repeating loops.
 *
 * Usage: const stream = CharStream.create(canvas, {seed:'devroom'});
 *        stream.start(); stream.stop(); stream.resize(w,h);
 *
 * Funnel receipt 20fbba52eda49130 (2026-10-07).
 *
 * TAGS: kind:component | cat:creation | prov:procedural-animation |
 *       see:dev-01-environment | src:charstream-core.js |
 */
(function(root,factory){
  const api=factory();
  if(typeof module==='object'&&module.exports)module.exports=api;
  else root.CharStream=api;
})(typeof globalThis!=='undefined'?globalThis:this,function(){
'use strict';

/* Coinbase-like vivid blue + white. Depth-graded. */
const BLUE='#0052FF', WHITE='#FFFFFF', BG='#04070F';

const CHARS='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz!@#$%^&*+-=<>?/\\|~:;';
const LAYERS=10;

function hashSeed(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function create(canvas,opts){
  opts=opts||{};
  const seed=opts.seed||'charstream';
  const rng=mulberry32(hashSeed(seed));
  const ctx=canvas.getContext('2d');
  let W=canvas.width,H=canvas.height,running=false,raf=0,lastT=0;

  /* per-layer config: depth 0 = far (small, dim, slow) .. 9 = near (large, bright, fast) */
  const layers=[];
  for(let d=0;d<LAYERS;d++){
    const t=d/(LAYERS-1); // 0..1 near
    layers.push({
      depth:d,
      fontSize:Math.round(8+t*24),            // 8px far .. 32px near
      speed:15+t*110,                         // px/sec
      opacity:0.14+t*0.78,                     // dim far .. bright near
      // color: far = deep blue, near = blue-white
      color:t<0.5?BLUE:(t<0.8?'#7AA8FF':WHITE),
      density:0.85+t*1.1,                      // columns per 100px (denser)
      changeRate:0.4+t*2.2,                   // char changes/sec
    });
  }

  /* columns per layer */
  let columns=[];
  function buildColumns(){
    columns=[];
    layers.forEach((L,li)=>{
      const n=Math.max(2,Math.round(W/100*L.density));
      for(let i=0;i<n;i++){
        const len=6+Math.floor(rng()*22);
        const chars=[];for(let j=0;j<len;j++)chars.push(CHARS[Math.floor(rng()*CHARS.length)]);
        columns.push({
          layer:li,x:rng()*W,y:rng()*H-H,
          chars,speed:L.speed*(0.85+rng()*0.3),
          changeT:rng()/L.changeRate,
        });
      }
    });
  }

  function draw(dt){
    // fade trail for smoothness (not smear)
    ctx.fillStyle=BG;ctx.globalAlpha=1;ctx.fillRect(0,0,W,H);
    layers.forEach((L,li)=>{
      ctx.font=L.fontSize+'px ui-monospace,SFMono-Regular,Menlo,monospace';
      ctx.textBaseline='top';
      columns.forEach(col=>{
        if(col.layer!==li)return;
        col.y+=col.speed*dt;
        col.changeT-=dt;
        if(col.changeT<=0){ // mutate a random character (continuous generation)
          col.chars[Math.floor(rng()*col.chars.length)]=CHARS[Math.floor(rng()*CHARS.length)];
          col.changeT=1/L.changeRate*(0.5+rng());
        }
        if(col.y-col.chars.length*L.fontSize*1.25>H){ // recycle past bottom
          col.y=-col.chars.length*L.fontSize*1.25;
          col.x=rng()*W;
        }
        const head=col.y;
        for(let j=0;j<col.chars.length;j++){
          const cy=head+j*L.fontSize*1.25;
          if(cy<-L.fontSize||cy>H+L.fontSize)continue;
          // head character brighter (white), trail fades to layer color
          const isHead=j===0;
          ctx.globalAlpha=L.opacity*(isHead?1:Math.max(0.25,1-j/col.chars.length*0.75));
          ctx.fillStyle=isHead?WHITE:L.color;
          ctx.fillText(col.chars[j],col.x,cy);
        }
      });
    });
    ctx.globalAlpha=1;
  }

  function frame(t){
    if(!running)return;
    const dt=Math.min(0.05,(t-lastT)/1000||0.016);lastT=t;
    draw(dt);
    raf=requestAnimationFrame(frame);
  }

  return {
    start(){if(running)return;running=true;lastT=performance.now();raf=requestAnimationFrame(frame);},
    stop(){running=false;cancelAnimationFrame(raf);},
    resize(w,h){canvas.width=w;canvas.height=h;W=w;H=h;buildColumns();},
    _layers:layers.length,
  };
}

// init columns on create via resize
const _origCreate=create;

return {create:function(canvas,opts){
  const s=_origCreate(canvas,opts);
  s.resize(canvas.width||512,canvas.height||256);
  return s;
},BLUE,WHITE,LAYERS};
});

<script>
/* Entry UI: decoupled from Three.js module. Works even if module fails. */
window.__entered=false;
window.__entryError=null;
function diag(msg){
  var d=document.getElementById('diag');
  if(!d){d=document.createElement('div');d.id='diag';
    d.style.cssText='position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,0.85);color:#0f0;font:11px monospace;padding:8px;z-index:99;max-height:40%;overflow:auto;white-space:pre-wrap;';
    document.body.appendChild(d);}
  d.textContent+=msg+'\n';
}
function dismissEntry(){
  var el=document.getElementById('enter');
  if(el)el.style.display='none';
  window.__entered=true;
  diag('entry dismissed');
}
window.__diag=diag;
document.addEventListener('DOMContentLoaded',function(){
  var el=document.getElementById('enter');
  if(el){
    el.addEventListener('click',dismissEntry);
    el.addEventListener('touchend',function(e){e.preventDefault();dismissEntry();},{passive:false});
  }
});
window.addEventListener('error',function(e){
  if(e.filename&&e.filename.indexOf('three.module.js')>=0){
    window.__entryError='3D engine failed to load.';
    var el=document.getElementById('enter');
    if(el&&!window.__entered){
      var p=el.querySelector('p');
      if(p)p.textContent='3D ENGINE FAILED TO LOAD — '+e.message;
    }
  }
},true);
</script>

<script type="module">
import * as THREE from './three.module.js';
window.__diag&&window.__diag('three.js loaded');

/* 1 unit = 1 foot. 320 x 180 x 90 ft, column-free. */
const W=320, D=180, H=90;

let renderer;
try{
  renderer=new THREE.WebGLRenderer({antialias:true});
  window.__diag&&window.__diag('WebGL context OK: '+renderer.getContext().getParameter(renderer.getContext().VERSION));
}catch(e){
  window.__diag&&window.__diag('WEBGL FAILED: '+e.message);
  document.body.innerHTML+='<div style="position:fixed;inset:0;background:#300;color:#fff;display:flex;align-items:center;justify-content:center;z-index:99999;font:16px sans-serif;text-align:center;padding:20px;">WEBGL UNAVAILABLE<br><br>'+e.message+'<br><br>Your browser could not create a 3D context.</div>';
  throw e;
}
renderer.domElement.addEventListener('webglcontextlost',e=>{
  e.preventDefault();
  window.__diag&&window.__diag('WEBGL CONTEXT LOST');
},false);
window.__diag&&window.__diag('renderer created');
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;
document.getElementById('app').appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x050505);
scene.fog=new THREE.FogExp2(0x050505,0.0035);

const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,0.5,1200);
camera.position.set(0,14,-70);
const node=new THREE.Group();
const dom=renderer.domElement;

/* ---------- character stream texture (shared by walls and monitors) ---------- */
const streamCanvas=document.createElement('canvas');streamCanvas.width=1024;streamCanvas.height=640;
const charStream=window.CharStream.create(streamCanvas,{seed:'devroom-v1'});
charStream.start();
const streamTex=new THREE.CanvasTexture(streamCanvas);
streamTex.colorSpace=THREE.SRGBColorSpace;
streamTex.minFilter=THREE.LinearMipmapLinearFilter;
streamTex.magFilter=THREE.LinearFilter;
streamTex.anisotropy=8;
/* ---------- walls: 24-inch thick, character stream texture ---------- */
const wallMat=new THREE.MeshStandardMaterial({map:streamTex,emissive:0xffffff,emissiveMap:streamTex,emissiveIntensity:0.5,roughness:0.85,metalness:0.1,color:0xffffff});
function wall(w,h,px,py,pz,ry){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,2),wallMat.clone());
  m.material.map=streamTex;m.material.map.needsUpdate=true;
  m.material.emissiveMap=streamTex;
  m.position.set(px,py,pz);m.rotation.y=ry;m.receiveShadow=true;m.castShadow=true;scene.add(m);return m;
}
wall(W,H, 0,H/2,-D/2, 0);
wall(W,H, 0,H/2, D/2, Math.PI);
wall(D,H, -W/2,H/2,0, Math.PI/2);
wall(D,H,  W/2,H/2,0,-Math.PI/2);

/* ---------- floor: matte non-reflective, scored 10ft grid + 20ft accent ring ---------- */
function floorTexture(){
  const c=document.createElement('canvas');c.width=c.height=1024;
  const g=c.getContext('2d');
  g.fillStyle='#0b0b0d';g.fillRect(0,0,1024,1024);
  // 10 ft grid (1024px = 320 ft -> 32px per 10 ft)
  g.strokeStyle='rgba(150,160,180,0.14)';g.lineWidth=1;
  for(let i=0;i<=1024;i+=32){g.beginPath();g.moveTo(i,0);g.lineTo(i,1024);g.stroke();g.beginPath();g.moveTo(0,i);g.lineTo(1024,i);g.stroke();}
  // 20 ft accent ring at center
  g.strokeStyle='rgba(232,200,122,0.22)';g.lineWidth=3;
  g.beginPath();g.arc(512,512,64,0,Math.PI*2);g.stroke();
  const t=new THREE.CanvasTexture(c);return t;
}
const floor=new THREE.Mesh(
  new THREE.PlaneGeometry(W,D),
  new THREE.MeshStandardMaterial({map:floorTexture(),color:0xffffff,roughness:0.92,metalness:0.0})
);
floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);

/* ---------- ceiling: studio plane at 84 ft, 6 ft void above ---------- */
const ceil=new THREE.Mesh(
  new THREE.PlaneGeometry(W,D),
  new THREE.MeshStandardMaterial({color:0x111114,roughness:0.9,metalness:0.05})
);
ceil.rotation.x=Math.PI/2;ceil.position.y=84;scene.add(ceil);

/* truss rigging (simple, dark) */
const trussMat=new THREE.MeshStandardMaterial({color:0x1a1a1c,roughness:0.7,metalness:0.5});
for(let x=-140;x<=140;x+=40){
  const truss=new THREE.Mesh(new THREE.BoxGeometry(2,2,D),trussMat);
  truss.position.set(x,82,0);scene.add(truss);
}
for(let z=-70;z<=70;z+=35){
  const beam=new THREE.Mesh(new THREE.BoxGeometry(W,1.5,1.5),trussMat);
  beam.position.set(0,82,z);scene.add(beam);
}

/* ---------- studio lighting: 4 presets per blueprint REV 8 ---------- */
const LIGHT_PRESETS={
  ambient:  {temp:0xffc98a, tempK:3200, ambient:0.20, pool:500,  rim:0x4a5a78, rimI:0.25, label:'AMBIENT 3200K'},
  work:     {temp:0xffddb0, tempK:4000, ambient:0.60, pool:1400, rim:0x6a7a98, rimI:0.45, label:'WORK 4000K'},
  cinematic:{temp:0xffb46b, tempK:2800, ambient:0.15, pool:1200, rim:0x3a4a68, rimI:0.30, label:'CINEMATIC 2800K'},
  pulse:    {temp:0xffe8c8, tempK:4500, ambient:0.40, pool:1000, rim:0x5a6a88, rimI:0.40, label:'PULSE 4500K'},
};
const ambLight=new THREE.AmbientLight(0x1a1a22,0.15);
scene.add(ambLight);

const poolLights=[];
function warmPool(x,z){
  const s=new THREE.SpotLight(0xffb46b,1200,120,Math.PI/5,0.45,1.6);
  s.position.set(x,80,z); s.target.position.set(x,0,z);
  s.castShadow=true; s.shadow.mapSize.set(1024,1024);
  scene.add(s); scene.add(s.target); poolLights.push(s);
  const fix=new THREE.Mesh(new THREE.CylinderGeometry(1.2,1.8,2.5,12),
    new THREE.MeshStandardMaterial({color:0x0a0a0a,roughness:0.4,metalness:0.8}));
  fix.position.set(x,80,z); scene.add(fix);
}
warmPool(0,0); warmPool(-80,-40); warmPool(80,-40);
warmPool(-80,40); warmPool(80,40); warmPool(0,-70); warmPool(0,70);

const rim=new THREE.DirectionalLight(0x3a4a68,0.30);
rim.position.set(0,40,-100); scene.add(rim);

/* emitter fixtures on truss grid (visual, emissive) */
const emitterMat=new THREE.MeshStandardMaterial({color:0x111111,emissive:0xffb46b,emissiveIntensity:0.8});
const emitterRowsH=[[],[],[],[],[]];
const emitterRowsV=[[],[],[],[],[],[],[]];
const emitterGeo=new THREE.BoxGeometry(2,0.5,2);
const emitterMeshes=[]; // {mesh, gx, gz, mat}
for(let gx=-3;gx<=3;gx++)for(let gz=-2;gz<=2;gz++){
  const mat=emitterMat.clone();
  const e=new THREE.Mesh(emitterGeo,mat);
  e.position.set(gx*40,83,gz*40); scene.add(e);
  emitterMeshes.push({mesh:e, gx:gx+3, gz:gz+2, mat});
  emitterRowsH[gz+2].push(e);
  emitterRowsV[gx+3].push(e);
}

let currentPreset='cinematic';
function applyPreset(name){
  const p=LIGHT_PRESETS[name]; if(!p) return;
  currentPreset=name;
  ambLight.intensity=p.ambient;
  poolLights.forEach(s=>{s.color.setHex(p.temp); s.intensity=p.pool;});
  rim.color.setHex(p.rim); rim.intensity=p.rimI;
  emitterMat.emissive.setHex(p.temp);
  const ind=document.getElementById('light-preset');
  if(ind) ind.textContent=p.label;
}
applyPreset('cinematic');
// keys 1-4 switch presets
addEventListener('keydown',e=>{
  const map={'1':'ambient','2':'work','3':'cinematic','4':'pulse'};
  if(map[e.key]) applyPreset(map[e.key]);
});

/* ---------- lighting controls: cycle button + physical row switches ---------- */
const presetNames=['ambient','work','cinematic','pulse'];
let presetIdx=2;
function cyclePreset(){presetIdx=(presetIdx+1)%4;applyPreset(presetNames[presetIdx]);}

// physical switches under glass table
const switchMat=new THREE.MeshStandardMaterial({color:0xf5f5f7,roughness:0.3,metalness:0.1});
const switchOnMat=new THREE.MeshStandardMaterial({color:0xffffff,emissive:0x0052FF,emissiveIntensity:0.6,roughness:0.3});
const rowSwitches={h:[],v:[]}; // horizontal (left), vertical (right)
// emitter rows: group emitters by x (horizontal) and z (vertical)
/* emitterRows declared with emitters (above) */
/* emitter rows grouped at creation time (see below) */
// left side: horizontal row switches (5)
for(let i=0;i<5;i++){
  const sw=new THREE.Mesh(new THREE.BoxGeometry(0.8,0.3,0.5),switchMat.clone());
  sw.position.set(-6.5,2.7,-1.5+i*0.75); sw.userData={row:i,axis:'h',on:true};
  node.add(sw); rowSwitches.h.push(sw);
}
// right side: vertical switches (7)
for(let i=0;i<7;i++){
  const sw=new THREE.Mesh(new THREE.BoxGeometry(0.8,0.3,0.5),switchMat.clone());
  sw.position.set(6.5,2.7,-2.25+i*0.75); sw.userData={row:i,axis:'v',on:true};
  node.add(sw); rowSwitches.v.push(sw);
}
// cycle button (center)
const cycleBtn=new THREE.Mesh(new THREE.CylinderGeometry(0.6,0.6,0.25,24),switchMat.clone());
cycleBtn.position.set(0,2.7,0); cycleBtn.userData={cycle:true};
node.add(cycleBtn);

function toggleRow(axis,row){
  const sw=rowSwitches[axis][row];
  sw.userData.on=!sw.userData.on;
  sw.material=sw.userData.on?switchOnMat:switchMat;
  const rows=axis==='h'?emitterRowsH:emitterRowsV;
  const targets=rows[row]||[];
  targets.forEach(e=>{
    e.material.emissiveIntensity=sw.userData.on?0.8:0.05;
    e.visible=sw.userData.on||e.material.emissiveIntensity>0;
  });
}
// raycast for switch interaction
const raycaster=new THREE.Raycaster(), pointer=new THREE.Vector2();
dom.addEventListener('click',e=>{
  if(document.pointerLockElement===dom)return; // only when not locked
  pointer.x=(e.clientX/innerWidth)*2-1; pointer.y=-(e.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(pointer,camera);
  const hits=raycaster.intersectObjects([...rowSwitches.h,...rowSwitches.v,cycleBtn]);
  if(hits.length){
    const o=hits[0].object;
    if(o.userData.cycle)cyclePreset();
    else toggleRow(o.userData.axis,o.userData.row);
  }
});

/* ---------- command node: glass desk, 6 monitors in arc, chair ---------- */
const glassMat=new THREE.MeshPhysicalMaterial({color:0x8a9aa8,transparent:true,opacity:0.28,roughness:0.08,metalness:0.1,clearcoat:1});
const desk=new THREE.Mesh(new THREE.BoxGeometry(14,0.4,5),glassMat);
desk.position.y=3;desk.castShadow=true;node.add(desk);
// desk legs
[[-6,-2],[6,-2],[-6,2],[6,2]].forEach(([x,z])=>{
  const leg=new THREE.Mesh(new THREE.BoxGeometry(0.5,3,0.5),
    new THREE.MeshStandardMaterial({color:0x1a1a1c,roughness:0.4,metalness:0.8}));
  leg.position.set(x,1.5,z);node.add(leg);
});
// 6 monitors in a slight arc, blank (powered on, displaying nothing)
/* streamTex defined earlier with wall setup */
const screenMat=new THREE.MeshStandardMaterial({map:streamTex,emissive:0xffffff,emissiveMap:streamTex,emissiveIntensity:0.55,roughness:0.35,color:0xffffff});
const bezelMat=new THREE.MeshStandardMaterial({color:0x0a0a0a,roughness:0.5,metalness:0.6});
for(let i=0;i<6;i++){
  const a=(i-2.5)*0.384; // 110-degree arc per blueprint
  const mx=Math.sin(a)*9, mz=-Math.cos(a)*9+2;
  const mon=new THREE.Group();
  const bezel=new THREE.Mesh(new THREE.BoxGeometry(4.4,2.6,0.25),bezelMat);
  bezel.castShadow=true;mon.add(bezel);
  const scr=new THREE.Mesh(new THREE.PlaneGeometry(4.1,2.3),screenMat);
  scr.position.z=0.14;mon.add(scr);
  const stand=new THREE.Mesh(new THREE.BoxGeometry(0.4,1.6,0.4),bezelMat);
  stand.position.y=-2;mon.add(stand);
  mon.position.set(mx,5.2,mz);mon.rotation.y=-a;
  node.add(mon);
}
// 5-point chair (abstracted) — Codex Blue, in spin group
const chairGroup=new THREE.Group();
chairGroup.position.set(0,0,4.5);
const chairMat=new THREE.MeshStandardMaterial({color:0x0052FF,roughness:0.5,metalness:0.2});
const seat=new THREE.Mesh(new THREE.BoxGeometry(2.4,0.35,2.4),chairMat);
seat.position.set(0,2.2,0);seat.castShadow=true;chairGroup.add(seat);
const back=new THREE.Mesh(new THREE.BoxGeometry(2.4,2.8,0.3),chairMat);
back.position.set(0,3.8,1.1);chairGroup.add(back);
const post=new THREE.Mesh(new THREE.CylinderGeometry(0.18,0.18,2.2),bezelMat);
post.position.set(0,1.1,0);chairGroup.add(post);
for(let i=0;i<5;i++){
  const a=i/5*Math.PI*2;
  const leg=new THREE.Mesh(new THREE.BoxGeometry(1.6,0.18,0.3),bezelMat);
  leg.position.set(Math.cos(a)*0.9,0.25,Math.sin(a)*0.9);
  leg.rotation.y=-a;chairGroup.add(leg);
}
node.add(chairGroup);
scene.add(node);
let chairYaw=0, chairTargetYaw=0;

/* ---------- 6DoF flight controls ---------- */
const keys={};
addEventListener('keydown',e=>keys[e.code]=true);
addEventListener('keyup',e=>keys[e.code]=false);
let yaw=0,pitch=0,speed=28;
dom.addEventListener('mousemove',e=>{
  if(document.pointerLockElement!==dom)return;
  yaw-=e.movementX*0.0022;pitch-=e.movementY*0.0022;
  pitch=Math.max(-1.45,Math.min(1.45,pitch));
});
dom.addEventListener('click',()=>{if(document.pointerLockElement!==dom)dom.requestPointerLock();});
// touch: drag to look, two-finger or on-screen to move — simple: drag looks, auto drift forward while touching with second finger
let lastT=null,moveTouch=false;
dom.addEventListener('touchstart',e=>{if(e.touches.length===2)moveTouch=true;lastT=e.touches[0];},{passive:true});
dom.addEventListener('touchmove',e=>{
  const t=e.touches[0];
  if(lastT){yaw-=(t.clientX-lastT.clientX)*0.005;pitch-=(t.clientY-lastT.clientY)*0.005;pitch=Math.max(-1.45,Math.min(1.45,pitch));}
  lastT=t;e.preventDefault();
},{passive:false});
dom.addEventListener('touchend',e=>{if(e.touches.length<2)moveTouch=false;lastT=null;});

/* ---------- octagon ring movement ---------- */
const CHAIR_POS=new THREE.Vector3(0,4.5,8);
const RING_R=110, RING_Y=14;
const ringPos=[];
for(let i=0;i<8;i++){
  const a=i/8*Math.PI*2 + Math.PI/8;
  ringPos.push(new THREE.Vector3(Math.cos(a)*RING_R, RING_Y, Math.sin(a)*RING_R));
}
let mode='chair'; // 'chair' | 'ring' | 'transition'
let ringIdx=0;
let transT=0, transFrom=new THREE.Vector3(), transTo=new THREE.Vector3(), transDur=1.2;
let swipeStart=null, swipeTime=0;

let transDest='ring'; // 'chair' or 'ring'
function startTransition(to, dur, dest){
  transFrom.copy(camera.position);
  transTo.copy(to);
  transT=0; transDur=dur;
  transDest=dest||'ring';
  mode='transition';
}

// swipe detection
dom.addEventListener('touchstart',e=>{
  if(e.touches.length===1){swipeStart={x:e.touches[0].clientX,y:e.touches[0].clientY};swipeTime=Date.now();}
},{passive:true});
dom.addEventListener('touchend',e=>{
  if(!swipeStart)return;
  const dx=(e.changedTouches[0].clientX-swipeStart.x);
  const dy=(e.changedTouches[0].clientY-swipeStart.y);
  const dt=Math.max(1,Date.now()-swipeTime);
  const vel=Math.min(3,Math.max(0.8,Math.hypot(dx,dy)/dt*2));
  const adx=Math.abs(dx), ady=Math.abs(dy);
  if(Math.max(adx,ady)<40){swipeStart=null;return;} // not a swipe
  if(adx>ady){
    // horizontal: ring navigation
    if(mode==='ring'||mode==='chair'){
      if(mode==='chair'){mode='ring';ringIdx=0;startTransition(ringPos[0],1.2/vel,'ring');}
      else{ringIdx=(ringIdx+(dx>0?1:7))%8;startTransition(ringPos[ringIdx],0.9/vel,'ring');}
    }else if(mode==='transition'){
      ringIdx=(ringIdx+(dx>0?1:7))%8;startTransition(ringPos[ringIdx],0.9/vel);
    }
  }else{
    // vertical: chair <-> ring
    if(dy<0&&mode==='chair'){mode='ring';ringIdx=0;startTransition(ringPos[0],1.4/vel,'ring');}
    else if(dy>0&&mode==='ring'){mode='chair';startTransition(CHAIR_POS,1.4/vel,'chair');}
  }
  swipeStart=null;
});
addEventListener('wheel',e=>{speed=Math.max(6,Math.min(90,speed+e.deltaY*0.02));},{passive:true});

/* entry handled by standalone script; pointer lock on canvas click for desktop */
dom.addEventListener('click',()=>{if(dom.requestPointerLock&&document.pointerLockElement!==dom)dom.requestPointerLock();});

const fwd=new THREE.Vector3(),rgt=new THREE.Vector3(),up=new THREE.Vector3(0,1,0);
const clock=new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),0.05);
  // transition animation
  if(mode==='transition'){
    transT+=dt/transDur;
    const t=Math.min(1,transT);
    const e=t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2; // easeInOut
    camera.position.lerpVectors(transFrom,transTo,e);
    if(t>=1){mode=transDest;}
  }
  // chair auto-spin: delayed follow of head yaw
  if(mode==='chair'){
    const yawDiff=yaw-chairTargetYaw;
    if(Math.abs(yawDiff)>0.5){chairTargetYaw=yaw-Math.sign(yawDiff)*0.5;}
    chairYaw+=(chairTargetYaw-chairYaw)*Math.min(1,dt*2.5);
    chairGroup.rotation.y=-chairYaw;
  }
  camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;
  camera.getWorldDirection(fwd);rgt.crossVectors(fwd,up).normalize();
  const v=new THREE.Vector3();
  if(keys.KeyW||moveTouch)v.add(fwd);
  if(keys.KeyS)v.sub(fwd);
  if(keys.KeyA)v.sub(rgt);
  if(keys.KeyD)v.add(rgt);
  if(keys.KeyE||keys.Space)v.y+=1;
  if(keys.KeyQ||keys.ShiftLeft)v.y-=1;
  if(v.lengthSq()>0){v.normalize().multiplyScalar(speed*dt);camera.position.add(v);}
  // soft bounds
  camera.position.x=Math.max(-W/2+4,Math.min(W/2-4,camera.position.x));
  camera.position.z=Math.max(-D/2+4,Math.min(D/2-4,camera.position.z));
  camera.position.y=Math.max(2,Math.min(H-4,camera.position.y));
  streamTex.needsUpdate=true;
  renderer.render(scene,camera);
}
/* failure-class preventions (funnel bc999f71) — runs AFTER all declarations */
(function preventFailures(){
  console.assert(Math.abs(camera.position.x)<W/2&&Math.abs(camera.position.z)<D/2,'PREVENTION FAIL: camera outside room');
  for(const k in LIGHT_PRESETS)LIGHT_PRESETS[k].ambient=Math.max(0.05,LIGHT_PRESETS[k].ambient);
  [CHAIR_POS,...ringPos].forEach((p,i)=>{
    console.assert(Math.abs(p.x)<W/2&&Math.abs(p.z)<D/2,'PREVENTION FAIL: waypoint '+i+' outside bounds');
  });
  window.__diag&&window.__diag('preventions pass');
})();
window.__diag&&window.__diag('starting tick');
tick();
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
