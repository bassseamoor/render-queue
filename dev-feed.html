<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MOOR Dev Feed</title>
<style>
:root{
 --bg:#071019;--panel:rgba(11,20,31,.72);--panel2:rgba(15,27,42,.82);--line:rgba(255,255,255,.09);
 --text:#edf4fa;--muted:#8ea0b2;--soft:#c7d3df;--accent:#a9e8ff;--good:#9ce7bc;--warn:#f3d08e;--bad:#ffaea3;
}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
 color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
 background:
 radial-gradient(1000px 700px at 14% 0%,rgba(72,129,166,.14),transparent 62%),
 radial-gradient(1000px 700px at 100% 100%,rgba(72,96,130,.12),transparent 64%),
 var(--bg);
}
button,input{font:inherit}
.shell{height:100%;padding:14px;display:flex;flex-direction:column;gap:12px}
.top{
 min-height:54px;display:flex;align-items:center;gap:14px;padding:0 4px
}
.brand{min-width:0}.brand b{display:block;font-size:14px}.brand span{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.live{margin-left:auto;display:flex;align-items:center;gap:7px;color:#b9cad7;font-size:10px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 12px rgba(156,231,188,.55)}
.toolbar{display:flex;gap:7px;align-items:center}
.btn{
 border:1px solid var(--line);background:rgba(255,255,255,.045);color:var(--soft);
 border-radius:10px;padding:7px 9px;font-size:10px;cursor:pointer
}
.btn:hover{background:rgba(255,255,255,.075)}
.grid{
 min-height:0;flex:1;display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:10px;overflow-x:auto;overflow-y:hidden
}
.stream{
 min-width:240px;min-height:0;display:flex;flex-direction:column;border-radius:18px;
 background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.018)),var(--panel);
 border:1px solid var(--line);backdrop-filter:blur(24px) saturate(125%);
 box-shadow:0 24px 70px rgba(0,0,0,.20)
}
.streamHead{
 padding:12px 13px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;
 border-bottom:1px solid rgba(255,255,255,.055)
}
.streamHead b{font-size:11px}.streamHead span{font-size:9px;color:var(--muted)}
.feed{min-height:0;overflow:auto;padding:7px;scrollbar-width:none}.feed::-webkit-scrollbar{display:none}
.event{
 padding:9px 9px 10px;border-radius:11px;cursor:pointer;border:1px solid transparent;
 transition:.14s ease;margin-bottom:5px;background:rgba(255,255,255,.018)
}
.event:hover{background:rgba(255,255,255,.045);border-color:rgba(255,255,255,.07)}
.event.active{background:rgba(169,232,255,.08);border-color:rgba(169,232,255,.16)}
.meta{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:8px;letter-spacing:.02em}
.badge{padding:2px 5px;border:1px solid rgba(255,255,255,.08);border-radius:999px}
.title{margin-top:5px;font-size:11px;font-weight:620;line-height:1.35}
.detail{margin-top:4px;font-size:9px;line-height:1.45;color:#9eafbe}
.state-good{color:var(--good)}.state-warn{color:var(--warn)}.state-bad{color:var(--bad)}
.drawer{
 position:fixed;right:14px;top:14px;bottom:14px;width:min(440px,calc(100vw - 28px));
 border:1px solid var(--line);border-radius:20px;background:rgba(7,14,23,.93);
 backdrop-filter:blur(30px) saturate(130%);box-shadow:0 28px 90px rgba(0,0,0,.42);
 transform:translateX(calc(100% + 24px));transition:.18s ease;z-index:20;overflow:hidden;display:flex;flex-direction:column
}
.drawer.open{transform:translateX(0)}
.drawerHead{display:flex;align-items:center;gap:8px;padding:14px;border-bottom:1px solid var(--line)}
.drawerHead b{font-size:12px}.drawerHead button{margin-left:auto}
.drawerBody{padding:14px;overflow:auto;scrollbar-width:none}.drawerBody::-webkit-scrollbar{display:none}
.kv{padding:9px 0;border-bottom:1px solid rgba(255,255,255,.055)}
.kv small{display:block;color:var(--muted);font-size:8px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}
.kv div{font-size:10px;line-height:1.5;word-break:break-word}
.link{display:inline-flex;margin-top:7px;color:var(--accent);font-size:10px;text-decoration:none}
.stats{
 display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:6px
}
.stat{padding:8px 9px;border-radius:11px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06)}
.stat b{display:block;font-size:14px}.stat span{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.empty{padding:16px 10px;color:var(--muted);font-size:10px;line-height:1.5}
@media(max-width:900px){.grid{grid-template-columns:repeat(4,82vw)}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <div class="brand"><b>Dev Feed</b><span>what entered · where it went · what actually shipped</span></div>
    <div class="live"><i class="dot"></i><span id="updated">live repository view</span></div>
    <div class="toolbar"><button class="btn" id="refreshBtn">Refresh</button></div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="grid" id="streams"></div>
</div>

<aside class="drawer" id="drawer">
  <div class="drawerHead"><b id="drawerTitle">Details</b><button class="btn" id="closeDrawer">Close</button></div>
  <div class="drawerBody" id="drawerBody"></div>
</aside>

<script src="dev-feed-core.js"></script>
<script>
(function(){
'use strict';
const Core=window.MOORDevFeed;
const streamsEl=document.getElementById('streams');
const drawer=document.getElementById('drawer');
const body=document.getElementById('drawerBody');
const title=document.getElementById('drawerTitle');
let ledger=null,externalEvents=[];
const STREAMS=[
  {id:'intake',label:'Intake',match:e=>['requested','funneled','blueprint'].includes(e.stage)},
  {id:'build',label:'Build',match:e=>['building','verified'].includes(e.stage)},
  {id:'release',label:'Release',match:e=>['pulse','main','owner-visible'].includes(e.stage)},
  {id:'gaps',label:'Attention',match:e=>e.status==='gap'||e.status==='failed'||e.status==='blocked'},
  {id:'repository',label:'Repository',match:e=>e.source_kind==='github'||e.source_kind==='tracker'}
];
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function time(s){try{return new Date(s).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit',second:'2-digit'})}catch(e){return s}}
function stateClass(status){return /complete|verified|observed/.test(status)?'state-good':/gap|blocked|failed/.test(status)?'state-bad':'state-warn'}
function allEvents(){
  const out=[];
  (ledger.items||[]).forEach(item=>(item.events||[]).forEach(e=>out.push({...e,item_id:item.id,item_title:item.title,item_kind:item.kind,expected_destination:item.expected_destination})));
  externalEvents.forEach(e=>out.push(e));
  return out.sort((a,b)=>String(b.at).localeCompare(String(a.at)));
}
function render(){
  const summary=Core.summarize(ledger);
  const evs=allEvents();
  document.getElementById('stats').innerHTML=[
    ['Items',summary.counts.total],['Owner visible',summary.counts.owner_visible],['Gaps',summary.counts.gaps],['Events',evs.length]
  ].map(x=>'<div class="stat"><b>'+x[1]+'</b><span>'+x[0]+'</span></div>').join('');
  streamsEl.innerHTML=STREAMS.map(s=>{
    const rows=evs.filter(e=>s.id==='repository'?s.match(e):(!e.source_kind&&s.match(e)));
    return '<section class="stream"><div class="streamHead"><b>'+s.label+'</b><span>'+rows.length+'</span></div><div class="feed" data-stream="'+s.id+'">'+
      (rows.length?rows.map(e=>card(e)).join(''):'<div class="empty">Nothing here.</div>')+'</div></section>';
  }).join('');
  streamsEl.querySelectorAll('.event').forEach(el=>el.onclick=()=>{
    streamsEl.querySelectorAll('.event').forEach(x=>x.classList.remove('active'));el.classList.add('active');
    const e=evs.find(x=>x.id===el.dataset.id);if(e)openDrawer(e);
  });
}
function card(e){
  return '<div class="event" data-id="'+esc(e.id)+'">'+
   '<div class="meta"><span>'+esc(time(e.at))+'</span><span class="badge">'+esc(Core.pipelineLabel(e.stage))+'</span><span class="'+stateClass(e.status)+'">'+esc(e.status)+'</span></div>'+
   '<div class="title">'+esc(e.item_title)+'</div>'+
   '<div class="detail">'+esc(e.detail||e.title||e.source||'')+'</div>'+
  '</div>';
}
function openDrawer(e){
  title.textContent=e.item_title||'Details';
  const item=(ledger.items||[]).find(x=>x.id===e.item_id);
  const itemState=item?Core.itemState(item):null;
  const pairs=[
    ['Time',time(e.at)],['Stage',Core.pipelineLabel(e.stage)],['Status',e.status],
    ['Source',e.source],['Worker',e.worker||'unknown'],['Destination',e.expected_destination||'—'],
    ['Event ID',e.id],['Item ID',e.item_id]
  ];
  body.innerHTML=pairs.map(x=>'<div class="kv"><small>'+esc(x[0])+'</small><div>'+esc(x[1])+'</div></div>').join('')+
    (e.detail?'<div class="kv"><small>Detail</small><div>'+esc(e.detail)+'</div></div>':'')+
    (e.receipt?'<div class="kv"><small>Receipt</small><div>'+esc(typeof e.receipt==='string'?e.receipt:JSON.stringify(e.receipt,null,2))+'</div></div>':'')+
    (e.stats?'<div class="kv"><small>Statistics</small><div>'+esc(JSON.stringify(e.stats,null,2))+'</div></div>':'')+
    (itemState&&itemState.gap.length?'<div class="kv"><small>Current gaps</small><div class="state-bad">'+esc(itemState.gap.join(', '))+'</div></div>':'')+
    (e.ref?'<a class="link" href="'+esc(resolveRef(e.ref))+'" target="_blank" rel="noopener">Open evidence / artifact ↗</a>':'');
  drawer.classList.add('open');
}
function resolveRef(ref){
  if(/^https?:/i.test(ref))return ref;
  if(/^[0-9a-f]{7,40}$/i.test(ref))return 'https://github.com/bassseamoor/render-queue/commit/'+ref;
  return ref;
}
async function json(url){
  const r=await fetch(url,{cache:'no-store',headers:{'Accept':'application/vnd.github+json'}});
  if(!r.ok)throw new Error(url+' '+r.status);
  return r.json();
}
async function loadParallelEvents(){
  const api='https://api.github.com/repos/bassseamoor/render-queue/contents/dev-feed/events?ref=main';
  try{
    const list=await json(api);
    const files=Array.isArray(list)?list.filter(x=>x.type==='file'&&/\\.json$/i.test(x.name)).slice(-80):[];
    const rows=await Promise.all(files.map(async x=>{
      try{
        const e=await json(x.download_url+'?ts='+Date.now());
        return {...e,item_id:e.item_id,item_title:e.title||e.item_id,item_kind:e.kind||'event',expected_destination:e.destination||'—'};
      }catch(_){return null}
    }));
    return rows.filter(Boolean);
  }catch(_){return []}
}
async function loadGitHub(){
  const base='https://api.github.com/repos/bassseamoor/render-queue';
  const out=[];
  try{
    const [prs,commits]=await Promise.all([
      json(base+'/pulls?state=all&sort=updated&direction=desc&per_page=20'),
      json(base+'/commits?per_page=25')
    ]);
    (prs||[]).forEach(pr=>{
      const e=Core.githubPullToEvent(pr);
      out.push({...e,item_id:'repo-pr-'+pr.number,item_title:e.title,item_kind:'repository',expected_destination:'GitHub',source_kind:'github'});
    });
    (commits||[]).forEach(commit=>{
      const e=Core.githubCommitToEvent(commit);
      out.push({...e,item_id:'repo-commit-'+String(commit.sha||'').slice(0,12),item_title:e.title,item_kind:'repository',expected_destination:'main',source_kind:'github'});
    });
  }catch(_){}
  return out;
}
async function loadTrackers(){
  const out=[];
  try{
    const release=await json('pulse-slice-release-ledger.json?ts='+Date.now());
    (release.releases||release.entries||[]).slice(-30).forEach((x,i)=>out.push({
      id:'tracker:release:'+(x.slice_id||x.id||i),stage:'main',status:x.status||'observed',
      at:x.released_at||x.at||x.timestamp||'',source:'Slice release ledger',source_kind:'tracker',
      worker:x.owner||x.worker||'release ledger',title:(x.slice_id||x.id||'Release')+' · '+(x.status||'observed'),
      detail:x.note||x.reason||'',item_id:'tracker-release-'+(x.slice_id||x.id||i),item_title:'Slice '+(x.slice_id||x.id||i),
      item_kind:'release-tracker',expected_destination:'release ledger',ref:'pulse-slice-release-ledger.json'
    }));
  }catch(_){}
  try{
    const maintenance=await json('funnel-maintenance-status.json?ts='+Date.now());
    (maintenance.systems||maintenance.subsystems||maintenance.items||[]).forEach((x,i)=>{
      const visual=x.display_state||x.visual_state||x.status||'observed';
      out.push({
        id:'tracker:maintenance:'+(x.id||i),stage:'verified',status:/gap|degraded|missing|failed/i.test(visual)?'gap':'observed',
        at:maintenance.updated_at||maintenance.generated_at||'',source:'Funnel maintenance',source_kind:'tracker',
        worker:x.owner||'maintenance',title:x.name||x.label||x.id||'Maintenance',
        detail:visual,item_id:'tracker-maintenance-'+(x.id||i),item_title:x.name||x.label||x.id||'Maintenance',
        item_kind:'maintenance-tracker',expected_destination:'Funnel maintenance',ref:'funnel-maintenance-status.json',
        stats:{visual_state:visual,live_path:x.live_path}
      });
    });
  }catch(_){}
  return out;
}
async function load(){
  const r=await fetch('dev-feed-ledger.json?ts='+Date.now(),{cache:'no-store'});
  if(!r.ok)throw new Error('feed '+r.status);
  ledger=await r.json();
  const valid=Core.validateLedger(ledger);
  if(!valid.ok)throw new Error(valid.errors.join('; '));
  const [parallel,github,trackers]=await Promise.all([loadParallelEvents(),loadGitHub(),loadTrackers()]);
  externalEvents=[...parallel,...github,...trackers];
  document.getElementById('updated').textContent='updated '+new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit',second:'2-digit'});
  render();
}
document.getElementById('refreshBtn').onclick=()=>load().catch(err=>document.getElementById('updated').textContent=err.message);
document.getElementById('closeDrawer').onclick=()=>drawer.classList.remove('open');
document.addEventListener('keydown',e=>{if(e.key==='Escape')drawer.classList.remove('open')});
load().catch(err=>document.getElementById('updated').textContent=err.message);
setInterval(()=>load().catch(()=>{}),15000);
})();
</script>
</body>
</html>
