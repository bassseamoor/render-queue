<!DOCTYPE html>
<html><head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>STRATA · 3D Canyon</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui;}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;}
#title{position:fixed;top:14px;left:16px;z-index:10;color:#fff;font-size:15px;letter-spacing:4px;opacity:.9;pointer-events:none;}
#title small{display:block;font-size:10px;letter-spacing:1px;opacity:.5;margin-top:2px;}
#seedbar{position:fixed;bottom:14px;left:12px;right:12px;z-index:10;display:flex;gap:8px;align-items:center;
 background:rgba(20,20,24,.72);backdrop-filter:blur(12px);border-radius:16px;padding:8px 8px 8px 14px;}
#seedtxt{flex:1;color:#fff;font:12px monospace;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sbtn{width:44px;height:44px;border-radius:50%;border:none;background:rgba(255,255,255,.12);color:#fff;font-size:20px;}
#dbg{position:fixed;bottom:70px;left:10px;z-index:10;color:#0f0;font:11px monospace;background:rgba(0,0,0,.7);padding:5px 7px;border-radius:5px;pointer-events:none;}
</style>
</head><body>
<canvas id="gl"></canvas>
<div id="title">STRATA · 3D<small id="seedline"></small></div>
<div id="seedbar">
 <div id="seedtxt">…</div>
 <button class="sbtn" id="bNew">🎲</button>
 <button class="sbtn" id="bRemix">🌀</button>
</div>
<div id="dbg"></div>
<script>
'use strict';
/* STRATA 3D — built from working minimal WebGL logic.
   Real height-field canyon geometry with computed normals and lambert lighting.
   No FBO, no textures (yet), no blending — just solid 3D that works. */

// ---------- seeded RNG ----------
function xmur3(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return function(){h=Math.imul(h^(h>>>16),2246822507);h=Math.imul(h^(h>>>13),3266489909);return (h^=h>>>16)>>>0;};}
function mulberry32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296;};}
function rngFrom(s){return mulberry32(xmur3(s)());}
function makeNoise2D(seed){
  const r=rngFrom(seed);
  const perm=new Uint8Array(512), p=new Uint8Array(256);
  for(let i=0;i<256;i++)p[i]=i;
  for(let i=255;i>0;i--){const j=Math.floor(r()*(i+1));const t=p[i];p[i]=p[j];p[j]=t;}
  for(let i=0;i<512;i++)perm[i]=p[i&255];
  const grad=new Float32Array(256);
  for(let i=0;i<256;i++)grad[i]=r()*2-1;
  function n2(x,y){
    const X=Math.floor(x)&255,Y=Math.floor(y)&255;
    x-=Math.floor(x);y-=Math.floor(y);
    const u=x*x*(3-2*x),v=y*y*(3-2*y);
    const a=perm[X+perm[Y]],b=perm[X+1+perm[Y]],c=perm[X+perm[Y+1]],d=perm[X+1+perm[Y+1]];
    return (grad[a]*(1-u)+grad[b]*u)*(1-v)+(grad[c]*(1-u)+grad[d]*u)*v;
  }
  function fbm(x,y,oct){let s=0,a=.5,f=1,n=0;for(let i=0;i<oct;i++){s+=a*n2(x*f,y*f);n+=a;a*=.5;f*=2.03;}return s/n*.5+.5;}
  return {fbm};
}

// ---------- seed format (same as before: SPX1.layout.detail.params) ----------
const B36='0123456789abcdefghijklmnopqrstuvwxyz';
function rcN(n){let s='';for(let i=0;i<n;i++)s+=B36[Math.floor(Math.random()*36)];return s;}
function parseSeed(s){
  const m=/^SPX1\.([0-9a-z]{4})\.([0-9a-z]{4})\.([0-9a-z]{6})$/i.exec(String(s||'').trim());
  if(!m)return null;
  const pc=m[3], cv=c=>B36.indexOf(c.toLowerCase());
  return {layout:parseInt(m[1],36)>>>0, detail:parseInt(m[2],36)>>>0,
    palette:cv(pc[0])%5, formations:1+cv(pc[1])%5, trees:cv(pc[2])/35,
    mist:cv(pc[3])/35, drift:cv(pc[4])/35, glow:cv(pc[5])/35};
}
function randomSeedStr(){return 'SPX1.'+rcN(4)+'.'+rcN(4)+'.'+B36[Math.floor(Math.random()*5)]+rcN(5);}
function remixSeedStr(st){
  const j=()=>Math.floor(Math.random()*36);
  const L=rcN(4), D=rcN(4);
  return 'SPX1.'+L+'.'+D+'.'+B36[st.palette%5]+B36[(st.formations-1+j()%3)%5]+rcN(4);
}

// ---------- canyon mesh builder ----------
const PALETTES=[
 {rock:[.85,.45,.25],rockD:[.7,.4,.22],moss:[.45,.5,.25],floor:[.3,.35,.2]},
 {rock:[.9,.5,.3],rockD:[.75,.42,.25],moss:[.5,.45,.3],floor:[.35,.3,.2]},
 {rock:[.5,.35,.3],rockD:[.4,.28,.22],moss:[.35,.45,.3],floor:[.2,.25,.18]},
 {rock:[.75,.5,.35],rockD:[.6,.4,.28],moss:[.55,.55,.3],floor:[.35,.4,.22]},
 {rock:[.8,.45,.4],rockD:[.65,.35,.3],moss:[.5,.45,.35],floor:[.3,.3,.22]},
];
function buildCanyon(seedStr, pal, formations, gridN, size){
  const nz=makeNoise2D('terr'+seedStr);
  const verts=[],normals=[],colors=[],indices=[];
  for(let j=0;j<=gridN;j++)for(let i=0;i<=gridN;i++){
    const x=(i/gridN-.5)*size, z=(j/gridN-.5)*size-12;
    const wallF=Math.min(1,Math.max(0,(Math.abs(x)-5)/9));
    const hBase=wallF*wallF*(8+formations*1.5);
    const detail=nz.fbm(x*.08,z*.08,4)*3*(.3+wallF);
    const strata=Math.sin(z*.45+wallF*4)*.9*wallF;
    const y=hBase+detail+strata-2;
    verts.push(x,y,z);
    let c;
    if(y>5)c=pal.rock; else if(y>1.5)c=pal.rockD; else if(y>-.5)c=pal.moss; else c=pal.floor;
    const v=nz.fbm(x*.3,z*.3,2)*.12;
    colors.push(c[0]+v,c[1]+v,c[2]+v);
  }
  for(let j=0;j<=gridN;j++)for(let i=0;i<=gridN;i++){
    const idx=j*(gridN+1)+i;
    const il=Math.max(0,i-1),ir=Math.min(gridN,i+1),jd=Math.max(0,j-1),ju=Math.min(gridN,j+1);
    const l=(j*(gridN+1)+il)*3,r=(j*(gridN+1)+ir)*3,d=(jd*(gridN+1)+i)*3,u=(ju*(gridN+1)+i)*3;
    const dx=verts[r]-verts[l],dy=verts[r+1]-verts[l+1],dz=verts[r+2]-verts[l+2];
    const ex=verts[u]-verts[d],ey=verts[u+1]-verts[d+1],ez=verts[u+2]-verts[d+2];
    let nx=dy*ez-dz*ey,ny=dz*ex-dx*ez,nz2=dx*ey-dy*ex;
    const len=Math.hypot(nx,ny,nz2)||1;
    normals.push(nx/len,ny/len,nz2/len);
  }
  for(let j=0;j<gridN;j++)for(let i=0;i<gridN;i++){
    const a=j*(gridN+1)+i,b=a+1,c=a+gridN+1,d=c+1;
    indices.push(a,c,b,b,c,d);
  }
  return {verts:new Float32Array(verts),normals:new Float32Array(normals),
    colors:new Float32Array(colors),indices:new Uint16Array(indices),count:indices.length};
}

// ---------- matrices (verified in Node) ----------
function mPerspective(fov,aspect,near,far){
  const f=1/Math.tan(fov/2),nf=1/(near-far);
  return [f/aspect,0,0,0, 0,f,0,0, 0,0,(far+near)*nf,-1, 0,0,2*far*near*nf,0];
}
function mLookAt(ex,ey,ez,cx,cy,cz){
  let zx=ex-cx,zy=ey-cy,zz=ez-cz,l=Math.hypot(zx,zy,zz);zx/=l;zy/=l;zz/=l;
  let xx=zz,xy=0,xz=-zx;l=Math.hypot(xx,xy,xz)||1;xx/=l;xy/=l;xz/=l;
  const yx=zy*xz-zz*xy,yy=zz*xx-zx*xz,yz=zx*xy-zy*xx;
  return [xx,yx,zx,0, xy,yy,zy,0, xz,yz,zz,0,
    -(xx*ex+xy*ey+xz*ez),-(yx*ex+yy*ey+yz*ez),-(zx*ex+zy*ey+zz*ez),1];
}
function mMul(a,b){
  const o=new Array(16);
  for(let c=0;c<4;c++)for(let r=0;r<4;r++)
    o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3];
  return o;
}

// ---------- GL setup (from working minimal page) ----------
const canvas=document.getElementById('gl');
const dbg=document.getElementById('dbg');
let gl=null, prog=null, aPos=null, aNor=null, aCol=null, uMVP=null, uLight=null;
let vbo=null, nbo=null, cbo=null, ibo=null, idxCount=0;

function initGL(){
  if(gl)return;
  gl=canvas.getContext('webgl',{antialias:false,alpha:false});
  if(!gl){document.body.innerHTML='<div style="color:#fff;padding:40px;font-family:system-ui">This world needs WebGL.</div>';throw new Error('no webgl');}
  function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);
    if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(o));return o;}
  const vs=sh(gl.VERTEX_SHADER,
    'attribute vec3 aPos;attribute vec3 aNor;attribute vec3 aCol;'+
    'uniform mat4 uMVP;varying vec3 vN;varying vec3 vC;'+
    'void main(){vN=aNor;vC=aCol;gl_Position=uMVP*vec4(aPos,1.);}');
  const fs=sh(gl.FRAGMENT_SHADER,
    'precision mediump float;varying vec3 vN;varying vec3 vC;uniform vec3 uLight;'+
    'void main(){float d=max(dot(normalize(vN),normalize(uLight)),0.);'+
    'vec3 c=vC*(.35+.65*d);gl_FragColor=vec4(c,1.);}');
  prog=gl.createProgram();gl.attachShader(prog,vs);gl.attachShader(prog,fs);gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(prog));
  aPos=gl.getAttribLocation(prog,'aPos');aNor=gl.getAttribLocation(prog,'aNor');aCol=gl.getAttribLocation(prog,'aCol');
  uMVP=gl.getUniformLocation(prog,'uMVP');uLight=gl.getUniformLocation(prog,'uLight');
  vbo=gl.createBuffer();nbo=gl.createBuffer();cbo=gl.createBuffer();ibo=gl.createBuffer();
}

function uploadMesh(mesh){
  gl.bindBuffer(gl.ARRAY_BUFFER,vbo);gl.bufferData(gl.ARRAY_BUFFER,mesh.verts,gl.STATIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER,nbo);gl.bufferData(gl.ARRAY_BUFFER,mesh.normals,gl.STATIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER,cbo);gl.bufferData(gl.ARRAY_BUFFER,mesh.colors,gl.STATIC_DRAW);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ibo);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,mesh.indices,gl.STATIC_DRAW);
  idxCount=mesh.count;
}

// ---------- state ----------
let state={seedStr:'',palette:0,formations:3,drift:.6,glow:.6};
let simT=0, lastNow=0;

function applySeed(s){
  const p=parseSeed(s)||parseSeed(randomSeedStr());
  state.seedStr='SPX1.'+p.layout.toString(36).padStart(4,'0')+'.'+p.detail.toString(36).padStart(4,'0')+'.'+
    B36[p.palette%5]+B36[(p.formations-1)%36]+B36[Math.round(p.trees*35)%36]+
    B36[Math.round(p.mist*35)%36]+B36[Math.round(p.drift*35)%36]+B36[Math.round(p.glow*35)%36];
  // Rebuild from seed parts (use layout/detail as mesh seed)
  const meshSeed=p.layout.toString(36)+p.detail.toString(36);
  state.palette=p.palette;state.formations=p.formations;state.drift=p.drift;state.glow=p.glow;
  document.getElementById('seedline').textContent=state.seedStr;
  document.getElementById('seedtxt').textContent=state.seedStr;
  try{
    initGL();
    const pal=PALETTES[state.palette%5];
    const isMobile=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    const grid=isMobile?40:56;
    const mesh=buildCanyon(meshSeed,pal,state.formations,grid,44);
    uploadMesh(mesh);
    dbg.textContent='mesh OK tris:'+(idxCount/3);
  }catch(e){dbg.textContent='ERR: '+String(e).slice(0,80);dbg.style.color='#f00';}
}

// ---------- render loop ----------
function frame(now){
  requestAnimationFrame(frame);
  if(document.hidden||!gl)return;
  const w=Math.floor(window.innerWidth),h=Math.floor(window.innerHeight);
  if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h);}
  const dt=lastNow?Math.min((now-lastNow)/1000,.1):.016;lastNow=now;simT+=dt;
  const t=simT, aspect=w/h;
  // Slow camera drift
  const amp=.3+state.drift*1.2;
  const cx=amp*Math.sin(t*.05), cy=2+amp*.4*Math.sin(t*.063+1.3), cz=6+amp*.5*Math.sin(t*.037+2.1);
  const V=mLookAt(cx,cy,cz, cx*.3,1+cy*.2,-12);
  const P=mPerspective(55*Math.PI/180,aspect,.1,120);
  const MVP=mMul(P,V);
  gl.clearColor(.12,.18,.28,1); // sky blue-grey
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);
  gl.useProgram(prog);
  gl.uniformMatrix4fv(uMVP,false,new Float32Array(MVP));
  gl.uniform3f(uLight,.5,.8,.3); // sun direction
  gl.bindBuffer(gl.ARRAY_BUFFER,vbo);
  gl.enableVertexAttribArray(aPos);gl.vertexAttribPointer(aPos,3,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ARRAY_BUFFER,nbo);
  gl.enableVertexAttribArray(aNor);gl.vertexAttribPointer(aNor,3,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ARRAY_BUFFER,cbo);
  gl.enableVertexAttribArray(aCol);gl.vertexAttribPointer(aCol,3,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ibo);
  gl.drawElements(gl.TRIANGLES,idxCount,gl.UNSIGNED_SHORT,0);
  const e=gl.getError();
  if(dbg&&!dbg.textContent.startsWith('mesh'))dbg.textContent='t:'+t.toFixed(1)+' glErr:'+e;
}

document.getElementById('bNew').addEventListener('click',()=>applySeed(randomSeedStr()));
document.getElementById('bRemix').addEventListener('click',()=>applySeed(remixSeedStr(state)));

// ?seed= support
const qs=new URLSearchParams(location.search);
applySeed(qs.get('seed')||randomSeedStr());
requestAnimationFrame(frame);
</script>
</body></html>
