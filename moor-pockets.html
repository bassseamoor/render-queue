<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Moor Pockets</title>
<style>
  :root { --bg:#0a0b0d; --panel:#0e1013; --txt:#e8eaed; --dim:#8a93a0; --line:rgba(255,255,255,.08); --acc:#7fd08a; --warn:#e0a35e; --bad:#e0705e; --r:14px; --r2:9px; }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--txt); font:15px/1.5 -apple-system,system-ui,"SF Pro Text",sans-serif; overflow:hidden; }
  /* ---------- panels under the sliding screen ---------- */
  #side { position:fixed; top:0; bottom:0; left:0; width:66%; max-width:340px; background:var(--panel);
    border-right:1px solid var(--line); z-index:10; overflow-y:auto; padding:26px 20px; touch-action:pan-y; }
  #agentside { position:fixed; top:0; bottom:0; right:0; width:66%; max-width:340px; background:var(--panel);
    border-left:1px solid var(--line); z-index:10; overflow-y:auto; padding:22px 18px; touch-action:pan-y; }
  .side-title { font-size:12px; letter-spacing:3px; color:var(--dim); margin-bottom:8px; }
  /* pocket tree: quiet navigator, not a panel */
  .trow .tname { flex:1; }
  .taskbtn { width:27px; height:27px; border-radius:50%; background:var(--txt); color:#000; flex-shrink:0;
    border:none; box-shadow:none; font-size:17px; line-height:1; padding:0 0 2px; cursor:pointer;
    -webkit-appearance:none; appearance:none; -webkit-tap-highlight-color:transparent; }
  .taskbtn:active { transform:scale(.92); }
  /* task panel: slides in from the right, under the sheet */
  #taskside { position:fixed; top:0; bottom:0; right:0; width:88%; max-width:420px; background:var(--panel);
    border-left:1px solid var(--line); z-index:15; overflow-y:auto; padding:26px 20px 60px; touch-action:pan-y; }
  .tlabel { font-size:11px; letter-spacing:2px; color:var(--dim); text-transform:uppercase;
    padding:16px 2px 8px; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .tlabel.cur { color:var(--txt); }
  .trow { display:flex; align-items:center; gap:10px; padding:11px 2px; font-size:15px;
    border-bottom:1px solid var(--line); cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .trow.cur { font-weight:700; }
  .trow .tdot { color:var(--acc); font-size:11px; width:14px; flex-shrink:0; }
  .trow.tnew { color:var(--dim); border-bottom:none; margin-top:6px; }
  .dimblock { margin-bottom:6px; }
  .dimname { font-size:16px; font-weight:600; padding:12px 4px; cursor:pointer; border-bottom:1px solid var(--line); -webkit-tap-highlight-color:transparent; }
  .tabs { display:flex; border-bottom:1px solid var(--line); }
  .tab { flex:1; font-size:13px; padding:10px 4px; text-align:center; color:var(--dim); cursor:pointer; -webkit-tap-highlight-color:transparent;
    border-right:1px solid var(--line); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tab:last-child { border-right:none; }
  .tab.active { color:#000; background:var(--txt); font-weight:600; }
  .tab.empty { color:#3a3f47; cursor:default; }
  .side-actions { margin-top:18px; display:grid; gap:0; border-top:1px solid var(--line); }
  .side-actions button { border:none; border-bottom:1px solid var(--line); background:none; text-align:left;
    padding:14px 4px; font-size:14px; color:var(--txt); cursor:pointer; }
  .side-actions button:hover { background:#14161a; }
  /* ---------- main screen (slides to reveal panels) ---------- */
  #view { position:fixed; top:0; right:0; bottom:0; left:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
    background:var(--bg); z-index:20; transition:transform .22s ease; touch-action:pan-y; box-shadow:none; }
  .wrap { max-width:760px; margin:0 auto; padding:26px 22px 60px; }
  .vhead { border-bottom:1px solid var(--line); padding-bottom:14px; margin-bottom:0; }
  .vhead .crumb { font-size:11px; letter-spacing:2px; color:var(--dim); text-transform:uppercase; }
  .vhead h2 { margin:6px 0 2px; font-size:24px; font-weight:700; letter-spacing:.5px; }
  .vhead .sub { color:var(--dim); font-size:13px; }
  .sect { background:#101216; border:none; border-radius:var(--r);
    padding:18px; margin:14px 0; box-shadow:0 6px 20px rgba(0,0,0,.35); }
  .sect > h3 { margin:0 0 12px; font-size:11px; letter-spacing:2px; color:var(--dim); text-transform:uppercase; font-weight:600; }
  .abody { max-height:0; overflow:hidden; transition:max-height .34s cubic-bezier(.32,.72,.28,1); margin:10px 0 12px; }
  /* ---------- pocket composition: identity → command → contents ---------- */
  .phead { margin-bottom:24px; }
  .eyebrow { font-size:11px; letter-spacing:3px; color:var(--dim); text-transform:uppercase; }
  .pname { font-size:30px; font-weight:700; margin:8px 0 2px; letter-spacing:.5px; }
  .ppurpose { font-size:14px; color:var(--dim); }
  .pchips { margin-top:12px; display:flex; gap:8px; flex-wrap:wrap; }
  .group { margin:0 0 28px; }
  .group.cmd, .group.harness { margin-bottom:32px; }
  .glabel { font-size:11px; letter-spacing:3px; color:var(--dim); text-transform:uppercase; padding:0 2px 8px; }
  .grows { border-top:1px solid var(--line); }
  .grow { display:flex; justify-content:space-between; align-items:center; gap:12px;
    padding:14px 2px; border-bottom:1px solid var(--line); cursor:pointer;
    -webkit-tap-highlight-color:transparent; }
  .grow-t { font-size:15px; }
  .grow-t .gsub { color:var(--dim); font-size:13px; font-weight:400; }
  .grow-d { font-size:13px; color:var(--dim); margin-top:3px; }
  .grow-r { display:flex; align-items:center; gap:10px; color:var(--dim); font-size:13px; flex-shrink:0; }
  .grow-r .cnt.hot { color:var(--txt); font-weight:700; }
  .grow-r .qcount { font-variant-numeric:tabular-nums; }
  .startlink { color:var(--txt); font-weight:600; white-space:nowrap; }
  .chev { font-size:18px; color:var(--dim); display:inline-block; transition:transform .25s ease; line-height:1; }
  .grow.open .chev { transform:rotate(90deg); color:var(--txt); }
  /* the raised dark panel — deployed only when a row opens */
  .panel { background:#101216; border-radius:var(--r); box-shadow:0 8px 24px rgba(0,0,0,.45); padding:16px 18px; }
  .rowline { display:flex; gap:8px; }
  input[type=text], textarea, select { -webkit-appearance:none; appearance:none; background:#14161a; color:var(--txt); border:none;
    border-radius:var(--r2); padding:12px; font-size:15px; width:100%; }
  input[type=text]:focus, textarea:focus { outline:none; box-shadow:0 0 0 2px rgba(255,255,255,.12); }
  textarea { min-height:76px; resize:vertical; }
  button { -webkit-appearance:none; appearance:none; -webkit-tap-highlight-color:transparent; outline:none;
    background:#1a1d22; color:var(--txt); border:none; border-radius:var(--r2);
    padding:12px 18px; font-size:14px; cursor:pointer; box-shadow:none; }
  button:focus { outline:none; }
  button:active { background:#22262c; }
  button.primary { background:var(--txt); color:#000; border:none; font-weight:600; box-shadow:none; }
  button.small { padding:7px 12px; font-size:12px; }
  button.on { color:var(--acc); }
  button.sel { color:var(--warn); }
  .lockbtn { width:42px; height:42px; border-radius:50%; border:1px solid currentColor; background:none;
    display:inline-flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:none; padding:0; flex:none; }
  .lockbtn.red { color:var(--bad); }
  .lockbtn.green { color:var(--acc); }
  .backbtn { background:none; border:none; box-shadow:none; color:var(--dim); font-size:14px;
    padding:10px 0 2px; cursor:pointer; text-align:left; }
  .stage { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
  .stage:last-child { border-bottom:none; }
  .stage .inf { flex:1; } .stage .n { font-weight:600; font-size:13px; } .stage .d { color:var(--dim); font-size:12px; }
  .stream { font-size:13px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  .ev { padding:6px 0; border-bottom:1px solid var(--line); display:flex; gap:10px; }
  .ev .tm { color:var(--dim); font-size:11px; white-space:nowrap; padding-top:2px; }
  .ev.pass .tx { color:var(--acc); } .ev.fail .tx { color:var(--bad); } .ev.q .tx { color:var(--warn); } .ev.seal .tx { color:#9fd0a5; }
  .list .it { padding:10px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .list .k { color:var(--dim); font-size:10px; text-transform:uppercase; letter-spacing:2px; }
  .list .ts { color:var(--dim); font-size:11px; }
  .qa { background:#101216; border:none; border-radius:var(--r);
    padding:18px; margin:0 0 14px; box-shadow:0 6px 20px rgba(0,0,0,.35); }
  .qa .qq { font-weight:600; margin-bottom:12px; font-size:16px; }
  .qa .rowline { margin-top:10px; }
  .qa .rej { color:var(--bad); font-size:12px; margin-top:10px; }
  .qa .note, .note { color:var(--dim); font-size:12px; }
  .welcome { text-align:center; padding:20vh 30px; color:var(--dim); }
  .welcome .big { font-size:13px; letter-spacing:4px; margin-bottom:14px; color:var(--txt); }
  .pill { display:inline-block; font-size:10px; border:1px solid rgba(255,255,255,.22); border-radius:20px; padding:3px 10px; letter-spacing:1px; color:var(--dim); margin-right:6px; }
  .depthrow { display:flex; gap:6px; }
  .err { color:var(--bad); font-size:12px; margin-top:8px; }
  .vc { font-size:10px; letter-spacing:1px; padding:2px 8px; border:1px solid var(--line); }
  .vc.pass { color:var(--acc); border-color:var(--acc); }
  .vc.fail { color:var(--bad); border-color:var(--bad); }
  .qlabel { font-size:16px; font-weight:600; margin-bottom:8px; }
  .vhead.home h2 { font-size:34px; }
  .nextmove { display:block; width:100%; text-align:left; background:#15171c; color:var(--txt);
    border:none; border-radius:var(--r); padding:18px; font-size:17px; font-weight:700;
    margin:16px 0 4px; cursor:pointer; box-shadow:none; }
  .nextmove .sub { display:block; font-size:13px; color:var(--dim); font-weight:400; margin-top:4px; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; border:1px solid var(--line); margin-right:6px; }
  .dot.on { background:var(--acc); border-color:var(--acc); }
  .quizq { font-size:24px; font-weight:700; margin:6px 0 4px; }
  .md .mdh { font-weight:700; font-size:15px; margin:10px 0 4px; }
  .md .mdli { margin:3px 0 3px 14px; }
  .md code { font-family:monospace; background:#0c0e11; padding:1px 5px; font-size:12px; }
  .folders { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:6px; }
  .fchip { -webkit-appearance:none; appearance:none; -webkit-tap-highlight-color:transparent; font-size:14px; padding:9px 16px; border:none; border-radius:20px; color:var(--dim); cursor:pointer; background:#1a1d22; box-shadow:none; }
  .fchip.on { color:#000; background:var(--txt); font-weight:600; }
  .frow { display:flex; justify-content:space-between; align-items:center; padding:15px 0; font-size:15px; border-bottom:1px solid var(--line); cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .frow .cnt { color:var(--dim); }
  /* ---------- notification bell: global chrome, top right ---------- */
  #bellBtn { position:fixed; top:calc(10px + env(safe-area-inset-top,0px)); right:12px; z-index:40;
    background:none; border:none; box-shadow:none; padding:10px; border-radius:50%; color:var(--dim);
    -webkit-appearance:none; appearance:none; -webkit-tap-highlight-color:transparent; cursor:pointer; }
  #bellBtn:active { color:var(--txt); }
  #bellBadge { position:absolute; top:4px; right:4px; min-width:16px; height:16px; border-radius:9px;
    background:var(--bad); color:#fff; font-size:10px; font-weight:700; line-height:16px; text-align:center; padding:0 4px; }
  #bellDrop { position:fixed; top:calc(54px + env(safe-area-inset-top,0px)); right:12px; width:280px; max-width:82vw;
    background:#101216; border-radius:var(--r); box-shadow:0 12px 32px rgba(0,0,0,.55); z-index:41;
    max-height:60vh; overflow-y:auto; }
  /* top-right cluster: library · settings · notifications */
  #libBtn { position:fixed; top:calc(10px + env(safe-area-inset-top,0px)); right:96px; z-index:40;
    background:none; border:none; box-shadow:none; padding:10px; border-radius:50%; color:var(--dim);
    -webkit-appearance:none; appearance:none; -webkit-tap-highlight-color:transparent; cursor:pointer; }
  #libBtn:active { color:var(--txt); }
  #gearBtn { position:fixed; top:calc(10px + env(safe-area-inset-top,0px)); right:54px; z-index:40;
    background:none; border:none; box-shadow:none; padding:10px; border-radius:50%; color:var(--dim);
    -webkit-appearance:none; appearance:none; -webkit-tap-highlight-color:transparent; cursor:pointer; }
  #gearBtn:active { color:var(--txt); }
  #setDrop { position:fixed; top:calc(54px + env(safe-area-inset-top,0px)); right:12px; width:280px; max-width:82vw;
    background:#101216; border-radius:var(--r); box-shadow:0 12px 32px rgba(0,0,0,.55); z-index:41;
    max-height:60vh; overflow-y:auto; }
  /* library: the clean app grid */
  #libOverlay { position:fixed; inset:0; z-index:60; background:var(--bg); overflow-y:auto; }
  .libGrid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .libTile { background:#101216; border-radius:var(--r); padding:18px 16px; cursor:pointer;
    box-shadow:0 8px 24px rgba(0,0,0,.35); -webkit-tap-highlight-color:transparent; }
  .libTile:active { transform:scale(.97); }
  .libTile .lt { font-size:16px; font-weight:600; }
  .libTile .ls { font-size:12px; color:var(--dim); margin-top:4px; }
  .libTile.new { color:var(--dim); display:flex; align-items:center; justify-content:center; min-height:96px; }
  /* filter rule editors */
  .fedit { padding:10px 2px 4px; }
  .fhint { font-size:11px; color:var(--dim); margin-bottom:8px; }
  .frow2 { display:flex; gap:8px; }
  .frow2 input { flex:1; }
  .frow2 #fNum { max-width:90px; flex:none; }
  /* file document view */
  #docText { width:100%; min-height:280px; }
  .docro { white-space:normal; font-size:14px; line-height:1.55; color:var(--txt);
    background:#101216; border-radius:var(--r); padding:16px; }
  .btn.danger { background:#2a1214; color:#ff8a8a; box-shadow:none; }
  .nrow { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:12px 16px;
    border-bottom:1px solid var(--line); cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .nrow:last-child { border-bottom:none; }
  .nrow .nt { font-size:14px; }
  .nrow .nsub { font-size:12px; color:var(--dim); margin-top:2px; }
  /* ---------- new-pocket FAB: the one element allowed a higher layer ---------- */
  #fabBtn { position:fixed; bottom:calc(22px + env(safe-area-inset-bottom,0px)); right:20px; z-index:40;
    width:58px; height:58px; border-radius:50%; background:var(--txt); color:#000;
    border:none; box-shadow:0 10px 28px rgba(0,0,0,.55); font-size:30px; line-height:1; font-weight:400;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    -webkit-appearance:none; appearance:none; -webkit-tap-highlight-color:transparent;
    transition:transform .15s ease; padding:0 0 2px; }
  #fabBtn:active { transform:scale(.93); }
  #fabBtn.open { transform:rotate(45deg); }
  #fabBtn.open:active { transform:rotate(45deg) scale(.93); }
  #fabMenu { position:fixed; bottom:calc(94px + env(safe-area-inset-bottom,0px)); right:20px; z-index:41;
    background:#101216; border-radius:var(--r); box-shadow:0 12px 32px rgba(0,0,0,.55);
    min-width:200px; max-width:78vw; overflow:hidden; }
</style>
</head>
<body>
<aside id="side">
    <div class="side-title">MOOR<br>POCKETS</div>
    <div class="trow tmain" id="bMainS"><span class="tname">Main storage</span><span class="chev">›</span></div>
    <div class="tlabel">Pockets</div>
    <div id="dimList"></div>
    <div class="trow tnew" id="bNewDim">+ New pocket</div>
    <div id="dimForm"></div>
</aside>
<aside id="agentside">
    <div class="side-title">AGENTS</div>
    <div id="agentPanel"></div>
</aside>
<aside id="taskside">
    <div id="taskBody"></div>
</aside>
<main id="view"></main>
<button id="bellBtn" aria-label="notifications"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span id="bellBadge" style="display:none"></span></button>
<div id="bellDrop" style="display:none"></div>
<button id="fabBtn" aria-label="new">+</button>
<div id="fabMenu" style="display:none"></div>
<button id="libBtn" aria-label="library"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
<button id="gearBtn" aria-label="settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
<div id="setDrop" style="display:none"></div>
<div id="libOverlay" style="display:none"><div class="wrap">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:22px">
    <div class="eyebrow">Library</div>
    <button class="backbtn" id="libClose">✕ Close</button>
  </div>
  <div class="libGrid" id="libGrid"></div>
</div></div>

<script>
"use strict";
/* Moor pockets host harnesses. Each pocket: one lead + up to 3 agents.
   The pocket's filter gates everything kept. Event stream is unfilterable audit.
   Brain is a stub — plug a real model in at stubBrain(). */

const PREFIX="harness.";
const DB = {
  load(k,d){ try{ const v=localStorage.getItem(PREFIX+k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  save(k,v){ try{ localStorage.setItem(PREFIX+k, JSON.stringify(v)); }catch(e){} }
};
const uid = () => "x"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const nowT = () => new Date().toLocaleTimeString([], {hour12:false});
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MAX_AGENTS = 3;

/* ---------------- filter stages ---------------- */
const STOP = new Set("a,an,the,and,or,of,to,in,on,for,with,by,from,as,at,is,are,was,were,be,been,it,its,this,that,these,those,i,you,we,they,he,she,my,your,our,their,me,him,her,us,do,does,did,can,could,should,would,will,just,very,really,so,up,out,about,into,over,after,before,not,no,yes,if,then,than,too,also,how,what,when,where,who,why,which".split(","));
const words = s => String(s||"").toLowerCase().replace(/[^a-z0-9\s]/g," ").split(/\s+/).filter(w=>w.length>3 && !STOP.has(w));
/* the filter's rules are the user's — word lists and thresholds editable per pocket */
const DEFAULT_FILTER={vague:"thing,things,stuff,something,somehow,etc.,various,miscellaneous,and so on",
  assume:"assume,assumes,assumed,assuming,assumption,probably,likely,presumably,i guess,should be fine",
  groundedMin:2,taskMin:2};
function fconf(dim){ return Object.assign({},DEFAULT_FILTER,dim.filterConfig||{}); }
function escReg(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }
let fStageOpen=null;
const STAGES = [
  { id:"no-vague", name:"No vague words", desc:"Rejects filler like thing, stuff, etc.",
    kinds:["purpose","answer","note","result"],
    check(res,ctx,dim){ const list=fconf(dim).vague.split(",").map(s=>s.trim()).filter(Boolean);
      if(!list.length) return {pass:true,note:"no filler"};
      const m=String(res).match(new RegExp("\\b("+list.map(escReg).join("|")+")\\b","i"));
      return m?{pass:false,note:'vague word "'+m[1]+'"'}:{pass:true,note:"no filler"}; } },
  { id:"no-assumption", name:"No assumptions", desc:"Rejects probably, assume, likely.",
    kinds:["purpose","answer","note","result"],
    check(res,ctx,dim){ const list=fconf(dim).assume.split(",").map(s=>s.trim()).filter(Boolean);
      if(!list.length) return {pass:true,note:"no assumptions"};
      const m=String(res).match(new RegExp("\\b("+list.map(escReg).join("|")+")\\b","i"));
      return m?{pass:false,note:'assumes: "'+m[1]+'"'}:{pass:true,note:"no assumptions"}; } },
  { id:"grounded", name:"Grounded", desc:"Agent output must reuse specifics already in the pocket.",
    kinds:["note","result"],
    check(res,ctx,dim){ const aw=new Set(); (ctx.answers||[]).forEach(a=>words(a).forEach(w=>aw.add(w)));
      if(!aw.size) return {pass:true,note:"nothing to ground in yet"};
      const need=Math.max(1,+fconf(dim).groundedMin||2);
      const rw=new Set(words(res)); let hit=0; aw.forEach(w=>{ if(rw.has(w)) hit++; });
      return hit>=need?{pass:true,note:hit+" specifics carried over"}:{pass:false,note:"only "+hit+" pocket specifics present (needs "+need+")"}; } },
  { id:"on-task", name:"On purpose", desc:"Stays on the pocket's purpose. Answers are new information — exempt.",
    kinds:["purpose","note","result"],
    check(res,ctx,dim){ const need=Math.max(1,+fconf(dim).taskMin||2);
      const tw=new Set(words(ctx.task)); const rw=new Set(words(res)); let hit=0; tw.forEach(w=>{ if(rw.has(w)) hit++; });
      return hit>=need?{pass:true,note:"on purpose"}:{pass:false,note:"drifted from purpose ("+hit+"/"+need+")"}; } },
];

/* ---------------- question generators (lead-owned) ---------------- */
function genOutward(input, priorQs){
  const qs=[], lower=String(input).toLowerCase(), seen=new Set(priorQs||[]);
  const push=q=>{ if(!seen.has(q)&&!qs.includes(q)) qs.push(q); };
  const vh=lower.match(/\b(thing|things|stuff|something|somehow|etc|various)\b/);
  if(vh) push('When you say "'+vh[1]+'", what specifically do you mean?');
  const pr=lower.match(/\b(it|they|them)\b/);
  if(pr) push('You said "'+pr[1]+'" — what does that refer to?');
  if(/(make|build|create|write|plan|design|do|handle)/.test(lower) && !/(for|my|our)\s+[a-z]+/.test(lower)) push("Who is this for?");
  if(/\b(soon|later|asap|quickly|eventually)\b/.test(lower)) push("What timeline are you thinking?");
  push("What does a good result look like for this?");
  return qs;
}
function genInward(draft, verdicts, depth){
  const qs=[];
  verdicts.filter(v=>!v.pass).forEach(v=>qs.push('Your filter flagged "'+v.stage.name+'": '+v.note+'. How do you address that?'));
  qs.push("Which claim in your result is least supported by what you were told?");
  qs.push("What are you assuming that nobody stated?");
  qs.push("If this result is wrong, what is the most likely way?");
  qs.push("What did you leave out, and why?");
  return qs.slice(0, depth);
}
function stubBrain(task, brief, clarifications, opQuestions){
  const cl=clarifications||[];
  const attempt="Attempt — working \""+task+"\": "+brief+". First, pin down the concrete deliverable in the brief. Then execute each element in the order given, checking each against the pocket's purpose before moving on.";
  const reasoning="Reasoning — "+(cl.length
    ? cl.length+" auditor clarification"+(cl.length===1?"":"s")+" closed the open points: "+cl.map(c=>c.a).join("; ")+"."
    : "no auditor clarifications were recorded, so this sticks to the brief's explicit terms and flags gaps instead of filling them.")
    +(opQuestions&&opQuestions.length?" Operator questions addressed: "+opQuestions.join(" | ")+".":"");
  const open="Open questions — "+(cl.length
    ? "none outstanding; the clarifications closed them."
    : "the brief leaves gaps the auditor did not clarify; they are listed here rather than guessed.");
  return "Draft for: "+task+"\n\n"+attempt+"\n\n"+reasoning+"\n\n"+open;
}
function stubRevise(draft, verdicts){
  let out=draft;
  const fixes={"thing":"item","things":"items","stuff":"materials","something":"one element","somehow":"in a defined way","etc.":"", "etc":"", "various":"several","miscellaneous":"mixed","and so on":"",
    "probably":"","likely":"","presumably":"","assumed":"noted","assumes":"notes","assume":"note","assumption":"note","i guess":"", "should be fine":"verified"};
  verdicts.filter(v=>!v.pass).forEach(v=>{
    const m=(v.note.match(/"([^"]+)"/)||[])[1];
    if(m && fixes[m.toLowerCase()]!==undefined) out=out.replace(new RegExp("\\b"+m.replace(".","\\.")+"\\b","i"), fixes[m.toLowerCase()]);
  });
  return out;
}

/* ---------------- the model: user-connected, OpenAI-compatible ----------------
   paste a key in Settings → Model and the stubs step aside: the receiver drafts,
   the lead revises, the auditor clarifies — for real. no key = stubs (current).
   key stays in this browser's local storage. calls cost per your provider. */
function modelCfg(){ return DB.load("modelcfg",{baseUrl:"https://api.openai.com/v1",key:"",model:"gpt-4o-mini"}); }
function saveModelCfg(c){ DB.save("modelcfg",c); }
function modelOn(){ const c=modelCfg(); return !!(c.key&&c.key.trim()); }
async function modelCall(system,user){
  const cfg=modelCfg();
  if(!cfg.key||!cfg.key.trim()) return null;
  const r=await fetch(cfg.baseUrl.replace(/\/+$/,"")+"/chat/completions",{
    method:"POST",
    headers:{"Content-Type":"application/json","Authorization":"Bearer "+cfg.key.trim()},
    body:JSON.stringify({model:cfg.model||"gpt-4o-mini",
      messages:[{role:"system",content:system},{role:"user",content:user}],
      temperature:0.7,max_tokens:1500})
  });
  if(!r.ok){ const t=await r.text().catch(()=> ""); throw new Error("model HTTP "+r.status+" "+String(t).slice(0,120)); }
  const j=await r.json();
  const txt=j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
  return (txt||"").trim()||null;
}

function putEntry(did,e){ const s=entries(did); const full=Object.assign({id:uid(),t:nowT(),ts:Date.now()},e); s.push(full); DB.save(dkey(did),s); return full; }
function log(did,text,cls){ putEntry(did,{kind:"event",text,cls:cls||""}); }
/* 2026-10-12: outward questions default flipped to off — the auditor clarifies
   from the audited brief, no live round. migrate stored pockets once, logged. */
dims.forEach(d=>{
  if(d.lead&&d.lead.qgen&&d.lead.qgen.outward===true){
    d.lead.qgen.outward=false;
    putEntry(d.id,{kind:"event",cls:"q",text:"outward questions → off: the auditor now clarifies from the audited brief (toggle it in the lead panel to step in live)"});
  }
});

function dimCtx(dim){ return { task:dim.purpose, answers:entries(dim.id).filter(e=>e.kind==="answer").map(e=>e.text).slice(-12) }; }
function runFilter(dim,text,kind,ctx){
  return STAGES.filter(s=>dim.filters[s.id] && s.kinds.includes(kind)).map(s=>{
    const v=s.check(text,ctx||dimCtx(dim),dim); return {stage:s,pass:v.pass,note:v.note};
  });
}
function admit(dim,kind,text,by,ctxOverride,extra){
  // owner-originated kinds file straight into their folder: event, input, question.
  // agent-originated kinds (note, result) can only PROPOSE — they wait in
  // Pending review until the owner accepts them. purpose is the owner's founding act.
  if(kind==="event"||kind==="input"||kind==="question"){ const be=putEntry(dim.id,Object.assign({kind,text,by:by||""},extra||{})); return {ok:true,id:be.id}; }
  const verdicts=runFilter(dim,text,kind,ctxOverride);
  verdicts.forEach(v=>putEntry(dim.id,{kind:"event",cls:v.pass?"pass":"fail",
    text:(v.pass?"PASS":"FAIL")+" · "+v.stage.name+" — "+v.note+" · on incoming "+kind+(by?" · from "+by:"")}));
  if(verdicts.length && verdicts.every(v=>v.pass)){
    if(dim.memoryOn){
      const proposed=(kind==="note"||kind==="result");
      const e=putEntry(dim.id,Object.assign({kind,text,by:by||"",pending:proposed},extra||{}));
      if(proposed) log(dim.id,kind+" proposed by "+by+" — waiting for your word","seal");
      return {ok:true,pending:proposed,id:e.id};
    }
    else log(dim.id,"memory off — "+kind+" seen but not retained","seal");
    return {ok:true,pending:(kind==="note"||kind==="result")};
  }
  if(!verdicts.length) return {ok:true};
  return {ok:false, reason:verdicts.filter(v=>!v.pass).map(v=>v.stage.name+": "+v.note).join("; ")};
}

/* ---------------- creation ---------------- */
function createDimension(name,purpose,spec){
  const dim={id:uid(),name,purpose,memoryOn:true,orders:[],locks:{},spec:spec||null,
    filters:Object.fromEntries(STAGES.map(s=>[s.id,true])),
    lead:{id:uid(),name:name+"-lead",qgen:{outward:false,inward:true,depth:4}},
    agents:[],created:Date.now()};
  dims.push(dim);
  log(dim.id,"pocket sealed — harness inside. Filter armed: "+STAGES.map(s=>s.name).join(", "),"seal");
  const adm=admit(dim,"purpose",purpose,"owner",{task:purpose,answers:[]});
  if(!adm.ok){ dims=dims.filter(x=>x.id!==dim.id); return {ok:false,reason:adm.reason}; }
  log(dim.id,"lead "+dim.lead.name+" runs inside — owns the question generators","seal");
  saveDims(); return {ok:true,dim};
}
function createAgent(dim,name,task){
  if(dim.agents.length>=MAX_AGENTS) return {ok:false,reason:"this pocket already has "+MAX_AGENTS+" agents"};
  const a={id:uid(),name,task,created:Date.now()};
  dim.agents.push(a); saveDims();
  log(dim.id,"agent "+name+" entered the harness — task: "+task,"seal");
  return {ok:true,agent:a};
}

(function(){
  let drag=false,sx=0,dx=0;
  const W=()=>view.clientWidth*0.66;
  const setVis=()=>{
    const m=/translateX\((-?\d+\.?\d*)px\)/.exec(view.style.transform||"");
    const cur=m?parseFloat(m[1]):0;
    side.style.visibility=cur>8?"visible":"hidden";
    agentside.style.visibility=(cur<-8&&!taskFor)?"visible":"hidden";
    taskside.style.visibility=taskFor?"visible":"hidden";
    /* the sheet floats over the panels — the shadow is its edge */
    view.style.boxShadow=cur>8?"-24px 0 48px rgba(0,0,0,.65)":cur<-8?"24px 0 48px rgba(0,0,0,.65)":"none";
  };
  side.style.visibility="hidden"; agentside.style.visibility="hidden"; taskside.style.visibility="hidden";
  /* swipe from anywhere — the middle page, or the revealed panels (not while the task panel is up) */
  document.addEventListener("pointerdown",e=>{
    if(taskFor) return;
    if(e.target.closest&&e.target.closest("input,textarea,select,button,a")) return;
    drag=true; sx=e.clientX; dx=0; view.style.transition="none";
  });
  document.addEventListener("pointermove",e=>{
    if(!drag) return;
    const d=e.clientX-sx;
    if(!dx&&Math.abs(d)<14) return;
    dx=d;
    const w=W(), base=pdir*w;
    view.style.transform="translateX("+Math.max(-w,Math.min(w,base+d))+"px)";
    setVis();
  });
  const end=()=>{
    if(!drag) return; drag=false; view.style.transition="";
    const w=W();
    if(Math.abs(dx)<14){ view.style.transform=pdir?("translateX("+(pdir*w)+"px)"):""; setVis(); return; }
    const m=/translateX\((-?\d+\.?\d*)px\)/.exec(view.style.transform||"");
    const cur=m?parseFloat(m[1]):0;
    pdir=cur>w*0.45?1:cur<-w*0.45?-1:0;
    view.style.transform=pdir?("translateX("+(pdir*w)+"px)"):"";
    setVis();
    if(pdir===-1) renderAgentPanel();
  };
  document.addEventListener("pointerup",end);
  document.addEventListener("pointercancel",end);
})();

(function(){
  function scrollerOf(el){
    let p=el.parentElement;
    while(p){
      const cs=getComputedStyle(p);
      if((cs.overflowY==="auto"||cs.overflowY==="scroll")&&p.scrollHeight>p.clientHeight+4) return p;
      p=p.parentElement;
    }
    return document.scrollingElement||document.body;
  }
  function ensureVisible(el){
    if(!el||!el.getBoundingClientRect) return;
    const vv=window.visualViewport;
    const r=el.getBoundingClientRect();
    const ot=vv?vv.offsetTop:0;
    const vh=vv?vv.height:window.innerHeight;
    const margin=16;
    const elTop=r.top-ot, elBottom=r.bottom-ot;
    const sc=scrollerOf(el);
    if(!sc||!isFinite(sc.scrollTop)) return;
    if(elBottom>vh-margin){
      sc.scrollTop+=(elBottom-(vh-margin))+8;
    }else if(elTop<margin){
      sc.scrollTop-=(margin-elTop);
    }
  }
  let pending=null;
  document.addEventListener("focusin",e=>{
    const t=e.target;
    if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA")){
      if(pending) clearTimeout(pending);
      pending=setTimeout(()=>{ ensureVisible(t); pending=null; },380);
    }
  });
  if(window.visualViewport){
    visualViewport.addEventListener("resize",()=>{
      const t=document.activeElement;
      if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA")) ensureVisible(t);
    });
  }
})();

(function(){
  const fab=document.getElementById("fabBtn"), menu=document.getElementById("fabMenu");
  const closeMenu=()=>{ menu.style.display="none"; fab.classList.remove("open"); };
  const pocketForTask=()=>{
    if(current&&current.type==="dim") return current.id;
    if(current&&current.type==="agent") return current.dimId;
    if(dims.length===1) return dims[0].id;
    return null;
  };
  const showMain=()=>{
    menu.innerHTML=`<div class="nrow" data-fm="task"><div><div class="nt">New task</div><div class="nsub">submit to a pocket's agent</div></div><span class="chev">›</span></div>`
      +`<div class="nrow" data-fm="pocket"><div><div class="nt">New pocket</div><div class="nsub">seal a new harness</div></div><span class="chev">›</span></div>`;
    menu.querySelectorAll("[data-fm]").forEach(el=>el.onclick=()=>{
      if(el.dataset.fm==="pocket"){ closeMenu(); closePanels(); current={type:"newspec"}; render(); return; }
      const pid=pocketForTask();
      if(pid){ closeMenu(); openTask(pid); } else showPicker();
    });
  };
  const showPicker=()=>{
    if(!dims.length){ closeMenu(); closePanels(); current={type:"newspec"}; render(); return; }
    menu.innerHTML=`<div class="nrow" style="cursor:default"><div><div class="nt">Which pocket?</div></div></div>`
      +dims.map(d=>`<div class="nrow" data-fp="${d.id}"><div><div class="nt">${esc(d.name)}</div><div class="nsub">${d.agents.length} agent${d.agents.length===1?"":"s"}</div></div><span class="chev">›</span></div>`).join("");
    menu.querySelectorAll("[data-fp]").forEach(el=>el.onclick=()=>{ const pid=el.dataset.fp; closeMenu(); openTask(pid); });
  };
  fab.onclick=e=>{
    e.stopPropagation();
    if(menu.style.display!=="none"){ closeMenu(); return; }
    showMain();
    menu.style.display="";
    fab.classList.add("open");
  };
  document.addEventListener("pointerdown",e=>{
    if(menu.style.display!=="none"&&!e.target.closest("#fabMenu")&&!e.target.closest("#fabBtn")) closeMenu();
  },true);
})();
/* settings: export, reset, about — quiet dropdown under the gear */
function exportData(){
  const data={app:"moor-pockets",exported:new Date().toISOString(),
    pockets:dims.map(d=>({pocket:d,entries:entries(d.id)})),
    main:DB.load("main",[])};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="moor-pockets-backup.json"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function importData(file){
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const data=JSON.parse(rd.result);
      if(!data||data.app!=="moor-pockets"||!Array.isArray(data.pockets)) throw new Error("not a moor-pockets export");
      Object.keys(localStorage).filter(k=>k.startsWith(PREFIX)).forEach(k=>localStorage.removeItem(k));
      const keep=modelCfg();
      DB.save("dims3",data.pockets.map(x=>x.pocket));
      data.pockets.forEach(x=>DB.save(dkey(x.pocket.id),x.entries||[]));
      if(Array.isArray(data.main)) DB.save("main",data.main);
      if(keep&&keep.key) saveModelCfg(keep);
      location.reload();
    }catch(e){ alert("Import failed: "+String(e.message||e)); }
  };
  rd.readAsText(file);
}

        fi.onchange=()=>{ if(fi.files&&fi.files[0]) importData(fi.files[0]); };

        resetArmed=true; renderDrop();
        resetTimer=setTimeout(()=>{ resetArmed=false; if(drop.style.display!=="none") renderDrop(); },3000);
      }else{
        clearTimeout(resetTimer);

        location.reload();
      }
    });
    const mSave=document.getElementById("mSave");

        key:document.getElementById("mKey").value.trim(), model:document.getElementById("mModel").value.trim()||"gpt-4o-mini"});

      catch(e){ msg.textContent="failed: "+String(e.message||e).slice(0,60); }

    e.stopPropagation();
    if(drop.style.display!=="none"){ drop.style.display="none"; return; }

  };
  document.addEventListener("pointerdown",e=>{
    if(drop.style.display!=="none"&&!e.target.closest("#setDrop")&&!e.target.closest("#gearBtn")) drop.style.display="none";
  },true);
})();

function quizProgress(dim){ return SPEC_QS.filter(([k])=>dim.spec&&dim.spec[k]).length; }
function quizRowHtml(dim){
  const n=quizProgress(dim);
  if(n>=SPEC_QS.length) return "";
  return `<div class="grow" id="qzRow"><div><div class="grow-t">Harness quiz</div>`
    +`<div class="grow-d">Define the agents' world.</div></div>`

}
function renderQuiz(dimId,qi){
  const dim=getDim(dimId); if(!dim){ current=null; render(); return; }
  dim.spec=dim.spec||{};
  const idx=Math.max(0,Math.min(qi,SPEC_QS.length-1));
  const [k,q,ph]=SPEC_QS[idx];
  const n=quizProgress(dim);
  const dots=SPEC_QS.map(([kk])=>`<span class="dot ${dim.spec[kk]?"on":""}"></span>`).join("");
  view.innerHTML=`<div class="wrap"><div class="vhead"><button class="backbtn" id="bkBtn">‹ Back</button><div class="crumb">${esc(dim.name)} · harness quiz</div>
    <div class="sub">question ${idx+1} of ${SPEC_QS.length} · optional</div>
    <div class="quizq">${idx+1}. ${esc(q)}</div>
    <div style="margin:14px 0 4px">${dots}</div></div>
    <div class="sect">
      <div class="note" style="margin-bottom:8px">answer for the agents, not for yourself</div>

    let h=line.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`(.+?)`/g,"<code>$1</code>");

  const r=createDimension(base+" v"+n,dim.purpose,dim.spec?JSON.parse(JSON.stringify(dim.spec)):null);
  const nd=r.dim;
  nd.filterConfig=dim.filterConfig?JSON.parse(JSON.stringify(dim.filterConfig)):null;
  nd.filters=Object.assign({},dim.filters);
  nd.lead.qgen=Object.assign({},dim.lead.qgen);
  entries(dim.id).filter(e=>(e.kind==="note"||e.kind==="input")&&!e.pending).forEach(e=>{
    putEntry(nd.id,{kind:e.kind,text:e.text,by:e.by});
  });
  saveDims();
  log(nd.id,"forked from "+dim.name+" — new version pocket. agents start fresh; purpose, spec, filter and notes carried over.","seal");
  return nd;
}

/* ---------------- the staged dispatch panel ---------------- */
function dispatchHtml(dim,a){
  const o=openOrder(dim,a.id);
  const stepper=`<div class="note">staged: draft → audit → respond → questions → send → clarify → judge. skip a stage and you get the SOP.</div><div class="err" id="sopMsg"></div>`;
  if(!o){
    const last=lastOrder(dim,a.id);
    const doneNote=last?`<div class="note">last cycle: ${last.attempts} rework${last.attempts===1?"":"s"} — judged in Pending review.</div>`:"";
    return `<div class="sect"><h3>Operator dispatch — staged</h3>${stepper}${doneNote}
      <div class="rowline"><input type="text" id="dBrief" placeholder="brief for ${esc(a.name)}"><button class="primary" id="dAudit">1 · Request audit</button></div></div>`;
  }
  if(o.stage==="audited"){
    const fails=o.verdicts.filter(v=>!v.pass);
    const vh=o.verdicts.map(v=>`<div class="ev"><span class="vc ${v.pass?"pass":"fail"}">${v.pass?"PASS":"FAIL"}</span><span>${esc(v.name)} — ${esc(v.note)}</span></div>`).join("");
    const next=fails.length
      ? (o.needsHuman
        ? `<div class="rowline"><input type="text" id="dBrief2" value="${esc(o.brief)}"><button class="primary" id="dReviseMan">Revise & re-audit</button></div>
           <div class="note">the lead couldn't answer this one — it needs your words</div>`
        : `<div><button class="primary" id="dRevise">2 · ${esc(dim.lead.name)} responds to audit</button></div>
           <div class="note">the lead revises the brief against the failures, then it's re-audited — held in the temp queue until it passes</div>`)
      : `<div><button class="primary" id="dPrep">3 · Prepare questions for receiver</button></div>`;
    return `<div class="sect"><h3>Operator dispatch — staged</h3>${stepper}
      <div class="note">brief: ${esc(o.brief)}</div><div class="stream">${vh}</div>${next}</div>`;
  }
  if(o.stage==="questions"){
    const qh=o.questions.map((q,i)=>`<div class="it"><span class="k">q${i+1}</span><br>${esc(q)}</div>`).join("");
    return `<div class="sect"><h3>Operator dispatch — staged</h3>${stepper}
      <div class="list">${qh||'<span class="note">—</span>'}</div>
      <div><button class="primary" id="dSend">4 · Send dispatch</button></div></div>`;
  }
  return `<div class="sect"><h3>Operator dispatch — staged</h3>${stepper}
    <div class="note">dispatch sent — the receiver is clarifying with the auditor below. no work starts before that.</div></div>`;
}

function renderAgent(dimId,aid){
  const dim=getDim(dimId); if(!dim){ current=null; render(); return; }
  const a=getAgent(dim,aid); if(!a){ current={type:"dim",id:dimId}; render(); return; }

  if(oo&&oo.stage==="dispatched"&&!session){
    const cqs=genOutward(oo.brief+" — "+oo.questions.join(" "),[]).slice(0,Math.max(1,dim.lead.qgen.depth));
    cqs.forEach(q=>putEntry(dim.id,{kind:"question",text:q,by:"receiver "+a.name+" → auditor"}));
    session={dimId:dim.id,agentId:a.id,orderId:oo.id,brief:oo.brief,opQuestions:oo.questions,qs:cqs,idx:0,clarifications:[],qg:dim.lead.qgen,retries:0,rejection:null};

    .map(e=>`<div class="it">${esc(e.text).replace(/\n/g,"<br>")}<br><span class="ts">${esc(e.t)}</span></div>`).join("");
  let anm=null,ago=null;

    anm=[`Clarify as auditor${left?" ("+left+" left)":""}`,"the receiver must ask before working"];
    ago=()=>{ const el=document.getElementById("qaIn"); if(el){ el.scrollIntoView({block:"center"}); el.focus(); } }; }
  else if(!openOrder(dim,aid)){ anm=["Start a dispatch","draft a brief for "+a.name];
    ago=()=>{ const el=document.getElementById("dBrief"); if(el){ el.scrollIntoView({block:"center"}); el.focus(); } }; }
  view.innerHTML=`<div class="wrap">
    <div class="vhead"><button class="backbtn" id="bkBtn">‹ Back</button><div class="crumb">${esc(dim.name)} · agent</div><h2>${esc(a.name)}</h2>
      <div class="sub">${esc(a.task)}</div>
      <div style="margin-top:10px">${others?`<select id="mvSel" style="max-width:200px">${others}</select> <button class="small" id="bMove">go to that harness</button>`:'<span class="note">no other harness has room</span>'}</div></div>
    ${anm?nextMoveHtml(anm[0],anm[1]):""}
    ${groupHtml("Harness",briefMiniHtml(dim))}
    ${dispatchHtml(dim,a)}
    ${qaHtml?`<div class="sect"><h3>Receiver clarifies with the auditor</h3>${qaHtml}</div>`:""}
    <div class="sect"><h3>Accepted results</h3><div class="list">${myres||'<span class="note">Nothing accepted yet.</span>'}</div></div>
    <div class="sect"><h3>Events</h3><div class="stream">${streamHtml(dim)}</div></div>
  </div>`;
  const nmA=document.getElementById("nmGo"); if(nmA) nmA.onclick=ago;
  document.getElementById("bkBtn").onclick=()=>{ current={type:"dim",id:dimId}; render(); };
  view.querySelectorAll(".grow[data-sect]").forEach(h=>h.onclick=()=>{
    const k=dim.id+":"+h.dataset.sect;
    const willOpen=!openSect[k];
    openSect[k]=willOpen;
    h.classList.toggle("open",willOpen);
    const wrap=h.nextElementSibling;
    if(wrap&&wrap.classList.contains("abody")) animateWrap(wrap,willOpen);
  });
  const mv=document.getElementById("bMove");
  if(mv) mv.onclick=()=>{
    const to=getDim(document.getElementById("mvSel").value);
    dim.agents=dim.agents.filter(x=>x.id!==aid); to.agents.push(a); saveDims();
    log(dim.id,"agent "+a.name+" left for the "+to.name+" harness","seal");
    log(to.id,"agent "+a.name+" arrived from "+dim.name,"seal");
    current={type:"agent",dimId:to.id,id:aid}; render();
  };
  const dAudit=document.getElementById("dAudit");
  if(dAudit) dAudit.onclick=()=>requestAudit(dim,a);
  const dRevise=document.getElementById("dRevise");
  if(dRevise) dRevise.onclick=()=>reviseAudit(dim,a);
  const dReviseMan=document.getElementById("dReviseMan");
  if(dReviseMan) dReviseMan.onclick=()=>reviseAuditManual(dim,a);
  const dPrep=document.getElementById("dPrep");
  if(dPrep) dPrep.onclick=()=>prepareQuestions(dim,a);
  const dSend=document.getElementById("dSend");
  if(dSend) dSend.onclick=()=>sendDispatch(dim,a);
  /* task submitted from the pocket's white button — prefill the dispatch brief */
  if(current.brief){ const bi=document.getElementById("dBrief"); if(bi) bi.value=current.brief; current.brief=null; }
  if(session && session.agentId===aid && session.idx<session.qs.length){
    const go=()=>answerOutward(document.getElementById("qaIn").value.trim(),false);
    document.getElementById("qaGo").onclick=go;
    document.getElementById("qaIn").onkeydown=e=>{ if(e.key==="Enter") go(); };
    document.getElementById("qaSkip").onclick=()=>answerOutward("",true);
    setTimeout(()=>{ const i=document.getElementById("qaIn"); if(i) i.focus(); },60);
  }
}

/* ---------------- the run ---------------- */
/* ---------------- staged dispatch protocol ----------------
   The operator (lead) dispatches to a sub-agent in stages. The receiver
   must clarify with the auditor before working. Skip a stage and you get
   the SOP. Sub-agents can only respond to a staged cue. */
const SOP=[
 "1 · draft the brief",
 "2 · request audit — the brief is audited and stored in the temp queue",
 "3 · respond to the audit — revise until it passes",
 "4 · prepare questions for the receiver",
 "5 · send the dispatch cue",
 "6 · receiver asks the auditor clarifying questions — no work before this",
 "7 · auditor clarifies",
 "8 · receiver works and responds to the cue",
 "9 · operator audits the response, receives it → temp queue",
 "10 · owner accepts, sends back, or rejects — the cycle repeats until done"
];
function sop(dimId,at,extra){
  const html="SOP — staged protocol · you are at: <b>"+esc(at)+"</b><br>"+SOP.map(s=>esc(s)).join("<br>")+(extra?"<br>"+esc(extra):"");
  const el=document.getElementById("sopMsg"); if(el) el.innerHTML=html;
  log(dimId,"SOP issued — out-of-order action refused at stage "+at,"fail");
}
function openOrder(dim,aid){ if(!dim.orders) dim.orders=[]; return dim.orders.find(o=>o.agentId===aid&&o.stage!=="done")||null; }
function lastOrder(dim,aid){ if(!dim.orders||!dim.orders.length) return null; return dim.orders.filter(o=>o.agentId===aid).slice(-1)[0]||null; }
function auditVerdicts(dim,a,brief){
  return runFilter(dim,brief,"purpose",{task:a.task,answers:[]}).map(v=>({name:v.stage.name,pass:v.pass,note:v.note}));
}
function requestAudit(dim,a){
  const inp=document.getElementById("dBrief"); const brief=(inp?inp.value:"").trim();
  if(!brief){ sop(dim.id,"draft","no brief — draft it first."); return; }
  const verdicts=auditVerdicts(dim,a,brief);
  verdicts.forEach(v=>putEntry(dim.id,{kind:"event",cls:v.pass?"pass":"fail",
    text:(v.pass?"PASS":"FAIL")+" · "+v.name+" — "+v.note+" · on dispatch brief for "+a.name}));
  if(!dim.orders) dim.orders=[];
  const o={id:uid(),agentId:a.id,brief,stage:"audited",verdicts,questions:[],attempts:0,lastDraft:"",dispatchEntryId:null,created:Date.now()};
  const pe=putEntry(dim.id,{kind:"dispatch",pending:true,orderId:o.id,
    text:"dispatch brief for "+a.name+": "+brief+" — audit: "+verdicts.filter(v=>v.pass).length+"/"+verdicts.length+" PASS",
    by:"operator "+dim.lead.name});
  o.dispatchEntryId=pe.id;
  dim.orders.push(o); saveDims();
  log(dim.id,"CUE audit_request · brief audited, stored in temp queue","q");
  render();
}
/* the lead answers the audit — revises the brief until it passes or gets stuck.
   the human only touches the brief when the lead demonstrably cannot. */
async function reviseAudit(dim,a){
  const o=openOrder(dim,a.id); if(!o||o.stage!=="audited") return;
  let fails=o.verdicts.filter(v=>!v.pass);
  if(!fails.length) return;
  if(modelOn()){ log(dim.id,"lead "+dim.lead.name+" is answering the audit…","q"); render(); }
  let brief=o.brief, verdicts=o.verdicts, rounds=0;
  while(rounds<5){
    let revised=null;
    if(modelOn()){
      try{
        const mc=await modelCall(
          "You are "+dim.lead.name+", the lead agent of a Moor pocket (a bounded work environment). The pocket's purpose: "+dim.purpose+".",
          "This dispatch brief failed the admission audit:\n"+fails.map(f=>"- "+f.name+": "+f.note).join("\n")
          +"\n\nBrief:\n"+brief+"\n\nRewrite the brief so it passes every failed check. Keep the owner's intent. Reply with ONLY the revised brief — no commentary, no quotes around it.");
        if(mc) revised=mc;
      }catch(e){ log(dim.id,"model call failed ("+String(e.message||e).slice(0,80)+") — stub revision used","fail"); }
    }
    if(!revised) revised=stubRevise(brief,fails);
    if(revised===brief) break;
    brief=revised; rounds++;
    verdicts=auditVerdicts(dim,a,brief);
    verdicts.forEach(v=>putEntry(dim.id,{kind:"event",cls:v.pass?"pass":"fail",
      text:(v.pass?"PASS":"FAIL")+" · "+v.name+" — "+v.note+" · lead revision round "+rounds+" for "+a.name}));
    fails=verdicts.filter(v=>!v.pass);
    if(!fails.length) break;
  }
  o.brief=brief; o.verdicts=verdicts; o.auditRounds=(o.auditRounds||0)+rounds;
  o.needsHuman=fails.length>0; saveDims();
  const s=entries(dim.id); const pe=s.find(e=>e.id===o.dispatchEntryId);
  if(pe){ pe.text="dispatch brief for "+a.name+": "+brief+" — audit: "+verdicts.filter(v=>v.pass).length+"/"+verdicts.length+" PASS"; DB.save(dkey(dim.id),s); }
  if(fails.length) log(dim.id,"lead "+dim.lead.name+(rounds?" answered the audit ("+rounds+" round"+(rounds===1?"":"s")+") but ":" could not answer the audit — ")+fails.length+" failure"+(fails.length===1?"":"s")+" remain"+(rounds?"":"")+" — needs your words","fail");
  else log(dim.id,"CUE audit_respond · lead "+dim.lead.name+" answered the audit in "+rounds+" round"+(rounds===1?"":"s")+" — all PASS","pass");
  render();
}
/* fallback: only offered when the lead got stuck — the human edits by hand */
function reviseAuditManual(dim,a){
  const o=openOrder(dim,a.id); if(!o||o.stage!=="audited") return;
  const inp=document.getElementById("dBrief2"); const brief=(inp?inp.value:"").trim();
  if(!brief){ sop(dim.id,"audited","no brief."); return; }
  if(brief===o.brief){ sop(dim.id,"audited","the brief is unchanged."); return; }
  const verdicts=auditVerdicts(dim,a,brief);
  verdicts.forEach(v=>putEntry(dim.id,{kind:"event",cls:v.pass?"pass":"fail",
    text:(v.pass?"PASS":"FAIL")+" · "+v.name+" — "+v.note+" · on hand-revised brief for "+a.name}));
  o.brief=brief; o.verdicts=verdicts; o.needsHuman=false; saveDims();
  const s=entries(dim.id); const pe=s.find(e=>e.id===o.dispatchEntryId);
  if(pe){ pe.text="dispatch brief for "+a.name+": "+brief+" — audit: "+verdicts.filter(v=>v.pass).length+"/"+verdicts.length+" PASS"; DB.save(dkey(dim.id),s); }
  log(dim.id,"you revised the brief by hand — re-audited","q");
  render();
}
function prepareQuestions(dim,a){
  const o=openOrder(dim,a.id); if(!o){ sop(dim.id,"draft"); return; }
  if(o.stage!=="audited"){ sop(dim.id,o.stage); return; }
  if(o.verdicts.some(v=>!v.pass)){ sop(dim.id,"audited","respond to the audit first — it has failures."); return; }
  o.questions=genOutward(o.brief,[]).slice(0,dim.lead.qgen.depth);
  o.stage="questions"; saveDims();
  log(dim.id,"operator prepared "+o.questions.length+" questions for "+a.name,"q");
  render();
}
async function sendDispatch(dim,a){
  const o=openOrder(dim,a.id); if(!o){ sop(dim.id,"draft"); return; }
  if(o.stage!=="questions"){ sop(dim.id,o.stage); return; }
  // the owner's tap accepts the dispatch audit into the Inbox — then the cue fires
  const s=entries(dim.id); const pe=s.find(e=>e.id===o.dispatchEntryId);
  if(pe) pe.pending=false;
  DB.save(dkey(dim.id),s);
  admit(dim,"input",o.brief,a.name);
  log(dim.id,"CUE dispatch · operator "+dim.lead.name+" → "+a.name+": "+o.brief,"q");
  o.stage="dispatched"; saveDims();
  // SOP: the receiver must ask the auditor clarifying questions before any work
  const cqs=genOutward(o.brief+" — "+o.questions.join(" "),[]).slice(0,Math.max(1,dim.lead.qgen.depth));
  cqs.forEach(q=>putEntry(dim.id,{kind:"question",text:q,by:"receiver "+a.name+" → auditor"}));
  if(dim.lead.qgen.outward){
    session={dimId:dim.id,agentId:a.id,orderId:o.id,brief:o.brief,opQuestions:o.questions,qs:cqs,idx:0,clarifications:[],qg:dim.lead.qgen,retries:0,rejection:null};
    render();
  }else{
    // outward off — the auditor clarifies from the audited brief. with a model
    // connected the auditor actually answers; otherwise the round is waived.
    let clarifications;
    if(modelOn()){
      log(dim.id,"auditor is clarifying from the brief…","q"); render();
      clarifications=[];
      for(const q of cqs){
        let a="[auditor — per the audited brief; live clarification waived]";
        try{
          const mc=await modelCall(
            "You are the auditor (admission filter) of a Moor pocket. Answer ONLY from the audited brief below, in one or two sentences. If the brief does not cover the question, say so plainly.",
            "Audited brief:\n"+o.brief+"\n\nQuestion: "+q);
          if(mc) a=mc;
        }catch(e){ log(dim.id,"auditor model call failed — waived","fail"); }
        clarifications.push({q,a});
      }
      log(dim.id,"auditor clarified "+clarifications.length+" question"+(clarifications.length===1?"":"s")+" from the brief","q");
    }else{
      clarifications=cqs.map(q=>({q,a:"[auditor — per the audited brief; live clarification waived]"}));
      log(dim.id,"outward off — auditor clarifies from the brief, no live round","q");
    }
    session={dimId:dim.id,agentId:a.id,orderId:o.id,brief:o.brief,opQuestions:o.questions,qs:[],idx:0,clarifications,qg:dim.lead.qgen,retries:0,rejection:null};
    finishTask();
  }
}
/* compounding: on your accept tap, the lead distills what worked — filed to Notes
   and folded into the harness spec, so the pocket deepens instead of just piling up. */
function distillLesson(dim,e){
  const first=String(e.text||"").split("\n")[0].slice(0,140);
  if(!first.trim()) return;
  putEntry(dim.id,{kind:"note",text:"lesson · "+(e.by||"agent")+" — what worked: "+first,by:"lead "+dim.lead.name});
  dim.spec=dim.spec||{};
  const key=first.slice(0,40);
  const cur=dim.spec["satisfactory"]||"";
  if(key&&!cur.includes(key)){
    dim.spec["satisfactory"]=(cur?cur+"\n":"")+"What worked before: "+first.slice(0,120);
    saveDims();
  }
  log(dim.id,"lead "+dim.lead.name+" distilled a lesson → Notes + harness spec","q");
}
function sendBack(dim,entryId,reason){
  const s=entries(dim.id); const i=s.findIndex(e=>e.id===entryId); if(i<0) return;
  const e=s[i]; s.splice(i,1); DB.save(dkey(dim.id),s);
  const o=dim.orders?dim.orders.find(x=>x.id===e.orderId):null;
  const attempt=o?(++o.attempts):1; saveDims();
  const revised=stubRevise(e.text+"\nOwner verdict (attempt "+attempt+"): "+reason,[]);
  putEntry(dim.id,{kind:e.kind,text:revised,by:e.by,pending:true,orderId:e.orderId});
  log(dim.id,"judged NOT good — sent back to "+e.by+" (attempt "+attempt+"): "+reason,"fail");
  log(dim.id,"CUE dispatch · rework → "+e.by,"q");
  render();
}
function answerOutward(text,skipped){
  const s=session, dim=getDim(s.dimId), agent=getAgent(dim,s.agentId);
  if(!skipped){
    const adm=admit(dim,"answer",text,agent.name);
    if(!adm.ok){
      s.retries++;
      if(s.retries<=1){ s.rejection=adm.reason; render(); return; }
      log(dim.id,"answer refused twice — skipped","fail");
    } else s.clarifications.push({q:s.qs[s.idx],a:text});
  } else log(dim.id,"question skipped","q");
  s.retries=0; s.rejection=null; s.idx++;
  if(s.idx<s.qs.length){ render(); return; }
  finishTask();
}
async function finishTask(){
  const s=session;
  if(!s) return; // no open dispatch cue — a sub-agent cannot respond on its own
  const dim=getDim(s.dimId), agent=getAgent(dim,s.agentId);
  const o=dim.orders?dim.orders.find(x=>x.id===s.orderId):null;
  log(dim.id,"CUE respond · "+agent.name+" answers the dispatch cue");
  let draft=null;
  if(modelOn()){
    log(dim.id,agent.name+" is drafting…","q"); render();
    try{
      const mc=await modelCall(
        "You are "+agent.name+", a worker agent inside a bounded work environment (a Moor pocket). Your task: "+agent.task+". The pocket's purpose: "+dim.purpose+". You answer only from the brief and the auditor's clarifications — never invent specifics.",
        "Dispatch brief:\n"+s.brief+"\n\nAuditor clarifications:\n"+(s.clarifications||[]).map(c=>"- "+c.q+" → "+c.a).join("\n")
        +"\n\nOperator questions to address:\n"+(s.opQuestions||[]).map((q,i)=>(i+1)+". "+q).join("\n")
        +"\n\nWrite your draft in exactly these sections:\nAttempt — ...\nReasoning — ...\nOpen questions — ...");
      if(mc){ draft=mc; log(dim.id,agent.name+" drafted via the connected model","q"); }
    }catch(e){ log(dim.id,"model call failed ("+String(e.message||e).slice(0,80)+") — stub draft used","fail"); }
  }
  if(!draft) draft=stubBrain(agent.task,s.brief,s.clarifications,s.opQuestions||[]);
  // the draft is the agent's work on its task — purpose-alignment was already
  // enforced when the brief was audited, so judge it against the task, not the purpose text.
  const draftCtx=Object.assign(dimCtx(dim),{task:agent.task});
  let verdicts=runFilter(dim,draft,"result",draftCtx);
  if(s.qg.inward){
    const iq=genInward(draft,verdicts,s.qg.depth);
    log(dim.id,"lead "+dim.lead.name+" interrogates the draft: "+iq.length+" questions","q");
    iq.forEach(q=>{
      const r=admit(dim,"note","interrogation · "+q+" → "+(modelOn()?"[model] recorded for review":"[stub — no model] recorded for review"),agent.name,null,o?{orderId:o.id}:null);
      if(!r.ok) log(dim.id,"interrogation note refused: "+r.reason,"fail");
    });
    if(verdicts.some(v=>!v.pass)){
      const revised=stubRevise(draft,verdicts);
      if(revised!==draft){ log(dim.id,agent.name+" revised the draft after interrogation","q"); draft=revised; verdicts=runFilter(dim,draft,"result",draftCtx); }
    }
  }
  verdicts.forEach(v=>putEntry(dim.id,{kind:"event",cls:v.pass?"pass":"fail",
    text:(v.pass?"PASS":"FAIL")+" · "+v.stage.name+" — "+v.note+" · on draft by "+agent.name}));
  if(verdicts.length&&verdicts.every(v=>v.pass)){
    admit(dim,"result",draft,agent.name,draftCtx,o?{orderId:o.id}:null);
    if(o){ o.lastDraft=draft; o.stage="done"; saveDims(); }
    log(dim.id,"CUE receive · operator audited the answer → temp queue, waiting for your word","pass");
  } else {
    const why=verdicts.filter(v=>!v.pass).map(v=>v.stage.name+": "+v.note).join("; ");
    log(dim.id,"filter REJECTED the draft by "+agent.name,"fail");
    admit(dim,"note","Draft rejected ("+why+"). It does not enter the pocket.",agent.name,null,o?{orderId:o.id}:null);
    if(o){ o.stage="done"; saveDims(); }
  }
  if(session&&session.orderId===s.orderId) session=null; render();
}
function synthesize(dim){
  const parts=[];
  dim.agents.forEach(a=>{
    const last=entries(dim.id).filter(e=>e.kind==="result"&&e.by===a.name).slice(-1)[0];
    if(last) parts.push(a.name+": "+last.text.split("\n").slice(-1)[0]);
  });
  const draft=parts.length?"Harness synthesis:\n"+parts.map((x,i)=>(i+1)+". "+x).join("\n"):"Harness synthesis: no accepted agent results yet.";
  log(dim.id,"lead "+dim.lead.name+" drafting synthesis from "+parts.length+" agent results");
  const verdicts=runFilter(dim,draft,"result");
  verdicts.forEach(v=>putEntry(dim.id,{kind:"event",cls:v.pass?"pass":"fail",
    text:(v.pass?"PASS":"FAIL")+" · "+v.stage.name+" — "+v.note+" · on synthesis"}));
  if(verdicts.length&&verdicts.every(v=>v.pass)){ admit(dim,"result",draft,dim.lead.name); log(dim.id,"synthesis proposed — waiting for your word","pass"); }
  else log(dim.id,"synthesis REJECTED by the pocket filter","fail");
  render();
}

render();
</script>
