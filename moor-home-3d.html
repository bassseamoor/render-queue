<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Moor · Home</title>
<style>
:root{
  --bg:#0c0e0b; --ink:#f2f5ea; --mut:#a7b198; --faint:#6f7a64;
  --accent:#b8e986; --amber:#e8c87a; --blue:#9fc6e8; --rose:#e8a79f; --violet:#c4a9e8;
  --card:rgba(24,30,21,.66); --line:rgba(255,255,255,.09);
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink); overflow:hidden; overscroll-behavior:none;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
/* ---------- room ---------- */
#space{position:fixed;inset:0;perspective:1100px;overflow:hidden;touch-action:none;cursor:grab}
#space.grabbing{cursor:grabbing}
#grid{position:absolute;inset:-20%;
  background-image:linear-gradient(rgba(184,233,134,.055) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(184,233,134,.055) 1px,transparent 1px);
  background-size:46px 46px;
  -webkit-mask-image:radial-gradient(ellipse 85% 75% at 50% 45%,#000 25%,transparent 72%);
  mask-image:radial-gradient(ellipse 85% 75% at 50% 45%,#000 25%,transparent 72%);
}
.light{position:absolute;border-radius:50%;filter:blur(90px);pointer-events:none}
#lightA{width:60vmax;height:60vmax;left:-18vmax;top:-22vmax;background:radial-gradient(circle,rgba(232,200,122,.14),transparent 65%)}
#lightB{width:70vmax;height:70vmax;right:-24vmax;bottom:-26vmax;background:radial-gradient(circle,rgba(184,233,134,.12),transparent 65%)}
#dust{position:absolute;inset:0;pointer-events:none}
.mote{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(220,235,200,.5),transparent 70%);
  animation:drift linear infinite;opacity:.5}
@keyframes drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(40px,-90px,0)}}
#world{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
/* ---------- canvases ---------- */
.cv{position:absolute;left:50%;top:50%;width:min(340px,calc(100vw - 56px));
  border-radius:20px;padding:14px 16px 13px;
  background:linear-gradient(165deg,rgba(34,42,29,.78),rgba(15,19,13,.74));
  border:1px solid var(--line);
  box-shadow:0 18px 46px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.07),0 0 26px -6px var(--glow,rgba(184,233,134,.25));
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  transform-style:preserve-3d;touch-action:none;will-change:transform,opacity;
  transition:opacity .3s var(--ease), box-shadow .3s var(--ease);
}
.cv.dim{opacity:.45}
.cv.moving{box-shadow:0 30px 70px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.1),0 0 40px -4px var(--glow,rgba(184,233,134,.4));z-index:5}
.cv-top{display:flex;align-items:center;gap:12px}
.cv-ic{width:38px;height:38px;flex:0 0 38px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--glow,#b8e986) 16%,transparent);
  border:1px solid color-mix(in srgb,var(--glow,#b8e986) 35%,transparent)}
.cv-ic svg{width:21px;height:21px;stroke:var(--glow,#b8e986);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.cv-name{font-size:16.5px;font-weight:600;letter-spacing:.1px}
.cv-state{font-size:13px;color:var(--mut);margin-top:2px;min-height:17px}
.cv-actions{display:flex;gap:8px;margin-top:11px}
.abtn{flex:0 1 auto;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);
  font-size:13.5px;font-weight:600;padding:8px 16px;border-radius:999px;cursor:pointer;min-height:38px}
.abtn:active{transform:scale(.96)}
.abtn.primary{background:color-mix(in srgb,var(--glow,#b8e986) 22%,transparent);
  border-color:color-mix(in srgb,var(--glow,#b8e986) 45%,transparent)}
/* rails shown while moving */
#rail{position:fixed;left:50%;top:9%;bottom:14%;width:2px;z-index:4;pointer-events:none;opacity:0;transition:opacity .25s;
  background:linear-gradient(var(--accent),transparent 85%);transform:translateX(-50%)}
#rail.on{opacity:.55}
#slotline{position:fixed;left:50%;height:3px;border-radius:2px;z-index:4;pointer-events:none;opacity:0;transition:opacity .2s,top .18s var(--ease);
  width:min(340px,calc(100vw - 56px));transform:translateX(-50%);background:var(--accent);box-shadow:0 0 12px var(--accent)}
#slotline.on{opacity:.8}
#depthctl{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;z-index:6;display:none;gap:10px;align-items:center;
  background:rgba(18,22,16,.85);border:1px solid var(--line);border-radius:999px;padding:6px 8px;backdrop-filter:blur(10px)}
#depthctl.on{display:flex}
#depthctl button{border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);font-size:13px;font-weight:600;
  padding:8px 14px;border-radius:999px;min-height:38px}
#depthctl .dlab{font-size:12px;color:var(--mut);padding:0 4px}
/* ---------- chrome ---------- */
#topbar{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:flex-start;
  padding:calc(14px + env(safe-area-inset-top)) 18px 0;pointer-events:none}
#brand{font-size:15px;font-weight:700;letter-spacing:.4px}
#hello{font-size:13px;color:var(--mut);margin-top:3px}
#warmline{font-size:12.5px;color:var(--faint);margin-top:5px;min-height:16px;transition:opacity .5s}
.pill{pointer-events:auto;display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--mut);
  border:1px solid var(--line);background:rgba(18,22,16,.6);padding:7px 13px;border-radius:999px;backdrop-filter:blur(8px)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
#guide{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));z-index:10;
  font-size:12.5px;color:var(--faint);background:rgba(14,17,12,.55);border:1px solid var(--line);
  padding:8px 16px;border-radius:999px;backdrop-filter:blur(8px);transition:opacity .8s;white-space:nowrap;pointer-events:none}
/* ---------- inspector ---------- */
#scrim{position:fixed;inset:0;z-index:18;background:rgba(5,7,5,.45);opacity:0;pointer-events:none;transition:opacity .3s}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;z-index:20;left:0;right:0;bottom:0;max-height:80dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:linear-gradient(180deg,rgba(30,37,26,.96),rgba(17,21,15,.97));
  border:1px solid var(--line);border-bottom:none;border-radius:26px 26px 0 0;
  transform:translateY(106%);transition:transform .42s var(--ease);padding:10px 22px calc(26px + env(safe-area-inset-bottom));
  box-shadow:0 -20px 60px rgba(0,0,0,.5)}
#sheet.open{transform:none}
#grab{width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.18);margin:6px auto 14px}
.sh-head{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.sh-head .cv-ic{width:42px;height:42px;flex-basis:42px}
.sh-name{font-size:18px;font-weight:700}
.sh-sub{font-size:13px;color:var(--mut);margin-top:2px}
.sh-x{margin-left:auto;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--mut);
  width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer}
.sec{margin-top:18px}
.sec h3{font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--faint);margin-bottom:9px}
.row{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);border-radius:13px;
  background:rgba(255,255,255,.025);margin-bottom:7px;font-size:14px;line-height:1.45}
.row .k{color:var(--mut);flex:0 0 auto}
.row b{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:13px;color:var(--ink);border:1px solid var(--line);background:rgba(255,255,255,.04);
  padding:7px 13px;border-radius:999px}
.sh-actions{display:flex;gap:10px;margin-top:20px}
.sh-actions .abtn{flex:1;min-height:46px;font-size:15px}
@media(min-width:700px){
  #sheet{left:auto;top:0;right:0;bottom:0;width:392px;max-height:none;border-radius:0;border-bottom:none;
    border-right:none;transform:translateX(106%);padding-top:calc(20px + env(safe-area-inset-top))}
  #sheet.open{transform:none}
  #grab{display:none}
}
/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(12px);
  z-index:30;background:rgba(24,30,21,.92);border:1px solid var(--line);color:var(--ink);font-size:13.5px;
  padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%)}
@media(prefers-reduced-motion:reduce){.mote{animation:none}}
@media(max-width:699px){
  .cv{padding:11px 15px 10px}
  .cv-ic{width:34px;height:34px;flex:0 0 34px}
  .cv-ic svg{width:19px;height:19px}
  .cv-name{font-size:15.5px}
  .cv-state{font-size:12.5px}
  .cv-actions{margin-top:9px}
  .abtn{min-height:34px;padding:6px 14px;font-size:13px}
}
</style>
</head>
<body>
<div id="space">
  <div id="grid"></div>
  <div class="light" id="lightA"></div>
  <div class="light" id="lightB"></div>
  <div id="dust"></div>
  <div id="world"></div>
</div>
<div id="rail"></div><div id="slotline"></div>
<div id="depthctl"><button id="dcloser">Bring closer</button><span class="dlab" id="dlab">middle</span><button id="ddeeper">Send deeper</button></div>
<header id="topbar">
  <div><div id="brand">Moor</div><div id="hello">Good afternoon, Sabastian</div><div id="warmline"></div></div>
  <div><span class="pill"><span class="dot"></span>phone linked</span></div>
</header>
<div id="guide">drag to look &nbsp;·&nbsp; tap to open &nbsp;·&nbsp; hold to move</div>
<div id="scrim"></div>
<section id="sheet" aria-label="inspector">
  <div id="grab"></div>
  <div class="sh-head">
    <span class="cv-ic" id="sh-ic"></span>
    <div><div class="sh-name" id="sh-name"></div><div class="sh-sub" id="sh-sub"></div></div>
    <button class="sh-x" id="sh-x" aria-label="close">✕</button>
  </div>
  <div id="sh-body"></div>
  <div class="sh-actions" id="sh-actions"></div>
</section>
<div id="toast"></div>
<script>
"use strict";
/* ================= data ================= */
const ICONS={
 world:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c-5.5 5-5.5 12 0 17M12 3.5c5.5 5 5.5 12 0 17"/></svg>',
 focus:'<svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="7.5"/><path d="M12 9.5v3.5l2.5 2M9.5 2.5h5"/></svg>',
 servers:'<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="16" height="6.5" rx="1.5"/><circle cx="8" cy="7.2" r=".9"/><circle cx="8" cy="16.7" r=".9"/></svg>',
 notes:'<svg viewBox="0 0 24 24"><path d="M6 3.5h9l4 4v13H6z"/><path d="M15 3.5v4h4M9.5 12h6M9.5 15.5h6"/></svg>',
 agents:'<svg viewBox="0 0 24 24"><path d="M12 3l2.2 6.2L20.5 11l-6.3 2.2L12 19.5l-2.2-6.3L3.5 11l6.3-1.8z"/></svg>',
 auto:'<svg viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 0 1 13-5.1M19.5 12a7.5 7.5 0 0 1-13 5.1"/><path d="M17.5 3.5v4h-4M6.5 20.5v-4h4"/></svg>'};
const DATA={
 world:{name:"Your Little World",glow:"#b8e986",state:()=>`${S.world.creatures} creatures · ${S.world.fed?"all fed":"hungry"}`,
  actions:[["Feed","feed","primary"]],
  insp:{state:()=>["3 creatures · all fed and warm","Terrarium is humid, just how they like it","Nothing needs attention right now"],
   triggers:[["When you feed them","they gather and glow for a while"],["When night falls","they curl up and sleep"]],
   seqs:[["Feed them","then they play for a while"],["Tap a creature","then it follows your finger"]],
   conns:["Your Focus Timer","Your Notes"]}},
 focus:{name:"Your Focus Timer",glow:"#e8c87a",state:()=>S.focus.left>0?fmt(S.focus.left)+" left — stay with it":"ready when you are",
  actions:[["Start","timer","primary"]],
  insp:{state:()=>["25 minute sessions","5 minute breaks between","3 sessions finished today"],
   triggers:[["When a session starts","the room dims a little"],["When time runs out","a soft chime plays"]],
   seqs:[["Start a session","then notifications go quiet"],["Finish 4 sessions","then take a long break"]],
   conns:["Your Automations","Your Agents"]}},
 servers:{name:"Your Servers",glow:"#9fc6e8",state:()=>"web-01 is cruising",
  actions:[["Details","open"]],
  insp:{state:()=>["web-01 is cruising","backups ran last night","nothing needs attention"],
   triggers:[["When traffic spikes","an extra server wakes up"],["When a backup finishes","you get a quiet note"]],
   seqs:[["Traffic spikes","then a new server joins"],["Night falls","then backups run"]],
   conns:["Your Automations"]}},
 notes:{name:"Your Notes",glow:"#c4a9e8",state:()=>`${S.notes.count} ideas waiting`,
  actions:[["Add","addnote","primary"]],
  insp:{state:()=> [`${S.notes.count} ideas waiting`,"Newest: “greenhouse shelves”","Nothing is overdue"],
   triggers:[["When you add an idea","it lands at the top of the stack"],["When an idea is a week old","it nudges you gently"]],
   seqs:[["Add an idea","then it waits patiently"],["Pin an idea","then it stays on top"]],
   conns:["Your Agents","Your Little World"]}},
 agents:{name:"Your Agents",glow:"#e8a79f",state:()=>"finished two tasks today",
  actions:[["Assign","assign","primary"]],
  insp:{state:()=>["2 tasks finished today","1 task running now","All helpers are healthy"],
   triggers:[["When you assign a task","a helper picks it up"],["When a task finishes","you get a short summary"]],
   seqs:[["Assign a task","then a helper starts it"],["Task finishes","then you get the summary"]],
   conns:["Your Automations","Your Notes"]}},
 auto:{name:"Your Automations",glow:"#b8e986",state:()=>S.auto.on?"3 routines running":"routines are resting",
  actions:[["Pause","autorun","primary"]],
  insp:{state:()=> S.auto.on?["Morning routine · on","Nightly backup · on","Plant mister · on"]:["All routines are resting"],
   triggers:[["When morning comes","the morning routine runs"],["When you leave home","things power down"]],
   seqs:[["Morning comes","then lights, news, and coffee"],["You leave","then everything rests"]],
   conns:["Your Servers","Your Focus Timer"]}}
};
/* ================= state ================= */
const S={world:{creatures:3,fed:true},focus:{left:0,timer:null},notes:{count:2},auto:{on:true}};
let order=["world","focus","servers","notes","agents","auto"];
const depth={world:0,focus:0,servers:1,notes:2,agents:1,auto:2}; // 0 front 1 mid 2 back
const Z=[70,0,-70], ZNAME=["front","middle","back"];
const els={}, pos={};
const cam={x:0,y:0,tx:0,ty:0};
let focusedId=null, movingId=null, interacted=false;
const world=document.getElementById("world");
function fmt(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
/* ================= build ================= */
function build(){
  for(const id of order){
    const d=DATA[id],el=document.createElement("div");
    el.className="cv";el.dataset.id=id;el.style.setProperty("--glow",d.glow);
    el.innerHTML=`<div class="cv-top"><span class="cv-ic">${ICONS[id]}</span>
      <div><div class="cv-name">${d.name}</div><div class="cv-state"></div></div></div>
      <div class="cv-actions">${d.actions.map(a=>`<button class="abtn ${a[2]||""}" data-act="${a[1]}">${a[0]}</button>`).join("")}</div>`;
    el.querySelectorAll(".abtn").forEach(b=>b.addEventListener("pointerdown",e=>e.stopPropagation()));
    el.querySelectorAll(".abtn").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();doAction(id,b.dataset.act,b)}));
    world.appendChild(el);els[id]=el;pos[id]={x:0,y:0,tx:0,ty:0};
  }
  refreshStates();layout(true);
  window.addEventListener("resize",()=>layout(false));
}
function refreshStates(){for(const id of order){els[id].querySelector(".cv-state").textContent=DATA[id].state()}}
/* layout: vertical stack on phone, loose constellation on desktop */
function layout(snap){
  const w=innerWidth,h=innerHeight,desk=w>=700;
  const cw=desk?300:Math.min(340,w-56),ch=desk?132:102,gap=desk?26:13;
  const total=order.length*ch+(order.length-1)*gap;
  const shift=desk?0:Math.max(0,124-(h/2-total/2)); // keep first canvas clear of the greeting
  order.forEach((id,i)=>{
    let x,y;
    if(desk){const cols=[-1,1,-1,1,-1,1][i],rows=[0,0,1,1,2,2][i];x=cols*185;y=(rows-1)*165}
    else{y=-total/2+ch/2+i*(ch+gap)+shift;x=0}
    const p=pos[id];p.tx=x;p.ty=y;p.cw=cw;p.ch=ch;p.gap=gap;
    if(snap){p.x=x;p.y=y}
    els[id].style.width=cw+"px";
    els[id].style.height=desk?"":ch+"px";
  });
}
/* ================= camera + render loop ================= */
function tick(){
  cam.x+=(cam.tx-cam.x)*.12;cam.y+=(cam.ty-cam.y)*.12;
  for(const id of order){
    const p=pos[id],el=els[id];
    if(id!==movingId){p.x+=(p.tx-p.x)*.2;p.y+=(p.ty-p.y)*.2}
    let z=Z[depth[id]];
    if(id===focusedId)z+=46;if(id===movingId)z+=95;
    const f=.55+depth[id]*.22; // parallax factor by depth
    el.style.transform=`translate(-50%,-50%) translate3d(${(p.x+cam.x*f).toFixed(1)}px,${(p.y+cam.y*f).toFixed(1)}px,${z}px)`;
    el.classList.toggle("dim",!!focusedId&&id!==focusedId);
  }
  requestAnimationFrame(tick);
}
/* ================= pointer: tap / hold / move / parallax ================= */
let pd=null; // {id,sx,sy,t,timer,bg}
const space=document.getElementById("space");
space.addEventListener("pointerdown",e=>{
  if(e.target.closest("#topbar,#sheet,#depthctl,.abtn"))return;
  const cv=e.target.closest(".cv");
  if(cv){const id=cv.dataset.id;
    pd={id,sx:e.clientX,sy:e.clientY,t:Date.now(),bg:false};
    pd.timer=setTimeout(()=>{if(pd&&pd.id===id)startMove(id,e)},550);
    cv.setPointerCapture&&e.pointerId!==undefined&&tryCapture(e,cv);
  }else{
    pd={bg:true,sx:e.clientX,sy:e.clientY,cx:cam.tx,cy:cam.ty};
    space.classList.add("grabbing");
  }
});
function tryCapture(e,el){try{el.setPointerCapture(e.pointerId)}catch(_){}}
space.addEventListener("pointermove",e=>{
  if(!pd)return;
  const dx=e.clientX-pd.sx,dy=e.clientY-pd.sy;
  if(pd.bg){
    if(Math.hypot(dx,dy)>6)markInteracted();
    cam.tx=clamp(pd.cx+dx*.35,-70,70);cam.ty=clamp(pd.cy+dy*.35,-80,80);
  }else if(movingId){
    const p=pos[movingId];
    p.x=p.tx=e.clientX-innerWidth/2;p.y=p.ty=e.clientY-innerHeight/2;
    showSlot(e.clientY);markInteracted();
  }else if(Math.hypot(dx,dy)>12&&pd.timer){clearTimeout(pd.timer);pd.timer=null}
});
function endPointer(e){
  if(!pd)return;
  if(pd.timer){clearTimeout(pd.timer);pd.timer=null}
  if(movingId){finishMove();pd=null;space.classList.remove("grabbing");return}
  if(!pd.bg&&pd.id){
    const dt=Date.now()-pd.t,dx=e.clientX-pd.sx,dy=e.clientY-pd.sy;
    if(dt<400&&Math.hypot(dx,dy)<12)openInspector(pd.id);
  }
  pd=null;space.classList.remove("grabbing");
}
space.addEventListener("pointerup",endPointer);
space.addEventListener("pointercancel",()=>{if(pd&&pd.timer)clearTimeout(pd.timer);if(movingId)finishMove();pd=null;space.classList.remove("grabbing")});
document.addEventListener("contextmenu",e=>e.preventDefault());
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function markInteracted(){if(!interacted){interacted=true;document.getElementById("guide").style.opacity=0}}
/* move mode */
const rail=document.getElementById("rail"),slot=document.getElementById("slotline"),dctl=document.getElementById("depthctl");
function startMove(id,e){
  movingId=id;focusedId=null;closeInspector(true);
  els[id].classList.add("moving");rail.classList.add("on");dctl.classList.add("on");
  document.getElementById("dlab").textContent=ZNAME[depth[id]];
  const p=pos[id];p.x=p.tx=e.clientX-innerWidth/2;p.y=p.ty=e.clientY-innerHeight/2;
  markInteracted();
  if(navigator.vibrate)try{navigator.vibrate(12)}catch(_){}
}
function showSlot(clientY){
  const p=pos[movingId],ch=p.ch,gap=p.gap||15;
  const total=order.length*ch+(order.length-1)*gap;
  let idx=clamp(Math.round((clientY-innerHeight/2+total/2-ch/2)/(ch+gap)),0,order.length-1);
  const from=order.indexOf(movingId);
  const arr=order.filter(x=>x!==movingId);arr.splice(idx,0,movingId);
  arr.forEach((id2,i)=>{const q=pos[id2];if(id2!==movingId){q.ty=-total/2+ch/2+i*(ch+gap);q.tx=0}});
  slot.style.top=(innerHeight/2-total/2+idx*(ch+gap)-gap/2)+"px";slot.classList.add("on");
}
function finishMove(){
  const id=movingId;movingId=null;
  els[id].classList.remove("moving");rail.classList.remove("on");slot.classList.remove("on");dctl.classList.remove("on");
  const p=pos[id],ch=p.ch,gap=p.gap||15,total=order.length*ch+(order.length-1)*gap;
  let idx=clamp(Math.round((p.ty+total/2-ch/2)/(ch+gap)),0,order.length-1);
  order=order.filter(x=>x!==id);order.splice(idx,0,id);
  const deskF=innerWidth>=700;
  const shiftF=deskF?0:Math.max(0,124-(innerHeight/2-total/2));
  order.forEach((id2,i)=>{const q=pos[id2];q.ty=-total/2+ch/2+i*(ch+gap)+shiftF;q.tx=deskF?[-185,185,-185,185,-185,185][i]:0});
  toast("Moved "+DATA[id].name.replace("Your ","your "));
}
document.getElementById("dcloser").onclick=()=>{if(movingId&&depth[movingId]>0){depth[movingId]--;document.getElementById("dlab").textContent=ZNAME[depth[movingId]]}};
document.getElementById("ddeeper").onclick=()=>{if(movingId&&depth[movingId]<2){depth[movingId]++;document.getElementById("dlab").textContent=ZNAME[depth[movingId]]}};
/* ================= inspector ================= */
const sheet=document.getElementById("sheet"),scrim=document.getElementById("scrim");
let sheetOpenedAt=0; // guard: a tap's belated synthesized click must not close what it just opened
function openInspector(id){
  focusedId=id;markInteracted();
  const d=DATA[id];
  document.getElementById("sh-ic").innerHTML=ICONS[id];
  document.getElementById("sh-ic").style.setProperty("--glow",d.glow);
  document.getElementById("sh-name").textContent=d.name;
  document.getElementById("sh-sub").textContent=d.state();
  const sec=(t,rows)=>`<div class="sec"><h3>${t}</h3>${rows}</div>`;
  const kv=(k,v)=>`<div class="row"><span class="k">${k}</span><span>${v}</span></div>`;
  document.getElementById("sh-body").innerHTML=
    sec("State",d.insp.state().map(s=>`<div class="row"><span>•</span><span>${s}</span></div>`).join(""))+
    sec("Triggers",d.insp.triggers.map(t=>kv("When "+t[0].replace(/^When /i,""),t[1])).join(""))+
    sec("Sequences",d.insp.seqs.map((s,i)=>kv((i+1)+".",`<b>${s[0]}</b> — then ${s[1].replace(/^then /i,"")}`)).join(""))+
    sec("Connections",`<div class="chips">${d.insp.conns.map(c=>`<span class="chip">${c}</span>`).join("")}</div>`);
  const shA=document.getElementById("sh-actions");shA.innerHTML="";
  d.actions.forEach(a=>{const b=document.createElement("button");b.className="abtn "+(a[2]||"");b.textContent=a[0];
    b.onclick=()=>doAction(id,a[1],b);shA.appendChild(b)});
  sheet.classList.add("open");scrim.classList.add("on");sheetOpenedAt=Date.now();
}
function closeInspector(silent){sheet.classList.remove("open");scrim.classList.remove("on");if(!silent)focusedId=null}
document.getElementById("sh-x").onclick=()=>closeInspector();
scrim.onclick=()=>{if(Date.now()-sheetOpenedAt<600)return;closeInspector()};
/* ================= actions ================= */
function doAction(id,act,btn){
  markInteracted();
  if(act==="feed"){S.world.fed=true;toast("Your creatures are eating");refreshStates();if(focusedId)openInspector(id)}
  else if(act==="timer"){
    if(S.focus.timer){clearInterval(S.focus.timer);S.focus.timer=null;S.focus.left=0;btn.textContent="Start";toast("Timer stopped")}
    else{S.focus.left=25*60;btn.textContent="Pause";toast("Focusing for 25 minutes");
      S.focus.timer=setInterval(()=>{S.focus.left--;refreshStates();if(S.focus.left<=0){clearInterval(S.focus.timer);S.focus.timer=null;btn.textContent="Start";toast("Time — take a breath");refreshStates()}},1000)}
    refreshStates();
  }
  else if(act==="addnote"){S.notes.count++;toast("Idea added to the stack");refreshStates();if(focusedId)openInspector(id)}
  else if(act==="assign"){openInspector(id);toast("Tell them what to do")}
  else if(act==="autorun"){S.auto.on=!S.auto.on;btn.textContent=S.auto.on?"Pause":"Resume";toast(S.auto.on?"Routines running":"Routines resting");refreshStates();if(focusedId)openInspector(id)}
  else if(act==="open"){openInspector(id)}
}
let toastT=null;
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("on");
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),2200)}

  const h=new Date().getHours(),g=h<12?"Good morning":h<18?"Good afternoon":"Good evening";
  document.getElementById("hello").textContent=g+", Sabastian";

    dust.appendChild(m)}
})();
build();tick();
