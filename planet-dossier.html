<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Planet Dossier — moorworld explorer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:#070a10;color:#e8eef4;font-family:-apple-system,system-ui,sans-serif;}
#stars{position:fixed;inset:0;display:block;}
#card{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:calc(14px + env(safe-area-inset-top)) 18px calc(110px + env(safe-area-inset-bottom));overflow-y:auto;z-index:5;}
#planetCv{width:170px;height:170px;margin:6px 0 2px;filter:drop-shadow(0 0 26px rgba(120,160,255,.25));}
#pname{font-size:27px;font-weight:800;letter-spacing:.5px;text-align:center;}
#ptype{display:inline-block;margin:8px 0 2px;padding:5px 14px;border-radius:999px;font-size:12px;font-weight:700;
  letter-spacing:1.5px;background:rgba(120,170,255,.14);border:1px solid rgba(120,170,255,.4);color:#bcd4ff;}
#addr{font-size:10.5px;color:#5f7186;margin:6px 0 12px;word-break:break-all;text-align:center;max-width:340px;}
.sec{width:100%;max-width:380px;background:rgba(14,20,30,.72);border:1px solid rgba(255,255,255,.09);
  border-radius:14px;padding:12px 14px;margin-bottom:10px;backdrop-filter:blur(8px);}
.sec h3{font-size:11px;letter-spacing:2px;color:#7d93ad;margin-bottom:8px;}
.swatches{display:flex;gap:10px;}
.sw{flex:1;text-align:center;}
.sw i{display:block;width:100%;height:38px;border-radius:10px;border:1px solid rgba(255,255,255,.15);}
.sw span{font-size:10px;color:#9fb2c8;display:block;margin-top:4px;}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;color:#c9d6e4;}
.kv b{color:#eef4fa;font-weight:600;}
#wx{font-size:13px;color:#c9d6e4;font-style:italic;}
#prose{font-size:14px;line-height:1.55;color:#d7e1ec;}
.spchip{display:inline-block;margin:0 6px 8px 0;padding:7px 12px;border-radius:999px;font-size:12px;
  background:rgba(159,232,112,.1);border:1px solid rgba(159,232,112,.3);color:#d9f5c4;}
.spchip small{color:#8fa87e;display:block;font-size:10px;}
.matrow{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;color:#c9d6e4;border-bottom:1px solid rgba(255,255,255,.05);}
.matrow:last-child{border-bottom:none;}
.tier{font-size:10px;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.08);color:#ffd98a;}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:10px 14px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(transparent,rgba(5,8,12,.92) 30%);}
#navrow{display:flex;gap:10px;align-items:center;justify-content:center;}
.nbtn{width:56px;height:56px;border-radius:50%;font-size:22px;border:1px solid rgba(255,255,255,.2);
  background:rgba(24,34,48,.9);color:#e8eef4;touch-action:none;}
#rand{height:56px;padding:0 22px;border-radius:28px;font-size:15px;font-weight:700;border:none;
  background:linear-gradient(135deg,#7db4ff,#b48aff);color:#0b0e12;touch-action:none;}
.nbtn:active,#rand:active{transform:scale(.94);}
#addrbar{display:flex;gap:8px;margin-top:10px;max-width:420px;margin-left:auto;margin-right:auto;}
#addrin{flex:1;min-width:0;height:46px;border-radius:12px;border:1px solid rgba(255,255,255,.16);
  background:rgba(10,15,22,.9);color:#e8eef4;padding:0 12px;font-size:12px;}
#addrgo{height:46px;padding:0 18px;border-radius:12px;font-size:14px;font-weight:700;border:none;
  background:#9fe870;color:#0b0e12;}
#addrmsg{font-size:11px;color:#ff9d9d;text-align:center;margin-top:6px;min-height:15px;}
#count{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:6;font-size:11px;color:#5f7186;}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div id="count"></div>
<div id="card">
  <canvas id="planetCv" width="340" height="340"></canvas>
  <div id="pname">—</div>
  <div id="ptype">—</div>
  <div id="addr">—</div>
  <div class="sec"><h3>PALETTE</h3><div class="swatches" id="swatches"></div></div>
  <div class="sec"><h3>CLIMATE</h3>
    <div class="kv"><span>Temperature</span><b id="ctemp">—</b></div>
    <div class="kv"><span>Air</span><b id="cair">—</b></div>
    <div id="wx">—</div>
  </div>
  <div class="sec"><h3>SPECIES</h3><div id="species"></div></div>
  <div class="sec"><h3>MATERIALS</h3><div id="mats"></div></div>
  <div class="sec"><h3>DOSSIER</h3><div id="prose">—</div></div>
</div>
<div id="nav">
  <div id="navrow">
    <button class="nbtn" id="prev" aria-label="previous planet">◀</button>
    <button id="rand">🎲 RANDOM</button>
    <button class="nbtn" id="next" aria-label="next planet">▶</button>
  </div>
  <div id="addrbar">
    <input id="addrin" placeholder="paste planet address…" autocomplete="off" spellcheck="false">
    <button id="addrgo">GO</button>
  </div>
  <div id="addrmsg"></div>
</div>

<script type="module">
// =====================================================================
// PROVENANCE: the universe generator below is copied VERBATIM from
// ~/workspace/moor-recovery/components/moorworld/moorworld.js
// (seeded universe: 8 sectors, 57 systems, 254 planets; materials,
// climate, species, summary/prose, findByAddress). Not reimplemented.
// The dossier UI harness around it is new.
// =====================================================================

/* moorworld — deterministic universe: 57 systems, 254 planets, 745 zones.
 * Extracted verbatim from universe-atlas.html:295-592. One change only:
 * the window.MoorWorld dev-inspection line became a UMD footer (see bottom).
 */
const MoorWorld = (() => {
  const UNIVERSE_SEED = 1337;
  const GENERATOR_VERSION = 2; // v2: unique procedural planet names (positions/orbits identical to v1)
  const ROOT_ADDRESS = 'universe:prime';

  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  const R = mulberry32(UNIVERSE_SEED);
  const rr=(a,b)=>a+R()*(b-a);
  const pick=a=>a[Math.floor(R()*a.length)];

  const SECTOR_NAMES=['Aurora Reach','Velmora Drift','Kaelen Expanse','Duskwither','Ostrellia','Nyx Hollow','Solenne Verge','Tarnished Crown'];
  const STAR_NAMES=['Helion','Vesper','Calyx','Dorne','Ilyra','Sarn','Ophir','Mirell','Tavros','Keth','Ulmar','Zev','Prysm','Halcyon','Vire','Nox'];
  const PLANET_NAMES=['Terranova','Cinder','Pelagia','Zephyria','Ferrum','Verdant','Kryos','Emberfall','Lumen','Dross','Halcyon Prime','Virelia','Ossia','Tarn',' Mire'];
  const ZONE_KINDS=['city','landmark','port','ruin','garden','spire'];

  const PTYPES=[
   {name:'TERRAN WORLD', c1:'#4a7a5a', c2:'#2a4a3a', atm:0x88bbff},
   {name:'OCEAN WORLD',  c1:'#2a6a9a', c2:'#0a2a5a', atm:0x66aaff},
   {name:'DESERT WORLD', c1:'#c8a06a', c2:'#8a6842', atm:0xffd9a0},
   {name:'ICE WORLD',    c1:'#d0e4f4', c2:'#8ab0d0', atm:0xaaddff},
   {name:'LAVA WORLD',   c1:'#4a1f0c', c2:'#180a05', atm:0xff7a4a},
   {name:'JUNGLE WORLD', c1:'#1f6a30', c2:'#0c3a1a', atm:0x88ffaa},
   {name:'BARREN ROCK',  c1:'#8a8a8a', c2:'#4a4a4a', atm:0x999999},
   {name:'GAS GIANT',    c1:'#d8b08a', c2:'#96704e', atm:0xffd9b0},
   {name:'CRYSTAL WORLD',c1:'#9a7ae8', c2:'#4a2e98', atm:0xbb99ff},
   {name:'TOXIC WORLD',  c1:'#9ab83e', c2:'#4e6a14', atm:0xaaff66},
  ];
  function hashStr(x){let h=0;for(let i=0;i<x.length;i++)h=(h*31+x.charCodeAt(i))|0;return Math.abs(h);}
  function ptypeOf(p){return PTYPES[hashStr(p.id)%PTYPES.length];}

  /* ---- unique planet names: syllable pools on a per-planet stream.
        The legacy PLANET_NAMES draw is burned in the loop below to preserve
        the main stream, so positions/orbits stay byte-identical to v1. ---- */
  const NAME_A=['Ke','Ve','Ze','Mo','Ta','Ry','Xe','No','Sa','Ae','Io','Ka','Lu','Mi','Os','Pe','Ra','Th','Vu','Da','Ny','Ol','Sha','Bel'];
  const NAME_B=['ra','thos','lia','dune','mia','ros','ven','kar','sil','dor','nai','phor','gath','bel','cor','thia','wen','dral','mor','sei','vax','lon','ria','tus'];
  const NAME_C=[' Prime',' Minor',' Major',' II',' III'];
  const _usedNames=new Set(),_ROMAN=['II','III','IV','V','VI','VII','VIII','IX','X'];
  function uniquePlanetName(pid){
    const rng=mulberry32(hashStr(pid));
    let nm=NAME_A[Math.floor(rng()*NAME_A.length)]+NAME_B[Math.floor(rng()*NAME_B.length)];
    if(rng()<0.3)nm+=NAME_C[Math.floor(rng()*NAME_C.length)];
    const base=nm;let k=0;
    while(_usedNames.has(nm)){nm=base+' '+(_ROMAN[k]||String(k+2));k++;}
    _usedNames.add(nm);
    return nm;
  }

  /* ---- dossier data: materials, species, climate, summary.
        Deterministic from the planet id — same planet, same sheet, every time.
        Materials ported from the planet-materials prototype (this is now its
        one canonical home; the prototype file is retired). ---- */
  const MAT_CATS=['wood','stone','metal','glass','fiber','clay'];
  const MAT_TIERS=['trace','scarce','common','rich'];
  const MAT_SIG={TERRAN:'amber',OCEAN:'pearl',DESERT:'spice',ICE:'frost crystal',
    LAVA:'obsidian',JUNGLE:'vine silk',BARREN:'titanium',GAS:'aether',
    CRYSTAL:'prism shard',TOXIC:'venom'};
  const MAT_VARIANTS={
    wood:{ICE:['frostwood','icepine','snowbark'],LAVA:['charwood','emberoak','cinderpine'],
      JUNGLE:['vinewood','canopy oak','jungleheart'],OCEAN:['driftwood','saltcedar','tidewood'],
      DESERT:['ironwood','sunbark','dune acacia'],TERRAN:['oak','pine','birch'],
      X:['scrubwood','petrified wood','thornwood']},
    stone:{ICE:['glacier granite','blueslate','permafrost stone'],LAVA:['basalt','cinderstone','magma rock'],
      JUNGLE:['mossstone','laterite','jungle marble'],OCEAN:['coralstone','abyssal rock','shell limestone'],
      DESERT:['sandstone','sunbaked rock','dune slate'],TERRAN:['granite','limestone','fieldstone'],
      X:['regolith','scree','dullrock']},
    glass:{ICE:['frostglass','snowglass','ice-glass'],LAVA:['volcanic glass','ashglass','emberglass'],
      JUNGLE:['canopy glass','vineglass','dewglass'],OCEAN:['seaglass','abyssal glass','foamglass'],
      DESERT:['sunglass','duneglass','heatglass'],TERRAN:['clear glass','river glass','bottle glass'],
      X:['crude glass','smoky glass','ash glass']},
    fiber:{ICE:['mossfiber','tundra grass','iceflax'],LAVA:['ashfiber','ember reed','cinderflax'],
      JUNGLE:['vine fiber','canopy floss','jungle hemp'],OCEAN:['kelp fiber','reed','tideflax'],
      DESERT:['dune grass','sunhemp','cactus fiber'],TERRAN:['hemp','flax','cotton'],
      X:['scrub fiber','wiremoss','dryflax']},
    clay:{ICE:['grey clay','permafrost clay','blue clay'],LAVA:['red clay','volcanic clay','ash clay'],
      JUNGLE:['red clay','river clay','jungle porcelain'],OCEAN:['sea clay','abyssal clay','shell clay'],
      DESERT:['red clay','dune clay','sun clay'],TERRAN:['red clay','grey clay','porcelain'],
      X:['dust clay','grey clay','regolith clay']}
  };
  const MAT_EXOTICS=['void essence','starfall','emberheart','tideglass'];
  const TKEYS=['TERRAN','OCEAN','DESERT','ICE','LAVA','JUNGLE','BARREN','GAS','CRYSTAL','TOXIC'];
  function tkeyOf(pid){return TKEYS[hashStr(pid)%PTYPES.length];}
  function _matAb(rng){const r=rng();return r<0.15?3:r<0.70?2:r<0.95?1:0;}
  function materials(pid){
    const type=tkeyOf(pid);
    const rng=mulberry32(hashStr(pid));
    const gas=type==='GAS',rows=[];
    for(const c of MAT_CATS){
      if(c==='metal'){
        const metals=[{v:'iron',t:_matAb(rng)}];
        for(const [nm,pr] of [['copper',.45],['tin',.30],['silver',.15],['gold',.08]]){
          if(rng()<pr&&metals.length<3)metals.push({v:nm,t:_matAb(rng)});}
        if(gas)metals.forEach(m=>{m.t=Math.max(0,m.t-1);});
        rows.push({c,metals});
      }else{
        const pool=MAT_VARIANTS[c][type]||MAT_VARIANTS[c].X;
        let t=_matAb(rng);
        if(gas&&(c==='wood'||c==='stone'||c==='clay'))t=Math.max(0,t-1);
        rows.push({c,v:pool[Math.floor(rng()*pool.length)],t});
      }
    }
    const sig={v:MAT_SIG[type],t:_matAb(rng)};
    let exo=null;
    if(rng()<0.08)exo={v:MAT_EXOTICS[Math.floor(rng()*MAT_EXOTICS.length)],t:0};
    return {type,sig,rows,exo,tiers:MAT_TIERS};
  }
  const CLIMATE={
    TERRAN:{temp:'mild',air:'breathable and crisp',wx:['clear skies and long calm stretches','scattered storms rolling through','long gentle rains']},
    OCEAN:{temp:'warm',air:'salty and heavy',wx:['sea squalls that come out of nowhere','glass-calm mornings and rough afternoons','endless drizzle over the water']},
    DESERT:{temp:'scorching days, freezing nights',air:'thin and dry',wx:['dust storms that blot out the sun','weeks of heat shimmer','rare, violent flash rains']},
    ICE:{temp:'deep freeze',air:'thin and sharp',wx:['whiteouts that last for days','diamond-dust skies and deadly calm','howling katabatic winds']},
    LAVA:{temp:'searing',air:'sulfur — do not breathe',wx:['ashfall that buries footprints','rivers of fire shifting course','heat lightning every night']},
    JUNGLE:{temp:'hot and wet',air:'thick enough to chew',wx:['daily downpours at dusk','steaming mornings and drumming rain by noon','weeks of unbroken monsoon']},
    BARREN:{temp:'cold to the bone',air:'barely there',wx:['micrometeorite patter','dust devils in the flats','a sky that never changes']},
    GAS:{temp:'storm-wracked',air:'unbreathable soup',wx:['supercell storms wider than continents','updrafts that could swallow a ship','bands of rain that never end']},
    CRYSTAL:{temp:'cool',air:'still, with a mineral tang',wx:['shardfall in the deep fields','singing winds through the spires','light storms at the terminator']},
    TOXIC:{temp:'hot',air:'a lung-burning haze',wx:['acid rain most afternoons','a haze that never fully lifts','caustic fog banks rolling in low']}
  };
  function climate(pid){
    const type=tkeyOf(pid),base=CLIMATE[type];
    const rng=mulberry32(hashStr(pid+'climate'));
    return {type,temp:base.temp,air:base.air,
      weather:base.wx[Math.floor(rng()*base.wx.length)]};
  }
  const SPEC_A=['Mire','Haze','Thorn','Gloom','Pale','Dusk','Ash','Bog','Crag','Vex',
    'Murk','Silt','Frost','Ember','Kelp','Dune','Moss','Shriek','Gravel','Wisp'];
  const SPEC_B=['crawler','wing','skitter','maw','grazer','stalker','bloom','howler',
    'mite','mother','dart','lurker','sifter','piper'];
  const SPEC_TEMP=['docile','skittish','territorial','curious','dangerous','elusive','placid','aggressive'];
  const SPEC_HAB={
    TERRAN:['in the meadows','near fresh water','at the treeline'],
    OCEAN:['in the shallows','around the reefs','in open water'],
    DESERT:['in the dune seas','near the rare oases','in the rocky badlands'],
    ICE:['on the ice sheets','near the pressure cracks','in the snowfields'],
    LAVA:['near the cooling flows','in the ash wastes','around the fire founts'],
    JUNGLE:['in the canopy','on the forest floor','near the rivers'],
    BARREN:['in the dust flats','among the rocks','in the crater shadows'],
    GAS:['in the upper bands','riding the storm edges','in the calm belts'],
    CRYSTAL:['among the shards','in the resonance fields','near the spires'],
    TOXIC:['near the pools','in the haze flats','at the sludge marshes']
  };
  function species(pid){
    const type=tkeyOf(pid);
    const rng=mulberry32(hashStr(pid+'species'));
    const habs=SPEC_HAB[type],n=2+Math.floor(rng()*4),out=[],used=new Set();
    for(let i=0;i<n;i++){
      const nm=(SPEC_A[Math.floor(rng()*SPEC_A.length)]+' '+
        SPEC_B[Math.floor(rng()*SPEC_B.length)]).toLowerCase();
      if(used.has(nm)){i--;continue;}
      used.add(nm);
      out.push({name:nm,temp:SPEC_TEMP[Math.floor(rng()*SPEC_TEMP.length)],
        habitat:habs[Math.floor(rng()*habs.length)]});
    }
    return out;
  }
  const SUM_S1={
    TERRAN:n=>`${n} is a living world — blue water, green land, air you can breathe. The kind of place people want to stay.`,
    OCEAN:n=>`${n} is almost entirely ocean, broken only by scattered islands. Everything here happens on or under the water.`,
    DESERT:n=>`${n} is a desert world — dune seas, sun-baked rock, and water worth fighting over.`,
    ICE:n=>`${n} is locked in ice. What little moves here moves carefully, and the cold does not forgive.`,
    LAVA:n=>`${n} is a furnace — cooling crust over liquid fire, ash in the air, ground that can kill you standing still.`,
    JUNGLE:n=>`${n} is a jungle world, green stacked on green, loud with life and heavy with rain.`,
    BARREN:n=>`${n} is a barren rock — airless, silent, and honest about it. Nothing grows here; everything is brought.`,
    GAS:n=>`${n} is a gas giant — no ground to stand on, only storms the size of continents and skies that never end.`,
    CRYSTAL:n=>`${n} is a crystal world, where the ground itself is grown, not made. It hums if you listen.`,
    TOXIC:n=>`${n} is a toxic world wrapped in yellow-green haze. The air burns and the pools poison — but what it sweats is prized off-world.`
  };
  function summary(pid){
    const p=byId.get(pid);
    if(!p||p.kind!=='planet')return '';
    const type=tkeyOf(pid),M=materials(pid),C=climate(pid),S=species(pid);
    const s1=SUM_S1[type](p.name);
    const s2=`The air is ${C.air}. Expect ${C.weather}.`;
    const s3=`Its signature resource is ${M.sig.v} — ${MAT_TIERS[M.sig.t]} here`+
      (M.sig.t>=2?', and prized off-world.':'.')+
      ` ${S.length} known species, including the ${S[0].temp} ${S[0].name}.`;
    const zs=p.zones;
    const s4=zs.length
      ?`${zs.length} ${zs.length===1?'zone breaks':'zones break'} up the wilds: `+
       zs.map(z=>z.name).join(', ')+'.'
      :'No settled zones — pure wilderness.';
    return s1+' '+s2+' '+s3+' '+s4;
  }

  /* ---- generation: identical draw order to Atlas v1, do not reorder ---- */
  const sectors=[];
  for(let i=0;i<8;i++){
    // spiral arm: r grows with angle
    const th=i*(Math.PI*2/8)+0.4, rad=26+i*9+rr(-3,3);
    const sx=Math.cos(th)*rad, sz=Math.sin(th)*rad, sy=rr(-8,8);
    const sid='S0'+(i+1);
    const sec={kind:'sector',id:sid,addr:ROOT_ADDRESS+'/sector:'+sid,name:SECTOR_NAMES[i],
      u:[+sx.toFixed(1),+sy.toFixed(1),+sz.toFixed(1)],systems:[]};
    const nSys=5+Math.floor(R()*4);
    for(let j=0;j<nSys;j++){
      const a=rr(0,Math.PI*2), d=rr(6,22);
      const sysid=sid+'-SYS0'+(j+1);
      const sys={kind:'system',id:sysid,addr:sec.addr+'/system:'+sysid,
        name:pick(STAR_NAMES)+' '+String.fromCharCode(65+j),
        s:[+(Math.cos(a)*d).toFixed(1),+rr(-4,4).toFixed(1),+(Math.sin(a)*d).toFixed(1)],
        starClass:pick(['G','K','M','F']),planets:[]};
      const nP=3+Math.floor(R()*4);
      for(let k=0;k<nP;k++){
        const orbit=8+k*7+rr(-1,1);
        const pid=sysid+'-P0'+(k+1);
        pick(PLANET_NAMES); // burned draw: preserves the v1 stream; name is now unique
        // hue/sat/lit draws are the old planet color draws: same stream,
        // stored as data — the renderer turns them into a color.
        const pl={kind:'planet',id:pid,addr:sys.addr+'/planet:'+pid,name:uniquePlanetName(pid),
          orbit:+orbit.toFixed(1),angle:rr(0,Math.PI*2),
          size:rr(0.7,1.6),hue:rr(0,1),sat:rr(0.25,0.55),lit:rr(0.3,0.5),
          zones:[]};
        const nZ=2+Math.floor(R()*3);
        for(let z=0;z<nZ;z++){
          const zid=pid+'-Z'+(z+1);
          pl.zones.push({kind:'zone',id:zid,addr:pl.addr+'/zone:'+zid,name:pick(ZONE_KINDS)+' '+(z+1),
            lat:+rr(-60,60).toFixed(1),lon:+rr(-180,180).toFixed(1),alt:+rr(0,2).toFixed(1),
            kind:pick(ZONE_KINDS)});
        }
        sys.planets.push(pl);
      }
      sec.systems.push(sys);
    }
    sectors.push(sec);
  }
  // personal spaces (pocket dimensions)
  const personalSpaces=[
    {kind:'personal',id:'PS-SEABASS',addr:ROOT_ADDRESS+'/personal:PS-SEABASS',owner:'seabass',name:"Seabass's Space Room",coord:'PX(0,0,0)',size:'standard'},
    {kind:'personal',id:'PS-GUEST1',addr:ROOT_ADDRESS+'/personal:PS-GUEST1',owner:'guest-1',name:"Guest Space",coord:'PX(12,0,4)',size:'standard'},
  ];

  /* ---- indexes: the lookup contract ---- */
  const byId=new Map(), byAddr=new Map();
  byAddr.set(ROOT_ADDRESS,{kind:'universe',id:'prime',addr:ROOT_ADDRESS,name:'Prime Universe'});
  for(const sec of sectors){
    byId.set(sec.id,sec);byAddr.set(sec.addr,sec);
    for(const sys of sec.systems){
      byId.set(sys.id,sys);byAddr.set(sys.addr,sys);
      for(const p of sys.planets){
        byId.set(p.id,p);byAddr.set(p.addr,p);
        for(const z of p.zones){byId.set(z.id,z);byAddr.set(z.addr,z);}
      }
    }
  }
  for(const ps of personalSpaces){byId.set(ps.id,ps);byAddr.set(ps.addr,ps);}

  function addressOf(kind,id){
    const n=byId.get(id);
    if(n&&n.kind===kind)return n.addr;
    return null;
  }

  /* ---- event log: every mutation appends here. No event, no mutation.
        Campfire S.log pattern: append-only, cap 5000, localStorage. ---- */
  const EVENTS_KEY='moorworld.events.v1';
  let _events=[];
  try{_events=JSON.parse(localStorage.getItem(EVENTS_KEY))||[];}catch(e){_events=[];}
  function logEvent(by,type,target,payload){
    const ev={t:Date.now(),by:by,type:type,target:target,payload:payload||{}};
    _events.push(ev);
    if(_events.length>5000)_events=_events.slice(-5000);
    try{localStorage.setItem(EVENTS_KEY,JSON.stringify(_events));}catch(e){}
    return ev;
  }

  /* ---- query API: the ONLY way the renderer touches world data ---- */
  let nSys=0,nPl=0,nZ=0;
  for(const sec of sectors){nSys+=sec.systems.length;
    for(const sys of sec.systems){nPl+=sys.planets.length;
      for(const p of sys.planets)nZ+=p.zones.length;}}
  return {
    UNIVERSE_SEED, GENERATOR_VERSION, ROOT_ADDRESS, PTYPES,
    mulberry32, hashStr,
    sectors:()=>sectors,
    counts:()=>({sectors:sectors.length,systems:nSys,planets:nPl,zones:nZ}),
    getSector:id=>byId.get(id)||null,
    getSystem:id=>byId.get(id)||null,
    getPlanet:id=>byId.get(id)||null,
    getZone:id=>byId.get(id)||null,
    getZones:planetId=>{const p=byId.get(planetId);return p&&p.zones?p.zones:[];},
    personalSpaces:()=>personalSpaces,
    getPersonalSpace:id=>byId.get(id)||null,
    findById:id=>byId.get(id)||null,
    findByAddress:addr=>byAddr.get(addr)||null,
    addressOf,
    planetType:p=>ptypeOf(p),
    planetTypeIndex:p=>PTYPES.indexOf(ptypeOf(p)),
    materials,species,climate,summary,
    logEvent,
    events:()=>_events.slice(),
  };
})();

/* UMD footer (replaces window.MoorWorld dev line): */
if (typeof window !== 'undefined') window.MoorWorld = MoorWorld;
if (typeof module !== 'undefined' && module.exports) module.exports = MoorWorld;


// ================= demo harness =================
const MW=window.MoorWorld;
const planets=[];
for(const sec of MW.sectors())for(const sys of sec.systems)for(const p of sys.planets)planets.push(p);
document.getElementById('count').textContent=planets.length+' planets · '+MW.counts().systems+' systems';

const rng=MW.mulberry32(20261004);
let idx=Math.floor(rng()*planets.length);

const pcv=document.getElementById('planetCv'),pctx=pcv.getContext('2d');
function cssHex(n){return '#'+n.toString(16).padStart(6,'0');}
function drawPlanet(type){
  const S=340;pctx.clearRect(0,0,S,S);
  const g=pctx.createRadialGradient(S*0.38,S*0.34,S*0.1,S/2,S/2,S*0.46);
  g.addColorStop(0,type.c1);g.addColorStop(1,type.c2);
  pctx.save();
  pctx.beginPath();pctx.arc(S/2,S/2,S*0.44,0,Math.PI*2);pctx.clip();
  pctx.fillStyle=g;pctx.fillRect(0,0,S,S);
  // terminator shadow
  const sh=pctx.createLinearGradient(S*0.2,0,S*0.95,S*0.6);
  sh.addColorStop(0,'rgba(0,0,0,0)');sh.addColorStop(1,'rgba(0,0,10,.55)');
  pctx.fillStyle=sh;pctx.fillRect(0,0,S,S);
  // band noise from planet-seeded rng
  const r2=MW.mulberry32(MW.hashStr(type.name));
  pctx.globalAlpha=.08;
  for(let i=0;i<7;i++){pctx.fillStyle=r2()>.5?'#ffffff':'#000000';
    const y=r2()*S;pctx.fillRect(0,y,S,2+r2()*8);}
  pctx.globalAlpha=1;pctx.restore();
  // atmosphere ring
  pctx.strokeStyle=cssHex(type.atm);pctx.lineWidth=7;pctx.globalAlpha=.75;
  pctx.beginPath();pctx.arc(S/2,S/2,S*0.455,0,Math.PI*2);pctx.stroke();pctx.globalAlpha=1;
}

function render(p){
  const mats=MW.materials(p.id),clim=MW.climate(p.id),spec=MW.species(p.id),
        type=MW.planetType(p),prose=MW.summary(p.id);
  drawPlanet(type);
  document.getElementById('pname').textContent=p.name;
  document.getElementById('ptype').textContent=mats.type+' · '+type.name;
  document.getElementById('addr').textContent=p.addr;
  document.getElementById('swatches').innerHTML=
    [['LAND',type.c1],['SEA',type.c2],['ATMO',cssHex(type.atm)]].map(([k,v])=>
      `<div class="sw"><i style="background:${v}"></i><span>${k}<br>${v}</span></div>`).join('');
  document.getElementById('ctemp').textContent=clim.temp;
  document.getElementById('cair').textContent=clim.air;
  document.getElementById('wx').textContent='“'+clim.weather+'”';
  document.getElementById('species').innerHTML=spec.map(s=>
    `<span class="spchip">${s.name}<small>${s.temp} · ${s.habitat}</small></span>`).join('');
  const tier=t=>mats.tiers[t];
  let mh=`<div class="matrow"><span>signature: <b style="color:#ffd98a">${mats.sig.v}</b></span><span class="tier">${tier(mats.sig.t)}</span></div>`;
  for(const r of mats.rows){
    if(r.metals){mh+=`<div class="matrow"><span>metal: ${r.metals.map(m=>m.v).join(', ')}</span><span class="tier">${tier(r.metals[0].t)}</span></div>`;}
    else{mh+=`<div class="matrow"><span>${r.c}: ${r.v}</span><span class="tier">${tier(r.t)}</span></div>`;}
  }
  if(mats.exo)mh+=`<div class="matrow"><span>exotic: <b style="color:#c4a0ff">${mats.exo.v}</b></span><span class="tier">exotic</span></div>`;
  document.getElementById('mats').innerHTML=mh;
  document.getElementById('prose').textContent=prose;
  document.getElementById('card').scrollTop=0;
  document.getElementById('addrmsg').textContent='';
}
function show(i){idx=(i+planets.length)%planets.length;render(planets[idx]);}
show(idx);

document.getElementById('prev').addEventListener('click',()=>show(idx-1));
document.getElementById('next').addEventListener('click',()=>show(idx+1));
document.getElementById('rand').addEventListener('click',()=>show(Math.floor(rng()*planets.length)));
function goAddr(){
  const v=document.getElementById('addrin').value.trim();
  const node=MW.findByAddress(v);
  const msg=document.getElementById('addrmsg');
  if(node&&node.kind==='planet'){const i=planets.findIndex(p=>p.id===node.id);show(i);msg.textContent='';}
  else msg.textContent=node?('address is a '+node.kind+', not a planet'):('no planet at that address');
}
document.getElementById('addrgo').addEventListener('click',goAddr);
document.getElementById('addrin').addEventListener('keydown',e=>{if(e.key==='Enter')goAddr();});

// swipe
let tx0=null;
const card=document.getElementById('card');
card.addEventListener('touchstart',e=>{tx0=e.touches[0].clientX;},{passive:true});
card.addEventListener('touchend',e=>{
  if(tx0===null)return;const dx=e.changedTouches[0].clientX-tx0;tx0=null;
  if(Math.abs(dx)>48)show(idx+(dx<0?1:-1));
},{passive:true});

// starfield backdrop
const sc=document.getElementById('stars'),sx=sc.getContext('2d');
function stars(){
  sc.width=innerWidth;sc.height=innerHeight;
  const r=MW.mulberry32(77);
  for(let i=0;i<140;i++){sx.fillStyle=`rgba(255,255,255,${0.15+r()*0.5})`;
    sx.fillRect(r()*sc.width,r()*sc.height,r()<0.9?1:2,r()<0.9?1:2);}
}
stars();window.addEventListener('resize',stars);

window.__dossier={MW,planets,show,idx:()=>idx};
</script>
