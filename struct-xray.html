/* mesh-builder — immediate-mode procedural 3D mesh builder.
 * CityMesh class extracted verbatim from canal-metropolis.html:648-661.
 * Helpers extracted verbatim: TAU (:41), mix (:43), color (:319),

 * NOTE: upload()/dispose() need a WebGL context as global 'gl',
 * exactly as in the original page. Everything else is pure JS.

 face(a,b,c,d,color,normal,uvScale=1,uvOrigin=[0,0]){const ab=b.map((v,i)=>v-a[i]),ac=c.map((v,i)=>v-a[i]),ad=d.map((v,i)=>v-a[i]),geometric=cross3(ab,ac),fallback=cross3(ac,ad),raw=norm3(Math.hypot(...geometric)>1e-9?geometric:fallback),n=normal&&dot3(raw,normal)<0?raw.map(v=>-v):raw,w=Math.hypot(...ab)*uvScale,h=Math.hypot(...ad)*uvScale,base=this.data.length/23;this.vertex(a,n,color,uvOrigin);this.vertex(b,n,color,[uvOrigin[0]+w,uvOrigin[1]]);this.vertex(c,n,color,[uvOrigin[0]+w,uvOrigin[1]+h]);this.vertex(d,n,color,[uvOrigin[0],uvOrigin[1]+h]);const reverse=dot3(cross3(ab,ac),n)<0;if(Math.hypot(...ab)>1e-8&&Math.hypot(...ac)>1e-8)this.indices.push(base,base+(reverse?2:1),base+(reverse?1:2));if(Math.hypot(...ad)>1e-8)this.indices.push(base,base+(reverse?3:2),base+(reverse?2:3));}

 box(x,y,z,w,h,d,c,mat=this.material){if(w<=0||h<=0||d<=0)return;if(this.solids&&this.kind<1.5){this.solids.push({lo:[x,y,z],hi:[x+w,y+h,z+d],c,mat,kind:this.kind,anchor:this.anchor});return;}const old=this.material;this.material=mat;const a=[x,y,z],b=[x+w,y,z],e=[x,y+h,z],f=[x+w,y+h,z],j=[x,y,z+d],k=[x+w,y,z+d],l=[x,y+h,z+d],q=[x+w,y+h,z+d];this.face(a,b,f,e,c,[0,0,-1]);this.face(k,j,l,q,c,[0,0,1]);this.face(j,a,e,l,c,[-1,0,0]);this.face(b,k,q,f,c,[1,0,0]);this.face(e,f,q,l,c,[0,1,0]);this.material=old;}
 bevelBox(x,y,z,w,h,d,c,mat=2){if(w<.3||h<.3||d<.3){this.box(x,y,z,w,h,d,c,mat);return;}const old=this.material;this.material=mat;const b=Math.min(w,d,h)*.045,top=y+h,ring=[[x+b,z],[x+w-b,z],[x+w,z+b],[x+w,z+d-b],[x+w-b,z+d],[x+b,z+d],[x,z+d-b],[x,z+b]];for(let k=0;k<8;k++){const a=ring[k],q=ring[(k+1)%8],dx=q[0]-a[0],dz=q[1]-a[1],n=norm3([dz,0,-dx]);this.face([a[0],y,a[1]],[q[0],y,q[1]],[q[0],top-b,q[1]],[a[0],top-b,a[1]],c,n);const aa=[mix(a[0],x+w/2,b/Math.max(w,d)),mix(a[1],z+d/2,b/Math.max(w,d))],qq=[mix(q[0],x+w/2,b/Math.max(w,d)),mix(q[1],z+d/2,b/Math.max(w,d))];this.material=0;this.face([a[0],top-b,a[1]],[q[0],top-b,q[1]],[qq[0],top,qq[1]],[aa[0],top,aa[1]],color(c,1.13),norm3([n[0],1,n[2]]));this.face([x+w/2,top,z+d/2],[aa[0],top,aa[1]],[qq[0],top,qq[1]],[x+w/2,top,z+d/2],color(c,.92),[0,1,0]);this.material=mat;}this.material=old;}
 dome(x,y,z,rx,ry,rz,c,segments=16,rings=4){const saved=this.kind;for(let j=0;j<rings;j++)for(let i=0;i<segments;i++){const point=(a,b)=>[x+Math.cos(a)*Math.sin(b)*rx,y+Math.cos(b)*ry,z+Math.sin(a)*Math.sin(b)*rz],a=i/segments*TAU,b=(i+1)/segments*TAU,c0=j/rings*Math.PI*.5,d=(j+1)/rings*Math.PI*.5,n=norm3([Math.cos((a+b)/2)*Math.sin((c0+d)/2),Math.cos((c0+d)/2),Math.sin((a+b)/2)*Math.sin((c0+d)/2)]);this.face(point(a,c0),point(b,c0),point(b,d),point(a,d),c,n);}const start=this.data.length;this.roundCap(x,y-ry,z,rx,rz,ry*2,0,segments,rings*2);for(let k=start;k<this.data.length;k+=23)this.data[k+18]=y;this.kind=saved;}
 roundCap(x,y,z,rx,rz,h,taper,segments,rings=1){if(this.construction[0]<0||this.construction[1]<=0||this.kind!==0)return;const old={kind:this.kind,material:this.material,route:this.route};this.kind=3;this.material=19;this.route=[y,y+h,taper,rings];for(let i=0;i<segments;i++){const a=i/segments*TAU,b=(i+1)/segments*TAU,base=this.data.length/23;this.vertex([x,0,z],[0,1,0],[.49,.50,.46],[0,0]);this.vertex([x+Math.cos(b)*rx,0,z+Math.sin(b)*rz],[0,1,0],[.49,.50,.46],[Math.cos(b)*rx,Math.sin(b)*rz]);this.vertex([x+Math.cos(a)*rx,0,z+Math.sin(a)*rz],[0,1,0],[.49,.50,.46],[Math.cos(a)*rx,Math.sin(a)*rz]);this.indices.push(base,base+1,base+2);}Object.assign(this,old);}
 cylinder(x,y,z,rx,rz,h,c,segments=24,taper=1){for(let i=0;i<segments;i++){const a=i/segments*TAU,b=(i+1)/segments*TAU;const p=[x+Math.cos(a)*rx,y,z+Math.sin(a)*rz],q=[x+Math.cos(b)*rx,y,z+Math.sin(b)*rz],t=[x+Math.cos(b)*rx*taper,y+h,z+Math.sin(b)*rz*taper],s=[x+Math.cos(a)*rx*taper,y+h,z+Math.sin(a)*rz*taper];this.face(p,q,t,s,c,[Math.cos((a+b)/2),0,Math.sin((a+b)/2)]);this.face([x,y+h,z],s,t,[x,y+h,z],color(c,.9),[0,1,0]);}this.roundCap(x,y,z,rx,rz,h,taper,segments);}
 sphere(x,y,z,rx,ry,rz,c,segments=10,rings=6){for(let j=0;j<rings;j++)for(let i=0;i<segments;i++){const p=(a,b)=>[x+Math.cos(a)*Math.sin(b)*rx,y+Math.cos(b)*ry,z+Math.sin(a)*Math.sin(b)*rz];const a=i/segments*TAU,b=(i+1)/segments*TAU,c0=j/rings*Math.PI,d=(j+1)/rings*Math.PI;const n=norm3([Math.cos((a+b)/2)*Math.sin((c0+d)/2),Math.cos((c0+d)/2),Math.sin((a+b)/2)*Math.sin((c0+d)/2)]);this.face(p(a,c0),p(b,c0),p(b,d),p(a,d),c,n)}if(this.material===8)this.roundCap(x,y-ry,z,rx,rz,ry*2,0,segments,rings);}
 upload(){this.vertexCount=this.data.length/23;this.count=this.indices.length;this.buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,this.buffer);if(this.vertexCount<=65535){gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(this.data),gl.STATIC_DRAW);this.indexBuffer=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,this.indexBuffer);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(this.indices),gl.STATIC_DRAW);}else{const expanded=new Float32Array(this.count*23);for(let j=0;j<this.count;j++)for(let k=0;k<23;k++)expanded[j*23+k]=this.data[this.indices[j]*23+k];gl.bufferData(gl.ARRAY_BUFFER,expanded,gl.STATIC_DRAW);this.vertexCount=this.count;}this.data=null;this.indices=null;return this}

}

<script>
/* STRUCT v1 — layered structural system for MOOR.
 * Spec: components/struct/SPEC.md (law).
 * Zero dependencies except CityMesh from ../mesh-builder/mesh-builder.js.
 * Pure logic + geometry math: no `window`/`document` references, node-testable.
 * Units meters. Wall thickness 0.15. Grid snap 0.5. Y-up, ground y=0.
 *
 * DUAL-MODE: emit(mesh, building) fills mesh.data/indices (triangles).
 * emitCollision(building) makes a CityMesh with mesh.solids=[], runs the SAME
 * emission, returns the AABB array. Every box() call yields exactly one AABB.
 * (CityMesh.box pushes one {lo,hi,c,mat,kind,anchor} record per call when
 *  mesh.solids is set; degenerate boxes emit nothing in either mode.)
 */

/* CityMesh loader — works in node (require) and browser (script tag first).
 * NOTE: mesh-builder.js declares `class CityMesh` at top level. In a classic
 * browser script that creates a global LEXICAL binding (NOT window.CityMesh),
 * and a `var CityMesh` here would throw "already declared". So we never
 * declare that name: `typeof CityMesh` safely resolves the lexical binding. */
var CityMeshCtor = (function () {
  try { if (typeof CityMesh !== 'undefined' && CityMesh) return CityMesh; } catch (e) {}
  if (typeof require === 'function') {
    try { return require('../mesh-builder/mesh-builder.js').CityMesh; } catch (e) {}
  }
  return null;
})();

/* ---------------- constants ---------------- */
var WALL_T = 0.15;          // wall thickness (frame core)
var SKIN_T = 0.02;          // face skin proud offset
var GRID = 0.5;             // grid snap
var WALL_H = 2.7;           // default story height
var SLAB_T = 0.12;          // floor slab thickness
var JUNCTION_TOL = 0.08;    // endpoint clustering distance
var PERIM_TOL = 0.01;       // room perimeter membership tolerance
var MIN_WALL_LEN = 1.0;

/* ---------------- seeded RNG (mulberry32 + FNV-1a) ---------------- */
function hashSeed(str) {
  var h = 0x811c9dc5; // FNV-1a 32-bit
  str = String(str);
  for (var i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return h >>> 0;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
/* RNG(seed) -> {f, i, pick, chance, range} */
function RNG(seed) {
  var next = mulberry32(hashSeed(seed));
  return {
    f: function () { return next(); },
    range: function (lo, hi) { return lo + next() * (hi - lo); },
    i: function (lo, hi) { return lo + Math.floor(next() * (hi - lo + 1)); },
    pick: function (arr) { return arr[Math.floor(next() * arr.length)]; },
    chance: function (p) { return next() < p; },
    _next: next
  };
}

/* ---------------- materials pool v1 ---------------- */
var MATERIALS = [
  { id: 'wood-frame',  name: 'Framing lumber',   kind: 'frame',  color: '#8a6b45' },
  { id: 'metal-frame', name: 'Steel studs',      kind: 'frame',  color: '#7d8590' },
  { id: 'drywall',     name: 'Painted drywall',  kind: 'inner',  color: '#e8e4da' },
  { id: 'wallpaper',   name: 'Pattern wallpaper',kind: 'inner',  color: '#c9b8a3' },
  { id: 'plaster',     name: 'Lime plaster',     kind: 'inner',  color: '#ded5c4' },
  { id: 'brick',       name: 'Fired brick',       kind: 'outer',  color: '#9a4f38' },
  { id: 'siding',      name: 'Lap siding',        kind: 'outer',  color: '#b8c4cc' },
  { id: 'concrete',    name: 'Poured concrete',   kind: 'both',   color: '#a3a5a8' },
  { id: 'stone',       name: 'Fieldstone',        kind: 'outer',  color: '#8d867a' },
  { id: 'glass-pane',  name: 'Glazing',           kind: 'socket', color: '#bfe0ea' },
  { id: 'shingle',     name: 'Asphalt shingle',   kind: 'roof',   color: '#4a4d52' },
  { id: 'metal-roof',  name: 'Standing seam',     kind: 'roof',   color: '#6b7280' },
  { id: 'hardwood',    name: 'Oak floor',         kind: 'floor',  color: '#a97e4f' },
  { id: 'tile',        name: 'Ceramic tile',      kind: 'floor',  color: '#c9c2b4' },
  { id: 'carpet',      name: 'Cut pile',         kind: 'floor',  color: '#7a6a8f' }
];
var MAT_BY_ID = {};
MATERIALS.forEach(function (m) { MAT_BY_ID[m.id] = m; });

function hexRgb(hex) {
  var n = parseInt(hex.slice(1), 16);
  return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
}
/* mat(id, role='inner') -> material record. Never throws.
 * Unknown id (or wrong kind for role) falls back per spec: drywall for inner,
 * brick for outer. role 'frame'->wood-frame, 'roof'->shingle, 'floor'->hardwood. */
function mat(id, role) {
  role = role || 'inner';
  var m = MAT_BY_ID[id];
  var ok = m && (role === 'inner' ? (m.kind === 'inner' || m.kind === 'both')
              : role === 'outer' ? (m.kind === 'outer' || m.kind === 'both')
              : true);
  if (ok) return m;
  if (role === 'outer') return MAT_BY_ID.brick;
  if (role === 'frame') return MAT_BY_ID['wood-frame'];
  if (role === 'roof') return MAT_BY_ID.shingle;
  if (role === 'floor') return MAT_BY_ID.hardwood;
  return MAT_BY_ID.drywall;
}
function matColor(id, role) { return hexRgb(mat(id, role).color); }

/* ---------------- window / door styles v1 ---------------- */
var WINDOW_STYLES = {
  'double-hung': { w: 1.2, h: 1.4, sill: 0.9 },
  'slider':      { w: 1.8, h: 1.2, sill: 1.0 },
  'picture':     { w: 2.4, h: 1.5, sill: 0.8 },
  'round':       { w: 0.9, h: 0.9, sill: 1.25 }  // ø0.9, center 1.7 → sill 1.25
};
var DOOR_STYLES = {
  'panel':  { w: 0.9, h: 2.1, sill: 0 },
  'double': { w: 1.6, h: 2.1, sill: 0 },
  'sliding':{ w: 1.8, h: 2.1, sill: 0 }
};
function socketDims(sock) {
  var table = sock.kind === 'door' ? DOOR_STYLES : WINDOW_STYLES;
  return table[sock.style] || table[sock.kind === 'door' ? 'panel' : 'double-hung'];
}

/* ---------------- room types v1 ---------------- */
var ROOM_TYPES = {
  living:  { floor: 'hardwood', min: 9 },
  bed:     { floor: 'hardwood', min: 6 },
  bath:    { floor: 'tile',     min: 2 },
  kitchen: { floor: 'tile',     min: 6 },
  hall:    { floor: 'hardwood', min: 2 },
  garage:  { floor: 'concrete', min: 12 },
  civic:   { floor: 'tile',     min: 16 }
};

/* ---------------- themes v1 ---------------- */
var THEMES = {
  craftsman: { frame: 'wood-frame',  outer: 'siding',   roof: 'gable', win: ['double-hung', 'double-hung', 'picture'] },
  modern:    { frame: 'metal-frame', outer: 'concrete', roof: 'flat',  win: ['picture', 'slider', 'picture'] },
  'brick-row':{ frame: 'wood-frame', outer: 'brick',    roof: 'gable', win: ['double-hung'] },
  civic:     { frame: 'metal-frame', outer: 'stone',    roof: 'hip',   win: ['picture', 'picture', 'slider'] }

function themeOf(name) { return THEMES[name] || THEMES.craftsman; }

/* ---------------- small math ---------------- */
function snap(v) { return Math.round(v / GRID) * GRID; }

function isXWall(w) { return Math.abs(w.b.z - w.a.z) < 1e-9; }
function isZWall(w) { return Math.abs(w.b.x - w.a.x) < 1e-9; }

 * For room walls wound CCW, interior is on the left — no flip needed. */
function leftNormal(w) {
  var dx = w.b.x - w.a.x, dz = w.b.z - w.a.z, l = Math.hypot(dx, dz) || 1;
  return { x: -dz / l, z: dx / l };
}

/* ---------------- junction resolution ---------------- */
/* resolveJunctions(walls) -> new walls with endpoints clustered within
 * 0.08m merged to their centroid (union-find, so chains merge). BEFORE emission. */
function resolveJunctions(walls) {
  var pts = [];
  walls.forEach(function (w, i) {
    pts.push({ x: w.a.x, z: w.a.z, wi: i, end: 'a' });
    pts.push({ x: w.b.x, z: w.b.z, wi: i, end: 'b' });
  });
  var parent = pts.map(function (_, i) { return i; });
  function find(i) { while (parent[i] !== i) { parent[i] = parent[parent[i]]; i = parent[i]; } return i; }
  function union(i, j) { parent[find(i)] = find(j); }
  var tol2 = JUNCTION_TOL * JUNCTION_TOL;
  for (var i = 0; i < pts.length; i++)
    for (var j = i + 1; j < pts.length; j++)
      if (dist2(pts[i].x, pts[i].z, pts[j].x, pts[j].z) <= tol2) union(i, j);
  var sums = {};
  pts.forEach(function (p, i) {
    var r = find(i), s = sums[r] || (sums[r] = { x: 0, z: 0, n: 0 });
    s.x += p.x; s.z += p.z; s.n++;
  });
  var centroid = {};
  Object.keys(sums).forEach(function (r) {
    centroid[r] = { x: sums[r].x / sums[r].n, z: sums[r].z / sums[r].n };
  });
  return walls.map(function (w, i) {
    var c = JSON.parse(JSON.stringify(w));
    var ca = centroid[find(i * 2)], cb = centroid[find(i * 2 + 1)];
    c.a = { x: ca.x, z: ca.z }; c.b = { x: cb.x, z: cb.z };
    return c;
  });
}

/* ---------------- wall emission ---------------- */
/* A wall emits as LAYERED boxes: frame core (0.15 full height), inner skin
 * (0.02 proud, interior side), outer skin (0.02 proud, exterior side).
 * opts: {y0} base height (default 0), {inward} interior normal {x,z}
 * (default: left of a→b). Sockets split the wall into runs around openings. */
function emitRun(mesh, wall, t0, t1, yLo, yHi, n) {
  var h = yHi - yLo;
  if (h <= 0 || t1 - t0 <= 0) return;
  function pt(t) { return { x: wall.a.x + (wall.b.x - wall.a.x) * t, z: wall.a.z + (wall.b.z - wall.a.z) * t }; }
  var p0 = pt(t0), p1 = pt(t1);
  var frameC = matColor(wall.frame, 'frame');
  var innerC = matColor(wall.inner, 'inner');
  // partitions (exterior===false) are interior on both faces
  var outerC = matColor(wall.outer, wall.exterior === false ? 'inner' : 'outer');
  var xWall = Math.abs(p1.z - p0.z) < Math.abs(p1.x - p0.x); // dominant axis
  if (xWall) {
    var xa = Math.min(p0.x, p1.x), len = Math.abs(p1.x - p0.x), zc = (p0.z + p1.z) / 2;
    var s = n.z >= 0 ? 1 : -1; // interior side sign along z
    mesh.box(xa, yLo, zc - WALL_T / 2, len, h, WALL_T, frameC);
    mesh.box(xa, yLo, s > 0 ? zc + WALL_T / 2 : zc - WALL_T / 2 - SKIN_T, len, h, SKIN_T, innerC);
    mesh.box(xa, yLo, s > 0 ? zc - WALL_T / 2 - SKIN_T : zc + WALL_T / 2, len, h, SKIN_T, outerC);
  } else {
    var za = Math.min(p0.z, p1.z), len2 = Math.abs(p1.z - p0.z), xc = (p0.x + p1.x) / 2;
    var s2 = n.x >= 0 ? 1 : -1;
    mesh.box(xc - WALL_T / 2, yLo, za, WALL_T, h, len2, frameC);
    mesh.box(s2 > 0 ? xc + WALL_T / 2 : xc - WALL_T / 2 - SKIN_T, yLo, za, SKIN_T, h, len2, innerC);
    mesh.box(s2 > 0 ? xc - WALL_T / 2 - SKIN_T : xc + WALL_T / 2, yLo, za, SKIN_T, h, len2, outerC);
  }
}

/* Cut runs around sockets. Returns array of {t0,t1,yLo,yHi} full-height runs
 * plus opening descriptors for trim/glazing. */
function cutRuns(wall) {
  var L = wallLen(wall), H = wall.h || WALL_H;
  var ops = (wall.sockets || []).map(function (s) {
    var d = socketDims(s);
    var hw = (d.w / 2) / L;
    return { t0: s.t - hw, t1: s.t + hw, kind: s.kind, w: d.w, h: d.h, sill: d.sill };
  }).sort(function (p, q) { return p.t0 - q.t0; });
  var runs = [], cur = 0;
  ops.forEach(function (o) {
    if (o.t0 > cur) runs.push({ t0: cur, t1: o.t0, yLo: 0, yHi: H });
    runs.push({ t0: o.t0, t1: o.t1, yLo: o.sill + o.h, yHi: H });       // header
    if (o.kind === 'window' && o.sill > 0)
      runs.push({ t0: o.t0, t1: o.t1, yLo: 0, yHi: o.sill });           // sill
    cur = o.t1;
  });
  if (cur < 1) runs.push({ t0: cur, t1: 1, yLo: 0, yHi: H });
  return { runs: runs, openings: ops, H: H };
}

function ptAt(wall, t) {
  return { x: wall.a.x + (wall.b.x - wall.a.x) * t, z: wall.a.z + (wall.b.z - wall.a.z) * t };
}

/* Emit trim frame + glazing for one opening. Trim boxes in frame material;
 * windows get a thin glass-pane glazing box. */
function emitOpening(mesh, wall, o, y0, n) {
  var frameC = matColor(wall.frame, 'frame');
  var c0 = ptAt(wall, o.t0), c1 = ptAt(wall, o.t1);
  var xWall = Math.abs(c1.z - c0.z) < Math.abs(c1.x - c0.x);
  var base = y0 + o.sill, top = y0 + o.sill + o.h, tw = 0.08; // trim width
  function hbox(cx, cz, w, d, yA, yB) { mesh.box(cx - w / 2, yA, cz - d / 2, w, yB - yA, d, frameC); }
  if (xWall) {
    var zc = (c0.z + c1.z) / 2, xa = Math.min(c0.x, c1.x), xb = Math.max(c0.x, c1.x);
    var td = WALL_T + 0.04;
    hbox(xa, zc, tw, td, base, top);            // jamb L
    hbox(xb, zc, tw, td, base, top);            // jamb R
    hbox((xa + xb) / 2, zc, (xb - xa) + tw, td, top, top + tw); // head
    if (o.kind === 'window')
      hbox((xa + xb) / 2, zc, (xb - xa) + tw, td, base - tw, base); // sill trim
    else
      hbox((xa + xb) / 2, zc, (xb - xa) + tw, td, base, base + 0.02); // threshold
    if (o.kind === 'window')
      mesh.box(xa, base, zc - 0.01, xb - xa, o.h, 0.02, matColor('glass-pane', 'socket'));
  } else {
    var xc = (c0.x + c1.x) / 2, za = Math.min(c0.z, c1.z), zb = Math.max(c0.z, c1.z);
    var td2 = WALL_T + 0.04;
    hbox(xc, za, td2, tw, base, top);
    hbox(xc, zb, td2, tw, base, top);
    hbox(xc, (za + zb) / 2, td2, (zb - za) + tw, top, top + tw);
    if (o.kind === 'window')
      hbox(xc, (za + zb) / 2, td2, (zb - za) + tw, base - tw, base);
    else
      hbox(xc, (za + zb) / 2, td2, (zb - za) + tw, base, base + 0.02);
    if (o.kind === 'window')
      mesh.box(xc - 0.01, base, za, 0.02, o.h, zb - za, matColor('glass-pane', 'socket'));
  }
}

/* Non-axis-aligned walls: approximate with stepped axis-aligned boxes along
 * the dominant axis (documented approximation; generator only makes axis
 * walls). Sockets are ignored on diagonal walls (validate warns). */
function emitDiagonal(mesh, wall, y0) {
  var steps = Math.max(2, Math.ceil(wallLen(wall) / GRID));
  var frameC = matColor(wall.frame, 'frame');
  for (var i = 0; i < steps; i++) {
    var p0 = ptAt(wall, i / steps), p1 = ptAt(wall, (i + 1) / steps);
    var xa = Math.min(p0.x, p1.x), za = Math.min(p0.z, p1.z);
    var w = Math.max(Math.abs(p1.x - p0.x), 0.05), d = Math.max(Math.abs(p1.z - p0.z), 0.05);
    mesh.box(xa - WALL_T / 4, y0, za - WALL_T / 4, w + WALL_T / 2, wall.h || WALL_H, d + WALL_T / 2, frameC);
  }
}

/* emitWall(mesh, wall, opts) — full layered wall with sockets. */
function emitWall(mesh, wall, opts) {
  opts = opts || {};
  var y0 = wall.y0 || opts.y0 || 0;
  if (!isAxisAligned(wall)) { emitDiagonal(mesh, wall, y0); return; }
  var n = opts.inward || leftNormal(wall);
  var cut = cutRuns(wall);
  cut.runs.forEach(function (r) { emitRun(mesh, wall, r.t0, r.t1, y0 + r.yLo, y0 + r.yHi, n); });
  cut.openings.forEach(function (o) { emitOpening(mesh, wall, o, y0, n); });
}

/* ---------------- floor slabs ---------------- */
/* Slab per room rect: 0.12 thick, top at room floor level (y0). */
function emitSlab(mesh, room) {
  var y0 = room.y0 || 0;
  var r = room.rect;
  mesh.box(r.x, y0 - SLAB_T, r.z, r.w, SLAB_T, r.d, matColor(room.floor, 'floor'));
}

/* ---------------- roofs v1 ---------------- */
/* Helper: push one AABB record directly (collision mode for non-box geometry). */
function pushAABB(mesh, lo, hi, c) {
  mesh.solids.push({ lo: lo, hi: hi, c: c, mat: mesh.material, kind: 0, anchor: 0 });
}
/* Sloped quad via explicit corners (triangle mode). In collision mode the

function quad(mesh, a, b, c, d, col) {
  mesh.face(a, b, c, d, col, null);
}
function tri(mesh, a, b, c, col) {
  var n = null, base = mesh.data.length / 23;

  mesh.vertex(b, [0, 1, 0], col, [1, 0]);
  mesh.vertex(c, [0, 1, 0], col, [0, 1]);

  var lo = [Infinity, Infinity, Infinity], hi = [-Infinity, -Infinity, -Infinity];

}

function lerp3(a, b, f) { return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f]; }

 * triangle face). Emits N thin axis-aligned boxes staircasing up the slope —

 * holds exactly. In triangle mode a smooth quad face is ALSO emitted for looks
 * (render-only: face() never touches mesh.solids, never calls box()). */

  var N = 6, th = 0.12, collision = !!mesh.solids;
  for (var i = 0; i < N; i++) {

    var pA0 = lerp3(A, D, f0), pB0 = lerp3(B, C, f0);

    if (z1 - z0 < 0.05) { var cz = (z0 + z1) / 2; z0 = cz - 0.025; z1 = cz + 0.025; }
    var yLo = Math.min(pA0[1], pB0[1]) - th, yHi = Math.max(pA1[1], pB1[1]);

function emitRoof(mesh, building) {
  var fp = building.footprint, top = building.stories * WALL_H;
  var x0 = -fp.w / 2, x1 = fp.w / 2, z0 = -fp.d / 2, z1 = fp.d / 2;
  var oh = 0.3, col = matColor(building.roof.mat, 'roof');
  var collision = !!mesh.solids;
  var type = building.roof.type;
  if (type === 'flat') {
    mesh.box(x0 - oh, top, z0 - oh, fp.w + 2 * oh, 0.15, fp.d + 2 * oh, col);
    var ph = 0.4, pt = 0.12, py = top + 0.15; // parapet
    mesh.box(x0 - oh, py, z0 - oh, fp.w + 2 * oh, ph, pt, col);
    mesh.box(x0 - oh, py, z1 + oh - pt, fp.w + 2 * oh, ph, pt, col);
    mesh.box(x0 - oh, py, z0 - oh, pt, ph, fp.d + 2 * oh, col);
    mesh.box(x1 + oh - pt, py, z0 - oh, pt, ph, fp.d + 2 * oh, col);
    return;
  }
  if (type === 'gable') {
    // Ridge along longest axis, 30° pitch. Sloped panels go through emitSlope
    // (stepped boxes in BOTH modes + a smooth face in triangle mode only).
    // Gable end triangles are true triangles via vertex()+indices — render-only
    // in collision mode (walls carry the collision); they never call box(),
    // so parity is unaffected.
    var alongX = fp.w >= fp.d;
    var half = (alongX ? fp.d : fp.w) / 2 + oh;
    var rise = Math.tan(Math.PI / 6) * half; // 30°
    if (alongX) {
      var zc = 0;
      emitSlope(mesh, [x0 - oh, top, z0 - oh], [x1 + oh, top, z0 - oh],

      emitSlope(mesh, [x1 + oh, top, z1 + oh], [x0 - oh, top, z1 + oh],
                      [x0 - oh, top + rise, zc], [x1 + oh, top + rise, zc], col);
      if (!collision) {
        tri(mesh, [x0, top, z0], [x0, top, z1], [x0, top + rise, zc], col);
        tri(mesh, [x1, top, z1], [x1, top, z0], [x1, top + rise, zc], col);
      }
    } else {
      var xc = 0;
      emitSlope(mesh, [x0 - oh, top, z0 - oh], [x0 - oh, top, z1 + oh],
                      [xc, top + rise, z1 + oh], [xc, top + rise, z0 - oh], col);
      emitSlope(mesh, [x1 + oh, top, z1 + oh], [x1 + oh, top, z0 - oh],
                      [xc, top + rise, z0 - oh], [xc, top + rise, z1 + oh], col);
      if (!collision) {
        tri(mesh, [x0, top, z0], [x1, top, z0], [xc, top + rise, z0], col);

      var r0 = x0 + inset, r1 = x1 - inset, zc2 = 0;
      emitSlope(mesh, [x0 - oh, top, z0 - oh], [x1 + oh, top, z0 - oh],
                      [r1, top + rise2, zc2], [r0, top + rise2, zc2], col);
      emitSlope(mesh, [x1 + oh, top, z1 + oh], [x0 - oh, top, z1 + oh],
                      [r0, top + rise2, zc2], [r1, top + rise2, zc2], col);
      emitSlope(mesh, [x0 - oh, top, z1 + oh], [x0 - oh, top, z0 - oh],
                      [r0, top + rise2, zc2], [r0, top + rise2, zc2], col);
      emitSlope(mesh, [x1 + oh, top, z0 - oh], [x1 + oh, top, z1 + oh],
                      [r1, top + rise2, zc2], [r1, top + rise2, zc2], col);
    } else {
      var s0 = z0 + inset, s1 = z1 - inset, xc2 = 0;
      emitSlope(mesh, [x0 - oh, top, z0 - oh], [x0 - oh, top, z1 + oh],
                      [xc2, top + rise2, s1], [xc2, top + rise2, s0], col);
      emitSlope(mesh, [x1 + oh, top, z1 + oh], [x1 + oh, top, z0 - oh],
                      [xc2, top + rise2, s0], [xc2, top + rise2, s1], col);
      emitSlope(mesh, [x1 + oh, top, z0 - oh], [x0 - oh, top, z0 - oh],
                      [xc2, top + rise2, s0], [xc2, top + rise2, s0], col);
      emitSlope(mesh, [x0 - oh, top, z1 + oh], [x1 + oh, top, z1 + oh],
                      [xc2, top + rise2, s1], [xc2, top + rise2, s1], col);
    }
    return;
  }
}

/* ---------------- room assembly ---------------- */
/* roomsFromWalls(walls) — detect axis-aligned rectangular rooms: candidate
 * rects from wall coordinate lines; a rect is a room when wall segments cover
 * each of its 4 edges within 0.01. Largest-first, no interior overlap.
 * Type heuristic (documented): aspect > 2.5 → hall; area < 6 → bath;
 * area < 14 → bed; else living. */

  walls.forEach(function (w, i) {
    if (isXWall(w)) { hWalls.push({ c: w.a.z, a: Math.min(w.a.x, w.b.x), b: Math.max(w.a.x, w.b.x), i: i }); xs[w.a.x] = 1; xs[w.b.x] = 1; }
    else if (isZWall(w)) { vWalls.push({ c: w.a.x, a: Math.min(w.a.z, w.b.z), b: Math.max(w.a.z, w.b.z), i: i }); zs[w.a.z] = 1; zs[w.b.z] = 1; }
  });
  var X = Object.keys(xs).map(Number).sort(function (a, b) { return a - b; });
  var Z = Object.keys(zs).map(Number).sort(function (a, b) { return a - b; });
  function coversEdge(segs, at, lo, hi) {
    var runs = segs.filter(function (s) { return Math.abs(s.c - at) <= PERIM_TOL; })
      .map(function (s) { return [Math.max(s.a, lo), Math.min(s.b, hi)]; })
      .filter(function (r) { return r[1] > r[0]; })
      .sort(function (p, q) { return p[0] - q[0]; });
    var cur = lo;
    for (var k = 0; k < runs.length; k++) {
      if (runs[k][0] > cur + PERIM_TOL) return false;
      cur = Math.max(cur, runs[k][1]);
    }
    return cur >= hi - PERIM_TOL;

  var cands = [];
  for (var xi = 0; xi < X.length; xi++) for (var xj = xi + 1; xj < X.length; xj++)
    for (var zi = 0; zi < Z.length; zi++) for (var zj = zi + 1; zj < Z.length; zj++) {
      var x0 = X[xi], x1 = X[xj], z0 = Z[zi], z1 = Z[zj];
      if (x1 - x0 < 1 || z1 - z0 < 1) continue;
      if (!coversEdge(hWalls, z0, x0, x1)) continue;
      if (!coversEdge(hWalls, z1, x0, x1)) continue;
      if (!coversEdge(vWalls, x0, z0, z1)) continue;
      if (!coversEdge(vWalls, x1, z0, z1)) continue;

  cands.forEach(function (r) {
    var overlap = rooms.some(function (o) {
      return r.x < o.rect.x + o.rect.w - 1e-9 && o.rect.x < r.x + r.w - 1e-9 &&

'}'].join('\n');

var pShell=prog(VS_SHELL,FS_SHELL), uShell=grab(pShell,['uMVP','uCam','uTint','uAlpha','uPeelY']);
var pRoom =prog(VS_ROOM, FS_ROOM),  uRoom =grab(pRoom, ['uMVP','uCam','uPeelY']);

/* ---------------- layered emission ---------------- */
var CityMesh=Struct.CityMesh();
function key3(c){return c[0].toFixed(4)+','+c[1].toFixed(4)+','+c[2].toFixed(4);}
/* color sets built from the SAME matColor() calls the engine makes — exact match */
function classify(b){
  var frame={},inner={},outer={},floor={};
  b.walls.forEach(function(w){
    frame[key3(Struct.matColor(w.frame,'frame'))]=1;
    inner[key3(Struct.matColor(w.inner,'inner'))]=1;
    outer[key3(Struct.matColor(w.outer,w.exterior===false?'inner':'outer'))]=1;
  });
  b.rooms.forEach(function(r){floor[key3(Struct.matColor(r.floor,'floor'))]=1;});
  return {frame:frame,inner:inner,outer:outer,floor:floor,
    roof:key3(Struct.matColor(b.roof.mat,'roof')),
    glass:key3(Struct.matColor('glass-pane','socket'))};
}
function makeRouter(meshes,cls){
  return function(x,y,z,w,h,d,c,mat){
    var k=key3(c),m;
    if(cls.inner[k])m=meshes.inner;
    else if(cls.outer[k]||k===cls.roof||k===cls.glass)m=meshes.outer;
    else m=meshes.frame; /* frame cores, trim, slabs */
    m.box(x,y,z,w,h,d,c,mat);
  };
}
function mergeInto(dst,src){ /* smooth roof faces land in proxy data — fold into outer */
  if(!src.data||!src.data.length)return;
  var base=dst.data.length/23,i;
  for(i=0;i<src.data.length;i++)dst.data.push(src.data[i]);
  for(i=0;i<src.indices.length;i++)dst.indices.push(src.indices[i]+base);
}
function emitLayered(b){
  var cls=classify(b);
  var tri={frame:new CityMesh(),inner:new CityMesh(),outer:new CityMesh()};
  var col={frame:new CityMesh(),inner:new CityMesh(),outer:new CityMesh()};
  Object.keys(col).forEach(function(k){col[k].solids=[];});
  var pT=new CityMesh(); pT.box=makeRouter(tri,cls);
  var walls=Struct.resolveJunctions(b.walls);
  walls.forEach(function(w){Struct.emitWall(pT,w);});
  b.rooms.forEach(function(r){Struct.emitSlab(pT,r);});
  Struct.emitRoof(pT,b);
  mergeInto(tri.outer,pT);
  var pC=new CityMesh(); pC.solids=[]; pC.box=makeRouter(col,cls);
  var walls2=Struct.resolveJunctions(b.walls);
  walls2.forEach(function(w){Struct.emitWall(pC,w);});
  b.rooms.forEach(function(r){Struct.emitSlab(pC,r);});
  Struct.emitRoof(pC,b);
  return {tri:tri,col:col};
}

var ROOM_CSS={living:'#3dff88',bed:'#6aa2ff',bath:'#4de3ff',kitchen:'#ff9c33',
  hall:'#9aa0ab',garage:'#ffd94d',civic:'#c07dff'};
var ROOM_RGB={living:[0.24,1.0,0.53],bed:[0.42,0.63,1.0],bath:[0.30,0.89,1.0],
  kitchen:[1.0,0.61,0.20],hall:[0.60,0.63,0.67],garage:[1.0,0.85,0.30],civic:[0.75,0.49,1.0]};
function buildRoomMeshes(b){
  var tri=new CityMesh(), colM=new CityMesh(); colM.solids=[];
  b.rooms.forEach(function(r){
    var c=ROOM_RGB[r.type]||[0.7,0.7,0.75];
    var y0=r.y0||0, h=Struct.WALL_H-0.08, m=0.05;
    tri.box(r.rect.x+m,y0+0.02,r.rect.z+m,r.rect.w-2*m,h,r.rect.d-2*m,c);
    colM.box(r.rect.x+m,y0+0.02,r.rect.z+m,r.rect.w-2*m,h,r.rect.d-2*m,c);
  });
  return {tri:tri,solids:colM.solids};
}

/* ---------------- GL buffers ---------------- */
var STRIDE=23*4;
function toGL(mesh){
  var n=mesh.data.length/23;
  var vb=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,vb);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(mesh.data),gl.STATIC_DRAW);
  var ib=gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);
  var idx,type;
  if(n<=65535){idx=new Uint16Array(mesh.indices);type=gl.UNSIGNED_SHORT;}
  else{idx=new Uint32Array(mesh.indices);type=gl.UNSIGNED_INT;}
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,idx,gl.STATIC_DRAW);
  return {vb:vb,ib:ib,count:mesh.indices.length,type:type,tris:mesh.indices.length/3};
}
function aabbLines(solids,colored){
  var pos=[],col=[];
  var E=[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
  solids.forEach(function(s){
    var x0=s.lo[0],y0=s.lo[1],z0=s.lo[2],x1=s.hi[0],y1=s.hi[1],z1=s.hi[2];
    var c=[[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1],
           [x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]];
    E.forEach(function(e){
      pos.push(c[e[0]][0],c[e[0]][1],c[e[0]][2],c[e[1]][0],c[e[1]][1],c[e[1]][2]);
      if(colored){var cc=s.c||[1,1,1];
        col.push(cc[0],cc[1],cc[2],cc[0],cc[1],cc[2]);}
    });
  });
  var b=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(pos),gl.STATIC_DRAW);
  var cb=null;
  if(colored){cb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,cb);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(col),gl.STATIC_DRAW);}
  return {buf:b,cbuf:cb,count:pos.length/3,boxes:solids.length};
}
function bindMesh(p,g,specs){
  specs.forEach(function(sp){
    var loc=gl.getAttribLocation(p,sp[0]); if(loc<0)return;
    gl.bindBuffer(gl.ARRAY_BUFFER,g.vb);
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc,sp[2],gl.FLOAT,false,STRIDE,sp[1]*4);
  });
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,g.ib);
}
function bindLines(p,l,specs){
  specs.forEach(function(sp){
    var loc=gl.getAttribLocation(p,sp[0]); if(loc<0)return;
    gl.bindBuffer(gl.ARRAY_BUFFER,sp[0]==='aPos'?l.buf:l.cbuf);
    gl.enableVertexAttribArray(loc);
    var stride=sp[0]==='aPos'?(l.cbuf?6:3)*4:6*4, off=sp[0]==='aCol'?3*4:0;
    gl.vertexAttribPointer(loc,3,gl.FLOAT,false,stride,off);
  });
}

/* ---------------- matrices / camera ---------------- */
function mPersp(fov,asp,n,f){var t=1/Math.tan(fov/2),o=new Float32Array(16);
  o[0]=t/asp;o[5]=t;o[10]=(f+n)/(n-f);o[11]=-1;o[14]=2*f*n/(n-f);return o;}
function mLook(e,c){var zx=e[0]-c[0],zy=e[1]-c[1],zz=e[2]-c[2];
  var zl=Math.hypot(zx,zy,zz),z=[zx/zl,zy/zl,zz/zl];
  var xx=z[2],xy=0,xz=-z[0],xl=Math.hypot(xx,xy,xz)||1;xx/=xl;xy/=xl;xz/=xl;
  var yx=z[1]*xz-z[2]*xy,yy=z[2]*xx-z[0]*xz,yz=z[0]*xy-z[1]*xx;
  var o=new Float32Array(16);
  o[0]=xx;o[1]=yx;o[2]=z[0];o[4]=xy;o[5]=yy;o[6]=z[1];
  o[8]=xz;o[9]=yz;o[10]=z[2];
  o[12]=-(xx*e[0]+xy*e[1]+xz*e[2]);o[13]=-(yx*e[0]+yy*e[1]+yz*e[2]);
  o[14]=-(z[0]*e[0]+z[1]*e[1]+z[2]*e[2]);o[15]=1;return o;}
function mMul(a,b){var o=new Float32Array(16);
  for(var c=0;c<4;c++)for(var r=0;r<4;r++)
    o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3];
  return o;}
var yaw=0.8,pitch=0.55,radius=24,target=[0,2.4,0],autoRot=true;
var FOV=0.9;
function eyePos(){return [target[0]+radius*Math.cos(pitch)*Math.sin(yaw),
  target[1]+radius*Math.sin(pitch),target[2]+radius*Math.cos(pitch)*Math.cos(yaw)];}
function viewProj(){var e=eyePos();
  return {m:mMul(mPersp(FOV,cv.width/Math.max(1,cv.height),0.5,600),mLook(e,target)),eye:e};}
function project(m,x,y,z){
  var w=m[3]*x+m[7]*y+m[11]*z+m[15];
  if(w<=0)return null;
  return [(m[0]*x+m[4]*y+m[8]*z+m[12])/w,(m[1]*x+m[5]*y+m[9]*z+m[13])/w,
          (m[2]*x+m[6]*y+m[10]*z+m[14])/w];}

/* ---------------- state ---------------- */
var LAYERS={
  frame:{on:false,tint:[0.45,0.65,1.0],line:[0.45,0.65,1.0],alpha:0.10},
  inner:{on:false,tint:[1.0,0.93,0.80],line:[1.0,0.90,0.70],alpha:0.07},
  outer:{on:true, tint:[0.55,0.85,1.0],line:[1.0,0.62,0.22],alpha:0.10},
  rooms:{on:true},
  collision:{on:false}
};
var building=null,G=null,curSeed='xray-01',curTheme='craftsman',peelVal=2;
var labelDivs=[];
var gridBuf=(function(){
  var E=60;
  var b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-E,-0.15,-E, E,-0.15,-E, E,-0.15,E, -E,-0.15,E]),gl.STATIC_DRAW);
  var ib=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array([0,1,2,0,2,3]),gl.STATIC_DRAW);
  return {vb:b,ib:ib};
})();

function peelHeight(){
  if(peelVal>=2)return 1e6;
  if(peelVal<=0)return 0.03;
  return peelVal*Struct.WALL_H+0.03;
}

function rebuild(seed,theme){
  seed=String(seed==null||seed===''?'xray-01':seed);
  theme=theme||curTheme;
  var b=Struct.makeBuilding(seed,theme,{w:11,d:8},2);
  var errs=Struct.validate(b);
  if(errs.length)console.warn('struct validate: '+errs.slice(0,6).join(' | '));
  var L=emitLayered(b), R=buildRoomMeshes(b);
  if(G)G.dispose();
  var bufs=[];
  function keep(o){bufs.push(o.vb);bufs.push(o.ib);return o;}
  var shell={},lines={},nCol=0;
  ['frame','inner','outer'].forEach(function(k){
    shell[k]=keep(toGL(L.tri[k]));
    lines[k]=aabbLines(L.col[k].solids,false);
    bufs.push(lines[k].buf); nCol+=L.col[k].solids.length;
  });
  var rooms=keep(toGL(R.tri)); bufs.push(rooms.vb,rooms.ib);
  var roomLines=aabbLines(R.solids,true); bufs.push(roomLines.buf,roomLines.cbuf);
  var allSolids=[].concat(L.col.frame.solids,L.col.inner.solids,L.col.outer.solids);
  var collision=aabbLines(allSolids,false); bufs.push(collision.buf);
  building=b;curSeed=seed;curTheme=theme;
  G={shell:shell,lines:lines,rooms:rooms,roomLines:roomLines,collision:collision,
     collisionBoxes:nCol,roomCount:b.rooms.length,
     stats:{frame:{tris:shell.frame.tris,edges:lines.frame.count},
            inner:{tris:shell.inner.tris,edges:lines.inner.count},
            outer:{tris:shell.outer.tris,edges:lines.outer.count},
            rooms:{tris:rooms.tris,edges:roomLines.count},
            collision:{boxes:nCol}},
     dispose:function(){bufs.forEach(function(x){gl.deleteBuffer(x);});}};
  buildLabels(b);
  syncChips();updateReadout();updatePeelLabel();
}

/* ---------------- UI ---------------- */
var labelsBox=document.getElementById('labels');
function buildLabels(b){
  labelsBox.innerHTML='';labelDivs=[];
  b.rooms.forEach(function(r){
    var el=document.createElement('div');
    el.className='rlab';
    var css=ROOM_CSS[r.type]||'#ccd';
    el.style.color=css;el.style.borderColor=css;
    el.textContent=r.type.toUpperCase()+((r.y0||0)>0?' · L2':'');
    labelsBox.appendChild(el);
    labelDivs.push({el:el,room:r});
  });
}
function updateLabels(m){
  var show=LAYERS.rooms.on,py=peelHeight();
  var rect=cv.getBoundingClientRect();
  labelDivs.forEach(function(o){
    var r=o.room,vis=show&&(r.y0||0)+Struct.WALL_H<=py+0.01;
    if(!vis){o.el.style.display='none';return;}
    var p=project(m,r.rect.x+r.rect.w/2,(r.y0||0)+Struct.WALL_H+0.2,r.rect.z+r.rect.d/2);
    if(!p||p[2]>1||p[2]<-1){o.el.style.display='none';return;}
    o.el.style.display='block';
    o.el.style.left=((p[0]*0.5+0.5)*rect.width)+'px';
    o.el.style.top=((-p[1]*0.5+0.5)*rect.height)+'px';
  });
}
function updateReadout(){
  if(!building)return;
  var a=Struct.emitCollision(building).length;
  document.getElementById('readout').innerHTML=
    '<b>'+building.walls.length+'</b> WALLS · <b>'+building.rooms.length+'</b> ROOMS · <b>'+a+'</b> AABB'+
    '<span class="dim">SEED '+esc(curSeed)+' · '+curTheme.toUpperCase()+'</span>';
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function syncChips(){
  document.querySelectorAll('#layerRow .chip').forEach(function(el){
    el.classList.toggle('on',!!LAYERS[el.dataset.layer].on);
  });
  document.querySelectorAll('#themeRow .chip').forEach(function(el){
    el.classList.toggle('on',el.dataset.theme===curTheme);
  });
}
function updatePeelLabel(){
  var t=peelVal>=2?'FULL':(peelVal<=0?'SLAB':'STORY '+peelVal);
  document.getElementById('peelVal').textContent=peelVal+'/2 · '+t;
}
document.querySelectorAll('#layerRow .chip').forEach(function(el){
  el.addEventListener('click',function(){
    var k=el.dataset.layer;LAYERS[k].on=!LAYERS[k].on;syncChips();
  });
});
document.querySelectorAll('#themeRow .chip').forEach(function(el){
  el.addEventListener('click',function(){rebuild(curSeed,el.dataset.theme);});
});
var seedIn=document.getElementById('seedIn');
function applySeed(){rebuild(seedIn.value,curTheme);}
seedIn.addEventListener('keydown',function(e){if(e.key==='Enter'){applySeed();seedIn.blur();}});
document.getElementById('dice').addEventListener('click',function(){
  var s='s'+Math.random().toString(36).slice(2,8);
  seedIn.value=s;rebuild(s,curTheme);
});
var peelEl=document.getElementById('peel');
peelEl.addEventListener('input',function(){peelVal=parseInt(peelEl.value,10);updatePeelLabel();});

/* ---------------- interaction ---------------- */
var pointers=new Map(),dragMoved=0,pinchD=0;
cv.addEventListener('pointerdown',function(e){
  pointers.set(e.pointerId,[e.clientX,e.clientY]);
  dragMoved=0;autoRot=false;
  if(pointers.size===2){var p=[...pointers.values()];
    pinchD=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);}
  try{cv.setPointerCapture(e.pointerId);}catch(err){}
});
cv.addEventListener('pointermove',function(e){
  if(!pointers.has(e.pointerId))return;
  var prev=pointers.get(e.pointerId);
  var dx=e.clientX-prev[0],dy=e.clientY-prev[1];
  dragMoved+=Math.abs(dx)+Math.abs(dy);
  pointers.set(e.pointerId,[e.clientX,e.clientY]);
  if(pointers.size===1){
    yaw-=dx*0.0075;
    pitch=Math.min(1.35,Math.max(0.12,pitch+dy*0.0075));
  }else if(pointers.size===2){
    var p=[...pointers.values()];
    var d=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);
    if(pinchD>0)radius=Math.min(70,Math.max(9,radius*pinchD/Math.max(d,1)));
    pinchD=d;
  }
});
function endPointer(e){pointers.delete(e.pointerId);if(pointers.size<2)pinchD=0;}
cv.addEventListener('pointerup',endPointer);
cv.addEventListener('pointercancel',endPointer);
cv.addEventListener('wheel',function(e){
  radius=Math.min(70,Math.max(9,radius*(1+Math.sign(e.deltaY)*0.09)));
  autoRot=false;
},{passive:true});

/* ---------------- frame ---------------- */
var lastPasses=[];
function resize(){
  var dpr=Math.min(window.devicePixelRatio||1,2);
  var w=Math.floor(cv.clientWidth*dpr),h=Math.floor(cv.clientHeight*dpr);
  if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;gl.viewport(0,0,w,h);}
}
function drawGrid(m){
  gl.useProgram(pGrid);
  gl.depthMask(true);gl.disable(gl.BLEND);
  var loc=gl.getAttribLocation(pGrid,'p');
  gl.bindBuffer(gl.ARRAY_BUFFER,gridBuf.vb);
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc,3,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,gridBuf.ib);
  gl.uniformMatrix4fv(uGrid.uMVP,false,m);
  gl.drawElements(gl.TRIANGLES,6,gl.UNSIGNED_SHORT,0);
}
function render(){
  resize();
  var vp=viewProj(),m=vp.m,eye=vp.eye,py=peelHeight();
  lastPasses=[];
  gl.clearColor(0.016,0.024,0.039,1);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);
  drawGrid(m);lastPasses.push('grid');
  if(!G){updateLabels(m);return;}
  var i;
  /* room volumes */
  if(LAYERS.rooms.on){
    gl.useProgram(pRoom);
    gl.depthMask(false);gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
    bindMesh(pRoom,G.rooms,[['aPos',0,3],['aNorm',3,3],['aCol',6,3]]);
    gl.uniformMatrix4fv(uRoom.uMVP,false,m);
    gl.uniform3fv(uRoom.uCam,eye);
    gl.uniform1f(uRoom.uPeelY,py);
    if(G.rooms.count>0)gl.drawElements(gl.TRIANGLES,G.rooms.count,G.rooms.type,0);
    lastPasses.push('rooms');
    gl.useProgram(pRLine);
    gl.blendFunc(gl.SRC_ALPHA,gl.ONE);
    gl.disable(gl.DEPTH_TEST);
    bindLines(pRLine,G.roomLines,[['aPos',0,3],['aCol',3,3]]);
    gl.uniformMatrix4fv(uRLine.uMVP,false,m);
    gl.uniform1f(uRLine.uAlpha,0.75);
    gl.uniform1f(uRLine.uPeelY,py);
    if(G.roomLines.count>0)gl.drawArrays(gl.LINES,0,G.roomLines.count);
    gl.enable(gl.DEPTH_TEST);
    lastPasses.push('room-lines');
  }
  /* shell layers */
  ['frame','inner','outer'].forEach(function(name){
    var L=LAYERS[name],g=G.shell[name],ln=G.lines[name];
    if(!L.on)return;
    gl.useProgram(pShell);
    gl.enable(gl.DEPTH_TEST);
    gl.depthMask(false);gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
    bindMesh(pShell,g,[['aPos',0,3],['aNorm',3,3]]);
    gl.uniformMatrix4fv(uShell.uMVP,false,m);
    gl.uniform3fv(uShell.uCam,eye);
    gl.uniform3fv(uShell.uTint,L.tint);
    gl.uniform1f(uShell.uAlpha,L.alpha);
    gl.uniform1f(uShell.uPeelY,py);
    if(g.count>0)gl.drawElements(gl.TRIANGLES,g.count,g.type,0);
    lastPasses.push(name);
    gl.useProgram(pLine);
    gl.blendFunc(gl.SRC_ALPHA,gl.ONE);
    gl.disable(gl.DEPTH_TEST);
    bindLines(pLine,ln,[['aPos',0,3]]);
    gl.uniformMatrix4fv(uLine.uMVP,false,m);
    gl.uniform3fv(uLine.uColor,L.line);
    gl.uniform1f(uLine.uAlpha,0.85);
    gl.uniform1f(uLine.uPeelY,py);
    if(ln.count>0)gl.drawArrays(gl.LINES,0,ln.count);
    gl.enable(gl.DEPTH_TEST);
    lastPasses.push(name+'-lines');
  });
  /* collision wireframes */
  if(LAYERS.collision.on){
    gl.useProgram(pLine);
    gl.depthMask(false);gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA,gl.ONE);
    gl.disable(gl.DEPTH_TEST);
    bindLines(pLine,G.collision,[['aPos',0,3]]);
    gl.uniformMatrix4fv(uLine.uMVP,false,m);
    gl.uniform3fv(uLine.uColor,[1.0,0.28,0.28]);
    gl.uniform1f(uLine.uAlpha,0.45);
    gl.uniform1f(uLine.uPeelY,py);
    if(G.collision.count>0)gl.drawArrays(gl.LINES,0,G.collision.count);
    gl.enable(gl.DEPTH_TEST);
    lastPasses.push('collision');
  }
  gl.depthMask(true);gl.disable(gl.BLEND);
  updateLabels(m);
}

(function frame(t){
  requestAnimationFrame(frame);
  var dt=Math.min(0.05,(t-lastT)/1000||0.016);lastT=t;
  if(autoRot&&pointers.size===0)yaw+=dt*0.06;
  render();
})(lastT);

  setLayer:function(n,on){LAYERS[n].on=!!on;syncChips();},
  setPeel:function(v){peelVal=v;peelEl.value=v;updatePeelLabel();},
  reseed:function(s){var ns=s||('s'+Math.random().toString(36).slice(2,8));
    seedIn.value=ns;rebuild(ns,curTheme);return ns;},
  setTheme:function(t){rebuild(curSeed,t);},
  activePasses:function(){return lastPasses.slice();},
  stats:function(){return G?G.stats:null;},
  building:function(){return building?{walls:building.walls.length,rooms:building.rooms.length,
    aabbs:Struct.emitCollision(building).length,drawnAabbs:G.collisionBoxes,
    seed:curSeed,theme:curTheme}:null;},
  cam:function(){return {yaw:yaw,pitch:pitch,radius:radius};}
};
})();
