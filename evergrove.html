<head>

<title>EVERGROVE — the happiness cultivator</title>
<style>
:root{--bg:#0a0e08;--ink:#eee7cf;--mut:#a9a07f;--grn:#9fd08a;--gold:#e8c33d;--card:#12160e;--line:#2e3a22}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif}
.top{position:sticky;top:0;z-index:5;background:rgba(10,14,8,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.brand{font-size:18px;letter-spacing:.22em;color:var(--grn);margin-right:4px}
.sub{font-size:11px;color:var(--mut);letter-spacing:.12em;margin-right:6px}
.seedchip{font-family:monospace;font-size:12px;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;background:var(--card)}
.seedchip:hover{color:var(--grn);border-color:var(--grn)}
button.act{background:var(--grn);border:0;color:#101408;font-weight:700;border-radius:999px;padding:8px 18px;font-size:14px;cursor:pointer;font-family:inherit}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:8px 16px;font-size:14px;cursor:pointer;font-family:inherit}
button.ghost:hover{color:var(--grn);border-color:var(--grn)}
button.ghost.on{color:#101408;background:var(--grn);border-color:var(--grn)}
.locks{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mut);flex-wrap:wrap}
.wrap{max-width:700px;margin:0 auto;padding:30px 20px 90px}
.mvmt{margin:0 0 8px}
.mvmt .num{font-size:12px;letter-spacing:.35em;color:var(--grn);margin:30px 0 4px}
.mvmt .mtitle{font-size:15px;color:var(--mut);font-style:italic;margin:0 0 12px}
.mvmt p{font-size:18.5px;line-height:1.75;margin:0 0 1em}
.mvmt:first-child .num{margin-top:0}
.mvmt p:first-of-type::first-letter{font-size:2.6em;float:left;line-height:.9;padding:2px 8px 0 0;color:var(--grn)}
.custom{display:none;gap:8px;flex-wrap:wrap;margin:6px 0}
.custom.open{display:flex}
.custom select{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-family:inherit;font-size:13.5px;max-width:320px}
.bp{margin-top:34px;border:1px solid var(--line);border-radius:16px;background:var(--card);padding:22px 22px 18px}
.bp h3{margin:0 0 4px;font-size:20px;color:var(--grn);letter-spacing:.02em}
.bp .bprecap{color:var(--mut);font-style:italic;font-size:14.5px;margin:0 0 16px}
.bp h5{margin:18px 0 6px;font-size:12px;letter-spacing:.25em;color:var(--gold);font-weight:400}
.bp p,.bp li{font-size:15.5px;line-height:1.7}
.bp ul{margin:6px 0;padding-left:20px}
.bp li{margin-bottom:6px}
.bp .nonob{color:var(--grn);font-weight:700}
.bp .why{color:var(--mut);font-size:14px}
.saved{margin-top:26px;border-top:1px solid var(--line);padding-top:14px}
.saved h4{font-size:12px;letter-spacing:.25em;color:var(--mut);margin:0 0 10px;font-weight:400}
.srow{display:flex;gap:8px;align-items:center;margin:8px 0;font-size:14px}
.srow .ttl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);cursor:pointer}
.srow .ttl:hover{color:var(--grn)}
.srow code{font-family:monospace;font-size:11.5px;color:var(--gold)}
.srow button{background:none;border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:2px 10px;cursor:pointer;font-size:12px;font-family:inherit}
.srow button:hover{color:var(--grn);border-color:var(--grn)}
.hintline{color:var(--mut);font-size:13.5px;font-style:italic;margin:18px 0 0}
@media(max-width:560px){.mvmt p{font-size:17px}.brand{font-size:15px}}
</style>
</head>

micro: [

],

"you laugh once, quietly, at nothing \u2014 the laugh of someone who has been given something",

<script>
'use strict';
/* ---------- seeded RNG ---------- */
function xmur3(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return (h^=h>>>16)>>>0;};}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function pickN(rng,arr,n,used,tag){const pool=arr.map((_,i)=>i).filter(i=>!used.has(tag+':'+i));const out=[];for(let k=0;k<n&&pool.length;k++){const j=Math.floor(rng()*pool.length);const idx=pool.splice(j,1)[0];used.add(tag+':'+idx);out.push(arr[idx]);}return out;}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
const ROMAN=['I','II','III','IV','V','VI'];
const MTITLES=['arrival','settling in','the living scene','close noticing','the deep hour','staying'];

/* ---------- movement frames (prose; atoms fill the {slots}) ---------- */
const FRAMES=[
[ /* 1 arrival — place, time, light0, sky */
 p=>`You come to ${p.place} ${p.time}. For a moment you just stand at the edge of it, taking it all in \u2014 and then the taking-it-in stops being a choice, because ${p.light0}.\n\nOverhead, ${p.sky}. You take one breath, then another, and feel the particular unclenching that happens when a good hour turns out to be real.`,
 p=>`This is the place: ${p.place}. The time is ${p.time}. You arrive the way you arrive at all the best things \u2014 slightly out of breath, slightly late, and exactly on time.\n\n${cap(p.light0)}. Above you, ${p.sky} \u2014 and you understand, suddenly, that you will remember this hour for the rest of your life.`,
 p=>`${cap(p.time)} \u2014 and here: ${p.place}. You stop walking the way you stop talking when someone says something true.\n\n${cap(p.light0)}. ${cap(p.sky)}, and the sky seems to be showing off just for you, which is ridiculous, and you don't care.`
],
[ /* 2 settling in — air, tex0, ground */
 p=>`${cap(p.air)}. You let your shoulders down; you hadn't realized they were up.\n\nUnder your hand, before you've decided to touch it: ${p.tex0}. Under your feet: ${p.ground}. Some things you touch the way you touch museum pieces when no one is looking \u2014 and some things you touch because they ask.`,
 p=>`Your body takes a minute to catch up with where you are. ${cap(p.air)}.\n\nYou find a place to stand that feels like it was waiting. What meets your hand there is exactly as it should be: ${p.tex0} \u2014 present, honest, beautiful without trying. Beneath you, ${p.ground}, holding you like it means it.`,
 p=>`${cap(p.air)}. Breath comes easier here, as if the air had been expecting you.\n\nYou lean, lightly, into ${p.tex0}, and feel the day stored in it coming back out into your palm. The ground under you, ${p.ground} \u2014 you shift your weight and feel completely, simply, wonderfully supported.`
],
[ /* 3 the living scene — per0, per1, vista, light1 */
 p=>`Then you look around \u2014 really look \u2014 and the place is alive with it. ${cap(p.per0)}. A little further on, ${p.per1}.\n\n${cap(p.vista)}. ${cap(p.light1)} \u2014 and the whole scene seems lit from within, like something remembering being made.`,
 p=>`The people make it. ${cap(p.per0)} \u2014 you watch for a full minute, grinning like a fool. ${cap(p.per1)}, and you realize you are part of the scene now, not just watching it.\n\n${cap(p.vista)}. ${cap(p.light1)}.`,
 p=>`This is not a place that sits still for you. ${cap(p.per0)}. ${cap(p.per1)} \u2014 and somewhere in the middle of watching, you stop being a visitor.\n\n${cap(p.vista)}. ${cap(p.light1)}, and you feel the particular warmth of being exactly where the good thing is happening.`
],
[ /* 4 close noticing — micro x4, craft0, tex1 */
 p=>`The big thing is almost too much, so your eyes do what eyes do: they go small. ${cap(p.micro0)}. ${cap(p.micro1)}.\n\nAnd then \u2014 ${p.craft0} \u2014 you stop breathing for a second, because somebody's hands made that, and they cared. ${cap(p.tex1)} nearby, as if the place were showing off its jewelry, and you let it.`,
 p=>`You crouch without deciding to. ${cap(p.micro0)}. A little further on, ${p.micro2}.\n\nAnd here is the thing that undoes you: ${p.craft0}. Not grand. Just true. ${cap(p.micro3)} \u2014 you lean closer, and closer still, until your nose nearly touches it.`,
 p=>`Down at the level of small things, the place is even more itself. ${cap(p.micro1)}. ${cap(p.micro3)}.\n\n${cap(p.craft0)} \u2014 the kind of care you can feel in your chest like a hand. You find ${p.tex1} and hold it for a long time, the way you hold a face you love.`
],
[ /* 5 the deep hour — snd x5, sml x2, light2, feel4, feel6, money */
 p=>`Time does something strange then. It stops passing and starts pooling. ${cap(p.snd0)}; ${p.snd1}.\n\n${cap(p.sml0)}, and underneath it, ${p.sml1}. ${cap(p.feel4)}.\n\nAnd here is the quiet money in it: ${p.money_t} \u2014 ${p.money_how}. Nobody here is getting rich. Everybody here is getting something better than rich: a good hour that pays for the next good hour.`,
 p=>`Has it been an hour? Has it been ten minutes? ${cap(p.snd2)}. The light has shifted \u2014 ${p.light2} \u2014 and the shift feels like the place turning a page just for you.\n\n${cap(p.snd4)}. ${cap(p.sml0)}. ${cap(p.feel4)} \u2014 and you realize you have been smiling for some time without knowing it.\n\nThe money side is simple and honest: ${p.money_t} \u2014 ${p.money_how}.`,
 p=>`The senses stop taking turns and start arriving together: ${p.snd1} over ${p.sml0}, ${p.sml1} underneath everything like a bass note.\n\n${cap(p.light2)}. ${cap(p.feel4)} ${cap(p.feel6)}.\n\nSomeone has figured out the economics of joy here: ${p.money_t} \u2014 ${p.money_how}. The good hour funds itself, and that is why it keeps happening.`
],
[ /* 6 staying — feel5, snd3 */
 p=>`You don't leave. That's the whole of it \u2014 you don't leave, not yet, maybe not for a long while.\n\n${cap(p.feel5)}. The place keeps being itself, generous and unbothered, and you are lucky enough to be standing in it. ${cap(p.snd3)}, far off, like a door closing gently on the ordinary world.`,
 p=>`Later you will try to describe this and fail in the particular way people fail at describing the best things.\n\nFor now there is only this: ${p.feel5}, and the knowledge, quiet as stone, that you were here. You stay.`,
 p=>`Eventually the light will change and the hour will end, the way all hours end. But not yet.\n\n${cap(p.snd3)}. ${cap(p.feel5)}. And you stay a little longer, and then a little longer than that.`
]
];

const WHYS={
move:"this situation runs on gentle movement, and it answers it in the body, not in words",
cozy:"this situation lives or dies on warmth, and it carries warmth the way a good coat does",
nature:"this situation needs living green things around it, and it grows them",
rain:"rain is half the show here, and it makes rain feel like weather worth watching",
hands:"someone's hands have to make this real, and it puts tools in those hands",
money:"this situation has to pay for itself, and it gives the money side a home",
make:"this situation is built, not bought, and it is built for building",
joy:"the whole point here is delight, and it is engineered for exactly that",
play:"this situation only works if people feel silly and safe, and it keeps the silliness coming",
home:"this is someone's place, someone's corner, and it treats it like sacred ground",
interior:"the room itself is the experience, and it knows how to make a room sing",
water:"water is the ritual here, and it honors water",
beauty:"this situation has to be beautiful to work, and beauty is its native language",
light:"light does half the emotional work here, and it paints with light",
share:"this situation only matters if other people see it, and it puts it in front of people",
growth:"this compounds \u2014 a streak, a season, a shelf of seedlings \u2014 and it is built to compound",
explore:"people have to find their way in, and it makes finding your way feel like play",
create:"someone here becomes a maker, and it hands them the first honest tool",
library:"nothing good should get lost, and it remembers everything",
sound:"the soundscape is the atmosphere here, and it scores it",
art:"this situation is someone's artwork, and it treats it like one",
place:"the place is the product, and it builds places worth standing in",
ease:"this has to be easy or nobody comes, and it removes every hoop",
own:"someone needs to own a piece of this, and it gives them ground to stand on"
};

function picks(seedStr, locks){
  const rng=mulberry32(xmur3(seedStr)());
  const I=EVG_INTENT, used=new Set();
  const one=(k)=>pickN(rng,I[k],1,used,k)[0];
  const p={};
  /* situation first — everything hangs off it */
  const sit = locks.sit || one('situations');
  p.sitTitle=sit.t; p.place=sit.place; p.vista=sit.vista; p._sit=sit;
  const nd = locks.need || I.needs[sit.n];
  p.needTitle=nd.t; p.needFlip=nd.flip; p.needTags=nd.tags.slice(); p._nd=nd;
  /* money situation keyed to the need's tags */
  const mpool=I.money.map((m,i)=>({m,i,s:m.tags.filter(t=>nd.tags.includes(t)).length}))
    .sort((a,b)=>b.s-a.s||a.i-b.i);
  const mj=mpool[Math.floor(rng()*Math.min(3,mpool.length))].m;
  p.money_t=mj.t.charAt(0).toLowerCase()+mj.t.slice(1); p.money_how=mj.how;
  /* atoms in fixed order */
  const tm = one('times');
  p.time=tm.t; p.period=tm.p; p._tm=tm;
  p.sky=one('sky'); p.ground=one('ground');
  const lsrc=I.light.filter(l=>l.ps.includes(tm.p));
  const lpool=(lsrc.length>=3?lsrc:I.light);
  const lused=new Set();
  const lpick=()=>{const pool=lpool.map((_,i)=>i).filter(i=>!lused.has(i));
    const j=Math.floor(rng()*pool.length);const idx=pool.splice(j,1)[0];
    lused.add(idx);return lpool[idx].t;};
  p.light0=lpick(); p.light1=lpick(); p.light2=lpick();
  const tex=pickN(rng,I.textures,2,used,'textures'); p.tex0=tex[0]; p.tex1=tex[1];
  p.air=one('air');
  const snd=pickN(rng,I.sounds,5,used,'sounds'); p.snd0=snd[0];p.snd1=snd[1];p.snd2=snd[2];p.snd3=snd[3];p.snd4=snd[4];
  const sml=pickN(rng,I.smells,2,used,'smells'); p.sml0=sml[0];p.sml1=sml[1];
  const per=pickN(rng,I.people,2,used,'people'); p.per0=per[0];p.per1=per[1];
  const mic=pickN(rng,I.micro,4,used,'micro'); p.micro0=mic[0];p.micro1=mic[1];p.micro2=mic[2];p.micro3=mic[3];
  p.craft0=one('craft');
  const fl=pickN(rng,I.feelings,7,used,'feelings'); p.feel4=fl[4];p.feel5=fl[5];p.feel6=fl[6];
  p.fi=Math.floor(rng()*FRAMES[0].length);
  /* capabilities: top 2 by tag overlap, then one non-obvious pick */
  const scored=I.caps.map(c=>({c,s:c.tags.filter(t=>nd.tags.includes(t)).length}))
    .sort((a,b)=>b.s-a.s||(a.c.k<b.c.k?-1:1));
  const chosen=[scored[0].c,scored[1].c];
  const quietPool=scored.filter(e=>!chosen.includes(e.c)&&e.s>0);
  const nonob=quietPool.length?quietPool[Math.floor(rng()*quietPool.length)].c:scored[2].c;
  chosen.push(nonob);
  p.caps=chosen.map((c,idx)=>{
    const ov=c.tags.find(t=>nd.tags.includes(t));
    return {k:c.k,label:c.label,plain:c.plain,obvious:idx<2,
      why:WHYS[ov]||"it fits the shape of this situation like a hand in a glove"};
  });
  p.everIx=Math.floor(rng()*3);
  return p;
}

/* ---------- blueprint emitter ---------- */
const EVER_T=[
(s,m)=>`Every time someone walks back into \u201c${s}\u201d, it pays twice: once in the good hour itself, and once in the habit it builds. ${m} grows by word of mouth, not by advertising \u2014 one person brings a friend, the friend brings a neighbor. Seasons change the scene without changing its soul, so it never goes stale. And the money side compounds too: a regular crowd, a saved seed, a shelf of things made here \u2014 each visit makes the next visit richer.`,
(s,m)=>`\u201c${s}\u201d is built to be revisited, not consumed. People come back because it gets better: the streak grows, the regulars become friends, the place accumulates small improvements like a garden accumulates seasons. ${m} is the same \u2014 it doesn't spike and fade, it deepens. A year from now this is still giving, and giving more than it does today.`,
(s,m)=>`The evergreen secret of \u201c${s}\u201d is that it is a practice, not an event. Practices compound: the tenth visit is richer than the first, the hundredth richer still. ${m} rides the same curve \u2014 regulars, rituals, and things made here keep paying long after the novelty would have worn off. It is built around the evergreen, not around the launch.`
];
const ACCEPT=[
"Read the scene aloud to a stranger. They can picture exactly where to stand and what they would hear.",
"Open the same seed on two different days, on two different screens: the same words, the same blueprint, every time.",
"Name the three capabilities out loud and point to where each one shows up in the scene \u2014 no capability may be decoration.",
"The money line is real: a real person could do it this week, with things they already have.",
"The scene makes someone want to go, and the blueprint makes someone know how to build it."
];

function emitBlueprint(p){
  const obj=[
    {h:"The need it answers",t:p.needFlip},
    {h:"The happiness it grows",t:`\u201c${p.sitTitle}\u201d \u2014 a detailed, specific good hour: ${p.place}.`},
    {h:"The money it can make",t:`${cap(p.money_t)}: ${p.money_how}.`}
  ];
  const ever=EVER_T[p.everIx](p.sitTitle,cap(p.money_t));
  const acc=ACCEPT.slice();
  return {title:p.sitTitle, recap:p.needTitle+" \u00b7 "+p.time, obj, caps:p.caps, ever, acc};
}

function compose(seedStr, locks){
  const p=picks(seedStr, locks);
  const fi=p.fi;
  const html=FRAMES.map((variants,mi)=>{
    const text=variants[fi](p);
    const paras=text.split(/\n\n/).filter(s=>s.trim().length>0);
    return `<div class="mvmt"><div class="num">${ROMAN[mi]}</div><div class="mtitle">${MTITLES[mi]}</div>`+
      paras.map(t=>`<p>${t.trim()}</p>`).join('')+`</div>`;
  }).join('');
  const bp=emitBlueprint(p);
  const bpText=["EVERGROVE BLUEPRINT \u2014 "+bp.title, bp.recap,"",
    "OBJECTIVES:"].concat(bp.obj.map(o=>"\u00b7 "+o.h+": "+o.t)).concat(["",
    "CAPABILITIES LEVERAGED:"]).concat(bp.caps.map(c=>
    "\u00b7 "+c.label+" ("+c.k+") \u2014 "+c.plain+". Why: "+c.why+(c.obvious?"":" [not the obvious pick]"))).concat(["",
    "EVERGREEN VALUE:", bp.ever,"",
    "ACCEPTANCE CRITERIA:"]).concat(bp.acc.map((a,i)=>(i+1)+". "+a)).join("\n");
  return {html, bp, bpText,
    words: html.replace(/<[^>]+>/g,' ').split(/\s+/).filter(Boolean).length};
}
</script>
<script>
'use strict';
/* ---------- app state ---------- */
const S={seed:'',locks:{sit:null,need:null}};
const $=(id)=>document.getElementById(id);
function randSeed(){return Math.random().toString(36).slice(2,8);}
/* guarded storage — blob: iframes throw on raw localStorage, so never touch it raw */
const mem={};
function storeGet(k){try{return localStorage.getItem(k);}catch(e){return mem[k]||null;}}
function storeSet(k,v){try{localStorage.setItem(k,v);}catch(e){mem[k]=v;}}
function getLib(){try{return JSON.parse(storeGet('evergrove_blueprints')||'[]');}catch(e){return[];}}
function setLib(a){storeSet('evergrove_blueprints',JSON.stringify(a));}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function renderBp(bp){
  $('bpTitle').textContent=bp.title;
  $('bpRecap').textContent=bp.recap;
  $('bpObj').innerHTML=bp.obj.map(o=>`<li><b>${esc(o.h)}:</b> ${esc(o.t)}</li>`).join('');
  $('bpCaps').innerHTML=bp.caps.map(c=>`<li><b>${esc(c.label)}</b> <span class="why">(${esc(c.k)}) \u2014 ${esc(c.plain)}</span><br><span class="why">Why: ${esc(c.why)}${c.obvious?'':' <span class="nonob">\u2014 not the obvious pick, which is exactly the point.</span>'}</span></li>`).join('');
  $('bpEver').textContent=bp.ever;
  $('bpAcc').innerHTML=bp.acc.map(a=>`<li>${esc(a)}</li>`).join('');
}
function render(){
  const r=compose(S.seed,S.locks);
  $('situation').innerHTML=r.html;
  renderBp(r.bp);
  $('seedChip').textContent='seed '+S.seed;
  document.title='EVERGROVE \u00b7 '+S.seed;
  try{history.replaceState(null,'','?seed='+encodeURIComponent(S.seed));}catch(e){}
  S.cur=r; S.words=r.words;
}
function newSituation(keepLocks){
  if(!keepLocks) S.locks={sit:null,need:null};
  S.seed=randSeed(); syncLockBtns(); render();
}
function syncLockBtns(){
  $('lockSit').classList.toggle('on',!!S.locks.sit);
  $('lockNeed').classList.toggle('on',!!S.locks.need);
}
function currentAtoms(){
  const p=picks(S.seed,S.locks);
  return {sit:p._sit,need:p._nd};
}
function toggleLock(kind){
  if(S.locks[kind]){ S.locks[kind]=null; }
  else{ const a=currentAtoms(); S.locks[kind]=a[kind]; }
  syncLockBtns(); render();
}
/* customize */
function fillCustom(){
  $('selNeed').innerHTML=EVG_INTENT.needs.map((n,i)=>`<option value="${i}">${esc(n.t)}</option>`).join('');
  $('selSit').innerHTML=EVG_INTENT.situations.map((s,i)=>`<option value="${i}">${esc(s.t)}</option>`).join('');
}
/* blueprint library */
function renderLib(){
  const a=getLib(), box=$('savedBox'), list=$('savedList');
  box.style.display=a.length?'block':'none';
  list.innerHTML=a.map((b,i)=>`<div class="srow"><span class="ttl" data-l="${i}">${esc(b.title)}</span><code>${esc(b.seed)}</code><button data-c="${i}">copy</button><button data-d="${i}">forget</button></div>`).join('');
  list.querySelectorAll('[data-l]').forEach(el=>el.onclick=()=>{const b=getLib()[+el.dataset.l];if(!b)return;S.seed=b.seed;S.locks={sit:null,need:null};syncLockBtns();render();window.scrollTo(0,0);});
  list.querySelectorAll('[data-c]').forEach(el=>el.onclick=()=>{const b=getLib()[+el.dataset.c];if(!b)return;copyText(b.bpText,el);});
  list.querySelectorAll('[data-d]').forEach(el=>el.onclick=()=>{const a=getLib();a.splice(+el.dataset.d,1);setLib(a);renderLib();});
}
function copyText(t,btn){
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{
    const old=btn.textContent;btn.textContent='copied \u2713';setTimeout(()=>{btn.textContent=old;},1200);
  }).catch(()=>{prompt('Copy:',t.slice(0,2000));});
}
/* wire */
$('btnNew').onclick=()=>newSituation(true);
$('seedChip').onclick=()=>{const u=location.origin+location.pathname+'?seed='+encodeURIComponent(S.seed);copyText(u,$('seedChip'));};
$('btnCopy').onclick=()=>copyText($('situation').innerText,$('btnCopy'));
$('btnCopyBp').onclick=()=>copyText(S.cur?S.cur.bpText:'',$('btnCopyBp'));
$('btnKeep').onclick=()=>{
  const a=getLib();
  if(!a.some(b=>b.seed===S.seed)){
    a.unshift({seed:S.seed,title:S.cur.bp.title,bpText:S.cur.bpText,savedAt:new Date().toISOString()});
    setLib(a.slice(0,60));
  }
  renderLib();
  $('btnKeep').textContent='kept \u2713';setTimeout(()=>{$('btnKeep').textContent='Keep';},1200);
};
$('lockSit').onclick=()=>toggleLock('sit');
$('lockNeed').onclick=()=>toggleLock('need');
$('btnCustom').onclick=()=>{$('customRow').classList.toggle('open');$('btnCustom').classList.toggle('on');};
$('btnApplyCustom').onclick=()=>{
  S.locks.need=EVG_INTENT.needs[+$('selNeed').value];
  S.locks.sit=EVG_INTENT.situations[+$('selSit').value];
  S.seed=randSeed();syncLockBtns();render();window.scrollTo(0,0);
};
/* init */
(function init(){
  fillCustom(); renderLib();
  let seed=null;
  try{seed=new URLSearchParams(location.search).get('seed');}catch(e){}
  S.seed=(seed&&/^[a-z0-9]{3,12}$/i.test(seed))?seed:randSeed();
  render();
})();
/* debug surface */
window.__evg={compose,picks,seed:()=>S.seed,locks:()=>({sit:!!S.locks.sit,need:!!S.locks.need}),words:()=>S.words||0,lib:getLib};
</script>
</body>
