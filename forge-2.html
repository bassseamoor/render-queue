/* ============================================================
   FORGE editor/engine.js — the app engine (no DOM opinions)
   ------------------------------------------------------------
   Owns the scene document, the registry, rendering, remix,
   history, recipes, and draw state. Views (create/edit/build)
   call into this; it emits events they subscribe to.
   ============================================================ */


const LSKEY = 'forge-recipes-v2';

class ForgeApp extends Emitter {
  constructor() {
    super();
    this.registry = new PluginRegistry();
    registerBuiltins(this.registry);
    this.palettes = PALETTES;
    this.world = new WorldBus();
    this.profiler = new Profiler();
    this.history = new History(50);
    this.scene = null;
    this.sel = null;               // selected layer id
    this.mode = 'create';          // create | edit | build
    this.buildTab = 'graph';
    this.disabledPasses = new Set();
    this.brush = { color: '#ffffff', width: 8, opacity: 0.9 };
    this.drawing = false;
    this._renderT = null;
    this.lastReport = null;
  }

  /* ---------------- scene lifecycle ---------------- */

  newScene(seed, aspect) {
    const s = seed != null ? seed : randSeed();
    const scene = createScene({ seed: s, aspect: aspect || (this.scene ? this.scene.canvas.aspect : '1:1') });
    scene.layers = this.composeLayers(s);
    // ensure one strokes layer exists for draw mode
    scene.layers.push(makeLayer(this.registry.get('strokes'), 1, { strokes: [] }));
    this.setScene(scene, 'new picture');
    return scene;
  }

  setScene(scene, why) {
    const errors = [];
    this.scene = scene;
    this.sel = scene.layers[0] ? scene.layers[0].id : null;
    this.history.reset(scene);
    this.emit('scene', { why: why || 'set' });
    this.render();
  }

  loadSceneDoc(doc) {
    const { scene, warnings } = parseScene(doc);
    if (!scene) return { ok: false, warnings };
    // resolve pass from plugin def where missing; drop unknown plugins
    const kept = [];
    for (const l of scene.layers) {
      const p = this.registry.get(l.plugin);
      if (!p) { warnings.push('Unknown plugin skipped: ' + l.plugin); continue; }
      if (!l.pass) l.pass = p.pass;
      l.params = validateParams(p.schema, l.params);
      kept.push(l);
    }
    scene.layers = kept;
    if (!this.registry.get('strokes') || !kept.some(l => l.plugin === 'strokes')) {
      kept.push(makeLayer(this.registry.get('strokes'), 1, { strokes: [] }));
    }
    this.setScene(scene, 'load');
    return { ok: true, warnings };
  }

  /* Weighted random composition of plugin layers. */
  composeLayers(masterSeed) {
    const rng = new RNG(masterSeed, 'compose');
    const pool = [];
    for (const p of this.registry.list()) {
      const w = p.composeWeight || 0;
      for (let i = 0; i < w; i++) pool.push(p.id);
    }
    const chosen = new Set(['sky']);
    const n = rng.int(4, 7);
    let guard = 0;
    while (chosen.size < n && guard++ < 200) chosen.add(rng.pick(pool));
    const order = {};
    PASSES.forEach((p, i) => (order[p] = i));
    const ids = [...chosen].sort((a, b) => {
      const pa = this.registry.get(a), pb = this.registry.get(b);
      return (order[pa.pass] - order[pb.pass]) || (a < b ? -1 : 1);
    });
    return ids.map((id, i) => {
      const p = this.registry.get(id);
      const seed = rng.int(1, 1e9);
      const prng = new RNG(masterSeed, 'compose:' + id + ':' + seed);
      const params = validateParams(p.schema, p.defaults(prng));
      // random palette per layer
      for (const [k, f] of Object.entries(p.schema)) {
        if ((f.type === 'palette') || k === 'pal') params[k] = rng.int(0, this.palettes.length - 1);
      }
      return makeLayer(p, seed, params, { id: 'L' + (i + 1) + '_' + id });
    });
  }

  /* ---------------- remix ---------------- */
  remix() {
    const rng = new RNG(this.scene.seed, 'remix:' + Date.now() % 100000);
    let changed = false;
    for (const l of this.scene.layers) {
      if (l.locked || l.plugin === 'strokes') continue;
      changed = true;
      const p = this.registry.get(l.plugin);
      l.seed = rng.int(1, 1e9);
      const lrng = new RNG(this.scene.seed, l.id + ':' + l.seed + ':remix');
      if (typeof p.randomize === 'function') {
        l.params = validateParams(p.schema, p.randomize(lrng, l.params, this.world));
      } else {
        l.params = defaultRandomize(p.schema, l.params, lrng, this.palettes);
      }
    }
    if (!changed) return false;
    this.scene.seed = randSeed();
    this.commit('remix');
    return true;
  }

  rerollLayer(id) {
    const l = this.scene.layers.find(x => x.id === id);
    if (!l) return;
    const p = this.registry.get(l.plugin);
    l.seed = randSeed();
    const lrng = new RNG(this.scene.seed, l.id + ':' + l.seed + ':reroll');
    l.params = validateParams(p.schema, p.defaults(lrng));
    this.commit('re-roll ' + p.title);
  }

  addLayer(pluginId) {
    const p = this.registry.get(pluginId);
    if (!p) return null;
    const seed = randSeed();
    const lrng = new RNG(this.scene.seed, pluginId + ':' + seed);
    const params = validateParams(p.schema, p.defaults(lrng));
    const layer = makeLayer(p, seed, params);
    this.scene.layers.push(layer);
    // keep pass order tidy: strokes always last
    const order = {};
    PASSES.forEach((pp, i) => (order[pp] = i));
    this.scene.layers.sort((a, b) => (order[a.pass] - order[b.pass]) || 0);
    this.sel = layer.id;
    this.commit('add ' + p.title);
    return layer;
  }

  removeLayer(id) {
    this.scene.layers = this.scene.layers.filter(l => l.id !== id);
    if (this.sel === id) this.sel = this.scene.layers[0] ? this.scene.layers[0].id : null;
    this.commit('delete layer');
  }

  moveLayer(id, dir) {
    const ls = this.scene.layers;
    const i = ls.findIndex(l => l.id === id);
    const j = i + dir;
    if (i < 0 || j < 0 || j >= ls.length) return;
    [ls[i], ls[j]] = [ls[j], ls[i]];
    this.commit('reorder');
  }

  updateParam(id, key, value) {
    const l = this.scene.layers.find(x => x.id === id);
    if (!l) return;
    const p = this.registry.get(l.plugin);
    l.params[key] = value;
    l.params = validateParams(p.schema, l.params);
    this.emit('params', { id });
    this.renderSoon();
  }

  setOpacity(id, v) {
    const l = this.scene.layers.find(x => x.id === id);
    if (l) { l.opacity = clamp(v, 0, 1); this.emit('params', { id }); this.renderSoon(); }
  }
  toggleVisible(id) {
    const l = this.scene.layers.find(x => x.id === id);
    if (l) { l.visible = !l.visible; this.commit('visibility'); }
  }
  toggleLocked(id) {
    const l = this.scene.layers.find(x => x.id === id);
    if (l) { l.locked = !l.locked; this.emit('params', { id }); }
  }

  cycleAspect() {
    const keys = Object.keys(ASPECTS);
    const cur = this.scene.canvas.aspect || '1:1';
    const next = keys[(keys.indexOf(cur) + 1) % keys.length];
    this.scene.canvas = canvasForAspect(next, 1600);
    this.commit('aspect ' + next);
    return next;
  }

  /* ---------------- rendering ---------------- */
  getCanvas() { return this.canvas; }
  attachCanvas(canvas) { this.canvas = canvas; }

  render() {
    if (!this.canvas || !this.scene) return;
    const c = this.canvas.getContext('2d');
    const { W, H } = { W: this.scene.canvas.width, H: this.scene.canvas.height };
    if (this.canvas.width !== W || this.canvas.height !== H) {
      this.canvas.width = W; this.canvas.height = H;
    }
    const { world, profiler } = renderScene(this.scene, c, {
      registry: this.registry,
      palettes: this.palettes,
      world: this.world,
      profiler: this.profiler,
      disabledPasses: this.disabledPasses,
    });
    filmicGrade(c);
    this.lastReport = profiler.report();
    this.emit('render', { report: this.lastReport });
  }

  renderSoon() {
    clearTimeout(this._renderT);
    this._renderT = setTimeout(() => this.render(), 130);
  }

  commit(label) {
    this.history.push(this.scene);
    this.emit('scene', { why: label || 'change' });
    this.render();
  }

  undo() {
    const s = this.history.undo();
    if (s) { this.scene = s; this.emit('scene', { why: 'undo' }); this.render(); return true; }
    return false;
  }
  redo() {
    const s = this.history.redo();
    if (s) { this.scene = s; this.emit('scene', { why: 'redo' }); this.render(); return true; }
    return false;
  }

  /* ---------------- draw mode ---------------- */
  strokesLayer() {
    let l = this.scene.layers.find(x => x.plugin === 'strokes');
    if (!l) {
      l = makeLayer(this.registry.get('strokes'), 1, { strokes: [] });
      this.scene.layers.push(l);
    }
    if (!Array.isArray(l.params.strokes)) l.params.strokes = [];
    return l;
  }
  pushStroke(stroke) {
    const l = this.strokesLayer();
    l.params.strokes.push(stroke);
    this.commit('stroke');
  }
  undoStroke() {
    const l = this.strokesLayer();
    l.params.strokes.pop();
    this.commit('undo stroke');
  }
  clearStrokes() {
    const l = this.strokesLayer();
    l.params.strokes = [];
    this.commit('clear drawing');
  }

  /* ---------------- recipes / share ---------------- */
  recipeDoc() { return JSON.parse(serializeScene(this.scene)); }

  loadRecipes() {
    try { return JSON.parse(localStorage.getItem(LSKEY) || '[]'); }
    catch (e) { return []; }
  }
  saveRecipes(r) {
    try { localStorage.setItem(LSKEY, JSON.stringify(r)); return true; }
    catch (e) { return false; }
  }
  shareLink() {
    const b64 = sceneToShare(this.scene);
    if (!b64) return null;
    return location.origin + location.pathname + '#s=' + b64;
  }

  /* ---------------- seed tree (BUILD view) ---------------- */
  seedTree() {
    const root = new RNG(this.scene.seed, 'scene');
    return {
      masterSeed: this.scene.seed,
      layers: this.scene.layers.map(l => ({
        id: l.id, plugin: l.plugin, seed: l.seed,
        streams: ['defaults', 'ridge', 'clouds', 'flow', 'fall', 'grain'].filter(s => true),
        note: 'scope: ' + l.id + ':' + l.seed + '.*',
      })),
    };
  }
}

/* ============================================================
   FORGE editor/views/create.js — CREATE mode
   The simple toy surface: stage, big buttons, add grid,
   draw tools, saved pictures. No jargon.
   ============================================================ */


function renderCreateView(app, root) {
  root.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.id = 'createview';

  /* action row */
  const actions = document.createElement('div');
  actions.id = 'actions';
  actions.innerHTML =
    '<button class="bigbtn" id="btnRandom">🎲 Random</button>' +
    '<button class="midbtn" id="btnRemix">🔀 Remix</button>' +
    '<button class="midbtn" id="btnExport">⬆️ Export</button>';
  wrap.appendChild(actions);

  /* tabs */
  const tabs = document.createElement('div');
  tabs.id = 'tabs';
  tabs.innerHTML =
    '<div class="tab on" data-p="add">＋ Add</div>' +
    '<div class="tab" data-p="draw">✏️ Draw</div>' +
    '<div class="tab" data-p="saved">💾 Saved</div>';
  wrap.appendChild(tabs);

  const panel = document.createElement('div');
  panel.id = 'panel';
  panel.innerHTML =
    '<div class="pane on" id="pane-add"><div class="secT">Add a layer — everything stays editable</div><div id="addgrid"></div>' +
    '<div class="hint">🔀 Remix re-rolls every layer except the locked ones. Tip: switch to EDIT to tune each layer, or BUILD to see how the picture is wired.</div></div>' +
    '<div class="pane" id="pane-draw"></div>' +
    '<div class="pane" id="pane-saved"></div>';
  wrap.appendChild(panel);
  root.appendChild(wrap);

  wrap.querySelector('#btnRandom').onclick = () => { app.newScene(); app.toast('New picture 🎲'); };
  wrap.querySelector('#btnRemix').onclick = () => {
    if (app.remix()) app.toast('Remixed — locked layers kept');
    else app.toast('Everything is locked 🔒');
  };
  wrap.querySelector('#btnExport').onclick = () => app.exportPNG();

  tabs.querySelectorAll('.tab').forEach(t => t.onclick = () => {
    tabs.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
    t.classList.add('on');
    panel.querySelectorAll('.pane').forEach(p => p.classList.remove('on'));
    panel.querySelector('#pane-' + t.dataset.p).classList.add('on');
    app.drawMode = t.dataset.p === 'draw';
    app.updateDrawHint();
    if (t.dataset.p === 'draw') renderDrawPane(app, panel.querySelector('#pane-draw'));
    if (t.dataset.p === 'saved') renderSavedPane(app, panel.querySelector('#pane-saved'));
  });

  /* add grid */
  const grid = panel.querySelector('#addgrid');
  grid.innerHTML = app.registry.list()
    .filter(p => (p.composeWeight || 0) > 0)
    .map(p => '<div class="addcard" data-t="' + p.id + '"><span class="g">' + (p.glyph || '🧩') + '</span>' + p.title + '</div>')
    .join('');
  grid.querySelectorAll('.addcard').forEach(c => c.onclick = () => {
    const layer = app.addLayer(c.dataset.t);
    if (layer) app.toast(app.registry.get(c.dataset.t).title + ' added');
  });

  renderDrawPane(app, panel.querySelector('#pane-draw'));
  renderSavedPane(app, panel.querySelector('#pane-saved'));
  return wrap;
}

function renderDrawPane(app, el) {
  const B = app.brush;
  el.innerHTML =
    '<div class="secT">Draw — strokes are saved with the picture</div>' +
    '<div class="srow"><label><span>Color</span></label><input type="color" id="bcol" value="' + B.color + '"></div>' +
    '<div class="srow"><label><span>Brush size</span><b>' + B.width + '</b></label>' +
    '<input type="range" id="bwid" min="1" max="60" step="1" value="' + B.width + '"></div>' +
    '<div class="srow"><label><span>Opacity</span><b>' + Math.round(B.opacity * 100) + '%</b></label>' +
    '<input type="range" id="bop" min="0.05" max="1" step="0.01" value="' + B.opacity + '"></div>' +
    '<div class="saverow"><button class="midbtn" id="bundo">↩ Undo stroke</button>' +
    '<button class="midbtn" id="bclear">🗑 Clear</button></div>' +
    '<div class="hint">Draw on the picture above. Strokes stay editable — undo them any time. They save with the recipe.</div>';
  el.querySelector('#bcol').oninput = e => { B.color = e.target.value; };
  el.querySelector('#bwid').oninput = e => {
    B.width = parseFloat(e.target.value);
    e.target.closest('.srow').querySelector('b').textContent = B.width;
  };
  el.querySelector('#bop').oninput = e => {
    B.opacity = parseFloat(e.target.value);
    e.target.closest('.srow').querySelector('b').textContent = Math.round(B.opacity * 100) + '%';
  };
  el.querySelector('#bundo').onclick = () => { app.undoStroke(); app.toast('Stroke undone'); };
  el.querySelector('#bclear').onclick = () => { app.clearStrokes(); app.toast('Drawing cleared'); };
}

function renderSavedPane(app, el) {
  const recs = app.loadRecipes();
  let h = '<div class="secT">Keep this picture</div>' +
    '<div class="saverow"><input id="recname" placeholder="Name this picture…" maxlength="40">' +
    '<button class="bigbtn" style="flex:0 0 auto;padding:13px 18px" id="saverec">💾</button></div>' +
    '<div class="saverow"><button class="midbtn" id="copylink">🔗 Copy share link</button></div>';
  h += '<div class="secT">Saved pictures (' + recs.length + ')</div>';
  h += recs.length ? recs.map((r, i) =>
    '<div class="recrow"><div class="nm">' + escHtml(r.name) +
    '<small>' + (r.d.layers ? r.d.layers.length : 0) + ' layers · ' + ((r.d.canvas && r.d.canvas.aspect) || '?') + '</small></div>' +
    '<button class="icobtn" data-a="load" data-i="' + i + '">📂</button>' +
    '<button class="icobtn danger" data-a="del" data-i="' + i + '">✕</button></div>').join('')
    : '<div class="hint">Nothing saved yet. Name a picture above and tap 💾 — it lives on this device, layers and drawing included.</div>';
  el.innerHTML = h;
  el.querySelector('#saverec').onclick = () => {
    const name = (el.querySelector('#recname').value || 'Untitled').trim();
    const recs2 = app.loadRecipes();
    recs2.unshift({ name, at: Date.now(), d: app.recipeDoc() });
    if (app.saveRecipes(recs2)) { renderSavedPane(app, el); app.toast('Saved "' + name + '" 💾'); }
    else app.toast('Storage full — delete old recipes');
  };
  el.querySelector('#copylink').onclick = () => {
    const link = app.shareLink();
    if (!link) { app.toast('Too big to share as link — save it instead'); return; }
    (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject())
      .then(() => app.toast('Share link copied 🔗'),
        () => { prompt('Copy this link:', link); });
  };
  el.querySelectorAll('.recrow .icobtn').forEach(b => b.onclick = () => {
    const recs2 = app.loadRecipes(), i = +b.dataset.i;
    if (b.dataset.a === 'load') {
      const res = app.loadSceneDoc(recs2[i].d);
      app.toast(res.ok ? 'Opened "' + recs2[i].name + '" 📂' : 'Could not open: ' + res.warnings.join('; '));
      if (res.ok) app.refreshChrome();
    } else {
      recs2.splice(i, 1); app.saveRecipes(recs2); renderSavedPane(app, el); app.toast('Deleted');
    }
  });
}

function escHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/* ============================================================
   FORGE editor/views/edit.js — EDIT mode
   Layer stack + schema-driven inspector. Every control on
   this screen is generated from the plugin's schema — no
   hand-built sliders.
   ============================================================ */


function renderEditView(app, root) {
  root.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.id = 'editview';

  const bar = document.createElement('div');
  bar.id = 'actions';
  bar.innerHTML =
    '<button class="midbtn" id="eUndo">↩ Undo</button>' +
    '<button class="midbtn" id="eRedo">↪ Redo</button>' +
    '<button class="midbtn" id="eRemix">🔀 Remix</button>' +
    '<button class="midbtn" id="eExport">⬆️ Export</button>';
  wrap.appendChild(bar);

  const cols = document.createElement('div');
  cols.id = 'editcols';
  cols.innerHTML = '<div id="layercol"></div><div id="inspcol"></div>';
  wrap.appendChild(cols);
  root.appendChild(wrap);

  bar.querySelector('#eUndo').onclick = () => { if (!app.undo()) app.toast('Nothing to undo'); };
  bar.querySelector('#eRedo').onclick = () => { if (!app.redo()) app.toast('Nothing to redo'); };
  bar.querySelector('#eRemix').onclick = () => {
    if (app.remix()) app.toast('Remixed — locked layers kept');
    else app.toast('Everything is locked 🔒');
    paint();
  };
  bar.querySelector('#eExport').onclick = () => app.exportPNG();

  function paint() {
    paintLayers(app, cols.querySelector('#layercol'), () => paintInspector(app, cols.querySelector('#inspcol')));
    paintInspector(app, cols.querySelector('#inspcol'));
  }
  app._editPaint = paint;
  paint();
  return wrap;
}

function paintLayers(app, el, onSelect) {
  const ls = app.scene.layers;
  let h = '<div class="secT">Layers — bottom draws first</div>';
  ls.forEach((L, idx) => {
    const p = app.registry.get(L.plugin);
    const title = p ? p.title : L.plugin;
    const glyph = p ? p.glyph : '🧩';
    h += '<div class="lrow' + (L.id === app.sel ? ' sel' : '') + '" data-id="' + L.id + '">' +
      '<div class="nm">' + glyph + ' ' + title +
      '<small>seed ' + L.seed + ' · ' + (L.pass || (p && p.pass)) + (L.locked ? ' · locked' : '') + '</small></div>' +
      '<button class="icobtn" data-act="up" title="Move earlier">↑</button>' +
      '<button class="icobtn" data-act="down" title="Move later">↓</button>' +
      '<button class="icobtn ' + (L.visible ? '' : 'off') + '" data-act="vis" title="Show/hide">👁</button>' +
      '<button class="icobtn ' + (L.locked ? '' : 'off') + '" data-act="lock" title="Lock (remix keeps it)">🔒</button>' +
      (L.plugin === 'strokes'
        ? ''
        : '<button class="icobtn danger" data-act="del" title="Delete">✕</button>') +
      '</div>';
  });
  h += '<div class="hint">Layers render in pass order (geometry → … → post FX), then in the order shown here.</div>';
  el.innerHTML = h;
  el.querySelectorAll('.lrow').forEach(row => {
    row.addEventListener('click', e => {
      const act = e.target.dataset.act, id = row.dataset.id;
      if (act === 'vis') app.toggleVisible(id);
      else if (act === 'lock') app.toggleLocked(id);
      else if (act === 'del') app.removeLayer(id);
      else if (act === 'up') app.moveLayer(id, -1);
      else if (act === 'down') app.moveLayer(id, 1);
      else { app.sel = id; }
      e.stopPropagation();
      if (app._editPaint) app._editPaint();
    });
  });
}

function paintInspector(app, el) {
  const L = app.scene.layers.find(l => l.id === app.sel);
  if (!L) { el.innerHTML = '<div class="hint">Select a layer to tune it.</div>'; return; }
  const p = app.registry.get(L.plugin);
  el.innerHTML = '';
  const t = document.createElement('div');
  t.className = 'secT';
  t.textContent = (p.glyph || '') + ' ' + p.title + ' — v' + p.version;
  el.appendChild(t);

  const box = document.createElement('div');
  el.appendChild(box);
  const custom = typeof p.inspector === 'function'
    ? p.inspector(box, L.params, (k, v) => app.updateParam(L.id, k, v))
    : null;
  if (!custom) {
    buildInspector(box, p.schema, L.params, (k, v) => app.updateParam(L.id, k, v), { palettes: app.palettes });
  }

  const orow = document.createElement('div');
  orow.className = 'srow';
  orow.innerHTML = '<label><span>Layer opacity</span><b>' + Math.round(L.opacity * 100) + '%</b></label>';
  const op = document.createElement('input');
  op.type = 'range'; op.min = 0; op.max = 1; op.step = 0.01; op.value = L.opacity;
  op.addEventListener('input', () => {
    app.setOpacity(L.id, parseFloat(op.value));
    orow.querySelector('b').textContent = Math.round(op.value * 100) + '%';
  });
  orow.appendChild(op);
  el.appendChild(orow);

  if (L.plugin !== 'strokes') {
    const rr = document.createElement('button');
    rr.className = 'midbtn';
    rr.style.width = '100%';
    rr.style.marginTop = '8px';
    rr.textContent = '🎲 Re-roll this layer';
    rr.onclick = () => { app.rerollLayer(L.id); if (app._editPaint) app._editPaint(); };
    el.appendChild(rr);
  }

  const meta = document.createElement('div');
  meta.className = 'hint';
  meta.innerHTML = 'plugin <b>' + p.id + '</b> · pass <b>' + (L.pass || p.pass) + '</b>' +
    ' · provides ' + (p.provides || []).join(', ') + ' · reads ' + (p.reads || []).join(', ');
  el.appendChild(meta);
}

/* ============================================================
   FORGE editor/views/build.js — BUILD mode
   The engine room: scene graph, plugin browser, dependency
   view, seed tree, performance profiler, scene JSON.
   ============================================================ */


const TABS = [
  ['graph', '🗂 Graph'],
  ['plugins', '🧩 Plugins'],
  ['deps', '🔗 Deps'],
  ['seeds', '🌱 Seeds'],
  ['perf', '⚡ Perf'],
  ['json', '{} JSON'],
];

function renderBuildView(app, root) {
  root.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.id = 'buildview';

  const tabs = document.createElement('div');
  tabs.id = 'tabs';
  tabs.innerHTML = TABS.map(([k, label]) =>
    '<div class="tab' + (app.buildTab === k ? ' on' : '') + '" data-p="' + k + '">' + label + '</div>').join('');
  wrap.appendChild(tabs);

  const panel = document.createElement('div');
  panel.id = 'panel';
  panel.style.height = 'auto';
  panel.style.flex = '1';
  wrap.appendChild(panel);
  root.appendChild(wrap);

  function paint() {
    tabs.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x.dataset.p === app.buildTab));
    const fn = { graph: paintGraph, plugins: paintPlugins, deps: paintDeps, seeds: paintSeeds, perf: paintPerf, json: paintJson }[app.buildTab];
    panel.innerHTML = '';
    fn(app, panel);
  }
  tabs.querySelectorAll('.tab').forEach(t => t.onclick = () => { app.buildTab = t.dataset.p; paint(); });
  app._buildPaint = paint;
  paint();
  return wrap;
}

/* ---------------- scene graph ---------------- */
function paintGraph(app, el) {
  const order = {};
  PASSES.forEach((p, i) => (order[p] = i));
  const sorted = app.scene.layers.slice().sort((a, b) => (order[a.pass] - order[b.pass]) || 0);
  let h = '<div class="secT">Scene graph — render order, top to bottom</div>';
  let lastPass = null;
  for (const L of sorted) {
    const p = app.registry.get(L.plugin);
    if (L.pass !== lastPass) {
      lastPass = L.pass;
      h += '<div class="passhead">' + lastPass + '</div>';
    }
    h += '<div class="lrow' + (L.id === app.sel ? ' sel' : '') + '" data-id="' + L.id + '">' +
      '<div class="nm">' + (p.glyph || '🧩') + ' ' + (p.title || L.plugin) +
      '<small>' + L.id + ' · seed ' + L.seed + (L.visible ? '' : ' · hidden') + (L.locked ? ' · locked' : '') + '</small></div>' +
      '<button class="icobtn ' + (app.disabledPasses.has(L.pass) ? 'off' : '') + '" data-act="pass" title="Toggle pass">⚡</button>' +
      '</div>';
  }
  h += '<div class="hint">Tap ⚡ to disable a whole pass and watch the profiler change.</div>';
  el.innerHTML = h;
  el.querySelectorAll('.lrow').forEach(row => row.addEventListener('click', e => {
    if (e.target.dataset.act === 'pass') {
      const L = app.scene.layers.find(x => x.id === row.dataset.id);
      if (app.disabledPasses.has(L.pass)) app.disabledPasses.delete(L.pass);
      else app.disabledPasses.add(L.pass);
      app.render();
      paintGraph(app, el);
    } else {
      app.sel = row.dataset.id;
      app.toast('Selected ' + row.dataset.id);
    }
  }));
}

/* ---------------- plugin browser ---------------- */
function paintPlugins(app, el) {
  const desc = app.registry.describe();
  let h = '<div class="secT">' + desc.length + ' plugins registered</div>';
  for (const d of desc) {
    h += '<div class="plugrow"><div class="nm">' + d.glyph + ' ' + d.title +
      '<small><b>' + d.id + '</b> v' + d.version + ' · pass: ' + d.pass + ' · ' + d.params + ' params</small></div>' +
      '<button class="icobtn" data-add="' + d.id + '" title="Add layer">＋</button></div>';
    if (d.provides.length || d.reads.length) {
      h += '<div class="contract">provides: ' + (d.provides.join(', ') || '—') +
        '<br>reads: ' + (d.reads.join(', ') || '—') + '</div>';
    }
  }
  h += '<div class="hint">A plugin is a contract: id, version, schema, render, and the ' +
    'facts it publishes / consumes. New generators (terrain, roads, buildings…) ' +
    'arrive as plugins — the engine never changes.</div>';
  el.innerHTML = h;
  el.querySelectorAll('[data-add]').forEach(b => b.onclick = () => {
    const layer = app.addLayer(b.dataset.add);
    if (layer) app.toast(app.registry.get(b.dataset.add).title + ' added');
  });
}

/* ---------------- dependency view ---------------- */
function paintDeps(app, el) {
  // world holds the last render's declarations + live keys
  const g = app.world.graph();
  let h = '<div class="secT">Who reads what — live from the last render</div>';
  if (!g.nodes.length) {
    h += '<div class="hint">Render once to populate the graph.</div>';
  }
  for (const n of g.nodes) {
    h += '<div class="depnode"><b>' + n.title + '</b> <small>' + n.layerId + '</small>';
    if (n.provides.length) h += '<div class="provides">↓ provides ' + n.provides.join(', ') + '</div>';
    if (n.reads.length) {
      const live = n.reads.map(k => app.world.has(k) ? '✓ ' + k : '○ ' + k + ' (no provider)').join(', ');
      h += '<div class="reads">↑ reads ' + live + '</div>';
    }
    h += '</div>';
  }
  if (g.edges.length) {
    h += '<div class="secT">Connections</div>';
    for (const e of g.edges) {
      h += '<div class="depedge">' + e.from + ' → ' + e.to + ' <small>' + e.key + '</small></div>';
    }
  }
  const keys = app.world.keys();
  h += '<div class="secT">World bus right now (' + keys.length + ' keys)</div>';
  h += keys.length
    ? '<div class="contract">' + keys.map(k => {
      const v = app.world.query(k);
      return k + ' = ' + (typeof v === 'function' ? '[function]' : JSON.stringify(v));
    }).join('<br>') + '</div>'
    : '<div class="hint">No keys published yet.</div>';
  h += '<div class="hint">This is the contract an AI reads when it builds new generators: ' +
    'it reasons about provides/reads instead of digging through files.</div>';
  el.innerHTML = h;
}

/* ---------------- seed tree ---------------- */
function paintSeeds(app, el) {
  const tree = app.seedTree();
  let h = '<div class="secT">Seed tree — every stream is independent</div>';
  h += '<div class="seedroot">🌱 master seed <b>#' + tree.masterSeed + '</b></div>';
  for (const l of tree.layers) {
    const p = app.registry.get(l.plugin);
    h += '<div class="depnode"><b>' + (p ? p.glyph + ' ' + p.title : l.plugin) + '</b> ' +
      '<small>' + l.id + '</small>' +
      '<div class="reads">seed <b>' + l.seed + '</b> · scope <span class="mono">' + l.id + ':' + l.seed + '.*</span></div>' +
      '<div class="hint" style="margin:4px 0 0">Changing this layer\'s seed re-rolls only this layer. ' +
      'Locked layers keep seed + params, so they render pixel-identical.</div></div>';
  }
  h += '<div class="hint">Sub-streams inside a plugin (clouds, ridge, foam…) derive from the ' +
    'layer scope, so tweaking clouds never regenerates the mountain.</div>';
  el.innerHTML = h;
}

/* ---------------- performance ---------------- */
function paintPerf(app, el) {
  const r = app.lastReport;
  let h = '<div class="secT">Render passes — last frame</div>';
  if (!r) {
    h += '<div class="hint">No frame measured yet.</div>';
  } else {
    const maxMs = Math.max(0.01, ...r.passes.map(p => p.ms));
    for (const p of r.passes) {
      const w = Math.round((p.ms / maxMs) * 100);
      h += '<div class="perfrow"><span class="pname">' + p.pass + '</span>' +
        '<div class="pbar"><div style="width:' + w + '%"></div></div>' +
        '<span class="pms">' + p.ms.toFixed(1) + ' ms</span></div>';
    }
    h += '<div class="secT">By plugin</div>';
    for (const p of r.plugins) {
      h += '<div class="perfrow"><span class="pname">' + p.title + '</span>' +
        '<span class="pms">' + p.ms.toFixed(1) + ' ms</span></div>';
    }
    h += '<div class="perftotal">Frame ' + r.totalMs.toFixed(1) + ' ms · ' + r.fps.toFixed(1) + ' FPS</div>';
    h += '<div class="saverow" style="margin-top:10px"><button class="midbtn" id="rerun">↻ Re-measure</button></div>';
  }
  h += '<div class="hint">Slow pass? Disable it in the Graph tab, bake it down, or lower its resolution. ' +
    'Per-pass control is how the heavy renderers get fast.</div>';
  el.innerHTML = h;
  const rb = el.querySelector('#rerun');
  if (rb) rb.onclick = () => { app.render(); paintPerf(app, el); };
}

/* ---------------- scene JSON ---------------- */
function paintJson(app, el) {
  const json = JSON.stringify(app.recipeDoc(), null, 1);
  el.innerHTML =
    '<div class="secT">Scene document — the canonical truth</div>' +
    '<div class="saverow"><button class="midbtn" id="copyjson">📋 Copy JSON</button>' +
    '<button class="midbtn" id="pastejson">📥 Load JSON</button></div>' +
    '<textarea id="scenejson" spellcheck="false">' + escHtml(json) + '</textarea>' +
    '<div class="hint">This document is what the renderer reads, what remix modifies, ' +
    'what export bakes, and what future AI will generate. Everything else is a view.</div>';
  el.querySelector('#copyjson').onclick = () => {
    const ta = el.querySelector('#scenejson');
    ta.select();
    (navigator.clipboard ? navigator.clipboard.writeText(ta.value) : Promise.reject())
      .then(() => app.toast('Scene JSON copied 📋'), () => document.execCommand('copy'));
  };
  el.querySelector('#pastejson').onclick = () => {
    const ta = el.querySelector('#scenejson');
    try {
      const res = app.loadSceneDoc(JSON.parse(ta.value));
      if (res.ok) { app.refreshChrome(); app.toast('Scene loaded ✓'); }
      else app.toast('Bad document: ' + res.warnings.join('; '));
    } catch (e) { app.toast('Not valid JSON'); }
  };
}

function escHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* ============================================================
   FORGE editor/main.js — app shell: chrome, modes, draw input
   ============================================================ */


const app = new ForgeApp();
window.forgeApp = app; // debug handle

/* ---------- toast ---------- */
app.toast = function (msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.classList.remove('show'), 1800);
};

/* ---------- export ---------- */
app.exportPNG = function () {
  app.render();
  const canvas = app.getCanvas();
  canvas.toBlob(blob => {
    const fname = 'forge-' + app.scene.seed + '.png';
    const file = new File([blob], fname, { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: 'FORGE picture' }).catch(() => {});
    } else {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = fname;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      app.toast('Saved ' + fname);
    }
  }, 'image/png');
};

/* ---------- chrome: mode switch, seed chip, aspect ---------- */
app.refreshChrome = function () {
  document.getElementById('seedtxt').textContent = '#' + app.scene.seed;
  document.getElementById('aspectbtn').textContent = '🖼 ' + (app.scene.canvas.aspect || '1:1');
  document.querySelectorAll('#modeswitch .mode').forEach(m =>
    m.classList.toggle('on', m.dataset.m === app.mode));
  fitStage();
  paintView();
};

function paintView() {
  const root = document.getElementById('viewroot');
  if (app.mode === 'create') renderCreateView(app, root);
  else if (app.mode === 'edit') renderEditView(app, root);
  else renderBuildView(app, root);
  app.updateDrawHint();
}

app.updateDrawHint = function () {
  const dh = document.getElementById('drawhint');
  if (dh) dh.style.display = app.drawMode ? 'block' : 'none';
};

/* ---------- stage sizing ---------- */
function fitStage() {
  const wrap = document.getElementById('stagewrap');
  const stage = document.getElementById('stage');
  if (!wrap || !stage || !app.scene) return;
  const [aw, ah] = [app.scene.canvas.width, app.scene.canvas.height];
  const pad = 8;
  let w = wrap.clientWidth - pad * 2, h = wrap.clientHeight - pad * 2;
  if (w / aw < h / ah) h = w * ah / aw; else w = h * aw / ah;
  stage.style.width = Math.max(80, w) + 'px';
  stage.style.height = Math.max(80, h) + 'px';
}

/* ---------- draw input on the stage ---------- */
let curStroke = null;
function stagePoint(e) {
  const stage = document.getElementById('stage');
  const r = stage.getBoundingClientRect();
  const p = e.touches ? e.touches[0] : e;
  return [clamp((p.clientX - r.left) / r.width, 0, 1), clamp((p.clientY - r.top) / r.height, 0, 1)];
}
function wireDraw() {
  const stage = document.getElementById('stage');
  stage.addEventListener('pointerdown', e => {
    if (!app.drawMode) return;
    e.preventDefault();
    app.drawing = true;
    curStroke = {
      color: app.brush.color, width: app.brush.width,
      opacity: app.brush.opacity, pts: [stagePoint(e)],
    };
    try { stage.setPointerCapture(e.pointerId); } catch (err) {}
  });
  stage.addEventListener('pointermove', e => {
    if (!app.drawing || !curStroke) return;
    e.preventDefault();
    const p = stagePoint(e), last = curStroke.pts[curStroke.pts.length - 1];
    if (Math.hypot(p[0] - last[0], p[1] - last[1]) > 0.002) {
      curStroke.pts.push(p);
      // live preview: draw just this stroke over the current frame
      app.render();
      const c = app.getCanvas().getContext('2d');
      const W = app.scene.canvas.width, H = app.scene.canvas.height;
      c.save();
      c.globalAlpha = curStroke.opacity;
      c.strokeStyle = curStroke.color;
      c.lineWidth = curStroke.width * (W / 800);
      c.lineCap = 'round'; c.lineJoin = 'round';
      c.beginPath();
      curStroke.pts.forEach((pt, i) => { i ? c.lineTo(pt[0] * W, pt[1] * H) : c.moveTo(pt[0] * W, pt[1] * H); });
      c.stroke();
      c.restore();
    }
  });
  const end = () => {
    if (curStroke && curStroke.pts.length > 1) {
      curStroke.pts = curStroke.pts.map(p => [Math.round(p[0] * 1000) / 1000, Math.round(p[1] * 1000) / 1000]);
      app.pushStroke(curStroke);
    }
    curStroke = null;
    app.drawing = false;
  };
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', end);
}

/* ---------- boot ---------- */
function boot() {
  app.attachCanvas(document.getElementById('art'));
  wireDraw();

  document.querySelectorAll('#modeswitch .mode').forEach(m => m.onclick = () => {
    app.mode = m.dataset.m;
    app.drawMode = false;
    app.refreshChrome();
  });
  document.getElementById('seedchip').onclick = () => {
    const s = '#' + app.scene.seed;
    (navigator.clipboard ? navigator.clipboard.writeText(s) : Promise.reject())
      .then(() => app.toast('Seed copied: ' + s), () => app.toast(s));
  };
  document.getElementById('aspectbtn').onclick = e => {
    const next = app.cycleAspect();
    e.target.textContent = '🖼 ' + next;
    fitStage();
  };

  // deep links: ?seed= / #s= (v2 scene) / #r= (v1 recipe)
  let loaded = false;
  const qs = new URLSearchParams(location.search);
  if (location.hash.startsWith('#s=')) {
    const res = sceneFromShare(location.hash.slice(3));
    if (res.scene) { app.loadSceneDoc(res.scene); loaded = true; app.toast('Opened shared picture 🔗'); }
  } else if (location.hash.startsWith('#r=')) {
    try {
      const b64 = location.hash.slice(3).replace(/-/g, '+').replace(/_/g, '/');
      const v1 = JSON.parse(decodeURIComponent(escape(atob(b64))));
      const res = app.loadSceneDoc(v1);
      if (res.ok) { loaded = true; app.toast('Opened shared picture 🔗'); }
    } catch (e) {}
  }
  if (!loaded) {
    const seed = qs.get('seed') ? parseInt(qs.get('seed'), 10) : null;
    app.newScene(Number.isFinite(seed) ? seed : null);
  }

  app.refreshChrome();
  setTimeout(fitStage, 300);

  // re-render the active editor pane when params change structurally
  app.on('scene', () => {
    document.getElementById('seedtxt').textContent = '#' + app.scene.seed;
    if (app.mode === 'edit' && app._editPaint) app._editPaint();
    if (app.mode === 'build' && app._buildPaint) app._buildPaint();
  });
}

window.addEventListener('load', fitStage);
window.addEventListener('resize', fitStage);
document.addEventListener('DOMContentLoaded', boot);


</script>
