<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#010409">
<title>Pulse Beam · Funnel Hall</title>
<style>
:root{color-scheme:dark;--bg:#010409;--glass:rgba(7,14,20,.58);--line:rgba(205,226,240,.16);--white:#f7fbff;--muted:#7f929f;--ice:#a8e8ff;--green:#4be0a3}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font:12px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color:var(--white)}
#stage{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:max(13px,env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:8px;align-items:center}
.badge,.btn,.panel,.move{pointer-events:auto;border:1px solid var(--line);border-top-color:rgba(255,255,255,.18);background:rgba(4,10,15,.56);box-shadow:inset 0 1px 0 rgba(255,255,255,.055),0 18px 48px rgba(0,0,0,.30);backdrop-filter:blur(24px) saturate(1.18)}
.badge{height:44px;border-radius:999px;padding:0 14px;display:flex;align-items:center;gap:9px}.badge i{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 12px rgba(75,224,163,.72)}.badge strong{font-size:11px;letter-spacing:.11em}.badge span{color:var(--muted);font-size:10px}
.actions{margin-left:auto;display:flex;gap:7px;pointer-events:auto}.btn{height:44px;border-radius:14px;color:#dce8f0;padding:0 12px;font-size:10px;letter-spacing:.06em}.btn.icon{width:44px;padding:0;border-radius:50%;font-size:16px}.btn.live{color:#b9ebd4;border-color:rgba(75,224,163,.24)}
.panel{position:absolute;right:12px;top:70px;width:min(330px,calc(100vw - 24px));border-radius:20px;padding:14px;opacity:0;transform:translateY(-6px);transition:.16s ease;pointer-events:none}.panel.on{opacity:1;transform:none;pointer-events:auto}.panel small{display:block;color:var(--muted);text-transform:uppercase;letter-spacing:.13em;font-size:8px;margin-bottom:6px}.panel h2{font-size:18px;letter-spacing:-.02em;margin:0 0 6px}.panel p{margin:0;color:#93a4b1;font-size:11px;line-height:1.55}.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid rgba(205,226,240,.08);margin-top:10px}.kv span{color:var(--muted)}.kv b{font-weight:600;color:#dce8ef;text-align:right}
.bottom{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:7px;align-items:center}.hint{color:rgba(204,224,239,.43);font-size:9px;letter-spacing:.10em;text-transform:uppercase;background:rgba(4,10,15,.38);border:1px solid rgba(205,226,240,.08);border-radius:999px;padding:8px 11px;backdrop-filter:blur(15px)}
.move-pad{position:absolute;left:12px;bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:6px;pointer-events:auto}.move{width:43px;height:43px;border-radius:50%;color:#bfd1dd;font-size:17px;display:grid;place-items:center;user-select:none;-webkit-user-select:none}
.reticle{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:rgba(168,232,255,.48);box-shadow:0 0 12px rgba(168,232,255,.42)}
.state{position:absolute;left:12px;top:70px;color:#8ca0ae;font-size:9px;letter-spacing:.09em;text-transform:uppercase}.state b{color:#cfe3ec;font-weight:600}.state .emerald{color:var(--green)}.state .ice{color:var(--ice)}
@media(max-width:680px){.badge span{display:none}.actions .word{display:none}.btn{padding:0 10px}.panel{top:66px}.state{top:65px}.hint{font-size:8px}.move-pad{bottom:calc(max(14px,env(safe-area-inset-bottom)) + 44px)}}
@media(prefers-reduced-motion:reduce){.hint::after{content:" · reduced motion"}}
</style>
<script src="funnel-foundry-core.js"></script>
<script src="funnel-environment-data.js"></script>
</head>
<body>
<div id="stage"></div>
<div class="hud">
  <div class="top">
    <div class="badge"><i></i><strong>FUNNEL HALL</strong><span id="hall-count">live architecture</span></div>
    <div class="actions">
      <button class="btn word" id="foundry">FOUNDRY</button>
      <button class="btn word" id="refinery">REFINERY</button>
      <button class="btn icon" id="sound" title="Quiet hall hum" aria-label="Toggle hall hum">◌</button>
    </div>
  </div>
  <div class="state" id="hall-state"></div>
  <div class="panel" id="info"><small id="info-type">Funnel</small><h2 id="info-title">Select architecture</h2><p id="info-copy">Tap a suspended node to inspect it. The room is generated from the current Funnel graph.</p><div class="kv"><span>Status</span><b id="info-status">live graph</b></div></div>
  <div class="move-pad"><button class="move" id="forward" aria-label="Move forward">↑</button><button class="move" id="back" aria-label="Move backward">↓</button></div>
  <div class="reticle"></div>
  <div class="bottom"><div class="hint">drag to look · W/S or arrows move · edge-swipe right returns</div></div>
</div>
<script type="module" src="pulse-beam-funnel-hall.js"></script>
</body>
</html>
