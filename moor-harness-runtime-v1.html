<html lang="en">
<head>

<style>
:root{--bg:#0b0e14;--bg2:#10141d;--card:#151b26;--line:#232c3d;--txt:#e8ecf4;--dim:#8b93a7;
--acc:#7dd3fc;--grn:#4ade80;--amb:#fbbf24;--red:#f87171;--pur:#c084fc}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:15px/1.55 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
  max-width:1060px;margin:0 auto;padding:14px 14px 120px;-webkit-font-smoothing:antialiased}
h1{font-size:22px;letter-spacing:.5px}
h2{font-size:17px;margin:18px 0 8px}
h3{font-size:14px;margin:14px 0 6px;color:var(--acc)}
.sub{color:var(--dim);font-size:13px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--acc);color:#06121c;border:0;border-radius:10px;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer}
.btn:disabled{opacity:.4;cursor:default}
.ghost{background:transparent;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:9px 14px;font-size:13px;cursor:pointer}
.ghost:disabled{opacity:.4}
textarea.inp,input.inp,select.inp{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--txt);
  border-radius:10px;padding:10px;font-size:14px;font-family:inherit}
textarea.inp{min-height:110px;resize:vertical}
.pill{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;border:1px solid var(--line);color:var(--dim);margin:2px 4px 2px 0}
.pill.you{border-color:var(--grn);color:var(--grn)}
.pill.fill{border-color:var(--amb);color:var(--amb)}
.pill.ok{border-color:var(--grn);color:var(--grn)}
.pill.bad{border-color:var(--red);color:var(--red)}
.pill.run{border-color:var(--acc);color:var(--acc)}
.stages{display:flex;gap:6px;overflow-x:auto;padding:8px 0;margin-bottom:6px}
.stg{white-space:nowrap;font-size:12px;padding:7px 11px;border-radius:20px;border:1px solid var(--line);color:var(--dim);cursor:pointer;background:var(--bg2)}
.stg.on{border-color:var(--acc);color:var(--acc)}
.stg.done{border-color:var(--grn);color:var(--grn)}
pre.code{background:#070a10;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;
  overflow:auto;max-height:320px;white-space:pre-wrap;word-break:break-word}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--dim);font-weight:600;font-size:12px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.gate{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.log{font-size:12px;color:var(--dim);max-height:180px;overflow:auto;background:#070a10;border-radius:10px;padding:10px;border:1px solid var(--line)}
.log b{color:var(--txt)}
.job{border-left:3px solid var(--line);padding:8px 12px;margin:8px 0;background:var(--bg2);border-radius:0 10px 10px 0}
.job.pass{border-color:var(--grn)} .job.fail{border-color:var(--red)} .job.work{border-color:var(--acc)}
.kv{display:grid;grid-template-columns:130px 1fr;gap:4px 10px;font-size:13px}
.kv dt{color:var(--dim)} .kv dd{margin:0}
details{margin:8px 0} summary{cursor:pointer;color:var(--acc);font-size:13px}
.hud{position:sticky;top:0;z-index:5;background:rgba(11,14,20,.94);backdrop-filter:blur(8px);padding:10px 0;border-bottom:1px solid var(--line);margin:-14px -14px 10px;padding:10px 14px}
iframe.appview{width:100%;height:520px;border:1px solid var(--line);border-radius:14px;background:#fff}
.note{font-size:12px;color:var(--dim);border-left:2px solid var(--amb);padding:4px 10px;margin:8px 0}
</style>
</head>
<body>
<div class="hud">
  <h1>⚙️ MOOR HARNESS <span style="color:var(--dim);font-size:12px">runtime v1 · prototype</span></h1>

  <div class="stages" id="stages"></div>
  <div class="row" style="margin-top:8px">

    <button class="ghost" id="cycle">↻ Run upkeep cycle</button>

</div>
<div id="main"></div>

/* ================= utils ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=p=>(p||"id")+"-"+Math.random().toString(36).slice(2,8);
const clone=o=>JSON.parse(JSON.stringify(o));
function log(msg){ H.logArr=H.logArr||[]; H.logArr.push(msg);
  const l=$("#runlog"); if(l){ l.innerHTML+="<div>"+msg+"</div>"; l.scrollTop=l.scrollHeight; } }
function download(name,text){ const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([text],{type:"text/html"})); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000); }

/* storage adapter: localStorage with in-memory fallback (offline-first, no network) */
const store=(()=>{ let mem={};
  const ok=(()=>{ try{localStorage.setItem("__t","1");localStorage.removeItem("__t");return true;}catch(e){return false;} })();
  return { get:k=>{ try{ return ok?localStorage.getItem(k):(mem[k]||null);}catch(e){return mem[k]||null;} },
           set:(k,v)=>{ try{ ok?localStorage.setItem(k,v):mem[k]=v;}catch(e){mem[k]=v;} },
           del:k=>{ try{ ok?localStorage.removeItem(k):delete mem[k];}catch(e){delete mem[k];} } }; })();

<script>
/* ================= SPEC COMPILER (local fallback brain — transparent, no LLM) =================
   Completion invariant: weak, incomplete, or empty input still compiles to a candidate.
   Provenance is explicit:
     you      = directly supported by the request
     inferred = interpretation of request text
     fallback = local choice made only to keep the pipeline moving
   A fallback can teach verified LOGIC without being treated as verified INTENT. */
const BRAIN={ id:"local-fallback-2", kind:"local", label:"Local fallback compiler", cost:0, online:false };
function compileSpec(ramble){
  const original=String(ramble==null?"":ramble).trim();
  const working=original||"make a useful app";
  ramble=working;
  const t=" "+working.toLowerCase()+" ";
  const has=(...ws)=>ws.some(w=>t.includes(w));
  // app type
  let app_type="web app", aSrc="fallback", aConf="low";
  if(has("game","playable","level","battle","arena","player")){app_type="game";aSrc="you";aConf="high";}
  else if(has("mobile","phone","iphone","android","on the go")){app_type="mobile app";aSrc="you";aConf="high";}
  else if(has("dashboard","team","web","browser","site")){app_type="web app";aSrc="you";aConf="med";}
  // audience: "for X" pattern
  let audience=null, auSrc="fallback";
  const m=ramble.match(/for\s+([a-z][a-z\s]{2,28}?)(?=[,.]| to | who | with |$)/i);
  if(m){audience=m[1].trim();auSrc="you";}
  else{audience={ "mobile app":"busy people","web app":"small teams","game":"casual players"}[app_type];}
  // features: strip the app/audience preamble, then pull verb-led phrases
  const VERBS=["track","send","add","manage","share","post","browse","play","log","plan","remind","organize","build","create","view","check","monitor","schedule","message","chat"];
  const vrx=new RegExp("\\b("+VERBS.join("|")+")\\b","i");
  let core=ramble.replace(/\s+/g," ").trim()
    .replace(/^.*?\bapps?\s+for\s+[a-z][a-z\s]{2,30}?\s+to\s+/i,"")
    .replace(/^(i want|please|it should|the app should|also)\s+/i,"");
  const deepSkip=/sign\s*in|log\s*in|phone number/i, conSkip=/dark\s*(mode|theme)|night\s*mode|works?\s+offline|^offline$/i;
  let feats=[];
  core.split(/[.\n]+|\s+plus\s+|;/).map(s=>s.trim()).filter(s=>s.length>3).forEach(b=>{
    const parts=b.split(/\s+and\s+/); let cur=parts[0];
    for(let k=1;k<parts.length;k++){
      if(vrx.test(parts[k].trim())){ feats.push(cur); cur=parts[k]; } else cur+=" and "+parts[k]; }
    feats.push(cur); });
  feats=feats.map(p=>p.trim().replace(/^(also|with|and)\s+/i,""))
    .filter(p=>p.length>2&&p.length<60&&!deepSkip.test(p)&&!conSkip.test(p));
  feats=feats.filter((p,i)=>feats.indexOf(p)===i);
  feats.sort((a,b)=>(vrx.test(b)?1:0)-(vrx.test(a)?1:0));
  feats=feats.slice(0,4).map((p,i)=>({text:p, weight:8-i, source:vrx.test(p)?"you":"inferred"}));
  if(!feats.length){ const fb={"mobile app":["Track items","Send reminders"],"web app":["Dashboard","Team notes"],"game":["Quick play","Battle arena"]}[app_type];
    feats=fb.map((p,i)=>({text:p,weight:8-i,source:"fallback"})); }
  // constraints
  const constraints=[];
  if(has("offline","no internet","local-first","local first"))constraints.push({text:"works offline",source:"you"});
  if(has("dark mode","dark theme","night mode"))constraints.push({text:"dark theme",source:"you"});
  if(has("no sign","guest","no login","without account"))constraints.push({text:"guest mode (no sign-in)",source:"you"});
  // deep aspect per app type
  const deepQ={"mobile app":"sign-in","web app":"collaboration","game":"combat"}[app_type];
  let deepChoice=null, dSrc="fallback";
  if(app_type==="mobile app"){ deepChoice=has("guest","no sign","no login")?"guest":has("password","email")?"password":"sms"; dSrc=has("guest","password","email","phone","sms")?"you":"filled"; }
  if(app_type==="web app"){ deepChoice=has("comment","notes","async")?"comments":has("local","offline","private")?"local":"comments"; dSrc=has("comment","notes","async","local","offline")?"you":"filled"; }
  if(app_type==="game"){ deepChoice=has("turn","strategy")?"turns":has("idle","auto")?"idle":"buttons"; dSrc=has("turn","strategy","idle","auto","real","action")?"you":"filled"; }
  return { app_type, app_type_src:aSrc, app_type_conf:aConf, audience, audience_src:auSrc,
    features:feats, constraints, deep:{aspect:deepQ, choice:deepChoice, src:dSrc},
    raw:original, effective_input:working, input_was_empty:!original,
    provenance_mode:"explicit > inferred > fallback" };
}
/* ================= HOLE-POKER: attack the spec for ambiguity ================= */
function pokeHoles(spec){
  const holes=[];
  if(spec.audience_src!=="you")holes.push({id:"aud",q:"Who is this for?",opts:["busy parents","freelancers","small teams","students","gamers"],field:"audience"});
  if(spec.app_type_conf==="low")holes.push({id:"type",q:"What kind of app is this?",opts:["mobile app","web app","game"],field:"app_type"});
  if(spec.deep.src!=="you")holes.push({id:"deep",q:{"mobile app":"How do people sign in?","web app":"How do people work together?","game":"What kind of combat?"}[spec.app_type],
    opts:{"mobile app":["sms","password","guest"],"web app":["comments","local"],"game":["buttons","turns"]}[spec.app_type],field:"deep"});
  spec.features.forEach((f,i)=>{ if(f.text.split(" ").length<2||f.source!=="you")
    holes.push({id:"feat"+i,q:"What should \""+f.text+"\" actually do?",opts:["keep as-is","make it a list","make it cards","drop it"],field:"feat"+i}); });
  const c=spec.constraints.map(x=>x.text);
  if(c.includes("works offline")&&spec.deep.choice==="comments")holes.push({id:"conf",q:"Offline + team comments conflict. Which wins?",
    opts:["offline wins (local-first)","comments win (needs sync)"],field:"conflict"});
  return holes;
}
/* ================= FIT CHECK: every feature -> a registry part ================= */
function fitScore(feat,part){
  const t=" "+feat.text.toLowerCase()+" ";
  let s=0; part.caps.forEach(c=>{ if(t.includes(c))s+=c.length>4?2:1; });
  return s;
}
function fitCheck(spec){
  return spec.features.map((f,i)=>{
    const ranked=PARTS.filter(p=>p.kind==="feature")
      .map(p=>({part:p,score:fitScore(f,p)})).sort((a,b)=>b.score-a.score);
    const best=ranked[0];
    return {feat:i, text:f.text, best:best.part.id, bestName:best.part.name, score:best.score,
      ok:best.score>=2, fallback:best.score<2, resolution:best.score>=2?"verified-match":"fallback-match",
      alts:ranked.slice(1,3).map(r=>({id:r.part.id,name:r.part.name,score:r.score}))};
  });
}
function deepPartFor(spec){
  const c=spec.deep.choice;
  const map={sms:"gate-sms",password:"gate-password",guest:"gate-guest",
    comments:"collab-comments",local:"collab-local",buttons:"combat-buttons",turns:"combat-turns",idle:"combat-turns"};
  return map[c]||"gate-guest";
}
</script>
<script>
/* ================= WORKER ECONOMY (contractors, not employees) ================= */
const ECON={ upkeep:10, tax:0.10, strikes_to_retire:3, bounty:0 };
const CODENAMES=["Anvil","Bishop","Cinder","Drift","Ember","Flint","Gale","Harbor","Iris","Jolt"];
const ROLESPEC={
  planner:{rate:25,blurb:"turns raw asks into written specs; no project context"},
  "hole-poker":{rate:15,blurb:"attacks specs for ambiguity before anyone builds"},
  builder:{rate:40,blurb:"executes specs in isolation; spec + destination + done-criteria only"},
  verifier:{rate:30,blurb:"fit-checks against the real app; its pass releases payment"},
  integrator:{rate:35,blurb:"assembles verified parts; owns the integration seams"}};
function mkWorker(role){ const r=ROLESPEC[role];
  return {id:uid("wrk"),codename:CODENAMES.splice(Math.floor(Math.random()*CODENAMES.length),1)[0]+"-"+Math.floor(Math.random()*90+10),
    role,blurb:r.blurb,rate:r.rate,balance:50,record:{done:0,failed:0,strikes:0},status:"active",
    terms:{paid_per_verified_job:true,tax:ECON.tax,strikes_to_retire:ECON.strikes_to_retire}}; }
function payWorker(w,weight){
  const gross=Math.round(w.rate*(0.5+weight/10)*100)/100;
  const tax=Math.round(gross*ECON.tax*100)/100, net=Math.round((gross-tax)*100)/100;
  w.balance=Math.round((w.balance+net)*100)/100; ECON.bounty=Math.round((ECON.bounty+tax)*100)/100;
  w.record.done++; return {gross,tax,net};
}
function failWorker(w){ w.record.failed++; w.record.strikes++;
  if(w.record.strikes>=ECON.strikes_to_retire){ w.status="retired"; } }
function runUpkeepCycle(){
  H.workers.forEach(w=>{ if(w.status!=="active")return;
    w.balance=Math.round((w.balance-ECON.upkeep)*100)/100;
    if(w.balance<0&&w.status==="active")w.status="strained"; });
  H.cycles++;
}
function routeWorker(role,minWeight){
  const cands=H.workers.filter(w=>w.role===role&&w.status==="active");
  if(!cands.length)return H.workers.find(w=>w.role===role);
  cands.sort((a,b)=>{ const ra=a.record.done/(1+a.record.done+a.record.failed*2), rb=b.record.done/(1+b.record.done+b.record.failed*2);
    return rb-ra; });
  return minWeight>=9?cands[0]:cands[cands.length-1]; // best record gets the heavy jobs
}
/* ================= JOB GRAPH ================= */
function buildJobs(spec,fit){
  const jobs=[]; let n=0;
  const deepId=deepPartFor(spec);
  const deepW=partById(deepId).weight_hint;
  jobs.push({id:"job-"+(++n),kind:"deep",label:partById(deepId).name,part_id:deepId,
    feature:spec.deep.aspect+" ("+spec.deep.choice+")",weight:deepW,deps:[],status:"planned"});
  fit.forEach((f,i)=>{ if(f.dropped)return;
    const p=partById(f.best);
    jobs.push({id:"job-"+(++n),kind:"feature",label:p.name+" — "+f.text,part_id:f.best,
      feature:f.text,weight:spec.features[f.feat].weight,deps:["job-1"],status:"planned",
      resolution:f.resolution||"verified-match",fallback:!!f.fallback}); });
  if(spec.constraints.some(c=>c.text==="dark theme"))
    jobs.push({id:"job-"+(++n),kind:"theme",label:"Dark theme",part_id:"theme-dark",
      feature:"dark theme",weight:4,deps:jobs.map(j=>j.id).filter(id=>id!=="job-"+n),status:"planned"});
  jobs.push({id:"job-"+(++n),kind:"integration",label:"Assemble + regression",part_id:null,
    feature:"integration",weight:8,deps:jobs.map(j=>j.id),status:"planned"});
  return jobs;
}
/* ================= WORKER PACKETS (exact, isolated, downloadable) ================= */
function buildPacket(job,spec){
  const role=job.kind==="integration"?"integrator":"builder";
  const worker=routeWorker(role,job.weight);
  const dest="app section #"+(job.kind==="deep"?"deep":job.kind==="theme"?"theme":job.id);
  return {packet_id:uid("pkt"), job_id:job.id, issued_to:{worker_id:worker.id,codename:worker.codename,role:worker.role},
    role_briefing:ROLESPEC[worker.role].blurb,
    spec_slice:{app:spec.app_type,audience:spec.audience,feature:job.feature,weight:job.weight,
      constraints:spec.constraints.map(c=>c.text),
      obligations:clone(spec.funnel_obligations||[]),
      provenance:{app:spec.app_type_src,audience:spec.audience_src,feature:job.kind==="feature"?(job.fallback?"fallback":"resolved"):"resolved",
        deep:spec.deep&&spec.deep.src||"unknown",resolution:job.resolution||"resolved"}},
    destination:dest,
    limits:{may_touch:[dest,"its own localStorage keys"],
      may_not_touch:["other jobs' sections","the harness UI","network","any file outside this packet"]},
    done_criteria:["syntax gate: code parses with zero errors",
      "boot gate: section boots in a sandboxed iframe with zero errors",
      "behavior gate: every declared check passes",
      "visible-path gate: output lands at "+dest+" and nowhere else"],
    weight:job.weight, rate_per_job:worker.rate,
    terms:clone(worker.terms), echo_required:true};
}
</script>
<script>
/* ================= GATES — every one really runs ================= */
function gateSyntax(js){
  try{ new Function(js); return {ok:true}; }catch(e){ return {ok:false,error:String(e).split("\n")[0]}; }
}
function bootDoc(built){
  return '<!DOCTYPE html><html><head><meta charset="utf-8"><style>'+APP_CSS+'</style></head><body>'+
   '<div class="app'+(built.theme==="dark"?" dark":"")+'">'+(built.banner||"")+
   '<section class="panel on">'+(built.html||"")+'</section></div>'+(built.overlay||"")+
   SCRIPT_OPEN+'window.__errs=[];window.onerror=function(m){window.__errs.push(String(m));};'+(built.js||"")+
   SCRIPT_CLOSE+'</body></html>';
}
function gateBoot(built){
  return new Promise(res=>{
    const errs=[]; let settled=false;
    const done=(ok,why)=>{ if(settled)return; settled=true; try{document.body.removeChild(fr);}catch(e){}
      res({ok:ok,errors:errs,why:why||""}); };
    const fr=document.createElement("iframe");
    fr.setAttribute("sandbox","allow-scripts allow-same-origin");
    fr.style.cssText="position:fixed;left:-9999px;width:390px;height:700px;visibility:hidden";
    const to=setTimeout(()=>done(false,"timeout"),9000);
    fr.onload=function(){ setTimeout(()=>{
      clearTimeout(to);
      try{ const w=fr.contentWindow, e2=w.__errs||[];
        const blank=(w.document.body.innerText||"").trim().length<20 && !(built.overlay||built.banner);
        done(e2.length===0&&!blank, e2[0]||(blank?"blank render":""));
      }catch(e){ done(false,String(e).split("\n")[0]); }
    },1400); };
    document.body.appendChild(fr); fr.srcdoc=bootDoc(built);
  });
}
async function gateBehavior(built,fr){
  // runs inside a live iframe created by the caller
  const out=[];
  for(const c of (built.checks||[])){
    try{ const r=fr.contentWindow.eval(c.code); out.push({name:c.name,ok:!!r}); }
    catch(e){ out.push({name:c.name,ok:false,error:String(e).split("\n")[0]}); }
  }
  return out;
}
async function verifyPart(part,feat,spec){
  const built=part.build(feat,spec);
  const syntax=gateSyntax(built.js||"");
  const result={built,syntax,boot:{ok:false},behavior:[],allOk:false};
  if(!syntax.ok)return result;
  // boot + behavior share one iframe
  const boot=await new Promise(res=>{
    const fr=document.createElement("iframe");
    fr.setAttribute("sandbox","allow-scripts allow-same-origin");
    fr.style.cssText="position:fixed;left:-9999px;width:390px;height:700px;visibility:hidden";
    const to=setTimeout(()=>{try{document.body.removeChild(fr);}catch(e){}res({fr:null,ok:false,why:"timeout"});},9000);
    fr.onload=function(){ setTimeout(async()=>{
      clearTimeout(to);
      try{ const w=fr.contentWindow,e2=w.__errs||[];
        const blank=(w.document.body.innerText||"").trim().length<20&&!(built.overlay||built.banner);
        if(e2.length||blank){try{document.body.removeChild(fr);}catch(e){}
          res({fr:null,ok:false,why:e2[0]||(blank?"blank render":"")});return;}
        const beh=await gateBehavior(built,fr);
        try{document.body.removeChild(fr);}catch(e){}
        res({fr:null,ok:true,behavior:beh});
      }catch(e){try{document.body.removeChild(fr);}catch(x){}res({fr:null,ok:false,why:String(e).split("\n")[0]});}
    },1400); };
    document.body.appendChild(fr); fr.srcdoc=bootDoc(built);
  });
  result.boot={ok:boot.ok,why:boot.why||""};
  result.behavior=boot.behavior||[];
  result.allOk=syntax.ok&&boot.ok&&result.behavior.every(b=>b.ok);
  return result;
}
/* ================= WORKER EXECUTION (simulated contractors, real assembly, real gates) ================= */
async function executeJob(job,spec){
  if(!harnessExecutionGate())return false;
  job.status="building"; job.tries=(job.tries||0)+1; render();
  const pkt=buildPacket(job,spec); job.packet=pkt; job.worker_id=pkt.issued_to.worker_id;
  log("<b>"+esc(pkt.issued_to.codename)+"</b> ("+pkt.issued_to.role+") takes <b>"+esc(job.id)+"</b> — "+esc(job.label)+
      " · weight "+job.weight+" · rate "+pkt.rate_per_job);
  await new Promise(r=>setTimeout(r,350)); // visible work beat
  if(job.kind==="integration"){ return await executeIntegration(job,spec); }
  const part=partById(job.part_id);
  const v=await verifyPart(part,{text:job.feature},spec);
  job.verify=v; job.code=v.built;
  const w=H.workers.find(x=>x.id===job.worker_id);
  if(v.allOk){ job.status="gated"; const p=payWorker(w,job.weight);
    const vw=H.workers.find(x=>x.role==="verifier"&&x.status==="active");
    const vp=vw?payWorker(vw,5):null;
    log("✓ <b>"+esc(job.id)+"</b> passed all gates — paid "+esc(w.codename)+" "+p.net+" (tax "+p.tax+" → bounty)"+
      (vp?" · verifier "+esc(vw.codename)+" "+vp.net:""));
  }else{ job.status="failed";
    const why=!v.syntax.ok?"syntax: "+v.syntax.error:(!v.boot.ok?"boot: "+(v.boot.why||"error"):"behavior: "+v.behavior.filter(b=>!b.ok).map(b=>b.name).join(", "));
    log("✗ <b>"+esc(job.id)+"</b> FAILED — "+esc(why));
    failWorker(w); log("  strike → <b>"+esc(w.codename)+"</b> ("+w.record.strikes+"/"+ECON.strikes_to_retire+")"+(w.status==="retired"?" — RETIRED":""));
  }
  render(); return v.allOk;
}
/* ================= INTEGRATION + REGRESSION ================= */
function assembleApp(jobs,spec){
  const okS=j=>j.status==="gated"||j.status==="approved";
  const themeJob=jobs.find(j=>j.kind==="theme"&&okS(j));
  const theme=themeJob?"dark":"light";
  let banner="",overlay="",nav=[],body=[],js=[];
  const deep=jobs.find(j=>j.kind==="deep"&&okS(j));
  if(deep){ banner+=deep.code.banner||""; overlay+=deep.code.overlay||"";
    if(deep.code.html){ nav.push("Main"); body.push('<section class="panel">'+deep.code.html+'</section>'); }
    js.push(deep.code.js||""); }
  jobs.filter(j=>j.kind==="feature"&&okS(j)).forEach((j,i)=>{
    nav.push((j.feature||"Section").slice(0,12)); body.push('<section class="panel">'+j.code.html+'</section>'); js.push(j.code.js||""); });
  if(!body.length)body.push('<section class="panel"><div class="card"><b>Empty app</b></div></section>');
  if(!nav.length)nav.push("Main");
  const html='<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">'+
   '<title>'+esc(spec.audience)+' app</title><style>'+APP_CSS+'</style></head><body>'+
   '<div class="app'+(theme==="dark"?" dark":"")+'"><header class="ahead">'+esc(spec.audience)+' app</header>'+
   '<main>'+banner+body.join("")+'</main><nav class="bottomnav">'+
   nav.map(n=>'<button>'+esc(n)+'</button>').join("")+'</nav></div>'+overlay+
   SCRIPT_OPEN+'window.__errs=[];window.onerror=function(m){window.__errs.push(String(m));};'+
   js.join("\n")+navJS()+SCRIPT_CLOSE+'</body></html>';
  return {html,theme,sections:body.length};
}
function seededAssemblyRandom(seed,fn){
  seed=String(seed||'moor');var h=2166136261>>>0;for(var i=0;i<seed.length;i++){h^=seed.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}
  var old=Math.random,x=h||1;Math.random=function(){x^=x<<13;x^=x>>>17;x^=x<<5;return ((x>>>0)%1000000)/1000000;};
  try{return fn();}finally{Math.random=old;}
}
function registerHarnessAssemblyExecutor(){
  if(!window.MoorAssembly||!MoorAssembly.registerExecutor)return;
  try{
    MoorAssembly.registerExecutor('harness.compose.v1',async function(args){
      args=args||{};var spec=args.spec||{},parts=args.parts||[],jobs=[];
      seededAssemblyRandom(args.seed||MoorAssembly.hash({spec:spec,parts:parts}),function(){
        parts.forEach(function(p,i){
          var part=partById(p.part||p.part_id);if(!part)throw new Error('Unknown Harness part '+(p.part||p.part_id));
          var feat={text:p.feature||part.name},built=part.build(feat,spec);
          jobs.push({id:p.job||('assembly-'+(i+1)),kind:part.kind,feature:p.feature||part.name,part_id:part.id,status:'gated',code:built,resolution:p.resolution||'replayed'});
        });
      });
      var result=assembleApp(jobs,spec);
      return {ok:true,outputs:{app_html:result.html,theme:result.theme,sections:result.sections},jobs:jobs.map(function(j){return {id:j.id,part_id:j.part_id,kind:j.kind};})};
    },{version:1,deterministic:true,source:'moor-harness-runtime-v1.html'});
  }catch(e){if(String(e&&e.message||e).indexOf('already registered')<0)throw e;}
}
registerHarnessAssemblyExecutor();

async function executeIntegration(job,spec){
  if(!harnessExecutionGate())return false;
  const parts=assembleApp(H.jobs.filter(j=>j!==job&&(j.status==="gated"||j.status==="approved")),spec);
  job.code={html:"(full app)",js:"(combined)",theme:parts.theme};
  // visible-path gate: every gated job's destination section is present
  const missing=H.jobs.filter(j=>j!==job&&(j.status==="gated"||j.status==="approved")&&j.kind!=="theme"&&j.kind!=="integration").filter(j=>{
    if(j.kind==="deep")return !(parts.html.includes(j.code.banner||"x")||parts.html.includes(j.code.overlay||"x")||(j.code.html&&parts.html.includes(j.code.html.slice(0,40))));
    return !(j.code.html&&parts.html.includes(j.code.html.slice(0,40))); });
  // regression: full app boots clean
  const boot=await gateBoot({html:'<div class="card">regression probe</div>',js:""});
  const fullBoot=await new Promise(res=>{ const fr=document.createElement("iframe");
    fr.setAttribute("sandbox","allow-scripts allow-same-origin");
    fr.style.cssText="position:fixed;left:-9999px;width:390px;height:700px;visibility:hidden";
    const to=setTimeout(()=>{try{document.body.removeChild(fr);}catch(e){}res({ok:false,why:"timeout"});},12000);
    fr.onload=function(){ setTimeout(()=>{ clearTimeout(to);
      try{ const e2=fr.contentWindow.__errs||[]; try{document.body.removeChild(fr);}catch(e){}
        res({ok:e2.length===0,why:e2[0]||""}); }catch(e){ res({ok:false,why:String(e)}); } },2000); };
    document.body.appendChild(fr); fr.srcdoc=parts.html; });
  job.verify={visiblePath:missing.length===0,missing:missing.map(m=>m.id),regression:fullBoot,
    allOk:missing.length===0&&fullBoot.ok};
  job.appHtml=parts.html;
  const w=H.workers.find(x=>x.id===job.worker_id);
  if(job.verify.allOk){ job.status="gated"; const p=payWorker(w,job.weight);
    log("✓ <b>integration</b> passed — visible-path ✓ regression ✓ — paid "+esc(w.codename)+" "+p.net); }
  else{ job.status="failed"; failWorker(w);
    log("✗ <b>integration</b> FAILED — "+esc(missing.length?"missing: "+missing.map(m=>m.id).join(","):"regression: "+fullBoot.why)); }
  render(); return job.verify.allOk;
}

<script>
/* ================= STATE + PIPELINE ================= */
const STAGES=[["intake","1 · Ramble"],["spec","2 · Spec"],["holes","3 · Holes"],["fit","4 · Fit"],["jobs","5 · Jobs"],["build","6 · Build"],["review","7 · Review"],["promote","8 · Promote"],["deliver","9 · Deliver"],["ledger","10 · Ledger"]];
let H=null;
function freshH(){ return {stage:"intake",ramble:"",spec:null,holes:[],fit:[],jobs:[],
  workers:[],cycles:0,versions:[],canon:"—",appHtml:"",mods:[],training:[],auto:false,
  funnelReceipt:null,funnelRequestId:null,page0:null,funnelSpec:null}; }
const NAMEPOOL=["Anvil","Bishop","Cinder","Drift","Ember","Flint","Gale","Harbor","Iris","Jolt","Kestrel","Lumen","Mesa","North","Onyx","Pico"];
function initWorkers(){ const pool=NAMEPOOL.slice();
  const mk=(role)=>{ const r=ROLESPEC[role];
    return {id:uid("wrk"),codename:(pool.splice(Math.floor(Math.random()*pool.length),1)[0]||"Rook")+"-"+Math.floor(Math.random()*90+10),
    role,blurb:r.blurb,rate:r.rate,balance:50,record:{done:0,failed:0,strikes:0},status:"active",terms:{paid_per_verified_job:true,tax:ECON.tax,strikes_to_retire:ECON.strikes_to_retire}}; };
  H.workers=[mk("planner"),mk("hole-poker"),mk("builder"),mk("builder"),mk("builder"),mk("verifier"),mk("integrator")]; }
function bumpVer(v){ const p=v.split("."); p[1]=+p[1]+1; return p.join("."); }

function renderStages(){ $("#stages").innerHTML=STAGES.map(s=>{
  const i=STAGES.findIndex(x=>x[0]===s[0]), cur=STAGES.findIndex(x=>x[0]===H.stage);
  const cls=s[0]===H.stage?"on":(i<cur?"done":"");
  return '<button class="stg '+cls+'" data-s="'+s[0]+'">'+s[1]+'</button>'; }).join("");
  document.querySelectorAll(".stg").forEach(b=>b.onclick=()=>{ H.stage=b.dataset.s; render(); }); }

/* ---------- stage: intake ---------- */
const SAMPLE_RAMBLE="I want a mobile app for gym owners to track invoices and send reminders. People sign in with their phone number. Dark mode. It should work offline.";
function vIntake(){ return `<div class="card"><h2>Ramble the goal</h2>
  <p class="sub">Dump everything — huge block, no structure needed. The compiler turns it into a spec; you confirm it before anything builds. Nothing you write here ever reaches a builder raw.</p>
  <textarea class="inp" id="ramble" placeholder="What are we building? Who's it for? What does it do?"></textarea>
  <div class="row" style="margin-top:10px">
    <button class="btn" id="compile">Compile spec →</button>
    <button class="ghost" id="usesample">Use sample ramble</button>
  </div></div>
  <div class="card"><h3>Adapters</h3><div class="kv">
   <dt>Brain</dt><dd>${esc(BRAIN.label)} · heuristic, local, transparent <span class="pill ok">$0</span></dd>
   <dt>Storage</dt><dd>localStorage with in-memory fallback · offline-first</dd>
   <dt>Network</dt><dd>none required — single file, no fetch</dd>
   <dt>Cost</dt><dd>all compute local <span class="pill ok">$0.00</span></dd></div></div>`; }

/* ---------- stage: spec ---------- */
function vSpec(){ const s=H.spec;
  const prov=v=>'<span class="pill '+(v==="you"?"you":"fill")+'">'+
    (v==="you"?"from you":v==="inferred"?"inferred":"fallback")+'</span>';
  return `<div class="card"><h2>Compiled spec</h2>
  <p class="sub">Compiled by ${esc(BRAIN.label)} from your ramble. <span class="pill fill">inferred / fallback</span> fields are local machine choices. They may teach working logic, but they are not treated as confirmed intent.</p>
  <div class="kv">
   <dt>App type</dt><dd>${esc(s.app_type)} ${prov(s.app_type_src)} <span class="pill">${esc(s.app_type_conf)} confidence</span></dd>
   <dt>Audience</dt><dd>${esc(s.audience)} ${prov(s.audience_src)}</dd>

  <div class="row" style="margin-top:10px"><button class="btn" id="gospec">Confirm spec → poke holes</button>
  <button class="ghost" id="back1">← Back</button></div></div>
  <details><summary>Raw ramble</summary><pre class="code">${esc(s.raw)}</pre></details>`; }

/* ---------- stage: holes ---------- */
function vHoles(){
  if(!H.holes.length)return `<div class="card"><h2>No holes found</h2><p class="sub">The spec survived the attack. Moving on.</p>
   <button class="btn" id="gofit">Fit check →</button></div>`;
  return `<div class="card"><h2>Poke holes <span class="pill run">${H.holes.length} open</span></h2>
  <p class="sub">The hole-poker attacked your spec. Resolve each, or accept the machine's fill.</p>
  ${H.holes.map(h=>`<div class="job work"><b>${esc(h.q)}</b><div class="row" style="margin-top:8px">
    ${h.opts.map(o=>'<button class="ghost" data-h="'+h.id+'" data-o="'+esc(o)+'">'+esc(o)+'</button>').join("")}
   </div></div>`).join("")}
  <div class="row" style="margin-top:10px"><button class="btn" id="gofit">Resolve & fit check →</button>
   <button class="ghost" id="fallbackholes">Fill open holes locally</button></div></div>`;
}
function applyHole(h,opt,source){
  const s=H.spec, src=source||"you";
  if(h.field==="audience"){s.audience=opt;s.audience_src=src;}
  if(h.field==="app_type"){s.app_type=opt;s.app_type_src=src;s.app_type_conf=src==="you"?"high":"low";}
  if(h.field==="deep"){s.deep.choice=opt;s.deep.src=src;}
  if(h.field==="conflict"){ if(opt.indexOf("offline")===0){s.deep.choice="local";s.deep.src=src;s.constraints=s.constraints.filter(c=>c.text!=="works offline");s.constraints.push({text:"works offline",source:src});} }
  if(h.field.indexOf("feat")===0){ const i=+h.field.slice(4);
    if(opt==="drop it"&&src==="you")s.features.splice(i,1);
    else if(opt!=="keep as-is"){s.features[i].text=s.features[i].text+" ("+opt+")";s.features[i].source=src;}
    else if(s.features[i])s.features[i].source=src; }
  H.holes=H.holes.filter(x=>x.id!==h.id);
}
function resolveOpenHolesByFallback(){
  const open=H.holes.slice();
  open.forEach(h=>{
    let opt=h.opts[0];
    if(h.field==="audience")opt=H.spec.audience;
    else if(h.field==="app_type")opt=H.spec.app_type;
    else if(h.field==="deep")opt=H.spec.deep.choice;
    else if(h.field.indexOf("feat")===0)opt="keep as-is";
    else if(h.field==="conflict"&&H.spec.constraints.some(c=>c.text==="works offline"))opt="offline wins (local-first)";
    applyHole(h,opt,"fallback");
  });
  if(open.length)log("<b>fallback resolver</b> closed "+open.length+" open hole"+(open.length===1?"":"s")+" — provenance preserved");
}
function acceptFitFallbacks(){
  H.fit.forEach(f=>{
    if(!f.ok){ f.ok=true; f.fallback=true; f.resolution="fallback-match"; }
    else if(!f.resolution)f.resolution="verified-match";

}

  <div class="log" id="runlog">${(H.logArr||[]).map(function(m){return "<div>"+m+"</div>";}).join("")}</div>

/* ---------- stage: review ---------- */
function gateRow(g){

}
function vReview(){

    return `<div class="job ${j.status==="gated"?"pass":j.status==="failed"?"fail":"work"}">
    <b class="mono">${j.id}</b> — ${esc(j.label)} <span class="pill">${j.status}</span>
    ${j.packet?`<div class="kv" style="margin-top:6px"><dt>Worker</dt><dd>${esc(j.packet.issued_to.codename)} (${j.packet.issued_to.role})</dd>
     <dt>Destination</dt><dd class="mono">${esc(j.packet.destination)}</dd></div>`:""}
    ${v.syntax?`<div class="gate"><span>syntax</span><span class="pill ${v.syntax.ok?"ok":"bad"}">${v.syntax.ok?"pass":"FAIL "+esc(v.syntax.error||"")}</span></div>`:""}
    ${v.boot?`<div class="gate"><span>boot (sandboxed iframe)</span><span class="pill ${v.boot.ok?"ok":"bad"}">${v.boot.ok?"pass":"FAIL "+esc(v.boot.why||"")}</span></div>`:""}
    ${(v.behavior||[]).map(b=>`<div class="gate"><span>${esc(b.name)}</span><span class="pill ${b.ok?"ok":"bad"}">${b.ok?"pass":"FAIL"}</span></div>`).join("")}
    ${v.visiblePath!==undefined?`<div class="gate"><span>visible-path</span><span class="pill ${v.visiblePath?"ok":"bad"}">${v.visiblePath?"pass":"FAIL"}</span></div>`:""}
    ${v.regression?`<div class="gate"><span>regression (full app boot)</span><span class="pill ${v.regression.ok?"ok":"bad"}">${v.regression.ok?"pass":"FAIL "+esc(v.regression.why||"")}</span></div>`:""}
    <div class="row" style="margin-top:8px">
     <button class="ghost" data-ap="${j.id}" ${j.status!=="gated"?"disabled":""}>Approve</button>
     <button class="ghost" data-rj="${j.id}" ${(j.status==="gated"||j.status==="failed")?"":"disabled"}>Reject + revise</button>
     <button class="ghost" data-cd="${j.id}">Code</button>
    </div><pre class="code" id="cd-${j.id}" style="display:none">${esc((j.code&&(j.code.js||"")||"").slice(0,1200))}</pre></div>`; }).join("")}
  <div class="row" style="margin-top:10px"><button class="btn" id="gopromote" ${H.jobs.some(j=>j.status!=="approved")?"disabled":""}>Promote candidate →</button></div>
  ${H.jobs.some(j=>j.status!=="approved")?'<p class="note">Approve every job to promote. Rejected jobs can be revised first.</p>':""}</div>`;
}

/* ---------- stage: promote ---------- */
function vPromote(){
  const ready=H.jobs.length&&H.jobs.every(j=>j.status==="approved");
  const integ=H.jobs.find(j=>j.kind==="integration");
  const next=H.canon==="—"?"1.0":bumpVer(H.canon);
  return `<div class="card"><h2>Promotion</h2>
  <p class="sub">Candidate → canonical. The version graph is the verdict history: keep the one you like.</p>
  <div class="kv"><dt>Canonical now</dt><dd><b>v${H.canon}</b></dd>
   <dt>Candidate</dt><dd>v${next} · ${H.jobs.filter(j=>j.status==="approved").length}/${H.jobs.length} jobs approved</dd></div>
  ${H.versions.map(v=>'<div class="job pass"><b>v'+v.v+'</b> — '+v.jobs+' jobs · '+esc(v.note)+'</div>').join("")}
  <div class="row" style="margin-top:10px">
   <button class="btn" id="dopromote" ${ready?"":"disabled"}>Promote v${next} → canonical</button></div>
  ${ready?"":'<p class="note">Approve all jobs in Review first.</p>'}</div>`;
}

/* ---------- stage: deliver ---------- */
function vDeliver(){
  return `<div class="card"><h2>Delivered — v${H.canon}</h2>
  <p class="sub">The running app, built by the pipeline. Download it, open it anywhere — it's a single file.</p>
  <iframe class="appview" id="appview" sandbox="allow-scripts allow-same-origin allow-popups allow-downloads"></iframe>
  <div class="row" style="margin-top:10px">
   <button class="btn" id="dl">⤓ Download app .html</button>
   <button class="ghost" id="openapp">Open separately</button></div></div>
  <div class="card"><h2>Propose a modification ◈</h2>
  <p class="sub">Mods are just the pipeline run again on a built app. Ramble the change.</p>
  <textarea class="inp" id="modramble" placeholder="e.g. add a dark theme, add a stats dashboard…"></textarea>
  <div class="row" style="margin-top:8px"><button class="btn" id="gomod">Run mod pipeline →</button></div>
  <div id="modlog">${H.mods.map(m=>'<div class="job pass"><b>'+esc(m.name)+'</b> → v'+m.v+' <span class="pill ok">★ feature</span></div>').join("")}</div></div>`;
}

/* ---------- stage: ledger ---------- */
function vLedger(){
  return `<div class="card"><h2>Worker ledger</h2>
  <p class="sub">Public record — wins and failures both on the board. Paid per <b>verified</b> job only. Upkeep ${ECON.upkeep}/cycle · tax ${(ECON.tax*100)}% → bounty pool.</p>
  <div class="kv"><dt>Bounty pool</dt><dd><b>${ECON.bounty.toFixed(2)}</b></dd><dt>Cycles run</dt><dd>${H.cycles}</dd></div>
  <table style="margin-top:8px"><tr><th>Worker</th><th>Role</th><th>Balance</th><th>Done</th><th>Failed</th><th>Strikes</th><th>Status</th></tr>
  ${H.workers.map(w=>`<tr><td><b>${esc(w.codename)}</b></td><td>${w.role}</td><td>${w.balance.toFixed(2)}</td>
   <td>${w.record.done}</td><td>${w.record.failed}</td><td>${w.record.strikes}</td>
   <td><span class="pill ${w.status==="active"?"ok":w.status==="strained"?"fill":"bad"}">${w.status}</span></td></tr>`).join("")}
  </table>
  <p class="note">The deal, briefed up front: paid per verified job · failed verification pays 0 · ${ECON.strikes_to_retire} strikes → public failure mark + retirement + deletion.</p></div>`;
}


/* ================= SEALED FUNNEL HANDOFF ================= */
const HARNESS_INBOX_KEY="moor-harness-inbox-v1";
function harnessKernel(){ return window.MOORFunnelKernel||null; }
function verifiedHarnessReceipt(input,receipt){
  const k=harnessKernel();
  return !!(k&&receipt&&k.verifyReceipt(receipt)&&k.hash(String(input||""))===receipt.page0_hash);
}
function specFromVerdict(packet,input){
  const fs=(packet&&packet.spec)||{}, base=compileSpec(input);
  const map={"A mobile app":"mobile app","A web app":"web app","A game":"game","A handy tool":"web app"};
  if(fs.kind&&map[fs.kind]){base.app_type=map[fs.kind];base.app_type_src="funnel";base.app_type_conf="high";}
  if(fs.who){base.audience=fs.who;base.audience_src="funnel";}
  const feats=[];
  if(fs.core)feats.push({text:String(fs.core),weight:10,source:"funnel"});
  (fs.must_haves||[]).forEach(function(x){if(x&&!feats.some(function(f){return f.text===x}))feats.push({text:String(x),weight:8,source:"funnel"});});
  if(feats.length)base.features=feats.slice(0,6);
  base.funnel_obligations=clone(fs.obligations||[]);
  base.funnel_spec=clone(fs);
  base.effective_input=JSON.stringify(fs);
  base.provenance_mode="funnel-receipt";
  return base;
}
function ingestHarnessHandoff(h){
  if(!h||h.schema!=="moor.harness-inbox"||!h.verdict_packet)return false;
  const p=h.verdict_packet, receipt=p.funnel_receipt;
  if(!verifiedHarnessReceipt(h.input,receipt)){log("<b>handoff refused</b> — invalid Funnel receipt");return false;}
  H.page0=String(h.input||"");
  H.ramble="[sealed Page 0 · "+receipt.request_id+"]";
  H.spec=specFromVerdict(p,H.page0);
  H.funnelSpec=clone(p.spec||{});
  H.funnelReceipt=clone(receipt);
  H.funnelRequestId=receipt.request_id;
  H.stage="spec";
  try{store.remove(HARNESS_INBOX_KEY);}catch(e){}
  log("<b>Funnel receipt verified ✓</b> — "+esc(receipt.fingerprint));
  return true;
}
function consumeHarnessInbox(){
  let h=null; try{h=JSON.parse(store.get(HARNESS_INBOX_KEY)||"null");}catch(e){}
  return ingestHarnessHandoff(h);
}
function harnessExecutionGate(){
  const ok=verifiedHarnessReceipt(H.page0,H.funnelReceipt);
  if(!ok)log("<b>execution refused</b> — Harness requires a valid Funnel receipt for this exact Page 0");
  return ok;
}
async function routeRawIntakeToFunnel(raw,context){
  if(!window.MOOR||typeof MOOR.request!=="function"){log("<b>intake locked</b> — MOOR.request unavailable");return null;}
  const r=await MOOR.request({input:raw,source:"app-compiler-harness",context:context||{},forceFunnel:true});
  if(r.route==="harness"){consumeHarnessInbox();render();}
  else log("<b>sent to Funnel</b> — raw intake cannot compile directly");
  return r;
}

/* ================= RENDER ================= */
function render(){
  renderStages();
  const v={intake:vIntake,spec:vSpec,holes:vHoles,fit:vFit,jobs:vJobs,build:vBuild,review:vReview,promote:vPromote,deliver:vDeliver,ledger:vLedger}[H.stage];
  $("#main").innerHTML=v();
  wire();
  if(H.stage==="deliver"&&H.appHtml){ $("#appview").srcdoc=H.appHtml; }
}
function wire(){
  const on=(id,fn)=>{ const e=$(id); if(e)e.onclick=fn; };
  on("#usesample",()=>{ $("#ramble").value=SAMPLE_RAMBLE; });
  on("#compile",async()=>{ const r=$("#ramble").value.trim(); if(!r)return;
    await routeRawIntakeToFunnel(r,{mode:"build"}); });
  on("#gospec",()=>{ const pl=H.workers.find(w=>w.role==="planner"&&w.status==="active");
    if(pl){const p=payWorker(pl,8); log("planner "+esc(pl.codename)+" paid "+p.net+" — spec compiled");}
    H.holes=pokeHoles(H.spec); H.stage="holes"; render(); });
  on("#back1",()=>{ H.stage="intake"; render(); });
  on("#fallbackholes",()=>{ resolveOpenHolesByFallback(); render(); });
  on("#gofit",()=>{ const hp=H.workers.find(w=>w.role==="hole-poker"&&w.status==="active");
    if(hp){const p=payWorker(hp,6); log("hole-poker "+esc(hp.codename)+" paid "+p.net+" — holes attacked");}
    if(H.holes.length)resolveOpenHolesByFallback();
    H.fit=fitCheck(H.spec); H.stage="fit"; render(); });
  on("#gojobs",()=>{ acceptFitFallbacks(); H.jobs=buildJobs(H.spec,H.fit); H.stage="jobs"; render(); });
  on("#gobuild",()=>{ H.stage="build"; render(); runBuild(); });
  on("#goreview",()=>{ H.stage="review"; render(); });
  on("#gopromote",()=>{ H.stage="promote"; render(); });
  on("#dopromote",doPromote);
  on("#dl",()=>download("moor-app-v"+H.canon+".html",H.appHtml));
  on("#openapp",()=>{ const w=window.open("","_blank"); w.document.write(H.appHtml); w.document.close(); });
  on("#gomod",runMod);
  document.querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>{
    const h=H.holes.find(x=>x.id===b.dataset.h); applyHole(h,b.dataset.o); render(); });
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{
    const f=H.fit[+b.dataset.f]; f.best=b.dataset.p;
    const p=partById(b.dataset.p); f.bestName=p.name; f.score=fitScore({text:f.text},p); f.ok=f.score>=2; render(); });
  document.querySelectorAll("[data-pkt]").forEach(b=>b.onclick=()=>{
    const j=H.jobs.find(x=>x.id===b.dataset.pkt);
    if(!j.packet)j.packet=buildPacket(j,H.spec);
    const pre=$("#pkt-"+j.id); pre.style.display=pre.style.display==="none"?"block":"none";
    pre.textContent=JSON.stringify(j.packet,null,2); });
  document.querySelectorAll("[data-cd]").forEach(b=>b.onclick=()=>{
    const pre=$("#cd-"+b.dataset.cd); pre.style.display=pre.style.display==="none"?"block":"none"; });
  document.querySelectorAll("[data-ap]").forEach(b=>b.onclick=()=>{
    const j=H.jobs.find(x=>x.id===b.dataset.ap); j.status="approved"; log("approved "+j.id); render(); });
  document.querySelectorAll("[data-rj]").forEach(b=>b.onclick=()=>reviseJob(b.dataset.rj));
}
/* ================= ORCHESTRATION ================= */
async function runBuild(){
  if(!harnessExecutionGate())return;
  for(const job of H.jobs){
    if(job.status==="gated"||job.status==="approved")continue;
    const depsOk=job.deps.every(d=>{ const dj=H.jobs.find(x=>x.id===d); return dj&&(dj.status==="gated"||dj.status==="approved"); });
    if(!depsOk){ job.status="blocked"; continue; }
    await executeJob(job,H.spec);
  }
  const go=$("#goreview"); if(go)go.disabled=false;
  log("<b>Build round complete.</b> Review each job →");
  render();
}
async function reviseJob(jid){
  if(!harnessExecutionGate())return;
  const job=H.jobs.find(x=>x.id===jid); if((job.tries||0)>=3){ log("max tries — needs a human"); return; }
  if(job.kind==="feature"){
    const ranked=PARTS.filter(p=>p.kind==="feature")
      .map(p=>({p,s:fitScore({text:job.feature},p)})).sort((a,b)=>b.s-a.s);
    const next=ranked.find(r=>r.p.id!==job.part_id);
    if(next){ job.part_id=next.p.id; job.label=next.p.name+" — "+job.feature;
      log("revising "+job.id+" → "+next.p.name); }
  }
  job.status="planned"; H.stage="build"; render(); await executeJob(job,H.spec);
  H.stage="review"; render();
}
function emitMoorOutput(detail){
  try{window.dispatchEvent(new CustomEvent("moor:output",{detail}));}catch(e){}
  try{if(parent&&parent!==window)parent.postMessage({type:"moor:output",detail},"*");}catch(e){}
}
function harnessRecipe(){
  return {spec:H.spec,parts:H.jobs.filter(function(j){return j.part_id;}).map(function(j){return {job:j.id,part:j.part_id,feature:j.feature,resolution:j.resolution||'resolved'};})};
}
function harnessAssemblyContract(next){
  var recipe=harnessRecipe();
  if(!window.MoorAssembly)return null;
  return MoorAssembly.createContract({
    artifact_id:'implementation:harness:'+next,version:next,source_hash:MoorAssembly.hash(recipe),
    inputs:[],dependencies:[{id:'moor-harness-runtime-v1.html',version:'1'}],
    operations:[{id:'compose-app',op:'harness.compose.v1',args:{spec:recipe.spec,parts:recipe.parts,seed:MoorAssembly.hash(recipe)}}],
    required_executors:['harness.compose.v1'],outputs:[{name:'app_html',type:'moor.app.html'}],
    verification:[{kind:'gate-suite',value:'syntax+boot+behavior+integration+regression'}],
    rollback:{kind:'prior-canonical',version:H.canon},
    determinism:{mode:'deterministic-source',excludes:['declared runtime randomness','external network/data']},
    meta:{implementation_ref:'moor-harness-runtime-v1.html#v'+next}
  });
}
function harnessCapabilities(next,assembly,evidence){
  var out=[],ev='evidence:'+((window.MoorAssembly&&MoorAssembly.hash)?MoorAssembly.hash(evidence):next);
  H.jobs.filter(function(j){return j.part_id&&(j.status==='gated'||j.status==='approved');}).forEach(function(j){
    var p=partById(j.part_id);if(!p)return;
    out.push({capability_id:'harness.part.'+p.id,version:'1',status:'machine-verified',
      provides:['part:'+p.id],requires:[],input_types:[p.kind==='theme'?'moor.theme.request':'moor.feature.request'],
      output_types:[p.kind==='theme'?'moor.ui.theme':'moor.ui.fragment'],knobs:{feature:'string'},events:[],state:{},
      side_effects:[],compatibility:{executor:'harness.compose.v1'},implementation_ref:'moor-harness-runtime-v1.html',
      assembly_contract_hash:assembly&&assembly.content_hash||null,evidence_refs:[ev],tags:(p.caps||[]).slice()});
  });
  out.push({capability_id:'harness.assemble.moor-app',version:'1',status:'machine-verified',provides:['assemble:moor-app'],
    requires:out.filter(function(c){return c.output_types.indexOf('moor.ui.fragment')>=0;}).map(function(c){return c.capability_id;}),
    input_types:['moor.ui.fragment','moor.ui.theme'],output_types:['moor.app.html'],knobs:{},events:[],state:{},
    side_effects:[],compatibility:{executor:'harness.compose.v1'},implementation_ref:'moor-harness-runtime-v1.html#v'+next,
    assembly_contract_hash:assembly&&assembly.content_hash||null,evidence_refs:[ev]});
  return out;
}
function doPromote(){
  if(!harnessExecutionGate())return;
  const integ=H.jobs.find(j=>j.kind==="integration");
  if(!integ||integ.status!=="approved"||!integ.appHtml){ log("<b>promotion refused</b> — integration not verified"); return; }
  const next=H.canon==="—"?"1.0":bumpVer(H.canon);
  H.appHtml=integ.appHtml; H.canon=next;
  const prov=[H.spec.app_type_src,H.spec.audience_src,H.spec.deep&&H.spec.deep.src]
    .concat(H.spec.features.map(f=>f.source)).concat(H.spec.constraints.map(c=>c.source));
  const fallbackCount=prov.filter(x=>x==="fallback").length;
  const explicitCount=prov.filter(x=>x==="you").length;
  const evidence={v:next,at:new Date().toISOString(),request:H.spec.raw||"",effective_input:H.spec.effective_input||H.spec.raw||"",
    logic:{status:"verified-working",gates:"syntax+boot+behavior+integration+regression"},
    intent:{status:H.auto?"unjudged":"user-reviewed",explicit:explicitCount,total:prov.length,fallback:fallbackCount},
    lesson:fallbackCount?"working logic; intent confidence separate":"working logic with resolved intent"};
  H.training.push(evidence);
  H.versions.push({v:next,jobs:H.jobs.length,note:H.spec.audience+" "+H.spec.app_type,training:evidence});
  store.set("moor-harness",JSON.stringify({canon:H.canon,versions:H.versions.map(v=>({v:v.v,note:v.note}))}));
  let bank=[]; try{bank=JSON.parse(store.get("moor-harness-training")||"[]");if(!Array.isArray(bank))bank=[];}catch(e){}
  bank.push(evidence); if(bank.length>200)bank=bank.slice(-200); store.set("moor-harness-training",JSON.stringify(bank));
  emitMoorOutput({
    id:"implementation:harness:"+next,kind:"implementation",title:H.spec.app_type+" v"+next,
    summary:"Harness-promoted application that passed syntax, boot, behavior, integration, and regression gates.",
    source:{app:"app-compiler-harness",component:"app-compiler-harness",project:"harness"},
    concepts:[H.spec.app_type],status:"machine-verified",provenance:"verified",
    intent:H.spec.raw||H.spec.effective_input||"",intent_status:H.auto?"unjudged":"user-reviewed",
    intent_provenance:H.spec.input_was_empty?"fallback":"explicit",
    recipe:harnessRecipe(),\n    assembly_contract:assemblyContract,capabilities:capabilityDelta,learning_capsule:learningCapsule,
    implementation_ref:"moor-harness-runtime-v1.html#v"+next,
    payload:{version:next,canon:H.canon,jobs:H.jobs.map(j=>({id:j.id,kind:j.kind,status:j.status,part_id:j.part_id||null}))},
    evidence:evidence
  });
  H.stage="deliver"; render();
}
async function runMod(){
  const r=$("#modramble").value.trim(); if(!r)return;
  await routeRawIntakeToFunnel(r,{mode:"modify",base_version:H.canon});
}
/* ---------- auto-run: the funnel runs itself ---------- */
async function autoRun(){
  H.auto=true;
  $("#ramble")&&($("#ramble").value=SAMPLE_RAMBLE);
  await routeRawIntakeToFunnel(SAMPLE_RAMBLE,{mode:"demo"});
  H.auto=false;
}
/* ================= INIT ================= */
H=freshH(); initWorkers(); consumeHarnessInbox();
window.addEventListener("storage",function(e){if(e.key===HARNESS_INBOX_KEY&&e.newValue){if(consumeHarnessInbox())render();}});
$("#autorun").onclick=()=>{ H=freshH(); initWorkers(); H.stage="intake"; render();
  setTimeout(()=>{ $("#ramble").value=SAMPLE_RAMBLE; },50); setTimeout(autoRun,400); };
$("#cycle").onclick=()=>{ runUpkeepCycle(); render(); };
$("#reset").onclick=()=>{ H=freshH(); initWorkers(); ECON.bounty=0; render(); };
render();
</script>
