 * T3lite geometry fns, furnHelpers, frameMat, seeded RNG, material tables,
 * ALL builders) from pulse-v2/tools/tool-furniture.js. The renderer, mount /

    var nx=px-qx, ny=py-qy, nz=pz-qz, l=Math.sqrt(nx*nx+ny*ny+nz*nz)||1;

    return [[qx+nx*r, qy+ny*r, qz+nz*r],[nx,ny,nz]]; }
  function gridFace(fixed,axis,sign){
    var base=[], idx=[], e=[hw,hh,hd];
    for(var i=0;i<=seg;i++) for(var j=0;j<=seg;j++){
      var u=i/seg*2-1, v=j/seg*2-1, p=[0,0,0];
      p[axis]=sign*fixed;
      p[(axis+1)%3]=u*e[(axis+1)%3]; p[(axis+2)%3]=v*e[(axis+2)%3];
      var s=surf(p[0],p[1],p[2]);
      base.push(s); idx.push(base.length-1); }
    for(var a=0;a<seg;a++) for(var b=0;b<seg;b++){
      var r0=idx[a*(seg+1)+b], r1=idx[(a+1)*(seg+1)+b],
          r2=idx[(a+1)*(seg+1)+b+1], r3=idx[a*(seg+1)+b+1];
      var A=base[r0],B=base[r1],C=base[r2],D=base[r3];
      if(sign>0){ tri(G,A[0],B[0],C[0],A[1],B[1],C[1]); tri(G,A[0],C[0],D[0],A[1],C[1],D[1]); }
      else { tri(G,A[0],C[0],B[0],A[1],C[1],B[1]); tri(G,A[0],D[0],C[0],A[1],D[1],C[1]); } } }
  gridFace(hw,0,1); gridFace(hw,0,-1);
  gridFace(hh,1,1); gridFace(hh,1,-1);
  gridFace(hd,2,1); gridFace(hd,2,-1);
  return G; }

/* Lathe: surface of revolution. Turned legs, vases, lamp bases, bowls, mugs. */
function latheGeo(profile,segs){
  segs=segs||28; var G=newGeo(), i, j;
  var rings=[];
  for(i=0;i<profile.length;i++){
    var pr=profile[i][0], py=profile[i][1], ring=[];
    for(j=0;j<=segs;j++){ var a=j/segs*TAU;
      ring.push([pr*Math.cos(a),py,pr*Math.sin(a)]); }
    rings.push(ring); }
  function profNormal(i){
    var a=profile[Math.max(0,i-1)], b=profile[Math.min(profile.length-1,i+1)];
    var dr=b[0]-a[0], dy=b[1]-a[1], l=Math.sqrt(dr*dr+dy*dy)||1;
    return [dy/l, -dr/l]; /* (r-comp, y-comp), outward */ }
  for(i=0;i<profile.length-1;i++){
    var n0=profNormal(i), n1=profNormal(i+1);
    for(j=0;j<segs;j++){
      var a0=j/segs*TAU, a1=(j+1)/segs*TAU;
      var ca0=Math.cos(a0),sa0=Math.sin(a0),ca1=Math.cos(a1),sa1=Math.sin(a1);
      var p00=rings[i][j],p01=rings[i][j+1],p10=rings[i+1][j],p11=rings[i+1][j+1];
      var nn00=[n0[0]*ca0,n0[1],n0[0]*sa0], nn01=[n0[0]*ca1,n0[1],n0[0]*sa1],
          nn10=[n1[0]*ca0,n1[1],n1[0]*sa0], nn11=[n1[0]*ca1,n1[1],n1[0]*sa1];
      tri(G,p00,p10,p11,nn00,nn10,nn11);
      tri(G,p00,p11,p01,nn00,nn11,nn01); } }
  /* end caps */
  function cap(ri,y,flip){
    var r0=profile[ri][0];
    if(r0<0.004) return;
    var c=[0,y,0], cn=[0,flip,0];
    for(j=0;j<segs;j++){
      var q0=rings[ri][j], q1=rings[ri][j+1];
      if(flip>0) tri(G,c,q0,q1,cn,cn,cn); else tri(G,c,q1,q0,cn,cn,cn); } }
  cap(0,profile[0][1],-1); cap(profile.length-1,profile[profile.length-1][1],1);
  return G; }

function cylGeo(rt,rb,h,rad){ rad=rad||20;
  var G=newGeo(),i;
  for(i=0;i<rad;i++){ var a0=i/rad*TAU,a1=(i+1)/rad*TAU;
    var c0=Math.cos(a0),s0=Math.sin(a0),c1=Math.cos(a1),s1=Math.sin(a1);
    var p00=[rb*c0,-h/2,rb*s0],p01=[rb*c1,-h/2,rb*s1],
        p10=[rt*c0,h/2,rt*s0],p11=[rt*c1,h/2,rt*s1];
    var n0=[c0,0,s0],n1=[c1,0,s1];
    tri(G,p00,p10,p11,n0,n0,n1); tri(G,p00,p11,p01,n0,n1,n1); }
  function cap2(y,r,ny){ var c=[0,y,0],cn=[0,ny,0];
    for(i=0;i<rad;i++){ var b0=i/rad*TAU,b1=(i+1)/rad*TAU;
      var q0=[r*Math.cos(b0),y,r*Math.sin(b0)],q1=[r*Math.cos(b1),y,r*Math.sin(b1)];
      if(ny>0) tri(G,c,q0,q1,cn,cn,cn); else tri(G,c,q1,q0,cn,cn,cn); } }
  cap2(-h/2,rb,-1); cap2(h/2,rt,1);
  return G; }
function sphGeo(r,ws,hs){ ws=ws||18; hs=hs||12; var G=newGeo(),i,j;
  for(i=0;i<hs;i++) for(j=0;j<ws;j++){
    var u0=i/hs*Math.PI,u1=(i+1)/hs*Math.PI,v0=j/ws*TAU,v1=(j+1)/ws*TAU;
    function pt(u,v){ return [r*Math.sin(u)*Math.cos(v),r*Math.cos(u),r*Math.sin(u)*Math.sin(v)]; }
    function nm(p){ var l=Math.sqrt(p[0]*p[0]+p[1]*p[1]+p[2]*p[2])||1; return [p[0]/l,p[1]/l,p[2]/l]; }
    var a=pt(u0,v0),b=pt(u1,v0),c=pt(u1,v1),d=pt(u0,v1);
    tri(G,a,b,c,nm(a),nm(b),nm(c)); tri(G,a,c,d,nm(a),nm(c),nm(d)); }
  return G; }
function torGeo(R,r,rs,ts,arc){ rs=rs||10; ts=ts||28; arc=(arc==null?TAU:arc);
  var G=newGeo(),i,j;
  for(i=0;i<ts;i++){
    for(j=0;j<rs;j++){
      var u0=i/ts*arc,u1=(i+1)/ts*arc,v0=j/rs*TAU,v1=(j+1)/rs*TAU;
      function pt(u,v){ var cu=Math.cos(u),su=Math.sin(u);
        return [(R+r*Math.cos(v))*cu,r*Math.sin(v),(R+r*Math.cos(v))*su]; }
      function nm(u,v){ var cv=Math.cos(v),sv=Math.sin(v);
        return [cv*Math.cos(u),sv,cv*Math.sin(u)]; }
      var a=pt(u0,v0),b=pt(u1,v0),c=pt(u1,v1),d=pt(u0,v1);
      tri(G,a,b,c,nm(u0,v0),nm(u1,v0),nm(u1,v1)); tri(G,a,c,d,nm(u0,v0),nm(u1,v1),nm(u0,v1)); } }
  return G; }

var T3lite={
  Group:Group, Mesh:Mesh,
  BoxGeometry:function(w,h,d){ return boxGeo(w,h,d); },
  RBoxGeometry:function(w,h,d,r,s){ return rboxGeo(w,h,d,r,s); },
  CylinderGeometry:function(rt,rb,h,rad){ return cylGeo(rt,rb,h,rad||20); },
  SphereGeometry:function(r,ws,hs){ return sphGeo(r,ws,hs); },
  TorusGeometry:function(R,r,rs,ts,arc){ return torGeo(R,r,rs,ts,arc); },
  LatheGeometry:function(prof,segs){ return latheGeo(prof,segs); }
};

/* ---------------- materials (from the foundry, verbatim) ---------------- */
function hexRGB(h){ h=String(h).replace('#','');
  return [parseInt(h.slice(0,2),16)/255,parseInt(h.slice(2,4),16)/255,parseInt(h.slice(4,6),16)/255]; }
function stdMat(o){ o=o||{};
  return { color:o.color||[0.8,0.8,0.8],
    emissive:o.emissive||[0,0,0], emissiveIntensity:o.emissiveIntensity||0,
    opacity:(o.opacity==null?1:o.opacity), transparent:!!o.transparent,
    wood:o.wood?1:0, woodB:o.woodB||[0,0,0], fabric:o.fabric?1:0, metal:o.metal?1:0 }; }

/* wood species: [base, grain] */
var WOODS={

  walnut: {base:'#6d4a2e', grain:'#472d1a', name:'Walnut'},

};
var FABRICS=[
  {c:'#d9d0bf',n:'Oat linen'},{c:'#e7e0d0',n:'Bouclé'},{c:'#2f5d50',n:'Emerald velvet'},
  {c:'#b45f3c',n:'Rust weave'},{c:'#d9a441',n:'Mustard'},{c:'#5a6470',n:'Slate'},
  {c:'#8a4b5c',n:'Mauve'},{c:'#3e4a5a',n:'Ink blue'}
];
var LEATHERS=[{c:'#a05a2c',n:'Cognac'},{c:'#26221e',n:'Black'},{c:'#7a4a2e',n:'Saddle'}];
var PAINTS=[
  {c:'#ece5d8',n:'Cream'},{c:'#a8b09a',n:'Sage'},{c:'#3a3d40',n:'Charcoal'},

];

function makeMats(style, R){
  var woodKey=R.pick(Object.keys(WOODS));

  var fab=R.pick(FABRICS), lea=R.pick(LEATHERS);
  var paint=R.pick(PAINTS);
  function wood(){ return stdMat({color:hexRGB(W.base),woodB:hexRGB(W.grain),wood:1}); }
  function woodDark(){ var w=WOODS[R.pick(['walnut','ebony'])];
    return stdMat({color:hexRGB(w.base),woodB:hexRGB(w.grain),wood:1}); }
  return {
    woodName:W.name, fabricName:fab.n, leatherName:lea.n,
    wood:wood(), woodDark:woodDark(),
    fabric:stdMat({color:hexRGB(fab.c),fabric:1}),
    fabric2:stdMat({color:hexRGB(R.pick(FABRICS).c),fabric:1}),
    leather:stdMat({color:hexRGB(lea.c),fabric:1}),
    paint:stdMat({color:hexRGB(paint.c)}),

    ceramic2:stdMat({color:hexRGB(R.pick(CERAMICS))}),
    glass:stdMat({color:hexRGB('#cfd8dc'),opacity:0.35,transparent:true}),
    bulb:stdMat({color:hexRGB('#fff2ce'),emissive:hexRGB('#ffdf9c'),emissiveIntensity:1.6}),
    shade:stdMat({color:hexRGB('#f2ead8'),fabric:1,emissive:hexRGB('#ffedbe'),emissiveIntensity:0.55}),
    flame:stdMat({color:hexRGB('#ff9a3c'),emissive:hexRGB('#ff7a1a'),emissiveIntensity:2.2}),
    screen:stdMat({color:hexRGB('#8fa8bd'),emissive:hexRGB('#4a6a8a'),emissiveIntensity:0.8}),
    paper:stdMat({color:hexRGB('#f4f1e8')}),
    leaf:stdMat({color:hexRGB('#4a7a3f')}),
    leafDark:stdMat({color:hexRGB('#33592c')}),
    soil:stdMat({color:hexRGB('#2e2118')}),
    steel:stdMat({color:hexRGB('#a8adb2'),metal:1}),
    glassGreen:stdMat({color:hexRGB('#2a4a34'),opacity:0.55,transparent:true}),
    mirror:stdMat({color:hexRGB('#b8c8d0'),metal:1,opacity:0.92,transparent:true}),

}

/* book material cache per build (bookshelf fills it) */
function bookMatsFor(R){
  var cols=['#8a4b3c','#3c5a7a','#5a6e4a','#b08d4f','#6e4a6e','#a8a092','#384048','#94552f'];

/* ---------------- builder helpers (from the foundry, adapted) ----------------
 * Adaptation: each created Mesh is tagged with _matKey (the material key the
 * builder passed) and _geoKind so the flattener can report material keys per
 * triangle without needing the renderer. Geometry calls are verbatim. */
function furnHelpers(mats){
  function M(parent,geo,matKey,kind,x,y,z){
    var o=new T3lite.Mesh(geo,mats[matKey]);
    o._matKey=matKey; o._geoKind=kind||'mesh';
    o.position.set(x||0,y||0,z||0);
    parent.add(o); return o; }
  function rbox(parent,matKey,x,y,z,w,h,d,r){
    return M(parent,new T3lite.RBoxGeometry(w,h,d,r==null?Math.min(w,h,d)*0.2:r),matKey,'rbox',x,y,z); }
  function box(parent,matKey,x,y,z,w,h,d){
    return M(parent,new T3lite.BoxGeometry(w,h,d),matKey,'box',x,y,z); }
  function cyl(parent,matKey,x,y,z,rt,rb,h,rad){
    return M(parent,new T3lite.CylinderGeometry(rt,rb,h,rad||20),matKey,'cyl',x,y,z); }
  function sph(parent,matKey,x,y,z,r,sx,sy,sz){
    var o=M(parent,new T3lite.SphereGeometry(r,20,14),matKey,'sph',x,y,z);
    if(sx)o.scale.set(sx,sy==null?sx:sy,sz==null?sx:sz); return o; }
  function tor(parent,matKey,x,y,z,R,r,arc){
    return M(parent,new T3lite.TorusGeometry(R,r,10,28,arc==null?TAU:arc),matKey,'tor',x,y,z); }
  function lathe(parent,matKey,x,y,z,profile,segs){
    return M(parent,new T3lite.LatheGeometry(profile,segs||28),matKey,'lathe',x,y,z); }
  /* rod between two points (from vehicle builder) */
  function rod(parent,a,b,r,matKey){
    matKey=matKey||'blackMetal';
    var A=new V3(a[0],a[1],a[2]), B=new V3(b[0],b[1],b[2]);
    var dx=B.x-A.x,dy=B.y-A.y,dz=B.z-A.z, len=Math.sqrt(dx*dx+dy*dy+dz*dz)||0.001;
    var o=M(parent,new T3lite.CylinderGeometry(r,r,len,12),matKey,'cyl',
      (A.x+B.x)/2,(A.y+B.y)/2,(A.z+B.z)/2);
    /* orient Y axis along (B-A): yaw then pitch */
    var yaw=Math.atan2(dx,dz), pitch=Math.acos(Math.max(-1,Math.min(1,dy/len)));
    /* orient via quaternion: rotate +Y onto (B-A) */
    var q=new Quat();
    var ux=0,uy=1,uz=0, vx=dx/len,vy=dy/len,vz=dz/len;
    var cx=uy*vz-uz*vy, cy=uz*vx-ux*vz, cz=ux*vy-uy*vx;
    var dot=uy*vy, s=Math.sqrt(cx*cx+cy*cy+cz*cz);
    if(s<1e-6){ q.w = dot>0?1:-1; }
    else { var ang=Math.acos(Math.max(-1,Math.min(1,dot)));
      var hs=Math.sin(ang/2); q.x=cx/s*hs; q.y=cy/s*hs; q.z=cz/s*hs; q.w=Math.cos(ang/2); q._set=true; }
    o.quaternion=q;
    return o; }
  /* turned table/chair leg profile (unit height 1, radius ~0.035) */
  function turnedLeg(parent,matKey,x,z,h,r){
    r=r||0.032;
    var prof=[[0.001,0],[r*1.15,0],[r*1.15,0.02],[r*0.8,0.05],[r*0.55,0.10],
      [r*0.9,0.16],[r*1.0,0.22],[r*0.6,0.30],[r*0.5,0.42],[r*0.85,0.50],
      [r*1.0,0.58],[r*0.62,0.66],[r*0.55,0.78],[r*0.9,0.88],[r*1.05,0.95],[r*1.05,1.0]];
    var o=lathe(parent,matKey,x,0,z,prof.map(function(p){return [p[0],p[1]*h];}),20);
    return o; }
  /* simple tapered square leg */
  function taperedLeg(parent,matKey,x,z,h,wTop,wBot){
    var o=cyl(parent,matKey,x,h/2,z,wTop/2,wBot/2,h,4);
    o.rotation.y=Math.PI/4; return o; }
  return {M:M,rbox:rbox,box:box,cyl:cyl,sph:sph,tor:tor,lathe:lathe,rod:rod,
    turnedLeg:turnedLeg,taperedLeg:taperedLeg};
}

function frameMat(style){ return style==='industrial'?'blackMetal':(style==='midcentury'?'woodDark':'wood'); }

/* ---------------- parametric builders (from the foundry, verbatim) ----------------
 * Units are meters. y=0 is the floor. Every builder is a pure function of
 * its seeded RNG: same seed, same item. Dimensions follow real furniture. */
var BUILDERS={
/* ---- dining chair: seat, legs, posts, back variant, stretchers ---- */
chair:function(R,H,mats,style){
  var root=new T3lite.Group(), fm=frameMat(style);
  var seatH=0.45, w=R.f(0.42,0.48), d=R.f(0.40,0.46), t=0.045;
  var back=R.pick(['slats','slats','ladder','splat','upholstered']);
  H.rbox(root,fm,0,seatH-t/2,0,w,t,d,0.012);
  var lx=w/2-0.035, lz=d/2-0.035, legR=0.024;
  [[-lx,-lz],[lx,-lz],[-lx,lz],[lx,lz]].forEach(function(p){
    if(style==='industrial') H.cyl(root,fm,p[0],(seatH-t)/2,p[1],legR,legR,seatH-t,12);
    else if(R.chance(0.5)) H.turnedLeg(root,fm,p[0],p[1],seatH-t,legR);
    else H.taperedLeg(root,fm,p[0],p[1],seatH-t,0.055,0.032); });
  /* stretchers */
  if(style!=='industrial'&&R.chance(0.8)){
    var sy=0.16;
    H.rod(root,[-lx,sy,-lz],[lx,sy,-lz],0.014,fm); H.rod(root,[-lx,sy,lz],[lx,sy,lz],0.014,fm);
    H.rod(root,[-lx,sy,-lz],[-lx,sy,lz],0.014,fm); H.rod(root,[lx,sy,-lz],[lx,sy,lz],0.014,fm); }
  /* back posts + variant */
  var postH=R.f(0.48,0.56), px=w/2-0.035, pz=-(d/2-0.035);
  [-px,px].forEach(function(x){
    if(style==='industrial') H.cyl(root,fm,x,seatH+postH/2,pz,legR,legR,postH,12);
    else H.turnedLeg(root,fm,x,pz,postH,legR).position.y=seatH; });
  var up=style==='industrial'?'leather':(R.chance(0.6)?'fabric':'leather');
  if(back==='slats'||back==='ladder'){
    var n=back==='ladder'?4:3;
    for(var i=0;i<n;i++){ var y=seatH+0.10+(postH-0.16)*i/(n-1);
      var s=H.rbox(root,fm,0,y,pz,px*2-0.02,0.075,0.022,0.008);
      s.rotation.x=0.06; } }
  else if(back==='splat'){
    var sp=H.rbox(root,fm,0,seatH+postH/2-0.02,pz,w*0.28,postH-0.14,0.02,0.03);
    sp.scale.set(1,1,1); }
  else { var pad=H.rbox(root,up,0,seatH+postH/2-0.03,pz+0.012,px*2-0.04,postH-0.18,0.07,0.03);
    pad.rotation.x=0.08; }
  return root; },

/* ---- armchair ---- */
armchair:function(R,H,mats,style){

sofa:function(R,H,mats,style){

  var w=R.f(1.0,1.3), d=R.f(0.5,0.62), h=R.f(0.36,0.44), t=0.045;
  var top=R.pick(['wood','wood','glass']);
  var topMat=top==='glass'?'glass':(R.chance(0.5)?fm:'woodDark');
  H.rbox(root,topMat,0,h-t/2,0,w,t,d,0.015);
  var kind=R.pick(['legs','legs','slab','shelf']);
  var lx=w/2-0.07, lz=d/2-0.07;
  if(kind==='legs'){ [[-lx,-lz],[lx,-lz],[-lx,lz],[lx,lz]].forEach(function(p){
      H.taperedLeg(root,fm,p[0],p[1],h-t,0.06,0.035); }); }
  else if(kind==='slab'){ [-1,1].forEach(function(s){
      H.box(root,fm,s*(w/2-0.06),(h-t)/2,0,0.04,h-t,d-0.08); }); }
  else { [[-lx,-lz],[lx,-lz],[-lx,lz],[lx,lz]].forEach(function(p){
      H.taperedLeg(root,fm,p[0],p[1],h-t,0.06,0.035); });
    H.box(root,fm,0,0.09,0,w-0.2,0.03,d-0.16); }
  return root; },

/* ---- bookshelf with books ---- */
bookshelf:function(R,H,mats,style){
  var root=new T3lite.Group(), fm=frameMat(style);
  bookMatsFor(R).forEach(function(m,i){ mats['__book'+i]=m; });
  var w=R.f(0.85,1.15), h=R.f(1.75,2.1), d=0.32, t=0.028;
  H.box(root,fm,-w/2+t/2,h/2,0,t,h,d); H.box(root,fm,w/2-t/2,h/2,0,t,h,d);
  H.box(root,fm,0,h-t/2,0,w,t,d); H.box(root,fm,0,t/2,0,w,t,d);
  H.box(root,fm,0,h/2,-d/2+0.008,w-2*t,h,0.016);
  var n=R.i(4,5);
  for(var s2=0;s2<n;s2++){ var y=t+(h-2*t)*(s2+1)/(n+1);
    H.box(root,fm,0,y,0,w-2*t,0.024,d-0.03);
    /* books on this shelf */
    var x=-w/2+t+0.02, maxX=w/2-t-0.02;
    while(x<maxX-0.03){
      if(R.chance(0.12)){ x+=R.f(0.03,0.09); continue; }
      if(R.chance(0.10)){ /* horizontal stack */
        var sw=R.f(0.16,0.24), sy=y+0.012;
        for(var b2=0;b2<R.i(2,4);b2++){ var bh=R.f(0.025,0.04);
          H.box(root,'__book'+R.i(0,7),x+sw/2,sy+bh/2,0,sw,bh,0.15+R.f(-0.02,0.02)); sy+=bh; }
        x+=sw+0.02; continue; }
      var bw=R.f(0.022,0.045), bh2=R.f(0.19,0.28);
      var bk=H.box(root,'__book'+R.i(0,7),x+bw/2,y+0.012+bh2/2,0,bw,bh2,0.14+R.f(-0.02,0.02));
      if(R.chance(0.14)){ bk.rotation.z=-0.13; bk.position.x+=0.02; }  /* the leaning one */
      x+=bw+R.f(0.001,0.006); } }
  return root; },

/* ---- rocking chair: ladder-back on curved rockers ---- */
rockingChair:function(R,H,mats,style){
  var root=new T3lite.Group(), fm=frameMat(style);
  var seatH=0.44, w=0.46, d=0.44, t=0.045;
  H.rbox(root,fm,0,seatH-t/2,0,w,t,d,0.012);
  var lx=w/2-0.04, lz=d/2-0.04;
  [[-lx,-lz],[lx,-lz],[-lx,lz],[lx,lz]].forEach(function(p){
    H.turnedLeg(root,fm,p[0],p[1],seatH-0.06,0.026); });
  /* rockers: long gentle arcs in the ZY plane, nested group so the arc centers at bottom */
  var arcA=Math.PI*0.35, Rr=1.1;
  [-1,1].forEach(function(s){
    var g=new T3lite.Group(); g.position.set(s*(lx+0.02),Rr-0.01,0.03);
    g.rotation.y=Math.PI/2; root.add(g);
    var rk=H.tor(g,fm,0,0,0,Rr,0.024,arcA);
    rk.rotation.z=-Math.PI/2-arcA/2;
    /* posts from rocker up to seat */
    H.rod(root,[s*(lx+0.02),0.05,-0.22],[s*lx,seatH-0.05,-lz],0.02,fm);
    H.rod(root,[s*(lx+0.02),0.05,0.26],[s*lx,seatH-0.05,lz],0.02,fm); });
  /* back */
  var postH=0.55, px=w/2-0.04, pz=-(d/2-0.04);
  [-px,px].forEach(function(x){
    H.turnedLeg(root,fm,x,pz,postH,0.024).position.y=seatH; });
  for(var i=0;i<3;i++){ var y=seatH+0.12+(postH-0.2)*i/2;
    var s2=H.rbox(root,fm,0,y,pz,px*2-0.02,0.07,0.022,0.008); s2.rotation.x=0.06; }
  return root; },

/* ---------------- static material key -> hex table ----------------
 * Canonical hexes taken from the foundry's own makeMats source lines.
 * Seeded-variable keys (wood species, fabric, leather, paint, ceramic) use
 * their first-listed variant as the canonical value; furnish() results also
 * carry a colorFor() closure that resolves the ACTUAL seeded color of the
 * build when available. 'crystal' is struct-native (fixture droplets). */
var MAT_HEX={
  wood:'#c9a06b', woodDark:'#6d4a2e',
  fabric:'#d9d0bf', fabric2:'#d9d0bf', leather:'#a05a2c', paint:'#ece5d8',
  blackMetal:'#26282c', brass:'#b08d4f', chrome:'#c9d2d6',
  ceramic:'#e8e2d4', ceramic2:'#b9c4c9',
  glass:'#cfd8dc', crystal:'#e6f1f7',

/* ---------------- junction resolution ---------------- */

    pts.push({ x: w.b.x, z: w.b.z, wi: i, end: 'b' });

    c.a = { x: ca.x, z: ca.z }; c.b = { x: cb.x, z: cb.z };

  storyRooms.forEach(function (srooms, s) {
    var y0 = s * WH();
    srooms.forEach(function (rc) {
      var inner = (rc.type === 'bath' || rc.type === 'kitchen') ? 'plaster'
        : rng.pick(['drywall', 'drywall', 'wallpaper', 'plaster', th.inner]);
      var id = 's' + s + '-' + rc.id;
      rooms.push({
        id: id, type: rc.type,
        rect: { x: rc.x, z: rc.z, w: rc.w, d: rc.d },
        floor: (th.floorByRoom && th.floorByRoom[rc.type]) ||
               (Struct.ROOM_TYPES[rc.type] && Struct.ROOM_TYPES[rc.type].floor) ||
               'hardwood',
        y0: y0
      });
      var x0 = rc.x, z0 = rc.z, x1 = rc.x + rc.w, z1 = rc.z + rc.d;
      var edges = [
        [{ x: x0, z: z0 }, { x: x1, z: z0 }],
        [{ x: x1, z: z0 }, { x: x1, z: z1 }],
        [{ x: x1, z: z1 }, { x: x0, z: z1 }],
        [{ x: x0, z: z1 }, { x: x0, z: z0 }]
      ];
      edges.forEach(function (e) {
        walls.push({
          a: { x: e[0].x, z: e[0].z }, b: { x: e[1].x, z: e[1].z },
          h: WH(), y0: y0, frame: th.frame, inner: inner, outer: th.outer,
          sockets: [], rooms: [id], exterior: true
        });
      });
    });
  });
  return { walls: walls, rooms: rooms };
}

/* Sockets: entry door on the longest front (min-z) exterior wall, windows on
 * the rest, seeded interior doors on long partitions. Returns entry info for
 * the sconce, or null. */
function addSockets(b, seed) {
  var rng = Struct.RNG(seed + '|sockets');
  var th = themeOf(b.theme);
  var winStyles = (th.win && th.win.length) ? th.win : ['double-hung'];
  var entry = null;
  // entry door: longest exterior story-0 wall on the front face
  var minMz = 1e9;
  b.walls.forEach(function (w) {
    if (w.exterior === false || (w.y0 || 0) !== 0) return;
    var mz = (w.a.z + w.b.z) / 2;
    if (mz < minMz) minMz = mz;
  });
  var front = null, bestL = 0;
  b.walls.forEach(function (w) {
    if (w.exterior === false || (w.y0 || 0) !== 0) return;
    var mz = (w.a.z + w.b.z) / 2;
    if (Math.abs(mz - minMz) > 0.05) return;
    var L = Struct.wallLen(w);
    if (L > bestL) { bestL = L; front = w; }
  });
  if (front && bestL >= 1.5) {
    var ds = bestL >= 2.6 ? 'double' : 'panel';
    front.sockets.push({ t: 0.5, kind: 'door', style: ds });
    front._hasDoor = true;
    entry = {
      x: front.a.x + 0.5 * (front.b.x - front.a.x),
      z: (front.a.z + front.b.z) / 2
    };
  }
  // windows on exterior walls (skip the entry wall)
  b.walls.forEach(function (w) {
    if (w.exterior === false || w._hasDoor) return;
    var style = rng.pick(winStyles);
    var d = Struct.socketDims({ kind: 'window', style: style });
    var L = Struct.wallLen(w);
    var m = d.w / 2 + 0.35;
    if (L - 2 * m < 0.6) return;
    var n = Math.max(1, Math.floor((L - 2 * m) / 2.8));
    for (var i = 0; i < n; i++) {
      var t = (m + (i + 0.5) * (L - 2 * m) / n) / L;
      w.sockets.push({ t: t, kind: 'window', style: style });
    }
  });
  // interior doors on long partitions
  b.walls.forEach(function (w) {
    if (w.exterior !== false) return;
    if (Struct.wallLen(w) < 2.4) return;
    if (rng.f() < 0.55) w.sockets.push({ t: 0.5, kind: 'door', style: 'panel' });
  });
  return entry;
}

/* Try furniture rotations until the piece fits inside the room (0.25 inset).
 * Returns the placed item or null. */
function tryPlace(list, type, seedStr, style, room, fx, fz, rotYs, y) {
  var cx = room.rect.x + room.rect.w * fx;
  var cz = room.rect.z + room.rect.d * fz;
  var yy = (y == null) ? (room.y0 || 0) : y;
  for (var i = 0; i < rotYs.length; i++) {
    var probe = Struct.furnish(type, { seed: seedStr, style: style, x: 0, y: 0, z: 0, rotY: rotYs[i] });
    var b = probe.bounds;
    var px = cx - (b.lo[0] + b.hi[0]) / 2;
    var pz = cz - (b.lo[2] + b.hi[2]) / 2;
    if (b.lo[0] + px >= room.rect.x + 0.25 && b.hi[0] + px <= room.rect.x + room.rect.w - 0.25 &&
        b.lo[2] + pz >= room.rect.z + 0.25 && b.hi[2] + pz <= room.rect.z + room.rect.d - 0.25) {
      var placed = Struct.furnish(type, { seed: seedStr, style: style, x: px, y: yy, z: pz, rotY: rotYs[i] });
      list.push(placed);
      return placed;
    }
  }
  return null;
}
var CARD = [0, Math.PI / 2, Math.PI, -Math.PI / 2];

/* Room-aware furniture. Beds in bedrooms, tables in dining/kitchen areas. */
function furnishRooms(b, seed) {
  var styleMap = { craftsman: 'shaker', modern: 'scandi', 'brick-row': 'shaker', civic: 'midcentury', adobe: 'shaker' };
  var style = styleMap[b.theme] || 'shaker';
  b.furnishings = [];
  b.rooms.forEach(function (room) {
    var w = room.rect.w, d = room.rect.d, area = w * d;
    var S = seed + '|' + room.id + '|';
    if (room.type === 'living' && w >= 2.5 && d >= 2.2) {
      tryPlace(b.furnishings, 'sofa', S + 'sofa', style, room, 0.5, 0.20, CARD);
      tryPlace(b.furnishings, 'coffeeTable', S + 'ct', style, room, 0.5, 0.52, [0, Math.PI / 2]);
      if (w >= 4) tryPlace(b.furnishings, 'bookshelf', S + 'shelf', style, room, 0.10, 0.5, [Math.PI / 2, -Math.PI / 2]);
      if (d >= 4) tryPlace(b.furnishings, 'dresser', S + 'dresser', style, room, 0.88, 0.5, [Math.PI / 2, -Math.PI / 2]);
    } else if (room.type === 'bed' && w >= 2 && d >= 2.2) {
      var bed = tryPlace(b.furnishings, 'bed', S + 'bed', style, room, 0.32, 0.30, [0, Math.PI / 2]);
      if (bed) {
        var nx = (bed.bounds.lo[0] + bed.bounds.hi[0]) / 2 + 1.15;
        var nz = (bed.bounds.lo[2] + bed.bounds.hi[2]) / 2;
        var ns = null;
        if (nx + 0.3 < room.rect.x + w - 0.25) {
          ns = Struct.furnish('nightstand', { seed: S + 'ns', style: style, x: nx - 0.25, y: room.y0 || 0, z: nz - 0.25, rotY: 0 });
          b.furnishings.push(ns);
          Struct.furnish && b.furnishings.push(Struct.furnish('tableLamp', {
            seed: S + 'tl', style: style,
            x: nx - 0.14, y: (room.y0 || 0) + ns.bounds.hi[1] + 0.01, z: nz - 0.14, rotY: 0
          }));
        }
      }
      if (w >= 3.4) tryPlace(b.furnishings, 'dresser', S + 'dresser', style, room, 0.5, 0.88, [Math.PI, 0]);
    } else if (room.type === 'kitchen' && w >= 2.5 && d >= 2.2) {
      tryPlace(b.furnishings, 'diningTable', S + 'dt', style, room, 0.5, 0.5, [0, Math.PI / 2]);
      tryPlace(b.furnishings, 'chair', S + 'c1', style, room, 0.30, 0.5, [Math.PI / 2]);
      tryPlace(b.furnishings, 'chair', S + 'c2', style, room, 0.70, 0.5, [-Math.PI / 2]);
      if (w >= 4 && d >= 3.4) tryPlace(b.furnishings, 'chair', S + 'c3', style, room, 0.5, 0.26, [Math.PI]);
    } else if (room.type === 'civic') {
      if (area > 35) {
        tryPlace(b.furnishings, 'diningTable', S + 'council', style, room, 0.5, 0.55, [0, Math.PI / 2]);
        tryPlace(b.furnishings, 'chair', S + 'cc1', style, room, 0.32, 0.55, [Math.PI / 2]);
        tryPlace(b.furnishings, 'chair', S + 'cc2', style, room, 0.68, 0.55, [-Math.PI / 2]);
        tryPlace(b.furnishings, 'chair', S + 'cc3', style, room, 0.5, 0.34, [Math.PI]);
        tryPlace(b.furnishings, 'chair', S + 'cc4', style, room, 0.5, 0.76, [0]);
      } else {
        var n = Math.max(2, Math.min(6, Math.floor(area / 7)));
        for (var i = 0; i < n; i++) {
          tryPlace(b.furnishings, 'chair', S + 'ch' + i, style, room,
            0.28 + 0.22 * (i % 3), 0.38 + 0.28 * Math.floor(i / 3), [Math.PI]);
        }
      }
    }
  });
}

/* Prefab lighting rule: every living room a ceiling fixture, every bedroom a
 * lamp, entries/porches a sconce. Seeded, room-aware. */
function fixtureRooms(b, seed, entry) {
  var ceilMat = { craftsman: 'fabric', modern: 'glass', 'brick-row': 'fabric', civic: 'crystal', adobe: 'fabric' }[b.theme] || 'fabric';
  b.fixtures = [];
  b.rooms.forEach(function (room) {
    var r = room.rect, y0 = room.y0 || 0;
    var cx = r.x + r.w / 2, cz = r.z + r.d / 2;
    var S = seed + '|fx|' + room.id;
    if (room.type === 'living') {
      b.fixtures.push({ type: 'chandelier', x: cx, y: y0 + WH() - 0.97, z: cz, rotY: 0, material: ceilMat, glow: true, seed: S });
    } else if (room.type === 'bed') {
      b.fixtures.push({ type: 'floorLamp', x: r.x + r.w - 0.7, y: y0, z: r.z + 0.7, rotY: 0.6, material: 'fabric', glow: true, seed: S });
    } else if (room.type === 'kitchen') {
      b.fixtures.push({ type: 'pendant', x: cx, y: y0 + WH() - 1.70, z: cz, rotY: 0, material: 'metal', glow: true, seed: S });
    } else if (room.type === 'civic') {
      if (r.w * r.d > 30) {
        b.fixtures.push({ type: 'chandelier', x: r.x + r.w * 0.32, y: y0 + WH() - 0.97, z: cz, rotY: 0, material: ceilMat, glow: true, seed: S + 'a' });
        b.fixtures.push({ type: 'chandelier', x: r.x + r.w * 0.68, y: y0 + WH() - 0.97, z: cz, rotY: 0, material: ceilMat, glow: true, seed: S + 'b' });
      } else {
        b.fixtures.push({ type: 'chandelier', x: cx, y: y0 + WH() - 0.97, z: cz, rotY: 0, material: ceilMat, glow: true, seed: S });
      }
    }
  });
  if (entry) {
    b.fixtures.push({ type: 'sconce', x: entry.x + 1.4, y: 1.9, z: entry.z - 0.12, rotY: Math.PI, material: 'metal', glow: true, seed: seed + '|fx|sconce' });
  }
}

/* ---------------- roof shingles (merged instancing, render-only) ---------------- */
function emitShingles(mesh, b, seed) {
  if (mesh.solids) return;
  if (!b || !b.roof || b.roof.type !== 'gable') return;
  var fp = b.footprint, top = b.stories * Struct.WALL_H, oh = 0.3;
  var tones = [[0.30, 0.31, 0.34], [0.27, 0.28, 0.31], [0.33, 0.34, 0.37]];
  var rng = Struct.RNG(seed + '|shingle');
  var alongX = fp.w >= fp.d;
  var cross = (alongX ? fp.d : fp.w) / 2 + oh;
  var span = (alongX ? fp.w : fp.d) + 2 * oh;
  var rise = Math.tan(Math.PI / 6) * cross;
  var slopeLen = Math.hypot(cross, rise);
  var nRows = Math.max(4, Math.floor(slopeLen / 0.42));
  var sw = 0.34, gap = 0.03, sh = 0.32, th = 0.035, lift = 0.035;
  for (var side = 0; side < 2; side++) {
    for (var i = 0; i < nRows; i++) {
      var f = (i + 0.5) / nRows;
      var y = top + f * rise + lift;
      var off = side === 0 ? (-cross + f * cross) : (cross - f * cross);
      var tone = tones[rng.i(0, 2)];
      var x0 = -span / 2 + 0.25 + (i % 2) * (sw + gap) / 2;
      for (var x = x0; x < span / 2 - 0.25; x += sw + gap) {
        if (alongX) mesh.box(x, y, off - sh / 2, sw, th, sh, tone);
        else mesh.box(off - sh / 2, y, x, sh, th, sw, tone);

    }
  }

  var x = [up[1]*z[2]-up[2]*z[1], up[2]*z[0]-up[0]*z[2], up[0]*z[1]-up[1]*z[0]];

    (a32*b02-a30*b05-a33*b01)*det, (a20*b05-a22*b02+a23*b01)*det,
    (a10*b10-a11*b08+a13*b06)*det, (a01*b08-a00*b10-a03*b06)*det,
    (a30*b04-a31*b02+a33*b00)*det, (a21*b02-a20*b04-a23*b00)*det,

/* ---------------- camera ---------------- */
var cam = { tx: 0, ty: 2, tz: 0, yaw: 0.35, pitch: 0.85, dist: 175 };
var camGoal = null;
var projM = m4ident(), viewM = m4ident();
function camEye() {
  var cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  return [cam.tx + cam.dist * cp * Math.sin(cam.yaw),
          cam.ty + cam.dist * sp,
          cam.tz + cam.dist * cp * Math.cos(cam.yaw)];
}
function updateMats() {
  var eye = camEye();
  viewM = m4lookAt(eye, [cam.tx, cam.ty, cam.tz], [0, 1, 0]);
  var aspect = canvas.width / canvas.height;
  projM = m4persp(0.9, aspect, 0.5, 500);
}
function easeCam(dt) {
  if (!camGoal) return;
  var k = 1 - Math.pow(0.001, dt);
  cam.tx += (camGoal.tx - cam.tx) * k;
  cam.ty += (camGoal.ty - cam.ty) * k;
  cam.tz += (camGoal.tz - cam.tz) * k;
  cam.dist += (camGoal.dist - cam.dist) * k;
  if (Math.abs(camGoal.tx - cam.tx) < 0.05 && Math.abs(camGoal.dist - cam.dist) < 0.1) camGoal = null;
}
function frameLot(lot) {
  var w = lot.fp.w, d = lot.fp.d;
  if (lot.platformCanopy) d += 4;
  if (lot.portico) d += 2.6;
  var fit = Math.max(w, d) * 2.1 + 10;
  camGoal = { tx: lot.ox, ty: 2.2, tz: lot.oz + (lot.portico ? -1.3 : 0), dist: fit };
}

/* ---------------- picking (ray vs per-lot AABB) ---------------- */
function pickRay(ndcX, ndcY) {
  var inv = m4invert(m4mul(projM, viewM));
  var p0 = m4point(inv, ndcX, ndcY, -1, 1);
  var p1 = m4point(inv, ndcX, ndcY, 1, 1);
  p0 = [p0[0]/p0[3], p0[1]/p0[3], p0[2]/p0[3]];
  p1 = [p1[0]/p1[3], p1[1]/p1[3], p1[2]/p1[3]];
  var d = [p1[0]-p0[0], p1[1]-p0[1], p1[2]-p0[2]];
  var l = Math.hypot(d[0],d[1],d[2]) || 1;
  return { o: p0, d: [d[0]/l, d[1]/l, d[2]/l] };
}
function rayAABB(ray, lo, hi) {
  var tmin = 0, tmax = 1e9;

    var inv = 1 / (ray.d[i] || 1e-12);
    var t0 = (lo[i] - ray.o[i]) * inv, t1 = (hi[i] - ray.o[i]) * inv;
    if (t0 > t1) { var t = t0; t0 = t1; t1 = t; }
    tmin = Math.max(tmin, t0); tmax = Math.min(tmax, t1);
    if (tmax < tmin) return -1;
  }

}
function pickLot(ndcX, ndcY) {
  var ray = pickRay(ndcX, ndcY), best = -1, bestT = 1e9;
  LOTS.forEach(function (lot, i) {
    if (!lot.aabb) return;
    var t = rayAABB(ray, lot.aabb.lo, lot.aabb.hi);
    if (t >= 0 && t < bestT) { bestT = t; best = i; }
  });
  return best;
}
function projectCenter(lot) {
  var p = m4point(m4mul(projM, viewM), lot.ox, 3, lot.oz, 1);
  return { x: (p[0]/p[3]*0.5+0.5) * canvas.clientWidth,
           y: (1 - (p[1]/p[3]*0.5+0.5)) * canvas.clientHeight };
}

/* ---------------- ground ---------------- */
var groundMesh = null, shadowMesh = null;
var SHADOWS = [];
function buildGround() {
  var m = new CityMesh();
  var grass = [0.62, 0.70, 0.52], pad = [0.74, 0.75, 0.76],
      padEdge = [0.42, 0.44, 0.46], road = [0.36, 0.37, 0.40], line = [0.85, 0.85, 0.80];
  m.box(-120, -0.12, -90, 240, 0.12, 180, grass);
  [-15, 15].forEach(function (rz) {
    m.box(-60, 0.0, rz - 2, 120, 0.05, 4, road);
    for (var x = -58; x < 58; x += 4) m.box(x, 0.05, rz - 0.15, 2, 0.012, 0.3, line);
  });
  LOTS.forEach(function (lot) {
    var px = lot.ox - 12, pz = lot.oz - 10;
    m.box(px, 0.0, pz, 24, 0.08, 20, pad);
    m.box(px, 0.08, pz, 24, 0.06, 0.25, padEdge);
    m.box(px, 0.08, pz + 19.75, 24, 0.06, 0.25, padEdge);
    m.box(px, 0.08, pz, 0.25, 0.06, 20, padEdge);
    m.box(px + 23.75, 0.08, pz, 0.25, 0.06, 20, padEdge);
    var sw = lot.fp.w + 4, sd = lot.fp.d + 4, sz = lot.oz;
    if (lot.portico) { sd += 2.6; sz -= 1.3; }
    if (lot.platformCanopy) { sd += 4.2; sz -= 2.1; }
    SHADOWS.push({ x: lot.ox, z: sz, w: sw, d: sd });
  });
  m.upload();
  groundMesh = m;
  var sm = new CityMesh();
  SHADOWS.forEach(function (s) {
    var base = sm.data.length / 23, y = 0.115, hw = s.w / 2, hd = s.d / 2;
    var col = [0.08, 0.10, 0.12];
    function v(x, z, u, vv) {
      sm.data.push(x, y, z, 0,1,0, col[0],col[1],col[2], 0,0,0,0, u,vv, 0,0,0,0, 0,0,0,0);
    }
    v(s.x - hw, s.z - hd, 0, 0); v(s.x + hw, s.z - hd, 1, 0);
    v(s.x + hw, s.z + hd, 1, 1); v(s.x - hw, s.z + hd, 0, 1);
    sm.indices.push(base, base + 1, base + 2, base, base + 2, base + 3);

}
function bindShadowMesh() {
  gl.bindBuffer(gl.ARRAY_BUFFER, shadowMesh.buffer);
  gl.vertexAttribPointer(0, 3, gl.FLOAT, false, STRIDE, 0);
  gl.vertexAttribPointer(1, 2, gl.FLOAT, false, STRIDE, 13 * 4);
  gl.enableVertexAttribArray(0); gl.enableVertexAttribArray(1);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, shadowMesh.indexBuffer);
}

/* ---------------- UI ---------------- */

/* ---------------- compare by volume ---------------- */
function compareRows() {
  var rows = LOTS.map(function (lot, i) {
    return { i: i, lot: lot, total: lot.takeoff ? lot.takeoff.totalM3 : 0 };
  });
  if (compareSort === 'name') rows.sort(function (a, b) { return a.lot.name < b.lot.name ? -1 : 1; });
  else rows.sort(function (a, b) { return b.total - a.total; });
  return rows;
}
function openCompare() {
  stopTour();
  var el = $('compare'), rows = $('compareRows');
  var list = compareRows();
  var max = Math.max.apply(null, list.map(function (r) { return r.total; }).concat([1]));
  rows.innerHTML = list.map(function (r, rank) {
    var t = r.lot.takeoff;
    var mats = Object.keys(t.byMaterial).filter(function (k) { return t.byMaterial[k] > 0.0005; });
    mats.sort(function (a, b2) { return t.byMaterial[b2] - t.byMaterial[a]; });
    var top3 = mats.slice(0, 3).map(function (k) { return k + ' ' + t.byMaterial[k].toFixed(1); }).join(' · ');
    var w = Math.max(2, (r.total / max) * 100);
    return '<div class="crow' + (r.i === selected ? ' sel' : '') + '" data-i="' + r.i + '">' +
      '<div class="crank">' + (compareSort === 'volume' ? (rank + 1) : '·') + '</div>' +
      '<div class="cinfo"><b>' + r.lot.name + '</b>' +
      '<span>plan ' + planLetter(r.lot.plan || 0) + ' · ' + top3 + '</span>' +
      '<div class="cbar"><div style="width:' + w.toFixed(1) + '%"></div></div></div>' +
      '<div class="ctotal">' + fmtM3(r.total) + '</div></div>';
  }).join('');
  var crow = rows.querySelectorAll('.crow');
  for (var k = 0; k < crow.length; k++) {
    (function (elm) {
      elm.onclick = function () {
        hideCompare();
        selectLot(parseInt(elm.getAttribute('data-i'), 10));
      };
    })(crow[k]);
  }
  $('sortVol').className = 'sbtn' + (compareSort === 'volume' ? ' sel' : '');
  $('sortName').className = 'sbtn' + (compareSort === 'name' ? ' sel' : '');
  el.style.display = 'block';
}
function hideCompare() { $('compare').style.display = 'none'; }

/* ---------------- auto tour ---------------- */
var tour = { on: false, idx: 0, t: 0 };
function startTour() {
  tour.on = true; tour.idx = 0; tour.t = 0;
  $('tourBtn').textContent = '⏸';
  $('tourBtn').classList.add('on');
  selected = -1; hideCard(); hideCompare();
  frameLot(LOTS[0]);
}
function stopTour() {
  if (!tour.on) return;
  tour.on = false;
  $('tourBtn').textContent = '▶';
  $('tourBtn').classList.remove('on');
}
function tourTick(dt) {
  if (!tour.on) return;
  tour.t += dt;
  if (tour.t > 5) {
    tour.t = 0;
    tour.idx = (tour.idx + 1) % LOTS.length;
    frameLot(LOTS[tour.idx]);
  }
}

/* ---------------- input: orbit / pinch / tap ---------------- */
var pointers = {};
var pinchD0 = 0, camD0 = 0;
var downAt = 0, downX = 0, downY = 0, moved = false;
function ndc(e) {
  var r = canvas.getBoundingClientRect();
  return { x: ((e.clientX - r.left) / r.width) * 2 - 1,
           y: -(((e.clientY - r.top) / r.height) * 2 - 1) };
}
canvas.addEventListener('pointerdown', function (e) {
  canvas.setPointerCapture(e.pointerId);
  pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
  if (Object.keys(pointers).length === 2) {
    var ks = Object.keys(pointers);
    pinchD0 = Math.hypot(pointers[ks[0]].x - pointers[ks[1]].x,
                         pointers[ks[0]].y - pointers[ks[1]].y);
    camD0 = cam.dist;
  }
  downAt = performance.now(); downX = e.clientX; downY = e.clientY; moved = false;
});
canvas.addEventListener('pointermove', function (e) {
  if (!pointers[e.pointerId]) return;
  var prev = pointers[e.pointerId];
  var dx = e.clientX - prev.x, dy = e.clientY - prev.y;
  pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
  if (Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY) > 8) moved = true;
  var n = Object.keys(pointers).length;
  if (n === 1) {
    stopTour(); camGoal = null;
    cam.yaw -= dx * 0.005;
    cam.pitch = Math.min(1.35, Math.max(0.12, cam.pitch + dy * 0.004));
  } else if (n === 2) {
    var ks = Object.keys(pointers);
    var d = Math.hypot(pointers[ks[0]].x - pointers[ks[1]].x,
                       pointers[ks[0]].y - pointers[ks[1]].y);
    if (pinchD0 > 0) cam.dist = Math.min(220, Math.max(12, camD0 * pinchD0 / Math.max(20, d)));
  }
});
function pointerUp(e) {
  delete pointers[e.pointerId];
  if (Object.keys(pointers).length < 2) pinchD0 = 0;
  if (!moved && performance.now() - downAt < 400 && e.isPrimary !== false) {
    var p = ndc(e);
    var i = pickLot(p.x, p.y);
    if (i >= 0) selectLot(i);
  }
}
canvas.addEventListener('pointerup', pointerUp);
canvas.addEventListener('pointercancel', function (e) { delete pointers[e.pointerId]; });
canvas.addEventListener('wheel', function (e) {
  e.preventDefault();
  cam.dist = Math.min(220, Math.max(12, cam.dist * (1 + e.deltaY * 0.001)));
}, { passive: false });

$('shuffleBtn').onclick = doShuffle;
$('tourBtn').onclick = function () { tour.on ? stopTour() : startTour(); };
$('compareBtn').onclick = function () {
  $('compare').style.display === 'block' ? hideCompare() : openCompare();
};
$('compareX').onclick = hideCompare;
$('sortVol').onclick = function () { compareSort = 'volume'; openCompare(); };
$('sortName').onclick = function () { compareSort = 'name'; openCompare(); };
$('cardX').onclick = function () { selected = -1; hideCard(); };

/* ---------------- resize ---------------- */
function resize() {
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.floor(canvas.clientWidth * dpr);
  canvas.height = Math.floor(canvas.clientHeight * dpr);
  gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);

/* ---------------- render loop ---------------- */
gl.clearColor(0.78, 0.88, 0.95, 1.0);
gl.enable(gl.DEPTH_TEST);
gl.enable(gl.CULL_FACE);
var lastT = performance.now();
function frame() {
  var now = performance.now(), dt = Math.min(0.1, (now - lastT) / 1000);
  lastT = now;
  tourTick(dt);
  easeCam(dt);
  updateMats();
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  // opaque pass
  gl.useProgram(prog);
  gl.uniformMatrix4fv(U.uProj, false, new Float32Array(projM));
  gl.uniformMatrix4fv(U.uView, false, new Float32Array(viewM));
  var sd = [0.45, 0.62, 0.80], sl = Math.hypot(sd[0], sd[1], sd[2]);
  gl.uniform3f(U.uSunDir, sd[0]/sl, sd[1]/sl, sd[2]/sl);
  gl.uniform3f(U.uSunCol, 0.95, 0.92, 0.85);
  gl.uniform3f(U.uSkyCol, 0.62, 0.68, 0.74);
  gl.uniform3f(U.uGndCol, 0.42, 0.44, 0.42);
  gl.uniform3f(U.uFogCol, 0.78, 0.88, 0.95);
  drawMesh(groundMesh);
  LOTS.forEach(function (lot) { drawMesh(lot.mesh); });
  // glow pass (additive halos at every fixture/furniture light point)
  gl.useProgram(gProg);
  gl.uniformMatrix4fv(GU.uProj, false, new Float32Array(projM));
  gl.uniformMatrix4fv(GU.uView, false, new Float32Array(viewM));
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
  gl.depthMask(false);
  gl.disable(gl.CULL_FACE);
  LOTS.forEach(function (lot) { if (lot.glowMesh) drawGlowMesh(lot.glowMesh); });
  gl.disableVertexAttribArray(0); gl.disableVertexAttribArray(1);
  gl.enable(gl.CULL_FACE);
  gl.depthMask(true);
  gl.disable(gl.BLEND);
  // blob shadows (alpha pass)
  gl.useProgram(sProg);
  gl.uniformMatrix4fv(SU.uProj, false, new Float32Array(projM));
  gl.uniformMatrix4fv(SU.uView, false, new Float32Array(viewM));
  gl.uniform4f(SU.uColor, 0.10, 0.12, 0.15, 0.38);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.depthMask(false);
  bindShadowMesh();
  gl.drawElements(gl.TRIANGLES, shadowMesh.count, gl.UNSIGNED_SHORT, 0);
  gl.depthMask(true);
  gl.disable(gl.BLEND);
  gl.disableVertexAttribArray(0); gl.disableVertexAttribArray(1); gl.disableVertexAttribArray(2);
  requestAnimationFrame(frame);
}

/* ---------------- boot ---------------- */
buildGround();
doShuffle();
resize();
requestAnimationFrame(frame);

/* ---------------- test hooks (headless verification) ---------------- */
window.__spTest = {
  ready: true,
  lotCount: function () { return LOTS.length; },
  lotIds: function () { return LOTS.map(function (l) { return l.id; }); },
  verts: function (i) { return LOTS[i].vertCount; },
  wallCount: function (i) { return LOTS[i].building.walls.length; },
  roomCount: function (i) { return LOTS[i].building.rooms.length; },
  seed: function (i) { return LOTS[i].seed; },
  theme: function (i) { return LOTS[i].building.theme; },
  stories: function (i) { return LOTS[i].building.stories; },
  planCount: function (i) { return PlanLib.DEFS[LOTS[i].id].plans.length; },
  planName: function (i, p) { return PlanLib.DEFS[LOTS[i].id].plans[p].name; },
  setPlan: function (i, p) { setPlan(i, p); },
  fixtures: function (i) { return LOTS[i].building.fixtures.length; },
  furnishings: function (i) { return LOTS[i].building.furnishings.length; },
  lightPoints: function (i) { return LOTS[i].lightPts.length; },
  takeoffTotal: function (i) { return LOTS[i].takeoff.totalM3; },
  takeoff: function (i) { return JSON.stringify(LOTS[i].takeoff); },
  validateErrors: function (i) { return Struct.validate(LOTS[i].building).length; },
  compareOrder: function () {
    return compareRows().map(function (r) { return LOTS[r.i].id; });
  },
  openCompare: function () { openCompare(); },
  compareVisible: function () { return $('compare').style.display === 'block'; },
  shuffle: function () { doShuffle(); },
  rebuildSame: function (i) { rebuildLot(i, LOTS[i].seed); },
  aabbCount: function (id) {
    var lot = LOTS.filter(function (l) { return l.id === id; })[0];
    return lot.solids.length;
  },
  tapLot: function (i) { selectLot(i); },
  cardVisible: function () { return $('card').style.display === 'block'; },
  cardText: function () { return $('cardMeta').textContent; },
  projectCenter: function (i) { updateMats(); return projectCenter(LOTS[i]); },
  setCam: function (yaw, pitch, dist) {
    cam.yaw = yaw; cam.pitch = pitch; cam.dist = dist; camGoal = null; stopTour();
    updateMats();
  },
  debugPick: function (cx, cy) {
    var r = canvas.getBoundingClientRect();
    var nx = ((cx - r.left) / r.width) * 2 - 1;
    var ny = -(((cy - r.top) / r.height) * 2 - 1);
    updateMats();
    return pickLot(nx, ny);
  }
};

})();
</script>
</body>
</html>
