<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Struct Builder — draw walls, get rooms</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    background: linear-gradient(180deg, #9dc3e8 0%, #c9dcf0 42%, #eef2f6 70%, #f6f1e7 100%);
    color: #22303c; overflow: hidden; overscroll-behavior: none;
  }
  #app { max-width: 480px; height: 100dvh; margin: 0 auto; display: flex; flex-direction: column; position: relative;
         box-shadow: 0 0 60px rgba(40,70,110,.18); }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px 8px; z-index: 5;
  }
  header .title { font-weight: 700; font-size: 17px; letter-spacing: .2px; }
  header .title small { display: block; font-weight: 500; font-size: 11px; color: #5b7186; }
  #hud { font-size: 12px; font-weight: 600; color: #33475a; background: rgba(255,255,255,.72);
         border: 1px solid rgba(60,90,120,.18); padding: 6px 11px; border-radius: 999px; backdrop-filter: blur(6px); }
  #stage { position: relative; flex: 1; min-height: 0; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #labels { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .room-label {
    position: absolute; transform: translate(-50%,-50%); pointer-events: none;
    background: rgba(20,32,44,.78); color: #fff; font-size: 11px; font-weight: 600;
    padding: 4px 10px; border-radius: 999px; letter-spacing: .4px; text-transform: capitalize;
    border: 1px solid rgba(255,255,255,.25); white-space: nowrap;
  }
  #modeSwitch {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    display: flex; background: rgba(18,30,42,.82); border-radius: 999px; padding: 4px;
    border: 1px solid rgba(255,255,255,.22); box-shadow: 0 4px 18px rgba(20,40,70,.30); z-index: 4;
  }
  #modeSwitch button {
    border: 0; background: transparent; color: #cfe0ee; font-weight: 700; font-size: 13px;
    padding: 9px 26px; border-radius: 999px; cursor: pointer; letter-spacing: .6px;
  }
  #modeSwitch button.on { background: #fff; color: #16283a; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
  #hint {
    position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%);
    background: rgba(18,30,42,.85); color: #fff; font-size: 12.5px; font-weight: 500;
    padding: 8px 16px; border-radius: 999px; opacity: 0; transition: opacity .25s; pointer-events: none;
    max-width: 88%; text-align: center; z-index: 4;
  }
  #hint.show { opacity: 1; }
  #toolbar {
    background: rgba(255,255,255,.94); backdrop-filter: blur(10px);
    border-top: 1px solid rgba(60,90,120,.16); padding: 8px 10px calc(10px + env(safe-area-inset-bottom));
    z-index: 5; max-height: 44dvh; overflow-y: auto;
  }
  .trow { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .trow:last-child { margin-bottom: 0; }
  .tlabel { font-size: 10.5px; font-weight: 700; color: #6b7f93; text-transform: uppercase; letter-spacing: .8px; min-width: 44px; }
  .chips { display: flex; gap: 7px; overflow-x: auto; padding: 2px 1px; flex: 1; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    display: flex; align-items: center; gap: 7px; border: 1.5px solid rgba(60,90,120,.20);
    background: #fff; border-radius: 999px; padding: 8px 13px; font-size: 12.5px; font-weight: 600;
    color: #2c3f52; cursor: pointer; white-space: nowrap; flex-shrink: 0;
  }
  .chip .dot { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(0,0,0,.25); flex-shrink: 0; }
  .chip.on { border-color: #1f6feb; background: #e8f1fd; color: #12325e; }
  .btn {
    border: 1.5px solid rgba(60,90,120,.20); background: #fff; border-radius: 14px;
    padding: 10px 14px; font-size: 13px; font-weight: 700; color: #2c3f52; cursor: pointer; white-space: nowrap;
  }
  .btn.on { border-color: #1f6feb; background: #e8f1fd; color: #12325e; }
  .btn.warn.on { border-color: #d97706; background: #fdf0dc; color: #7c4a03; }
  .stepper { display: flex; align-items: center; gap: 2px; background: #fff; border: 1.5px solid rgba(60,90,120,.20); border-radius: 14px; padding: 4px; }
  .stepper button { border: 0; background: #eef3f8; border-radius: 10px; width: 34px; height: 34px; font-size: 17px; font-weight: 700; color: #2c3f52; cursor: pointer; }
  .stepper .val { min-width: 52px; text-align: center; font-size: 12.5px; font-weight: 700; color: #2c3f52; }
  #seedInput {
    flex: 1; border: 1.5px solid rgba(60,90,120,.20); border-radius: 14px; padding: 10px 12px;
    font-size: 13px; font-weight: 600; color: #2c3f52; background: #fff; min-width: 0;
  }
  #sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 20; max-width: 480px; margin: 0 auto;
    background: #fff; border-radius: 20px 20px 0 0; padding: 14px 16px calc(18px + env(safe-area-inset-bottom));
    box-shadow: 0 -8px 40px rgba(20,40,70,.30); transform: translateY(110%); transition: transform .28s ease;
  }
  #sheet.open { transform: translateY(0); }
  #sheet h3 { margin: 0 0 4px; font-size: 15px; }
  #sheet p.sub { margin: 0 0 10px; font-size: 12px; color: #6b7f93; }
  #sheet .chips { flex-wrap: wrap; overflow: visible; margin-bottom: 10px; }
  #sheet .row { display: flex; gap: 8px; }
  #sheet .row .btn { flex: 1; text-align: center; }
  #scrim { position: absolute; inset: 0; z-index: 15; background: rgba(15,25,35,.35); opacity: 0; pointer-events: none; transition: opacity .25s; }
  #scrim.open { opacity: 1; pointer-events: auto; }

  #snapMark { position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px;
    border: 2px solid #22d3ee; border-radius: 50%; box-shadow: 0 0 12px #22d3ee;
    pointer-events: none; display: none; z-index: 4; }
  #angleBadge { position: absolute; transform: translate(-50%,-140%);
    background: rgba(18,30,42,.92); color: #7df9ff; font-size: 11px; font-weight: 700;
    padding: 4px 10px; border-radius: 999px; pointer-events: none; display: none;
    z-index: 4; border: 1px solid rgba(125,249,255,.45); white-space: nowrap; }
  .takeoff { font-size: 11.5px; font-weight: 600; color: #33475a; flex: 1; line-height: 1.5; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title">Struct Builder<small>draw walls &middot; get rooms &middot; real 3D</small></div>
    <div id="hud">0 walls &middot; 0 rooms</div>
  </header>
  <div id="stage">
    <canvas id="gl"></canvas>
    <div id="labels"></div>
    <div id="modeSwitch">
      <button id="btnBuild" class="on">BUILD</button>
      <button id="btnOrbit">ORBIT</button>
    </div>
    <div id="hint"></div>
    <div id="snapMark"></div>
    <div id="angleBadge"></div>
  </div>
  <div id="toolbar">
    <div class="trow"><div class="tlabel">Inner</div><div class="chips" id="innerChips"></div></div>
    <div class="trow"><div class="tlabel">Outer</div><div class="chips" id="outerChips"></div></div>
    <div class="trow">
      <div class="chips" id="toolChips" style="flex-wrap:wrap;overflow:visible"></div>
    </div>
    <div class="trow"><div class="tlabel">Takeoff</div><div id="takeoff" class="takeoff">draw a wall to start the takeoff</div></div>
    <div class="trow">
      <div class="tlabel">Start</div>
      <input id="seedInput" placeholder="seed word, e.g. cottage" value="cottage">
      <button class="btn" id="btnGen">Generate</button>
      <button class="btn" id="btnClear">Clear</button>
    </div>
  </div>
  <div id="scrim"></div>
  <div id="sheet">
    <h3 id="sheetTitle">Socket</h3>
    <p class="sub" id="sheetSub"></p>
    <div class="chips" id="sheetChips"></div>
    <div class="row">
      <button class="btn" id="sheetCancel">Cancel</button>
      <button class="btn" id="sheetApply" style="border-color:#1f6feb;background:#1f6feb;color:#fff">Apply</button>
    </div>
  </div>
</div>

function boxGeo(w,h,d){ var G=newGeo(),x=w/2,y=h/2,z=d/2;
  function face(c,n){ var a=[c[0][0],c[0][1],c[0][2]],b=[c[1][0],c[1][1],c[1][2]],
    d2=[c[2][0],c[2][1],c[2][2]],e=[c[3][0],c[3][1],c[3][2]];
    tri(G,a,b,d2,n,n,n); tri(G,a,d2,e,n,n,n); }
  face([[-x,-y,-z],[x,-y,-z],[x,y,-z],[-x,y,-z]],[0,0,-1]);
  face([[x,-y,z],[-x,-y,z],[-x,y,z],[x,y,z]],[0,0,1]);
  face([[-x,-y,z],[-x,-y,-z],[-x,y,-z],[-x,y,z]],[-1,0,0]);
  face([[x,-y,-z],[x,-y,z],[x,y,z],[x,y,-z]],[1,0,0]);
  face([[-x,y,-z],[x,y,-z],[x,y,z],[-x,y,z]],[0,1,0]);
  face([[-x,-y,z],[x,-y,z],[x,-y,-z],[-x,-y,-z]],[0,-1,0]);
  return G; }

/* Rounded box: subdivided faces projected onto a true rounded solid. */
function rboxGeo(w,h,d,r,seg){
  seg=seg||3;
  var hw=w/2,hh=h/2,hd=d/2;
  r=Math.min(r||Math.min(w,h,d)*0.22,hw,hh,hd);
  var ix=hw-r, iy=hh-r, iz=hd-r, G=newGeo();
  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
  function surf(px,py,pz){
    var qx=clamp(px,-ix,ix), qy=clamp(py,-iy,iy), qz=clamp(pz,-iz,iz);
    var nx=px-qx, ny=py-qy, nz=pz-qz, l=Math.sqrt(nx*nx+ny*ny+nz*nz)||1;
    nx/=l; ny/=l; nz/=l;
    return [[qx+nx*r, qy+ny*r, qz+nz*r],[nx,ny,nz]]; }
  function gridFace(fixed,axis,sign){
    var base=[], idx=[], e=[hw,hh,hd];
    for(var i=0;i<=seg;i++) for(var j=0;j<=seg;j++){
      var u=i/seg*2-1, v=j/seg*2-1, p=[0,0,0];
      p[axis]=sign*fixed;
      p[(axis+1)%3]=u*e[(axis+1)%3]; p[(axis+2)%3]=v*e[(axis+2)%3];
      var s=surf(p[0],p[1],p[2]);
      base.push(s); idx.push(base.length-1); }
    for(var a=0;a<seg;a++) for(var b=0;b<seg;b++){
      var r0=idx[a*(seg+1)+b], r1=idx[(a+1)*(seg+1)+b],
          r2=idx[(a+1)*(seg+1)+b+1], r3=idx[a*(seg+1)+b+1];
      var A=base[r0],B=base[r1],C=base[r2],D=base[r3];
      if(sign>0){ tri(G,A[0],B[0],C[0],A[1],B[1],C[1]); tri(G,A[0],C[0],D[0],A[1],C[1],D[1]); }
      else { tri(G,A[0],C[0],B[0],A[1],C[1],B[1]); tri(G,A[0],D[0],C[0],A[1],D[1],C[1]); } } }
  gridFace(hw,0,1); gridFace(hw,0,-1);
  gridFace(hh,1,1); gridFace(hh,1,-1);
  gridFace(hd,2,1); gridFace(hd,2,-1);
  return G; }

/* Lathe: surface of revolution. Turned legs, vases, lamp bases, bowls, mugs. */
function latheGeo(profile,segs){
  segs=segs||28; var G=newGeo(), i, j;
  var rings=[];
  for(i=0;i<profile.length;i++){
    var pr=profile[i][0], py=profile[i][1], ring=[];
    for(j=0;j<=segs;j++){ var a=j/segs*TAU;
      ring.push([pr*Math.cos(a),py,pr*Math.sin(a)]); }
    rings.push(ring); }
  function profNormal(i){
    var a=profile[Math.max(0,i-1)], b=profile[Math.min(profile.length-1,i+1)];
    var dr=b[0]-a[0], dy=b[1]-a[1], l=Math.sqrt(dr*dr+dy*dy)||1;
    return [dy/l, -dr/l]; /* (r-comp, y-comp), outward */ }
  for(i=0;i<profile.length-1;i++){
    var n0=profNormal(i), n1=profNormal(i+1);
    for(j=0;j<segs;j++){
      var a0=j/segs*TAU, a1=(j+1)/segs*TAU;
      var ca0=Math.cos(a0),sa0=Math.sin(a0),ca1=Math.cos(a1),sa1=Math.sin(a1);
      var p00=rings[i][j],p01=rings[i][j+1],p10=rings[i+1][j],p11=rings[i+1][j+1];
      var nn00=[n0[0]*ca0,n0[1],n0[0]*sa0], nn01=[n0[0]*ca1,n0[1],n0[0]*sa1],
          nn10=[n1[0]*ca0,n1[1],n1[0]*sa0], nn11=[n1[0]*ca1,n1[1],n1[0]*sa1];
      tri(G,p00,p10,p11,nn00,nn10,nn11);
      tri(G,p00,p11,p01,nn00,nn11,nn01); } }
  /* end caps */
  function cap(ri,y,flip){
    var r0=profile[ri][0];
    if(r0<0.004) return;
    var c=[0,y,0], cn=[0,flip,0];
    for(j=0;j<segs;j++){
      var q0=rings[ri][j], q1=rings[ri][j+1];
      if(flip>0) tri(G,c,q0,q1,cn,cn,cn); else tri(G,c,q1,q0,cn,cn,cn); } }
  cap(0,profile[0][1],-1); cap(profile.length-1,profile[profile.length-1][1],1);
  return G; }

function cylGeo(rt,rb,h,rad){ rad=rad||20;
  var G=newGeo(),i;
  for(i=0;i<rad;i++){ var a0=i/rad*TAU,a1=(i+1)/rad*TAU;
    var c0=Math.cos(a0),s0=Math.sin(a0),c1=Math.cos(a1),s1=Math.sin(a1);
    var p00=[rb*c0,-h/2,rb*s0],p01=[rb*c1,-h/2,rb*s1],
        p10=[rt*c0,h/2,rt*s0],p11=[rt*c1,h/2,rt*s1];
    var n0=[c0,0,s0],n1=[c1,0,s1];
    tri(G,p00,p10,p11,n0,n0,n1); tri(G,p00,p11,p01,n0,n1,n1); }
  function cap2(y,r,ny){ var c=[0,y,0],cn=[0,ny,0];
    for(i=0;i<rad;i++){ var b0=i/rad*TAU,b1=(i+1)/rad*TAU;
      var q0=[r*Math.cos(b0),y,r*Math.sin(b0)],q1=[r*Math.cos(b1),y,r*Math.sin(b1)];
      if(ny>0) tri(G,c,q0,q1,cn,cn,cn); else tri(G,c,q1,q0,cn,cn,cn); } }
  cap2(-h/2,rb,-1); cap2(h/2,rt,1);
  return G; }
function sphGeo(r,ws,hs){ ws=ws||18; hs=hs||12; var G=newGeo(),i,j;
  for(i=0;i<hs;i++) for(j=0;j<ws;j++){
    var u0=i/hs*Math.PI,u1=(i+1)/hs*Math.PI,v0=j/ws*TAU,v1=(j+1)/ws*TAU;
    function pt(u,v){ return [r*Math.sin(u)*Math.cos(v),r*Math.cos(u),r*Math.sin(u)*Math.sin(v)]; }
    function nm(p){ var l=Math.sqrt(p[0]*p[0]+p[1]*p[1]+p[2]*p[2])||1; return [p[0]/l,p[1]/l,p[2]/l]; }
    var a=pt(u0,v0),b=pt(u1,v0),c=pt(u1,v1),d=pt(u0,v1);
    tri(G,a,b,c,nm(a),nm(b),nm(c)); tri(G,a,c,d,nm(a),nm(c),nm(d)); }
  return G; }
function torGeo(R,r,rs,ts,arc){ rs=rs||10; ts=ts||28; arc=(arc==null?TAU:arc);
  var G=newGeo(),i,j;
  for(i=0;i<ts;i++){
    for(j=0;j<rs;j++){
      var u0=i/ts*arc,u1=(i+1)/ts*arc,v0=j/rs*TAU,v1=(j+1)/rs*TAU;
      function pt(u,v){ var cu=Math.cos(u),su=Math.sin(u);
        return [(R+r*Math.cos(v))*cu,r*Math.sin(v),(R+r*Math.cos(v))*su]; }
      function nm(u,v){ var cv=Math.cos(v),sv=Math.sin(v);
        return [cv*Math.cos(u),sv,cv*Math.sin(u)]; }
      var a=pt(u0,v0),b=pt(u1,v0),c=pt(u1,v1),d=pt(u0,v1);
      tri(G,a,b,c,nm(u0,v0),nm(u1,v0),nm(u1,v1)); tri(G,a,c,d,nm(u0,v0),nm(u1,v1),nm(u0,v1)); } }
  return G; }

var T3lite={
  Group:Group, Mesh:Mesh,
  BoxGeometry:function(w,h,d){ return boxGeo(w,h,d); },
  RBoxGeometry:function(w,h,d,r,s){ return rboxGeo(w,h,d,r,s); },
  CylinderGeometry:function(rt,rb,h,rad){ return cylGeo(rt,rb,h,rad||20); },
  SphereGeometry:function(r,ws,hs){ return sphGeo(r,ws,hs); },
  TorusGeometry:function(R,r,rs,ts,arc){ return torGeo(R,r,rs,ts,arc); },
  LatheGeometry:function(prof,segs){ return latheGeo(prof,segs); }
};

/* ---------------- materials (from the foundry, verbatim) ---------------- */
function hexRGB(h){ h=String(h).replace('#','');
  return [parseInt(h.slice(0,2),16)/255,parseInt(h.slice(2,4),16)/255,parseInt(h.slice(4,6),16)/255]; }
function stdMat(o){ o=o||{};
  return { color:o.color||[0.8,0.8,0.8],
    emissive:o.emissive||[0,0,0], emissiveIntensity:o.emissiveIntensity||0,
    opacity:(o.opacity==null?1:o.opacity), transparent:!!o.transparent,
    wood:o.wood?1:0, woodB:o.woodB||[0,0,0], fabric:o.fabric?1:0, metal:o.metal?1:0 }; }

/* wood species: [base, grain] */
var WOODS={
  oak:    {base:'#c9a06b', grain:'#9a7443', name:'White oak'},
  walnut: {base:'#6d4a2e', grain:'#472d1a', name:'Walnut'},
  cherry: {base:'#9d5c34', grain:'#743c1d', name:'Cherry'},
  ebony:  {base:'#33291f', grain:'#1c150f', name:'Ebonized'},
  ash:    {base:'#d9c49a', grain:'#b39468', name:'Ash'}
};
var FABRICS=[
  {c:'#d9d0bf',n:'Oat linen'},{c:'#e7e0d0',n:'Bouclé'},{c:'#2f5d50',n:'Emerald velvet'},
  {c:'#b45f3c',n:'Rust weave'},{c:'#d9a441',n:'Mustard'},{c:'#5a6470',n:'Slate'},
  {c:'#8a4b5c',n:'Mauve'},{c:'#3e4a5a',n:'Ink blue'}
];
var LEATHERS=[{c:'#a05a2c',n:'Cognac'},{c:'#26221e',n:'Black'},{c:'#7a4a2e',n:'Saddle'}];
var PAINTS=[
  {c:'#ece5d8',n:'Cream'},{c:'#a8b09a',n:'Sage'},{c:'#3a3d40',n:'Charcoal'},
  {c:'#7a93a8',n:'Dusty blue'},{c:'#c4b49a',n:'Sand'}
];
var CERAMICS=['#e8e2d4','#b9c4c9','#5a6e7a','#a8503c','#2e2a26','#d9c9a8'];

function makeMats(style, R){
  var woodKey=R.pick(Object.keys(WOODS));
  if(style==='scandi') woodKey=R.pick(['oak','ash']);
  if(style==='midcentury') woodKey='walnut';
  var W=WOODS[woodKey];
  var fab=R.pick(FABRICS), lea=R.pick(LEATHERS);
  var paint=R.pick(PAINTS);
  function wood(){ return stdMat({color:hexRGB(W.base),woodB:hexRGB(W.grain),wood:1}); }
  function woodDark(){ var w=WOODS[R.pick(['walnut','ebony'])];
    return stdMat({color:hexRGB(w.base),woodB:hexRGB(w.grain),wood:1}); }
  return {
    woodName:W.name, fabricName:fab.n, leatherName:lea.n,
    wood:wood(), woodDark:woodDark(),
    fabric:stdMat({color:hexRGB(fab.c),fabric:1}),
    fabric2:stdMat({color:hexRGB(R.pick(FABRICS).c),fabric:1}),
    leather:stdMat({color:hexRGB(lea.c),fabric:1}),
    paint:stdMat({color:hexRGB(paint.c)}),
    blackMetal:stdMat({color:hexRGB('#26282c'),metal:1}),
    brass:stdMat({color:hexRGB('#b08d4f'),metal:1}),
    chrome:stdMat({color:hexRGB('#c9d2d6'),metal:1}),
    ceramic:stdMat({color:hexRGB(R.pick(CERAMICS))}),
    ceramic2:stdMat({color:hexRGB(R.pick(CERAMICS))}),
    glass:stdMat({color:hexRGB('#cfd8dc'),opacity:0.35,transparent:true}),
    bulb:stdMat({color:hexRGB('#fff2ce'),emissive:hexRGB('#ffdf9c'),emissiveIntensity:1.6}),
    shade:stdMat({color:hexRGB('#f2ead8'),fabric:1,emissive:hexRGB('#ffedbe'),emissiveIntensity:0.55}),
    flame:stdMat({color:hexRGB('#ff9a3c'),emissive:hexRGB('#ff7a1a'),emissiveIntensity:2.2}),
    screen:stdMat({color:hexRGB('#8fa8bd'),emissive:hexRGB('#4a6a8a'),emissiveIntensity:0.8}),
    paper:stdMat({color:hexRGB('#f4f1e8')}),
    leaf:stdMat({color:hexRGB('#4a7a3f')}),
    leafDark:stdMat({color:hexRGB('#33592c')}),
    soil:stdMat({color:hexRGB('#2e2118')}),
    steel:stdMat({color:hexRGB('#a8adb2'),metal:1}),
    glassGreen:stdMat({color:hexRGB('#2a4a34'),opacity:0.55,transparent:true}),
    mirror:stdMat({color:hexRGB('#b8c8d0'),metal:1,opacity:0.92,transparent:true}),
    mattress:stdMat({color:hexRGB('#f0ece2'),fabric:1}),
    bookMats:null /* filled per-shelf */
  };
}

/* book material cache per build (bookshelf fills it) */
function bookMatsFor(R){
  var cols=['#8a4b3c','#3c5a7a','#5a6e4a','#b08d4f','#6e4a6e','#a8a092','#384048','#94552f'];
  return cols.map(function(c){ return stdMat({color:hexRGB(c)}); });
}

/* ---------------- builder helpers (from the foundry, adapted) ----------------
 * Adaptation: each created Mesh is tagged with _matKey (the material key the
 * builder passed) and _geoKind so the flattener can report material keys per
 * triangle without needing the renderer. Geometry calls are verbatim. */
function furnHelpers(mats){
  function M(parent,geo,matKey,kind,x,y,z){
    var o=new T3lite.Mesh(geo,mats[matKey]);
    o._matKey=matKey; o._geoKind=kind||'mesh';
    o.position.set(x||0,y||0,z||0);
    parent.add(o); return o; }
  function rbox(parent,matKey,x,y,z,w,h,d,r){
    return M(parent,new T3lite.RBoxGeometry(w,h,d,r==null?Math.min(w,h,d)*0.2:r),matKey,'rbox',x,y,z); }
  function box(parent,matKey,x,y,z,w,h,d){
    return M(parent,new T3lite.BoxGeometry(w,h,d),matKey,'box',x,y,z); }
  function cyl(parent,matKey,x,y,z,rt,rb,h,rad){
    return M(parent,new T3lite.CylinderGeometry(rt,rb,h,rad||20),matKey,'cyl',x,y,z); }
  function sph(parent,matKey,x,y,z,r,sx,sy,sz){
    var o=M(parent,new T3lite.SphereGeometry(r,20,14),matKey,'sph',x,y,z);
    if(sx)o.scale.set(sx,sy==null?sx:sy,sz==null?sx:sz); return o; }
  function tor(parent,matKey,x,y,z,R,r,arc){
    return M(parent,new T3lite.TorusGeometry(R,r,10,28,arc==null?TAU:arc),matKey,'tor',x,y,z); }
  function lathe(parent,matKey,x,y,z,profile,segs){
    return M(parent,new T3lite.LatheGeometry(profile,segs||28),matKey,'lathe',x,y,z); }
  /* rod between two points (from vehicle builder) */
  function rod(parent,a,b,r,matKey){
    matKey=matKey||'blackMetal';
    var A=new V3(a[0],a[1],a[2]), B=new V3(b[0],b[1],b[2]);
    var dx=B.x-A.x,dy=B.y-A.y,dz=B.z-A.z, len=Math.sqrt(dx*dx+dy*dy+dz*dz)||0.001;
    var o=M(parent,new T3lite.CylinderGeometry(r,r,len,12),matKey,'cyl',
      (A.x+B.x)/2,(A.y+B.y)/2,(A.z+B.z)/2);
    /* orient Y axis along (B-A): yaw then pitch */
    var yaw=Math.atan2(dx,dz), pitch=Math.acos(Math.max(-1,Math.min(1,dy/len)));
    /* orient via quaternion: rotate +Y onto (B-A) */
    var q=new Quat();
    var ux=0,uy=1,uz=0, vx=dx/len,vy=dy/len,vz=dz/len;
    var cx=uy*vz-uz*vy, cy=uz*vx-ux*vz, cz=ux*vy-uy*vx;
    var dot=uy*vy, s=Math.sqrt(cx*cx+cy*cy+cz*cz);
    if(s<1e-6){ q.w = dot>0?1:-1; }
    else { var ang=Math.acos(Math.max(-1,Math.min(1,dot)));
      var hs=Math.sin(ang/2); q.x=cx/s*hs; q.y=cy/s*hs; q.z=cz/s*hs; q.w=Math.cos(ang/2); q._set=true; }
    o.quaternion=q;
    return o; }
  /* turned table/chair leg profile (unit height 1, radius ~0.035) */
  function turnedLeg(parent,matKey,x,z,h,r){
    r=r||0.032;
    var prof=[[0.001,0],[r*1.15,0],[r*1.15,0.02],[r*0.8,0.05],[r*0.55,0.10],
      [r*0.9,0.16],[r*1.0,0.22],[r*0.6,0.30],[r*0.5,0.42],[r*0.85,0.50],
      [r*1.0,0.58],[r*0.62,0.66],[r*0.55,0.78],[r*0.9,0.88],[r*1.05,0.95],[r*1.05,1.0]];
    var o=lathe(parent,matKey,x,0,z,prof.map(function(p){return [p[0],p[1]*h];}),20);
    return o; }
  /* simple tapered square leg */
  function taperedLeg(parent,matKey,x,z,h,wTop,wBot){
    var o=cyl(parent,matKey,x,h/2,z,wTop/2,wBot/2,h,4);
    o.rotation.y=Math.PI/4; return o; }
  return {M:M,rbox:rbox,box:box,cyl:cyl,sph:sph,tor:tor,lathe:lathe,rod:rod,
    turnedLeg:turnedLeg,taperedLeg:taperedLeg};
}

function frameMat(style){ return style==='industrial'?'blackMetal':(style==='midcentury'?'woodDark':'wood'); }

/* ---------------- parametric builders (from the foundry, verbatim) ----------------
 * Units are meters. y=0 is the floor. Every builder is a pure function of
 * its seeded RNG: same seed, same item. Dimensions follow real furniture. */
var BUILDERS={
/* ---- dining chair: seat, legs, posts, back variant, stretchers ---- */
chair:function(R,H,mats,style){
  var root=new T3lite.Group(), fm=frameMat(style);
  var seatH=0.45, w=R.f(0.42,0.48), d=R.f(0.40,0.46), t=0.045;
  var back=R.pick(['slats','slats','ladder','splat','upholstered']);
  H.rbox(root,fm,0,seatH-t/2,0,w,t,d,0.012);
  var lx=w/2-0.035, lz=d/2-0.035, legR=0.024;
  [[-lx,-lz],[lx,-lz],[-lx,lz],[lx,lz]].forEach(function(p){
    if(style==='industrial') H.cyl(root,fm,p[0],(seatH-t)/2,p[1],legR,legR,seatH-t,12);
    else if(R.chance(0.5)) H.turnedLeg(root,fm,p[0],p[1],seatH-t,legR);
    else H.taperedLeg(root,fm,p[0],p[1],seatH-t,0.055,0.032); });
  /* stretchers */
  if(style!=='industrial'&&R.chance(0.8)){
    var sy=0.16;
    H.rod(root,[-lx,sy,-lz],[lx,sy,-lz],0.014,fm); H.rod(root,[-lx,sy,lz],[lx,sy,lz],0.014,fm);
    H.rod(root,[-lx,sy,-lz],[-lx,sy,lz],0.014,fm); H.rod(root,[lx,sy,-lz],[lx,sy,lz],0.014,fm); }
  /* back posts + variant */
  var postH=R.f(0.48,0.56), px=w/2-0.035, pz=-(d/2-0.035);
  [-px,px].forEach(function(x){
    if(style==='industrial') H.cyl(root,fm,x,seatH+postH/2,pz,legR,legR,postH,12);
    else H.turnedLeg(root,fm,x,pz,postH,legR).position.y=seatH; });
  var up=style==='industrial'?'leather':(R.chance(0.6)?'fabric':'leather');
  if(back==='slats'||back==='ladder'){
    var n=back==='ladder'?4:3;
    for(var i=0;i<n;i++){ var y=seatH+0.10+(postH-0.16)*i/(n-1);
      var s=H.rbox(root,fm,0,y,pz,px*2-0.02,0.075,0.022,0.008);
      s.rotation.x=0.06; } }
  else if(back==='splat'){
    var sp=H.rbox(root,fm,0,seatH+postH/2-0.02,pz,w*0.28,postH-0.14,0.02,0.03);
    sp.scale.set(1,1,1); }
  else { var pad=H.rbox(root,up,0,seatH+postH/2-0.03,pz+0.012,px*2-0.04,postH-0.18,0.07,0.03);
    pad.rotation.x=0.08; }
  return root; },

/* ---- armchair ---- */
armchair:function(R,H,mats,style){
  var root=new T3lite.Group(), fm=frameMat(style);
  var up=R.chance(0.7)?'fabric':'leather';
  var w=R.f(0.78,0.92), seatY=0.40;
  H.rbox(root,up,0,seatY-0.10,0,w-0.1,0.22,0.62,0.06);            /* base */
  H.rbox(root,up,0,seatY+0.02,0.02,w-0.28,0.15,0.55,0.06);        /* seat cushion */
  var back=H.rbox(root,up,0,seatY+0.32,-0.30,w-0.28,0.55,0.15,0.06);
  back.rotation.x=-0.12;                                          /* backrest */
  [-1,1].forEach(function(s){                                      /* arms */
    H.rbox(root,up,s*(w/2-0.09),seatY+0.10,0,0.17,0.34,0.66,0.07); });

  var root=new T3lite.Group(), fm=frameMat(style);
  var w=1.05, d=0.44, h=0.74, t=0.04;
  H.rbox(root,fm,0,h-t/2,0,w,t,d,0.012);
  [-1,1].forEach(function(s){ H.box(root,fm,s*(w/2-0.05),(h-t)/2,0,0.05,h-t,d-0.06); });
  H.rbox(root,'woodDark',0,h-t-0.10,0.10,0.4,0.12,0.015,0.005);
  H.sph(root,'brass',0,h-t-0.10,0.115,0.013);
  /* mirror on posts */
  var mr=0.30;
  [-1,1].forEach(function(s){ H.cyl(root,fm,s*(mr+0.03),h+0.28,-d/2+0.06,0.016,0.016,0.62,10); });
  var fr=H.tor(root,fm,0,h+0.55,-d/2+0.06,mr,0.022);
  H.cyl(root,'mirror',0,h+0.55,-d/2+0.06,mr-0.015,mr-0.015,0.008,28);
  return root; },

chaiseLounge:function(R,H,mats,style){

/* ---- coat rack ---- */
coatRack:function(R,H,mats,style){
  var root=new T3lite.Group(), fm=frameMat(style);

  H.cyl(root,fm,0,h/2,0,0.024,0.024,h,14);
  H.sph(root,fm,0,h+0.02,0,0.035);
  for(var i=0;i<4;i++){ var a=i/4*TAU+TAU/8;
    var x=Math.cos(a), z=Math.sin(a);
    H.rod(root,[x*0.02,h-0.28,z*0.02],[x*0.20,h-0.10,z*0.20],0.014,fm);
    H.sph(root,fm,x*0.20,h-0.10,z*0.20,0.022); }
  return root; },

/* ---- folding room divider: 3 slatted panels ---- */
roomDivider:function(R,H,mats,style){
  var root=new T3lite.Group(), fm=frameMat(style);
  var pw=0.55, ph=1.72, ang=R.f(0.3,0.5);
  for(var p=0;p<3;p++){
    var g=new T3lite.Group();
    g.position.set((p-1)*pw*Math.cos(ang*0.5),0,(p===1?0:(p===0?-1:1)*pw*Math.sin(ang*0.5)*0.9));
    g.rotation.y=(p-1)*ang; root.add(g);
    H.box(g,fm,-pw/2+0.02,ph/2,0,0.045,ph,0.04); H.box(g,fm,pw/2-0.02,ph/2,0,0.045,ph,0.04);
    H.box(g,fm,0,ph-0.03,0,pw,0.06,0.04); H.box(g,fm,0,0.06,0,pw,0.09,0.04);
    for(var s=0;s<5;s++){ var y=0.28+s*(ph-0.62)/4;
      var sl=H.box(g,fm,0,y,0,pw-0.09,0.10,0.018); sl.rotation.x=0.5; } }
  return root; }
});

    pts.push({ x: w.a.x, z: w.a.z, wi: i, end: 'a' });
    pts.push({ x: w.b.x, z: w.b.z, wi: i, end: 'b' });

  function find(i) { while (parent[i] !== i) { parent[i] = parent[parent[i]]; i = parent[i]; } return i; }

    for (var j = i + 1; j < pts.length; j++)

    s.x += p.x; s.z += p.z; s.n++;

  var tmp = new CityMesh();
  Struct.emitRoof(tmp, pseudo);
  var base = mesh.data.length / 23;
  for (var i = 0; i < tmp.data.length; i += 23) { tmp.data[i] += cx; tmp.data[i + 2] += cz; }
  for (i = 0; i < tmp.data.length; i++) mesh.data.push(tmp.data[i]);
  for (i = 0; i < tmp.indices.length; i++) mesh.indices.push(tmp.indices[i] + base);

  Struct.emitRoof(cm, pseudo);
  cm.solids.forEach(function (s) {

      hi: [s.hi[0] + cx, s.hi[1], s.hi[2] + cz],

/* ---------------- furniture + fixtures ---------------- */

var structMesh = null, collideLines = null, collideBuf = null;
function rebuild() {
  if (structMesh) structMesh.dispose();
  var b = canonicalBuilding();
  state.rooms = b.rooms;
  var mesh = new CityMesh();
  // ghost preview wall (bright accent box, same code path family as walls)
  var wallsPlus = b.walls.slice();
  if (state.ghost && wallLen(state.ghost) > 0.05) {
    wallsPlus.push({
      a: state.ghost.a, b: state.ghost.b, h: state.height, y0: 0,
      frame: state.frame, inner: 'glass-pane', outer: 'glass-pane',
      sockets: [], exterior: true

  }
  var bRender = {
    seed: b.seed, theme: b.theme, frame: b.frame, walls: wallsPlus,
    rooms: b.rooms, roof: b.roof, roofCfg: b.roofCfg, stories: 1, footprint: b.footprint
  };
  emitFull(mesh, bRender);
  // real Furniture Foundry pieces
  Struct.emitFurnishings(mesh, state.furnish.map(function (f) { return f.item; }));
  // light fixtures + their bulb light points (glow billboards)
  var fx = Struct.emitFixtures(mesh, state.fixtures.map(function (f) { return f.spec; }));
  state.lightPoints = fx.lightPoints || [];
  mesh.upload();
  structMesh = mesh;

  // collision wireframes — dual-mode parity: same building, same emission
  if (collideBuf) { gl.deleteBuffer(collideBuf); collideBuf = null; }
  collideLines = null;
  if (state.showCollision) {
    var solids = collideFull(b);
    collideLines = solids;
    var pos = [];
    solids.forEach(function (s) {
      var x0 = s.lo[0], y0 = s.lo[1], z0 = s.lo[2], x1 = s.hi[0], y1 = s.hi[1], z1 = s.hi[2];
      var c = [[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1],[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]];
      [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]].forEach(function (e) {
        pos.push(c[e[0]][0], c[e[0]][1], c[e[0]][2], c[e[1]][0], c[e[1]][1], c[e[1]][2]);
      });
    });
    collideBuf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, collideBuf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(pos), gl.STATIC_DRAW);
    collideLines._count = pos.length / 3;
  }
  updateHUD(); updateTakeoff(); renderLabels();
}
function drawCollision() {
  if (!collideBuf) return;
  gl.useProgram(flat);
  gl.bindBuffer(gl.ARRAY_BUFFER, collideBuf);
  gl.enableVertexAttribArray(flatLoc.p);
  gl.vertexAttribPointer(flatLoc.p, 3, gl.FLOAT, false, 0, 0);
  gl.uniformMatrix4fv(flatLoc.mvp, false, vpM);
  gl.uniform3f(flatLoc.color, 1.0, 0.62, 0.08);

}
/* ---------------- interaction ---------------- */
var pointers = {}, pinchD0 = 0, orbitLast = null, dragStart = null;
var hintTimer = 0;
function hint(msg, ms) {
  var el = document.getElementById('hint');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(hintTimer);
  hintTimer = setTimeout(function () { el.classList.remove('show'); }, ms || 2200);
}
function evPos(e) {
  var r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * 2 - 1, y: -((e.clientY - r.top) / r.height * 2 - 1) };
}
function pickWall(p) {
  var best = -1, bestD = 0.45, bestT = 0;
  state.walls.forEach(function (w, i) {
    var ax = w.a.x, az = w.a.z, bx = w.b.x, bz = w.b.z;
    var dx = bx - ax, dz = bz - az, L2 = dx * dx + dz * dz;
    if (!L2) return;
    var t = ((p[0] - ax) * dx + (p[1] - az) * dz) / L2;
    t = Math.max(0, Math.min(1, t));
    var d = Math.hypot(p[0] - (ax + dx * t), p[1] - (az + dz * t));
    if (d < bestD) { bestD = d; best = i; bestT = t; }
  });
  return best < 0 ? null : { i: best, t: bestT };
}
function socketFits(wall, t, kind, style) {
  var d = Struct.socketDims({ kind: kind, style: style });
  var L = wallLen(wall);
  if (d.w > L - 0.6) return false;
  if (t * L < d.w / 2 + 0.3 || (1 - t) * L < d.w / 2 + 0.3) return false;
  return !(wall.sockets || []).some(function (s) {
    var d2 = Struct.socketDims(s);
    return Math.abs(s.t - t) * L < (d.w + d2.w) / 2 + 0.4;
  });
}
/* v2 drag math: 15° angle snap (law), 0.1m length snap, 0.25m endpoint snap. */
function dragPoint(a, gx, gz) {
  var s = Struct.snapAngle(gx - a.x, gz - a.z);
  var L = Math.hypot(s.dx, s.dz);
  var Ls = Math.round(L * 10) / 10;
  var ux = L > 1e-9 ? s.dx / L : 1, uz = L > 1e-9 ? s.dz / L : 0;
  var b = { x: a.x + ux * Ls, z: a.z + uz * Ls };
  var sp = Struct.snapPoint(b, state.walls);
  var snapped = Math.abs(sp.x - b.x) > 1e-9 || Math.abs(sp.z - b.z) > 1e-9;
  if (snapped) { state.snapMark = sp; b = sp; }
  else state.snapMark = null;
  var rawDeg = Math.atan2(s.dz, s.dx) * 180 / Math.PI;
  var snapDeg = Math.round(rawDeg / Struct.SNAP_ANGLE_DEG) * Struct.SNAP_ANGLE_DEG;
  state.angleInfo = L > 0.2
    ? { deg: snapDeg, len: Math.hypot(b.x - a.x, b.z - a.z),
        mx: (a.x + b.x) / 2, mz: (a.z + b.z) / 2 }
    : null;
  return b;
}
function finishWall(a, b) {

    state.walls.push({
      a: a, b: b, h: state.height, y0: 0,
      frame: state.frame, inner: state.inner, outer: state.outer,
      sockets: [], exterior: true
    });
    hint('Wall added — ' + L.toFixed(1) + ' m');
  } else if (L > 0.05) {
    hint('Walls need to be at least 1.0 m long.');
  }
  dragStart = null; state.ghost = null; state.snapMark = null; state.angleInfo = null;
  rebuild();
}

canvas.addEventListener('pointerdown', function (e) {
  canvas.setPointerCapture(e.pointerId);
  pointers[e.pointerId] = evPos(e);
  var n = Object.keys(pointers).length;
  if (n === 2) { // pinch begins
    var ks = Object.keys(pointers);
    pinchD0 = Math.hypot(pointers[ks[0]].x - pointers[ks[1]].x, pointers[ks[0]].y - pointers[ks[1]].y);
    dragStart = null; state.ghost = null; orbitLast = null;
    state.snapMark = null; state.angleInfo = null;
    return;
  }
  if (n > 1) return;
  var p = pointers[e.pointerId];
  var g = groundPick(p.x, p.y);
  if (state.tool === 'socket') {
    if (g) {
      var hit = pickWall(g);
      if (hit) openSocketSheet(hit.i, hit.t);
      else hint('Tap a wall to add a window or door.');
    }
    return;
  }
  if (state.tool === 'furnish') {
    if (g) placeFurniture(state.pickFurn, g[0], g[1]);
    else hint('Tap the floor to place furniture.');
    return;
  }
  if (state.tool === 'light') {
    if (g) placeFixture(state.pickFixture, g[0], g[1]);
    else hint('Tap the floor to place the fixture.');
    return;
  }
  if (state.mode === 'build') {
    if (g) {
      var s = Struct.snapPoint({ x: clampPlot(g[0]), z: clampPlot(g[1]) }, state.walls);
      dragStart = s;
      state.ghost = { a: s, b: { x: s.x, z: s.z } };
    }
  } else {
    orbitLast = { x: e.clientX, y: e.clientY };
  }
});
canvas.addEventListener('pointermove', function (e) {
  if (!pointers[e.pointerId]) return;
  pointers[e.pointerId] = evPos(e);
  var n = Object.keys(pointers).length;
  if (n === 2) {
    var ks = Object.keys(pointers);
    var d = Math.hypot(pointers[ks[0]].x - pointers[ks[1]].x, pointers[ks[0]].y - pointers[ks[1]].y);
    if (pinchD0 > 0) cam.dist = Math.max(6, Math.min(34, cam.dist * (pinchD0 / d)));
    pinchD0 = d;
    return;
  }
  if (state.mode === 'orbit' && orbitLast) {
    cam.yaw -= (e.clientX - orbitLast.x) * 0.006;
    cam.pitch = Math.max(0.18, Math.min(1.35, cam.pitch + (e.clientY - orbitLast.y) * 0.006));
    orbitLast = { x: e.clientX, y: e.clientY };
    return;
  }
  if (state.mode === 'build' && dragStart && !state.tool) {
    var g = groundPick(pointers[e.pointerId].x, pointers[e.pointerId].y);
    if (g) {
      state.ghost.b = dragPoint(dragStart, clampPlot(g[0]), clampPlot(g[1]));
      rebuild();
    }
  }
});
function endPointer(e) {
  delete pointers[e.pointerId];
  if (Object.keys(pointers).length < 2) pinchD0 = 0;
  if (state.mode === 'build' && dragStart && state.ghost) {
    finishWall({ x: dragStart.x, z: dragStart.z }, state.ghost.b); // b already snapped
  }
  orbitLast = null;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', function (e) {
  e.preventDefault();
  cam.dist = Math.max(6, Math.min(34, cam.dist * (1 + Math.sign(e.deltaY) * 0.08)));
}, { passive: false });

/* ---------------- HUD + labels + takeoff ---------------- */

function openSocketSheet(wi, t) {
  var w = state.walls[wi];
  var kinds = [{ id: 'window', label: 'Window' }, { id: 'door', label: 'Door' }];
  openSheet('Wall socket', 'Pick a kind, then a style. It cuts into the wall where you tapped.',
    kinds, 'Choose style', function (kind) {
      var styles = kind === 'window'
        ? Object.keys(Struct.WINDOW_STYLES).map(function (s) { return { id: s, label: s }; })
        : Object.keys(Struct.DOOR_STYLES).map(function (s) { return { id: s, label: s }; });
      if ((w.sockets || []).length) styles.push({ id: '__clear', label: '✕ clear sockets' });
      openSheet((kind === 'window' ? 'Window' : 'Door') + ' style',
        'Wall ' + (wi + 1) + ', ' + wallLen(w).toFixed(1) + ' m long.',
        styles, 'Add ' + kind, function (style) {
          if (style === '__clear') {
            w.sockets = []; rebuild(); hint('Sockets removed.');
            return; // closes the sheet

          if (socketFits(w, t, kind, style)) {
            w.sockets.push({ t: t, kind: kind, style: style });
            w.sockets.sort(function (a, b) { return a.t - b.t; });
            rebuild();
            hint(kind + ' added (' + style + ').');

    });

    { id: 'tableLamp', label: 'Table lamp' }
  ];
  openSheet('Light fixture', 'Pick a fixture, then a shade material. It glows where you place it.',
    chips, 'Shade material', function (id) {
      state.pickFixture = id;
      var mats = [
        { id: 'glass', label: 'Glass', color: '#bfe0ea' },
        { id: 'crystal', label: 'Crystal', color: '#e6f1f7' },
        { id: 'metal', label: 'Metal', color: '#b08d3f' },
        { id: 'fabric', label: 'Fabric', color: '#d9c9a8' }
      ];
      openSheet('Shade material', prettyType(id) + ' — pick the shade/body material.',
        mats, 'Place fixture', function (mid) {
          state.fixtureMat = mid; state.tool = 'light';
          refreshTools();
          hint('Tap the floor to place the ' + prettyType(state.pickFixture) + '. Tap Light again to stop.');
        });
      return true;
    });
}

/* ---------------- mode switch / seed / clear ---------------- */
function setMode(m) {
  state.mode = m; state.tool = null;
  document.getElementById('btnBuild').classList.toggle('on', m === 'build');
  document.getElementById('btnOrbit').classList.toggle('on', m === 'orbit');
  refreshTools();
  hint(m === 'build'
    ? 'Build mode: drag to draw a wall — 15° angle snap, endpoints snap shut.'
    : 'Orbit mode: drag to rotate, pinch to zoom.');
}
document.getElementById('btnBuild').onclick = function () { setMode('build'); };
document.getElementById('btnOrbit').onclick = function () { setMode('orbit'); };

function applyGenerated(seed) {
  var b = Struct.makeBuilding(seed || 'cottage', state.theme, { w: 10, d: 8 }, 1);
  // adopt the procedural walls as editable user walls (ground story)
  state.walls = b.walls.filter(function (w) { return (w.y0 || 0) === 0; })
    .map(function (w) {
      return {
        a: { x: w.a.x, z: w.a.z }, b: { x: w.b.x, z: w.b.z },
        h: w.h, y0: 0, frame: w.frame, inner: w.inner, outer: w.outer,
        sockets: (w.sockets || []).map(function (s) { return { t: s.t, kind: s.kind, style: s.style }; }),
        exterior: w.exterior !== false
      };
    });
  state.roof = { type: b.roof.type };
  state.furnish = []; state.fixtures = [];
  refreshTools(); rebuild();
  hint('Generated "' + (seed || 'cottage') + '" — ' + state.walls.length + ' walls. Drag to edit, or clear.');
}
document.getElementById('btnGen').onclick = function () {
  applyGenerated(document.getElementById('seedInput').value.trim());
};
document.getElementById('btnClear').onclick = function () {
  state.walls = []; state.roof = null; state.furnish = []; state.fixtures = [];
  state.lightPoints = []; state.ghost = null; state.tool = null;
  refreshTools(); rebuild();
  hint('Plot cleared. Drag on the grass to draw your first wall.');
};

/* ---------------- render loop / resize ---------------- */
function resize() {
  var w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  gl.viewport(0, 0, canvas.width, canvas.height);
  updateMats(canvas.width, canvas.height);
}
window.addEventListener('resize', function () { resize(); positionLabels(); });

var lastT = 0;
function frame(t) {
  requestAnimationFrame(frame);
  if (t - lastT < 33) return; // ~30fps is plenty for SwiftShader + battery
  lastT = t;
  updateMats(canvas.width, canvas.height);
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);
  gl.useProgram(lit);
  drawMesh(plotMesh);
  drawMesh(structMesh);
  drawGlow();
  drawShadow();
  drawCollision();
  positionLabels();
}

/* ---------------- test hooks (headless verification) ---------------- */
window.__SB = {
  state: state,
  addWall: function (a, b) { // v2 diagonal-aware: same code path as tap-drag finalize
    a = Struct.snapPoint({ x: clampPlot(a.x), z: clampPlot(a.z) }, state.walls);
    var s = Struct.snapAngle(b.x - a.x, b.z - a.z);
    var L = Math.hypot(s.dx, s.dz), Ls = Math.round(L * 10) / 10;
    var ux = L > 1e-9 ? s.dx / L : 1, uz = L > 1e-9 ? s.dz / L : 0;
    var bb = Struct.snapPoint({ x: a.x + ux * Ls, z: a.z + uz * Ls }, state.walls);
    if (Math.hypot(bb.x - a.x, bb.z - a.z) < 1.0) return false;
    state.walls.push({
      a: a, b: bb, h: state.height, y0: 0, frame: state.frame,
      inner: state.inner, outer: state.outer, sockets: [], exterior: true
    });
    rebuild();
    return true;
  },
  addSocket: function (wi, t, kind, style) {
    var w = state.walls[wi];
    if (!w || !socketFits(w, t, kind, style)) return false;
    w.sockets.push({ t: t, kind: kind, style: style });
    rebuild();
    return true;
  },
  walls: function () { return state.walls.length; },
  rooms: function () { return state.rooms.length; },
  roomTypes: function () { return state.rooms.map(function (r) { return r.type; }); },
  clearAll: function () { state.walls = []; state.roof = null; state.furnish = []; state.fixtures = []; state.lightPoints = []; rebuild(); },
  setRoof: function (type) { state.roof = type ? { type: type } : null; rebuild(); },
  generate: function (seed) { applyGenerated(seed); },
  placeFurniture: function (type, x, z) { return placeFurniture(type, x, z); },
  furnitureCount: function () { return state.furnish.length; },
  furnitureTypes: function () { return Struct.FURNITURE_TYPES.slice(); },
  placeFixture: function (type, x, z) { return placeFixture(type, x, z); },
  fixtureCount: function () { return state.fixtures.length; },
  lightPointCount: function () { return state.lightPoints.length; },
  takeoff: function () { return Struct.takeoff(canonicalBuilding()); },
  snapSmoke: function () {
    var s = Struct.snapAngle(1, 1); // 45° stays 45°
    var sp = Struct.snapPoint({ x: 0.1, z: 0.1 }, [{ a: { x: 0, z: 0 }, b: { x: 5, z: 0 } }]);
    return { snapDeg: Struct.SNAP_ANGLE_DEG, snapped45: Math.abs(Math.atan2(s.dz, s.dx) * 180 / Math.PI - 45) < 1e-9,
             snapHit: sp.x === 0 && sp.z === 0 };
  },
  emitVertexCount: function () { // canonical building, no furniture/ghost
    var b = canonicalBuilding();
    var m = new CityMesh();
    emitFull(m, b);
    return m.data.length / 23;
  },
  collisionCount: function () {
    return collideFull(canonicalBuilding()).length;
  },
  wallBoxCount: function () { // box() calls in triangle mode == expected AABB count
    var b = canonicalBuilding();
    var m = new CityMesh(), n = 0;
    var orig = m.box;
    m.box = function () { n++; return orig.apply(m, arguments); };
    emitFull(m, b);
    return n;
  },
  seedWallCount: function (seed, theme) {
    return Struct.makeBuilding(seed, theme || 'craftsman', { w: 10, d: 8 }, 1).walls.length;
  },
  seedJSON: function (seed, theme) {
    var b = Struct.makeBuilding(seed, theme || 'craftsman', { w: 10, d: 8 }, 1);
    return JSON.stringify(b.walls.map(function (w) {
      return [w.a.x, w.a.z, w.b.x, w.b.z, w.h, w.frame, w.inner, w.outer,
              (w.sockets || []).map(function (s) { return [s.t, s.kind, s.style]; })];
    }));
  }
};

/* ---------------- init ---------------- */
refreshMaterials();
refreshTools();
buildScenery();
resize();
rebuild();
setMode('build');
hint('Drag on the grass to draw your first wall.', 3000);
requestAnimationFrame(frame);
})();

</script></body></html>
