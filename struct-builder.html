<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Struct Builder — draw walls, get rooms</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    background: linear-gradient(180deg, #9dc3e8 0%, #c9dcf0 42%, #eef2f6 70%, #f6f1e7 100%);
    color: #22303c; overflow: hidden; overscroll-behavior: none;
  }
  #app { max-width: 480px; height: 100dvh; margin: 0 auto; display: flex; flex-direction: column; position: relative;
         box-shadow: 0 0 60px rgba(40,70,110,.18); }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px 8px; z-index: 5;
  }
  header .title { font-weight: 700; font-size: 17px; letter-spacing: .2px; }
  header .title small { display: block; font-weight: 500; font-size: 11px; color: #5b7186; }
  #hud { font-size: 12px; font-weight: 600; color: #33475a; background: rgba(255,255,255,.72);
         border: 1px solid rgba(60,90,120,.18); padding: 6px 11px; border-radius: 999px; backdrop-filter: blur(6px); }
  #stage { position: relative; flex: 1; min-height: 0; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #labels { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .room-label {
    position: absolute; transform: translate(-50%,-50%); pointer-events: none;
    background: rgba(20,32,44,.78); color: #fff; font-size: 11px; font-weight: 600;
    padding: 4px 10px; border-radius: 999px; letter-spacing: .4px; text-transform: capitalize;
    border: 1px solid rgba(255,255,255,.25); white-space: nowrap;
  }
  #modeSwitch {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    display: flex; background: rgba(18,30,42,.82); border-radius: 999px; padding: 4px;
    border: 1px solid rgba(255,255,255,.22); box-shadow: 0 4px 18px rgba(20,40,70,.30); z-index: 4;
  }
  #modeSwitch button {
    border: 0; background: transparent; color: #cfe0ee; font-weight: 700; font-size: 13px;
    padding: 9px 26px; border-radius: 999px; cursor: pointer; letter-spacing: .6px;
  }
  #modeSwitch button.on { background: #fff; color: #16283a; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
  #hint {
    position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%);
    background: rgba(18,30,42,.85); color: #fff; font-size: 12.5px; font-weight: 500;
    padding: 8px 16px; border-radius: 999px; opacity: 0; transition: opacity .25s; pointer-events: none;
    max-width: 88%; text-align: center; z-index: 4;
  }
  #hint.show { opacity: 1; }
  #toolbar {
    background: rgba(255,255,255,.94); backdrop-filter: blur(10px);
    border-top: 1px solid rgba(60,90,120,.16); padding: 8px 10px calc(10px + env(safe-area-inset-bottom));

  <header>

<script>
/* mesh-builder — immediate-mode procedural 3D mesh builder.
 * CityMesh class extracted verbatim from canal-metropolis.html:648-661.
 * Helpers extracted verbatim: TAU (:41), mix (:43), color (:319),
 * dot3/norm3/cross3 (:582-584). No logic changes.
 * NOTE: upload()/dispose() need a WebGL context as global 'gl',
 * exactly as in the original page. Everything else is pure JS.
 */
const TAU = Math.PI * 2;
const mix=(a,b,t)=>a+(b-a)*t;
const color=(c,m=1,a=1)=>[c[0]*m,c[1]*m,c[2]*m,a];
const dot3=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const norm3=a=>{const l=Math.hypot(...a)||1;return a.map(v=>v/l)};
const cross3=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
class CityMesh{
 constructor(){this.data=[];this.indices=[];this.construction=[0,0,0,0];this.material=0;this.phase=0;this.kind=0;this.anchor=0;this.lots=[];this.turn=0;this.pivot=[0,0];this.route=[0,0,0,0]}
 vertex(p,n,c,uv){let route=this.route;if(this.turn){const co=Math.cos(this.turn),si=Math.sin(this.turn),x=p[0]-this.pivot[0],z=p[2]-this.pivot[1];p=[this.pivot[0]+co*x+si*z,p[1],this.pivot[1]-si*x+co*z];n=[co*n[0]+si*n[2],n[1],-si*n[0]+co*n[2]];if(this.kind===2){const xx=route[0]-this.pivot[0],zz=route[1]-this.pivot[1];route=[this.pivot[0]+co*xx+si*zz,this.pivot[1]-si*xx+co*zz,route[2],route[3]];}if(this.kind===3&&route[3]>.5)uv=[co*uv[0]+si*uv[1],-si*uv[0]+co*uv[1]];}this.data.push(...p,...n,c[0],c[1],c[2],...this.construction,...uv,this.material,this.phase,this.kind,this.anchor,...route)}
 face(a,b,c,d,color,normal,uvScale=1,uvOrigin=[0,0]){const ab=b.map((v,i)=>v-a[i]),ac=c.map((v,i)=>v-a[i]),ad=d.map((v,i)=>v-a[i]),geometric=cross3(ab,ac),fallback=cross3(ac,ad),raw=norm3(Math.hypot(...geometric)>1e-9?geometric:fallback),n=normal&&dot3(raw,normal)<0?raw.map(v=>-v):raw,w=Math.hypot(...ab)*uvScale,h=Math.hypot(...ad)*uvScale,base=this.data.length/23;this.vertex(a,n,color,uvOrigin);this.vertex(b,n,color,[uvOrigin[0]+w,uvOrigin[1]]);this.vertex(c,n,color,[uvOrigin[0]+w,uvOrigin[1]+h]);this.vertex(d,n,color,[uvOrigin[0],uvOrigin[1]+h]);const reverse=dot3(cross3(ab,ac),n)<0;if(Math.hypot(...ab)>1e-8&&Math.hypot(...ac)>1e-8)this.indices.push(base,base+(reverse?2:1),base+(reverse?1:2));if(Math.hypot(...ad)>1e-8)this.indices.push(base,base+(reverse?3:2),base+(reverse?2:3));}

 box(x,y,z,w,h,d,c,mat=this.material){if(w<=0||h<=0||d<=0)return;if(this.solids&&this.kind<1.5){this.solids.push({lo:[x,y,z],hi:[x+w,y+h,z+d],c,mat,kind:this.kind,anchor:this.anchor});return;}const old=this.material;this.material=mat;const a=[x,y,z],b=[x+w,y,z],e=[x,y+h,z],f=[x+w,y+h,z],j=[x,y,z+d],k=[x+w,y,z+d],l=[x,y+h,z+d],q=[x+w,y+h,z+d];this.face(a,b,f,e,c,[0,0,-1]);this.face(k,j,l,q,c,[0,0,1]);this.face(j,a,e,l,c,[-1,0,0]);this.face(b,k,q,f,c,[1,0,0]);this.face(e,f,q,l,c,[0,1,0]);this.material=old;}
 bevelBox(x,y,z,w,h,d,c,mat=2){if(w<.3||h<.3||d<.3){this.box(x,y,z,w,h,d,c,mat);return;}const old=this.material;this.material=mat;const b=Math.min(w,d,h)*.045,top=y+h,ring=[[x+b,z],[x+w-b,z],[x+w,z+b],[x+w,z+d-b],[x+w-b,z+d],[x+b,z+d],[x,z+d-b],[x,z+b]];for(let k=0;k<8;k++){const a=ring[k],q=ring[(k+1)%8],dx=q[0]-a[0],dz=q[1]-a[1],n=norm3([dz,0,-dx]);this.face([a[0],y,a[1]],[q[0],y,q[1]],[q[0],top-b,q[1]],[a[0],top-b,a[1]],c,n);const aa=[mix(a[0],x+w/2,b/Math.max(w,d)),mix(a[1],z+d/2,b/Math.max(w,d))],qq=[mix(q[0],x+w/2,b/Math.max(w,d)),mix(q[1],z+d/2,b/Math.max(w,d))];this.material=0;this.face([a[0],top-b,a[1]],[q[0],top-b,q[1]],[qq[0],top,qq[1]],[aa[0],top,aa[1]],color(c,1.13),norm3([n[0],1,n[2]]));this.face([x+w/2,top,z+d/2],[aa[0],top,aa[1]],[qq[0],top,qq[1]],[x+w/2,top,z+d/2],color(c,.92),[0,1,0]);this.material=mat;}this.material=old;}
 dome(x,y,z,rx,ry,rz,c,segments=16,rings=4){const saved=this.kind;for(let j=0;j<rings;j++)for(let i=0;i<segments;i++){const point=(a,b)=>[x+Math.cos(a)*Math.sin(b)*rx,y+Math.cos(b)*ry,z+Math.sin(a)*Math.sin(b)*rz],a=i/segments*TAU,b=(i+1)/segments*TAU,c0=j/rings*Math.PI*.5,d=(j+1)/rings*Math.PI*.5,n=norm3([Math.cos((a+b)/2)*Math.sin((c0+d)/2),Math.cos((c0+d)/2),Math.sin((a+b)/2)*Math.sin((c0+d)/2)]);this.face(point(a,c0),point(b,c0),point(b,d),point(a,d),c,n);}const start=this.data.length;this.roundCap(x,y-ry,z,rx,rz,ry*2,0,segments,rings*2);for(let k=start;k<this.data.length;k+=23)this.data[k+18]=y;this.kind=saved;}
 roundCap(x,y,z,rx,rz,h,taper,segments,rings=1){if(this.construction[0]<0||this.construction[1]<=0||this.kind!==0)return;const old={kind:this.kind,material:this.material,route:this.route};this.kind=3;this.material=19;this.route=[y,y+h,taper,rings];for(let i=0;i<segments;i++){const a=i/segments*TAU,b=(i+1)/segments*TAU,base=this.data.length/23;this.vertex([x,0,z],[0,1,0],[.49,.50,.46],[0,0]);this.vertex([x+Math.cos(b)*rx,0,z+Math.sin(b)*rz],[0,1,0],[.49,.50,.46],[Math.cos(b)*rx,Math.sin(b)*rz]);this.vertex([x+Math.cos(a)*rx,0,z+Math.sin(a)*rz],[0,1,0],[.49,.50,.46],[Math.cos(a)*rx,Math.sin(a)*rz]);this.indices.push(base,base+1,base+2);}Object.assign(this,old);}
 cylinder(x,y,z,rx,rz,h,c,segments=24,taper=1){for(let i=0;i<segments;i++){const a=i/segments*TAU,b=(i+1)/segments*TAU;const p=[x+Math.cos(a)*rx,y,z+Math.sin(a)*rz],q=[x+Math.cos(b)*rx,y,z+Math.sin(b)*rz],t=[x+Math.cos(b)*rx*taper,y+h,z+Math.sin(b)*rz*taper],s=[x+Math.cos(a)*rx*taper,y+h,z+Math.sin(a)*rz*taper];this.face(p,q,t,s,c,[Math.cos((a+b)/2),0,Math.sin((a+b)/2)]);this.face([x,y+h,z],s,t,[x,y+h,z],color(c,.9),[0,1,0]);}this.roundCap(x,y,z,rx,rz,h,taper,segments);}
 sphere(x,y,z,rx,ry,rz,c,segments=10,rings=6){for(let j=0;j<rings;j++)for(let i=0;i<segments;i++){const p=(a,b)=>[x+Math.cos(a)*Math.sin(b)*rx,y+Math.cos(b)*ry,z+Math.sin(a)*Math.sin(b)*rz];const a=i/segments*TAU,b=(i+1)/segments*TAU,c0=j/rings*Math.PI,d=(j+1)/rings*Math.PI;const n=norm3([Math.cos((a+b)/2)*Math.sin((c0+d)/2),Math.cos((c0+d)/2),Math.sin((a+b)/2)*Math.sin((c0+d)/2)]);this.face(p(a,c0),p(b,c0),p(b,d),p(a,d),c,n)}if(this.material===8)this.roundCap(x,y-ry,z,rx,rz,ry*2,0,segments,rings);}
 upload(){this.vertexCount=this.data.length/23;this.count=this.indices.length;this.buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,this.buffer);if(this.vertexCount<=65535){gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(this.data),gl.STATIC_DRAW);this.indexBuffer=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,this.indexBuffer);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(this.indices),gl.STATIC_DRAW);}else{const expanded=new Float32Array(this.count*23);for(let j=0;j<this.count;j++)for(let k=0;k<23;k++)expanded[j*23+k]=this.data[this.indices[j]*23+k];gl.bufferData(gl.ARRAY_BUFFER,expanded,gl.STATIC_DRAW);this.vertexCount=this.count;}this.data=null;this.indices=null;return this}

}

</script><script>
/* STRUCT v1 — layered structural system for MOOR.
 * Spec: components/struct/SPEC.md (law).
 * Zero dependencies except CityMesh from ../mesh-builder/mesh-builder.js.
 * Pure logic + geometry math: no `window`/`document` references, node-testable.
 * Units meters. Wall thickness 0.15. Grid snap 0.5. Y-up, ground y=0.
 *
 * DUAL-MODE: emit(mesh, building) fills mesh.data/indices (triangles).
 * emitCollision(building) makes a CityMesh with mesh.solids=[], runs the SAME
 * emission, returns the AABB array. Every box() call yields exactly one AABB.
 * (CityMesh.box pushes one {lo,hi,c,mat,kind,anchor} record per call when
 *  mesh.solids is set; degenerate boxes emit nothing in either mode.)
 */

/* CityMesh loader — works in node (require) and browser (script tag first).
 * NOTE: mesh-builder.js declares `class CityMesh` at top level. In a classic
 * browser script that creates a global LEXICAL binding (NOT window.CityMesh),
 * and a `var CityMesh` here would throw "already declared". So we never
 * declare that name: `typeof CityMesh` safely resolves the lexical binding. */
var CityMeshCtor = (function () {
  try { if (typeof CityMesh !== 'undefined' && CityMesh) return CityMesh; } catch (e) {}
  if (typeof require === 'function') {
    try { return require('../mesh-builder/mesh-builder.js').CityMesh; } catch (e) {}
  }
  return null;
})();

/* ---------------- constants ---------------- */
var WALL_T = 0.15;          // wall thickness (frame core)
var SKIN_T = 0.02;          // face skin proud offset
var GRID = 0.5;             // grid snap
var WALL_H = 2.7;           // default story height
var SLAB_T = 0.12;          // floor slab thickness
var JUNCTION_TOL = 0.08;    // endpoint clustering distance
var PERIM_TOL = 0.01;       // room perimeter membership tolerance
var MIN_WALL_LEN = 1.0;

/* ---------------- seeded RNG (mulberry32 + FNV-1a) ---------------- */
function hashSeed(str) {
  var h = 0x811c9dc5; // FNV-1a 32-bit
  str = String(str);
  for (var i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return h >>> 0;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
/* RNG(seed) -> {f, i, pick, chance, range} */
function RNG(seed) {
  var next = mulberry32(hashSeed(seed));
  return {
    f: function () { return next(); },
    range: function (lo, hi) { return lo + next() * (hi - lo); },
    i: function (lo, hi) { return lo + Math.floor(next() * (hi - lo + 1)); },
    pick: function (arr) { return arr[Math.floor(next() * arr.length)]; },
    chance: function (p) { return next() < p; },
    _next: next
  };
}

/* ---------------- materials pool v1 ---------------- */
var MATERIALS = [
  { id: 'wood-frame',  name: 'Framing lumber',   kind: 'frame',  color: '#8a6b45' },
  { id: 'metal-frame', name: 'Steel studs',      kind: 'frame',  color: '#7d8590' },
  { id: 'drywall',     name: 'Painted drywall',  kind: 'inner',  color: '#e8e4da' },
  { id: 'wallpaper',   name: 'Pattern wallpaper',kind: 'inner',  color: '#c9b8a3' },
  { id: 'plaster',     name: 'Lime plaster',     kind: 'inner',  color: '#ded5c4' },
  { id: 'brick',       name: 'Fired brick',       kind: 'outer',  color: '#9a4f38' },
  { id: 'siding',      name: 'Lap siding',        kind: 'outer',  color: '#b8c4cc' },
  { id: 'concrete',    name: 'Poured concrete',   kind: 'both',   color: '#a3a5a8' },
  { id: 'stone',       name: 'Fieldstone',        kind: 'outer',  color: '#8d867a' },
  { id: 'glass-pane',  name: 'Glazing',           kind: 'socket', color: '#bfe0ea' },
  { id: 'shingle',     name: 'Asphalt shingle',   kind: 'roof',   color: '#4a4d52' },
  { id: 'metal-roof',  name: 'Standing seam',     kind: 'roof',   color: '#6b7280' },
  { id: 'hardwood',    name: 'Oak floor',         kind: 'floor',  color: '#a97e4f' },
  { id: 'tile',        name: 'Ceramic tile',      kind: 'floor',  color: '#c9c2b4' },
  { id: 'carpet',      name: 'Cut pile',         kind: 'floor',  color: '#7a6a8f' }
];
var MAT_BY_ID = {};
MATERIALS.forEach(function (m) { MAT_BY_ID[m.id] = m; });

function hexRgb(hex) {
  var n = parseInt(hex.slice(1), 16);
  return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
}
/* mat(id, role='inner') -> material record. Never throws.
 * Unknown id (or wrong kind for role) falls back per spec: drywall for inner,
 * brick for outer. role 'frame'->wood-frame, 'roof'->shingle, 'floor'->hardwood. */
function mat(id, role) {
  role = role || 'inner';
  var m = MAT_BY_ID[id];
  var ok = m && (role === 'inner' ? (m.kind === 'inner' || m.kind === 'both')
              : role === 'outer' ? (m.kind === 'outer' || m.kind === 'both')
              : true);
  if (ok) return m;
  if (role === 'outer') return MAT_BY_ID.brick;
  if (role === 'frame') return MAT_BY_ID['wood-frame'];
  if (role === 'roof') return MAT_BY_ID.shingle;

/* ---------------- window / door styles v1 ---------------- */

/* ---------------- room types v1 ---------------- */
var ROOM_TYPES = {
  living:  { floor: 'hardwood', min: 9 },
  bed:     { floor: 'hardwood', min: 6 },
  bath:    { floor: 'tile',     min: 2 },
  kitchen: { floor: 'tile',     min: 6 },

  garage:  { floor: 'concrete', min: 12 },

/* ---------------- themes v1 ---------------- */

  modern:    { frame: 'metal-frame', outer: 'concrete', roof: 'flat',  win: ['picture', 'slider', 'picture'] },

/* ---------------- junction resolution ---------------- */
/* resolveJunctions(walls) -> new walls with endpoints clustered within
 * 0.08m merged to their centroid (union-find, so chains merge). BEFORE emission. */
function resolveJunctions(walls) {
  var pts = [];
  walls.forEach(function (w, i) {
    pts.push({ x: w.a.x, z: w.a.z, wi: i, end: 'a' });
    pts.push({ x: w.b.x, z: w.b.z, wi: i, end: 'b' });
  });
  var parent = pts.map(function (_, i) { return i; });
  function find(i) { while (parent[i] !== i) { parent[i] = parent[parent[i]]; i = parent[i]; } return i; }
  function union(i, j) { parent[find(i)] = find(j); }
  var tol2 = JUNCTION_TOL * JUNCTION_TOL;
  for (var i = 0; i < pts.length; i++)
    for (var j = i + 1; j < pts.length; j++)
      if (dist2(pts[i].x, pts[i].z, pts[j].x, pts[j].z) <= tol2) union(i, j);

  pts.forEach(function (p, i) {
    var r = find(i), s = sums[r] || (sums[r] = { x: 0, z: 0, n: 0 });
    s.x += p.x; s.z += p.z; s.n++;
  });
  var centroid = {};
  Object.keys(sums).forEach(function (r) {
    centroid[r] = { x: sums[r].x / sums[r].n, z: sums[r].z / sums[r].n };
  });

    var c = JSON.parse(JSON.stringify(w));
    var ca = centroid[find(i * 2)], cb = centroid[find(i * 2 + 1)];
    c.a = { x: ca.x, z: ca.z }; c.b = { x: cb.x, z: cb.z };

}

/* ---------------- wall emission ---------------- */
/* A wall emits as LAYERED boxes: frame core (0.15 full height), inner skin
 * (0.02 proud, interior side), outer skin (0.02 proud, exterior side).
 * opts: {y0} base height (default 0), {inward} interior normal {x,z}

  if (xWall) {
    var xa = Math.min(p0.x, p1.x), len = Math.abs(p1.x - p0.x), zc = (p0.z + p1.z) / 2;
    var s = n.z >= 0 ? 1 : -1; // interior side sign along z

    mesh.box(xa, yLo, s > 0 ? zc + WALL_T / 2 : zc - WALL_T / 2 - SKIN_T, len, h, SKIN_T, innerC);
    mesh.box(xa, yLo, s > 0 ? zc - WALL_T / 2 - SKIN_T : zc + WALL_T / 2, len, h, SKIN_T, outerC);

    var za = Math.min(p0.z, p1.z), len2 = Math.abs(p1.z - p0.z), xc = (p0.x + p1.x) / 2;

    mesh.box(s2 > 0 ? xc + WALL_T / 2 : xc - WALL_T / 2 - SKIN_T, yLo, za, SKIN_T, h, len2, innerC);
    mesh.box(s2 > 0 ? xc - WALL_T / 2 - SKIN_T : xc + WALL_T / 2, yLo, za, SKIN_T, h, len2, outerC);

}

/* Cut runs around sockets. Returns array of {t0,t1,yLo,yHi} full-height runs
 * plus opening descriptors for trim/glazing. */
function cutRuns(wall) {

  }).sort(function (p, q) { return p.t0 - q.t0; });

  ops.forEach(function (o) {
    if (o.t0 > cur) runs.push({ t0: cur, t1: o.t0, yLo: 0, yHi: H });
    runs.push({ t0: o.t0, t1: o.t1, yLo: o.sill + o.h, yHi: H });       // header
    if (o.kind === 'window' && o.sill > 0)
      runs.push({ t0: o.t0, t1: o.t1, yLo: 0, yHi: o.sill });           // sill
    cur = o.t1;
  });

function ptAt(wall, t) {
  return { x: wall.a.x + (wall.b.x - wall.a.x) * t, z: wall.a.z + (wall.b.z - wall.a.z) * t };
}

/* Emit trim frame + glazing for one opening. Trim boxes in frame material;
 * windows get a thin glass-pane glazing box. */
function emitOpening(mesh, wall, o, y0, n) {

  var xWall = Math.abs(c1.z - c0.z) < Math.abs(c1.x - c0.x);

    var zc = (c0.z + c1.z) / 2, xa = Math.min(c0.x, c1.x), xb = Math.max(c0.x, c1.x);
    var td = WALL_T + 0.04;

    hbox(xb, zc, tw, td, base, top);            // jamb R

    var xc = (c0.x + c1.x) / 2, za = Math.min(c0.z, c1.z), zb = Math.max(c0.z, c1.z);

/* Non-axis-aligned walls: approximate with stepped axis-aligned boxes along

function emitDiagonal(mesh, wall, y0) {

    var w = Math.max(Math.abs(p1.x - p0.x), 0.05), d = Math.max(Math.abs(p1.z - p0.z), 0.05);

/* emitWall(mesh, wall, opts) — full layered wall with sockets. */
function emitWall(mesh, wall, opts) {
  opts = opts || {};
  var y0 = wall.y0 || opts.y0 || 0;
  if (!isAxisAligned(wall)) { emitDiagonal(mesh, wall, y0); return; }
  var n = opts.inward || leftNormal(wall);
  var cut = cutRuns(wall);
  cut.runs.forEach(function (r) { emitRun(mesh, wall, r.t0, r.t1, y0 + r.yLo, y0 + r.yHi, n); });
  cut.openings.forEach(function (o) { emitOpening(mesh, wall, o, y0, n); });

/* ---------------- floor slabs ---------------- */
/* Slab per room rect: 0.12 thick, top at room floor level (y0). */
function emitSlab(mesh, room) {
  var y0 = room.y0 || 0;
  var r = room.rect;
  mesh.box(r.x, y0 - SLAB_T, r.z, r.w, SLAB_T, r.d, matColor(room.floor, 'floor'));
}

/* ---------------- roofs v1 ---------------- */
/* Helper: push one AABB record directly (collision mode for non-box geometry). */

}

}

function emitRoof(mesh, building) {

    var ph = 0.4, pt = 0.12, py = top + 0.15; // parapet

    mesh.box(x0 - oh, py, z0 - oh, pt, ph, fp.d + 2 * oh, col);

                      [r1, top + rise2, zc2], [r0, top + rise2, zc2], col);
      emitSlope(mesh, [x1 + oh, top, z1 + oh], [x0 - oh, top, z1 + oh],
                      [r0, top + rise2, zc2], [r1, top + rise2, zc2], col);
      emitSlope(mesh, [x0 - oh, top, z1 + oh], [x0 - oh, top, z0 - oh],
                      [r0, top + rise2, zc2], [r0, top + rise2, zc2], col);
      emitSlope(mesh, [x1 + oh, top, z0 - oh], [x1 + oh, top, z1 + oh],
                      [r1, top + rise2, zc2], [r1, top + rise2, zc2], col);
    } else {
      var s0 = z0 + inset, s1 = z1 - inset, xc2 = 0;
      emitSlope(mesh, [x0 - oh, top, z0 - oh], [x0 - oh, top, z1 + oh],
                      [xc2, top + rise2, s1], [xc2, top + rise2, s0], col);
      emitSlope(mesh, [x1 + oh, top, z1 + oh], [x1 + oh, top, z0 - oh],
                      [xc2, top + rise2, s0], [xc2, top + rise2, s1], col);
      emitSlope(mesh, [x1 + oh, top, z0 - oh], [x0 - oh, top, z0 - oh],
                      [xc2, top + rise2, s0], [xc2, top + rise2, s0], col);
      emitSlope(mesh, [x0 - oh, top, z1 + oh], [x1 + oh, top, z1 + oh],

/* ---------------- room assembly ---------------- */
/* roomsFromWalls(walls) — detect axis-aligned rectangular rooms: candidate
 * rects from wall coordinate lines; a rect is a room when wall segments cover
 * each of its 4 edges within 0.01. Largest-first, no interior overlap.

 * area < 14 → bed; else living. */

  walls.forEach(function (w, i) {
    if (isXWall(w)) { hWalls.push({ c: w.a.z, a: Math.min(w.a.x, w.b.x), b: Math.max(w.a.x, w.b.x), i: i }); xs[w.a.x] = 1; xs[w.b.x] = 1; }
    else if (isZWall(w)) { vWalls.push({ c: w.a.x, a: Math.min(w.a.z, w.b.z), b: Math.max(w.a.z, w.b.z), i: i }); zs[w.a.z] = 1; zs[w.b.z] = 1; }
  });
  var X = Object.keys(xs).map(Number).sort(function (a, b) { return a - b; });
  var Z = Object.keys(zs).map(Number).sort(function (a, b) { return a - b; });

    var runs = segs.filter(function (s) { return Math.abs(s.c - at) <= PERIM_TOL; })
      .map(function (s) { return [Math.max(s.a, lo), Math.min(s.b, hi)]; })
      .filter(function (r) { return r[1] > r[0]; })
      .sort(function (p, q) { return p[0] - q[0]; });

    for (var k = 0; k < runs.length; k++) {

  for (var xi = 0; xi < X.length; xi++) for (var xj = xi + 1; xj < X.length; xj++)
    for (var zi = 0; zi < Z.length; zi++) for (var zj = zi + 1; zj < Z.length; zj++) {
      var x0 = X[xi], x1 = X[xj], z0 = Z[zi], z1 = Z[zj];
      if (x1 - x0 < 1 || z1 - z0 < 1) continue;
      if (!coversEdge(hWalls, z0, x0, x1)) continue;
      if (!coversEdge(hWalls, z1, x0, x1)) continue;

window.gl = gl; // CityMesh.upload() needs global gl

function prog(vs, fs) {

// Lit program: 23-float CityMesh stride, p@0 n@12 c@24 bytes.
var lit = prog(
  'attribute vec3 a_p; attribute vec3 a_n; attribute vec3 a_c;\n' +
  'uniform mat4 u_mvp; varying vec3 v_c; varying vec3 v_n; varying float v_y;\n' +
  'void main(){ gl_Position = u_mvp * vec4(a_p,1.0); v_c=a_c; v_n=a_n; v_y=a_p.y; }',
  'precision mediump float; varying vec3 v_c; varying vec3 v_n; varying float v_y;\n' +
  'void main(){\n' +
  '  vec3 n = normalize(v_n);\n' +
  '  vec3 skyC = vec3(0.62,0.72,0.92); vec3 gndC = vec3(0.42,0.40,0.36);\n' +
  '  vec3 amb = mix(gndC, skyC, n.y*0.5+0.5) * 0.78;\n' +
  '  vec3 L = normalize(vec3(0.55,0.75,0.35));\n' +
  '  float dif = max(dot(n,L),0.0);\n' +
  '  float back = max(dot(n,-L),0.0)*0.5;\n' +
  '  vec3 col = v_c * (amb + (dif*0.95+back) * vec3(1.0,0.98,0.93));\n' +
  '  col *= 0.80 + 0.20*clamp(v_y/1.6,0.0,1.0);\n' +   // cheap contact AO
  '  gl_FragColor = vec4(col,1.0);\n' +
  '}');
var litLoc = {
  mvp: gl.getUniformLocation(lit, 'u_mvp'),
  p: gl.getAttribLocation(lit, 'a_p'),
  n: gl.getAttribLocation(lit, 'a_n'),
  c: gl.getAttribLocation(lit, 'a_c')
};
// Flat color program (collision wireframes).
var flat = prog(
  'attribute vec3 a_p; uniform mat4 u_mvp;\n' +
  'void main(){ gl_Position = u_mvp * vec4(a_p,1.0); }',
  'precision mediump float; uniform vec3 u_color;\n' +
  'void main(){ gl_FragColor = vec4(u_color,1.0); }');
var flatLoc = { mvp: gl.getUniformLocation(flat, 'u_mvp'), p: gl.getAttribLocation(flat, 'a_p'), color: gl.getUniformLocation(flat, 'u_color') };
// Textured quad (soft shadow blob under the plot).
var texq = prog(
  'attribute vec3 a_p; attribute vec2 a_uv; uniform mat4 u_mvp; varying vec2 v_uv;\n' +
  'void main(){ gl_Position = u_mvp * vec4(a_p,1.0); v_uv = a_uv; }',
  'precision mediump float; varying vec2 v_uv; uniform sampler2D u_tex;\n' +
  'void main(){ vec4 t = texture2D(u_tex, v_uv); gl_FragColor = vec4(0.10,0.14,0.20, t.a*0.28); }');
var texqLoc = { mvp: gl.getUniformLocation(texq, 'u_mvp'), p: gl.getAttribLocation(texq, 'a_p'), uv: gl.getAttribLocation(texq, 'a_uv') };

function drawMesh(m) {
  gl.bindBuffer(gl.ARRAY_BUFFER, m.buffer);
  var S = 23 * 4;
  gl.enableVertexAttribArray(litLoc.p);
  gl.vertexAttribPointer(litLoc.p, 3, gl.FLOAT, false, S, 0);
  gl.enableVertexAttribArray(litLoc.n);
  gl.vertexAttribPointer(litLoc.n, 3, gl.FLOAT, false, S, 12);
  gl.enableVertexAttribArray(litLoc.c);
  gl.vertexAttribPointer(litLoc.c, 3, gl.FLOAT, false, S, 24);
  gl.uniformMatrix4fv(litLoc.mvp, false, vpM);
  if (m.indexBuffer) {
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, m.indexBuffer);
    gl.drawElements(gl.TRIANGLES, m.count, gl.UNSIGNED_SHORT, 0);
  } else {
    gl.drawArrays(gl.TRIANGLES, 0, m.vertexCount);
  }
  gl.disableVertexAttribArray(litLoc.p);
  gl.disableVertexAttribArray(litLoc.n);
  gl.disableVertexAttribArray(litLoc.c);

/* ---------------- static scenery: plot slab, grid, soft shadow ---------------- */

function buildScenery() {

  var grass = hexRgb('#69a84f'), grassD = hexRgb('#5c9445'), line = hexRgb('#8fce76');
  var H = PLOT / 2;
  // floating slab: grass top, darker dirt sides
  m.box(-H, -0.5, -H, PLOT, 0.5, PLOT, grassD);
  m.box(-H, -0.02, -H, PLOT, 0.02, PLOT, grass);
  // grid lines every 0.5m, hair above the slab top
  var t = 0.025, y = 0.001;
  for (var g = -H; g <= H + 1e-6; g += 0.5) {
    m.box(-H, y, g - t/2, PLOT, 0.014, t, line);
    m.box(g - t/2, y, -H, t, 0.014, PLOT, line);
  }
  // thin pale border rim around the plot edge
  var rim = hexRgb('#dfe8d8'), e = 0.09;
  m.box(-H-e, -0.02, -H-e, PLOT+2*e, 0.05, e, rim);
  m.box(-H-e, -0.02, H, PLOT+2*e, 0.05, e, rim);
  m.box(-H-e, -0.02, -H, e, 0.05, PLOT, rim);
  m.box(H, -0.02, -H, e, 0.05, PLOT, rim);
  m.upload();
  plotMesh = m;

  // radial-gradient shadow texture
  var c = document.createElement('canvas'); c.width = c.height = 128;
  var x2 = c.getContext('2d');
  var gr = x2.createRadialGradient(64,64,6, 64,64,62);
  gr.addColorStop(0, 'rgba(0,0,0,0.9)');
  gr.addColorStop(0.45, 'rgba(0,0,0,0.38)');
  gr.addColorStop(1, 'rgba(0,0,0,0)');

  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

  var S = 7.5;
  shadowBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, shadowBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
    -S,-0.6,-S, 0,0,   S,-0.6,-S, 1,0,   S,-0.6,S, 1,1,

function drawShadow() {

  gl.enableVertexAttribArray(texqLoc.p);
  gl.vertexAttribPointer(texqLoc.p, 3, gl.FLOAT, false, 20, 0);
  gl.enableVertexAttribArray(texqLoc.uv);
  gl.vertexAttribPointer(texqLoc.uv, 2, gl.FLOAT, false, 20, 12);

/* ---------------- wall pipeline ---------------- */
function snap(v) { return Math.round(v / 0.5) * 0.5; }

function nearestEndpoint(p, maxD) {

  state.walls.forEach(function (w) {
    [w.a, w.b].forEach(function (e) {
      var d = Math.hypot(p.x - e.x, p.z - e.z);
      if (d < bd) { bd = d; best = e; }
    });
  });
  return best ? { x: best.x, z: best.z } : null;
}
function snapPoint(gx, gz) {
  var p = { x: snap(clampPlot(gx)), z: snap(clampPlot(gz)) };
  return nearestEndpoint(p, 0.6) || p;
}
/* Axis lock: build-mode drags snap to the dominant axis from the drag start,
 * so walls come out axis-aligned and rooms actually close. Magnetic endpoint
 * snap only applies when the endpoint sits exactly on the locked axis. */
function lockPoint(a, raw, lock) {
  var p = { x: raw.x, z: raw.z };
  if (lock === 'x') p.z = a.z; else if (lock === 'z') p.x = a.x;
  var ep = nearestEndpoint(p, 0.6);
  if (ep) {

    if (onAxis) p = { x: ep.x, z: ep.z };

}
function wallLen(w) { return Math.hypot(w.b.x - w.a.x, w.b.z - w.a.z); }
function isXWall(w) { return Math.abs(w.b.z - w.a.z) < 1e-9; }
function leftNormal(w) {
  var dx = w.b.x - w.a.x, dz = w.b.z - w.a.z, l = Math.hypot(dx, dz) || 1;
  return { x: -dz / l, z: dx / l };
}
/* Orient each wall so its interior skin faces the room it belongs to.
 * Struct.emit uses left(a->b) as interior, so we flip a<->b when needed
 * (remapping socket t -> 1-t). Walls shared by 2+ rooms become partitions
 * (exterior=false -> inner material on both faces). This makes the render
 * path byte-identical to Struct.emitCollision's path. */
function orientWalls(walls, rooms) {
  return walls.map(function (w, i) {
    var c = JSON.parse(JSON.stringify(w));
    var roomIdx = [];
    rooms.forEach(function (r, ri) { if (r.wallIds.indexOf(i) >= 0) roomIdx.push(ri); });
    c.exterior = roomIdx.length < 2;
    if (roomIdx.length) {
      var r = rooms[roomIdx[0]].rect;
      var cx = r.x + r.w / 2, cz = r.z + r.d / 2;
      var mx = (c.a.x + c.b.x) / 2, mz = (c.a.z + c.b.z) / 2;
      var ln = leftNormal(c);
      var dot = (cx - mx) * ln.x + (cz - mz) * ln.z;
      if (dot < 0) {
        var t = c.a; c.a = c.b; c.b = t;
        (c.sockets || []).forEach(function (s) { s.t = 1 - s.t; });
      }
    }
    return c;
  });
}

function canonicalBuilding() {
  var rooms = Struct.roomsFromWalls(state.walls);
  var walls = orientWalls(state.walls, rooms);
  var maxH = 0;
  walls.forEach(function (w) { maxH = Math.max(maxH, w.h || 2.7); });
  return {
    seed: 'builder', theme: 'custom', frame: state.frame,
    walls: walls, rooms: rooms,
    roof: { type: 'none', mat: 'shingle' }, // roof emitted separately, hugging the walls
    roofCfg: state.roof ? { type: state.roof.type, topY: Math.max(2.7, maxH) } : null,
    stories: 1, footprint: { w: PLOT, d: PLOT }
  };
}

/* Roof hugging the walls: bbox of wall endpoints + 0.9m pad. emitRoof centers
 * on origin, so emit into a temp mesh and merge with the bbox-center offset. */
function buildingBBox(walls) {
  var x0 = 1e9, x1 = -1e9, z0 = 1e9, z1 = -1e9;
  walls.forEach(function (w) {
    [w.a, w.b].forEach(function (p) {
      if (p.x < x0) x0 = p.x; if (p.x > x1) x1 = p.x;
      if (p.z < z0) z0 = p.z; if (p.z > z1) z1 = p.z;
    });
  });
  if (x0 > x1) return null;
  var pad = 0.9;
  return { x0: x0 - pad, x1: x1 + pad, z0: z0 - pad, z1: z1 + pad };
}
function emitRoofHugging(mesh, b) {
  // returns collision solids for the roof (already offset); appends triangles to mesh
  var solids = [];
  if (!b.roofCfg || !b.walls.length) return solids;
  var bb = buildingBBox(b.walls);
  if (!bb) return solids;
  var cx = (bb.x0 + bb.x1) / 2, cz = (bb.z0 + bb.z1) / 2;
  var pseudo = {
    footprint: { w: bb.x1 - bb.x0, d: bb.z1 - bb.z0 },
    stories: b.roofCfg.topY / 2.7, // emitRoof reads stories*2.7 as the wall top
    roof: { type: b.roofCfg.type, mat: ROOF_MAT[b.roofCfg.type] }
  };
  var tmp = new CityMesh();
  Struct.emitRoof(tmp, pseudo);
  var base = mesh.data.length / 23;
  for (var i = 0; i < tmp.data.length; i += 23) { tmp.data[i] += cx; tmp.data[i + 2] += cz; }
  for (i = 0; i < tmp.data.length; i++) mesh.data.push(tmp.data[i]);
  for (i = 0; i < tmp.indices.length; i++) mesh.indices.push(tmp.indices[i] + base);
  var cm = new CityMesh(); cm.solids = [];
  Struct.emitRoof(cm, pseudo);
  cm.solids.forEach(function (s) {
    solids.push({
      lo: [s.lo[0] + cx, s.lo[1], s.lo[2] + cz],
      hi: [s.hi[0] + cx, s.hi[1], s.hi[2] + cz],
      c: s.c, mat: s.mat, kind: s.kind, anchor: s.anchor
    });
  });
  return solids;
}

  Struct.emit(mesh, b); // walls + slabs (roof:'none' no-ops)
  return emitRoofHugging(mesh, b);
}
function collideFull(b) {
  var solids = Struct.emitCollision(b);
  var tmp = new CityMesh();
  var roofSolids = emitRoofHugging(tmp, b); // triangles land in tmp (discarded)
  return solids.concat(roofSolids);
}

/* Simple placeholder furniture — plain clean boxes, honestly placeholders.
 * Placed on detected room rects (slab top y=0). */
function emitFurniture(mesh, rooms) {
  if (!state.decorated || !rooms.length) return;
  var wood = hexRgb('#a97e4f'), fabric = hexRgb('#7a8ba8'), fabric2 = hexRgb('#b08968'), white = hexRgb('#eef0f2');
  function box(x, y, z, w, h, d, c) { mesh.box(x, y, z, w, h, d, c); }
  var placed = 0;
  rooms.forEach(function (r) {
    if (placed >= 4) return;
    var rc = r.rect, cx = rc.x + rc.w / 2, cz = rc.z + rc.d / 2;
    if (r.type === 'bed' || (r.type === 'living' && placed === 0)) {
      // bed: base + pillow
      box(cx - 1.0, 0, cz - 0.75, 2.0, 0.45, 1.5, wood);
      box(cx - 1.0, 0.45, cz - 0.75, 2.0, 0.18, 1.5, white);
      box(cx - 0.85, 0.63, cz - 0.55, 0.5, 0.16, 1.1, fabric);
      placed++;
    } else if (r.type === 'living') {
      // sofa: base + back + arms
      box(cx - 0.9, 0, cz - 0.4, 1.8, 0.45, 0.8, fabric);
      box(cx - 0.9, 0.45, cz - 0.4, 1.8, 0.55, 0.22, fabric2);
      box(cx - 0.9, 0.45, cz + 0.18, 0.22, 0.35, 0.62, fabric2);
      box(cx + 0.68, 0.45, cz + 0.18, 0.22, 0.35, 0.62, fabric2);
      placed++;
    } else if (r.type === 'kitchen' || r.type === 'civic') {
      // table: top + legs
      box(cx - 0.8, 0.72, cz - 0.5, 1.6, 0.08, 1.0, wood);
      [[-0.72, -0.42], [0.72, -0.42], [-0.72, 0.42], [0.72, 0.42]].forEach(function (o) {
        box(cx + o[0] - 0.04, 0, cz + o[1] - 0.04, 0.08, 0.72, 0.08, wood);
      });
      placed++;
    } else if (r.type === 'hall' || r.type === 'bath' || r.type === 'garage') {
      // chair: seat + back
      box(cx - 0.22, 0.45, cz - 0.22, 0.44, 0.07, 0.44, wood);
      box(cx - 0.22, 0.52, cz - 0.26, 0.44, 0.55, 0.07, wood);
      [[-0.19, -0.19], [0.19, -0.19], [-0.19, 0.19], [0.19, 0.19]].forEach(function (o) {
        box(cx + o[0] - 0.03, 0, cz + o[1] - 0.03, 0.06, 0.45, 0.06, wood);
      });
      placed++;
    }
  });
}

var structMesh = null, collideLines = null, collideBuf = null;
function rebuild() {
  if (structMesh) structMesh.dispose();
  var b = canonicalBuilding();
  state.rooms = b.rooms;
  var mesh = new CityMesh();
  // ghost preview wall (bright accent box, same code path family as walls)
  var wallsPlus = b.walls.slice();
  if (state.ghost && wallLen(state.ghost) > 0.05) {
    wallsPlus.push({
      a: state.ghost.a, b: state.ghost.b, h: state.height, y0: 0,
      frame: state.frame, inner: 'glass-pane', outer: 'glass-pane',
      sockets: [], exterior: true
    });
  }
  var bRender = {
    seed: b.seed, theme: b.theme, frame: b.frame, walls: wallsPlus,
    rooms: b.rooms, roof: b.roof, roofCfg: b.roofCfg, stories: 1, footprint: b.footprint
  };
  emitFull(mesh, bRender);
  emitFurniture(mesh, b.rooms);
  mesh.upload();
  structMesh = mesh;

  // collision wireframes — dual-mode parity: same building, same emission
  if (collideBuf) { gl.deleteBuffer(collideBuf); collideBuf = null; }
  collideLines = null;
  if (state.showCollision) {
    var solids = collideFull(b);
    collideLines = solids;
    var pos = [];
    solids.forEach(function (s) {
      var x0 = s.lo[0], y0 = s.lo[1], z0 = s.lo[2], x1 = s.hi[0], y1 = s.hi[1], z1 = s.hi[2];
      var c = [[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1],[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]];
      [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]].forEach(function (e) {
        pos.push(c[e[0]][0], c[e[0]][1], c[e[0]][2], c[e[1]][0], c[e[1]][1], c[e[1]][2]);
      });
    });
    collideBuf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, collideBuf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(pos), gl.STATIC_DRAW);
    collideLines._count = pos.length / 3;

}
function drawCollision() {
  if (!collideBuf) return;
  gl.useProgram(flat);
  gl.bindBuffer(gl.ARRAY_BUFFER, collideBuf);
  gl.enableVertexAttribArray(flatLoc.p);
  gl.vertexAttribPointer(flatLoc.p, 3, gl.FLOAT, false, 0, 0);
  gl.uniformMatrix4fv(flatLoc.mvp, false, vpM);
  gl.uniform3f(flatLoc.color, 1.0, 0.62, 0.08);

/* ---------------- interaction ---------------- */
var pointers = {}, pinchD0 = 0, orbitLast = null, dragStart = null, dragLock = null;
var hintTimer = 0;
function hint(msg, ms) {
  var el = document.getElementById('hint');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(hintTimer);
  hintTimer = setTimeout(function () { el.classList.remove('show'); }, ms || 2200);
}
function evPos(e) {
  var r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * 2 - 1, y: -((e.clientY - r.top) / r.height * 2 - 1) };
}
function pickWall(p) {
  var best = -1, bestD = 0.45, bestT = 0;
  state.walls.forEach(function (w, i) {
    var ax = w.a.x, az = w.a.z, bx = w.b.x, bz = w.b.z;
    var dx = bx - ax, dz = bz - az, L2 = dx * dx + dz * dz;
    if (!L2) return;
    var t = ((p[0] - ax) * dx + (p[1] - az) * dz) / L2;
    t = Math.max(0, Math.min(1, t));
    var d = Math.hypot(p[0] - (ax + dx * t), p[1] - (az + dz * t));
    if (d < bestD) { bestD = d; best = i; bestT = t; }
  });
  return best < 0 ? null : { i: best, t: bestT };
}
function socketFits(wall, t, kind, style) {
  var d = Struct.socketDims({ kind: kind, style: style });
  var L = wallLen(wall);
  if (d.w > L - 0.6) return false;
  if (t * L < d.w / 2 + 0.3 || (1 - t) * L < d.w / 2 + 0.3) return false;
  return !(wall.sockets || []).some(function (s) {
    var d2 = Struct.socketDims(s);
    return Math.abs(s.t - t) * L < (d.w + d2.w) / 2 + 0.4;
  });
}

canvas.addEventListener('pointerdown', function (e) {
  canvas.setPointerCapture(e.pointerId);
  pointers[e.pointerId] = evPos(e);
  var n = Object.keys(pointers).length;
  if (n === 2) { // pinch begins
    var ks = Object.keys(pointers);
    pinchD0 = Math.hypot(pointers[ks[0]].x - pointers[ks[1]].x, pointers[ks[0]].y - pointers[ks[1]].y);
    dragStart = null; state.ghost = null; orbitLast = null; dragLock = null;
    return;
  }
  if (n > 1) return;
  var p = pointers[e.pointerId];
  if (state.tool === 'socket') {
    var g = groundPick(p.x, p.y);
    if (g) {
      var hit = pickWall(g);
      if (hit) openSocketSheet(hit.i, hit.t);
      else hint('Tap a wall to add a window or door.');
    }
    return;
  }
  if (state.mode === 'build') {
    var g2 = groundPick(p.x, p.y);
    if (g2) {
      var s = snapPoint(g2[0], g2[1]);
      dragStart = s; dragLock = null;
      state.ghost = { a: s, b: { x: s.x, z: s.z } };
    }
  } else {
    orbitLast = { x: e.clientX, y: e.clientY };
  }
});
canvas.addEventListener('pointermove', function (e) {
  if (!pointers[e.pointerId]) return;
  pointers[e.pointerId] = evPos(e);
  var n = Object.keys(pointers).length;
  if (n === 2) {
    var ks = Object.keys(pointers);
    var d = Math.hypot(pointers[ks[0]].x - pointers[ks[1]].x, pointers[ks[0]].y - pointers[ks[1]].y);
    if (pinchD0 > 0) cam.dist = Math.max(6, Math.min(34, cam.dist * (pinchD0 / d)));
    pinchD0 = d;
    return;
  }
  if (state.mode === 'orbit' && orbitLast) {
    cam.yaw -= (e.clientX - orbitLast.x) * 0.006;
    cam.pitch = Math.max(0.18, Math.min(1.35, cam.pitch + (e.clientY - orbitLast.y) * 0.006));
    orbitLast = { x: e.clientX, y: e.clientY };
    return;
  }
  if (state.mode === 'build' && dragStart && !state.tool) {
    var g = groundPick(pointers[e.pointerId].x, pointers[e.pointerId].y);
    if (g) {
      var raw = { x: snap(clampPlot(g[0])), z: snap(clampPlot(g[1])) };
      var dx = raw.x - dragStart.x, dz = raw.z - dragStart.z;
      if (!dragLock && Math.hypot(dx, dz) >= 0.5)
        dragLock = Math.abs(dx) >= Math.abs(dz) ? 'x' : 'z';
      state.ghost.b = lockPoint(dragStart, raw, dragLock);
      rebuild();
    }
  }
});
function endPointer(e) {
  delete pointers[e.pointerId];
  if (Object.keys(pointers).length < 2) pinchD0 = 0;
  if (state.mode === 'build' && dragStart && state.ghost) {
    var a = { x: dragStart.x, z: dragStart.z }, b = state.ghost.b; // already locked+snapped
    var L = Math.hypot(b.x - a.x, b.z - a.z);
    if (L >= 1.0) {
      state.walls.push({
        a: a, b: b, h: state.height, y0: 0,
        frame: state.frame, inner: state.inner, outer: state.outer,
        sockets: [], exterior: true
      });
      hint('Wall added — ' + L.toFixed(1) + ' m');
    } else if (L > 0.05) {
      hint('Walls need to be at least 1.0 m long.');
    }
    dragStart = null; state.ghost = null; dragLock = null;
    rebuild();
  }
  orbitLast = null;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', function (e) {
  e.preventDefault();
  cam.dist = Math.max(6, Math.min(34, cam.dist * (1 + Math.sign(e.deltaY) * 0.08)));
}, { passive: false });

/* ---------------- HUD + labels ---------------- */
function updateHUD() {
  document.getElementById('hud').textContent =
    state.walls.length + (state.walls.length === 1 ? ' wall' : ' walls') + ' · ' +
    state.rooms.length + (state.rooms.length === 1 ? ' room' : ' rooms');
}
var labelDivs = [];
function renderLabels() {
  var host = document.getElementById('labels');
  host.innerHTML = ''; labelDivs = [];
  state.rooms.forEach(function (r) {
    var d = document.createElement('div');
    d.className = 'room-label'; d.textContent = r.type;
    host.appendChild(d); labelDivs.push({ el: d, r: r });
  });
  positionLabels();
}
function positionLabels() {
  var W = stage.clientWidth, H = stage.clientHeight;
  labelDivs.forEach(function (o) {
    var rc = o.r.rect;
    var p = project([rc.x + rc.w / 2, 2.1, rc.z + rc.d / 2]);
    o.el.style.left = p[0] + 'px'; o.el.style.top = p[1] + 'px';
    o.el.style.display = (p[2] < 1 && p[0] > -40 && p[0] < W + 40 && p[1] > -20 && p[1] < H + 20) ? '' : 'none';
  });
}
/* ---------------- toolbar UI ---------------- */
function matName(id) { var m = Struct.MATERIALS.filter(function (x) { return x.id === id; })[0]; return m ? m.name : id; }
function matColorCss(id) { var m = Struct.MATERIALS.filter(function (x) { return x.id === id; })[0]; return m ? m.color : '#999'; }
function chipRow(hostId, items, current, onPick) {
  var host = document.getElementById(hostId);
  host.innerHTML = '';
  items.forEach(function (it) {
    var b = document.createElement('button');
    b.className = 'chip' + (it.id === current ? ' on' : '');
    b.innerHTML = '<span class="dot" style="background:' + it.color + '"></span>' + it.label;
    b.onclick = function () { onPick(it.id); chipRow(hostId, items, it.id, onPick); };
    host.appendChild(b);
  });
}
function refreshMaterials() {
  var inners = Struct.MATERIALS.filter(function (m) { return m.kind === 'inner' || m.kind === 'both'; })
    .map(function (m) { return { id: m.id, label: m.name, color: m.color }; });
  var outers = Struct.MATERIALS.filter(function (m) { return m.kind === 'outer' || m.kind === 'both'; })
    .map(function (m) { return { id: m.id, label: m.name, color: m.color }; });
  chipRow('innerChips', inners, state.inner, function (id) { state.inner = id; });
  chipRow('outerChips', outers, state.outer, function (id) { state.outer = id; });
}

function refreshTools() {
  var host = document.getElementById('toolChips');
  host.innerHTML = '';
  function tb(label, on, fn) {
    var b = document.createElement('button');
    b.className = 'btn' + (on ? ' on' : '');
    b.textContent = label; b.onclick = fn; host.appendChild(b);
    return b;
  }
  tb(state.frame === 'wood-frame' ? 'Frame: wood' : 'Frame: steel',
     false, function () {
       state.frame = state.frame === 'wood-frame' ? 'metal-frame' : 'wood-frame';
       refreshTools();
     });
  var st = document.createElement('div'); st.className = 'stepper';
  st.innerHTML = '<button id="hDown">−</button><div class="val">' + state.height.toFixed(1) + ' m</div><button id="hUp">+</button>';
  host.appendChild(st);
  st.querySelector('#hDown').onclick = function () { state.height = Math.max(2.1, +(state.height - 0.3).toFixed(1)); refreshTools(); };
  st.querySelector('#hUp').onclick = function () { state.height = Math.min(3.6, +(state.height + 0.3).toFixed(1)); refreshTools(); };
  tb('Socket', state.tool === 'socket', function () {
    state.tool = state.tool === 'socket' ? null : 'socket';
    refreshTools();
    hint(state.tool === 'socket' ? 'Socket mode: tap a wall to add a window or door.' : 'Socket mode off.');
  });
  tb('Roof' + (state.roof ? ': ' + state.roof.type : ''), !!state.roof, openRoofSheet);
  tb('Decorate', state.decorated, function () {
    state.decorated = !state.decorated; refreshTools(); rebuild();
    if (state.decorated) hint('Simple placeholder furniture placed — plain boxes for now.');
  });
  var cb = tb('Collision', state.showCollision, function () {
    state.showCollision = !state.showCollision; refreshTools(); rebuild();
  });
  cb.classList.add('warn');
}

/* ---------------- bottom sheet ---------------- */
var sheetCtx = null;
function openSheet(title, sub, chips, applyLabel, onApply) {
  document.getElementById('sheetTitle').textContent = title;
  document.getElementById('sheetSub').textContent = sub;
  var host = document.getElementById('sheetChips');
  host.innerHTML = '';
  var sel = chips.length ? chips[0].id : null;
  chips.forEach(function (c) {
    var b = document.createElement('button');
    b.className = 'chip' + (c.id === sel ? ' on' : '');
    b.innerHTML = (c.color ? '<span class="dot" style="background:' + c.color + '"></span>' : '') + c.label;
    b.onclick = function () {
      sel = c.id;
      Array.prototype.forEach.call(host.children, function (x) { x.classList.remove('on'); });
      b.classList.add('on');
    };
    host.appendChild(b);
  });
  sheetCtx = { get: function () { return sel; }, onApply: onApply };
  document.getElementById('sheetApply').textContent = applyLabel || 'Apply';
  document.getElementById('sheet').classList.add('open');
  document.getElementById('scrim').classList.add('open');
}
function closeSheet() {
  document.getElementById('sheet').classList.remove('open');
  document.getElementById('scrim').classList.remove('open');
  sheetCtx = null;
}
document.getElementById('sheetCancel').onclick = closeSheet;
document.getElementById('scrim').onclick = closeSheet;
document.getElementById('sheetApply').onclick = function () {
  var keep = sheetCtx && sheetCtx.onApply ? sheetCtx.onApply(sheetCtx.get()) === true : false;
  if (!keep) closeSheet();
};

function openSocketSheet(wi, t) {
  var w = state.walls[wi];
  var kinds = [{ id: 'window', label: 'Window' }, { id: 'door', label: 'Door' }];
  openSheet('Wall socket', 'Pick a kind, then a style. It cuts into the wall where you tapped.',
    kinds, 'Choose style', function (kind) {
      var styles = kind === 'window'
        ? Object.keys(Struct.WINDOW_STYLES).map(function (s) { return { id: s, label: s }; })
        : Object.keys(Struct.DOOR_STYLES).map(function (s) { return { id: s, label: s }; });
      if ((w.sockets || []).length) styles.push({ id: '__clear', label: '✕ clear sockets' });
      openSheet((kind === 'window' ? 'Window' : 'Door') + ' style',
        'Wall ' + (wi + 1) + ', ' + wallLen(w).toFixed(1) + ' m long.',
        styles, 'Add ' + kind, function (style) {
          if (style === '__clear') {
            w.sockets = []; rebuild(); hint('Sockets removed.');
            return; // closes the sheet
          }
          if (socketFits(w, t, kind, style)) {
            w.sockets.push({ t: t, kind: kind, style: style });
            w.sockets.sort(function (a, b) { return a.t - b.t; });
            rebuild();
            hint(kind + ' added (' + style + ').');
          } else {
            hint('Does not fit there — too close to an end or another opening.');
          }
        });
      return true; // keep the sheet open: the style step opens its own sheet
    });
}
function openRoofSheet() {
  var opts = [
    { id: 'flat', label: 'Flat — slab + parapet' },
    { id: 'gable', label: 'Gable — 30° ridge' },
    { id: 'hip', label: 'Hip — 28° all sides' },
    { id: 'none', label: 'Remove roof' }
  ];
  openSheet('Roof', 'Caps the whole plot at the top of the walls.', opts, 'Set roof', function (id) {
    state.roof = id === 'none' ? null : { type: id };
    refreshTools(); rebuild();
  });
}

/* ---------------- mode switch / seed / clear ---------------- */
function setMode(m) {
  state.mode = m; state.tool = null;
  document.getElementById('btnBuild').classList.toggle('on', m === 'build');
  document.getElementById('btnOrbit').classList.toggle('on', m === 'orbit');
  refreshTools();
  hint(m === 'build' ? 'Build mode: drag on the grass to draw a wall.' : 'Orbit mode: drag to rotate, pinch to zoom.');
}
document.getElementById('btnBuild').onclick = function () { setMode('build'); };
document.getElementById('btnOrbit').onclick = function () { setMode('orbit'); };

function applyGenerated(seed) {
  var b = Struct.makeBuilding(seed || 'cottage', state.theme, { w: 10, d: 8 }, 1);
  // adopt the procedural walls as editable user walls (ground story)
  state.walls = b.walls.filter(function (w) { return (w.y0 || 0) === 0; })
    .map(function (w) {
      return {
        a: { x: w.a.x, z: w.a.z }, b: { x: w.b.x, z: w.b.z },
        h: w.h, y0: 0, frame: w.frame, inner: w.inner, outer: w.outer,
        sockets: (w.sockets || []).map(function (s) { return { t: s.t, kind: s.kind, style: s.style }; }),
        exterior: w.exterior !== false
      };
    });
  state.roof = { type: b.roof.type };
  state.decorated = false;
  refreshTools(); rebuild();
  hint('Generated "' + (seed || 'cottage') + '" — ' + state.walls.length + ' walls. Drag to edit, or clear.');
}
document.getElementById('btnGen').onclick = function () {
  applyGenerated(document.getElementById('seedInput').value.trim());
};
document.getElementById('btnClear').onclick = function () {
  state.walls = []; state.roof = null; state.decorated = false; state.ghost = null;
  refreshTools(); rebuild();
  hint('Plot cleared. Drag on the grass to draw your first wall.');
};

/* ---------------- render loop / resize ---------------- */
function resize() {
  var w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  gl.viewport(0, 0, canvas.width, canvas.height);
  updateMats(canvas.width, canvas.height);
}
window.addEventListener('resize', function () { resize(); positionLabels(); });

var lastT = 0;
function frame(t) {
  requestAnimationFrame(frame);
  if (t - lastT < 33) return; // ~30fps is plenty for SwiftShader + battery
  lastT = t;
  updateMats(canvas.width, canvas.height);
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);
  gl.useProgram(lit);
  drawMesh(plotMesh);
  drawMesh(structMesh);
  drawShadow();
  drawCollision();
  positionLabels();
}

/* ---------------- test hooks (headless verification) ---------------- */
window.__SB = {
  state: state,
  addWall: function (a, b) { // same code path as tap-drag finalize
    a = snapPoint(a.x, a.z);
    var raw = snapPoint(b.x, b.z);
    var lock = Math.abs(raw.x - a.x) >= Math.abs(raw.z - a.z) ? 'x' : 'z';
    b = lockPoint(a, raw, lock);
    if (Math.hypot(b.x - a.x, b.z - a.z) < 1.0) return false;
    state.walls.push({
      a: a, b: b, h: state.height, y0: 0, frame: state.frame,
      inner: state.inner, outer: state.outer, sockets: [], exterior: true
    });
    rebuild();
    return true;
  },
  addSocket: function (wi, t, kind, style) {
    var w = state.walls[wi];
    if (!w || !socketFits(w, t, kind, style)) return false;
    w.sockets.push({ t: t, kind: kind, style: style });
    rebuild();
    return true;
  },
  walls: function () { return state.walls.length; },
  rooms: function () { return state.rooms.length; },
  roomTypes: function () { return state.rooms.map(function (r) { return r.type; }); },
  clearAll: function () { state.walls = []; state.roof = null; state.decorated = false; rebuild(); },
  setRoof: function (type) { state.roof = type ? { type: type } : null; rebuild(); },
  generate: function (seed) { applyGenerated(seed); },
  emitVertexCount: function () { // canonical building, no furniture/ghost
    var b = canonicalBuilding();
    var m = new CityMesh();
    emitFull(m, b);
    return m.data.length / 23;
  },
  collisionCount: function () {
    return collideFull(canonicalBuilding()).length;
  },
  wallBoxCount: function () { // box() calls in triangle mode == expected AABB count
    var b = canonicalBuilding();
    var m = new CityMesh(), n = 0;
    var orig = m.box;
    m.box = function () { n++; return orig.apply(m, arguments); };
    emitFull(m, b);
    return n;
  },
  seedWallCount: function (seed, theme) {
    return Struct.makeBuilding(seed, theme || 'craftsman', { w: 10, d: 8 }, 1).walls.length;
  },
  seedJSON: function (seed, theme) {
    var b = Struct.makeBuilding(seed, theme || 'craftsman', { w: 10, d: 8 }, 1);
    return JSON.stringify(b.walls.map(function (w) {
      return [w.a.x, w.a.z, w.b.x, w.b.z, w.h, w.frame, w.inner, w.outer,
              (w.sockets || []).map(function (s) { return [s.t, s.kind, s.style]; })];
    }));
  }
};

/* ---------------- init ---------------- */
refreshMaterials();
refreshTools();
buildScenery();
resize();
rebuild();
setMode('build');
hint('Drag on the grass to draw your first wall.', 3000);
requestAnimationFrame(frame);
})();
</script></body></html>
