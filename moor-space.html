<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Moor · Your Space</title>
<style>
:root{
  --bg:#0c0e0b; --ink:#f2f5ea; --mut:#a7b198; --faint:#6f7a64;
  --accent:#b8e986; --amber:#e8c87a; --blue:#9fc6e8; --rose:#e8a79f; --violet:#c4a9e8;
  --card:rgba(24,30,21,.66); --line:rgba(255,255,255,.09);
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink); overflow:hidden; overscroll-behavior:none;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
/* ---------- room (fixed backdrop) ---------- */
#room{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
#roomInner{position:absolute;inset:-8%;will-change:transform}
#grid{position:absolute;inset:0;
  background-image:linear-gradient(rgba(184,233,134,.055) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(184,233,134,.055) 1px,transparent 1px);
  background-size:46px 46px;
  -webkit-mask-image:radial-gradient(ellipse 85% 75% at 50% 45%,#000 25%,transparent 72%);
  mask-image:radial-gradient(ellipse 85% 75% at 50% 45%,#000 25%,transparent 72%);
}
.light{position:absolute;border-radius:50%;filter:blur(90px)}
#lightA{width:60vmax;height:60vmax;left:-18vmax;top:-22vmax;background:radial-gradient(circle,rgba(232,200,122,.14),transparent 65%)}
#lightB{width:70vmax;height:70vmax;right:-24vmax;bottom:-26vmax;background:radial-gradient(circle,rgba(184,233,134,.12),transparent 65%)}
#dust{position:absolute;inset:0}
.mote{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(220,235,200,.5),transparent 70%);
  animation:drift linear infinite;opacity:.5}
@keyframes drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(40px,-90px,0)}}
/* ---------- stage ---------- */
#stage{position:fixed;inset:0;z-index:1;perspective:1100px;overflow:hidden;touch-action:none;cursor:grab}
#stage.grabbing{cursor:grabbing}
#world{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
/* ---------- cards ---------- */
.cv{position:absolute;left:50%;top:50%;width:300px;border-radius:20px;padding:14px 16px 13px;
  background:linear-gradient(165deg,rgba(34,42,29,.78),rgba(15,19,13,.74));
  border:1px solid var(--line);
  box-shadow:0 18px 46px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.07),0 0 26px -6px var(--glow,rgba(184,233,134,.25));
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  transform-style:preserve-3d;touch-action:none;will-change:transform,opacity}
.cv-top{display:flex;align-items:center;gap:12px}
.cv-ic{width:38px;height:38px;flex:0 0 38px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--glow,#b8e986) 16%,transparent);
  border:1px solid color-mix(in srgb,var(--glow,#b8e986) 35%,transparent)}
.cv-ic svg{width:21px;height:21px;stroke:var(--glow,#b8e986);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.cv-kind{font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--faint)}
.cv-name{font-size:16.5px;font-weight:600;letter-spacing:.1px;margin-top:1px}
.cv-state{font-size:13px;color:var(--mut);margin-top:5px;line-height:1.45}
.cv-actions{display:flex;gap:8px;margin-top:11px}
.abtn{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);
  font-size:13.5px;font-weight:600;padding:8px 18px;border-radius:999px;cursor:pointer;min-height:38px}
.abtn:active{transform:scale(.96)}
.abtn.primary{background:color-mix(in srgb,var(--glow,#b8e986) 22%,transparent);
  border-color:color-mix(in srgb,var(--glow,#b8e986) 45%,transparent)}
.leftoff{position:absolute;top:11px;right:13px;display:flex;align-items:center;gap:6px;
  font-size:11px;font-weight:600;color:var(--accent);letter-spacing:.2px}
.leftoff::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.cv.peri{width:230px;padding:12px 14px 11px;opacity:.85}
.cv.peri .cv-ic{width:32px;height:32px;flex-basis:32px;border-radius:10px}
.cv.peri .cv-ic svg{width:18px;height:18px}
.cv.peri .cv-name{font-size:14.5px}
.cv.peri .cv-state{font-size:12.5px}
.cv.peri .abtn{min-height:34px;font-size:12.5px;padding:6px 14px}
.peri-label{display:none}
/* ---------- chrome ---------- */
#topbar{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:flex-start;
  padding:calc(10px + env(safe-area-inset-top)) 18px 0;pointer-events:none}
#brand{font-size:15px;font-weight:700;letter-spacing:.4px}
#hello{font-size:13px;color:var(--mut);margin-top:2px}
#warmline{font-size:12px;color:var(--faint);margin-top:3px;min-height:15px;transition:opacity .5s}
.pill{pointer-events:auto;display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--mut);
  border:1px solid var(--line);background:rgba(18,22,16,.6);padding:7px 13px;border-radius:999px;backdrop-filter:blur(8px)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
#guide{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));z-index:10;
  font-size:12.5px;color:var(--faint);background:rgba(14,17,12,.55);border:1px solid var(--line);
  padding:8px 16px;border-radius:999px;backdrop-filter:blur(8px);transition:opacity .8s;white-space:nowrap;pointer-events:none}
/* ---------- sheet ---------- */
#scrim{position:fixed;inset:0;z-index:18;background:rgba(5,7,5,.45);opacity:0;pointer-events:none;transition:opacity .3s}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;z-index:20;left:0;right:0;bottom:0;max-height:80dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:linear-gradient(180deg,rgba(30,37,26,.96),rgba(17,21,15,.97));
  border:1px solid var(--line);border-bottom:none;border-radius:26px 26px 0 0;
  transform:translateY(106%);transition:transform .42s var(--ease);padding:10px 22px calc(26px + env(safe-area-inset-bottom));
  box-shadow:0 -20px 60px rgba(0,0,0,.5)}
#sheet.open{transform:none}
#grab{width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.18);margin:6px auto 14px}
.sh-head{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.sh-head .cv-ic{width:42px;height:42px;flex-basis:42px}
.sh-name{font-size:18px;font-weight:700}
.sh-sub{font-size:13px;color:var(--mut);margin-top:2px}
.sh-x{margin-left:auto;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--mut);
  width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer;flex:0 0 auto}
.sec{margin-top:18px}
.sec h3{font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--faint);margin-bottom:9px}
.row{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);border-radius:13px;
  background:rgba(255,255,255,.025);margin-bottom:7px;font-size:14px;line-height:1.45}
.sh-actions{display:flex;gap:10px;margin-top:20px}
.sh-actions .abtn{flex:1;min-height:46px;font-size:15px}
/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(12px);
  z-index:30;background:rgba(24,30,21,.92);border:1px solid var(--line);color:var(--ink);font-size:13.5px;
  padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%)}
/* ---------- mobile: natural scroll, recency stack ---------- */
@media(max-width:699px){
  html,body{height:auto;min-height:100%}
  body{overflow-y:auto;overflow-x:hidden}
  #stage{position:relative;inset:auto;perspective:none;overflow:visible;touch-action:pan-y;cursor:default;min-height:100dvh}
  #world{position:relative;inset:auto;transform-style:flat;display:flex;flex-direction:column;align-items:center;
    padding:calc(104px + env(safe-area-inset-top)) 0 150px}
  .cv{position:relative;left:auto;top:auto;width:min(340px,calc(100vw - 56px));margin:0 0 14px;transform-origin:top center}
  .cv.peri{width:min(300px,calc(100vw - 72px))}
  .peri-label{display:block;font-size:12px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;
    color:var(--faint);margin:26px 0 12px}
  #guide{white-space:normal;text-align:center;max-width:calc(100vw - 48px)}
}
@media(min-width:700px){
  #sheet{left:auto;top:0;right:0;bottom:0;width:392px;max-height:none;border-radius:0;border-bottom:none;
    border-right:none;transform:translateX(106%);padding-top:calc(20px + env(safe-area-inset-top))}
  #sheet.open{transform:none}
  #grab{display:none}
}
@media(prefers-reduced-motion:reduce){.mote{animation:none}}
</style>
</head>
<body>
<div id="room"><div id="roomInner"><div id="grid"></div><div class="light" id="lightA"></div><div class="light" id="lightB"></div><div id="dust"></div></div></div>
<div id="stage"><div id="world"></div></div>
<header id="topbar">
  <div><div id="brand">Moor</div><div id="hello"></div><div id="warmline"></div></div>
  <div><span class="pill"><span class="dot"></span>phone linked</span></div>
</header>
<div id="guide"></div>
<div id="scrim"></div>
<section id="sheet" aria-label="details">
  <div id="grab"></div>
  <div class="sh-head">
    <span class="cv-ic" id="sh-ic"></span>
    <div><div class="sh-name" id="sh-name"></div><div class="sh-sub" id="sh-sub"></div></div>
    <button class="sh-x" id="sh-x" aria-label="close">✕</button>
  </div>
  <div id="sh-body"></div>
  <div class="sh-actions" id="sh-actions"></div>
</section>
<div id="toast"></div>
<script>
"use strict";
/* ================= data: your stuff, most recent first ================= */
const ICONS={
 project:'<svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12L4 7.5M12 12v9"/></svg>',
 chat:'<svg viewBox="0 0 24 24"><path d="M4 6.5h16v10H9l-5 4z"/><path d="M8 10.5h8M8 13.5h5"/></svg>',
 make:'<svg viewBox="0 0 24 24"><path d="M12 3l2.2 6.2 6.3 1.8-6.3 2.2L12 19.5l-2.2-6.3-6.3-1.8 6.3-2.2z"/></svg>',
 flow:'<svg viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 0 1 13-5.1M19.5 12a7.5 7.5 0 0 1-13 5.1"/><path d="M17.5 3.5v4h-4M6.5 20.5v-4h4"/></svg>',
 notes:'<svg viewBox="0 0 24 24"><path d="M6 3.5h9l4 4v13H6z"/><path d="M15 3.5v4h4M9.5 12h6M9.5 15.5h6"/></svg>',
 draft:'<svg viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19z"/><path d="M14.5 6.5l3 3"/></svg>',
 focus:'<svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="7.5"/><path d="M12 9.5v3.5l2.5 2M9.5 2.5h5"/></svg>',
 servers:'<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="16" height="6.5" rx="1.5"/><circle cx="8" cy="7.2" r=".9"/><circle cx="8" cy="16.7" r=".9"/></svg>',
 auto:'<svg viewBox="0 0 24 24"><path d="M5 12a7 7 0 0 1 12-4.9M19 12a7 7 0 0 1-12 4.9"/><path d="M17 3v4h-4M7 21v-4h4"/></svg>',
 world:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c-5.5 5-5.5 12 0 17M12 3.5c5.5 5 5.5 12 0 17"/></svg>'};
const CLUSTER=[
 {id:"colony",kind:"Project",icon:"project",glow:"#b8e986",name:"Colony game build",
  state:"Extraction-royale prototype is playable",action:"Open",leftoff:true,
  detail:["Extraction-royale prototype runs in the browser","Last touched today","Next: share a playable link"],
  done:"Opening your Colony game build"},
 {id:"busterchat",kind:"Conversation",icon:"chat",glow:"#9fc6e8",name:"Chat with Buster",
  state:"Talking through your home screen",action:"Continue",
  detail:["Talking through your home screen design","Last message just now","Picks up exactly where you left off"],
  done:"Back to your chat with Buster"},
 {id:"budget",kind:"Creation",icon:"make",glow:"#e8c87a",name:"Budget tracker",
  state:"Built today, ready to try",action:"Open",
  detail:["Built today with the kit builder","Ready to try with real numbers","Lives in your creations"],
  done:"Opening Budget tracker"},
 {id:"drum",kind:"Creation",icon:"make",glow:"#e8a79f",name:"Drum machine",
  state:"16-step sequencer, 3 sound kits",action:"Play",
  detail:["16-step sequencer with 3 sound kits","Pads play real synthesized audio","Last played today"],
  done:"Opening Drum machine"},
 {id:"phonesync",kind:"Flow",icon:"flow",glow:"#c4a9e8",name:"Phone sync",
  state:"Waiting on the PC-side run",action:"View steps",
  detail:["The drop file is ready in the mailbox","Waiting on the PC-side run","Run phone-sync.py on the PC to finish"],
  done:"Showing the phone sync steps"},
 {id:"daybook",kind:"Notes",icon:"notes",glow:"#9fe8c9",name:"Daybook",
  state:"Today's entry is half-written",action:"Continue",
  detail:["Today's entry is half-written","Mood and prompts are saved with it","Opens straight to today's page"],
  done:"Opening today's Daybook entry"},
 {id:"funnel",kind:"Draft",icon:"draft",glow:"#e8c87a",name:"Funnel v3 draft",
  state:"Closing questions need work",action:"Open",
  detail:["Closing questions need work","Draft v3, edited yesterday","Two sections are still blank"],
  done:"Opening Funnel v3 draft"}
];
const PERI=[
 {id:"focus",kind:"Utility",icon:"focus",glow:"#e8c87a",name:"Focus Timer",
  state:()=>FOCUS.left>0?fmt(FOCUS.left)+" left":"25 minutes, ready when you are",
  action:()=>FOCUS.left>0?"Pause":"Start",
  detail:["25 minute sessions, 5 minute breaks","3 sessions finished today"],
  done:"Timer started — 25 minutes"},
 {id:"servers",kind:"Utility",icon:"servers",glow:"#9fc6e8",name:"Servers",
  state:"web-01 is cruising",action:"Details",
  detail:["web-01 is cruising","Backups ran last night"],
  done:"Opening server details"},
 {id:"auto",kind:"Utility",icon:"auto",glow:"#b8e986",name:"Automations",
  state:()=>AUTO.on?"3 routines running":"Routines are resting",
  action:()=>AUTO.on?"Pause":"Resume",
  detail:()=>AUTO.on?["Morning routine · on","Nightly backup · on","Plant mister · on"]:["All routines are resting"],
  done:"Routines updated"},
 {id:"lworld",kind:"Utility",icon:"world",glow:"#b8e986",name:"Little World",
  state:"3 creatures, all fed",action:"Feed",
  detail:["3 creatures, all fed","Terrarium is warm and humid"],
  done:"Your creatures are eating"}
];
const FOCUS={left:0,timer:null}, AUTO={on:true};
const byId=id=>CLUSTER.concat(PERI).find(d=>d.id===id);
const st=d=>typeof d.state==="function"?d.state():d.state;
const actLabel=d=>typeof d.action==="function"?d.action():d.action;
const det=d=>typeof d.detail==="function"?d.detail():d.detail;
function fmt(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
/* desktop 3D placement: [x, y, z] — hero front-center, ring around it, nothing covering text */
const CPOS=[[0,60,130],[-350,-20,40],[350,-20,30],[-330,180,10],[330,180,0],[-160,-180,-20],[160,-180,-30]];
const PPOS={focus:[-520,370,-150],servers:[520,370,-150],auto:[-500,-240,-150],lworld:[500,-240,-150]};
/* ================= touch core: taps on pointer events only ================= */
let lastTap=0;
const markTap=()=>{lastTap=Date.now()};
document.addEventListener("click",e=>{ // a tap's belated synthesized click can never double-fire
  if(Date.now()-lastTap<700){e.stopPropagation();e.preventDefault()}
},true);
/* ================= build cards ================= */
const world=document.getElementById("world");
const items=[]; // {d, el, bx,by,bz, f, x,y}
function cardEl(d,peri){
  const el=document.createElement("div");
  el.className="cv"+(peri?" peri":"");
  el.dataset.id=d.id;el.style.setProperty("--glow",d.glow);
  el.innerHTML=(d.leftoff?'<span class="leftoff">where you left off</span>':"")+
   `<div class="cv-top"><span class="cv-ic">${ICONS[d.icon]}</span>
    <div><div class="cv-kind">${d.kind}</div><div class="cv-name">${d.name}</div></div></div>
    <div class="cv-state">${st(d)}</div>
    <div class="cv-actions"><button class="abtn primary">${actLabel(d)}</button></div>`;
  el.querySelector("button").addEventListener("pointerup",e=>{markTap();doAction(d.id)});
  let pt=null;
  el.addEventListener("pointerdown",e=>{pt={sx:e.clientX,sy:e.clientY,t:Date.now()}});
  el.addEventListener("pointermove",e=>{if(pt&&Math.hypot(e.clientX-pt.sx,e.clientY-pt.sy)>12)pt=null});
  el.addEventListener("pointercancel",()=>{pt=null});
  el.addEventListener("pointerup",e=>{
    if(!pt)return;const dx=e.clientX-pt.sx,dy=e.clientY-pt.sy,dt=Date.now()-pt.t;pt=null;
    if(e.target.closest("button"))return; // the button already handled it
    if(dt<500&&Math.hypot(dx,dy)<12){markTap();openSheet(d.id)}
  });
  el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openSheet(d.id)}});
  el.tabIndex=0;
  return el;
}
CLUSTER.forEach((d,i)=>{const el=cardEl(d,false);world.appendChild(el);
  items.push({d,el,bx:CPOS[i][0],by:CPOS[i][1],bz:CPOS[i][2],f:1+CPOS[i][2]/500,hero:i===0,x:0,y:0})});
const plabel=document.createElement("div");plabel.className="peri-label";plabel.textContent="Around the room";
world.appendChild(plabel);
PERI.forEach(d=>{const el=cardEl(d,true);world.appendChild(el);const p=PPOS[d.id];
  items.push({d,el,bx:p[0],by:p[1],bz:p[2],f:1+p[2]/500,x:0,y:0})});
function refreshCard(id){
  const it=items.find(i=>i.d.id===id);if(!it)return;
  it.el.querySelector(".cv-state").textContent=st(it.d);
  it.el.querySelector(".abtn").textContent=actLabel(it.d);
}
/* ================= layout: desktop 3D arc / mobile recency stack ================= */
const stage=document.getElementById("stage"),guide=document.getElementById("guide");
const cam={x:0,y:0,tx:0,ty:0};
const desk=()=>innerWidth>=700;
let interacted=false;
function markInteracted(){if(!interacted){interacted=true;guide.style.opacity=0}}
function layout(){
  const d=desk();
  guide.textContent=d?"drag to look · tap a card to open":"tap a card to open · scroll for more";
  items.forEach((it,i)=>{
    const el=it.el,peri=PERI.includes(it.d);
    if(d){
      el.style.position="";el.style.left="";el.style.top="";el.style.margin="";
      el.style.width=it.hero?"320px":peri?"220px":"240px";
      el.style.transform="";el.style.opacity=peri?".85":"";
      it.x=it.bx;it.y=it.by;
    }else{
      el.style.position="relative";el.style.left="auto";el.style.top="auto";
      el.style.width=peri?"min(300px,calc(100vw - 72px))":"min(340px,calc(100vw - 56px))";
      el.style.margin="0 0 14px";
      const ci=CLUSTER.indexOf(it.d);
      if(ci>=0){ // recency: nearest biggest, depth by scale + drift + fade
        const s=1-ci*0.045,ox=(ci%2?1:-1)*Math.min(ci,3)*5;
        el.style.transform=`scale(${s.toFixed(3)}) translateX(${ox}px)`;
        el.style.opacity=(1-ci*0.055).toFixed(3);
      }else{
        el.style.transform="scale(.94)";el.style.opacity=".8";
      }
    }
  });
  plabel.style.display=d?"none":"";
}
addEventListener("resize",layout);
/* ================= camera: desktop drag parallax / mobile scroll parallax ================= */
let bgd=null;
stage.addEventListener("pointerdown",e=>{
  if(!desk())return;
  if(e.target.closest(".cv,#sheet,#scrim,#topbar,button"))return;
  bgd={sx:e.clientX,sy:e.clientY,cx:cam.tx,cy:cam.ty};
  stage.classList.add("grabbing");
});
stage.addEventListener("pointermove",e=>{
  if(!bgd)return;
  const dx=e.clientX-bgd.sx,dy=e.clientY-bgd.sy;
  if(Math.hypot(dx,dy)>6)markInteracted();
  cam.tx=clamp(bgd.cx+dx*.3,-80,80);cam.ty=clamp(bgd.cy+dy*.3,-90,90);
});
const endBg=()=>{bgd=null;stage.classList.remove("grabbing")};
stage.addEventListener("pointerup",endBg);
stage.addEventListener("pointercancel",endBg);
const roomInner=document.getElementById("roomInner");
addEventListener("scroll",()=>{ // mobile: the room drifts gently as you scroll
  if(!desk())roomInner.style.transform=`translate3d(0,${(scrollY*0.06).toFixed(1)}px,0)`;
},{passive:true});
function tick(){
  requestAnimationFrame(tick);
  if(!desk())return;
  cam.x+=(cam.tx-cam.x)*.12;cam.y+=(cam.ty-cam.y)*.12;
  for(const it of items){
    const tx=it.bx+cam.x*it.f,ty=it.by+cam.y*it.f;
    it.x+=(tx-it.x)*.2;it.y+=(ty-it.y)*.2;
    it.el.style.transform=`translate(-50%,-50%) translate3d(${it.x.toFixed(1)}px,${it.y.toFixed(1)}px,${it.bz}px)`;
  }
}
/* ================= detail sheet ================= */
const sheet=document.getElementById("sheet"),scrim=document.getElementById("scrim");
let sheetId=null;
function openSheet(id){
  const d=byId(id);sheetId=id;markInteracted();
  document.getElementById("sh-ic").innerHTML=ICONS[d.icon];
  document.getElementById("sh-ic").style.setProperty("--glow",d.glow);
  document.getElementById("sh-name").textContent=d.name;
  document.getElementById("sh-sub").textContent=d.kind+" · "+st(d);
  document.getElementById("sh-body").innerHTML=
    `<div class="sec"><h3>State</h3>`+
    det(d).map(s=>`<div class="row"><span>•</span><span>${s}</span></div>`).join("")+`</div>`;
  const box=document.getElementById("sh-actions");box.innerHTML="";
  const b=document.createElement("button");b.className="abtn primary";b.textContent=actLabel(d);
  b.addEventListener("pointerup",()=>{markTap();doAction(id)});
  box.appendChild(b);
  sheet.classList.add("open");scrim.classList.add("on");
}
function closeSheet(){sheet.classList.remove("open");scrim.classList.remove("on");sheetId=null}
document.getElementById("sh-x").addEventListener("pointerup",()=>{markTap();closeSheet()});
scrim.addEventListener("pointerup",()=>{markTap();closeSheet()});
/* ================= actions: every one confirms visibly ================= */
function doAction(id){
  const d=byId(id);markInteracted();
  if(id==="focus"){
    if(FOCUS.timer){clearInterval(FOCUS.timer);FOCUS.timer=null;FOCUS.left=0;toast("Timer stopped")}
    else{FOCUS.left=25*60;toast("Timer started — 25 minutes");
      FOCUS.timer=setInterval(()=>{FOCUS.left--;refreshCard("focus");if(sheetId==="focus")openSheet("focus");
        if(FOCUS.left<=0){clearInterval(FOCUS.timer);FOCUS.timer=null;toast("Time — take a breath");refreshCard("focus")}},1000)}
  }
  else if(id==="auto"){AUTO.on=!AUTO.on;toast(AUTO.on?"Routines running":"Routines resting")}
  else toast(d.done);
  refreshCard(id);
  if(sheetId===id)openSheet(id);
}
let toastT=null;
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("on");
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),2200)}

    dust.appendChild(m)}
})();
