<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Moor · Your Space</title>
<style>
:root{
  --bg:#070a08; --ink:#eef3e6; --mut:#a9b39b; --faint:#6e7863;
  --accent:#b8e986; --amber:#e8c87a; --blue:#9fc6e8; --rose:#e8a79f; --violet:#c4a9e8; --teal:#9fe8c9;
  --line:rgba(255,255,255,.09);
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink); overflow:hidden; overscroll-behavior:none;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
/* ================= backdrop: aurora, grid, dust, sparkles ================= */
#room{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
#roomInner{position:absolute;inset:-8%;will-change:transform}
#grid{position:absolute;inset:0;
  background-image:linear-gradient(rgba(184,233,134,.05) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(184,233,134,.05) 1px,transparent 1px);
  background-size:52px 52px;
  -webkit-mask-image:radial-gradient(ellipse 90% 80% at 50% 45%,#000 20%,transparent 75%);
  mask-image:radial-gradient(ellipse 90% 80% at 50% 45%,#000 20%,transparent 75%);
}
.streak{position:absolute;filter:blur(70px);pointer-events:none}
#stA{width:75vmax;height:13vmax;left:-14vmax;top:2vmax;transform:rotate(23deg);
  background:linear-gradient(90deg,transparent,rgba(196,238,178,.16),transparent)}
#stB{width:80vmax;height:11vmax;right:-16vmax;bottom:6vmax;transform:rotate(-21deg);
  background:linear-gradient(90deg,transparent,rgba(184,233,134,.13),transparent)}
#stC{width:60vmax;height:10vmax;left:-12vmax;bottom:-4vmax;transform:rotate(14deg);
  background:linear-gradient(90deg,transparent,rgba(159,200,232,.10),transparent)}
.glowball{position:absolute;border-radius:50%;filter:blur(100px);pointer-events:none}
#gA{width:44vmax;height:44vmax;left:22vmax;top:-12vmax;background:radial-gradient(circle,rgba(184,233,134,.10),transparent 65%)}
#gB{width:50vmax;height:50vmax;right:8vmax;bottom:-16vmax;background:radial-gradient(circle,rgba(232,200,122,.08),transparent 65%)}
#dust{position:absolute;inset:0}
.mote{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(220,235,200,.5),transparent 70%);
  animation:drift linear infinite;opacity:.45}
@keyframes drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(40px,-90px,0)}}
.plus{position:absolute;color:rgba(220,235,200,.28);font-size:15px;font-weight:300;pointer-events:none}
/* ================= desktop scene: 1600x900 design space, uniformly scaled ================= */
#sceneWrap{position:fixed;inset:0;z-index:1;overflow:hidden;touch-action:none}
#scene{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center;will-change:transform}
/* ---------- topbar ---------- */
#dtop{position:absolute;left:0;right:0;top:0;height:122px}
.brandblock{position:absolute;left:40px;top:26px}
#dbrand{font-size:27px;font-weight:750;letter-spacing:.2px;display:flex;align-items:center;gap:10px}
#dbrand .dot{width:9px;height:9px}
#dhello{font-size:15.5px;color:var(--mut);margin-top:7px}
#dsub{font-size:13px;color:var(--faint);margin-top:5px}
#searchbar{position:absolute;left:50%;top:38px;transform:translateX(-50%);width:560px;
  display:flex;align-items:center;gap:11px;background:rgba(19,25,17,.72);
  border:1px solid rgba(255,255,255,.13);border-radius:16px;padding:13px 17px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#searchbar svg{width:18px;height:18px;stroke:var(--faint);fill:none;stroke-width:1.8;stroke-linecap:round;flex:0 0 auto}
#searchbar input{flex:1;background:none;border:none;outline:none;color:var(--ink);font-size:15px;
  font-family:inherit;-webkit-user-select:text;user-select:text}
#searchbar input::placeholder{color:var(--faint)}
#searchbar kbd{font-family:inherit;font-size:12px;color:var(--mut);border:1px solid var(--line);
  border-radius:7px;padding:4px 9px;background:rgba(255,255,255,.04);white-space:nowrap}
.dpills{position:absolute;right:40px;top:38px;display:flex;gap:10px}
.dpill{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--mut);
  border:1px solid var(--line);background:rgba(18,23,16,.62);padding:11px 17px;border-radius:15px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);cursor:pointer}
.dpill svg{width:17px;height:17px;stroke:var(--mut);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.dpill .dot{width:7px;height:7px}
.dpill .two{display:flex;flex-direction:column;line-height:1.25}
.dpill .two b{font-weight:600;color:var(--ink);font-size:13px}
.dpill .two span{font-size:11.5px;color:var(--accent);display:flex;align-items:center;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);flex:0 0 auto}
/* ---------- left rail ---------- */
#rail{position:absolute;left:28px;top:50%;transform:translateY(-50%);width:70px;
  background:rgba(17,22,15,.62);border:1px solid var(--line);border-radius:22px;
  padding:12px 0;display:flex;flex-direction:column;gap:4px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.railbtn{background:none;border:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;
  gap:7px;padding:11px 0;font-size:11px;font-family:inherit;cursor:pointer;border-radius:15px;min-height:66px}
.railbtn svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.railbtn:active{transform:scale(.93);color:var(--ink)}
/* ---------- cards ---------- */
.card{position:absolute;transform:translate(-50%,-50%);width:270px;border-radius:18px;padding:18px;
  background:linear-gradient(165deg,rgba(30,38,26,.74),rgba(13,17,12,.80));
  border:1px solid var(--line);
  box-shadow:0 16px 44px rgba(0,0,0,.52),inset 0 1px 0 rgba(255,255,255,.06);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  touch-action:none;will-change:transform}
.card.hero{width:360px;padding:20px;border-color:rgba(184,233,134,.42);
  box-shadow:0 0 0 1px rgba(184,233,134,.22),0 0 46px -4px rgba(184,233,134,.32),0 18px 50px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.07)}
.c-top{display:flex;align-items:center;gap:12px}
.c-ic{width:40px;height:40px;flex:0 0 40px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--glow,#b8e986) 15%,transparent);
  border:1px solid color-mix(in srgb,var(--glow,#b8e986) 34%,transparent)}
.c-ic svg{width:22px;height:22px;stroke:var(--glow,#b8e986);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.c-kind{font-size:10.5px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--faint)}
.c-name{font-size:15.5px;font-weight:650;letter-spacing:.1px;margin-top:2px}
.c-state{font-size:13px;color:var(--mut);margin-top:9px;line-height:1.45}
.c-meta{font-size:12px;color:var(--faint);margin-top:11px;display:flex;align-items:center;gap:7px}
.c-meta .dot{width:6px;height:6px}
.kebab{margin-left:auto;flex:0 0 auto;width:32px;height:32px;border-radius:10px;border:none;background:transparent;
  color:var(--faint);cursor:pointer;display:flex;align-items:center;justify-content:center}
.kebab svg{width:16px;height:16px;fill:currentColor}
.kebab:active{background:rgba(255,255,255,.08);color:var(--ink)}
.leftoff{margin-left:auto;flex:0 0 auto;display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--accent);white-space:nowrap}
.leftoff .dot{width:7px;height:7px}
.thumbs{display:flex;gap:8px;margin-top:13px}
.thumb{width:64px;height:46px;border-radius:10px;border:1px solid rgba(255,255,255,.13);flex:0 0 auto}
.thumb.more{display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;
  color:var(--mut);background:rgba(255,255,255,.045)}
.t1{background:linear-gradient(165deg,#33517e 5%,#b3814a 55%,#eec27f 100%)}
.t2{background:linear-gradient(165deg,#1f3a5e 5%,#5f8fb8 55%,#cfdfee 100%)}
.t3{background:linear-gradient(165deg,#23402c 5%,#5da86a 55%,#d3ecb2 100%)}
.t4{background:linear-gradient(165deg,#462a58 5%,#a8629c 55%,#eeb9d2 100%)}
.t5{background:linear-gradient(165deg,#5e3d1e 5%,#c08a48 55%,#f4df9e 100%)}
.t6{background:linear-gradient(165deg,#1e2c4e 5%,#4e6ac9 55%,#a9bfee 100%)}
.c-actions{display:flex;align-items:center;gap:8px;margin-top:15px}
.openbtn{display:inline-flex;align-items:center;gap:9px;background:linear-gradient(180deg,#cdf39c,#a9de74);
  color:#0b120a;font-weight:700;font-size:14.5px;font-family:inherit;border:none;border-radius:999px;
  padding:11px 28px;min-height:44px;cursor:pointer;box-shadow:0 6px 20px -4px rgba(184,233,134,.45)}
.openbtn svg{width:14px;height:14px;fill:#0b120a}
.openbtn:active{transform:scale(.96)}
.c-actions .kebab{margin-left:auto}
.spark{margin-left:auto;flex:0 0 auto}
.spark svg{display:block}
.playmeta{display:flex;align-items:center;gap:8px}
.playc{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:inline-flex;
  align-items:center;justify-content:center;flex:0 0 auto}
.playc svg{width:10px;height:10px;fill:var(--mut)}
.syncc{margin-left:auto;flex:0 0 auto;width:30px;height:30px}
.syncc svg{width:30px;height:30px;stroke:var(--faint);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
/* ---------- +New / quote ---------- */
#newbtn{position:absolute;left:45px;top:789px;display:flex;align-items:center;gap:11px;
  background:rgba(19,25,17,.72);border:1px solid rgba(255,255,255,.13);color:var(--ink);
  font-size:15px;font-weight:600;font-family:inherit;border-radius:16px;padding:13px 18px;cursor:pointer;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#newbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#newbtn:active{transform:scale(.96)}
#quote{position:absolute;left:1290px;top:787px;width:280px;display:flex;align-items:center;gap:11px;
  background:rgba(17,22,15,.62);border:1px solid var(--line);border-radius:16px;padding:12px 15px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#quote .q-ic{width:30px;height:30px;flex:0 0 30px;display:flex;align-items:center;justify-content:center}
#quote .q-ic svg{width:19px;height:19px;stroke:var(--mut);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#quote .q-t{font-size:13px;color:var(--ink)}
#quote .q-d{font-size:11.5px;color:var(--faint);margin-top:3px}
#quote .kebab{width:28px;height:28px}
/* ---------- context menu ---------- */
#ctxmenu{position:fixed;z-index:40;min-width:176px;background:rgba(25,31,22,.97);
  border:1px solid rgba(255,255,255,.13);border-radius:14px;padding:6px;display:none;
  box-shadow:0 16px 44px rgba(0,0,0,.62)}
#ctxmenu.on{display:block}
.mi{display:block;width:100%;text-align:left;background:none;border:none;color:var(--ink);
  font-size:14px;font-family:inherit;padding:11px 14px;border-radius:9px;cursor:pointer}
.mi:active{background:rgba(255,255,255,.08)}
/* ---------- sheet ---------- */
#scrim{position:fixed;inset:0;z-index:18;background:rgba(4,6,4,.5);opacity:0;pointer-events:none;transition:opacity .3s}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;z-index:20;left:0;right:0;bottom:0;max-height:80dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:linear-gradient(180deg,rgba(29,36,25,.97),rgba(16,20,14,.98));
  border:1px solid var(--line);border-bottom:none;border-radius:26px 26px 0 0;
  transform:translateY(106%);transition:transform .42s var(--ease);padding:10px 22px calc(26px + env(safe-area-inset-bottom));
  box-shadow:0 -20px 60px rgba(0,0,0,.5)}
#sheet.open{transform:none}
#grab{width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.18);margin:6px auto 14px}
.sh-head{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.sh-head .c-ic{width:42px;height:42px;flex-basis:42px}
.sh-name{font-size:18px;font-weight:700}
.sh-sub{font-size:13px;color:var(--mut);margin-top:2px}
.sh-x{margin-left:auto;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--mut);
  width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer;flex:0 0 auto;font-family:inherit}
.sec{margin-top:18px}
.sec h3{font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--faint);margin-bottom:9px}
.row{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);border-radius:13px;
  background:rgba(255,255,255,.025);margin-bottom:7px;font-size:14px;line-height:1.45}
.sh-actions{display:flex;gap:10px;margin-top:20px}
.abtn{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);font-family:inherit;
  font-size:13.5px;font-weight:600;padding:8px 18px;border-radius:999px;cursor:pointer;min-height:38px}
.abtn:active{transform:scale(.96)}
.sh-actions .abtn{flex:1;min-height:46px;font-size:15px}
.sh-actions .abtn.primary{background:rgba(184,233,134,.2);border-color:rgba(184,233,134,.45)}
/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(12px);
  z-index:50;background:rgba(24,30,21,.94);border:1px solid var(--line);color:var(--ink);font-size:13.5px;
  padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%)}
/* ================= mobile: recency stack ================= */
#mwrap{display:none}
@media(max-width:699px){
  #sceneWrap{display:none}
  #mwrap{display:block}
  html,body{height:auto;min-height:100%}
  body{overflow-y:auto;overflow-x:hidden}
  #mtop{position:fixed;top:0;left:0;right:0;z-index:10;
    padding:calc(12px + env(safe-area-inset-top)) 18px 12px;
    background:linear-gradient(180deg,rgba(7,10,8,.97),rgba(7,10,8,.82));
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  #mbrand{font-size:17px;font-weight:750;display:flex;align-items:center;gap:8px}
  #mhello{font-size:13.5px;color:var(--mut);margin-top:3px}
  #msub{font-size:12px;color:var(--faint);margin-top:3px}
  #msearch{display:flex;align-items:center;gap:10px;background:rgba(19,25,17,.72);
    border:1px solid rgba(255,255,255,.13);border-radius:14px;padding:11px 14px;margin-top:10px}
  #msearch svg{width:17px;height:17px;stroke:var(--faint);fill:none;stroke-width:1.8;stroke-linecap:round;flex:0 0 auto}
  #msearch input{flex:1;background:none;border:none;outline:none;color:var(--ink);font-size:15px;
    font-family:inherit;-webkit-user-select:text;user-select:text}
  #msearch input::placeholder{color:var(--faint)}
  #mstack{padding:196px 0 130px;display:flex;flex-direction:column;align-items:center}
  .mcard{position:relative;transform:none;width:min(340px,calc(100vw - 56px));margin:0 0 14px;
    border-radius:18px;padding:16px;background:linear-gradient(165deg,rgba(30,38,26,.74),rgba(13,17,12,.80));
    border:1px solid var(--line);box-shadow:0 14px 38px rgba(0,0,0,.5)}
  .mcard.hero{border-color:rgba(184,233,134,.42);
    box-shadow:0 0 0 1px rgba(184,233,134,.22),0 0 40px -4px rgba(184,233,134,.3),0 16px 44px rgba(0,0,0,.55)}
  .mcard .c-meta{margin-top:9px}
  .mcard .thumbs .thumb{width:56px;height:40px}
  .mcard .c-actions{margin-top:13px}
}
@media(min-width:700px){
  #sheet{left:auto;top:0;right:0;bottom:0;width:392px;max-height:none;border-radius:0;border-bottom:none;
    border-right:none;transform:translateX(106%);padding-top:calc(20px + env(safe-area-inset-top))}
  #sheet.open{transform:none}
  #grab{display:none}
}
@media(prefers-reduced-motion:reduce){.mote{animation:none}}
</style>
</head>
<body>
<div id="room"><div id="roomInner">
  <div id="grid"></div>
  <div class="streak" id="stA"></div><div class="streak" id="stB"></div><div class="streak" id="stC"></div>
  <div class="glowball" id="gA"></div><div class="glowball" id="gB"></div>
  <div id="dust"></div>
  <span class="plus" style="left:12%;top:22%">+</span>
  <span class="plus" style="left:88%;top:14%">+</span>
  <span class="plus" style="left:76%;top:68%">+</span>
  <span class="plus" style="left:22%;top:80%">+</span>
  <span class="plus" style="left:55%;top:8%">+</span>
</div></div>
<div id="sceneWrap"><div id="scene">
  <header id="dtop">
    <div class="brandblock">
      <div id="dbrand">Moor <span class="dot"></span></div>
      <div id="dhello"></div>
      <div id="dsub">3 routines running quietly · 1 thing waiting for you</div>
    </div>
    <div id="searchbar">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
      <input id="q" type="text" placeholder="Search anything... apps, files, projects, notes..." autocomplete="off">
      <kbd>Ctrl&nbsp;&nbsp;K</kbd>
    </div>
    <div class="dpills">
      <button class="dpill" id="pill-phone">
        <svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M10.5 18.5h3"/></svg>
        <span class="dot"></span><span>Phone linked</span>
      </button>
      <button class="dpill" id="pill-node">
        <svg viewBox="0 0 24 24"><path d="M7 18.5a4.5 4.5 0 0 1-.4-9A6 6 0 0 1 18.2 11 3.8 3.8 0 0 1 17.5 18.5z"/></svg>
        <span class="two"><b>Local node</b><span><span class="dot"></span>Online</span></span>
      </button>
    </div>
  </header>
  <nav id="rail" aria-label="primary"></nav>
  <div id="cards"></div>
  <button id="newbtn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>New</span><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
  <div id="quote">
    <span class="q-ic"><svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.4z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg></span>
    <div><div class="q-t">"Same place. More progress."</div><div class="q-d" id="q-date"></div></div>
    <button class="kebab" data-menu="quote" aria-label="more"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></button>
  </div>
</div></div>
<div id="mwrap">
  <header id="mtop">
    <div id="mbrand">Moor <span class="dot"></span></div>
    <div id="mhello"></div>
    <div id="msub">3 routines running quietly · 1 thing waiting for you</div>
    <div id="msearch">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
      <input id="mq" type="text" placeholder="Search anything..." autocomplete="off">
    </div>
  </header>
  <div id="mstack"></div>
</div>
<div id="ctxmenu"></div>
<div id="scrim"></div>
<section id="sheet" aria-label="details">
  <div id="grab"></div>
  <div class="sh-head">
    <span class="c-ic" id="sh-ic"></span>
    <div><div class="sh-name" id="sh-name"></div><div class="sh-sub" id="sh-sub"></div></div>
    <button class="sh-x" id="sh-x" aria-label="close">✕</button>
  </div>
  <div id="sh-body"></div>
  <div class="sh-actions" id="sh-actions"></div>
</section>
<div id="toast"></div>
<script>
"use strict";
/* ================= icons ================= */
const ICONS={

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
/* ================= touch core: taps on pointer events only ================= */
let lastTap=0;
const markTap=()=>{lastTap=Date.now()};
document.addEventListener("click",e=>{ // a tap's belated synthesized click can never double-fire
  if(Date.now()-lastTap<700){e.stopPropagation();e.preventDefault()}
},true);
function tapify(el,onTap){
  let pt=null;
  el.addEventListener("pointerdown",e=>{pt={sx:e.clientX,sy:e.clientY,t:Date.now()}});
  el.addEventListener("pointermove",e=>{if(pt&&Math.hypot(e.clientX-pt.sx,e.clientY-pt.sy)>12)pt=null});
  el.addEventListener("pointercancel",()=>{pt=null});
  el.addEventListener("pointerup",e=>{
    if(!pt)return;const dx=e.clientX-pt.sx,dy=e.clientY-pt.sy,dt=Date.now()-pt.t;pt=null;
    if(e.target.closest("button,input"))return; // buttons/inputs handle themselves
    if(dt<600&&Math.hypot(dx,dy)<14){markTap();onTap(e)}
  });
}
function press(btn,fn){ // buttons: pointerup only, never click
  btn.addEventListener("pointerup",e=>{e.stopPropagation();markTap();fn(e)});
  btn.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();markTap();fn(e)}});
}
/* ================= toast ================= */
let toastT=null;
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("on");
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),2200)}
/* ================= context menu ================= */
const menu=document.getElementById("ctxmenu");
let menuFor=null;
function openMenu(x,y,items,forId){
  menu.innerHTML="";
  items.forEach(it=>{
    const b=document.createElement("button");b.className="mi";b.textContent=it.label;
    press(b,()=>{closeMenu();it.fn()});
    menu.appendChild(b);
  });
  menu.classList.add("on");
  menu.style.left=clamp(x,8,innerWidth-200)+"px";
  menu.style.top=clamp(y,8,innerHeight-items.length*46-20)+"px";
  menuFor=forId;
}
function closeMenu(){menu.classList.remove("on");menuFor=null}
document.addEventListener("pointerdown",e=>{
  if(menuFor&&!e.target.closest("#ctxmenu")&&!e.target.closest("[data-menubtn]"))closeMenu();
},true);
function kebabFor(id){
  const d=byId(id);
  return [{label:d.action,fn:()=>doAction(id)},{label:"Details",fn:()=>openSheet(id)}];
}

const sheet=document.getElementById("sheet"),scrim=document.getElementById("scrim");
let sheetId=null;
function openSheet(id){
  const d=byId(id);sheetId=id;
  const ic=document.getElementById("sh-ic");
  ic.innerHTML=ICONS[d.icon];ic.style.setProperty("--glow",d.glow);
  document.getElementById("sh-name").textContent=d.name;
  document.getElementById("sh-sub").textContent=d.kind+" · "+d.state;
  document.getElementById("sh-body").innerHTML=
    '<div class="sec"><h3>State</h3>'+
    d.detail.map(s=>'<div class="row"><span>•</span><span>'+s+'</span></div>').join('')+'</div>';
  const box=document.getElementById("sh-actions");box.innerHTML="";
  const b=document.createElement("button");b.className="abtn primary";b.textContent=d.action;
  press(b,()=>doAction(id));
  box.appendChild(b);
  sheet.classList.add("open");scrim.classList.add("on");
}
function closeSheet(){sheet.classList.remove("open");scrim.classList.remove("on");sheetId=null}

/* ================= desktop cards ================= */
const dcards=[];
function thumbRow(d){
  return '<div class="thumbs">'+d.thumbs.map(t=>'<span class="thumb '+t+'"></span>').join('')+
    '<span class="thumb more">'+d.more+'</span></div>';
}
function buildDesktop(){
  const host=document.getElementById("cards");
  ITEMS.forEach(d=>{
    const el=document.createElement("div");
    el.className="card"+(d.hero?" hero":"");
    el.dataset.card="1";el.dataset.id=d.id;
    el.style.setProperty("--glow",d.glow);
    el.style.width=d.w+"px";
    el.style.left=d.pos[0]+"px";el.style.top=d.pos[1]+"px";
    el.tabIndex=0;
    let inner='<div class="c-top"><span class="c-ic">'+ICONS[d.icon]+'</span><div>';
    if(d.hero)inner+='<div class="c-kind">'+d.kind+'</div>';
    inner+='<div class="c-name">'+d.name+'</div></div>';
    if(d.leftoff)inner+='<span class="leftoff"><span class="dot"></span>Where you left off</span>';
    else inner+='<button class="kebab" data-menubtn data-kebab="'+d.id+'" aria-label="more">'+ICONS.kebab+'</button>';
    inner+='</div><div class="c-state">'+d.state+'</div>';
    if(d.thumbs)inner+=thumbRow(d);
    if(d.metaHTML)inner+='<div class="c-meta">'+d.metaHTML+'</div>';
    if(d.hero)inner+='<div class="c-actions"><button class="openbtn" data-open="'+d.id+'">'+
      '<svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>Open</button>'+
      '<button class="kebab" data-menubtn data-kebab="'+d.id+'" aria-label="more">'+ICONS.kebab+'</button></div>';
    el.innerHTML=inner;
    host.appendChild(el);
    dcards.push({el,d,depth:d.depth});
    tapify(el,()=>openSheet(d.id));
    el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openSheet(d.id)}});
    const kb=el.querySelector("[data-kebab]");
    if(kb)kb.addEventListener("pointerup",e=>{
      e.stopPropagation();markTap();
      if(menuFor===d.id){closeMenu();return}
      const r=kb.getBoundingClientRect();
      openMenu(r.left-140,r.bottom+8,kebabFor(d.id),d.id);
    });
    const ob=el.querySelector("[data-open]");
    if(ob)press(ob,()=>doAction(d.id));
  });
}

/* ================= search ================= */
function applyFilter(raw){
  const q=raw.trim().toLowerCase();
  document.querySelectorAll("[data-card]").forEach(el=>{
    const d=byId(el.dataset.id);
    const hay=(d.name+" "+d.state+" "+(d.metaText||"")).toLowerCase();
    el.style.display=(!q||hay.indexOf(q)>=0)?"":"none";
  });
}
function wireSearch(){
  ["q","mq"].forEach(id=>{
    const inp=document.getElementById(id);
    inp.addEventListener("input",()=>applyFilter(inp.value));
  });
  document.addEventListener("keydown",e=>{
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){
      e.preventDefault();(desk()?document.getElementById("q"):document.getElementById("mq")).focus();return;
    }
    if(e.key==="Escape"){
      if(menuFor){closeMenu();return}
      if(sheetId){closeSheet();return}
      const a=document.activeElement;
      if(a&&(a.id==="q"||a.id==="mq")){a.value="";applyFilter("");a.blur()}
    }
  });
}

const scene=document.getElementById("scene");
function fitScene(){
  const s=Math.min(innerWidth/1600,innerHeight/900);
  scene.style.transform="translate(-50%,-50%) scale("+s+")";
}

const cam={x:0,y:0,tx:0,ty:0};
let bgd=null;
const wrap=document.getElementById("sceneWrap");
wrap.addEventListener("pointerdown",e=>{
  if(!desk())return;
  if(e.target.closest(".card,#dtop,#rail,#newbtn,#quote,#ctxmenu,button,input"))return;
  bgd={sx:e.clientX,sy:e.clientY,cx:cam.tx,cy:cam.ty};
});
wrap.addEventListener("pointermove",e=>{
  if(!bgd)return;
  const dx=e.clientX-bgd.sx,dy=e.clientY-bgd.sy;
  cam.tx=clamp(bgd.cx+dx*.25,-70,70);cam.ty=clamp(bgd.cy+dy*.25,-70,70);
});
const endBg=()=>{bgd=null};
wrap.addEventListener("pointerup",endBg);
wrap.addEventListener("pointercancel",endBg);
const roomInner=document.getElementById("roomInner");
function tick(){
  requestAnimationFrame(tick);
  if(!desk())return;
  cam.x+=(cam.tx-cam.x)*.12;cam.y+=(cam.ty-cam.y)*.12;
  roomInner.style.transform="translate3d("+(cam.x*-.15).toFixed(1)+"px,"+(cam.y*-.15).toFixed(1)+"px,0)";
  for(const c of dcards){
    c.el.style.transform="translate(-50%,-50%) translate("+
      (cam.x*c.depth).toFixed(1)+"px,"+(cam.y*c.depth).toFixed(1)+"px)";
  }
}
