<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#04121f">
<title>Aquarium Studio v0.1</title>
<style>
  :root{
    --accent:#6ee7f9; --accent2:#38bdf8;
    --ink:#e8f1fa; --ink-dim:rgba(214,230,245,.62);
    --glass:rgba(7,15,26,.58); --glass-brd:rgba(130,180,225,.22);
    --pill:rgba(20,34,52,.72);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;background:#04121f;overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
  #stage{position:fixed;inset:0;overflow:hidden;background:#04121f}
  #scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;
    transition:opacity .45s ease}
  #scene.fading{opacity:0}
  .glass{background:var(--glass);border:1px solid var(--glass-brd);border-radius:18px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 10px 34px rgba(0,0,0,.45)}
  /* ---------- top bar ---------- */
  #topbar{position:absolute;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:10px;padding:8px 10px 8px 16px;z-index:10;
    max-width:calc(100vw - 24px);flex-wrap:wrap;justify-content:center}
  .brand{font-weight:700;font-size:15px;letter-spacing:.4px;white-space:nowrap}
  .brand .ver{font-size:10px;font-weight:600;color:var(--ink-dim);border:1px solid var(--glass-brd);
    border-radius:8px;padding:2px 6px;margin-left:6px;vertical-align:2px}
  .seedbox{display:flex;align-items:center;gap:6px;background:var(--pill);
    border:1px solid var(--glass-brd);border-radius:12px;padding:5px 6px 5px 10px}
  #seedLabel{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:var(--accent);
    letter-spacing:1px}
  .iconbtn{border:1px solid transparent;background:transparent;color:var(--ink);font-size:16px;
    border-radius:10px;padding:5px 8px;cursor:pointer;line-height:1}
  .iconbtn:hover{background:rgba(110,231,249,.14)}
  .iconbtn.on{background:rgba(110,231,249,.22);border-color:rgba(110,231,249,.4)}
  #generate{border:none;cursor:pointer;font-weight:700;font-size:15px;color:#04222e;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    border-radius:14px;padding:10px 22px;box-shadow:0 4px 18px rgba(56,189,248,.45)}
  #generate:hover{filter:brightness(1.08)}
  #generate:active{transform:scale(.97)}
  /* ---------- side panels ---------- */
  .panel{position:absolute;top:50%;transform:translateY(-50%);width:228px;z-index:10;
    padding:14px 14px 16px;transition:opacity .3s}
  #panelL{left:14px} #panelR{right:14px}
  .panel h3{margin:2px 2px 10px;font-size:12px;text-transform:uppercase;letter-spacing:2.5px;
    color:var(--ink-dim);font-weight:600}
  .panel label{display:block;margin:12px 2px 6px;font-size:12.5px;color:var(--ink-dim);font-weight:600}
  .panel label:first-of-type{margin-top:0}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .pick{border:1px solid var(--glass-brd);background:var(--pill);color:var(--ink);
    border-radius:12px;padding:9px 6px;font-size:12.5px;cursor:pointer;text-align:center;line-height:1.25}
  .pick:hover{border-color:rgba(110,231,249,.5)}
  .pick.on{background:rgba(110,231,249,.20);border-color:var(--accent);color:#fff;
    box-shadow:0 0 0 1px var(--accent) inset}
  .pick .em{display:block;font-size:17px;margin-bottom:2px}
  .seg{display:flex;background:var(--pill);border:1px solid var(--glass-brd);border-radius:12px;
    padding:3px;gap:3px}
  .seg button{flex:1;border:none;background:transparent;color:var(--ink-dim);font-size:12.5px;
    font-weight:600;border-radius:9px;padding:8px 2px;cursor:pointer}
  .seg button.on{background:rgba(110,231,249,.22);color:#fff}
  /* ---------- misc ---------- */
  .tune{margin-top:10px;display:flex;flex-direction:column;gap:7px;padding:9px 11px;
    background:rgba(10,22,36,.5);border:1px solid rgba(130,180,225,.15);border-radius:12px}
  .tune .thead{font-size:11px;letter-spacing:1.6px;color:var(--ink-dim);text-transform:uppercase}
  .trow{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-dim)}
  .trow span{width:78px;flex:none}
  .trow input{flex:1;accent-color:#6ee7f9;height:20px;cursor:pointer}
  #savedTag{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:10;font-size:12px;color:var(--ink-dim);
    background:var(--glass);border:1px solid var(--glass-brd);border-radius:10px;padding:6px 10px;
    opacity:0;transition:opacity .4s;pointer-events:none}
  #savedTag.show{opacity:1}
  #hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:9;
    font-size:11.5px;color:rgba(200,220,238,.42);letter-spacing:.6px;white-space:nowrap}
  #nogl{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:30px;
    color:#dfe7f5;font-size:15px}
  /* fullscreen: pure viewport */
  #stage:fullscreen #topbar,#stage:fullscreen .panel,#stage:fullscreen #hint,
  #stage:fullscreen #savedTag{display:none}
  #stage:fullscreen #scene{cursor:none}
  @media (max-width:760px){
    .panel{width:186px;padding:10px}
    #panelL{left:8px} #panelR{right:8px}
    .brand{display:none}
    #hint{display:none}
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="scene"></canvas>

  <header id="topbar" class="glass">
    <div class="brand">🐠 Aquarium Studio <span class="ver">v0.1</span></div>
    <button class="iconbtn" id="fullBtn" title="Fullscreen (F)">⛶</button>
    <button class="iconbtn" id="feedBtn" title="Drop food (E)">🦐</button>
  </header>



  <div id="savedTag">Saved ✓</div>
  <div id="hint">G generate &nbsp;·&nbsp; F fullscreen &nbsp;·&nbsp; Space pause</div>
  <div id="nogl"><div><h2>WebGL unavailable</h2><p>This studio needs WebGL. Try a different browser.</p></div></div>
</div>
<script type="module" src="studios/aquarium/main.js"></script>


<style>
#uiToggle{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:99999;width:54px;height:54px;border-radius:50%;border:1px solid rgba(255,255,255,.28);background:rgba(10,20,30,.72);color:#fff;font-size:24px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer;touch-action:manipulation;}
body.ui-hidden #topbar,
body.ui-hidden #panelL,
body.ui-hidden #panelR{display:none!important;}
</style>
<button id="uiToggle" aria-label="Hide interface">&#x1F648;</button>





</body>
</html>
