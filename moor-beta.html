/* ---------------- planet travel (moorworld) ---------------- */
var travelSector='all', travelQuery='';
function allPlanets(){
  var out=[];
  try{
    MoorWorld.sectors().forEach(function(sec){
      (sec.systems||[]).forEach(function(sys){
        (sys.planets||[]).forEach(function(p){ out.push({sec:sec,p:p}); });
      });
    });
  }catch(_){}
  return out;
}
function openTravel(){
  travelSector='all'; travelQuery='';
  $('travel-wrap').hidden=false;
  renderTravelSectors(); renderTravelList();
  var s=$('travel-search'); s.value='';
  setTimeout(function(){ s.focus(); },60);
}
function renderTravelSectors(){
  var el=$('travel-sectors');
  function btn(id,label){
    return '<button data-sec="'+id+'" class="'+(travelSector===id?'on':'')+'">'+esc(label)+'</button>';
  }
  var html=btn('all','All');
  try{ MoorWorld.sectors().forEach(function(sec){ html+=btn(sec.id,sec.name); }); }catch(_){}
  el.innerHTML=html;
  el.querySelectorAll('[data-sec]').forEach(function(b){
    b.addEventListener('click',function(){ travelSector=b.dataset.sec; renderTravelSectors(); renderTravelList(); });
  });
}
function renderTravelList(){
  var el=$('travel-list'), q=travelQuery.toLowerCase(), html='', n=0;
  allPlanets().forEach(function(e){
    if(n>=80) return;
    if(travelSector!=='all'&&e.sec.id!==travelSector) return;
    if(q&&e.p.name.toLowerCase().indexOf(q)<0) return;
    n++;
    var type='', temp='';
    try{ type=MoorWorld.planetType(e.p)||''; var cl=MoorWorld.climate(e.p.id)||{}; temp=cl.temp||''; }catch(_){}
    html+='<div class="trow" data-pid="'+e.p.id+'"><span><b>'+esc(e.p.name)+'</b><br>'+
      '<small>'+esc(type)+(temp?' · '+esc(String(temp)):'')+' · '+esc(e.sec.name)+'</small></span>'+
      '<button class="go">Go →</button></div>';
  });
  el.innerHTML=html||'<div class="trow"><span>No planets match.</span></div>';
  el.querySelectorAll('[data-pid]').forEach(function(r){
    r.querySelector('.go').addEventListener('click',function(){ travelToPlanet(r.dataset.pid); });
  });
}
function travelToPlanet(pid){
  var p=null;
  try{ p=MoorWorld.getPlanet(pid); }catch(_){}
  if(!p) return;
  var seed='moor:'+pid, w=null, i;
  for(i=0;i<store.worlds.length;i++) if(store.worlds[i].seed===seed) w=store.worlds[i];
  if(!w) w=makeWorld(p.name, seed);
  else store.active=w.id;
  ensureWorldShape(w); saveStore();
  $('travel-wrap').hidden=true; $('sheet').hidden=true;
  bootWorld(); renderWorlds();
  try{ MoorWorld.logEvent('user','visit',pid,{world:w.id}); }catch(_){}
  toast('🧭 '+p.name);
}
function bindTravel(){
  $('travel-close').addEventListener('click',function(){ $('travel-wrap').hidden=true; });
  $('travel-search').addEventListener('input',function(e){ travelQuery=e.target.value; renderTravelList(); });
  $('travel-wrap').addEventListener('click',function(e){ if(e.target===$('travel-wrap')) $('travel-wrap').hidden=true; });
}

/* ---------------- boot / loop ---------------- */
function bootWorld(){
  var w=activeWorld();
  ensureWorldShape(w);
  $('world-name').textContent=w?w.name:'—';
  document.title='Moor Beta — '+w.name;
  reseedTerrain(w.seed); buildTerrainBuffers(); rebuildObjects();
  cam.tx=0; cam.tz=0; cam.wx=8; cam.wz=8;
  revealT=0; /* holo materialize */
  markSaved(true);
}
function resize(){
  var cv=$('gl'), dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=cv.clientWidth*dpr; cv.height=cv.clientHeight*dpr;
}
var lastT=0, revealT=1;
function frame(t){
  requestAnimationFrame(frame);
  var dt=Math.min(0.05,(t-lastT)/1000||0.016); lastT=t;
  if(needsRebuild){ needsRebuild=false; rebuildObjects(); }
  if(cam.mode==='walk'){
    ctrl.step(dt);
    tickAvatar(dt);
  }
  computeVP();
  var cv=$('gl');
  gl.viewport(0,0,cv.width,cv.height);
  gl.clearColor(0.52,0.74,0.94,1); gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.uniform3f(uSun,-0.45,0.8,0.35); gl.uniform3f(uFog,0.74,0.82,0.90);
  gl.uniform1f(uFogK, cam.mode==='walk'?0.0035:0.25/Math.max(cam.dist,40));
  if(revealT<1) revealT=Math.min(1,revealT+dt/2.4);
  var rse=revealT*revealT*(3-2*revealT);
  gl.uniform1f(uReveal,rse);
  var e=camEye(); gl.uniform3f(uCam,e[0],e[1],e[2]);
  gl.uniformMatrix4fv(uMVP,false,vpMat);
  bindBuf(terrainBuf); gl.drawElements(gl.TRIANGLES,terrainBuf.count,gl.UNSIGNED_INT,0);
  if(typeof farBuf!=='undefined'&&farBuf){ bindBuf(farBuf); gl.drawElements(gl.TRIANGLES,farBuf.count,gl.UNSIGNED_INT,0); }
  bindBuf(waterBuf); gl.drawElements(gl.TRIANGLES,waterBuf.count,gl.UNSIGNED_INT,0);
  if(objBuf){ bindBuf(objBuf); gl.drawElements(gl.TRIANGLES,objBuf.count,gl.UNSIGNED_INT,0); }
  if(cam.mode==='walk'&&avBuf&&ctrl.camMode()==='follow'){
    gl.disable(gl.CULL_FACE);
    bindBuf(avBuf); gl.drawElements(gl.TRIANGLES,avBuf.count,gl.UNSIGNED_INT,0);
    gl.enable(gl.CULL_FACE);
  }
}
function boot(){
  if(!initGL()) return;
  if(typeof CityMesh==='undefined'||typeof Struct==='undefined'||typeof Furnish==='undefined'){
    $('nogl').hidden=false;
    $('nogl').querySelector('p').textContent='The world engine didn\u2019t load. Try reloading the page.';
    return;
  }
  bindInput(); bindUI(); bindTravel();
  window.addEventListener('resize',resize); resize();
  bootWorld(); setMode('orbit');
  requestAnimationFrame(frame);
}
/* ---------------- move mode ---------------- */
var moveMode=null, moveBackup=null, moveDirty=false;
function moveTarget(){
  var w=activeWorld(); if(!w||!moveMode) return null;
  return moveMode.kind==='b'?w.buildings[moveMode.idx]:w.items[moveMode.idx];
}
function startMove(){
  if(!selected||selected.kind==='p'||selected.kind==='c') return;
  moveMode={kind:selected.kind,idx:selected.idx};
  moveBackup=snapshot(activeWorld());
  hideSel(); showMoveBar();
  hint('Drag to move · ✓ when done');
}
function endMove(commit){
  if(!moveMode) return;
  if(commit){ pushHistoryRaw(moveBackup); afterChange(); }
  else{
    var s=JSON.parse(moveBackup), w=activeWorld();
    w.buildings=s.b; w.items=s.i; w.paths=s.p; w.claims=s.c||[];
    rebuildObjects();
  }
  moveMode=null; moveBackup=null; hideMoveBar();
}
function showMoveBar(){
  var m=$('move-bar'); m.hidden=false;
  m.innerHTML='<button data-mv="ok">✓ Done</button><button data-mv="cancel">✕</button>';
}
function hideMoveBar(){ $('move-bar').hidden=true; }

/* ---------------- path drawing ---------------- */
var PATH_WIDTHS=[
  {w:1.6,icon:'🌿',label:'Trail'},
  {w:2.2,icon:'🛤️',label:'Path'},
  {w:3.2,icon:'🌆',label:'Sidewalk'}
];
var drawing=null, previewPath=null;
function startStroke(x,z){
  drawing={pts:[[Math.round(x*2)/2,Math.round(z*2)/2]],w:PATH_WIDTHS[palSel.paths].w};
  previewPath=drawing; needsRebuild=true;
}
function extendStroke(x,z){
  if(!drawing) return;
  var pts=drawing.pts, l=pts[pts.length-1];
  x=Math.round(x*2)/2; z=Math.round(z*2)/2;
  if(Math.hypot(x-l[0],z-l[1])>1.5&&pts.length<240){ pts.push([x,z]); needsRebuild=true; }
}
function endStroke(){
  if(!drawing) return;
  var d=drawing; drawing=null; previewPath=null;
  if(d.pts.length>=2){
    mutate(function(){ var w=activeWorld(); w.paths=(w.paths||[]); w.paths.push(d); });
    toast('Path placed');
  }else needsRebuild=true;
}

/* ---------------- build-mode: edit a placed building ---------------- */
var editBackup=null;
function openEdit(){
  if(!selected||selected.kind!=='b') return;
  editBackup=snapshot(activeWorld());
  renderEditSheet(); $('edit-sheet').hidden=false; hideSel();
}
function editBuilding(){ var w=activeWorld(); return w?w.buildings[selected.idx]:null; }
function renderEditSheet(){
  var b=editBuilding(); if(!b) return;
  var sh=$('edit-sheet');
  sh.innerHTML='<h3>🔧 '+esc(selLabel())+'</h3>'+
    '<div class="erow">'+THEMES.map(function(t){
      return '<button class="pal'+(t.id===b.theme?' on':'')+'" data-etheme="'+t.id+'">'+t.icon+'<small>'+esc(t.label)+'</small></button>';
    }).join('')+'</div>'+
    '<div class="erow"><span class="elab">Stories</span>'+
      '<button data-estories="1" class="'+(b.stories===1?'on':'')+'">1</button>'+
      '<button data-estories="2" class="'+(b.stories===2?'on':'')+'">2</button></div>'+
    '<div class="erow"><span class="elab">Size</span>'+
      '<button data-esize="w-">W−</button><button data-esize="w+">W+</button>'+
      '<button data-esize="d-">D−</button><button data-esize="d+">D+</button></div>'+
    '<div class="erow"><button data-eregen="1">🎲 Regenerate</button></div>'+
    '<div class="erow"><button data-eedit="done" class="go">✓ Done</button>'+
    '<button data-eedit="cancel">✕ Cancel</button></div>';
}
function closeEdit(commit){
  var w=activeWorld();
  if(commit&&editBackup){ pushHistoryRaw(editBackup); afterChange(); }
  else if(!commit&&editBackup){
    var s=JSON.parse(editBackup);
    w.buildings=s.b; w.items=s.i; w.paths=s.p; w.claims=s.c||[]; rebuildObjects();
  }
  editBackup=null; $('edit-sheet').hidden=true;
}
function bindEditSheet(){
  $('edit-sheet').addEventListener('click',function(e){
    var t=e.target.closest('[data-etheme],[data-estories],[data-esize],[data-eregen],[data-eedit]');
    if(!t) return;
    var b=editBuilding(); if(!b) return;
    if(t.dataset.etheme){ b.theme=t.dataset.etheme; }
    else if(t.dataset.estories){ b.stories=+t.dataset.estories; }
    else if(t.dataset.esize){
      var k=t.dataset.esize;
      if(k==='w-') b.w=Math.max(6,b.w-1); if(k==='w+') b.w=Math.min(20,b.w+1);
      if(k==='d-') b.d=Math.max(6,b.d-1); if(k==='d+') b.d=Math.min(20,b.d+1);
    }
    else if(t.dataset.eregen){ var w=activeWorld(); b.seed=w.seed+'|b'+(++w.seq)+'r'+Math.floor(Math.random()*1e6); }
    else if(t.dataset.eedit){
      closeEdit(t.dataset.eedit==='done'); return;
    }
    rebuildObjects(); renderEditSheet();
  });
}

/* ---------------- land claim mode ---------------- */
var claiming=null, previewClaim=null, pendingClaim=null;
function startClaim(x,z){
  claiming={x0:Math.round(x*2)/2,z0:Math.round(z*2)/2,x1:Math.round(x*2)/2,z1:Math.round(z*2)/2};
  previewClaim=claiming; needsRebuild=true;
}
function extendClaim(x,z){
  if(!claiming) return;
  claiming.x1=Math.round(x*2)/2; claiming.z1=Math.round(z*2)/2;
  needsRebuild=true;
}
function endClaim(){
  if(!claiming) return;
  var c=claiming; claiming=null; previewClaim=null; needsRebuild=true;
  if(Math.abs(c.x1-c.x0)<3||Math.abs(c.z1-c.z0)<3){ toast('Drag a bigger plot'); return; }
  pendingClaim=c; showClaimPop();
}
var claimPurpose='Homestead';
function showClaimPop(){
  var p=$('claim-pop'); p.hidden=false;
  claimPurpose='Homestead';
  var chips='<div class="pchips">'+PURPOSES.map(function(pu,i){
    return '<button data-pu="'+pu+'" class="'+(i===0?'on':'')+'">'+pu+'</button>'; }).join('')+'</div>';
  p.innerHTML='<strong>\u2691 Claim this land?</strong>'+
    '<input id="claim-name" placeholder="Name your claim" maxlength="28" autocomplete="off">'+
    chips+
    '<span class="crow"><button data-claim="yes" class="go">Claim it</button>'+
    '<button data-claim="no">\u2715</button></span>';
  setTimeout(function(){ var i=$('claim-name'); if(i) i.focus(); },60);
}
function bindClaimPop(){
  $('claim-pop').addEventListener('click',function(e){
    var pu=e.target.closest('[data-pu]');
    if(pu){ claimPurpose=pu.dataset.pu;
      var bs=$('claim-pop').querySelectorAll('[data-pu]');
      for(var i=0;i<bs.length;i++) bs[i].classList.toggle('on',bs[i]===pu);
      return; }
    var b=e.target.closest('[data-claim]'); if(!b) return;
    if(b.dataset.claim==='yes'&&pendingClaim){
      var nm=(($('claim-name')||{}).value||'').trim()||'Unnamed claim';
      (function(c,name,purpose){ mutate(function(){
        var w=activeWorld(); w.claims=(w.claims||[]);
        c.name=name; c.purpose=purpose; c.color=PURPOSE_COLS[purpose].slice();
        w.claims.push(c);
      }); })(pendingClaim,nm,claimPurpose);
      toast('\u2691 '+nm+' \u2014 claimed ('+claimPurpose+')');
    }
    pendingClaim=null; $('claim-pop').hidden=true;
  });
  /* waypoint popup actions (delegated, popup is dynamic) */
  $('wp-pop').addEventListener('click',function(e){
    var b=e.target.closest('[data-wp]'); if(!b||!wpPopData) return;
    var w=activeWorld(), d=wpPopData, act=b.dataset.wp;
    if(act==='save'){
      var nm=(($('wp-name')||{}).value||'').trim()||'Waypoint';
      mutate(function(){
        w.waypoints=w.waypoints||[];
        if(d.wp) d.wp.name=nm;
        else w.waypoints.push({x:Math.round(d.x*2)/2,z:Math.round(d.z*2)/2,name:nm});
      });
      toast('📍 '+nm);
    }else if(act==='go'&&d.wp){
      if(cam.mode==='walk') ctrl.teleport(d.wp.x,d.wp.z);
      else { cam.tx=d.wp.x; cam.tz=d.wp.z; }
      setMap(false);
    }else if(act==='del'&&d.wp){
      mutate(function(){ w.waypoints=(w.waypoints||[]).filter(function(q){return q!==d.wp;}); });
      toast('Waypoint removed');
    }
    hideWpPop(); mapDirty=true;
  });
}

/* ---------------- world map: holographic 3D tactical table ---------------- */
var mapOpen=false, map3d=null, mapDirty=true, mapInit=false;
var mapTool='inspect', terrSign=1, mapStroke=null, mapClaimRect=null, wpPopWp=null;
var mapCursor=null, mapMeasure=null, mapReadXY=null, mapLens='normal';
/* verse map tiers: surface | planet | verse */
var mapTier='surface', mapTierManual=false, mapFollow=true, mapAutoTick=0;
var mapLayers={terrain:true,glass:true,grid:true,contours:true,claims:true,paths:true,buildings:true,waypoints:true};
var PURPOSES=Object.keys(PURPOSE_COLS);

/* ---------------- verse map: the whole verse, not just the flat plane ---------------- */
function hashStr(s){ var h=2166136261; for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function versePlanets(){
  var secs={}, out=[];
  allPlanets().forEach(function(e){
    if(!(e.sec.id in secs)) secs[e.sec.id]=Object.keys(secs).length;
    out.push({id:e.p.id,name:e.p.name,sec:e.sec.name,secIdx:secs[e.sec.id]});
  });
  var pal=[[0.45,0.75,1],[0.6,1,0.6],[1,0.8,0.45],[1,0.55,0.9],[0.75,0.65,1],[0.55,1,0.9]];
  return out.map(function(p){
    var h=hashStr(p.id), arm=p.secIdx%4;
    var hf=(h%1000)/1000, r=350+hf*1150;
    var t=arm*Math.PI/2+hf*4.5+(((h>>10)%100)/100)*0.6; /* winding spiral arms */
    var c=pal[p.secIdx%pal.length];
    return {id:p.id,name:p.name,sec:p.sec,
      x:Math.cos(t)*r, y:(hf-0.5)*360, z:Math.sin(t)*r,
      r:c[0],g:c[1],b:c[2]};
  });
}
function currentPid(){ var w=activeWorld(); var s=w?w.seed:''; return s.indexOf('moor:')===0?s.slice(5):null; }
function feedVerse(){ if(map3d) map3d.setVerseData({planets:versePlanets(),currentId:currentPid()}); }
function setMapTier(t,manual){
  if(!map3d) return;
  if(mapTier===t&&map3d.getTier()===t) return;
  mapTier=t; if(manual) mapTierManual=true;
  map3d.setTier(t);
  if(t==='surface') map3d.setView({dist:600,pitch:1.082});
  else if(t==='planet') map3d.setView({dist:1500,pitch:0.38});
  else { map3d.setView({dist:3800,pitch:0.5}); feedVerse(); }
  document.querySelectorAll('#map-tiers [data-tier]').forEach(function(b){
    b.classList.toggle('on',b.dataset.tier===t);
  });
  mapFollow=true; hideVersePop();
  toast(t==='surface'?'🌍 Surface map':t==='planet'?'🪐 Planet view — the world as a globe':'✨ Verse map — all '+versePlanets().length+' planets');
  mapDirty=true;
}
/* live tier tracking: leaving the planet switches the map to match */
function mapAutoTier(){
  if(mapTierManual||!map3d||!mapOpen) return;
  var air=0;
  try{ var st=window.__beta.ctrl().state(); air=st.air||0; }catch(_){}
  var t=mapTier;
  if(t==='surface'&&air>120) t='planet';
  else if(t==='planet'&&(air>600||air<80)) t=air>600?'verse':'surface';
  else if(t==='verse'&&air<400) t='planet';
  if(t!==mapTier) setMapTier(t,false);
}
function showVersePop(x,y,pl){
  var el=$('verse-pop');
  el.innerHTML='<b>🪐 '+esc(pl.name)+'</b><br><small>'+esc(pl.sec)+'</small>'+
    '<div class="prow"><button data-v="go">Travel →</button><button data-v="x">✕</button></div>';
  el.hidden=false;
  el.style.left=Math.min(window.innerWidth-230,Math.max(8,x-100))+'px';
  el.style.top=Math.max(8,y-90)+'px';
  el.querySelector('[data-v="go"]').addEventListener('click',function(){
    hideVersePop(); travelToPlanet(pl.id);
    setTimeout(function(){ if(mapOpen&&mapTier==='verse') feedVerse(); },600);
  });
  el.querySelector('[data-v="x"]').addEventListener('click',hideVersePop);
}
function hideVersePop(){ var el=$('verse-pop'); if(el) el.hidden=true; }

/* dark hologram hypsometric tint; lens = Civ-style analytical recoloring */
function mapTint(x,z,h,lens){
  var r,g,b,v,t;
  if(lens==='slope'){
    /* green flat -> yellow rolling -> red steep: terraform readability */
    var s=Math.min(1,slopeAt(x,z)*1.1);
    if(s<0.5){ t=s/0.5; r=0.08+0.60*t; g=0.55+0.12*t; b=0.22-0.08*t; }
    else { t=(s-0.5)/0.5; r=0.68+0.27*t; g=0.67-0.47*t; b=0.14-0.06*t; }
    return [r,g,b];
  }
  if(lens==='height'){
    /* discrete topo bands every 5m with glowing band edges */
    var pal=[[0.04,0.18,0.42],[0.06,0.42,0.52],[0.12,0.52,0.28],[0.52,0.56,0.18],
             [0.60,0.36,0.18],[0.68,0.68,0.74],[0.85,0.85,0.90]];
    var band=Math.max(0,Math.min(pal.length-1,Math.floor(h/5)+1));
    var c=pal[band], f=((h/5)%1+1)%1, edge=Math.min(f,1-f);
    var k=edge<0.07?1.7:1.0;
    return [Math.min(1,c[0]*k),Math.min(1,c[1]*k),Math.min(1,c[2]*k)];
  }
  if(lens==='claims'){
    /* territory view: claims glow in purpose colors, wild stays dark */
    var w=activeWorld(), cls=w?(w.claims||[]):[];
    for(var i=0;i<cls.length;i++){
      var rc=claimRect(cls[i]);
      if(x>=rc.x0&&x<=rc.x1&&z>=rc.z0&&z<=rc.z1){
        var col=claimColor(cls[i]);
        return [col[0]*0.9+0.08,col[1]*0.9+0.08,col[2]*0.9+0.08];
      }
    }
    return [0.03,0.05,0.09];
  }
  if(h<0.8){ r=0.03; g=0.15; b=0.36; }
  else{
    v=Math.min(1,(h-0.8)/32);
    if(v<0.35){ t=v/0.35; r=0.03+0.02*t; g=0.22+0.23*t; b=0.42+0.08*t; }
    else if(v<0.65){ t=(v-0.35)/0.3; r=0.05+0.30*t; g=0.45+0.10*t; b=0.50-0.25*t; }
    else if(v<0.85){ t=(v-0.65)/0.2; r=0.35+0.40*t; g=0.55+0.05*t; b=0.25+0.05*t; }
    else { t=(v-0.85)/0.15; r=0.75+0.10*t; g=0.60+0.32*t; b=0.30+0.70*t; }
  }
  var dk=1-Math.min(0.4,slopeAt(x,z)*0.45);
  return [r*dk,g*dk,b*dk];
}
function mapEnsure(){
  if(map3d) return true;
  try{ map3d=Map3D.create($('map-cv'),{heightAt:heightAt,tint:mapTint}); }
  catch(e){ toast('3D map needs WebGL'); return false; }
  mapSize();
  return true;
}
function mapSize(){
  if(!map3d) return;
  var cv=$('map-cv');
  var size=Math.max(300,Math.min(window.innerWidth-16,window.innerHeight-16));
  size=Math.round(size);
  cv.style.width=size+'px'; cv.style.height=size+'px';
  map3d.resize(size,size,Math.min(2,window.devicePixelRatio||1));
}
function mapWorldKey(){ var w=activeWorld(); return w?(w.seed+'|'+(w.terrainEdits||[]).length):'none'; }
function mapFeed(){
  if(!map3d) return;
  if(mapTier==='verse') return; /* verse has its own data feed */
  var w=activeWorld(); if(!w) return;
  map3d.setWorld(mapWorldKey());
  var pl=(cam.mode==='walk')?{x:cam.wx,z:cam.wz}:{x:cam.tx,z:cam.tz};
  map3d.setData({
    claims:(w.claims||[]).map(function(cl){ var r=claimRect(cl);
      return {x0:r.x0,z0:r.z0,x1:r.x1,z1:r.z1,color:claimColor(cl)}; }),
    paths:w.paths||[], buildings:w.buildings||[], waypoints:w.waypoints||[],
    player:pl, stroke:mapStroke||mapMeasure, claimRect:mapClaimRect,
    terrCursor:(mapTool==='terraform')?mapCursor:null,
    layers:mapLayers
  });
  map3d.setLayers(mapLayers);
}
function mapLabels(){
  var layer=$('map-labels'); if(!layer||!map3d) return;
  var vl=$('verse-label');
  if(mapTier==='verse'){
    while(layer.firstChild) layer.removeChild(layer.firstChild);
    /* label the planet you're on */
    var pid=currentPid(), vp=versePlanets(), hit=null, i;
    for(i=0;i<vp.length;i++) if(vp[i].id===pid) hit=vp[i];
    if(hit&&vl){
      var q=map3d.project(hit.x,hit.y,hit.z), r=$('map-cv').getBoundingClientRect();
      vl.hidden=false;
      vl.textContent='🪐 '+hit.name+' — you are here';
      vl.style.left=(q[0]-r.left)+'px'; vl.style.top=(q[1]-r.top)+'px';
      vl.style.display=q[2]?'block':'none';
    } else if(vl) vl.hidden=true;
    return;
  }
  if(vl) vl.hidden=true;
  var w=activeWorld(), wps=w?(w.waypoints||[] ):[];
  while(layer.children.length<wps.length){
    var d=document.createElement('div'); d.className='map-wp'; layer.appendChild(d);
  }
  while(layer.children.length>wps.length) layer.removeChild(layer.lastChild);
  var r=$('map-cv').getBoundingClientRect();
  wps.forEach(function(wp,i){
    var q=map3d.project(wp.x,heightAt(wp.x,wp.z)+11,wp.z);
    var el=layer.children[i];
    el.textContent='📍 '+(wp.name||'');
    el.style.display=q[2]?'block':'none';
    el.style.left=(q[0]-r.left)+'px'; el.style.top=(q[1]-r.top)+'px';
  });
}
function mapFrame(t){
  if(!mapOpen||!map3d) return;
  if(mapDirty){ mapFeed(); mapDirty=false; }
  if((mapAutoTick=(mapAutoTick+1)%30)===0) mapAutoTier();
  /* planet tier: ease the globe so your position stays in view (live follow) */
  if(mapTier==='planet'&&mapFollow){
    try{
      var st=window.__beta.ctrl().state(), v=map3d.getView();
      var target=Math.atan2(st.x,st.z), d=target-v.yaw;
      while(d>Math.PI) d-=Math.PI*2; while(d<-Math.PI) d+=Math.PI*2;
      if(Math.abs(d)>0.02) map3d.setView({yaw:v.yaw+d*0.08});
    }catch(_){}
  }
  map3d.render(t);
  mapLabels();
  requestAnimationFrame(mapFrame);
}
function setMap(open){
  mapOpen=open;
  $('map-wrap').hidden=!open;
  if(!open){ hideWpPop(); hideVersePop(); return; }
  if(!mapEnsure()){ mapOpen=false; $('map-wrap').hidden=true; return; }
  if(!mapInit){ mapInit=true; map3d.setView({yaw:0,dist:600}); }
  setMapTool('inspect');
  /* pick the tier that matches where the player actually is */
  mapTierManual=false;
  var air0=0;
  try{ air0=window.__beta.ctrl().state().air||0; }catch(_){}
  setMapTier(air0>600?'verse':air0>120?'planet':'surface',false);
  $('map-read').textContent='Drag to rotate · scroll to zoom · tap to read';
  mapDirty=true;
  requestAnimationFrame(mapFrame);
}
function toggleLayers(){
  var p=$('map-layers');
  if(p.hidden){
    var names={terrain:'Terrain',glass:'Glass slices',grid:'Laser grid',contours:'Contours',
      claims:'Claims',paths:'Paths',buildings:'Buildings',waypoints:'Waypoints'};
    var html='';
    for(var k in names)
      html+='<label><input type="checkbox" data-layer="'+k+'"'+(mapLayers[k]?' checked':'')+'> '+names[k]+'</label>';
    html+='<div class="map-lens"><span>Lens</span>';
    var lenses={normal:'Terrain',slope:'Slope',height:'Height',claims:'Claims'};
    for(var ln in lenses)
      html+='<button data-lens="'+ln+'" class="'+(mapLens===ln?'on':'')+'">'+lenses[ln]+'</button>';
    html+='</div>';
    p.innerHTML=html;
    p.querySelectorAll('[data-layer]').forEach(function(cb){
      cb.addEventListener('change',function(){ mapLayers[cb.dataset.layer]=cb.checked; mapDirty=true; });
    });
    p.querySelectorAll('[data-lens]').forEach(function(b){
      b.addEventListener('click',function(){
        mapLens=b.dataset.lens;
        if(map3d) map3d.setLens(mapLens);
        p.querySelectorAll('[data-lens]').forEach(function(x){ x.classList.toggle('on',x===b); });
        toast('🔍 '+lenses[mapLens]+' lens');
      });
    });
    p.hidden=false;
  } else p.hidden=true;
}
function bindMap(){
  $('map-btn').addEventListener('click',function(){ setMap(!mapOpen); });
  $('map-close').addEventListener('click',function(){ setMap(false); });
  document.querySelectorAll('#map-tools [data-mtool]').forEach(function(b){
    b.addEventListener('click',function(){ setMapTool(b.dataset.mtool); });
  });
  $('map-layers-btn').addEventListener('click',function(e){ e.stopPropagation(); toggleLayers(); });
  document.querySelectorAll('#map-tiers [data-tier]').forEach(function(b){
    b.addEventListener('click',function(){ setMapTier(b.dataset.tier,true); });
  });
  $('map-north-btn').addEventListener('click',function(){ if(map3d){ map3d.setView({yaw:0}); toast('🧭 North up'); } });
  $('map-terr-sign').addEventListener('click',function(){
    terrSign=-terrSign; this.textContent=terrSign>0?'＋':'－';
    setMapTool('terraform');
  });
  $('map-read').addEventListener('click',function(e){
    if(!mapReadXY||!e.target.classList||!e.target.classList.contains('map-copy')) return;
    var s=Math.round(mapReadXY[0])+', '+Math.round(mapReadXY[1]);
    if(navigator.clipboard&&navigator.clipboard.writeText)
      navigator.clipboard.writeText(s).then(function(){ toast('📋 Copied '+s); },function(){ toast(s); });
    else toast(s);
  });
  var cv=$('map-cv'), mapPD=null, pointers={};
  function mPos(e){ return (map3d&&mapOpen)?map3d.pick(e.clientX,e.clientY):null; }
  function pinchZoom(){
    var ks=Object.keys(pointers); if(ks.length!==2||!map3d) return;
    var a=pointers[ks[0]], b=pointers[ks[1]];
    var d=Math.hypot(a.x-b.x,a.y-b.y);
    if(cv._pinchD) map3d.zoomBy(cv._pinchD/Math.max(20,d));
    cv._pinchD=d;
  }
  cv.addEventListener('pointerdown',function(e){
    pointers[e.pointerId]={x:e.clientX,y:e.clientY};
    if(Object.keys(pointers).length===2){ mapPD=null; cv._pinchD=0; return; }
    try{ cv.setPointerCapture(e.pointerId); }catch(_){}
    var wp=mPos(e);
    mapPD={x:e.clientX,y:e.clientY,moved:0,wp:wp};
    if(!wp) return;
    if(mapTool==='path') mapStroke=[[Math.round(wp[0]*2)/2,Math.round(wp[1]*2)/2]];
    else if(mapTool==='claim') mapClaimRect={x0:wp[0],z0:wp[1],x1:wp[0],z1:wp[1]};
    else if(mapTool==='terraform'){ mapPD.samples=[[wp[0],wp[1]]]; mapCursor=[wp[0],wp[1]]; mapDirty=true; }
    else if(mapTool==='measure'){ mapPD.m0=[wp[0],wp[1]]; mapMeasure=null; }
  });
  cv.addEventListener('pointermove',function(e){
    if(pointers[e.pointerId]){
      pointers[e.pointerId]={x:e.clientX,y:e.clientY};
      if(Object.keys(pointers).length>=2){ pinchZoom(); return; }
      /* single pointer: fall through to tool handling below */
    }
    if(mapTool==='terraform'&&mapOpen&&!mapPD){
      var hov=mPos(e);
      if(hov&&(!mapCursor||Math.hypot(hov[0]-mapCursor[0],hov[1]-mapCursor[1])>2)){
        mapCursor=[hov[0],hov[1]]; mapDirty=true;
      }
    }
    if(!mapPD) return;
    var dx=e.clientX-mapPD.x, dy=e.clientY-mapPD.y;
    mapPD.moved+=Math.abs(dx)+Math.abs(dy); mapPD.x=e.clientX; mapPD.y=e.clientY;
    if(mapTool==='inspect'){ if(map3d) map3d.rotateBy(dx*0.006); if(mapTier==='planet') mapFollow=false; return; }
    var wp=mPos(e); if(!wp) return;
    if(mapTool==='path'&&mapStroke){
      var l=mapStroke[mapStroke.length-1], nx=Math.round(wp[0]*2)/2, nz=Math.round(wp[1]*2)/2;
      if(Math.hypot(nx-l[0],nz-l[1])>3&&mapStroke.length<240){ mapStroke.push([nx,nz]); mapDirty=true; }
    }else if(mapTool==='claim'&&mapClaimRect){
      mapClaimRect.x1=wp[0]; mapClaimRect.z1=wp[1]; mapDirty=true;
    }else if(mapTool==='terraform'&&mapPD.samples){
      var s2=mapPD.samples, q=s2[s2.length-1];
      if(Math.hypot(wp[0]-q[0],wp[1]-q[1])>4){ s2.push([wp[0],wp[1]]); }
      mapCursor=[wp[0],wp[1]]; mapDirty=true;
    }
  });
  function mapUp(e){
    delete pointers[e.pointerId]; cv._pinchD=0;
    if(!mapPD) return;
    var pd=mapPD; mapPD=null; var wp=pd.wp;
    /* verse tier: tap a planet to travel */
    if(mapTier==='verse'){
      if(pd.moved<14&&map3d){ var hit=map3d.pickVerse(e.clientX,e.clientY); if(hit) showVersePop(e.clientX,e.clientY,hit); }
      return;
    }
    if(mapTier!=='surface') return; /* planet tier is view-only */
    if(mapTool==='path'&&mapStroke){
      var pts=mapStroke; mapStroke=null;
      if(pts.length>=2){
        mutate(function(){ var w=activeWorld(); w.paths=(w.paths||[]);
          w.paths.push({pts:pts,w:PATH_WIDTHS[palSel.paths].w}); });
        toast('🛤️ Path placed');
      }
      mapDirty=true;
    }else if(mapTool==='claim'&&mapClaimRect){
      var c=mapClaimRect; mapClaimRect=null; mapDirty=true;
      if(Math.abs(c.x1-c.x0)>=3&&Math.abs(c.z1-c.z0)>=3){
        pendingClaim={x0:Math.round(c.x0*2)/2,z0:Math.round(c.z0*2)/2,
                      x1:Math.round(c.x1*2)/2,z1:Math.round(c.z1*2)/2};
        showClaimPop();
      }
    }else if(mapTool==='waypoint'){
      if(pd.moved<14&&wp) showWpPop(e.clientX,e.clientY,wp[0],wp[1],null);
    }else if(mapTool==='terraform'&&pd.samples){
      commitTerraform(pd.samples); pd.samples=null; mapDirty=true;
    }else if(mapTool==='measure'){
      if(pd.m0&&wp){
        var dd=Math.hypot(wp[0]-pd.m0[0],wp[1]-pd.m0[1]);
        var dh=heightAt(wp[0],wp[1])-heightAt(pd.m0[0],pd.m0[1]);
        $('map-read').textContent='📏 '+dd.toFixed(1)+'m'+(Math.abs(dh)>0.5?' · Δh '+dh.toFixed(1)+'m':'');
        mapMeasure=[pd.m0,[wp[0],wp[1]]]; mapDirty=true;
      }
    }else if(mapTool==='inspect'&&pd.moved<14){
      var w=activeWorld(), hit=null;
      (w.waypoints||[]).forEach(function(q){
        var a=map3d.project(q.x,heightAt(q.x,q.z)+7,q.z);
        if(Math.hypot(a[0]-e.clientX,a[1]-e.clientY)<20) hit=q;
      });
      if(hit) showWpPop(e.clientX,e.clientY,hit.x,hit.z,hit);
      else if(wp){ var hh=heightAt(wp[0],wp[1]); mapReadXY=wp;
        $('map-read').innerHTML='📍 '+wp[0].toFixed(0)+', '+wp[1].toFixed(0)+' · ⛰ '+hh.toFixed(1)+'m <span class="map-copy">📋 copy</span>'; }
    }
  }
  cv.addEventListener('pointerup',mapUp);
  cv.addEventListener('pointercancel',function(e){
    delete pointers[e.pointerId]; mapPD=null; mapStroke=null; mapClaimRect=null; mapDirty=true;
  });
  cv.addEventListener('wheel',function(e){
    e.preventDefault(); if(!map3d) return;
    var v0=map3d.getView().dist;
    map3d.zoomBy(1+e.deltaY*0.001);
    var v1=map3d.getView().dist;
    /* zooming past a tier's range dives/climbs a level */
    if(mapTier==='surface'&&v1>=1099&&e.deltaY>0) setMapTier('planet',true);
    else if(mapTier==='planet'&&v1>=3499&&e.deltaY>0) setMapTier('verse',true);
    else if(mapTier==='planet'&&v1<=901&&e.deltaY<0) setMapTier('surface',true);
    else if(mapTier==='verse'&&v1<=2001&&e.deltaY<0) setMapTier('planet',true);
  },{passive:false});
  window.addEventListener('resize',function(){ if(mapOpen) mapSize(); });
  window.addEventListener('keydown',function(e){
    var tag=(e.target&&e.target.tagName)||'';
    if(tag==='INPUT'||tag==='TEXTAREA') return;
    if(e.key==='m'||e.key==='M'){ setMap(!mapOpen); }
    else if(e.key==='Escape'&&mapOpen){ setMap(false); }
  });
}

function setMapTool(t){
  mapTool=t; mapStroke=null; mapClaimRect=null; mapMeasure=null; hideWpPop(); hideVersePop();
  /* editing tools live on the surface — drop down a tier if needed */
  if(t!=='inspect'&&mapTier!=='surface'&&map3d){ setMapTier('surface',true); }
  var btns=document.querySelectorAll('#map-tools [data-mtool]');
  for(var i=0;i<btns.length;i++) btns[i].classList.toggle('on',btns[i].dataset.mtool===t);
  $('map-terr-sign').hidden=(t!=='terraform');
  $('map-layers').hidden=true;
  $('map-read').textContent=t==='inspect'?'Drag to rotate · scroll to zoom · tap to read':
    t==='path'?'Drag on the map to draw a path':
    t==='claim'?'Drag a rectangle to claim land':
    t==='waypoint'?'Tap to drop a waypoint':
    t==='measure'?'Tap two points to measure distance':
    'Drag to '+(terrSign>0?'raise':'lower')+' terrain';
  mapDirty=true;
}
function commitTerraform(samples){
  if(!samples||!samples.length) return;
  mutate(function(){
    var w=activeWorld(); w.terrainEdits=w.terrainEdits||[];
    samples.forEach(function(s){
      var hit=null;
      for(var i=0;i<w.terrainEdits.length;i++){ var e=w.terrainEdits[i];
        if(Math.hypot(e.x-s[0],e.z-s[1])<6){ hit=e; break; } }
      if(hit) hit.dh=Math.max(-8,Math.min(8,hit.dh+terrSign*0.5));
      else w.terrainEdits.push({x:Math.round(s[0]*2)/2,z:Math.round(s[1]*2)/2,r:9,dh:terrSign*0.5});
    });
  });
  buildTerrainBuffers(); mapDirty=true;
  toast('⛰️ Terrain '+(terrSign>0?'raised':'lowered'));
}
/* waypoint popup */
var wpPopData=null;
function showWpPop(cx,cy,x,z,wp){
  wpPopData={x:x,z:z,wp:wp};
  var p=$('wp-pop');
  p.innerHTML='<input id="wp-name" placeholder="Waypoint name" maxlength="24" value="'+esc(wp?(wp.name||''):'')+'">'+
    '<div class="prow">'+
    (wp?'<button data-wp="go">Go →</button>':'')+
    '<button data-wp="save" class="go">'+(wp?'Save':'Drop 📍')+'</button>'+
    (wp?'<button data-wp="del" class="danger">✕</button>':'')+'</div>';
  p.hidden=false;
  p.style.left=Math.max(8,Math.min(window.innerWidth-230,cx-105))+'px';
  p.style.top=Math.max(8,Math.min(window.innerHeight-160,cy+12))+'px';
  setTimeout(function(){ var i=$('wp-name'); if(i) i.focus(); },60);
}
function hideWpPop(){ $('wp-pop').hidden=true; wpPopData=null; }

/* test handle (also handy for automation) */
window.__beta={setMode:setMode,placeAt:placeAt,world:activeWorld,
  setPal:function(k,i){ palSel[k]=i; renderPalette(); },
  get cam(){ return cam; }, tap:onTap, eye:camEye};
window.__beta.undo=undo;
window.__beta.startMove=startMove;
window.__beta.endMove=endMove;
window.__beta.draw={start:startStroke,extend:extendStroke,end:endStroke};
window.__beta.openEdit=openEdit;
window.__beta.closeEdit=closeEdit;
window.__beta.select=function(kind,idx){ selected={kind:kind,idx:idx}; showSel(); };
window.__beta.deselect=function(){ selected=null; hideSel(); };
window.__beta.rebuild=function(){ needsRebuild=true; };
window.__beta.colliderBoxes=function(){ return colliders; };
window.__beta.farTris=function(){ return (typeof farBuf!=='undefined'&&farBuf)?farBuf.count:0; };
window.__beta.reveal=function(){ return revealT; };
window.__beta.scatterPts=function(){ return scatterPlaced; };
window.__beta.h=function(x,z){ return heightAt(x,z); };
window.__beta.ctrl=function(){ return ctrl; };
window.__beta.map3d=function(){ return map3d; };
window.__beta.versePlanets=versePlanets;
window.__beta.setMapTier=setMapTier;
window.__beta.mapTier=function(){ return mapTier; };
window.__beta.colliders=function(){ return colliders.length; };
window.__beta.objTris=function(){ return objIdx.length/3; };
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
else boot();
})();


</script>
