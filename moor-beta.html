<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Moor Beta — World Shell</title>
<style>
/* Moor Beta — world shell styles. Dark, thumb-first, progressive disclosure. */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0a0e14;color:#e8ecf5;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;
  overscroll-behavior:none}
#app{position:fixed;inset:0}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud-top{position:absolute;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;
  display:flex;justify-content:space-between;align-items:center;pointer-events:none}
#world-chip{pointer-events:auto;display:flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.14);
  background:rgba(10,14,20,.72);backdrop-filter:blur(10px);color:#e8ecf5;border-radius:999px;
  padding:9px 14px;font-size:.85rem;font-weight:600;cursor:pointer}
#world-chip .wic{font-size:1rem}
#save-state{font-size:.8rem;color:#7fe0a8;background:rgba(10,14,20,.72);border:1px solid rgba(255,255,255,.1);
  border-radius:999px;padding:6px 10px;backdrop-filter:blur(10px)}
#save-state.dirty{color:#ffd76a}
#palette{position:absolute;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom));
  display:flex;gap:8px;overflow-x:auto;padding:8px 12px;scrollbar-width:none}
#palette::-webkit-scrollbar{display:none}
#palette[hidden]{display:none}
.pal{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:64px;
  border:1px solid rgba(255,255,255,.14);background:rgba(10,14,20,.78);backdrop-filter:blur(10px);
  color:#e8ecf5;border-radius:14px;padding:9px 10px;font-size:1.3rem;cursor:pointer}
.pal small{font-size:.62rem;color:#9aa5b5;letter-spacing:.02em}
.pal.on{border-color:#5bd8ff;background:rgba(91,216,255,.14)}
#modebar{position:absolute;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));
  display:flex;gap:6px;justify-content:center}
#modebar button{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:2px;
  border:1px solid rgba(255,255,255,.12);background:rgba(10,14,20,.78);backdrop-filter:blur(12px);
  color:#9aa5b5;border-radius:16px;padding:8px 0 7px;font-size:.62rem;cursor:pointer}
#modebar button .mi{font-size:1.25rem}
#modebar button.on{color:#e8ecf5;border-color:rgba(91,216,255,.55);background:rgba(91,216,255,.12)}
#sel-pop{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(148px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:8px;background:rgba(10,14,20,.88);border:1px solid rgba(255,255,255,.16);
  border-radius:16px;padding:8px 8px 8px 14px;backdrop-filter:blur(12px);font-size:.82rem}
#sel-pop[hidden]{display:none}
#sel-pop strong{font-weight:650}
#sel-pop button{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#e8ecf5;
  border-radius:12px;padding:8px 12px;font-size:.8rem;cursor:pointer}
#sel-pop button.danger{color:#ff9a9a}
#joy{position:absolute;left:18px;bottom:calc(150px + env(safe-area-inset-bottom));width:112px;height:112px;
  border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(10,14,20,.4);backdrop-filter:blur(6px)}
#joy[hidden]{display:none}
#joy-knob{position:absolute;left:50%;top:50%;width:48px;height:48px;border-radius:50%;
  background:rgba(91,216,255,.35);border:1px solid rgba(91,216,255,.6);transform:translate(-50%,-50%)}
#sheet{position:absolute;left:12px;right:12px;top:calc(56px + env(safe-area-inset-top));max-height:60%;
  overflow:auto;background:rgba(10,14,20,.94);border:1px solid rgba(255,255,255,.14);border-radius:18px;
  padding:10px;backdrop-filter:blur(16px);z-index:5}
#sheet[hidden]{display:none}
#sheet h3{margin:6px 8px 10px;font-size:.9rem}
.wrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid rgba(255,255,255,.1);
  background:transparent;color:#e8ecf5;border-radius:14px;padding:12px;margin-bottom:8px;font-size:.85rem;cursor:pointer}
.wrow.on{border-color:rgba(91,216,255,.55)}
.wrow .wn{font-weight:650}
.wrow .ws{color:#9aa5b5;font-size:.72rem}
.wrow .del{margin-left:auto;color:#ff9a9a;border:0;background:transparent;font-size:1rem;cursor:pointer;padding:6px}
#sheet .newrow{display:flex;gap:8px;margin-top:4px}
#sheet input{flex:1;background:#0b1523;border:1px solid rgba(255,255,255,.14);color:#e8ecf5;
  border-radius:12px;padding:11px;font-size:.85rem}
#sheet .go{border:0;background:#5bd8ff;color:#06121c;border-radius:12px;padding:0 18px;font-weight:700;font-size:.85rem;cursor:pointer}
#toast{position:absolute;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top));
  background:rgba(10,14,20,.9);border:1px solid rgba(255,255,255,.14);color:#e8ecf5;
  border-radius:999px;padding:9px 16px;font-size:.8rem;z-index:6;white-space:nowrap}
#toast[hidden]{display:none}
#nogl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:32px;text-align:center}
#nogl[hidden]{display:none}
#nogl p{color:#9aa5b5;max-width:300px;line-height:1.6}
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(148px + env(safe-area-inset-bottom));
  color:#dfe6f2;background:rgba(10,14,20,.66);border-radius:999px;padding:8px 16px;font-size:.78rem;
  pointer-events:none;white-space:nowrap;backdrop-filter:blur(8px)}

/* beta v0.2: undo, move, paths, edit, jump */
#undo-btn{pointer-events:auto;display:flex;align-items:center;justify-content:center;width:34px;height:34px;
  border-radius:50%;border:1px solid rgba(255,255,255,.14);background:rgba(10,14,20,.72);
  backdrop-filter:blur(10px);color:#e8ecf5;font-size:1rem;cursor:pointer}
#move-bar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(148px + env(safe-area-inset-bottom));
  display:flex;gap:8px;z-index:5}
#move-bar[hidden]{display:none}
#move-bar button{border:1px solid rgba(91,216,255,.5);background:rgba(10,14,20,.9);color:#e8ecf5;
  border-radius:14px;padding:10px 18px;font-size:.85rem;font-weight:650;cursor:pointer;backdrop-filter:blur(10px)}
#jump{position:absolute;right:18px;bottom:calc(150px + env(safe-area-inset-bottom));width:60px;height:60px;
  border-radius:50%;border:1px solid rgba(91,216,255,.5);background:rgba(10,14,20,.6);color:#e8ecf5;
  font-size:1.3rem;cursor:pointer;backdrop-filter:blur(8px);z-index:4}
#jump[hidden]{display:none}
#fly{position:absolute;right:18px;bottom:calc(224px + env(safe-area-inset-bottom));width:60px;height:60px;
  border-radius:50%;border:1px solid rgba(197,234,165,.5);background:rgba(10,14,20,.6);color:#e8ecf5;
  font-size:1.3rem;cursor:pointer;backdrop-filter:blur(8px);z-index:4}
#fly[hidden]{display:none}
#fly.on{border-color:#c5eaa5;background:rgba(197,234,165,.18)}
#zoomout{position:absolute;right:18px;bottom:calc(298px + env(safe-area-inset-bottom));width:60px;height:60px;
  border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(10,14,20,.6);color:#e8ecf5;
  font-size:1.3rem;cursor:pointer;backdrop-filter:blur(8px);z-index:4}
#zoomout[hidden]{display:none}
#edit-sheet{position:absolute;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));
  max-height:52%;overflow:auto;background:rgba(10,14,20,.94);border:1px solid rgba(255,255,255,.14);
  border-radius:18px;padding:12px;backdrop-filter:blur(16px);z-index:5}
#edit-sheet[hidden]{display:none}
#edit-sheet h3{margin:2px 4px 10px;font-size:.95rem}
#edit-sheet .erow{display:flex;gap:8px;align-items:center;margin-bottom:10px;overflow-x:auto;scrollbar-width:none}
#edit-sheet .erow::-webkit-scrollbar{display:none}
#edit-sheet .elab{color:#9aa5b5;font-size:.78rem;min-width:52px}
#edit-sheet button{flex:0 0 auto;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);
  color:#e8ecf5;border-radius:12px;padding:9px 13px;font-size:.8rem;cursor:pointer}
#edit-sheet button.on{border-color:rgba(91,216,255,.6);background:rgba(91,216,255,.12)}
#edit-sheet button.go{background:#5bd8ff;border:0;color:#06121c;font-weight:700}

/* claim mode */
#claim-pop{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(148px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:10px;align-items:stretch;background:rgba(10,14,20,.94);
  border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:14px 16px;backdrop-filter:blur(16px);
  z-index:61;min-width:250px} /* above map-wrap(40): claiming happens on the map */
#claim-pop[hidden]{display:none}
#claim-pop strong{font-size:.9rem}
#claim-pop input{background:#0b1523;border:1px solid rgba(255,255,255,.16);color:#e8ecf5;
  border-radius:12px;padding:11px;font-size:.9rem}
#claim-pop .crow{display:flex;gap:8px}
#claim-pop button{flex:1;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#e8ecf5;
  border-radius:12px;padding:10px;font-size:.85rem;cursor:pointer}
#claim-pop button.go{background:#5bd8ff;border:0;color:#06121c;font-weight:700}

#reset-btn{pointer-events:auto;display:flex;align-items:center;justify-content:center;width:34px;height:34px;
  border-radius:50%;border:1px solid rgba(255,255,255,.14);background:rgba(10,14,20,.72);
  backdrop-filter:blur(10px);color:#e8ecf5;font-size:1rem;cursor:pointer}
#reset-btn.armed{background:#c0392b;border-color:#c0392b;color:#fff;width:auto;padding:0 12px;border-radius:17px;font-size:.8rem}

/* world map overlay */
#map-btn{pointer-events:auto;display:flex;align-items:center;justify-content:center;width:34px;height:34px;
  border-radius:50%;border:1px solid rgba(255,255,255,.14);background:rgba(10,14,20,.72);
  backdrop-filter:blur(10px);color:#e8ecf5;font-size:1rem;cursor:pointer}
#map-wrap{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
  background:rgba(4,8,14,.74);backdrop-filter:blur(14px)}
#map-wrap[hidden]{display:none}
/* travel picker */
#travel-wrap{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
  background:rgba(4,8,14,.74);backdrop-filter:blur(14px)}
#travel-wrap[hidden]{display:none}
#travel-panel{position:relative;width:min(480px,92vw);max-height:82vh;display:flex;flex-direction:column;
  background:rgba(10,16,24,.96);border:1px solid rgba(91,216,255,.35);border-radius:18px;
  box-shadow:0 18px 60px rgba(0,0,0,.5),0 0 40px rgba(91,216,255,.08);padding:18px;color:#e8ecf5}
#travel-panel h3{margin:0 0 10px;font-size:1.05rem}
#travel-search{width:100%;box-sizing:border-box;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);
  border-radius:10px;color:#e8ecf5;padding:10px 12px;font-size:.95rem;margin-bottom:10px}
#travel-sectors{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
#travel-sectors button{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#cfe3ee;
  border-radius:20px;padding:5px 12px;font-size:.78rem;cursor:pointer}
#travel-sectors button.on{border-color:#5bd8ff;color:#fff;background:rgba(91,216,255,.16)}
#travel-list{overflow-y:auto;display:flex;flex-direction:column;gap:6px;min-height:120px}
#travel-list .trow{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);border-radius:12px;padding:9px 12px}
#travel-list .trow b{font-size:.92rem}
#travel-list .trow small{color:#93a5b8}
#travel-list .go{background:rgba(91,216,255,.16);border:1px solid rgba(91,216,255,.5);color:#fff;
  border-radius:10px;padding:7px 14px;cursor:pointer;white-space:nowrap}
#travel-close{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#fff;cursor:pointer}
#map-cv{border-radius:18px;border:1px solid rgba(255,255,255,.18);box-shadow:0 18px 60px rgba(0,0,0,.5);
  touch-action:none;cursor:grab}
/* 3D map overlays */
#map-labels{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.map-wp{position:absolute;transform:translate(-50%,-140%);font-size:.72rem;color:#ffe9b0;
  text-shadow:0 0 6px rgba(255,180,80,.8),0 1px 2px #000;white-space:nowrap;pointer-events:none}
#map-layers{position:absolute;top:calc(70px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  background:rgba(10,16,24,.95);border:1px solid rgba(91,216,255,.4);border-radius:12px;
  padding:10px 14px;z-index:6;display:flex;flex-direction:column;gap:6px;color:#dfe9f2;font-size:.85rem}
#map-layers[hidden]{display:none}
#map-layers label{display:flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap}
.map-lens{display:flex;align-items:center;gap:6px;border-top:1px solid rgba(255,255,255,.12);
  padding-top:8px;margin-top:2px}
.map-lens span{color:#9fb3c8;font-size:.75rem;margin-right:2px}
.map-lens button{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);color:#dfe9f2;
  border-radius:14px;padding:4px 10px;font-size:.75rem;cursor:pointer}
.map-lens button.on{border-color:#5bd8ff;background:rgba(91,216,255,.18);color:#fff}
.map-copy{color:#5bd8ff;cursor:pointer;border:1px solid rgba(91,216,255,.4);border-radius:8px;
  padding:1px 7px;margin-left:6px;font-size:.75rem}
#map-north-btn{font-weight:700;font-size:.85rem}
/* map dev-tools */
#map-tools{position:absolute;top:calc(18px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  display:flex;gap:6px;background:rgba(10,14,20,.88);border:1px solid rgba(91,216,255,.35);
  border-radius:16px;padding:7px 9px;z-index:5;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#map-tools button{width:42px;height:42px;border-radius:12px;border:1px solid transparent;
  background:transparent;font-size:1.25rem;cursor:pointer;color:#e8ecf5}
#map-tools button.on{background:rgba(91,216,255,.18);border-color:rgba(91,216,255,.55)}
#map-terr-sign{font-weight:700;color:#c5eaa5}
#map-terr-sign[hidden]{display:none}
#wp-pop{position:fixed;z-index:60;background:rgba(10,16,24,.96);border:1px solid rgba(91,216,255,.4);
  border-radius:14px;padding:12px;color:#e8ecf5;box-shadow:0 12px 40px rgba(0,0,0,.6);min-width:210px}
#wp-pop input{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:8px;
  color:#e8ecf5;padding:8px 10px;width:100%;box-sizing:border-box;margin-bottom:8px}
#wp-pop .prow{display:flex;gap:6px}
#wp-pop button{background:rgba(91,216,255,.14);border:1px solid rgba(91,216,255,.45);color:#fff;
  border-radius:8px;padding:7px 12px;cursor:pointer}
#wp-pop button.danger{background:rgba(255,90,90,.12);border-color:rgba(255,90,90,.5)}
.pchips{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}
.pchips button{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);color:#dfe9f2;
  border-radius:16px;padding:5px 11px;font-size:.76rem;cursor:pointer}
.pchips button.on{border-color:#fff;background:rgba(255,255,255,.16);color:#fff}
#map-read{position:absolute;bottom:calc(42px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  background:rgba(10,14,20,.88);border:1px solid rgba(255,255,255,.14);padding:9px 16px;border-radius:12px;
  font-size:.85rem;color:#e8ecf5;white-space:nowrap}
#map-close{position:absolute;top:calc(18px + env(safe-area-inset-top));right:18px;width:42px;height:42px;
  border-radius:50%;border:1px solid rgba(255,255,255,.16);background:rgba(10,14,20,.85);color:#fff;
  font-size:1.1rem;cursor:pointer}
/* verse map tiers */
#map-tiers{position:absolute;top:calc(128px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  display:flex;gap:4px;background:rgba(10,14,20,.88);border:1px solid rgba(91,216,255,.35);
  border-radius:14px;padding:5px 6px;z-index:5;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#map-tiers button{background:transparent;border:1px solid transparent;color:#9fb3c8;border-radius:10px;
  padding:6px 12px;font-size:.78rem;cursor:pointer;white-space:nowrap}
#map-tiers button.on{background:rgba(91,216,255,.18);border-color:rgba(91,216,255,.55);color:#fff}
#verse-label{position:absolute;transform:translate(-50%,-160%);font-size:.8rem;color:#bfe6ff;
  text-shadow:0 0 8px rgba(91,216,255,.9),0 1px 2px #000;white-space:nowrap;pointer-events:none;z-index:4}
#verse-pop{position:fixed;z-index:60;background:rgba(10,16,24,.96);border:1px solid rgba(91,216,255,.4);
  border-radius:14px;padding:12px;color:#e8ecf5;box-shadow:0 12px 40px rgba(0,0,0,.6);min-width:200px}
#verse-pop b{font-size:.95rem}
#verse-pop small{color:#9fb3c8}
#verse-pop .prow{display:flex;gap:6px;margin-top:8px}
#verse-pop button{background:rgba(91,216,255,.14);border:1px solid rgba(91,216,255,.45);color:#fff;
  border-radius:8px;padding:7px 12px;cursor:pointer}

</style>
</head>
<body>
<div id="app">
  <canvas id="gl"></canvas>
  <div id="hud-top">
    <button id="world-chip" aria-label="Worlds"><span class="wic">🌍</span><span id="world-name">…</span></button>
    <span style="display:flex;gap:8px;pointer-events:auto">
      <button id="undo-btn" title="Undo (Ctrl+Z)" aria-label="Undo">↩</button>
      <button id="map-btn" title="Map (M)" aria-label="Map">🗺</button>
      <button id="reset-btn" title="Reset world" aria-label="Reset world">↺</button>
      <span id="save-state" title="All changes saved">✓</span>
    </span>
  </div>
  <div id="palette" hidden></div>
  <div id="sel-pop" hidden></div>
  <div id="move-bar" hidden></div>
  <div id="edit-sheet" hidden></div>
  <div id="claim-pop" hidden></div>
  <div id="map-wrap" hidden>
    <canvas id="map-cv"></canvas>
    <div id="map-tools">
      <button data-mtool="inspect" class="on" title="Inspect">🖐</button>
      <button data-mtool="path" title="Draw path">🛤️</button>
      <button data-mtool="claim" title="Claim land">🛡️</button>
      <button data-mtool="waypoint" title="Drop waypoint">📍</button>
      <button data-mtool="terraform" title="Terraform">⛰️</button>
      <button data-mtool="measure" title="Measure distance">📏</button>
      <button id="map-terr-sign" hidden title="Raise / lower">＋</button>
      <button id="map-layers-btn" title="Layers">▤</button>
      <button id="map-north-btn" title="North up">N</button>
    </div>
    <div id="map-layers" hidden></div>
    <div id="map-labels"></div>
    <div id="verse-label" hidden></div>
    <div id="map-tiers">
      <button data-tier="surface" class="on">🌍 Surface</button>
      <button data-tier="planet">🪐 Planet</button>
      <button data-tier="verse">✨ Verse</button>
    </div>
    <div id="map-read">Tap the map to read coordinates</div>
    <button id="map-close" aria-label="Close map">✕</button>
  </div>
  <div id="wp-pop" hidden></div>
  <div id="verse-pop" hidden></div>
  <button id="jump" hidden aria-label="Jump">⬆</button>
  <button id="fly" hidden aria-label="Fly">🕊</button>
  <button id="zoomout" hidden aria-label="Zoom out to orbit">⤢</button>
  <div id="travel-wrap" hidden>
    <div id="travel-panel">
      <h3>🧭 Travel</h3>
      <input id="travel-search" placeholder="Search 254 planets…" autocomplete="off">
      <div id="travel-sectors"></div>
      <div id="travel-list"></div>
      <button id="travel-close" aria-label="Close">✕</button>
    </div>
  </div>
  <div id="modebar">
    <button data-mode="build"><span class="mi">🏠</span><span class="ml">Build</span></button>
    <button data-mode="items"><span class="mi">🪑</span><span class="ml">Items</span></button>
    <button data-mode="paths"><span class="mi">🛤️</span><span class="ml">Paths</span></button>
    <button data-mode="claims"><span class="mi">🛡️</span><span class="ml">Claim</span></button>
    <button data-mode="walk"><span class="mi">🚶</span><span class="ml">Walk</span></button>
    <button data-mode="orbit" class="on"><span class="mi">👁</span><span class="ml">Orbit</span></button>
  </div>
  <div id="joy" hidden><div id="joy-knob"></div></div>

  BoxGeometry:function(w,h,d){ return boxGeo(w,h,d); },
  RBoxGeometry:function(w,h,d,r,s){ return rboxGeo(w,h,d,r,s); },
  CylinderGeometry:function(rt,rb,h,rad){ return cylGeo(rt,rb,h,rad||20); },
  SphereGeometry:function(r,ws,hs){ return sphGeo(r,ws,hs); },
  TorusGeometry:function(R,r,rs,ts,arc){ return torGeo(R,r,rs,ts,arc); },
  LatheGeometry:function(prof,segs){ return latheGeo(prof,segs); }
};

/* ---------------- materials (from the foundry, verbatim) ---------------- */
function hexRGB(h){ h=String(h).replace('#','');
  return [parseInt(h.slice(0,2),16)/255,parseInt(h.slice(2,4),16)/255,parseInt(h.slice(4,6),16)/255]; }
function stdMat(o){ o=o||{};
  return { color:o.color||[0.8,0.8,0.8],
    emissive:o.emissive||[0,0,0], emissiveIntensity:o.emissiveIntensity||0,
    opacity:(o.opacity==null?1:o.opacity), transparent:!!o.transparent,
    wood:o.wood?1:0, woodB:o.woodB||[0,0,0], fabric:o.fabric?1:0, metal:o.metal?1:0 }; }

/* wood species: [base, grain] */
var WOODS={
  oak:    {base:'#c9a06b', grain:'#9a7443', name:'White oak'},
  walnut: {base:'#6d4a2e', grain:'#472d1a', name:'Walnut'},
  cherry: {base:'#9d5c34', grain:'#743c1d', name:'Cherry'},
  ebony:  {base:'#33291f', grain:'#1c150f', name:'Ebonized'},
  ash:    {base:'#d9c49a', grain:'#b39468', name:'Ash'}
};
var FABRICS=[
  {c:'#d9d0bf',n:'Oat linen'},{c:'#e7e0d0',n:'Bouclé'},{c:'#2f5d50',n:'Emerald velvet'},
  {c:'#b45f3c',n:'Rust weave'},{c:'#d9a441',n:'Mustard'},{c:'#5a6470',n:'Slate'},
  {c:'#8a4b5c',n:'Mauve'},{c:'#3e4a5a',n:'Ink blue'}
];
var LEATHERS=[{c:'#a05a2c',n:'Cognac'},{c:'#26221e',n:'Black'},{c:'#7a4a2e',n:'Saddle'}];
var PAINTS=[
  {c:'#ece5d8',n:'Cream'},{c:'#a8b09a',n:'Sage'},{c:'#3a3d40',n:'Charcoal'},
  {c:'#7a93a8',n:'Dusty blue'},{c:'#c4b49a',n:'Sand'}
];
var CERAMICS=['#e8e2d4','#b9c4c9','#5a6e7a','#a8503c','#2e2a26','#d9c9a8'];

function makeMats(style, R){
  var woodKey=R.pick(Object.keys(WOODS));
  if(style==='scandi') woodKey=R.pick(['oak','ash']);
  if(style==='midcentury') woodKey='walnut';
  var W=WOODS[woodKey];
  var fab=R.pick(FABRICS), lea=R.pick(LEATHERS);
  var paint=R.pick(PAINTS);
  function wood(){ return stdMat({color:hexRGB(W.base),woodB:hexRGB(W.grain),wood:1}); }
  function woodDark(){ var w=WOODS[R.pick(['walnut','ebony'])];
    return stdMat({color:hexRGB(w.base),woodB:hexRGB(w.grain),wood:1}); }
  return {
    woodName:W.name, fabricName:fab.n, leatherName:lea.n,
    wood:wood(), woodDark:woodDark(),
    fabric:stdMat({color:hexRGB(fab.c),fabric:1}),
    fabric2:stdMat({color:hexRGB(R.pick(FABRICS).c),fabric:1}),
    leather:stdMat({color:hexRGB(lea.c),fabric:1}),
    paint:stdMat({color:hexRGB(paint.c)}),
    blackMetal:stdMat({color:hexRGB('#26282c'),metal:1}),
    brass:stdMat({color:hexRGB('#b08d4f'),metal:1}),
    chrome:stdMat({color:hexRGB('#c9d2d6'),metal:1}),
    ceramic:stdMat({color:hexRGB(R.pick(CERAMICS))}),
    ceramic2:stdMat({color:hexRGB(R.pick(CERAMICS))}),
    glass:stdMat({color:hexRGB('#cfd8dc'),opacity:0.35,transparent:true}),
    bulb:stdMat({color:hexRGB('#fff2ce'),emissive:hexRGB('#ffdf9c'),emissiveIntensity:1.6}),
    shade:stdMat({color:hexRGB('#f2ead8'),fabric:1,emissive:hexRGB('#ffedbe'),emissiveIntensity:0.55}),
    flame:stdMat({color:hexRGB('#ff9a3c'),emissive:hexRGB('#ff7a1a'),emissiveIntensity:2.2}),
    screen:stdMat({color:hexRGB('#8fa8bd'),emissive:hexRGB('#4a6a8a'),emissiveIntensity:0.8}),
    paper:stdMat({color:hexRGB('#f4f1e8')}),
    leaf:stdMat({color:hexRGB('#4a7a3f')}),
    leafDark:stdMat({color:hexRGB('#33592c')}),
    soil:stdMat({color:hexRGB('#2e2118')}),
    steel:stdMat({color:hexRGB('#a8adb2'),metal:1}),
    glassGreen:stdMat({color:hexRGB('#2a4a34'),opacity:0.55,transparent:true}),
    mirror:stdMat({color:hexRGB('#b8c8d0'),metal:1,opacity:0.92,transparent:true}),
    mattress:stdMat({color:hexRGB('#f0ece2'),fabric:1}),
    bookMats:null /* filled per-shelf */
  };
}

/* book material cache per build (bookshelf fills it) */
function bookMatsFor(R){
  var cols=['#8a4b3c','#3c5a7a','#5a6e4a','#b08d4f','#6e4a6e','#a8a092','#384048','#94552f'];
  return cols.map(function(c){ return stdMat({color:hexRGB(c)}); });
}

/* ---------------- builder helpers (from the foundry, adapted) ----------------
 * Adaptation: each created Mesh is tagged with _matKey (the material key the
 * builder passed) and _geoKind so the flattener can report material keys per
 * triangle without needing the renderer. Geometry calls are verbatim. */
function furnHelpers(mats){
  function M(parent,geo,matKey,kind,x,y,z){
    var o=new T3lite.Mesh(geo,mats[matKey]);
    o._matKey=matKey; o._geoKind=kind||'mesh';
    o.position.set(x||0,y||0,z||0);
    parent.add(o); return o; }
  function rbox(parent,matKey,x,y,z,w,h,d,r){
    return M(parent,new T3lite.RBoxGeometry(w,h,d,r==null?Math.min(w,h,d)*0.2:r),matKey,'rbox',x,y,z); }
  function box(parent,matKey,x,y,z,w,h,d){
    return M(parent,new T3lite.BoxGeometry(w,h,d),matKey,'box',x,y,z); }
  function cyl(parent,matKey,x,y,z,rt,rb,h,rad){
    return M(parent,new T3lite.CylinderGeometry(rt,rb,h,rad||20),matKey,'cyl',x,y,z); }
  function sph(parent,matKey,x,y,z,r,sx,sy,sz){
    var o=M(parent,new T3lite.SphereGeometry(r,20,14),matKey,'sph',x,y,z);
    if(sx)o.scale.set(sx,sy==null?sx:sy,sz==null?sx:sz); return o; }
  function tor(parent,matKey,x,y,z,R,r,arc){
    return M(parent,new T3lite.TorusGeometry(R,r,10,28,arc==null?TAU:arc),matKey,'tor',x,y,z); }
  function lathe(parent,matKey,x,y,z,profile,segs){
    return M(parent,new T3lite.LatheGeometry(profile,segs||28),matKey,'lathe',x,y,z); }
  /* rod between two points (from vehicle builder) */
  function rod(parent,a,b,r,matKey){
    matKey=matKey||'blackMetal';
    var A=new V3(a[0],a[1],a[2]), B=new V3(b[0],b[1],b[2]);
    var dx=B.x-A.x,dy=B.y-A.y,dz=B.z-A.z, len=Math.sqrt(dx*dx+dy*dy+dz*dz)||0.001;
    var o=M(parent,new T3lite.CylinderGeometry(r,r,len,12),matKey,'cyl',
      (A.x+B.x)/2,(A.y+B.y)/2,(A.z+B.z)/2);
    /* orient Y axis along (B-A): yaw then pitch */
    var yaw=Math.atan2(dx,dz), pitch=Math.acos(Math.max(-1,Math.min(1,dy/len)));
    /* orient via quaternion: rotate +Y onto (B-A) */
    var q=new Quat();
    var ux=0,uy=1,uz=0, vx=dx/len,vy=dy/len,vz=dz/len;
    var cx=uy*vz-uz*vy, cy=uz*vx-ux*vz, cz=ux*vy-uy*vx;
    var dot=uy*vy, s=Math.sqrt(cx*cx+cy*cy+cz*cz);
    if(s<1e-6){ q.w = dot>0?1:-1; }
    else { var ang=Math.acos(Math.max(-1,Math.min(1,dot)));
      var hs=Math.sin(ang/2); q.x=cx/s*hs; q.y=cy/s*hs; q.z=cz/s*hs; q.w=Math.cos(ang/2); q._set=true; }
    o.quaternion=q;
    return o; }
  /* turned table/chair leg profile (unit height 1, radius ~0.035) */
  function turnedLeg(parent,matKey,x,z,h,r){
    r=r||0.032;
    var prof=[[0.001,0],[r*1.15,0],[r*1.15,0.02],[r*0.8,0.05],[r*0.55,0.10],
      [r*0.9,0.16],[r*1.0,0.22],[r*0.6,0.30],[r*0.5,0.42],[r*0.85,0.50],
      [r*1.0,0.58],[r*0.62,0.66],[r*0.55,0.78],[r*0.9,0.88],[r*1.05,0.95],[r*1.05,1.0]];
    var o=lathe(parent,matKey,x,0,z,prof.map(function(p){return [p[0],p[1]*h];}),20);
    return o; }
  /* simple tapered square leg */
  function taperedLeg(parent,matKey,x,z,h,wTop,wBot){
    var o=cyl(parent,matKey,x,h/2,z,wTop/2,wBot/2,h,4);
    o.rotation.y=Math.PI/4; return o; }
  return {M:M,rbox:rbox,box:box,cyl:cyl,sph:sph,tor:tor,lathe:lathe,rod:rod,
    turnedLeg:turnedLeg,taperedLeg:taperedLeg};
}

function frameMat(style){ return style==='industrial'?'blackMetal':(style==='midcentury'?'woodDark':'wood'); }

/* ---------------- parametric builders (from the foundry, verbatim) ----------------
 * Units are meters. y=0 is the floor. Every builder is a pure function of
 * its seeded RNG: same seed, same item. Dimensions follow real furniture. */
var BUILDERS={
/* ---- dining chair: seat, legs, posts, back variant, stretchers ---- */
chair:function(R,H,mats,style){
  var root=new T3lite.Group(), fm=frameMat(style);
  var seatH=0.45, w=R.f(0.42,0.48), d=R.f(0.40,0.46), t=0.045;
  var back=R.pick(['slats','slats','ladder','splat','upholstered']);
  H.rbox(root,fm,0,seatH-t/2,0,w,t,d,0.012);
  var lx=w/2-0.035, lz=d/2-0.035, legR=0.024;
  [[-lx,-lz],[lx,-lz],[-lx,lz],[lx,lz]].forEach(function(p){
    if(style==='industrial') H.cyl(root,fm,p[0],(seatH-t)/2,p[1],legR,legR,seatH-t,12);
    else if(R.chance(0.5)) H.turnedLeg(root,fm,p[0],p[1],seatH-t,legR);
    else H.taperedLeg(root,fm,p[0],p[1],seatH-t,0.055,0.032); });
  /* stretchers */
  if(style!=='industrial'&&R.chance(0.8)){
    var sy=0.16;
    H.rod(root,[-lx,sy,-lz],[lx,sy,-lz],0.014,fm); H.rod(root,[-lx,sy,lz],[lx,sy,lz],0.014,fm);
    H.rod(root,[-lx,sy,-lz],[-lx,sy,lz],0.014,fm); H.rod(root,[lx,sy,-lz],[lx,sy,lz],0.014,fm); }
  /* back posts + variant */
  var postH=R.f(0.48,0.56), px=w/2-0.035, pz=-(d/2-0.035);
  [-px,px].forEach(function(x){
    if(style==='industrial') H.cyl(root,fm,x,seatH+postH/2,pz,legR,legR,postH,12);
    else H.turnedLeg(root,fm,x,pz,postH,legR).position.y=seatH; });
  var up=style==='industrial'?'leather':(R.chance(0.6)?'fabric':'leather');
  if(back==='slats'||back==='ladder'){
    var n=back==='ladder'?4:3;
    for(var i=0;i<n;i++){ var y=seatH+0.10+(postH-0.16)*i/(n-1);
      var s=H.rbox(root,fm,0,y,pz,px*2-0.02,0.075,0.022,0.008);
      s.rotation.x=0.06; } }
  else if(back==='splat'){
    var sp=H.rbox(root,fm,0,seatH+postH/2-0.02,pz,w*0.28,postH-0.14,0.02,0.03);
    sp.scale.set(1,1,1); }
  else { var pad=H.rbox(root,up,0,seatH+postH/2-0.03,pz+0.012,px*2-0.04,postH-0.18,0.07,0.03);
    pad.rotation.x=0.08; }
  return root; },

/* ---- armchair ---- */
armchair:function(R,H,mats,style){
  var root=new T3lite.Group(), fm=frameMat(style);
  var up=R.chance(0.7)?'fabric':'leather';
  var w=R.f(0.78,0.92), seatY=0.40;
  H.rbox(root,up,0,seatY-0.10,0,w-0.1,0.22,0.62,0.06);            /* base */
  H.rbox(root,up,0,seatY+0.02,0.02,w-0.28,0.15,0.55,0.06);        /* seat cushion */
  var back=H.rbox(root,up,0,seatY+0.32,-0.30,w-0.28,0.55,0.15,0.06);
  back.rotation.x=-0.12;                                          /* backrest */
  [-1,1].forEach(function(s){                                      /* arms */
    H.rbox(root,up,s*(w/2-0.09),seatY+0.10,0,0.17,0.34,0.66,0.07); });
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(function(p){               /* legs */
    H.taperedLeg(root,fm,p[0]*(w/2-0.08),p[1]*0.26,seatY-0.21,0.05,0.03); });
  return root; },

/* ---- sofa ---- */
sofa:function(R,H,mats,style){
  var root=new T3lite.Group(), fm=frameMat(style);
  var up=R.chance(0.7)?'fabric':'leather';
  var seats=R.i(2,3), w=seats*R.f(0.62,0.70)+0.34, seatY=0.40;
  H.rbox(root,up,0,seatY-0.10,0,w-0.06,0.24,0.66,0.07);
  for(var i=0;i<seats;i++){ var x=(i-(seats-1)/2)*(w-0.34)/seats;
    H.rbox(root,up,x,seatY+0.03,0.03,(w-0.34)/seats-0.03,0.16,0.56,0.06);
    var b=H.rbox(root,up,x,seatY+0.36,-0.30,(w-0.34)/seats-0.03,0.5,0.15,0.06);
    b.rotation.x=-0.12; }
  /* throw pillows in the accent fabric */
  for(var p2=0;p2<2;p2++){ var px2=(p2-0.5)*(w-0.5);
    var pil=H.rbox(root,'fabric2',px2,seatY+0.28,-0.18,0.34,0.34,0.12,0.05);
    pil.rotation.x=-0.14; pil.rotation.z=(p2-0.5)*0.18; }
  [-1,1].forEach(function(s){ H.rbox(root,up,s*(w/2-0.10),seatY+0.12,0,0.18,0.36,0.70,0.08); });
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(function(p){
    H.taperedLeg(root,fm,p[0]*(w/2-0.09),p[1]*0.28,seatY-0.22,0.055,0.032); });
  return root; },

/* ---- coffee table ---- */
coffeeTable:function(R,H,mats,style){
  var root=new T3lite.Group(), fm=frameMat(style);
  var w=R.f(1.0,1.3), d=R.f(0.5,0.62), h=R.f(0.36,0.44), t=0.045;
  var top=R.pick(['wood','wood','glass']);
  var topMat=top==='glass'?'glass':(R.chance(0.5)?fm:'woodDark');
  H.rbox(root,topMat,0,h-t/2,0,w,t,d,0.015);
  var kind=R.pick(['legs','legs','slab','shelf']);
  var lx=w/2-0.07, lz=d/2-0.07;
  if(kind==='legs'){ [[-lx,-lz],[lx,-lz],[-lx,lz],[lx,lz]].forEach(function(p){
      H.taperedLeg(root,fm,p[0],p[1],h-t,0.06,0.035); }); }
  else if(kind==='slab'){ [-1,1].forEach(function(s){
      H.box(root,fm,s*(w/2-0.06),(h-t)/2,0,0.04,h-t,d-0.08); }); }
  else { [[-lx,-lz],[lx,-lz],[-lx,lz],[lx,lz]].forEach(function(p){
      H.taperedLeg(root,fm,p[0],p[1],h-t,0.06,0.035); });
    H.box(root,fm,0,0.09,0,w-0.2,0.03,d-0.16); }
  return root; },

/* ---- dining table: top, apron, turned legs ---- */
diningTable:function(R,H,mats,style){
  var root=new T3lite.Group(), fm=frameMat(style);
  var w=R.f(1.5,2.0), d=R.f(0.85,1.0), h=0.74, t=0.04;
  H.rbox(root,fm,0,h-t/2,0,w,t,d,0.014);
  var ax=w/2-0.12, az=d/2-0.12, ah=0.09;
  H.box(root,fm,0,h-t-ah/2,-az,ax*2,ah,0.03); H.box(root,fm,0,h-t-ah/2,az,ax*2,ah,0.03);
  H.box(root,fm,-ax,h-t-ah/2,0,0.03,ah,az*2); H.box(root,fm,ax,h-t-ah/2,0,0.03,ah,az*2);
  [[-ax,-az],[ax,-az],[-ax,az],[ax,az]].forEach(function(p){
    if(style==='industrial') H.cyl(root,fm,p[0],(h-t-ah)/2,p[1],0.03,0.03,h-t-ah,12);
    else H.turnedLeg(root,fm,p[0],p[1],h-t-ah,0.034); });
  return root; },

/* ---- desk: top, drawer stack, legs ---- */
desk:function(R,H,mats,style){
  var root=new T3lite.Group(), fm=frameMat(style);
  var w=1.25, d=0.62, h=0.74, t=0.04;
  H.rbox(root,fm,0,h-t/2,0,w,t,d,0.012);
  var dw=0.42, dx=w/2-dw/2-0.04;
  H.box(root,fm,dx,h-t-0.16,0,dw,0.28,d-0.12);                    /* drawer box */
  for(var i=0;i<2;i++){ var y=h-t-0.09-i*0.13;
    H.rbox(root,'woodDark',dx,y, (d-0.12)/2+0.005, dw-0.04,0.10,0.015,0.005);
    H.sph(root,'brass',dx,y,(d-0.12)/2+0.02,0.014); }
  [[-w/2+0.05,-d/2+0.05],[ -w/2+0.05,d/2-0.05]].forEach(function(p){
    H.taperedLeg(root,fm,p[0],p[1],h-t,0.055,0.032); });
  return root; },

/* ---- bookshelf with books ---- */
bookshelf:function(R,H,mats,style){
  var root=new T3lite.Group(), fm=frameMat(style);
  bookMatsFor(R).forEach(function(m,i){ mats['__book'+i]=m; });
  var w=R.f(0.85,1.15), h=R.f(1.75,2.1), d=0.32, t=0.028;
  H.box(root,fm,-w/2+t/2,h/2,0,t,h,d); H.box(root,fm,w/2-t/2,h/2,0,t,h,d);
  H.box(root,fm,0,h-t/2,0,w,t,d); H.box(root,fm,0,t/2,0,w,t,d);
  H.box(root,fm,0,h/2,-d/2+0.008,w-2*t,h,0.016);
  var n=R.i(4,5);
  for(var s2=0;s2<n;s2++){ var y=t+(h-2*t)*(s2+1)/(n+1);
    H.box(root,fm,0,y,0,w-2*t,0.024,d-0.03);
    /* books on this shelf */
    var x=-w/2+t+0.02, maxX=w/2-t-0.02;
    while(x<maxX-0.03){
      if(R.chance(0.12)){ x+=R.f(0.03,0.09); continue; }
      if(R.chance(0.10)){ /* horizontal stack */
        var sw=R.f(0.16,0.24), sy=y+0.012;
        for(var b2=0;b2<R.i(2,4);b2++){ var bh=R.f(0.025,0.04);
          H.box(root,'__book'+R.i(0,7),x+sw/2,sy+bh/2,0,sw,bh,0.15+R.f(-0.02,0.02)); sy+=bh; }
        x+=sw+0.02; continue; }
      var bw=R.f(0.022,0.045), bh2=R.f(0.19,0.28);
      var bk=H.box(root,'__book'+R.i(0,7),x+bw/2,y+0.012+bh2/2,0,bw,bh2,0.14+R.f(-0.02,0.02));
      if(R.chance(0.14)){ bk.rotation.z=-0.13; bk.position.x+=0.02; }  /* the leaning one */
      x+=bw+R.f(0.001,0.006); } }
  return root; },

/* ---- floor lamp ---- */
floorLamp:function(R,H,mats,style){
  var root=new T3lite.Group(), fm=frameMat(style);
  var h=R.f(1.5,1.68);
  H.lathe(root,fm,0,0,0,[[0.001,0],[0.15,0],[0.15,0.025],[0.05,0.05],[0.028,0.09]],20);
  H.cyl(root,fm,0,h/2,0,0.014,0.014,h-0.1,12);
  var shadeH=R.f(0.26,0.34), sr=R.f(0.16,0.20);
  H.lathe(root,'shade',0,h-shadeH-0.02,0,
    [[sr*0.72,0],[sr,shadeH],[sr,shadeH]],24);
  H.sph(root,'bulb',0,h-shadeH/2-0.02,0,0.035);
  return root; },

/* ---- table lamp ---- */
tableLamp:function(R,H,mats,style){
  var root=new T3lite.Group();
  var cm=R.pick(['ceramic','ceramic2','brass']);
  H.lathe(root,cm,0,0,0,[[0.001,0],[0.10,0],[0.10,0.02],[0.035,0.06],[0.02,0.20],[0.035,0.24]],20);
  H.lathe(root,'shade',0,0.26,0,[[0.10,0],[0.135,0.20],[0.135,0.20]],24);
  H.sph(root,'bulb',0,0.36,0,0.028);
  return root; },

/* ---- bed: frame, headboard, mattress, pillows ---- */
bed:function(R,H,mats,style){

/* ---------------- static material key -> hex table ----------------
 * Canonical hexes taken from the foundry's own makeMats source lines.
 * Seeded-variable keys (wood species, fabric, leather, paint, ceramic) use
 * their first-listed variant as the canonical value; furnish() results also
 * carry a colorFor() closure that resolves the ACTUAL seeded color of the
 * build when available. 'crystal' is struct-native (fixture droplets). */
var MAT_HEX={
  wood:'#c9a06b', woodDark:'#6d4a2e',
  fabric:'#d9d0bf', fabric2:'#d9d0bf', leather:'#a05a2c', paint:'#ece5d8',
  blackMetal:'#26282c', brass:'#b08d4f', chrome:'#c9d2d6',
  ceramic:'#e8e2d4', ceramic2:'#b9c4c9',
  glass:'#cfd8dc', crystal:'#e6f1f7',
  bulb:'#fff2ce', shade:'#f2ead8', flame:'#ff9a3c',
  screen:'#8fa8bd', paper:'#f4f1e8',
  leaf:'#4a7a3f', leafDark:'#33592c', soil:'#2e2118',
  steel:'#a8adb2', glassGreen:'#2a4a34', mirror:'#b8c8d0',
  mattress:'#f0ece2',
  __book:'#8a4b3c', __rugBase:'#b09a7a', __rugAcc:'#e8e0d0',
  __art:'#7a93a8', __art2:'#e8e2d4', __basket:'#a8814f'
};
function colorForKey(key){
  var hex=MAT_HEX[key]||'#808080';
  return hexRGB(hex);
}

/* ---------------- transform math (foundry renderer conventions, verbatim) ---------------- */
function eulerToQuat(rx,ry,rz){ /* exactly the foundry's nodeLocal euler branch */
  var cx=Math.cos(rx/2),sx=Math.sin(rx/2),
      cy=Math.cos(ry/2),sy=Math.sin(ry/2),
      cz=Math.cos(rz/2),sz=Math.sin(rz/2);
  var q=new Quat();
  q.x=sx*cy*cz+cx*sy*sz; q.y=cx*sy*cz-sx*cy*sz;
  q.z=cx*cy*sz+sx*sy*cz; q.w=cx*cy*cz-sx*sy*sz; q._set=true;
  return q; }
function m4composeArr(pos,quat,scale){ /* exactly the foundry's m4compose, plain array */
  var x=quat.x,y=quat.y,z=quat.z,w=quat.w,
      x2=x+x,y2=y+y,z2=z+z,
      xx=x*x2,xy=x*y2,xz=x*z2,yy=y*y2,yz=y*z2,zz=z*z2,wx=w*x2,wy=w*y2,wz=w*z2,
      sx=scale.x,sy=scale.y,sz=scale.z;
  return [
    (1-(yy+zz))*sx,(xy+wz)*sx,(xz-wy)*sx,0,
    (xy-wz)*sy,(1-(xx+zz))*sy,(yz+wx)*sy,0,
    (xz+wy)*sz,(yz-wx)*sz,(1-(xx+yy))*sz,0,
    pos.x,pos.y,pos.z,1]; }
function m4mulArr(a,b){ /* exactly the foundry's m4mul: o = a*b, column-major */
  var o=new Array(16);
  for(var c=0;c<4;c++) for(var r=0;r<4;r++){ var s=0;
    for(var k=0;k<4;k++) s+=a[k*4+r]*b[c*4+k]; o[c*4+r]=s; }
  return o; }
function nodeLocalArr(node){ /* world = parent * local, as in the foundry's drawNode */
  var q=node.quaternion._set?node.quaternion:
    eulerToQuat(node.rotation.x,node.rotation.y,node.rotation.z);
  return m4composeArr(node.position,q,node.scale); }
function placementMatrix(x,y,z,rotY){
  var co=Math.cos(rotY),si=Math.sin(rotY);
  /* RotY: x' = co*x + si*z, z' = -si*x + co*z — same as CityMesh.vertex turn */
  return [co,0,-si,0, 0,1,0,0, si,0,co,0, x,y,z,1];
}
function xformPoint(M,p){
  return [M[0]*p[0]+M[4]*p[1]+M[8]*p[2]+M[12],
          M[1]*p[0]+M[5]*p[1]+M[9]*p[2]+M[13],
          M[2]*p[0]+M[6]*p[1]+M[10]*p[2]+M[14]];
}
function xformNormal(M,n){
  /* M3 = R*S (diagonal scale). Correct normal = normalize(M3^-T * n)
   * = normalize( sum_i c_i * n_i / s_i^2 ), c_i = column i, s_i = |c_i|. */
  var c0x=M[0],c0y=M[1],c0z=M[2], c1x=M[4],c1y=M[5],c1z=M[6], c2x=M[8],c2y=M[9],c2z=M[10];
  var s0=c0x*c0x+c0y*c0y+c0z*c0z||1, s1=c1x*c1x+c1y*c1y+c1z*c1z||1, s2=c2x*c2x+c2y*c2y+c2z*c2z||1;
  var x=c0x*n[0]/s0+c1x*n[1]/s1+c2x*n[2]/s2,
      y=c0y*n[0]/s0+c1y*n[1]/s1+c2y*n[2]/s2,
      z=c0z*n[0]/s0+c1z*n[1]/s1+c2z*n[2]/s2,
      l=Math.sqrt(x*x+y*y+z*z)||1;
  return [x/l,y/l,z/l];
}

/* ---------------- flatten: Node3 tree -> world-space triangles ----------------
 * Walks the built Group, composes T*R*S per node (foundry conventions), and
 * emits each geometry's flat {p,n} triangles into world space with the
 * builder's material KEY per triangle. 'bulb'-keyed meshes additionally
 * report a light point (centroid + bounding radius of the bulb). */
function flatten(root, parentM){
  var tris=[], bulbs=[];
  function visit(node, M){
    M=m4mulArr(M,nodeLocalArr(node));
    if(node.geometry){
      var g=node.geometry, mat=node._matKey||'wood', isBulb=(mat==='bulb');
      var cx=0,cy=0,cz=0,maxR2=0,count=0;
      for(var i=0;i<g.p.length;i+=9){
        var a=xformPoint(M,[g.p[i],g.p[i+1],g.p[i+2]]),
            b=xformPoint(M,[g.p[i+3],g.p[i+4],g.p[i+5]]),
            c=xformPoint(M,[g.p[i+6],g.p[i+7],g.p[i+8]]),
            na=xformNormal(M,[g.n[i],g.n[i+1],g.n[i+2]]),
            nb=xformNormal(M,[g.n[i+3],g.n[i+4],g.n[i+5]]),
            nc=xformNormal(M,[g.n[i+6],g.n[i+7],g.n[i+8]]);
        tris.push({a:a,b:b,c:c,na:na,nb:nb,nc:nc,mat:mat});
        if(isBulb){
          var mx=(a[0]+b[0]+c[0])/3,my=(a[1]+b[1]+c[1])/3,mz=(a[2]+b[2]+c[2])/3;
          cx+=mx;cy+=my;cz+=mz;count++;
        }
      }
      if(isBulb&&count>0){
        cx/=count;cy/=count;cz/=count;
        for(var j=0;j<g.p.length;j+=9){
          var q=xformPoint(M,[g.p[j],g.p[j+1],g.p[j+2]]);
          var dx=q[0]-cx,dy=q[1]-cy,dz=q[2]-cz,d2=dx*dx+dy*dy+dz*dz;
          if(d2>maxR2)maxR2=d2;
        }
        bulbs.push({x:cx,y:cy,z:cz,r:Math.sqrt(maxR2)});
      }
    }
    for(var k=0;k<node.children.length;k++) visit(node.children[k],M);
  }
  visit(root,parentM);
  return {tris:tris,bulbs:bulbs};
}

function boundsOf(tris){
  var lo=[Infinity,Infinity,Infinity],hi=[-Infinity,-Infinity,-Infinity];
  for(var i=0;i<tris.length;i++){ var t=tris[i];

/* ---------------- wall emission ---------------- */
/* A wall emits as LAYERED boxes: frame core (0.15 full height), inner skin
 * (0.02 proud, interior side), outer skin (0.02 proud, exterior side).
 * opts: {y0} base height (default 0), {inward} interior normal {x,z}
 * (default: left of a→b). Sockets split the wall into runs around openings. */
function emitRun(mesh, wall, t0, t1, yLo, yHi, n) {
  var h = yHi - yLo;
  if (h <= 0 || t1 - t0 <= 0) return;
  function pt(t) { return { x: wall.a.x + (wall.b.x - wall.a.x) * t, z: wall.a.z + (wall.b.z - wall.a.z) * t }; }
  var p0 = pt(t0), p1 = pt(t1);
  var frameC = matColor(wall.frame, 'frame');
  var innerC = matColor(wall.inner, 'inner');
  // partitions (exterior===false) are interior on both faces
  var outerC = matColor(wall.outer, wall.exterior === false ? 'inner' : 'outer');
  var xWall = Math.abs(p1.z - p0.z) < Math.abs(p1.x - p0.x); // dominant axis
  if (xWall) {
    var xa = Math.min(p0.x, p1.x), len = Math.abs(p1.x - p0.x), zc = (p0.z + p1.z) / 2;
    var s = n.z >= 0 ? 1 : -1; // interior side sign along z
    mesh.box(xa, yLo, zc - WALL_T / 2, len, h, WALL_T, frameC);
    mesh.box(xa, yLo, s > 0 ? zc + WALL_T / 2 : zc - WALL_T / 2 - SKIN_T, len, h, SKIN_T, innerC);
    mesh.box(xa, yLo, s > 0 ? zc - WALL_T / 2 - SKIN_T : zc + WALL_T / 2, len, h, SKIN_T, outerC);
  } else {
    var za = Math.min(p0.z, p1.z), len2 = Math.abs(p1.z - p0.z), xc = (p0.x + p1.x) / 2;
    var s2 = n.x >= 0 ? 1 : -1;
    mesh.box(xc - WALL_T / 2, yLo, za, WALL_T, h, len2, frameC);
    mesh.box(s2 > 0 ? xc + WALL_T / 2 : xc - WALL_T / 2 - SKIN_T, yLo, za, SKIN_T, h, len2, innerC);
    mesh.box(s2 > 0 ? xc - WALL_T / 2 - SKIN_T : xc + WALL_T / 2, yLo, za, SKIN_T, h, len2, outerC);
  }
}

/* Cut runs around sockets. Returns array of {t0,t1,yLo,yHi} full-height runs
 * plus opening descriptors for trim/glazing. */
function cutRuns(wall) {
  var L = wallLen(wall), H = wall.h || WALL_H;
  var ops = (wall.sockets || []).map(function (s) {
    var d = socketDims(s);
    var hw = (d.w / 2) / L;
    return { t0: s.t - hw, t1: s.t + hw, kind: s.kind, w: d.w, h: d.h, sill: d.sill };
  }).sort(function (p, q) { return p.t0 - q.t0; });
  var runs = [], cur = 0;
  ops.forEach(function (o) {
    if (o.t0 > cur) runs.push({ t0: cur, t1: o.t0, yLo: 0, yHi: H });
    runs.push({ t0: o.t0, t1: o.t1, yLo: o.sill + o.h, yHi: H });       // header
    if (o.kind === 'window' && o.sill > 0)
      runs.push({ t0: o.t0, t1: o.t1, yLo: 0, yHi: o.sill });           // sill
    cur = o.t1;
  });
  if (cur < 1) runs.push({ t0: cur, t1: 1, yLo: 0, yHi: H });
  return { runs: runs, openings: ops, H: H };
}

function ptAt(wall, t) {
  return { x: wall.a.x + (wall.b.x - wall.a.x) * t, z: wall.a.z + (wall.b.z - wall.a.z) * t };
}

/* Emit trim frame + glazing for one opening. Trim boxes in frame material;
 * windows get a thin glass-pane glazing box. */
function emitOpening(mesh, wall, o, y0, n) {
  var frameC = matColor(wall.frame, 'frame');
  var c0 = ptAt(wall, o.t0), c1 = ptAt(wall, o.t1);
  var xWall = Math.abs(c1.z - c0.z) < Math.abs(c1.x - c0.x);
  var base = y0 + o.sill, top = y0 + o.sill + o.h, tw = 0.08; // trim width
  function hbox(cx, cz, w, d, yA, yB) { mesh.box(cx - w / 2, yA, cz - d / 2, w, yB - yA, d, frameC); }
  if (xWall) {
    var zc = (c0.z + c1.z) / 2, xa = Math.min(c0.x, c1.x), xb = Math.max(c0.x, c1.x);
    var td = WALL_T + 0.04;
    hbox(xa, zc, tw, td, base, top);            // jamb L
    hbox(xb, zc, tw, td, base, top);            // jamb R
    hbox((xa + xb) / 2, zc, (xb - xa) + tw, td, top, top + tw); // head
    if (o.kind === 'window')
      hbox((xa + xb) / 2, zc, (xb - xa) + tw, td, base - tw, base); // sill trim
    else
      hbox((xa + xb) / 2, zc, (xb - xa) + tw, td, base, base + 0.02); // threshold
    if (o.kind === 'window')
      mesh.box(xa, base, zc - 0.01, xb - xa, o.h, 0.02, matColor('glass-pane', 'socket'));
  } else {
    var xc = (c0.x + c1.x) / 2, za = Math.min(c0.z, c1.z), zb = Math.max(c0.z, c1.z);
    var td2 = WALL_T + 0.04;
    hbox(xc, za, td2, tw, base, top);
    hbox(xc, zb, td2, tw, base, top);
    hbox(xc, (za + zb) / 2, td2, (zb - za) + tw, top, top + tw);
    if (o.kind === 'window')
      hbox(xc, (za + zb) / 2, td2, (zb - za) + tw, base - tw, base);
    else
      hbox(xc, (za + zb) / 2, td2, (zb - za) + tw, base, base + 0.02);
    if (o.kind === 'window')
      mesh.box(xc - 0.01, base, za, 0.02, o.h, zb - za, matColor('glass-pane', 'socket'));
  }
}

/* emitWall(mesh, wall, opts) — full layered wall with sockets.
 * v2: non-axis walls take the true diagonal path (obox); axis walls keep the
 * v1 mesh.box path bit-identical. */
function emitWall(mesh, wall, opts) {
  opts = opts || {};
  var y0 = wall.y0 || opts.y0 || 0;
  if (!isAxisAligned(wall)) { emitDiagWall(mesh, wall, y0); return; }
  var n = opts.inward || leftNormal(wall);
  var cut = cutRuns(wall);
  cut.runs.forEach(function (r) { emitRun(mesh, wall, r.t0, r.t1, y0 + r.yLo, y0 + r.yHi, n); });
  cut.openings.forEach(function (o) { emitOpening(mesh, wall, o, y0, n); });
}

/* ---------------- floor slabs ---------------- */
/* Slab per room: rect rooms 0.12 thick box; polygon rooms fan-triangulated
 * (convex; documented). Top at room floor level (y0). */
function emitSlab(mesh, room) {
  var y0 = room.y0 || 0;
  if (room.polygon && room.polygon.length >= 3) {
    var col = matColor(room.floor, 'floor');
    var p0 = room.polygon[0];
    for (var i = 1; i < room.polygon.length - 1; i++) {
      var p1 = room.polygon[i], p2 = room.polygon[i + 1];
      // top face + bottom face + skirt via two tris each (fan)
      tri(mesh, [p0.x, y0, p0.z], [p1.x, y0, p1.z], [p2.x, y0, p2.z], col);
      tri(mesh, [p0.x, y0 - SLAB_T, p0.z], [p2.x, y0 - SLAB_T, p2.z], [p1.x, y0 - SLAB_T, p1.z], col);
    }
    if (mesh.solids) {
      var bb = aabbOf(room.polygon.map(function (p) { return [p.x, y0 - SLAB_T, p.z]; }));
      pushAABB(mesh, bb.lo, [bb.hi[0], y0, bb.hi[2]], col);
    }
    return;
  }
  var r = room.rect;
  mesh.box(r.x, y0 - SLAB_T, r.z, r.w, SLAB_T, r.d, matColor(room.floor, 'floor'));
}

/* ---------------- roofs v1 ---------------- */
/* Helper: push one AABB record directly (collision mode for non-box geometry). */
function pushAABB(mesh, lo, hi, c) {
  mesh.solids.push({ lo: lo, hi: hi, c: c, mat: mesh.material, kind: 0, anchor: 0 });
}
/* Sloped quad via explicit corners (triangle mode). In collision mode the
 * caller pushes a manual AABB instead; face() writes only to mesh.data. */
function quad(mesh, a, b, c, d, col) {
  mesh.face(a, b, c, d, col, null);
}
function tri(mesh, a, b, c, col) {
  var n = null, base = mesh.data.length / 23;
  mesh.vertex(a, [0, 1, 0], col, [0, 0]);
  mesh.vertex(b, [0, 1, 0], col, [1, 0]);
  mesh.vertex(c, [0, 1, 0], col, [0, 1]);
  mesh.indices.push(base, base + 1, base + 2);
}
function aabbOf(points) {
  var lo = [Infinity, Infinity, Infinity], hi = [-Infinity, -Infinity, -Infinity];
  points.forEach(function (p) {
    for (var i = 0; i < 3; i++) { lo[i] = Math.min(lo[i], p[i]); hi[i] = Math.max(hi[i], p[i]); }
  });
  return { lo: lo, hi: hi };
}

function lerp3(a, b, f) { return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f]; }

 * triangle face). Emits N thin axis-aligned boxes staircasing up the slope —
 * IDENTICAL box() calls in triangle and collision mode, so dual-mode parity
 * holds exactly. In triangle mode a smooth quad face is ALSO emitted for looks
 * (render-only: face() never touches mesh.solids, never calls box()). */
function emitSlope(mesh, A, B, C, D, color) {
  var N = 6, th = 0.12, collision = !!mesh.solids;
  for (var i = 0; i < N; i++) {
    var f0 = i / N, f1 = (i + 1) / N;
    var pA0 = lerp3(A, D, f0), pB0 = lerp3(B, C, f0);
    var pA1 = lerp3(A, D, f1), pB1 = lerp3(B, C, f1);
    var xs = [pA0[0], pB0[0], pA1[0], pB1[0]], zs = [pA0[2], pB0[2], pA1[2], pB1[2]];
    var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
    var z0 = Math.min.apply(null, zs), z1 = Math.max.apply(null, zs);
    if (x1 - x0 < 0.05) { var cx = (x0 + x1) / 2; x0 = cx - 0.025; x1 = cx + 0.025; }
    if (z1 - z0 < 0.05) { var cz = (z0 + z1) / 2; z0 = cz - 0.025; z1 = cz + 0.025; }
    var yLo = Math.min(pA0[1], pB0[1]) - th, yHi = Math.max(pA1[1], pB1[1]);
    mesh.box(x0, yLo, z0, x1 - x0, yHi - yLo, z1 - z0, color);

function emitRoof(mesh, building) {
  var fp = building.footprint, top = building.stories * WALL_H;
  var x0 = -fp.w / 2, x1 = fp.w / 2, z0 = -fp.d / 2, z1 = fp.d / 2;
  var oh = 0.3, col = matColor(building.roof.mat, 'roof');
  var collision = !!mesh.solids;
  var type = building.roof.type;

    mesh.box(x0 - oh, top, z0 - oh, fp.w + 2 * oh, 0.15, fp.d + 2 * oh, col);
    var ph = 0.4, pt = 0.12, py = top + 0.15; // parapet
    mesh.box(x0 - oh, py, z0 - oh, fp.w + 2 * oh, ph, pt, col);
    mesh.box(x0 - oh, py, z1 + oh - pt, fp.w + 2 * oh, ph, pt, col);
    mesh.box(x0 - oh, py, z0 - oh, pt, ph, fp.d + 2 * oh, col);
    mesh.box(x1 + oh - pt, py, z0 - oh, pt, ph, fp.d + 2 * oh, col);
    if (themeOf(building.theme).vigas) { // adobe vigas: wood beam row, both eaves
      var vgC = matColor('wood-frame', 'frame');
      for (var vx = x0 + 0.4; vx < x1 - 0.2; vx += 0.6) {
        mesh.box(vx, top - 0.03, z0 - oh - 0.2, 0.12, 0.14, 0.55, vgC);
        mesh.box(vx, top - 0.03, z1 + oh - 0.35, 0.12, 0.14, 0.55, vgC);
      }
    }
    return;
  }

    // Ridge along longest axis, 30° pitch. Sloped panels go through emitSlope
    // (stepped boxes in BOTH modes + a smooth face in triangle mode only).
    // Gable end triangles are true triangles via vertex()+indices — render-only
    // in collision mode (walls carry the collision); they never call box(),
    // so parity is unaffected.
    var alongX = fp.w >= fp.d;
    var half = (alongX ? fp.d : fp.w) / 2 + oh;
    var rise = Math.tan(Math.PI / 6) * half; // 30°
    if (alongX) {
      var zc = 0;
      emitSlope(mesh, [x0 - oh, top, z0 - oh], [x1 + oh, top, z0 - oh],
                      [x1 + oh, top + rise, zc], [x0 - oh, top + rise, zc], col);
      emitSlope(mesh, [x1 + oh, top, z1 + oh], [x0 - oh, top, z1 + oh],
                      [x0 - oh, top + rise, zc], [x1 + oh, top + rise, zc], col);
      if (!collision) {
        tri(mesh, [x0, top, z0], [x0, top, z1], [x0, top + rise, zc], col);
        tri(mesh, [x1, top, z1], [x1, top, z0], [x1, top + rise, zc], col);
      }
    } else {
      var xc = 0;
      emitSlope(mesh, [x0 - oh, top, z0 - oh], [x0 - oh, top, z1 + oh],
                      [xc, top + rise, z1 + oh], [xc, top + rise, z0 - oh], col);
      emitSlope(mesh, [x1 + oh, top, z1 + oh], [x1 + oh, top, z0 - oh],
                      [xc, top + rise, z0 - oh], [xc, top + rise, z1 + oh], col);
      if (!collision) {
        tri(mesh, [x0, top, z0], [x1, top, z0], [xc, top + rise, z0], col);
        tri(mesh, [x1, top, z1], [x0, top, z1], [xc, top + rise, z1], col);
      }
    }
    return;
  }
  if (type === 'hip') {
    // 28° pitch, all sides slope. Ridge centered along longest axis.
    // Each face (2 trapezoids + 2 triangles, C==D for triangles) via
    // emitSlope — stepped boxes in both modes, dual-mode clean.
    var inset = Math.min(fp.w, fp.d) / 2 + oh;
    var rise2 = Math.tan(28 * Math.PI / 180) * inset;
    var alongX2 = fp.w >= fp.d;
    if (alongX2) {
      var r0 = x0 + inset, r1 = x1 - inset, zc2 = 0;
      emitSlope(mesh, [x0 - oh, top, z0 - oh], [x1 + oh, top, z0 - oh],
                      [r1, top + rise2, zc2], [r0, top + rise2, zc2], col);
      emitSlope(mesh, [x1 + oh, top, z1 + oh], [x0 - oh, top, z1 + oh],
                      [r0, top + rise2, zc2], [r1, top + rise2, zc2], col);
      emitSlope(mesh, [x0 - oh, top, z1 + oh], [x0 - oh, top, z0 - oh],
                      [r0, top + rise2, zc2], [r0, top + rise2, zc2], col);
      emitSlope(mesh, [x1 + oh, top, z0 - oh], [x1 + oh, top, z1 + oh],
                      [r1, top + rise2, zc2], [r1, top + rise2, zc2], col);
    } else {
      var s0 = z0 + inset, s1 = z1 - inset, xc2 = 0;
      emitSlope(mesh, [x0 - oh, top, z0 - oh], [x0 - oh, top, z1 + oh],
                      [xc2, top + rise2, s1], [xc2, top + rise2, s0], col);
      emitSlope(mesh, [x1 + oh, top, z1 + oh], [x1 + oh, top, z0 - oh],
                      [xc2, top + rise2, s0], [xc2, top + rise2, s1], col);
      emitSlope(mesh, [x1 + oh, top, z0 - oh], [x0 - oh, top, z0 - oh],
                      [xc2, top + rise2, s0], [xc2, top + rise2, s0], col);
      emitSlope(mesh, [x0 - oh, top, z1 + oh], [x1 + oh, top, z1 + oh],
                      [xc2, top + rise2, s1], [xc2, top + rise2, s1], col);
    }
    return;
  }
}

/* ---------------- room assembly ---------------- */
/* roomsFromWalls(walls) — detect axis-aligned rectangular rooms: candidate
 * rects from wall coordinate lines; a rect is a room when wall segments cover
 * each of its 4 edges within 0.01. Largest-first, no interior overlap.
 * Type heuristic (documented): aspect > 2.5 → hall; area < 6 → bath;
 * area < 14 → bed; else living. */
function roomsFromWalls(walls) {

  if (walls.some(function (w) { return !isAxisAligned(w); })) return roomsFromWallsPoly(walls);

    if (isXWall(w)) { hWalls.push({ c: w.a.z, a: Math.min(w.a.x, w.b.x), b: Math.max(w.a.x, w.b.x), i: i }); xs[w.a.x] = 1; xs[w.b.x] = 1; }
    else if (isZWall(w)) { vWalls.push({ c: w.a.x, a: Math.min(w.a.z, w.b.z), b: Math.max(w.a.z, w.b.z), i: i }); zs[w.a.z] = 1; zs[w.b.z] = 1; }
  });
  var X = Object.keys(xs).map(Number).sort(function (a, b) { return a - b; });
  var Z = Object.keys(zs).map(Number).sort(function (a, b) { return a - b; });

    var runs = segs.filter(function (s) { return Math.abs(s.c - at) <= PERIM_TOL; })
      .map(function (s) { return [Math.max(s.a, lo), Math.min(s.b, hi)]; })
      .filter(function (r) { return r[1] > r[0]; })
      .sort(function (p, q) { return p[0] - q[0]; });

      var x0 = X[xi], x1 = X[xj], z0 = Z[zi], z1 = Z[zj];
      if (x1 - x0 < 1 || z1 - z0 < 1) continue;
      if (!coversEdge(hWalls, z0, x0, x1)) continue;
      if (!coversEdge(hWalls, z1, x0, x1)) continue;

      // footprint shell when partitions subdivide it): midpoint-inside test

        var mx = (w.a.x + w.b.x) / 2, mz = (w.a.z + w.b.z) / 2;

    var overlap = rooms.some(function (o) {
      return r.x < o.rect.x + o.rect.w - 1e-9 && o.rect.x < r.x + r.w - 1e-9 &&

    });

    var type = aspect > 2.5 ? 'hall' : area < 6 ? 'bath' : area < 14 ? 'bed' : 'living';
    var wallIds = [];

/* Split walls at T-junctions: any other wall's endpoint lying on this wall's

    walls.forEach(function (v, vi) {
      if (vi === wi) return;
      [v.a, v.b].forEach(function (p) {
        var t = pointOnWallT(w, p);
        if (t > 0) ts.push(t);
      });
    });
    ts.sort(function (a, b) { return a - b; });
    var uniq = ts.filter(function (t, i) { return i === 0 || t - ts[i - 1] > 1e-6; });
    for (var i = 0; i < uniq.length - 1; i++) {
      var sub = {
        a: ptAt(w, uniq[i]), b: ptAt(w, uniq[i + 1]),
        h: w.h, y0: w.y0, frame: w.frame, inner: w.inner, outer: w.outer,
        sockets: [], rooms: (w.rooms || []).slice(), exterior: w.exterior
      };
      out.push(sub);
    }
  });
  // dedupe by endpoint pair: coincident segments are shared partitions
  var map = {};
  out.forEach(function (w) {
    var k = wkey(w.a, w.b, w.y0);
    if (!map[k]) { map[k] = w; return; }
    var keep = map[k];
    w.rooms.forEach(function (ri) { if (keep.rooms.indexOf(ri) < 0) keep.rooms.push(ri); });
    keep.inner = 'drywall'; keep.outer = 'drywall'; keep.exterior = false;

  return Object.keys(map).map(function (k) { return map[k]; });
}

/* ---------------- procedural generator ---------------- */
/* makeBuilding(seed, theme, footprint{w,d}, stories) -> Building.
 * Robust for footprints 6×6..14×10, stories 1–2. ALL from the seeded RNG.
 * Layout: split footprint along the long axis into 2–4 rooms (each ≥2.5m);
 * if the short axis ≥ 7, carve a 1.5m hall strip first. Walls wound CCW per
 * room (interior = left of a→b), shared partitions deduped by endpoint pair
 * and emitted once (both faces interior). Windows on exterior walls ~2.5m
 * apart; one exterior door + one door per partition. */
function makeBuilding(seed, theme, footprint, stories) {
  var th = themeOf(theme);
  var rng = RNG(seed + '|' + theme);
  stories = stories === 2 ? 2 : 1;
  var W = Math.max(6, snap(footprint.w)), D = Math.max(6, snap(footprint.d));
  var x0 = -W / 2, z0 = -D / 2;

  // --- room rects ---
  var rects = []; // {x,z,w,d,type}
  var hallDepth = 1.5;
  var deep = Math.min(W, D) >= 7;
  var field = { x: x0, z: z0, w: W, d: D }; // area rooms fill
  var hallRect = null;
  if (deep) {
    // carve hall along the -z side of the footprint
    hallRect = { x: x0, z: z0, w: W, d: hallDepth, type: 'hall' };
    field = { x: x0, z: z0 + hallDepth, w: W, d: D - hallDepth };
    rects.push(hallRect);
  }
  var longAxis = field.w >= field.d ? 'x' : 'z';
  var longLen = longAxis === 'x' ? field.w : field.d;
  var maxN = Math.max(2, Math.floor(longLen / 3));
  var n = Math.min(2 + rng.i(0, 2), maxN); // 2..4 rooms
  // split points, each room ≥ 2.5m, snapped
  var cuts = [0];
  for (var c = 1; c < n; c++) {
    var lo = cuts[c - 1] + 2.5, hi = longLen - (n - c) * 2.5;
    cuts.push(snap(lo + rng.f() * Math.max(0, hi - lo)));
  }
  cuts.push(longLen);
  for (var r = 0; r < n; r++) {
    var a = cuts[r], b = cuts[r + 1];
    var rect = longAxis === 'x'
      ? { x: snap(field.x + a), z: field.z, w: snap(b - a), d: field.d }
      : { x: field.x, z: snap(field.z + a), w: field.w, d: snap(b - a) };
    rects.push(rect);
  }
  // type assignment: largest→living, smallest→bath, second-largest→kitchen, rest→bed
  var order = rects.filter(function (rc) { return rc !== hallRect; })
    .sort(function (p, q) { return (q.w * q.d) - (p.w * p.d); });
  order.forEach(function (rc, i) {
    rc.type = i === 0 ? 'living' : i === order.length - 1 ? 'bath' : (i === 1 && order.length >= 4 ? 'kitchen' : 'bed');
  });

  // --- walls: CCW per room (interior = left of a→b), whole edges first ---
  var whole = [];
  var innerMats = ['drywall', 'drywall', 'wallpaper', 'plaster'];
  rects.forEach(function (rc, ri) {
    var inner = rc.type === 'bath' || rc.type === 'kitchen' ? 'plaster' : rng.pick(innerMats);
    for (var s = 0; s < stories; s++) {
      var y0 = s * WALL_H;
      var edges = [
        [{ x: rc.x, z: rc.z }, { x: rc.x + rc.w, z: rc.z }],
        [{ x: rc.x + rc.w, z: rc.z }, { x: rc.x + rc.w, z: rc.z + rc.d }],
        [{ x: rc.x + rc.w, z: rc.z + rc.d }, { x: rc.x, z: rc.z + rc.d }],
        [{ x: rc.x, z: rc.z + rc.d }, { x: rc.x, z: rc.z }]
      ];
      edges.forEach(function (e) {
        whole.push({
          a: { x: snap(e[0].x), z: snap(e[0].z) }, b: { x: snap(e[1].x), z: snap(e[1].z) },
          h: WALL_H, y0: y0, frame: th.frame, inner: inner, outer: th.outer,
          sockets: [], rooms: [ri], exterior: true
        });
      });
    }
  });
  // split at T-junctions, then dedupe coincident segments into partitions
  var walls = splitWalls(whole);

  // --- sockets ---
  function addSocket(wall, t, kind, style) {
    var d = socketDims({ kind: kind, style: style });
    var L = wallLen(wall);
    var half = (d.w / 2 + 0.3) / L; // keep 0.3m clear of corners/edges
    if (t - half < 0.02 || t + half > 0.98) return false;
    var clash = wall.sockets.some(function (s) {
      var d2 = socketDims(s);
      return Math.abs(s.t - t) * L < (d.w + d2.w) / 2 + 0.4;
    });
    if (clash) return false;
    wall.sockets.push({ t: t, kind: kind, style: style });
    wall.sockets.sort(function (p, q) { return p.t - q.t; });
    return true;
  }
  // exterior door: front wall (z == z0) of ground story, longest one
  var frontWalls = walls.filter(function (w) {
    return w.y0 === 0 && w.exterior && isXWall(w) && Math.abs(w.a.z - z0) < 1e-9;
  }).sort(function (a, b) { return wallLen(b) - wallLen(a); });
  if (frontWalls.length) addSocket(frontWalls[0], 0.5, 'door', rng.pick(['panel', 'panel', 'double']));
  // interior doors: one per partition wall (ground + upper)
  walls.forEach(function (w) {
    if (!w.exterior && wallLen(w) >= 2.0) addSocket(w, 0.5, 'door', 'panel');
  });
  // windows on exterior walls every ~2.5m
  walls.forEach(function (w) {
    if (!w.exterior) return;
    var L = wallLen(w);
    var nWin = Math.max(1, Math.round(L / 2.5));
    var style = rng.pick(th.win);
    var dw = socketDims({ kind: 'window', style: style }).w;
    while (nWin > 0 && (L - 1.2) / nWin < dw + 0.4) nWin--;
    for (var i = 0; i < nWin; i++) addSocket(w, (i + 0.5) / nWin, 'window', style);
  });

  // --- rooms ---
  var rooms = rects.map(function (rc, i) {
    var fl = ROOM_TYPES[rc.type].floor;
    if (fl === 'hardwood' && rng.chance(0.35)) fl = 'carpet';
    return {
      id: 'room-' + i, type: rc.type,
      rect: { x: rc.x, z: rc.z, w: rc.w, d: rc.d },
      floor: fl, wallIds: []
    };
  });
  // rooms for upper story (same plan)
  if (stories === 2) {
    var base = rooms.length;
    rects.forEach(function (rc, i) {
      rooms.push({
        id: 'room-' + (base + i), type: rc.type,
        rect: { x: rc.x, z: rc.z, w: rc.w, d: rc.d }, y0: WALL_H,
        floor: rooms[i].floor, wallIds: []
      });
    });
  }
  // link wallIds by index
  var wallIndex = {};
  walls.forEach(function (w, i) { wallIndex[wkey(w.a, w.b, w.y0)] = i; });
  walls.forEach(function (w, i) {
    (w.rooms || []).forEach(function (ri) {
      var room = rooms[ri + (w.y0 > 0 ? rects.length : 0)];
      if (room && room.wallIds.indexOf(i) < 0) room.wallIds.push(i);
    });
  });

  // --- roof ---
  var roofType = (th.roof && th.roof.type) || 'gable';
  var roofMat = (th.roof && th.roof.mat) || 'shingle';
  var building = {
    seed: seed, theme: theme in THEMES ? theme : 'craftsman',
    frame: th.frame, rooms: rooms, walls: walls,
    roof: { type: roofType, mat: roofMat }, stories: stories,
    footprint: { w: W, d: D }
  };
  return building;
}

/* ---------------- emission entry points ---------------- */
function emitInto(mesh, building) {
  if (!CityMeshCtor) throw new Error('STRUCT: CityMesh not loaded (need mesh-builder.js first, or node require).');
  var walls = miterJoints(resolveJunctions(building.walls || [])); // v2: mitered joints
  walls.forEach(function (w) { emitWall(mesh, w); });
  (building.rooms || []).forEach(function (r) { emitSlab(mesh, r); });
  emitRoof(mesh, building);
  return mesh;
}
/* emit(mesh, building) — triangles into mesh.data/indices. */
function emit(mesh, building) {
  mesh.solids = undefined; // force triangle mode
  return emitInto(mesh, building);
}
/* emitCollision(building) — same emission, AABBs. Returns mesh.solids. */
function emitCollision(building) {
  if (!CityMeshCtor) throw new Error('STRUCT: CityMesh not loaded (need mesh-builder.js first, or node require).');
  var mesh = new CityMeshCtor();
  mesh.solids = [];
  emitInto(mesh, building);
  return mesh.solids;
}

/* ---------------- validation (never throws) ---------------- */
function validate(building) {
  var errs = [];
  function E(s) { errs.push(s); }
  if (!building || typeof building !== 'object') return ['building is not an object'];
  var walls = building.walls instanceof Array ? building.walls : [];
  var rooms = building.rooms instanceof Array ? building.rooms : [];
  if (!(building.walls instanceof Array)) E('walls missing/not an array');
  if (!(building.rooms instanceof Array)) E('rooms missing/not an array');
  var themes = Object.keys(THEMES);
  if (themes.indexOf(building.theme) < 0) E('unknown theme: ' + building.theme);
  if (building.stories !== 1 && building.stories !== 2) E('stories must be 1 or 2, got ' + building.stories);
  var rt = building.roof || {};
  if (['flat', 'gable', 'hip'].indexOf(rt.type) < 0) E('unknown roof type: ' + rt.type);
  if (!MAT_BY_ID[rt.mat]) E('unknown roof material: ' + rt.mat);
  else if (!(MAT_BY_ID[rt.mat].kind === 'roof' || MAT_BY_ID[rt.mat].kind === 'both')) E('roof material wrong kind: ' + rt.mat);
  walls.forEach(function (w, i) {
    var tag = 'wall[' + i + ']';
    ['a', 'b'].forEach(function (e) {
      if (!w[e] || typeof w[e].x !== 'number' || typeof w[e].z !== 'number') E(tag + '.' + e + ' not a point');
    });
    if (w.a && w.b) {
      var L = wallLen(w);
      if (!(L >= MIN_WALL_LEN)) E(tag + ' length ' + L.toFixed(2) + ' < 1.0');
      [w.a, w.b].forEach(function (p, k) {
        ['x', 'z'].forEach(function (ax) {
          if (typeof p[ax] !== 'number' || !isFinite(p[ax])) E(tag + ' endpoint ' + (k ? 'b' : 'a') + '.' + ax + ' not a number');
        });
      });
      // v2: diagonals are first-class (true obox emission + sockets). No axis requirement.
    }
    if (!(w.h > 0)) E(tag + ' bad height ' + w.h);
    if (!MAT_BY_ID[w.frame]) E(tag + ' unknown frame material ' + w.frame);
    if (mat(w.inner, 'inner').id !== w.inner) E(tag + ' inner material falls back: ' + w.inner);
    // partitions (exterior===false) are interior on both faces: outer follows inner rule
    var oRole = w.exterior === false ? 'inner' : 'outer';
    if (mat(w.outer, oRole).id !== w.outer) E(tag + ' outer material falls back: ' + w.outer);
    (w.sockets || []).forEach(function (s, si) {
      var st = tag + '.sockets[' + si + ']';
      if (typeof s.t !== 'number' || s.t < 0 || s.t > 1) E(st + ' t out of range');
      if (s.kind !== 'window' && s.kind !== 'door') E(st + ' bad kind ' + s.kind);
      var table = s.kind === 'door' ? DOOR_STYLES : WINDOW_STYLES;
      if (!table[s.style]) E(st + ' unknown style ' + s.style);
      else if (w.a && w.b) {
        var d = table[s.style], L2 = wallLen(w);
        if (d.w > L2 - 0.6) E(st + ' opening wider than wall');
        if (s.t * L2 < d.w / 2 + 0.3 || (1 - s.t) * L2 < d.w / 2 + 0.3) E(st + ' opening too close to wall end');
        if (d.sill + d.h > (w.h || WALL_H)) E(st + ' opening taller than wall');
      }
    });
  });
  (rooms).forEach(function (r, i) {
    var tag = 'room[' + i + ']';
    if (r.polygon) { // v2 polygon rooms
      if (!(r.polygon.length >= 3)) E(tag + ' bad polygon');
      else if (!(polyArea(r.polygon) > 0.5)) E(tag + ' degenerate polygon');
    } else {
      var rc = r.rect || {};
      if (!(rc.w > 0 && rc.d > 0)) E(tag + ' bad rect');
    }
    if (!ROOM_TYPES[r.type]) E(tag + ' unknown type ' + r.type);
    if (!MAT_BY_ID[r.floor]) E(tag + ' unknown floor material ' + r.floor);
  });
  // v2: foldback joint warning (φ < 15° at a shared endpoint)
  (function () {
    var pts = [];
    walls.forEach(function (w, i) {
      if (!w.a || !w.b) return;
      pts.push({ x: w.a.x, z: w.a.z, wi: i, end: 0 });
      pts.push({ x: w.b.x, z: w.b.z, wi: i, end: 1 });
    });
    var t2 = JUNCTION_TOL * JUNCTION_TOL;
    for (var i = 0; i < pts.length; i++) for (var j = i + 1; j < pts.length; j++) {
      var A = pts[i], B = pts[j];
      if (A.wi === B.wi || dist2(A.x, A.z, B.x, B.z) > t2) continue;
      var wa = walls[A.wi], wb = walls[B.wi];
      if ((wa.y0 || 0) !== (wb.y0 || 0)) continue; // different stories stack — not a joint
      var oa = A.end ? wa.a : wa.b, ob = B.end ? wb.a : wb.b;
      var d1x = oa.x - A.x, d1z = oa.z - A.z, d2x = ob.x - B.x, d2z = ob.z - B.z;

        E('foldback joint <15° at wall[' + A.wi + ']/wall[' + B.wi + ']');
    }
  })();
  return errs;
}

/* ================= STRUCT v2 additions =================
 * Free-angle walls, miter joints, true diagonal emission, polygon rooms,
 * volume takeoff, theme registry (above). Additive: v1 paths untouched. */

/* ---------------- v2 snapping laws ---------------- */
var SNAP_ANGLE_DEG = 15;   // angle snap increment (law)
var SNAP_RADIUS = 0.25;    // endpoint snap radius (law)
function snapAngle(dx, dz) {
  var l = Math.hypot(dx, dz);
  if (l < 1e-9) return { dx: dx, dz: dz };
  var deg = Math.atan2(dz, dx) * 180 / Math.PI;
  var s = Math.round(deg / SNAP_ANGLE_DEG) * SNAP_ANGLE_DEG;
  var r = s * Math.PI / 180;
  return { dx: Math.cos(r) * l, dz: Math.sin(r) * l };
}
function snapLen(L) { return Math.round(L * 10) / 10; } // 0.1m length snap
function snapPoint(p, walls) {
  var best = null, best2 = SNAP_RADIUS * SNAP_RADIUS, i, e, d2;
  for (i = 0; i < walls.length; i++) {
    var w = walls[i];
    for (var k = 0; k < 2; k++) {
      e = k ? w.b : w.a;
      d2 = dist2(p.x, p.z, e.x, e.z);
      if (d2 < best2) { best2 = d2; best = e; }
    }
  }
  return best ? { x: best.x, z: best.z } : { x: p.x, z: p.z };
}

/* ---------------- miter joints ----------------
 * At a cluster of exactly 2 wall ends, extend each wall past the shared
 * point by e = (WALL_T/2)*tan((π-φ)/2), φ = angle between away-directions.
 * Fills the outer wedge gap (v1 left a 0.075² notch at every 90° corner).
 * Collinear (φ→180°) → e→0, no-op. Foldback (φ<15°) → skipped + validate warns.
 * 3+ ends at a cluster (T-junctions post-split): left as butt/overlap. */
function miterJoints(walls) {
  var n = walls.length, i, j;
  var parent = [];
  for (i = 0; i < n * 2; i++) parent[i] = i;
  function find(x) { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; }
  function pt(i2) { return i2 % 2 ? walls[(i2 / 2) | 0].b : walls[(i2 / 2) | 0].a; }
  var tol2 = JUNCTION_TOL * JUNCTION_TOL;
  for (i = 0; i < n * 2; i++) for (j = i + 1; j < n * 2; j++) {
    var a = pt(i), b = pt(j);
    if (dist2(a.x, a.z, b.x, b.z) <= tol2) parent[find(i)] = find(j);
  }
  var clusters = {};
  for (i = 0; i < n * 2; i++) {
    var r = find(i);
    (clusters[r] || (clusters[r] = [])).push(i);
  }
  var out = walls.map(function (w) {
    return { a: { x: w.a.x, z: w.a.z }, b: { x: w.b.x, z: w.b.z },
             h: w.h, y0: w.y0, frame: w.frame, inner: w.inner, outer: w.outer,
             sockets: w.sockets, rooms: w.rooms, exterior: w.exterior };
  });
  Object.keys(clusters).forEach(function (r) {
    var ends = clusters[r];
    if (ends.length !== 2) return;
    var wi = [(ends[0] / 2) | 0, (ends[1] / 2) | 0];
    if (wi[0] === wi[1]) return; // same wall, degenerate
    var P = pt(ends[0]);
    function away(k) { // unit direction from P toward the wall's other end
      var w = walls[wi[k]], other = (ends[k] % 2) ? w.a : w.b;
      var dx = other.x - P.x, dz = other.z - P.z, l = Math.hypot(dx, dz);
      return l < 1e-9 ? null : { x: dx / l, z: dz / l };
    }
    var d1 = away(0), d2 = away(1);
    if (!d1 || !d2) return;
    var cross = d1.x * d2.z - d1.z * d2.x, dot = d1.x * d2.x + d1.z * d2.z;
    var phi = Math.atan2(Math.abs(cross), dot); // 0..π

    var e = (WALL_T / 2) * Math.tan((Math.PI - phi) / 2);
    e = Math.min(e, WALL_T * 2);
    for (var k = 0; k < 2; k++) {
      var w = out[wi[k]], d = k ? d2 : d1;
      var np = { x: P.x - d.x * e, z: P.z - d.z * e };
      // never let a miter shrink a wall below 0.5m
      var other2 = (ends[k] % 2) ? w.a : w.b;
      if (Math.hypot(np.x - other2.x, np.z - other2.z) < 0.5) return;
      if (ends[k] % 2) w.b = np; else w.a = np;
    }
  });
  return out;
}

/* ---------------- oriented box (true diagonal emission) ----------------
 * obox: center (cx,cz), vertical yLo..yHi, unit axis (ux,uz),
 * half-extents hu (along axis), hd (across). Triangle mode: 6 faces with
 * explicit outward normals (face() orients winding to match). Collision
 * mode: exactly one AABB — dual-mode parity holds per box. */
function obox(mesh, cx, cz, yLo, yHi, ux, uz, hu, hd, col) {
  if (mesh.solids) {
    var ex = Math.abs(ux) * hu + Math.abs(uz) * hd;
    var ez = Math.abs(uz) * hu + Math.abs(ux) * hd;
    pushAABB(mesh, [cx - ex, yLo, cz - ez], [cx + ex, yHi, cz + ez], col);
    return;
  }
  var nx = -uz, nz = ux;
  function C(su, sv, y) { return [cx + ux * hu * su + nx * hd * sv, y, cz + uz * hu * su + nz * hd * sv]; }
  mesh.face(C(-1, -1, yHi), C(1, -1, yHi), C(1, 1, yHi), C(-1, 1, yHi), col, [0, 1, 0]);
  mesh.face(C(-1, 1, yLo), C(1, 1, yLo), C(1, -1, yLo), C(-1, -1, yLo), col, [0, -1, 0]);
  mesh.face(C(-1, 1, yLo), C(-1, 1, yHi), C(1, 1, yHi), C(1, 1, yLo), col, [nx, 0, nz]);
  mesh.face(C(1, -1, yLo), C(1, -1, yHi), C(-1, -1, yHi), C(-1, -1, yLo), col, [-nx, 0, -nz]);
  mesh.face(C(-1, -1, yLo), C(-1, -1, yHi), C(-1, 1, yHi), C(-1, 1, yLo), col, [-ux, 0, -uz]);
  mesh.face(C(1, 1, yLo), C(1, 1, yHi), C(1, -1, yHi), C(1, -1, yLo), col, [ux, 0, uz]);
}
/* Diagonal wall run: layered oboxes along the true wall direction. */
function emitDiagRun(mesh, wall, t0, t1, yLo, yHi, n) {
  var p0 = ptAt(wall, t0), p1 = ptAt(wall, t1);
  var dx = p1.x - p0.x, dz = p1.z - p0.z, L = Math.hypot(dx, dz);
  if (L < 1e-6 || yHi - yLo <= 0) return;
  var ux = dx / L, uz = dz / L;
  var cx = (p0.x + p1.x) / 2, cz = (p0.z + p1.z) / 2;
  var frameC = matColor(wall.frame, 'frame');
  var innerC = matColor(wall.inner, 'inner');
  var outerC = matColor(wall.outer, wall.exterior === false ? 'inner' : 'outer');
  // interior side sign: project n onto left normal
  var s = (n.x * -uz + n.z * ux) >= 0 ? 1 : -1;
  obox(mesh, cx, cz, yLo, yHi, ux, uz, L / 2, WALL_T / 2, frameC);
  obox(mesh, cx + s * -uz * (WALL_T / 2 + SKIN_T / 2), cz + s * ux * (WALL_T / 2 + SKIN_T / 2),
       yLo, yHi, ux, uz, L / 2, SKIN_T / 2, innerC);
  obox(mesh, cx - s * -uz * (WALL_T / 2 + SKIN_T / 2), cz - s * ux * (WALL_T / 2 + SKIN_T / 2),
       yLo, yHi, ux, uz, L / 2, SKIN_T / 2, outerC);
}
/* Diagonal opening: oriented trim + glazing along the wall direction. */
function emitDiagOpening(mesh, wall, o, y0, n) {
