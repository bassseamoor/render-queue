<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0614">
<title>Moor Ultra</title>
<style>
  html,body{ margin:0; padding:0; background:#0a0614; color:#e8e4f5;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,sans-serif;
    min-height:100%; }
  .mu-bar{ position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:10px;
    padding:10px 14px; background:rgba(14,8,26,0.82);
    -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(150,210,255,0.16); }
  .mu-brand{ font-weight:800; letter-spacing:.14em; font-size:15px;
    background:linear-gradient(90deg,#c9a7ff,#7fd4ff,#ffc98a);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .mu-sub{ font-size:11px; color:#8b7fa8; letter-spacing:.06em; }
  .mu-back{ margin-left:auto; color:#c9a7ff; text-decoration:none; font-size:13px;
    border:1px solid rgba(150,210,255,0.25); border-radius:10px; padding:7px 12px; }
  #mu-app{ min-height:calc(100vh - 49px); }
</style>
</head>
<body>
<div class="mu-bar">
  <span class="mu-brand">MOOR ULTRA</span>
  <span class="mu-sub">the next OS · right outside of Moor</span>
  <a class="mu-back" href="pulse-dashboard.html">Project Pulse</a>
</div>
<div id="mu-app"></div>
<script>var TOOLS = {};</script>
<script src="pulse-tools/tool-stream.js"></script>
<script>
  (function(){
    var host = document.getElementById('mu-app');
    try{ TOOLS.stream.mount(host); }
    catch(e){
      host.innerHTML = '<p style="padding:24px;color:#8b7fa8">Moor Ultra could not start on this device.</p>';
    }
  })();
</script>
</body>
</html>
