<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wonder renderer</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080c10;color:#eef1f4;font:14px system-ui}*{box-sizing:border-box}.tool-host{width:100%;height:100%}.t-controls{display:flex;gap:8px}canvas{max-width:100%}input{width:80px}</style></head><body><div class="tool-host"></div>
<script>
'use strict';
var TOOLS={},esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),toast=s=>console.warn(s);
const id=new URLSearchParams(location.search).get('component');
const allowed=new Set(['terrain-core','terrain-field','planet-vegetation','softbody-creatures','comp-proc-vehicles','comp-furniture']);
if(allowed.has(id)){
 const s=document.createElement('script');s.src='wonder-previews/'+id+'.js?v=20261006-scroll-repair2';
 s.onload=()=>{try{TOOLS[window.WONDER_PREVIEW_TOOL].mount(document.querySelector('.tool-host'));}catch(e){document.querySelector('.tool-host').textContent='Tool failed to start: '+e.message;}};
 s.onerror=()=>document.querySelector('.tool-host').textContent='Tool failed to start: renderer unavailable';document.head.append(s);
}else document.querySelector('.tool-host').textContent='Tool failed to start: unknown generator';
window.addEventListener('pagehide',()=>TOOLS[window.WONDER_PREVIEW_TOOL]?.unmount?.());
</script></body></html>
