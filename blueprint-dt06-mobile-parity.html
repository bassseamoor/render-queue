<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DT-06 REV 2 · Mobile Truth</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#05060b;color:#edf7ff;font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif}body{min-height:100vh;overflow-x:hidden}
:root{--ink:#05060b;--panel:#0b1120;--cyan:#00e5ff;--ice:#8ff5ff;--gold:#ffd15c;--pink:#ff5eaa;--green:#5dffb0;--red:#ff6078;--muted:#7f91aa;--line:rgba(0,229,255,.2)}
a{color:inherit}.nav{position:sticky;top:0;z-index:30;display:flex;gap:8px;align-items:center;padding:10px 14px;background:rgba(5,6,11,.88);backdrop-filter:blur(18px);border-bottom:1px solid rgba(0,229,255,.15)}
.nav b{font:800 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em;color:var(--cyan);margin-right:auto}.nav a{text-decoration:none;border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:8px 10px;color:#b8c6d9;font-size:10px;letter-spacing:.06em}.nav a:hover{border-color:var(--cyan);color:#fff}
.hero{min-height:74vh;display:grid;place-items:center;text-align:center;padding:70px 20px 54px;position:relative;overflow:hidden;background:
radial-gradient(700px 420px at 50% 20%,rgba(0,229,255,.17),transparent 68%),
radial-gradient(520px 340px at 18% 78%,rgba(255,94,170,.12),transparent 70%),
radial-gradient(620px 360px at 88% 72%,rgba(255,209,92,.11),transparent 72%),#05060b}
.hero:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.12) .75px,transparent .75px);background-size:10px 10px;opacity:.16;mask-image:linear-gradient(#000,transparent 88%)}
.hero-inner{position:relative;max-width:980px}.eyebrow{font:800 11px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.28em;color:var(--cyan);text-transform:uppercase}
h1{font-size:clamp(52px,11vw,118px);line-height:.82;letter-spacing:-.065em;margin:24px 0 20px;text-transform:uppercase;font-weight:1000}.truth{color:#fff;text-shadow:0 0 40px rgba(0,229,255,.22)}.mobile{color:var(--pink);text-shadow:0 0 38px rgba(255,94,170,.18)}
.tag{font-size:clamp(18px,2.7vw,29px);line-height:1.28;color:#aec1d9;max-width:800px;margin:0 auto}.tag b{color:#fff}.tag em{font-style:normal;color:var(--gold);font-weight:800}
.stamps{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:30px}.stamp{border:1px solid rgba(0,229,255,.27);background:rgba(0,229,255,.055);border-radius:8px;padding:8px 10px;font:800 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.09em;color:#bcefff}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px 90px}.beat{margin:54px 0}.label{font:900 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.23em;color:var(--cyan);text-transform:uppercase;margin-bottom:10px}.beat h2{font-size:clamp(30px,5vw,58px);line-height:1;letter-spacing:-.04em;margin:0 0 14px}.lead{color:#96a9c0;font-size:17px;max-width:850px;margin:0}
.duel{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:24px}.panel{border-radius:18px;padding:22px;border:1px solid rgba(255,255,255,.1);background:linear-gradient(155deg,rgba(16,24,43,.9),rgba(7,10,18,.92));box-shadow:0 24px 70px rgba(0,0,0,.25)}.bad{border-color:rgba(255,96,120,.25)}.good{border-color:rgba(93,255,176,.27)}.panel h3{margin:0 0 8px;font-size:19px}.bad h3{color:#ff9dad}.good h3{color:var(--green)}.panel p{margin:0;color:#a8b9cd}
.flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:12px;align-items:center;margin-top:28px}.node{min-height:120px;border:1px solid var(--line);border-radius:18px;padding:18px;background:rgba(9,16,29,.82);display:flex;flex-direction:column;justify-content:center}.node b{color:#fff;font-size:17px}.node span{color:#8296af;font-size:12px;margin-top:5px}.arr{color:var(--cyan);font-size:28px;font-weight:900;text-align:center}.branch{display:grid;gap:8px}.branch .node{min-height:56px;padding:12px 14px}.branch .node:first-child{border-color:rgba(255,209,92,.3)}.branch .node:last-child{border-color:rgba(0,229,255,.3)}
.values{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:24px}.value{border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:16px;background:#090e18}.value strong{display:block;font:900 24px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--gold)}.value span{display:block;margin-top:7px;color:#879ab2;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.plate{margin:24px 0;border:1px solid rgba(0,229,255,.22);border-radius:22px;overflow:hidden;background:linear-gradient(160deg,rgba(13,20,36,.96),rgba(5,8,15,.96));box-shadow:0 26px 70px rgba(0,0,0,.28)}
.plate-head{display:flex;gap:16px;align-items:center;padding:18px 20px;background:linear-gradient(90deg,rgba(0,229,255,.13),transparent);border-bottom:1px solid rgba(0,229,255,.13)}.num{flex:0 0 54px;height:54px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#00e5ff,#8ff5ff);color:#041017;font-size:24px;font-weight:1000;box-shadow:0 0 26px rgba(0,229,255,.3)}.plate-head h3{margin:0;font-size:21px}.plate-head small{display:block;color:#6f8198;margin-top:3px;font:700 10px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace}
.plate-body{padding:20px}.field{margin:0 0 18px}.field:last-child{margin-bottom:0}.k{font:900 10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.18em;color:#687b95;text-transform:uppercase;margin-bottom:7px}.k.gold{color:var(--gold)}.k.pink{color:var(--pink)}pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;background:#03050a;border:1px solid rgba(0,229,255,.15);border-radius:13px;padding:14px 16px;color:#cce1ef;font:12px/1.62 ui-monospace,SFMono-Regular,Menlo,monospace}.why{border-left:3px solid var(--gold);background:rgba(255,209,92,.055);border-radius:0 12px 12px 0;padding:12px 14px;color:#d6c69e;font-size:13px}.done{border-left:3px solid var(--green);background:rgba(93,255,176,.055);border-radius:0 12px 12px 0;padding:12px 14px;color:#c1ead4;font-size:13px}.verify{border-left:3px solid var(--pink);background:rgba(255,94,170,.05);border-radius:0 12px 12px 0;padding:12px 14px;color:#e4bfd1;font-size:13px}
.table{width:100%;border-collapse:collapse;margin-top:14px;background:#080d16;border-radius:16px;overflow:hidden}.table th,.table td{padding:11px 12px;border-bottom:1px solid rgba(255,255,255,.07);text-align:left;vertical-align:top}.table th{font:900 10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:#64778f}.table td:first-child{font:800 12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--cyan);width:30%}.table td{color:#aebfd2;font-size:13px}.table tr:last-child td{border-bottom:0}
.asserts{display:grid;gap:9px;margin-top:18px}.assert{border:1px solid rgba(93,255,176,.18);border-radius:13px;background:#060b10;padding:13px 15px;color:#bbd4c7;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}.assert b{color:var(--green)}
.ng{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}.ng div{border:1px solid rgba(255,96,120,.16);border-radius:14px;background:rgba(255,96,120,.035);padding:14px;color:#c6aeb4}.ng b{color:#ff8799}
.seal{margin-top:54px;border:1px solid rgba(255,209,92,.3);border-radius:20px;padding:20px;background:linear-gradient(120deg,rgba(255,209,92,.08),rgba(0,229,255,.04));display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}.seal strong{font-size:20px}.seal p{margin:5px 0 0;color:#9aadbf}.receipt{font:900 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--gold);border:1px solid rgba(255,209,92,.28);padding:10px 12px;border-radius:10px}
.err{padding:60px 20px;text-align:center;color:#ff9bad}
@media(max-width:800px){.duel,.ng{grid-template-columns:1fr}.values{grid-template-columns:repeat(2,1fr)}.flow{grid-template-columns:1fr}.arr{transform:rotate(90deg)}.nav a{display:none}.nav a:last-child{display:block}}
@media(max-width:520px){.hero{min-height:68vh}.values{grid-template-columns:1fr 1fr}.plate-body{padding:15px}.plate-head{padding:14px}.num{flex-basis:46px;height:46px}.table{display:block;overflow-x:auto}.seal{grid-template-columns:1fr}.receipt{justify-self:start}}
</style>
</head>
<body>
<nav class="nav"><b>DT-06 // REV 2 // BLUEPRINT</b><a target="_top" href="pulse-dashboard.html?tool=blueprintsop">SOP</a><a target="_top" href="pulse-dashboard.html?tool=blueprintstd">STANDARD</a><a target="_top" href="pulse-dashboard.html?tool=blueprintdl">EXEMPLAR</a><a target="_top" href="pulse-dashboard.html?tool=blueprintdt06">PULSE LINK</a></nav>
<div id="app"><div class="hero"><div class="hero-inner"><div class="eyebrow">Loading sealed build manual…</div><h1><span class="mobile">Mobile</span><br><span class="truth">Truth</span></h1></div></div></div>
<script>
(function(){
'use strict';
const app=document.getElementById('app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pre=v=>'<pre>'+esc(Array.isArray(v)?v.join('\n'):v||'')+'</pre>';
const field=(k,v,cls='')=>v?'<div class="field"><div class="k '+cls+'">'+esc(k)+'</div>'+pre(v)+'</div>':'';
const listText=v=>Array.isArray(v)?v.join('\n'):String(v||'');
function render(bp){
 const lv=bp.locked_values,steps=bp.build_steps||[];
 const valueCards=[
  [lv.compact_width_px+'px','one compact breakpoint'],
  [lv.machine_visual_cap.low+' / '+lv.machine_visual_cap.full,'machines low / full'],
  [lv.route_visual_cap.low+' / '+lv.route_visual_cap.full,'routes low / full'],
  [lv.wip_visual_cap.low+' / '+lv.wip_visual_cap.full,'WIP low / full']
 ].map(x=>'<div class="value"><strong>'+esc(x[0])+'</strong><span>'+esc(x[1])+'</span></div>').join('');
 const plates=steps.map(s=>{
  let why='';
  const reasons=[];
  if(s.invariant)reasons.push(s.invariant);
  if(s.helper_rule)reasons.push(s.helper_rule);
  if(s.geometry_proof)reasons.push(s.geometry_proof);
  if(s.honesty_boundary)reasons.push(s.honesty_boundary);
  if(s.search_contract)reasons.push('SEARCH CONTRACT\n'+JSON.stringify(s.search_contract,null,2));
  return '<article class="plate"><div class="plate-head"><div class="num">'+s.step+'</div><div><h3>'+esc(s.title)+'</h3><small>'+esc(s.file)+'</small></div></div><div class="plate-body">'+
    field('ANCHOR — EXACT',s.anchor_exact||s.route_anchor_exact||s.panel_anchor_exact)+
    field('REPLACE / INSERT — EXACT',s.replace_with||s.insert_exact||s.panel_insert_before||s.css_add||s.required_behavior||s.exact_assertions,'gold')+
    field('FOLLOW-ON / RENAMES',s.follow_on_exact||s.rename_exact||s.route_replace_exact||s.css_replace_exact)+
    (reasons.length?'<div class="field"><div class="k gold">WHY THESE VALUES</div><div class="why">'+esc(reasons.join('\n\n')).replace(/\n/g,'<br>')+'</div></div>':'')+
    '<div class="field"><div class="k">DONE STATE</div><div class="done">'+esc(s.done_state||'').replace(/\n/g,'<br>')+'</div></div>'+
    '<div class="field"><div class="k pink">VERIFY</div><div class="verify">'+esc(listText(s.verification)).replace(/\n/g,'<br>')+'</div></div>'+
  '</div></article>';
 }).join('');
 const valueRows=Object.entries(lv).map(([k,v])=>'<tr><td>'+esc(k)+'</td><td>'+esc(typeof v==='object'?JSON.stringify(v):v)+'</td><td>'+esc(bp.value_rationale[k]||'Locked by sealed verdict / existing runtime contract.')+'</td></tr>').join('');
 const interfaces=(bp.interfaces||[]).map(x=>'<tr><td>'+esc(x.from)+'</td><td>'+esc(x.to)+'</td><td>'+esc(x.contract)+'</td></tr>').join('');
 const claimRows=(bp.claims||[]).map(x=>'<tr><td>'+esc(x.id)+'</td><td>'+esc(x.claim)+'</td><td>'+esc(x.assertion)+'</td></tr>').join('');
 const assertions=(bp.acceptance||[]).map(x=>'<div class="assert"><b>✓ ASSERT</b> → '+esc(x)+'</div>').join('');
 const non=(bp.non_goals||[]).map(x=>'<div><b>✕ DO NOT</b><br>'+esc(x)+'</div>').join('');
 app.innerHTML=
 '<section class="hero"><div class="hero-inner"><div class="eyebrow">FACTORY DIGITAL TWIN · DT-06 · REV 2 · SEALED v44</div>'+
 '<h1><span class="mobile">Mobile</span><br><span class="truth">Truth</span></h1>'+
 '<div class="tag">The screen can shrink. <b>The truth cannot.</b><br>'+esc(bp.promise)+'</div>'+
 '<div class="stamps"><span class="stamp">720PX CONTRACT</span><span class="stamp">24·36·12 LOW DRAW</span><span class="stamp">SAME SEMANTIC IDS</span><span class="stamp">0 NEW AUTHORITY</span><span class="stamp">SEALED '+esc(bp.sealed_verdict.split('/').pop())+'</span></div></div></section>'+
 '<main class="wrap">'+
 '<section class="beat"><div class="label">SELL // THE BUG IS PHILOSOPHICAL</div><h2>Performance was quietly deleting <span style="color:var(--pink)">meaning.</span></h2><p class="lead">'+esc(bp.stakes)+'</p>'+
 '<div class="duel"><div class="panel bad"><h3>✕ LOW MODE TODAY</h3><p>Slice machines. Slice routes. Slice WIP. The phone sees fewer objects and has no path to inspect what vanished.</p></div><div class="panel good"><h3>✓ DT-06</h3><p>'+esc(bp.click)+'</p></div></div></section>'+
 '<section class="beat"><div class="label">THE LAW // ONE SNAPSHOT, TWO DENSITIES</div><h2>Truth first. Geometry second.</h2><div class="flow"><div class="node"><b>FactoryTwinSnapshot</b><span>validated authority-neutral semantic source</span></div><div class="arr">→</div><div class="node"><b>Full semantic sets</b><span>machines · routes · active WIP — never sliced</span></div><div class="arr">→</div><div class="branch"><div class="node"><b>3D draw budget</b><span>24 / 36 / 12 on low</span></div><div class="node"><b>≡ FACTORY TRUTH</b><span>all IDs searchable + inspectable</span></div></div></div><div class="values">'+valueCards+'</div></section>'+
 '<section class="beat"><div class="label">SPEC // EXECUTE TO THE NAIL</div><h2>'+steps.length+' build plates. Zero side conversations.</h2><p class="lead">Every plate names the current anchor, the exact patch, the locked values, the reason, the done-state, and the assertion that proves it.</p>'+plates+'</section>'+
 '<section class="beat"><div class="label">DATA // THE VALUES ARE THE FEATURE</div><h2>Do not invent another number.</h2><table class="table"><thead><tr><th>datum</th><th>locked value</th><th>why exactly</th></tr></thead><tbody>'+valueRows+'</tbody></table></section>'+
 '<section class="beat"><div class="label">INTERFACES // TURTLES ALL THE WAY DOWN</div><h2>Every hook terminates in existing machinery.</h2><table class="table"><thead><tr><th>from</th><th>to</th><th>contract</th></tr></thead><tbody>'+interfaces+'</tbody></table></section>'+
 '<section class="beat"><div class="label">CLAIMS // EVERY LINE OWES PROOF</div><h2>No assertion gets to float.</h2><table class="table"><thead><tr><th>id</th><th>claim</th><th>verification assertion</th></tr></thead><tbody>'+claimRows+'</tbody></table></section>'+
 '<section class="beat"><div class="label">VERIFY // NOT VIBES</div><h2>The phone and desktop must disagree only about pixels.</h2><div class="asserts">'+assertions+'</div></section>'+
 '<section class="beat"><div class="label">BOUNDARY // HONESTY GATE</div><h2>What DT-06 absolutely does not do.</h2><div class="ng">'+non+'</div></section>'+
 '<section class="seal"><div><strong>SEALED BLUEPRINT · BUILD</strong><p>Scope: blueprint publication only. DT-06 runtime implementation remains a separate execution release.</p></div><div class="receipt">v44/usage-plan-1 · 345048cb648d5f5b</div></section>'+
 '</main>';
}
fetch('blueprint/dt06-mobile-semantic-parity.blueprint.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('blueprint '+r.status);return r.json()}).then(render).catch(e=>{app.innerHTML='<div class="err"><h2>Blueprint data unavailable</h2><p>'+esc(e.message)+'</p></div>'});
})();
</script>
</body>
</html>
