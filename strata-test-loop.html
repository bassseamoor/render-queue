<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:#222;}canvas{width:100%;height:100%;display:block;}</style>
</head><body><canvas id="c"></canvas>
<script>
var canvas=document.getElementById('c');
canvas.width=innerWidth; canvas.height=innerHeight;
var gl=canvas.getContext('webgl',{antialias:false,alpha:false,preserveDrawingBuffer:true});
function sh(t,s){var o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return o;}
var vs=sh(gl.VERTEX_SHADER,'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}');
var fs=sh(gl.FRAGMENT_SHADER,'precision mediump float;void main(){gl_FragColor=vec4(1.,0.,0.,1.);}');
var pr=gl.createProgram();gl.attachShader(pr,vs);gl.attachShader(pr,fs);gl.linkProgram(pr);
var buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-0.8,-0.8, 0.8,-0.8, 0.,0.8]),gl.STATIC_DRAW);
var loc=gl.getAttribLocation(pr,'p');
var frames=0;
function frame(){
 requestAnimationFrame(frame);
 if(document.hidden)return;
 gl.viewport(0,0,canvas.width,canvas.height);
 gl.clearColor(0.,0.,1.,1.);gl.clear(gl.COLOR_BUFFER_BIT);
 gl.useProgram(pr);
 gl.bindBuffer(gl.ARRAY_BUFFER,buf);
 gl.enableVertexAttribArray(loc);
 gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
 gl.drawArrays(gl.TRIANGLES,0,3);
 frames++;
 if(frames===60){
  var d=document.createElement('div');
  d.style.cssText='position:fixed;top:10px;left:10px;color:#0f0;font:14px monospace;background:rgba(0,0,0,.7);padding:8px;';
  d.textContent='60 frames drawn, glErr:'+gl.getError();
  document.body.appendChild(d);
 }
}
requestAnimationFrame(frame);
</script></body></html>
