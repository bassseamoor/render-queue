<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moor — your space</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: #101014; color: #f2f2f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 18px; line-height: 1.45;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 20px 18px 60px; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin: 6px 0 22px; }
  .brand { font-size: 15px; letter-spacing: .18em; text-transform: uppercase; color: #8e8e96; }
  .brand b { color: #f2f2f5; font-weight: 700; }
  #savedind { font-size: 14px; color: #9fe6a0; opacity: 0; transition: opacity .4s; }
  #savedind.on { opacity: 1; }
  .hero h1 { font-size: 32px; margin: 0 0 14px; letter-spacing: -0.01em; }
  label { display: block; font-size: 15px; color: #b9b9c2; margin: 14px 0 6px; }
  input[type=text] {
    width: 100%; font-size: 18px; padding: 14px 16px; min-height: 54px;
    border-radius: 14px; border: 1px solid #2c2c34; background: #1a1a21; color: #fff;
  }
  input[type=text]:focus { outline: none; border-color: #7c6cf0; }
  button {
    display: block; width: 100%; margin-top: 12px; padding: 15px; min-height: 56px;
    font-size: 19px; font-weight: 600; border: 0; border-radius: 14px;
    background: #7c6cf0; color: #fff; cursor: pointer;
  }
  button:active { background: #6a5ade; }
  button.ghost { background: transparent; border: 1px solid #2c2c34; color: #b9b9c2; font-weight: 500; font-size: 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
  .chip {
    padding: 8px 14px; border-radius: 999px; background: #1e1e26;
    border: 1px solid #2c2c34; font-size: 15px; color: #d7d7de;
  }
  .examples { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .examples button { width: auto; margin: 0; padding: 10px 16px; min-height: 44px; font-size: 15px; background: #23232c; font-weight: 500; }
  .actions { display: flex; gap: 10px; margin: 18px 0 6px; }
  .actions button { margin-top: 0; min-height: 50px; font-size: 16px; }
  .saved { color: #9fe6a0; font-size: 15px; margin: 2px 0 4px; }
  .card {
    background: #1a1a21; border: 1px solid #26262e; border-radius: 14px;
    padding: 14px 16px; margin: 10px 0;
  }
  .card .k { color: #8e8e96; font-size: 14px; }
  .card .v { font-size: 18px; margin-bottom: 6px; word-break: break-word; }
  .card .v:last-child { margin-bottom: 0; }
  #error {
    display: none; background: #3a1d1d; border: 1px solid #7a2e2e; color: #ffb4b4;
    border-radius: 12px; padding: 12px 14px; margin: 14px 0; font-size: 16px;
  }
  #notice {
    display: none; background: #1d2a1d; border: 1px solid #3a5a3a; color: #c9e6c9;
    border-radius: 12px; padding: 12px 14px; margin: 14px 0; font-size: 16px;
  }
  h2.sect { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: #8e8e96; margin: 30px 0 6px; font-weight: 600; }
  p.sub { color: #b9b9c2; margin: 0 0 18px; }
  .homerow {
    display: flex; align-items: center; gap: 14px; width: 100%;
    background: #1a1a21; border: 1px solid #26262e; border-radius: 14px;
    padding: 12px 14px; margin: 10px 0; cursor: pointer; text-align: left;
    color: #f2f2f5; font-size: 18px; font-weight: 400; min-height: 0;
  }
  .homerow:active { background: #22222b; }
  .homerow .rh-thumb { width: 52px; height: 52px; object-fit: cover; border-radius: 10px; flex: none; background: #26262e; }
  .homerow .rh-icon {
    width: 52px; height: 52px; border-radius: 10px; flex: none;
    background: #23232c; display: flex; align-items: center; justify-content: center;
    font-size: 24px; color: #b9b9c2;
  }
  .homerow .rh-body { flex: 1; min-width: 0; }
  .homerow .rh-name { font-size: 18px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .homerow .rh-sub { color: #8e8e96; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .homerow .rh-chev { color: #6e6e78; font-size: 22px; flex: none; }
  .backrow { margin-bottom: 6px; }
  .backrow button { width: auto; margin: 0; padding: 10px 18px; min-height: 44px; font-size: 16px; }
  .rowline { display: flex; gap: 10px; }
  .rowline input { flex: 1; }
  .rowline button { width: auto; margin-top: 0; padding: 14px 22px; white-space: nowrap; }
  .msg { background: #1a1a21; border: 1px solid #26262e; border-radius: 14px; padding: 12px 16px; margin: 8px 0; font-size: 18px; word-break: break-word; }
  #viewer {
    display: none; position: fixed; inset: 0; z-index: 50;
    background: rgba(0,0,0,.94); flex-direction: column;
    align-items: center; justify-content: center; padding: 24px;
  }
  #viewer.open { display: flex; }
  #viewer img { max-width: 100%; max-height: 78vh; border-radius: 12px; }
  #viewer .cap { color: #b9b9c2; margin-top: 14px; font-size: 15px; text-align: center; }
  #viewer .x { position: absolute; top: 14px; right: 18px; color: #fff; font-size: 30px; background: none; border: none; width: auto; min-height: 0; padding: 8px 12px; margin: 0; }
  .adding { color: #8e8e96; font-size: 15px; margin-top: 10px; }
  .honest { margin-top: 30px; padding-top: 18px; border-top: 1px solid #23232b; color: #b9b9c2; font-size: 16px; }
  footer { margin-top: 26px; color: #6e6e78; font-size: 13px; line-height: 1.6; }
  footer button { background: none; border: none; color: #6e6e78; font-size: 13px; font-weight: 400; min-height: 0; padding: 0; margin: 8px 0 0; width: auto; display: inline; text-decoration: underline; }
  #boot { color: #8e8e96; padding: 40px 0; text-align: center; }
  select {
    font-size: 17px; padding: 12px 14px; min-height: 54px; max-width: 150px;
    border-radius: 14px; border: 1px solid #2c2c34; background: #1a1a21; color: #fff;
  }
  textarea {
    width: 100%; font-size: 18px; padding: 14px 16px; font-family: inherit;
    border-radius: 14px; border: 1px solid #2c2c34; background: #1a1a21; color: #fff;
  }
  textarea:focus { outline: none; border-color: #7c6cf0; }
  input[type=date], input[type=number], input[type=url] {
    width: 100%; font-size: 18px; padding: 14px 16px; min-height: 54px;
    border-radius: 14px; border: 1px solid #2c2c34; background: #1a1a21; color: #fff;
  }
  input[type=date]:focus, input[type=number]:focus, input[type=url]:focus { outline: none; border-color: #7c6cf0; }
  input[type=file] { margin-top: 6px; font-size: 16px; color: #b9b9c2; }
  .choicechips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .choicechip {
    width: auto; margin: 0; padding: 10px 18px; min-height: 44px;
    font-size: 16px; font-weight: 500; background: #23232c; border: 1px solid #2c2c34;
  }
  .choicechip.sel { background: #7c6cf0; border-color: #7c6cf0; }
  .card .v a { color: #9fb4ff; }
  .card .v img { max-width: 100%; border-radius: 8px; }
  .fldpreview { display: none; max-width: 140px; border-radius: 8px; margin-top: 8px; }
  #newthreadbox { display: none; margin-top: 12px; }
  .vx-grid {
    display: grid; gap: 2px; background: #0a0a0d; padding: 8px;
    border-radius: 14px; border: 1px solid #26262e;
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  .vx-cell { aspect-ratio: 1; border-radius: 4px; background: #1e1e26; min-width: 0; }
  .vx-pal { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; }
  .vx-sw {
    width: 52px; height: 52px; border-radius: 14px; border: 3px solid transparent;
    margin: 0; padding: 0; min-height: 0;
  }
  .vx-sw.sel { border-color: #fff; }
  .vx-sw.eraser { background: #23232c; color: #b9b9c2; font-size: 22px; width: auto; padding: 0 18px; }
  .vx-layers { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
  .vx-layers button { width: auto; margin: 0; padding: 12px 20px; min-height: 52px; font-size: 17px; background: #23232c; font-weight: 500; }
  .vx-layers button.sel { background: #7c6cf0; }
  .vx-tools { display: flex; gap: 10px; margin-top: 14px; }
  .vx-tools button { margin-top: 0; min-height: 52px; font-size: 16px; }
  /* ---------- idle game: the game skill's touch surface ---------- */
  .gm-points { font-size: 56px; font-weight: 800; letter-spacing: -0.02em; margin: 6px 0 2px; }
  .gm-rates { color: #8e8e96; font-size: 16px; margin-bottom: 14px; }
  .gm-tap {
    min-height: 96px; font-size: 26px; font-weight: 800; border-radius: 20px;
    background: linear-gradient(180deg, #8a7bf5, #6a5ade);
  }
  .gm-tap:active { transform: scale(.98); }
  .gm-up {
    display: flex; align-items: center; gap: 12px;
    background: #1a1a21; border: 1px solid #26262e; border-radius: 14px;
    padding: 12px 14px; margin: 10px 0;
  }
  .gm-up .gm-body { flex: 1; min-width: 0; }
  .gm-up .gm-name { font-size: 17px; font-weight: 600; }
  .gm-up .gm-fx { color: #8e8e96; font-size: 14px; margin-top: 2px; }
  .gm-up button { width: auto; margin: 0; padding: 12px 18px; min-height: 52px; font-size: 15px; white-space: nowrap; }
  .gm-up button.cant { background: #23232c; color: #6e6e78; }
  /* ---------- gallery: photo grid + slideshow ---------- */
  .gal-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
  .gal-thumb { aspect-ratio: 1; object-fit: cover; width: 100%; border-radius: 10px; background: #26262e; }
  .gal-tools { display: flex; gap: 10px; margin-top: 6px; flex-wrap: wrap; }
  .gal-tools button { width: auto; margin: 0; padding: 12px 20px; min-height: 52px; font-size: 16px; }
  .gal-tools button.on { background: #2c7a2c; }
  #viewer .vnav {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: rgba(255,255,255,.12); border: none; color: #fff; font-size: 34px;
    width: 64px; min-height: 64px; margin: 0; padding: 0; border-radius: 50%;
  }
  #viewer .vprev { left: 12px; } #viewer .vnext { right: 12px; }
  #viewer .vplay {
    position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%);
    width: auto; margin: 0; padding: 12px 26px; min-height: 52px; font-size: 16px;
    background: rgba(255,255,255,.14);
  }
  #viewer .vplay.on { background: #2c7a2c; }
  /* ---------- self-update banner: a stale tab must never test an old build silently ---------- */
  #updatebar {
    display: none; background: #1d2a1d; border: 1px solid #3a5a3a; color: #c9e6c9;
    border-radius: 12px; padding: 14px; margin: 14px 0; font-size: 17px; font-weight: 600;
    width: 100%; cursor: pointer; text-align: center;
  }
  /* ---------- "Rebuild this": manual recompose action on every page ---------- */
  .rebuildbtn {
    background: transparent; border: 1px solid #2e2e38; color: #8e8e96;
    border-radius: 10px; padding: 8px 16px; margin: 8px 0 0;
    font-size: 14px; font-weight: 500; width: auto; min-height: 44px; cursor: pointer;
  }
  .rebuildbtn:active { background: #1a1a21; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><b>Moor</b> · your space</div>
    <div id="savedind">Saved ✓</div>
  </header>

  <div id="error" role="alert"></div>
  <div id="notice" role="status"></div>
  <button id="updatebar">A newer Moor is ready — tap to reload.</button>
  <div id="boot">Loading…</div>

  <div id="app" style="display:none">
    <section class="hero">
      <h1>What do you need?</h1>
      <div class="rowline">
        <input type="text" id="ask" placeholder="a customer tracker with fields name, email" autocomplete="off">
        <button id="askbtn">Go</button>
      </div>
      <div class="examples">
        <button data-ex="customer tracker with fields name, email, status">Customer tracker</button>
        <button data-ex="track my workouts with date, exercise, sets, reps">Track my workouts</button>
        <button data-ex="build a stadium out of voxels">Voxel stadium</button>
        <button data-ex="reading list with fields title, author">Reading list</button>
        <button data-ex="notes">Notes</button>
      </div>
      <div class="actions">
        <button class="ghost" id="addphotosbtn">Add photos</button>
        <button class="ghost" id="newthreadbtn">New thread</button>
      </div>
      <div id="newthreadbox">
        <div class="rowline">
          <input type="text" id="threadname" placeholder="e.g. Family" autocomplete="off">
          <button id="threadbtn">Start</button>
        </div>
      </div>
      <div class="adding" id="adding" style="display:none">Adding…</div>
      <input type="file" id="photopick" accept="image/*" multiple style="display:none">
    </section>

    <section id="view-home">
      <h2 class="sect">Your space</h2>
      <div id="homelist"></div>
    </section>

    <section id="view-focus" style="display:none">
      <div class="backrow"><button class="ghost" id="backbtn">‹ Your space</button></div>
      <div id="focusbody"></div>
    </section>

    <footer>
      Running the real MOOR core (Rust, in your browser). Everything is saved on
      this phone — close the tab and come back, your stuff is still here.
      Photos are downscaled for this phone proof.<br>
      <button id="startover">start over</button>
    </footer>
  </div>
</div>

<div id="viewer" role="dialog" aria-label="Photo viewer">
  <button class="x" id="viewerx" aria-label="Close">×</button>
  <img id="viewerimg" alt="Your photo">
  <div class="cap" id="viewercap"></div>
  <button class="vnav vprev" id="viewerprev" aria-label="Previous" style="display:none">‹</button>
  <button class="vnav vnext" id="viewernext" aria-label="Next" style="display:none">›</button>
  <button class="vplay" id="viewerplay" style="display:none">▶ Slideshow</button>
</div>

<script type="module">
import init, { handle } from './pkg/moor_web.js';

const STORE_KEY = 'moor-core-v0-store';
const mem = { store: '' };
const state = { items: [] };
// Baked in at build time (the build script stamps the real version over
// "dev"). The page compares this against version.txt so a stale tab can
// never silently test an old build again.
const BUILD_VERSION = "20261002T032857Z-e3384688";

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/>/g, '&gt;').replace(/"/g, '&quot;');

function lsGet(k) {
  try { const v = localStorage.getItem(k); return v === null ? '' : v; }
  catch (e) { return mem.store; }
}
function lsSet(k, v) {
  try { localStorage.setItem(k, v); }
  catch (e) { mem.store = v; }
}

function showError(msg) { const e = $('error'); e.textContent = msg; e.style.display = 'block'; }
function clearError() { const e = $('error'); e.style.display = 'none'; e.textContent = ''; }
function showNotice(msg) { const e = $('notice'); e.textContent = msg; e.style.display = 'block'; }
function clearNotice() { const e = $('notice'); e.style.display = 'none'; e.textContent = ''; }
function flashSaved() { const s = $('savedind'); s.classList.add('on'); }

/* Self-update: the served version.txt is compared against the baked-in
   build version on boot and every 5 minutes. On mismatch a banner offers
   a reload — never auto-reloads (that could lose form state), and a
   failed fetch (offline, file://) fails silent so boot never breaks. */
function checkForUpdate() {
  fetch('version.txt', { cache: 'no-store' })
    .then(r => r.ok ? r.text() : Promise.reject(new Error('no version')))
    .then(t => {
      t = (t || '').trim();
      if (t && t !== BUILD_VERSION) $('updatebar').style.display = 'block';
    })
    .catch(() => {});
}
$('updatebar').onclick = () => location.reload();

/* Quiet variant: background data refreshes must never clear an error banner
   a user-facing command just raised (e.g. the photo-space guard refusal
   followed by the post-upload home refresh). */
function callQuiet(cmd) {
  let out;
  try {
    out = JSON.parse(handle(lsGet(STORE_KEY), JSON.stringify(cmd)));
  } catch (e) { return null; }
  if (!out.ok) return null;
  lsSet(STORE_KEY, out.store);
  return out.result;
}

/* The only bridge to the core. Dumb by design: send command, keep the
   returned snapshot, render the result. */
function call(cmd) {
  let out;
  try {
    out = JSON.parse(handle(lsGet(STORE_KEY), JSON.stringify(cmd)));
  } catch (e) {
    showError('Something went wrong talking to the core. Try again.');
    return null;
  }
  if (!out.ok) { showError(out.error); return null; }
  clearError(); clearNotice();
  lsSet(STORE_KEY, out.store);
  flashSaved();
  return out.result;
}

function rowSub(it) {
  if (it.kind === 'moor.photo') return 'Photo';
  if (it.kind === 'moor.thread') {
    const n = it.message_count || 0;
    const base = n === 0 ? 'No messages yet' : n + (n === 1 ? ' message' : ' messages');
    return it.preview ? base + ' — ' + it.preview : base;
  }
  // The core labels each app from its composed skills ("Tracker · 3 rows",
  // "Notes · 2 notes", "2 skills").
  return it.sub || 'Tracker';
}

function renderHome() {
  $('view-focus').style.display = 'none';
  $('view-home').style.display = 'block';
  const list = $('homelist');
  if (!state.items.length) {
    list.innerHTML = '<p class="sub">Nothing here yet. Ask for something above — or add a photo to begin.</p>';
    return;
  }
  list.innerHTML = state.items.map(it => {
    const media = it.kind === 'moor.photo'
      ? `<img class="rh-thumb" src="${esc(it.image)}" alt="">`
      : `<div class="rh-icon">${it.kind === 'moor.thread' ? '💬' : (it.kit === 'voxel' ? '🧱' : (it.kit === 'notes' ? '📝' : (it.kit === 'game' ? '🎮' : (it.kit === 'gallery' ? '🖼️' : '▦'))))}</div>`;
    return `<button class="homerow" data-id="${esc(it.id)}">${media}
      <div class="rh-body"><div class="rh-name">${esc(it.name)}</div>
      <div class="rh-sub">${esc(rowSub(it))}</div></div>
      <div class="rh-chev">›</div></button>`;
  }).join('');
  list.querySelectorAll('.homerow').forEach(r => {
    r.onclick = () => openFocus(r.dataset.id);
  });
}

function refresh() {
  const res = callQuiet({ op: 'list_all' });
  if (res) state.items = res.items;
  renderHome();
}
/* Refresh data without touching the visible view (after in-focus edits). */
function refreshData() {
  const res = callQuiet({ op: 'list_all' });
  if (res) state.items = res.items;
}

function openFocus(id) {
  stopLiveGames(); closeViewer();
  const it = state.items.find(x => x.id === id);
  if (!it) return;
  if (it.kind === 'moor.photo') {
    openViewer([{ image: it.image, title: it.name }], 0, false);
    return;
  }
  $('view-home').style.display = 'none';
  $('view-focus').style.display = 'block';
  window.scrollTo(0, 0);
  if (it.kind === 'moor.thread') renderThreadFocus(id);
  else renderPiecesFocus(id);
}
$('backbtn').onclick = () => { stopLiveGames(); closeViewer(); refresh(); };
/* Fullscreen viewer with slideshow: prev/next arrows, auto-advance
   toggle. Used by gallery pieces and standalone photos. */
const viewer = { photos: [], idx: 0, timer: null };
function openViewer(photos, idx, autoplay) {
  viewer.photos = photos || [];
  viewer.idx = Math.max(0, Math.min(idx || 0, viewer.photos.length - 1));
  const many = viewer.photos.length > 1;
  $('viewerprev').style.display = many ? 'block' : 'none';
  $('viewernext').style.display = many ? 'block' : 'none';
  $('viewerplay').style.display = many ? 'block' : 'none';
  showViewerPhoto();
  $('viewer').classList.add('open');
  document.body.style.overflow = 'hidden';
  if (autoplay) startSlideshow();
}
function showViewerPhoto() {
  const ph = viewer.photos[viewer.idx] || {};
  $('viewerimg').src = ph.image || '';
  $('viewercap').textContent = ph.title || '';
  $('viewerplay').classList.toggle('on', !!viewer.timer);
  $('viewerplay').textContent = viewer.timer ? '⏸ Slideshow' : '▶ Slideshow';
}
function startSlideshow() {
  if (viewer.timer || viewer.photos.length < 2) return;
  viewer.timer = setInterval(() => {
    viewer.idx = (viewer.idx + 1) % viewer.photos.length;
    showViewerPhoto();
  }, 3000);
  showViewerPhoto();
}
function stopSlideshow() {
  if (viewer.timer) { clearInterval(viewer.timer); viewer.timer = null; }
  showViewerPhoto();
}
function closeViewer() {
  stopSlideshow();
  $('viewer').classList.remove('open');
  document.body.style.overflow = '';
}
$('viewerx').onclick = closeViewer;
$('viewerprev').onclick = () => {
  if (viewer.photos.length < 2) return;
  viewer.idx = (viewer.idx - 1 + viewer.photos.length) % viewer.photos.length;
  showViewerPhoto();
};
$('viewernext').onclick = () => {
  if (viewer.photos.length < 2) return;
  viewer.idx = (viewer.idx + 1) % viewer.photos.length;
  showViewerPhoto();
};
$('viewerplay').onclick = () => { viewer.timer ? stopSlideshow() : startSlideshow(); };
$('viewer').onclick = (e) => { if (e.target.id === 'viewer') closeViewer(); };

/* ---------- ask bar ---------- */
function ask(q) {
  const res = call({ op: 'compile', request: q });
  if (res) {
    $('ask').value = ''; refresh();
    // "rebuild my X" lands the user on the rebuilt page. The focus view
    // fetches through call() which clears notices — so show the message
    // AFTER opening, or the confirmation flashes and vanishes.
    if (res.rebuilt && res.app && res.app.id) openFocus(res.app.id);
    if (res.message) showNotice(res.message);
  }
}
$('askbtn').onclick = () => ask($('ask').value);

/* ---------- photos ---------- */
function downscale(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const max = 1024;
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * scale));
      const h = Math.max(1, Math.round(img.height * scale));
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      c.toBlob((b) => {
        if (!b) { reject(new Error('no')); return; }
        const r = new FileReader();
        r.onload = () => resolve({ dataUrl: r.result, w, h });
        r.onerror = () => reject(new Error('no'));
        r.readAsDataURL(b);
      }, 'image/jpeg', 0.8);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not read that photo.')); };
    img.src = url;
  });
}
$('addphotosbtn').onclick = () => $('photopick').click();
$('photopick').onchange = async () => {
  const files = Array.from($('photopick').files || []);
  $('photopick').value = '';
  if (!files.length) return;
  $('adding').style.display = 'block';
  for (const f of files) {
    try {
      const d = await downscale(f);
      const res = call({ op: 'photo_add', name: f.name || 'Photo', dataUrl: d.dataUrl, w: d.w, h: d.h });
      if (!res) break;
    } catch (e) {
      showError('Could not read that photo. Try another.');
      break;
    }
  }
  $('adding').style.display = 'none';
  refresh();
};

/* ---------- composed apps: one generic renderer for every skill ---------- */
function cellHTML(f, v) {
  // Never throw, never print "[object Object]".
  if (v == null) v = '';
  else if (typeof v === 'object') { try { v = JSON.stringify(v); } catch (e) { v = ''; } }
  v = String(v);
  if (f.type === 'photo' && /^data:image\//.test(v))
    return `<img src="${esc(v)}" alt="">`;
  if (f.type === 'link' && v) {
    const href = /^https?:\/\//i.test(v) ? v : 'https://' + v;
    return `<a href="${esc(href)}" target="_blank" rel="noopener">${esc(v)}</a>`;
  }
  return esc(v);
}

function fieldInputHTML(f, i) {
  const lbl = `<label>${esc(f.name)}${f.type !== 'text' ? ' <span style="color:#8e8e96">(' + esc(f.type) + ')</span>' : ''}`;
  switch (f.type) {
    case 'number':
      return `${lbl}<input type="number" inputmode="decimal" data-p="${i}" data-field="${esc(f.name)}" data-ftype="number" autocomplete="off"></label>`;
    case 'date':
      return `${lbl}<input type="date" data-p="${i}" data-field="${esc(f.name)}" data-ftype="date" autocomplete="off"></label>`;
    case 'link':
      return `${lbl}<input type="url" inputmode="url" data-p="${i}" data-field="${esc(f.name)}" data-ftype="link" autocomplete="off" placeholder="https://"></label>`;
    case 'photo':
      return `${lbl}<input type="file" accept="image/*" data-p="${i}" data-field="${esc(f.name)}" data-ftype="photo">` +
        `<img class="fldpreview" data-preview="${i}-${esc(f.name)}" alt=""></label>`;
    case 'choice': {
      const opts = f.options || [];
      if (!opts.length)
        return `${lbl}<input type="text" data-p="${i}" data-field="${esc(f.name)}" data-ftype="text" autocomplete="off"></label>`;
      const chips = opts.map(o =>
        `<button type="button" class="choicechip" data-p="${i}" data-field="${esc(f.name)}" data-val="${esc(o)}">${esc(o)}</button>`
      ).join('');
      return `${lbl}<div class="choicechips">${chips}</div>` +
        `<input type="hidden" data-p="${i}" data-field="${esc(f.name)}" data-ftype="choice" value=""></label>`;
    }
    default:
      return `${lbl}<input type="text" data-p="${i}" data-field="${esc(f.name)}" data-ftype="text" autocomplete="off"></label>`;
  }
}

function collectRow(i, p) {
  const row = {};
  for (const f of (p && p.fields) || []) {
    const el = document.querySelector(`#focusbody input[data-p="${i}"][data-field="${f.name}"]`);
    if (!el) { row[f.name] = ''; continue; }
    row[f.name] = f.type === 'photo' ? (el.dataset.dataurl || '') : (el.value || '');
  }
  return row;
}

function notesPieceHTML(p, i) {

function unknownPieceHTML(p) {

function collectionPieceHTML(p, i) {
  // Defensive: hand-crafted or corrupted objects must never throw here.
  // Non-array fields get the honest placeholder; non-object rows render
  // as empty cards rather than crashing the whole view.
  if (!Array.isArray(p.fields)) return unknownPieceHTML(p);
  const fields = p.fields.filter(f => f && typeof f === 'object');

/* ---------- voxel canvas: a touch editor for the voxel skill ---------- */
// Editor state survives re-renders so painting never loses your layer/color.
const vx = { layer: 0, color: 0 }; // color = palette index, -1 = eraser

function voxelPieceHTML(p, i) {
  // Belt and braces: the core clamps dims and defaults the palette, but a
  // hand-crafted object must still never freeze the page with a giant grid.
  const dims = p.dims || [16, 16, 4];
  const w = Math.min(Math.max(dims[0] | 0, 1), 32);
  const h = Math.min(Math.max(dims[1] | 0, 1), 32);
  const layers = Math.min(Math.max(dims[2] | 0, 1), 8);
  const palette = (p.palette || []).filter(c => typeof c === 'string').slice(0, 16);
  const cells = (p.cells && typeof p.cells === 'object' && !Array.isArray(p.cells)) ? p.cells : {};
  if (!palette.length) return unknownPieceHTML(p);
  vx.layer = Math.min(vx.layer, layers - 1);
  let grid = '';
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const c = cells[`${vx.layer},${y},${x}`];
      const bg = (typeof c === 'number' && palette[c]) ? palette[c] : '';
      grid += `<div class="vx-cell" data-vxcell data-x="${x}" data-y="${y}"${bg ? ` style="background:${bg}"` : ''}></div>`;
    }
  }
  const layerBtns = Array.from({ length: layers }, (_, l) =>
    `<button type="button" data-vxlayer="${l}" class="${l === vx.layer ? 'sel' : ''}">Layer ${l + 1}</button>`
  ).join('');
  const swatches = palette.map((col, s) =>
    `<button type="button" class="vx-sw${s === vx.color ? ' sel' : ''}" data-vxsw="${s}" style="background:${esc(col)}" aria-label="color ${s + 1}"></button>`
  ).join('') +
    `<button type="button" class="vx-sw eraser${vx.color === -1 ? ' sel' : ''}" data-vxeraser>⌫</button>`;
  return `
    <h2 class="sect">Voxel canvas · layer ${vx.layer + 1} of ${layers}</h2>
    <p class="sub">Tap squares to build. Switch layers to build upward.</p>
    <div class="vx-layers" data-vxlayers="${i}">${layerBtns}</div>
    <div class="vx-grid" data-vxgrid="${i}" style="grid-template-columns:repeat(${w},1fr)">${grid}</div>
    <h2 class="sect">Colors</h2>
    <div class="vx-pal" data-vxpal="${i}">${swatches}</div>
    <div class="vx-tools">
      <button class="ghost" data-vxclear="${i}">Clear this layer</button>
    </div>
    <h2 class="sect">Rename</h2>
    <div class="rowline">
      <input type="text" data-vxname="${i}" placeholder="Canvas name" autocomplete="off">
      <button data-vxrename="${i}">Rename</button>
    </div>`;
}

function wireVoxel(app, p, i) {
  const grid = document.querySelector(`#focusbody [data-vxgrid="${i}"]`);
  if (grid) {
    grid.onclick = (e) => {
      const cell = e.target.closest('[data-vxcell]');
      if (!cell) return;
      const r = call({
        op: 'voxel_paint', id: app.id, piece: i,
        layer: vx.layer, x: +cell.dataset.x, y: +cell.dataset.y, color: vx.color,
      });
      if (r) { refreshData(); renderPiecesFocus(app.id); }
    };
  }
  document.querySelectorAll(`#focusbody [data-vxpal="${i}"] [data-vxsw]`).forEach(sw => {
    sw.onclick = () => { vx.color = +sw.dataset.vxsw; renderPiecesFocus(app.id); };
  });
  const er = document.querySelector(`#focusbody [data-vxpal="${i}"] [data-vxeraser]`);
  if (er) er.onclick = () => { vx.color = -1; renderPiecesFocus(app.id); };
  document.querySelectorAll(`#focusbody [data-vxlayers="${i}"] [data-vxlayer]`).forEach(b => {
    b.onclick = () => { vx.layer = +b.dataset.vxlayer; renderPiecesFocus(app.id); };
  });
  const clr = document.querySelector(`#focusbody [data-vxclear="${i}"]`);
  if (clr) clr.onclick = () => {
    const r = call({ op: 'voxel_clear', id: app.id, piece: i, layer: vx.layer });
    if (r) { refreshData(); renderPiecesFocus(app.id); }
  };
  const rn = document.querySelector(`#focusbody [data-vxrename="${i}"]`);
  if (rn) rn.onclick = () => {
    const name = document.querySelector(`#focusbody [data-vxname="${i}"]`).value.trim();
    if (!name) { showError('Give it a name first.'); return; }
    const r = call({ op: 'rename', id: app.id, name });
    if (r) { refreshData(); renderPiecesFocus(app.id); }
  };
}

/* ---------- idle game: the game skill's touch surface ----------
   Taps and the 1-second tick run locally for instant feel; the server
   stays the authority on prices. State syncs back every 5 seconds and
   on page hide, through the normal patch path. Reload-safe. */
const liveGames = [];
function stopLiveGames() {
  while (liveGames.length) {
    try { liveGames.pop().stop(); } catch (e) {}
  }
}
// Same formula as the server: base cost × 1.6^owned, rounded.
function upgradeCost(u) {
  return Math.round((u.cost || 0) * Math.pow(1.6, u.owned || 0));
}
function gamePieceHTML(p, i) {
  const ups = (p.upgrades || []).map((u, ui) => {
    const cost = upgradeCost(u);
    const fx = [u.tap ? `+${u.tap}/tap` : null, u.sec ? `+${u.sec}/sec` : null]
      .filter(Boolean).join(' ');
    const afford = cost <= (p.points || 0);
    return `<div class="gm-up">
      <div class="gm-body"><div class="gm-name">${esc(u.name)}${u.owned ? ` <span style="color:#8e8e96">×${u.owned}</span>` : ''}</div>
      <div class="gm-fx">${esc(fx)} · ${cost} pts</div></div>
      <button data-gamebuy="${i}:${ui}" class="${afford ? '' : 'cant'}">Buy</button>
    </div>`;
  }).join('');
  return `<div class="piece">
    <div class="gm-points" data-gm-points="${i}">${p.points || 0}</div>
    <div class="gm-rates" data-gm-rates="${i}">+${p.per_tap || 1}/tap · +${p.per_second || 0}/sec</div>
    <button class="gm-tap" data-gmtap="${i}">TAP +${p.per_tap || 1}</button>
    <div class="cap" style="margin-top:14px">Upgrades</div>
    ${ups || '<div class="empty">No upgrades here.</div>'}
  </div>`;
}
function wireGame(app, p, i) {
  stopLiveGames();
  const g = {
    id: app.id, pieceIdx: i,
    points: p.points || 0, perTap: p.per_tap || 1, perSec: p.per_second || 0,
    owned: (p.upgrades || []).map(u => u.owned || 0),
    dirty: false,
  };
  const pointsEl = document.querySelector(`#focusbody [data-gm-points="${i}"]`);
  const ratesEl = document.querySelector(`#focusbody [data-gm-rates="${i}"]`);
  const tapBtn = document.querySelector(`#focusbody [data-gmtap="${i}"]`);
  const render = () => {
    if (pointsEl) pointsEl.textContent = g.points;
    if (ratesEl) ratesEl.textContent = `+${g.perTap}/tap · +${g.perSec}/sec`;
    if (tapBtn) tapBtn.textContent = `TAP +${g.perTap}`;
  };
  const sync = () => {
    if (!g.dirty) return;
    g.dirty = false;
    call({ op: 'game_sync', id: g.id, piece: g.pieceIdx,
      points: g.points, per_tap: g.perTap, per_second: g.perSec, owned: g.owned });
    refreshData();
  };
  document.querySelectorAll(`#focusbody [data-gamebuy^="${i}:"]`).forEach(b => {
    b.onclick = () => {
      const ui = +b.dataset.gamebuy.split(':')[1];
      // Flush local play first so the server prices against the true score.
      sync();
      const r = call({ op: 'game_buy', id: g.id, piece: i, upgrade: ui });
      if (r && r.app) {
        const np = (r.app.pieces || []).find(pp => pp.kind === 'game');
        if (np) {
          g.points = np.points || 0; g.perTap = np.per_tap || 1; g.perSec = np.per_second || 0;
          g.owned = (np.upgrades || []).map(x => x.owned || 0);
          g.dirty = false;
        }
        renderPiecesFocus(g.id); // refreshes prices + affordability
      }
    };
  });
  if (tapBtn) tapBtn.onclick = () => { g.points += g.perTap; g.dirty = true; render(); };
  const tick = setInterval(() => {
    if (g.perSec > 0) { g.points += g.perSec; g.dirty = true; render(); }
  }, 1000);
  const syncIv = setInterval(sync, 5000);
  const onHide = () => sync();
  document.addEventListener('visibilitychange', onHide);
  window.addEventListener('pagehide', onHide);
  liveGames.push({
    stop() {
      clearInterval(tick); clearInterval(syncIv);
      document.removeEventListener('visibilitychange', onHide);
      window.removeEventListener('pagehide', onHide);
      sync();
    }
  });
}

/* ---------- gallery: photo grid, fullscreen viewer, slideshow ---------- */
function galleryPieceHTML(p, i) {
  const photos = p.items || [];
  const thumbs = photos.map((ph, ti) =>
    `<img class="gal-thumb" data-galthumb="${i}:${ti}" src="${esc(ph.image)}" alt="${esc(ph.title || 'Photo')}">`).join('');
  return `<div class="piece">
    ${photos.length
      ? `<div class="gal-grid">${thumbs}</div>`
      : `<div class="empty">Add photos to start your slideshow.</div>`}
    <div class="gal-tools">
      <button data-galadd="${i}">＋ Add photos</button>
      <input type="file" accept="image/*" multiple hidden data-galfile="${i}">
      ${photos.length > 1 ? `<button data-galshow="${i}">▶ Slideshow</button>` : ''}
    </div>
  </div>`;
}
function wireGallery(app, p, i) {
  const photos = p.items || [];
  const addBtn = document.querySelector(`#focusbody [data-galadd="${i}"]`);
  const fileInp = document.querySelector(`#focusbody [data-galfile="${i}"]`);
  if (addBtn && fileInp) {
    addBtn.onclick = () => fileInp.click();
    fileInp.onchange = async () => {
      const files = [...(fileInp.files || [])];
      if (!files.length) return;
      try {
        for (const f of files) {
          const d = await downscale(f);
          call({ op: 'gallery_add_photo', id: app.id, piece: i,
            name: (f.name || 'Photo').replace(/\.[^.]+$/, ''), dataUrl: d.dataUrl, w: d.w, h: d.h });
        }
        refreshData(); renderPiecesFocus(app.id);
      } catch (e) { showError('Could not read that photo. Try another.'); }
    };
  }
  document.querySelectorAll(`#focusbody [data-galthumb^="${i}:"]`).forEach(t => {
    t.onclick = () => openViewer(photos, +t.dataset.galthumb.split(':')[1], false);
  });
  const showBtn = document.querySelector(`#focusbody [data-galshow="${i}"]`);
  if (showBtn) showBtn.onclick = () => openViewer(photos, 0, true);
}

function renderPiecesFocus(id) {
  const res = call({ op: 'get', id });
  if (!res || !res.app) { refresh(); return; }
  const app = res.app;
  let html = `<h1 style="font-size:30px;margin:0 0 8px">${esc(app.name)}</h1>
    <div class="saved">Saved · version ${app.rev}</div>
    <button class="rebuildbtn" data-rebuild="${app.id}">↻ Rebuild with the newest composer</button>`;
  (app.pieces || []).forEach((p, i) => {
    html += p.kind === 'notes' ? notesPieceHTML(p, i)
      : p.kind === 'voxel' ? voxelPieceHTML(p, i)
      : p.kind === 'collection' ? collectionPieceHTML(p, i)
      : p.kind === 'game' ? gamePieceHTML(p, i)
      : p.kind === 'gallery' ? galleryPieceHTML(p, i)
      : unknownPieceHTML(p);
  });
  $('focusbody').innerHTML = html;
  wirePiecesFocus(app);
  (app.pieces || []).forEach((p, i) => {
    if (p.kind === 'voxel') wireVoxel(app, p, i);
    if (p.kind === 'game') wireGame(app, p, i);
    if (p.kind === 'gallery') wireGallery(app, p, i);
  });
}

function wirePiecesFocus(app) {
  // "Rebuild with the newest composer": recompose this page in place.
  $('focusbody').querySelectorAll('[data-rebuild]').forEach(btn => {
    btn.onclick = () => {
      stopLiveGames(); closeViewer();
      const r = call({ op: 'recompose', id: btn.dataset.rebuild });
      if (r) {
        refreshData(); renderPiecesFocus(app.id);
        if (r.message) showNotice(r.message);
      }
    };
  });
  // Choice chips: single-select, writes into the hidden input.
  $('focusbody').querySelectorAll('.choicechip').forEach(ch => {
    ch.onclick = () => {
      const p = ch.dataset.p, f = ch.dataset.field;
      document.querySelectorAll(`#focusbody .choicechip[data-p="${p}"][data-field="${f}"]`)
        .forEach(c => c.classList.remove('sel'));
      ch.classList.add('sel');
      document.querySelector(`#focusbody input[data-p="${p}"][data-field="${f}"]`).value = ch.dataset.val;
    };
  });
  // Photo fields: pick → downscale → keep the data URL on the input.
  $('focusbody').querySelectorAll('input[data-ftype="photo"]').forEach(inp => {
    inp.onchange = async () => {
      const f = inp.files && inp.files[0];
      if (!f) return;
      try {
        const d = await downscale(f);
        inp.dataset.dataurl = d.dataUrl;
        const prev = document.querySelector(`#focusbody img[data-preview="${inp.dataset.p}-${inp.dataset.field}"]`);
        if (prev) { prev.src = d.dataUrl; prev.style.display = 'block'; }
      } catch (e) { showError('Could not read that photo. Try another.'); }
    };
  });
  // Add a row to a collection piece.
  $('focusbody').querySelectorAll('[data-addrow]').forEach(btn => {
    btn.onclick = () => {
      const i = +btn.dataset.addrow;
      const r = call({ op: 'add_row', id: app.id, piece: i, row: collectRow(i, app.pieces[i]) });
      if (r) { refreshData(); renderPiecesFocus(app.id); }
    };
  });
  // Add a note to a notes piece.
  $('focusbody').querySelectorAll('[data-addnote]').forEach(btn => {
    btn.onclick = () => {
      const i = +btn.dataset.addnote;
      const title = document.querySelector(`#focusbody [data-p="${i}"][data-nfield="title"]`).value;
      const body = document.querySelector(`#focusbody [data-p="${i}"][data-nfield="body"]`).value;
      if (!title.trim() && !body.trim()) { showError('Write something first.'); return; }
      const r = call({ op: 'add_row', id: app.id, piece: i, row: { title, body } });
      if (r) { refreshData(); renderPiecesFocus(app.id); }
    };
  });
  // Add a typed field to a collection piece.
  $('focusbody').querySelectorAll('[data-addfield]').forEach(btn => {
    btn.onclick = () => {
      const i = +btn.dataset.addfield;
      const field = document.querySelector(`#focusbody [data-newfield="${i}"]`).value.trim();
      const type = document.querySelector(`#focusbody [data-newtype="${i}"]`).value;
      const options = document.querySelector(`#focusbody [data-newopts="${i}"]`).value
        .split(',').map(s => s.trim()).filter(Boolean);
      if (!field) { showError('Give the new field a name first.'); return; }
      const r = call({ op: 'add_field', id: app.id, piece: i, field, type, options });
      if (r) { refreshData(); renderPiecesFocus(app.id); }
    };
  });
  // Show the choices box only when the type is choice.
  $('focusbody').querySelectorAll('[data-newtype]').forEach(sel => {
    sel.onchange = () => {
      const i = sel.dataset.newtype;
      document.querySelector(`#focusbody [data-optrow="${i}"]`).style.display =
        sel.value === 'choice' ? 'block' : 'none';
    };
  });
}

$('startover').onclick = () => {
  try { localStorage.removeItem(STORE_KEY); } catch (e) {}
  mem.store = '';
  state.items = [];
  renderHome();
};

async function boot() {
  try { await init(); }
  catch (e) {
    $('boot').textContent = 'Could not start. Check your connection and reload.';
    return;
  }
  $('boot').style.display = 'none';
  $('app').style.display = 'block';
  // Auto-migrate: stale, pristine pages get rebuilt with the newer
  // composer. One honest banner if anything changed; never blocks boot.
  try {
    const mig = callQuiet({ op: 'auto_migrate' });
    if (mig && mig.count > 0) {
      showNotice(`I rebuilt ${mig.count} of your pages with the newer composer — everything you had is still there.`);
    }
  } catch (e) {}
  refresh();
  // Self-update watch: a stale tab announces the newer build.
  checkForUpdate();
  setInterval(checkForUpdate, 5 * 60 * 1000);
}
boot();
</script>
</body>
</html>
