<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moor — keep track of anything</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: #101014; color: #f2f2f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 18px; line-height: 1.45;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 20px 18px 60px; }
  .brand { font-size: 14px; letter-spacing: .18em; text-transform: uppercase; color: #8e8e96; margin: 6px 0 26px; }
  h1 { font-size: 30px; margin: 0 0 8px; letter-spacing: -0.01em; }
  h2 { font-size: 22px; margin: 26px 0 10px; }
  p.sub { color: #b9b9c2; margin: 0 0 18px; }
  label { display: block; font-size: 15px; color: #b9b9c2; margin: 14px 0 6px; }
  input[type=text] {
    width: 100%; font-size: 18px; padding: 14px 16px; min-height: 54px;
    border-radius: 14px; border: 1px solid #2c2c34; background: #1a1a21; color: #fff;
  }
  input[type=text]:focus { outline: none; border-color: #7c6cf0; }
  button {
    display: block; width: 100%; margin-top: 12px; padding: 15px; min-height: 56px;
    font-size: 19px; font-weight: 600; border: 0; border-radius: 14px;
    background: #7c6cf0; color: #fff; cursor: pointer;
  }
  button:active { background: #6a5ade; }
  button.ghost { background: transparent; border: 1px solid #2c2c34; color: #b9b9c2; font-weight: 500; font-size: 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
  .chip {
    padding: 8px 14px; border-radius: 999px; background: #1e1e26;
    border: 1px solid #2c2c34; font-size: 15px; color: #d7d7de;
  }
  .saved { color: #9fe6a0; font-size: 15px; margin: 2px 0 4px; }
  .card {
    background: #1a1a21; border: 1px solid #26262e; border-radius: 14px;
    padding: 14px 16px; margin: 10px 0;
  }
  .card .k { color: #8e8e96; font-size: 14px; }
  .card .v { font-size: 18px; margin-bottom: 6px; word-break: break-word; }
  .card .v:last-child { margin-bottom: 0; }
  .examples { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .examples button { width: auto; margin: 0; padding: 10px 16px; min-height: 44px; font-size: 15px; background: #23232c; }
  #error {
    display: none; background: #3a1d1d; border: 1px solid #7a2e2e; color: #ffb4b4;
    border-radius: 12px; padding: 12px 14px; margin: 14px 0; font-size: 16px;
  }
  .honest { margin-top: 30px; padding-top: 18px; border-top: 1px solid #23232b; color: #b9b9c2; font-size: 16px; }
  footer { margin-top: 26px; color: #6e6e78; font-size: 13px; line-height: 1.5; }
  .rowline { display: flex; gap: 10px; }
  .rowline input { flex: 1; }
  .rowline button { width: auto; margin-top: 0; padding: 14px 22px; white-space: nowrap; }
  .startover { margin-top: 34px; text-align: center; }
  .startover button { background: none; border: none; color: #6e6e78; font-size: 14px; font-weight: 400; min-height: 44px; }
  #boot { color: #8e8e96; padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">Moor</div>
  <div id="error" role="alert"></div>
  <div id="boot">Loading…</div>
  <div id="app" style="display:none"></div>
  <footer id="foot" style="display:none">
    Running the real MOOR core (Rust, in your browser). Saved on this phone —
    close the tab and come back, your stuff is still here.
  </footer>
</div>

<script type="module">
import init, { handle } from './pkg/moor_web.js';

const STORE_KEY = 'moor-core-v0-store';
const APP_KEY = 'moor-core-v0-app';
const mem = { store: '', app: '' };

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/>/g, '&gt;').replace(/"/g, '&quot;');

function lsGet(k) {
  try { const v = localStorage.getItem(k); return v === null ? '' : v; }
  catch (e) { return k === STORE_KEY ? mem.store : mem.app; }
}
function lsSet(k, v) {
  try { localStorage.setItem(k, v); }
  catch (e) { if (k === STORE_KEY) mem.store = v; else mem.app = v; }
}
function lsClear() {
  try { localStorage.removeItem(STORE_KEY); localStorage.removeItem(APP_KEY); } catch (e) {}
  mem.store = ''; mem.app = '';
}

function showError(msg) { const e = $('error'); e.textContent = msg; e.style.display = 'block'; }
function clearError() { const e = $('error'); e.style.display = 'none'; e.textContent = ''; }

/* The only bridge to the core. Dumb by design: send command, keep the
   returned snapshot, render the result. */
function call(cmd) {
  let out;
  try {
    out = JSON.parse(handle(lsGet(STORE_KEY), JSON.stringify(cmd)));
  } catch (e) {
    showError('Something went wrong talking to the core. Try again.');
    return null;
  }
  if (!out.ok) { showError(out.error); return null; }
  clearError();
  lsSet(STORE_KEY, out.store);
  return out.result;
}

function fieldInputs(fields) {
  return fields.map(f =>
    `<label>${esc(f)}<input type="text" data-field="${esc(f)}" autocomplete="off"></label>`
  ).join('');
}

function renderApp(app) {
  const cards = app.rows.map(r =>
    `<div class="card">` + app.fields.map(f =>
      `<div class="k">${esc(f)}</div><div class="v">${esc(r[f] || '')}</div>`
    ).join('') + `</div>`
  ).join('');

  $('app').innerHTML = `
    <h1>${esc(app.name)}</h1>
    <div class="saved">Saved · version ${app.rev}</div>
    <div class="chips">${app.fields.map(f => `<span class="chip">${esc(f)}</span>`).join('')}</div>
    <h2>Rows (${app.row_count})</h2>
    <div id="rows">${cards || '<p class="sub">Nothing here yet — add your first row below.</p>'}</div>
    <h2>Add a row</h2>
    <div id="addform">${fieldInputs(app.fields)}</div>
    <button id="addbtn">Add</button>
    <h2>Add a field</h2>
    <p class="sub">Grows the tracker without touching your existing rows.</p>
    <div class="rowline">
      <input type="text" id="newfield" placeholder="e.g. phone" autocomplete="off">
      <button id="fieldbtn">Add field</button>
    </div>
    <div class="honest">Close this tab and come back — your stuff is still here. That's the whole point.</div>
    <div class="startover"><button id="startover">start over</button></div>
  `;

  $('addbtn').onclick = () => {
    const row = {};
    document.querySelectorAll('#addform input').forEach(i => { row[i.dataset.field] = i.value; });
    const res = call({ op: 'add_row', id: app.id, row });
    if (res) renderApp(res.app);
  };
  $('fieldbtn').onclick = () => {
    const field = $('newfield').value.trim();
    if (!field) { showError('Give the new field a name first.'); return; }
    const res = call({ op: 'add_field', id: app.id, field });
    if (res) renderApp(res.app);
  };
  $('startover').onclick = () => { lsClear(); renderMake(); };
}

function renderMake() {
  lsSet(APP_KEY, '');
  $('app').innerHTML = `
    <h1>What do you want to keep track of?</h1>
    <p class="sub">Say it in plain words. Moor builds the tracker and remembers it.</p>
    <input type="text" id="req" placeholder="customer tracker with fields name, email, status" autocomplete="off">
    <button id="makebtn">Make it</button>
    <div class="examples">
      <button data-ex="customer tracker with fields name, email, status">Customer tracker</button>
      <button data-ex="reading list with fields title, author">Reading list</button>
    </div>
  `;
  const go = (request) => {
    const res = call({ op: 'compile', request });
    if (res) { lsSet(APP_KEY, res.app.id); renderApp(res.app); }
  };
  $('makebtn').onclick = () => go($('req').value);
  $('req').onkeydown = (e) => { if (e.key === 'Enter') go($('req').value); };
  document.querySelectorAll('[data-ex]').forEach(b => { b.onclick = () => go(b.dataset.ex); });
}

async function boot() {
  try {
    await init();
  } catch (e) {
    $('boot').textContent = 'Could not start. Check your connection and reload.';
    return;
  }
  $('boot').style.display = 'none';
  $('app').style.display = 'block';
  $('foot').style.display = 'block';
  const appId = lsGet(APP_KEY);
  if (appId) {
    const res = call({ op: 'get', id: appId });
    if (res && res.app) { renderApp(res.app); return; }
  }
  renderMake();
}

boot();
</script>
</body>
</html>
