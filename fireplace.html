<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0805">
<title>Fireplace Studio v3 — Real 3D</title>
<style>
  :root{
    --accent:#ffb35c; --accent2:#ff7a2f;
    --ink:#f5e9d8; --ink-dim:rgba(240,220,195,.60);
    --glass:rgba(16,10,6,.60); --glass-brd:rgba(255,180,120,.20);
    --pill:rgba(30,20,12,.72);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;background:#0d0805;overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
  #stage{position:fixed;inset:0;overflow:hidden;background:#0d0805}
  #scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .glass{background:var(--glass);border:1px solid var(--glass-brd);border-radius:18px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 10px 34px rgba(0,0,0,.45)}
  #topbar{position:absolute;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:10px;padding:8px 10px 8px 16px;z-index:10;
    max-width:calc(100vw - 24px);flex-wrap:wrap;justify-content:center}
  .brand{font-weight:700;font-size:15px;letter-spacing:.4px;white-space:nowrap}
  .brand .ver{font-size:10px;font-weight:600;color:var(--ink-dim);border:1px solid var(--glass-brd);
    border-radius:8px;padding:2px 6px;margin-left:6px;vertical-align:2px}
  .iconbtn{border:1px solid transparent;background:transparent;color:var(--ink);font-size:16px;
    border-radius:10px;padding:5px 8px;cursor:pointer;line-height:1}
  .iconbtn:hover{background:rgba(255,180,120,.14)}
  #hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:9;
    font-size:11.5px;color:rgba(240,220,195,.40);letter-spacing:.6px;white-space:nowrap}
  #nogl{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:30px;
    color:#f5e9d8;font-size:15px;z-index:20}
  #stage:fullscreen #topbar,#stage:fullscreen #hint{display:none}
  #stage:fullscreen #scene{cursor:none}
  @media (max-width:760px){ .brand span.t{display:none} #hint{display:none} }
</style>
</head>
<body>
<div id="stage">
  <canvas id="scene"></canvas>
  <header id="topbar" class="glass">
    <div class="brand">🔥 Fireplace Studio <span class="ver">v3 · 3D</span></div>
    <button class="iconbtn" id="fullBtn" title="Fullscreen (F)">⛶</button>
  </header>
  <div id="hint">H hide UI &nbsp;·&nbsp; F fullscreen &nbsp;·&nbsp; drag seed pill for console</div>
  <div id="nogl"><div><h2>WebGL2 unavailable</h2><p>This studio needs WebGL2. Try a different browser.</p></div></div>
</div>
<script>
/* ============================================================
   FPFrames v1 — deterministic framed artwork for Fireplace Studio
   ------------------------------------------------------------
   Self-contained. No FORGE dependency at runtime: the 30 artworks
   are baked into art/fireplace-frames.jpg (5x6 grid, 320x400 cells).

   Selection is a pure function of the studio seed string
   (the "#3"+8-hex 13-parameter packing is READ ONLY, never modified).

   - build(seedString)      -> frames[] (pure JS, no GL)
   - buildHost(frames, draw, M_BOX) -> pushes molding/mat/backing
        boxes through the host's own draw() (full lit shading +
        shadows for free). Exactly 5 host draws per frame.
   - create(gl) / loadAtlas(FH,url) / setArt(FH,frames) /
     render(FH,view,proj,tint) -> the artwork itself as ONE
        batched draw call (all quads, one VBO, one texture).

   Wall: back/entry wall face at z = -4.0 (x in [-5.2,5.2]).
   Fireplace wall and glass are never used.

   If the atlas is missing, frames degrade to a dark placeholder —
   the scene never breaks.
   ============================================================ */
(function (global) {
'use strict';

var ART_COUNT = 30;
var GRID_C = 5, GRID_R = 6;
var ATLAS_URL = 'art/fireplace-frames.jpg';
var WALL_Z = -4.0;          // back wall face
var ART_Z  = -3.978;        // art quad plane (recessed behind molding front)

/* ---------------- deterministic RNG ---------------- */
function fnv1a(str) {
  var h = 0x811c9dc5;
  var s = 'fp-frames-v1:' + str;
  for (var i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return h >>> 0;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffled(rng, n) {
  var a = [], i, j, t;
  for (i = 0; i < n; i++) a.push(i);
  for (i = n - 1; i > 0; i--) { j = (rng() * (i + 1)) | 0; t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}

/* ---------------- artwork UVs (GL convention, v-up) ---------------- */
function artUV(i) {
  var c = i % GRID_C, r = (i / GRID_C) | 0;
  return [c / GRID_C, 1 - (r + 1) / GRID_R, (c + 1) / GRID_C, 1 - r / GRID_R];
}

/* ---------------- 30 placement presets ----------------
   Generated deterministically with a FIXED salt so the set is stable
   across runs and seeds. Each preset: {kind, mixed, rects:[{x,y,w,h}]}.
   Frame counts: singles 8, medium 6, pairs 6, triptych 6, quad 8,
   salon 6-8. All rects validated non-overlapping (see test). */
var PRESETS = (function genPresets() {
  var rng = mulberry32(fnv1a('fp-presets-v1'));
  var P = [];
  function F(x, y, w) { return { x: x, y: y, w: w, h: w * 1.25 }; }
  function clear(rs, r, m) {
    for (var i = 0; i < rs.length; i++) {
      var o = rs[i];
      if (Math.abs(o.x - r.x) < (o.w + r.w) / 2 + m &&
          Math.abs(o.y - r.y) < (o.h + r.h) / 2 + m) return false;
    }
    return true;
  }
  function inWall(r) {
    return (r.x - r.w / 2 > -5.0) && (r.x + r.w / 2 < 5.0) &&
           (r.y - r.h / 2 > 0.70) && (r.y + r.h / 2 < 2.90);
  }
  var v, i, t, rs, ok, r, w, x0, x1, cy;

  /* 8 singles: loose gallery rows of 8 small frames */
  for (v = 0; v < 8; v++) {
    rs = []; ok = false; t = 0;
    while (!ok && t++ < 300) {
      rs = []; w = 0.44 + rng() * 0.10;
      x0 = -4.55 + rng() * 0.3; x1 = 4.55 - rng() * 0.3; cy = 1.85 + rng() * 0.30;
      for (i = 0; i < 8; i++) {
        r = F(x0 + (x1 - x0) * i / 7 + (rng() - 0.5) * 0.15, cy + (rng() - 0.5) * 0.30, w);
        if (!inWall(r) || !clear(rs, r, 0.10)) break;
        rs.push(r);
      }
      ok = rs.length === 8;
    }
    P.push({ kind: 'singles', mixed: false, rects: rs });
  }
  /* 6 medium: rows of 6 medium frames */
  for (v = 0; v < 6; v++) {
    rs = []; ok = false; t = 0;
    while (!ok && t++ < 300) {
      rs = []; w = 0.60 + rng() * 0.10;
      x0 = -4.35 + rng() * 0.3; x1 = 4.35 - rng() * 0.3; cy = 1.85 + rng() * 0.25;
      for (i = 0; i < 6; i++) {
        r = F(x0 + (x1 - x0) * i / 5 + (rng() - 0.5) * 0.10, cy + (rng() - 0.5) * 0.22, w);
        if (!inWall(r) || !clear(rs, r, 0.12)) break;
        rs.push(r);
      }
      ok = rs.length === 6;
    }
    P.push({ kind: 'medium', mixed: false, rects: rs });
  }
  /* 6 pairs: 3 pair clusters */
  for (v = 0; v < 6; v++) {
    rs = []; ok = false; t = 0;
    while (!ok && t++ < 300) {
      rs = []; w = 0.48 + rng() * 0.08;
      var gap = 0.16 + rng() * 0.06;
      var cxs = [-3.1 + rng() * 0.6, 0.1 + (rng() - 0.5) * 0.8, 3.2 + (rng() - 0.5) * 0.6];
      cy = 1.90 + rng() * 0.2;
      for (i = 0; i < 3; i++) {
        var y = cy + (rng() - 0.5) * 0.18;
        var r1 = F(cxs[i] - (w / 2 + gap / 2), y, w);
        var r2 = F(cxs[i] + (w / 2 + gap / 2), y + (rng() - 0.5) * 0.06, w);
        if (!inWall(r1) || !inWall(r2) || !clear(rs, r1, 0.12) || !clear(rs, r2, 0.12)) break;
        rs.push(r1, r2);
      }
      ok = rs.length === 6;
    }
    P.push({ kind: 'pairs', mixed: false, rects: rs });
  }
  /* 4 triptychs: 2 triptych clusters */
  for (v = 0; v < 4; v++) {
    rs = []; ok = false; t = 0;
    while (!ok && t++ < 300) {
      rs = []; w = 0.44 + rng() * 0.06;
      var gap2 = 0.13 + rng() * 0.05;
      var tcx = [-2.5 + rng() * 0.8, 2.5 + (rng() - 0.5) * 0.8];
      cy = 1.90 + rng() * 0.2;
      for (i = 0; i < 2; i++) {
        var y2 = cy + (rng() - 0.5) * 0.16;
        for (var k = -1; k <= 1; k++) {
          r = F(tcx[i] + k * (w + gap2), y2, w);
          if (!inWall(r) || !clear(rs, r, 0.12)) break;
          rs.push(r);
        }
        if (rs.length !== (i + 1) * 3) break;
      }
      ok = rs.length === 6;
    }
    P.push({ kind: 'triptych', mixed: false, rects: rs });
  }
  /* 3 quads: two 2x2 grids */
  for (v = 0; v < 3; v++) {
    rs = []; ok = false; t = 0;
    while (!ok && t++ < 300) {
      rs = []; w = 0.48 + rng() * 0.06;
      var g2 = 0.14 + rng() * 0.04;
      var gcx = [-2.6 + rng() * 0.7, 2.6 + (rng() - 0.5) * 0.7];
      var gcy = [1.90 + rng() * 0.15, 1.90 + rng() * 0.15];
      for (i = 0; i < 2; i++) {
        for (var a = -1; a <= 1; a += 2) for (var b = -1; b <= 1; b += 2) {
          r = F(gcx[i] + a * (w + g2) / 2, gcy[i] + b * (w * 1.25 + g2) / 2, w);
          if (!inWall(r) || !clear(rs, r, 0.12)) break;
          rs.push(r);
        }
        if (rs.length !== (i + 1) * 4) break;
      }
      ok = rs.length === 8;
    }
    P.push({ kind: 'quad', mixed: false, rects: rs });
  }
  /* 3 salon: 6-8 mixed-size scattered frames */
  for (v = 0; v < 3; v++) {
    rs = []; ok = false; t = 0;
    var target = 6 + ((rng() * 3) | 0);
    while (!ok && t++ < 600) {
      rs = [];
      for (i = 0; i < target; i++) {
        w = 0.40 + rng() * 0.26;
        r = F(-4.5 + rng() * 9.0, 1.15 + rng() * 1.30, w);
        if (!inWall(r) || !clear(rs, r, 0.12)) break;
        rs.push(r);
      }
      ok = rs.length === target;
    }
    P.push({ kind: 'salon', mixed: true, rects: rs });
  }
  return P;
})();

/* ---------------- frame styles ---------------- */
var STYLES = [
  { name: 'black',  mold: 0.035, mat: 7, tint: [0.06, 0.06, 0.07],  matBoard: true,  matTint: [0.88, 0.86, 0.80] },
  { name: 'oak',    mold: 0.050, mat: 1, tint: [0.55, 0.40, 0.26],  matBoard: true,  matTint: [0.93, 0.92, 0.88] },
  { name: 'walnut', mold: 0.045, mat: 1, tint: [0.30, 0.20, 0.14],  matBoard: true,  matTint: [0.88, 0.86, 0.80] },
  { name: 'white',  mold: 0.040, mat: 3, tint: [0.92, 0.90, 0.86],  matBoard: true,  matTint: [0.95, 0.94, 0.90] },
  { name: 'brass',  mold: 0.030, mat: 7, tint: [0.72, 0.53, 0.20],  matBoard: false, matTint: [0.90, 0.88, 0.82] },
];
var MAT_MARGIN = 0.06;

/* ---------------- build(seedString) -> frames ---------------- */
function build(seedString) {
  var rng = mulberry32(fnv1a(String(seedString)));
  var pOrder = shuffled(rng, PRESETS.length);
  var preset = PRESETS[pOrder[0]];
  var deck = shuffled(rng, ART_COUNT);
  var frames = [];
  var primStyle = (rng() * STYLES.length) | 0;
  for (var i = 0; i < preset.rects.length; i++) {
    var rc = preset.rects[i];
    var si = preset.mixed && rng() < 0.45 ? ((rng() * STYLES.length) | 0) : primStyle;
    var uv = artUV(deck[i]);
    frames.push({
      x: rc.x, y: rc.y, w: rc.w, h: rc.h,
      art: deck[i], style: si,
      u0: uv[0], v0: uv[1], u1: uv[2], v1: uv[3],
    });
  }
  return frames;
}

/* ---------------- host geometry (molding + mat + backing) ----------------
   Exactly 5 draw() calls per frame:
     1 backing (or mat board), 4 molding rails. */
function buildHost(frames, draw, M_BOX) {
  var n = 0;
  for (var i = 0; i < frames.length; i++) {
    var f = frames[i], st = STYLES[f.style];
    var mw = st.mold;
    var iw = f.w + (st.matBoard ? MAT_MARGIN * 2 : 0.012);
    var ih = f.h + (st.matBoard ? MAT_MARGIN * 2 : 0.012);
    var ow = iw + mw * 2, oh = ih + mw * 2;
    var zc = WALL_Z + 0.015; // molding center: spans [-4.0,-3.97]
    if (st.matBoard) {
      draw(M_BOX, f.x, f.y, WALL_Z + 0.006, iw, ih, 0.012, 5, { tintA: st.matTint, rough: 0.95 });
    } else {
      draw(M_BOX, f.x, f.y, WALL_Z + 0.006, iw, ih, 0.012, 3, { tintA: [0.10, 0.10, 0.10], rough: 0.9 });
    }
    n++;
    var mz = zc;
    draw(M_BOX, f.x, f.y + oh / 2 - mw / 2, mz, ow, mw, 0.03, st.mat, { tintA: st.tint, rough: 0.55 });
    draw(M_BOX, f.x, f.y - oh / 2 + mw / 2, mz, ow, mw, 0.03, st.mat, { tintA: st.tint, rough: 0.55 });
    draw(M_BOX, f.x - ow / 2 + mw / 2, f.y, mz, mw, oh - 2 * mw, 0.03, st.mat, { tintA: st.tint, rough: 0.55 });
    draw(M_BOX, f.x + ow / 2 - mw / 2, f.y, mz, mw, oh - 2 * mw, 0.03, st.mat, { tintA: st.tint, rough: 0.55 });
    n += 4;
  }
  return n;
}

/* ---------------- GL: batched art quads, one draw call ---------------- */
var VS_SRC = '#version 300 es\n' +
  'layout(location=0) in vec3 aPos;\n' +
  'layout(location=1) in vec2 aUV;\n' +
  'uniform mat4 uProj; uniform mat4 uView;\n' +
  'out vec2 vUV;\n' +
  'void main(){ vUV=aUV; gl_Position=uProj*uView*vec4(aPos,1.0); }\n';
var FS_SRC = '#version 300 es\n' +
  'precision highp float;\n' +
  'in vec2 vUV; uniform sampler2D uTex; uniform vec3 uTint;\n' +
  'out vec4 oC;\n' +
  'void main(){ vec3 c=texture(uTex,vUV).rgb; oC=vec4(c*uTint,1.0); }\n';

function compile(gl, type, src) {
  var s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    var log = gl.getShaderInfoLog(s); gl.deleteShader(s);
    throw new Error('FPFrames shader: ' + log);
  }
  return s;
}

function create(gl) {
  var prog = gl.createProgram();
  gl.attachShader(prog, compile(gl, gl.VERTEX_SHADER, VS_SRC));
  gl.attachShader(prog, compile(gl, gl.FRAGMENT_SHADER, FS_SRC));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS))
    throw new Error('FPFrames link: ' + gl.getProgramInfoLog(prog));
  var vao = gl.createVertexArray();
  var vbo = gl.createBuffer();
  var ibo = gl.createBuffer();
  gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 20, 0);
  gl.enableVertexAttribArray(1);
  gl.vertexAttribPointer(1, 2, gl.FLOAT, false, 20, 12);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo);
  gl.bindVertexArray(null);
  /* 1x1 dark placeholder until the atlas loads */
  var tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE,
    new Uint8Array([14, 13, 15, 255]));
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  return {
    gl: gl, prog: prog, vao: vao, vbo: vbo, ibo: ibo, tex: tex,
    ready: false, nquads: 0,
    uProj: gl.getUniformLocation(prog, 'uProj'),
    uView: gl.getUniformLocation(prog, 'uView'),
    uTex: gl.getUniformLocation(prog, 'uTex'),
    uTint: gl.getUniformLocation(prog, 'uTint'),
  };
}

function loadAtlas(FH, url) {
  var gl = FH.gl;
  var img = new Image();
  img.onload = function () {
    gl.bindTexture(gl.TEXTURE_2D, FH.tex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    FH.ready = true;
  };
  img.onerror = function () { FH.ready = false; /* placeholder stays */ };
  img.src = url || ATLAS_URL;
}

function setArt(FH, frames) {
  var gl = FH.gl;
  var verts = new Float32Array(frames.length * 4 * 5);
  var idx = new Uint16Array(frames.length * 6);
  for (var i = 0; i < frames.length; i++) {
    var f = frames[i], hw = f.w / 2, hh = f.h / 2, o = i * 20;
    verts[o + 0] = f.x - hw; verts[o + 1] = f.y - hh; verts[o + 2] = ART_Z;
    verts[o + 3] = f.u0;     verts[o + 4] = f.v0;
    verts[o + 5] = f.x + hw; verts[o + 6] = f.y - hh; verts[o + 7] = ART_Z;
    verts[o + 8] = f.u1;     verts[o + 9] = f.v0;
    verts[o + 10] = f.x + hw; verts[o + 11] = f.y + hh; verts[o + 12] = ART_Z;
    verts[o + 13] = f.u1;    verts[o + 14] = f.v1;
    verts[o + 15] = f.x - hw; verts[o + 16] = f.y + hh; verts[o + 17] = ART_Z;
    verts[o + 18] = f.u0;    verts[o + 19] = f.v1;
    var q = i * 4, e = i * 6;
    idx[e + 0] = q; idx[e + 1] = q + 1; idx[e + 2] = q + 2;
    idx[e + 3] = q; idx[e + 4] = q + 2; idx[e + 5] = q + 3;
  }
  gl.bindVertexArray(FH.vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, FH.vbo);
  gl.bufferData(gl.ARRAY_BUFFER, verts, gl.STATIC_DRAW);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, FH.ibo);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx, gl.STATIC_DRAW);
  gl.bindVertexArray(null);
  FH.nquads = frames.length;
}

function render(FH, view, proj, tint) {
  if (!FH.nquads) return 0;
  var gl = FH.gl;
  gl.useProgram(FH.prog);
  gl.uniformMatrix4fv(FH.uProj, false, proj);
  gl.uniformMatrix4fv(FH.uView, false, view);
  gl.uniform3fv(FH.uTint, tint || [1, 1, 1]);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, FH.tex);
  gl.uniform1i(FH.uTex, 0);
  gl.bindVertexArray(FH.vao);
  gl.drawElements(gl.TRIANGLES, FH.nquads * 6, gl.UNSIGNED_SHORT, 0);
  gl.bindVertexArray(null);
  return 1;
}

/* Room-light tint for the artwork: ambient plus a warm kiss from the fire.
   rig: the studio's computeRig() result ({amb:[r,g,b], fireI:number}),
   fireCol: S.fireCol ([r,g,b]), flick: S.flick (0..~1.5).
   ceilI (optional): ceiling-downlight brightness 0..1.5, adds a warm lift. */
function lightingFromRig(rig, fireCol, flick, ceilI) {
  var amb = rig.amb, fi = rig.fireI * 2.0 * flick;
  var cl = (typeof ceilI === 'number' && ceilI > 0) ? ceilI * 0.30 : 0;
  return [
    amb[0] * 0.95 + fireCol[0] * fi * 0.22 + 0.34 * cl,
    amb[1] * 0.95 + fireCol[1] * fi * 0.22 + 0.31 * cl,
    amb[2] * 0.95 + fireCol[2] * fi * 0.22 + 0.26 * cl
  ];
}

var FPFrames = {
  ART_COUNT: ART_COUNT,
  ATLAS_URL: ATLAS_URL,
  WALL_Z: WALL_Z,
  PRESETS: PRESETS,
  STYLES: STYLES,
  artUV: artUV,
  build: build,
  buildHost: buildHost,
  create: create,
  loadAtlas: loadAtlas,
  load: loadAtlas,
  setArt: setArt,
  setQuads: setArt,
  lightingFromRig: lightingFromRig,
  render: render,
};

    const shade=m?1:(0.55+0.45*pillow)*(1-mortar*0.35);
    alb[i]=clamp(cr*shade,0,1)*255; alb[i+1]=clamp(cg*shade,0,1)*255; alb[i+2]=clamp(cb*shade,0,1)*255;
    alb[i+3]=clamp(1-mortar*0.78,0,1)*255; /* stronger mortar AO */
    hgt[y*size+x]=(1-mortar)*(pillow*cfg.relief+0.25)-mortar*0.55+det*0.22;
    const rr2=clamp((m?0.95:0.80)+(blk[4]-0.5)*0.25+(det-0.5)*0.2-mortar*0.08,0.05,1);
    rgh[i]=rr2*255; rgh[i+1]=255; rgh[i+2]=255; rgh[i+3]=255;
  }
  return {alb, nrm:heightToNormal(hgt,size,2.6), rgh, size};
}
/* ---- wood planks: grain, knots, seams (neutral oak; tinted per use) ---- */
/* ---- wood planks: 512px, 8 planks, staggered butt joints, knots, per-plank tone ---- */
function bakeWood(){
  const size=512, rng=bakeRng("wood"), nz=makeVNoise(rng), fbm=fbmFactory(nz);
  const planks=8, ph=size/planks; /* 64px: divides evenly -> tileable in y */
  const alb=new Uint8Array(size*size*4), hgt=new Float32Array(size*size), rgh=new Uint8Array(size*size*4);
  const knots=[]; for(let k=0;k<14;k++) knots.push([rng()*size,rng()*size,4+rng()*7]);
  const pTone=[], pHue=[], joints=[];
  for(let p=0;p<planks;p++){
    pTone.push(0.86+rng()*0.28); pHue.push((rng()-0.5)*0.06);
    const jn=1+((rng()*2)|0), jj=[];
    for(let j=0;j<jn;j++) jj.push(rng()*size);
    joints.push(jj);
  }
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const pl=Math.min(planks-1,(y/ph)|0);
    const seam=sstep(3.0,0.8,Math.min(y-pl*ph,(pl+1)*ph-y));
    let dj=1e9; for(const jx of joints[pl]){ const d=Math.abs(x-jx); if(d<dj) dj=d; }
    const bj=sstep(1.8,0.5,dj); /* recessed butt joint */
    const g=fbm(x*0.006,(y+pl*37)*0.045,4);
    const g2=fbm(x*0.025,y*0.175+pl*11,3);
    const fiber=Math.sin(x*0.11+g*9.0+pl*2.1)*0.5+0.5; /* fine grain lines */
    let tone=(0.80+g*0.40)*pTone[pl]+(fiber-0.5)*0.10+(g2-0.5)*0.14;
    let kd=1e9; for(const k of knots){ const d=Math.hypot(x-k[0],y-k[1])/k[2]; if(d<kd)kd=d; }
    const knot=sstep(1.4,0.5,kd);
    tone*=1-knot*0.45;
    const i=(y*size+x)*4;
    const sh=(1-seam*0.55)*(1-bj*0.20);
    const hue=pHue[pl];
    alb[i]=clamp((0.46+hue)*tone*sh,0,1)*255;
    alb[i+1]=clamp(0.33*tone*sh,0,1)*255;
    alb[i+2]=clamp((0.21-hue*0.5)*tone*sh,0,1)*255;
    alb[i+3]=clamp(1-seam*0.5-knot*0.2-bj*0.15,0,1)*255;
    hgt[y*size+x]=clamp((1-seam)*0.5+(1-bj)*0.25+g*0.2+fiber*0.06-knot*0.25,0,1);
    const r=clamp(0.62+(g-0.5)*0.2+seam*0.15+bj*0.1,0.05,1);
    rgh[i]=r*255; rgh[i+1]=255; rgh[i+2]=255; rgh[i+3]=255;
  }
  return {alb, nrm:heightToNormal(hgt,size,1.6), rgh, size};
}
/* ---- polished concrete: pores, trowel sweep ---- */
function bakeConcrete(){
  const size=256, rng=bakeRng("concrete"), nz=makeVNoise(rng), fbm=fbmFactory(nz);
  const alb=new Uint8Array(size*size*4), hgt=new Float32Array(size*size), rgh=new Uint8Array(size*size*4);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const d=fbm(x*0.02,y*0.02,4), d2=fbm(x*0.11+9,y*0.11,3);
    const pore=sstep(0.72,0.9,fbm(x*0.35,y*0.35,2))*sstep(0.4,0.2,d2);
    const tone=0.92+(d-0.5)*0.16-pore*0.5;
    const i=(y*size+x)*4;
    alb[i]=clamp(0.56*tone,0,1)*255; alb[i+1]=clamp(0.55*tone,0,1)*255; alb[i+2]=clamp(0.53*tone,0,1)*255;
    alb[i+3]=clamp(1-pore*0.35,0,1)*255;
    hgt[y*size+x]=d*0.3-pore*0.4;
    const r=clamp(0.42+(d-0.5)*0.25+pore*0.4,0.05,1);
    rgh[i]=r*255; rgh[i+1]=255; rgh[i+2]=255; rgh[i+3]=255;
  }
  return {alb, nrm:heightToNormal(hgt,size,1.2), rgh, size};
}
/* ---- large stone tile ---- */
function bakeTile(){
  const size=256, rng=bakeRng("tile"), nz=makeVNoise(rng), fbm=fbmFactory(nz);
  const n=2, ts=size/n;
  const alb=new Uint8Array(size*size*4), hgt=new Float32Array(size*size), rgh=new Uint8Array(size*size*4);
  const tv=[]; for(let k=0;k<n*n;k++) tv.push(0.9+rng()*0.2);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const tx=(x/ts)|0, ty=(y/ts)|0;
    const lx=x-tx*ts, ly=y-ty*ts;
    const grout=sstep(3.2,1.0,Math.min(lx,ly,ts-lx,ts-ly));
    const d=fbm(x*0.04,y*0.04,4);
    const tone=tv[ty*n+tx]*(0.9+(d-0.5)*0.2);
    const i=(y*size+x)*4;
    const sh=1-grout*0.45;
    alb[i]=clamp(0.50*tone*sh,0,1)*255; alb[i+1]=clamp(0.49*tone*sh,0,1)*255; alb[i+2]=clamp(0.47*tone*sh,0,1)*255;
    alb[i+3]=clamp(1-grout*0.6,0,1)*255;
    hgt[y*size+x]=(1-grout)*0.4+d*0.15;
    const r=clamp(0.55+(d-0.5)*0.2+grout*0.2,0.05,1);
    rgh[i]=r*255; rgh[i+1]=255; rgh[i+2]=255; rgh[i+3]=255;
  }
  return {alb, nrm:heightToNormal(hgt,size,1.4), rgh, size};
}
/* ---- bark: vertical ridged plates ---- */
function bakeBark(){
  const size=256, rng=bakeRng("bark"), nz=makeVNoise(rng), fbm=fbmFactory(nz);
  const alb=new Uint8Array(size*size*4), hgt=new Float32Array(size*size), rgh=new Uint8Array(size*size*4);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const r1=1-Math.abs(2*fbm(x*0.06,y*0.008,4)-1);
    const r2=1-Math.abs(2*fbm(x*0.16+7,y*0.02,3)-1);
    const ridge=Math.pow(r1*0.65+r2*0.35,1.5);
    const tone=0.55+ridge*0.7+(fbm(x*0.2,y*0.2,2)-0.5)*0.2;
    const i=(y*size+x)*4;
    alb[i]=clamp(0.30*tone,0,1)*255; alb[i+1]=clamp(0.21*tone,0,1)*255; alb[i+2]=clamp(0.14*tone,0,1)*255;
    alb[i+3]=clamp(0.45+ridge*0.55,0,1)*255;
    hgt[y*size+x]=ridge*0.9;
    rgh[i]=clamp(0.9-ridge*0.1,0.05,1)*255; rgh[i+1]=255; rgh[i+2]=255; rgh[i+3]=255;
  }
  return {alb, nrm:heightToNormal(hgt,size,2.4), rgh, size};
}
/* ---- rugs: 4 weaves ---- */
/* ---- rugs: 4 weaves, 512px, woven border + medallion motifs ---- */
function bakeRug(v){
  const size=512, rng=bakeRng("rug"+v), nz=makeVNoise(rng), fbm=fbmFactory(nz);
  const alb=new Uint8Array(size*size*4), hgt=new Float32Array(size*size), rgh=new Uint8Array(size*size*4);
  const pals=[
    [[0.52,0.48,0.42],[0.40,0.36,0.31]],  /* wool weave */
    [[0.55,0.47,0.33],[0.44,0.37,0.25]],  /* jute */
    [[0.48,0.44,0.40],[0.36,0.33,0.30]],  /* shag */
    [[0.45,0.38,0.30],[0.30,0.26,0.22]],  /* kilim */
  ];
  const pal=pals[v], acc=[0.60,0.42,0.26]; /* motif accent (warm rust) */
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const u=x/size, w=y/size, i=(y*size+x)*4;
    /* ---- weave base (per variant) ---- */
    let mix=0, h=0.5, rough=0.95;
    if(v===0){ const wv=Math.sin(x*0.24+Math.sin(y*0.10)*1.2)*Math.sin(y*0.24+Math.sin(x*0.09)*1.2); mix=sstep(-0.45,0.45,wv); h=0.55+wv*0.15; }
    else if(v===1){ const row=Math.sin(y*0.42+fbm(x*0.03,y*0.03,2)*4); mix=sstep(-0.4,0.4,row); h=0.5+row*0.25; rough=0.9; }
    else if(v===2){ const c=fbm(x*0.045,y*0.045,4); mix=sstep(0.3,0.7,c); h=0.35+c*0.65; }
    else { const ws=Math.sin(y*0.09+fbm(x*0.02,y*0.02,2)*3.0)*0.5+0.5; /* fine weft stripes */
      mix=sstep(0.35,0.65,ws)*0.5+0.25; h=0.5; rough=0.92; }
    /* ---- large-scale woven design: guard stripes, zigzag border, medallion, corners ---- */
    const ex=Math.min(u,1-u,w,1-w);
    const guard=sstep(0.020,0.014,ex)+sstep(0.088,0.080,ex)*(1-sstep(0.104,0.096,ex));
    const bandM=sstep(0.078,0.068,ex)*(1-sstep(0.030,0.022,ex));
    const zig=sstep(0.42,0.18,Math.abs((((x*0.9+y*0.9)/34)%2+2)%2-1));
    const dia=Math.abs(u-0.5)*1.42+Math.abs(w-0.5);
    const med=sstep(0.24,0.20,dia)*(1-sstep(0.085,0.055,dia));
    const medRing=sstep(0.028,0.012,Math.abs(dia-0.155));
    const cor=sstep(0.15,0.12,Math.abs(Math.abs(u-0.5)-0.35)+Math.abs(Math.abs(w-0.5)-0.35));
    let dm=clamp(guard*0.9+bandM*(0.35+0.65*zig)+med*0.95+medRing+cor*0.8,0,1);
    if(v===2) dm*=0.45; /* shag keeps motifs subtle */
    /* ---- compose ---- */
    const det=(fbm(x*0.15,y*0.15,2)-0.5)*0.25;
    const t=clamp((1-dm)*clamp(mix+det,0,1)+dm*0.9,0,1);
    alb[i]=clamp(lerp(lerp(pal[0][0],pal[1][0],t),acc[0],dm*0.75),0,1)*255;
    alb[i+1]=clamp(lerp(lerp(pal[0][1],pal[1][1],t),acc[1],dm*0.75),0,1)*255;
    alb[i+2]=clamp(lerp(lerp(pal[0][2],pal[1][2],t),acc[2],dm*0.75),0,1)*255;
    alb[i+3]=clamp(0.75+h*0.25-dm*0.1,0,1)*255;
    hgt[y*size+x]=clamp(h*(1-dm*0.25)+dm*0.62+det*0.3,0,1);
    rgh[i]=rough*255; rgh[i+1]=255; rgh[i+2]=255; rgh[i+3]=255;
  }
  return {alb, nrm:heightToNormal(hgt,size,2.0), rgh, size};
}
/* ---- linen fabric ---- */

    alb[i+3]=255;

/* ---- mountain heightfield ---- */
function bakeMountainH(){
  const size=256, rng=bakeRng("mtn"), nz=makeVNoise(rng), fbm=fbmFactory(nz);
  const h=new Float32Array(size*size);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const u=x/size, v=y/size;
    let r=1-Math.abs(2*fbm(u*7,v*3.0,6)-1);
    r=Math.pow(r,2.1);
    const p1=Math.exp(-Math.pow((u-0.30)*3.4,2)), p2=Math.exp(-Math.pow((u-0.72)*2.8,2)), p3=Math.exp(-Math.pow((u-0.52)*5.2,2));
    let hgt=r*(0.35+0.65*Math.max(p1,Math.max(p2,p3)))*(0.55+0.45*fbm(u*14,v*6,4));
    hgt*=1.0-sstep(0.78,0.98,v); /* valley carve near the lake line (v=1 = wall base) */
    h[y*size+x]=clamp(hgt,0,1);
  }
  return h;
}
function ensureBaked(st){

  S.bakedKey=key;
  ensureAniso();
  let b=bakeStone(st.stone); makeTexSet("stone",b.alb,b.nrm,b.rgh,b.size);
  b=bakeWood();  makeTexSet("wood",b.alb,b.nrm,b.rgh,b.size);
  b=bakeConcrete(); makeTexSet("concrete",b.alb,b.nrm,b.rgh,b.size);
  b=bakeTile();  makeTexSet("tile",b.alb,b.nrm,b.rgh,b.size);
  b=bakeBark();  makeTexSet("bark",b.alb,b.nrm,b.rgh,b.size);
  b=bakeRug(st.rug); makeTexSet("rug",b.alb,b.nrm,b.rgh,b.size);
  b=bakeFabric(); makeTexSet("fabric",b.alb,b.nrm,b.rgh,b.size);
  b=bakeMetal(); makeTexSet("metal",b.alb,b.nrm,b.rgh,b.size);
  const mh=bakeMountainH();
  const m8=new Uint8Array(256*256*4);
  for(let i=0;i<256*256;i++){ const v=clamp(Math.round(mh[i]*255),0,255); m8[i*4]=v; m8[i*4+1]=v; m8[i*4+2]=v; m8[i*4+3]=255; }
  const mt=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,mt);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,256,256,0,gl.RGBA,gl.UNSIGNED_BYTE,m8);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  TEX.mtnH=mt;
}

/* ============================================================================
   GEOMETRY — indexed meshes with position/normal/uv, VAOs cached.
   ============================================================================ */
function geoPlane(w,h,sx,sz){
  const pos=[],nrm=[],uv=[],idx=[];
  for(let j=0;j<=sz;j++)for(let i=0;i<=sx;i++){
    const x=(i/sx-0.5)*w, z=(j/sz-0.5)*h;
    pos.push(x,0,z); nrm.push(0,1,0); uv.push(i/sx,j/sz);
  }
  for(let j=0;j<sz;j++)for(let i=0;i<sx;i++){
    const a=j*(sx+1)+i, b=a+1, c=a+sx+1, d=c+1;
    idx.push(a,c,b, b,c,d);
  }
  return {pos,nrm,uv,idx};
}
/* vertical wall plane (faces +z), y in [0,1], subdivided */
function geoWall(w,h,sx,sy){
  const g=geoPlane(w,h,sx,sy);
  for(let i=0;i<g.pos.length;i+=3){ const z=g.pos[i+2]; g.pos[i+1]=-z+0.5; g.pos[i+2]=0; }
  for(let i=0;i<g.nrm.length;i+=3){ g.nrm[i]=0; g.nrm[i+1]=0; g.nrm[i+2]=1; }
  for(let i=0;i<g.idx.length;i+=3){ const t=g.idx[i+1]; g.idx[i+1]=g.idx[i+2]; g.idx[i+2]=t; }
  return g;
}
function geoBox(){
  /* 24-vert box, proper face normals/uvs, unit cube centered at origin */
  const pos=[],nrm=[],uv=[],idx=[];
  const corners=[[-0.5,-0.5,-0.5],[0.5,-0.5,-0.5],[0.5,0.5,-0.5],[-0.5,0.5,-0.5],
                 [-0.5,-0.5,0.5],[0.5,-0.5,0.5],[0.5,0.5,0.5],[-0.5,0.5,0.5]];
  const faces=[[4,5,6,7],[1,0,3,2],[0,4,7,3],[5,1,2,6],[7,6,2,3],[0,1,5,4]]; /* +z,-z,-x,+x,+y,-y */
  const norms=[[0,0,1],[0,0,-1],[-1,0,0],[1,0,0],[0,1,0],[0,-1,0]];
  for(let f=0;f<6;f++){
    const base=pos.length/3;
    for(let k=0;k<4;k++){ const c=corners[faces[f][k]]; pos.push(c[0],c[1],c[2]); nrm.push(...norms[f]); uv.push(k===0||k===3?0:1, k<2?0:1); }
    idx.push(base,base+1,base+2, base,base+2,base+3);
  }
  return {pos,nrm,uv,idx};
}
function geoRBox(r,seg){
  /* true rounded box: per-face grids projected onto the rounded surface,
     analytic normals. Gives genuinely soft highlights on furniture edges. */
  r=clamp(r||0.06,0.004,0.24); seg=seg||3;
  const pos=[],nrm=[],uv=[],idx=[];
  const faces=[
    {n:[0,0,1], u:[1,0,0], v:[0,1,0]},
    {n:[0,0,-1],u:[-1,0,0],v:[0,1,0]},
    {n:[1,0,0], u:[0,0,-1],v:[0,1,0]},
    {n:[-1,0,0],u:[0,0,1], v:[0,1,0]},
    {n:[0,1,0], u:[1,0,0], v:[0,0,-1]},
    {n:[0,-1,0],u:[1,0,0], v:[0,0,1]}
  ];
  const inner=0.5-r;
  for(const f of faces){
    const base=pos.length/3;
    for(let j=0;j<=seg;j++)for(let i=0;i<=seg;i++){
      const a=i/seg-0.5, b=j/seg-0.5;
      const px=f.n[0]*0.5+f.u[0]*a+f.v[0]*b;
      const py=f.n[1]*0.5+f.u[1]*a+f.v[1]*b;
      const pz=f.n[2]*0.5+f.u[2]*a+f.v[2]*b;
      const qx=clamp(px,-inner,inner), qy=clamp(py,-inner,inner), qz=clamp(pz,-inner,inner);
      let nx=px-qx, ny=py-qy, nz=pz-qz;
      const l=Math.hypot(nx,ny,nz);
      if(l>1e-6){ nx/=l; ny/=l; nz/=l; } else { nx=f.n[0]; ny=f.n[1]; nz=f.n[2]; }
      pos.push(qx+nx*r, qy+ny*r, qz+nz*r);
      nrm.push(nx,ny,nz);
      uv.push(i/seg, j/seg);
    }
    for(let j=0;j<seg;j++)for(let i=0;i<seg;i++){
      const a0=base+j*(seg+1)+i, b0=a0+1, c0=a0+seg+1, d0=c0+1;
      idx.push(a0,b0,c0, b0,d0,c0);
    }
  }
  return {pos,nrm,uv,idx};
}
function geoCyl(radial,hgt){
  const pos=[],nrm=[],uv=[],idx=[];
  const R=0.5;
  for(let j=0;j<=hgt;j++)for(let i=0;i<=radial;i++){
    const a=i/radial*Math.PI*2;
    pos.push(Math.cos(a)*R,(j/hgt-0.5),Math.sin(a)*R);
    nrm.push(Math.cos(a),0,Math.sin(a)); uv.push(i/radial,j/hgt);

const GLSL_NOISE = `

window.__fpShaderLogs=[];
function compileProg(vsSrc, fsSrc, progName){
  function sh(type,src){
    const s=gl.createShader(type);
    gl.shaderSource(s,src); gl.compileShader(s);
    const ok=!!gl.getShaderParameter(s,gl.COMPILE_STATUS);
    window.__fpShaderLogs.push({prog:progName||"?", stage:type===gl.VERTEX_SHADER?"vertex":"fragment",
      ok:ok, log:String(gl.getShaderInfoLog(s)||"(empty)")});
    if(!ok)
      throw new Error("shader: "+gl.getShaderInfoLog(s)+"\n---\n"+src.slice(0,600));
    return s;
  }
  const p=gl.createProgram();
  gl.attachShader(p,sh(gl.VERTEX_SHADER,vsSrc));
  gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fsSrc));
  gl.linkProgram(p);
  const lok=!!gl.getProgramParameter(p,gl.LINK_STATUS);
  window.__fpShaderLogs.push({prog:progName||"?", stage:"link", ok:lok,
    log:String(gl.getProgramInfoLog(p)||"(empty)")});
  if(!lok) throw new Error("link: "+gl.getProgramInfoLog(p));
  return p;
}
function locCache(prog){
  const c={};
  return function(n){
    if(!(n in c)) c[n]=gl.getUniformLocation(prog,n);
    return c[n];
  };
}

function cameraAt(te){
  const A = CAMS_DEF[clamp(settings.camera|0,0,CAMS_DEF.length-1)];
  let ex=A.eye[0],ey=A.eye[1],ez=A.eye[2], tx=A.tgt[0],ty=A.tgt[1],tz=A.tgt[2];
  const mo=settings.motion|0;
  if (mo===1){ ex+=Math.sin(te*0.10+S.camPhase)*0.14; ey+=Math.sin(te*0.073+S.camPhase*1.7)*0.06; }
  else if (mo===2){ const k=0.5-0.5*Math.cos(te*2*Math.PI/50+S.camPhase); const dx=tx-ex,dy=ty-ey,dz=tz-ez; ex+=dx*0.16*k; ey+=dy*0.16*k; ez+=dz*0.16*k; }
  else { ex+=Math.sin(te*0.05)*0.015; }
  tx+=Math.sin(te*0.09+S.camPhase)*0.03;
  return { eye:[ex,ey,ez], tgt:[tx,ty,tz], fov:A.fov, vig:(A.vig!=null?A.vig:0.32) };
}

function computeRig(st){
  const w=st.weather|0, t=st.time|0;
  const W = [
    {cloud:0.22,haze:0.22,rain:0,snow:0,mist:0.0,sunMul:1.0},
    {cloud:0.85,haze:0.55,rain:0,snow:0,mist:0.15,sunMul:0.42},
    {cloud:0.96,haze:0.72,rain:1,snow:0,mist:0.30,sunMul:0.30},
    {cloud:0.72,haze:0.62,rain:0,snow:1,mist:0.35,sunMul:0.55},
    {cloud:0.45,haze:0.95,rain:0,snow:0,mist:1.0,sunMul:0.60},
  ][w];
  const R = { W, night:0, cloud:W.cloud, haze:W.haze, rain:W.rain, snow:W.snow, mist:W.mist };
  const az = (S.texSeed*2.7)%(Math.PI*2);
  if (t===0){
    const el=0.95;
    R.sunDir=[Math.sin(az)*Math.cos(el)*0.9+0.35, -Math.sin(el), Math.cos(az)*Math.cos(el)*0.4-0.75];
    const l=Math.hypot(...R.sunDir); R.sunDir=R.sunDir.map(v=>v/l);
    R.sunCol=[1.0,0.96,0.90]; R.sunI=3.2*W.sunMul;
    R.moonI=0; R.exposure=1.0; R.warmth=0.35; R.amb=[0.62,0.60,0.58];
  } else if (t===1){
    const el=0.16;
    R.sunDir=[Math.sin(az)*0.9-0.55, -Math.sin(el), Math.cos(az)*0.4-0.5];
    const l=Math.hypot(...R.sunDir); R.sunDir=R.sunDir.map(v=>v/l);
    R.sunCol=[1.0,0.52,0.24]; R.sunI=2.2*W.sunMul;
    R.moonI=0; R.exposure=1.06; R.warmth=0.75; R.amb=[0.50,0.42,0.38];
  } else {
    R.night=1;
    const el=0.66;
    R.sunDir=[Math.sin(az+2.4)*0.6, -Math.sin(el), Math.cos(az+2.4)*0.5-0.4];
    const l=Math.hypot(...R.sunDir); R.sunDir=R.sunDir.map(v=>v/l);
    R.sunCol=[0.55,0.68,0.92]; R.sunI=0.70;
    R.moonI=1.0; R.exposure=1.45; R.warmth=0.25; R.amb=[0.36,0.40,0.50];
  }
  R.moonDir=R.sunDir.slice();
  R.moonCol=[0.62,0.74,0.95];
  const fi=[0.7,1.0,1.45][st.fire|0]*(t===2?1.6:1.0);
  R.fireI=fi;
  S.rig=R;
  return R;
}

function makePartSystem(o){

  return { mode:o.mode, count:n, origin:o.origin, rise:o.rise||1, size:o.size||0.1,
    spread:o.spread||0.5, rate:o.rate||0.3, sway:o.sway||0.05, grow:o.grow||1,
    alpha:o.alpha==null?1:o.alpha, seeds };
}

/* ============================================================================
   INSTANCED SURFACE DETAIL — shag rug strands + couch micro-tufts.
   One instanced draw per set; deterministic per-seed buffers; raw WebGL2.
   ============================================================================ */
let shagVAO=null, shagCount=0, nubVAO=null, nubCount=0;
let shagBufs=[], nubBufs=[];
function detFreeVAO(vao, bufs){
  if(vao) gl.deleteVertexArray(vao);
  for(const b of bufs) gl.deleteBuffer(b);
}
function detBuild(n, fill, withP2, withP3){
  const quad=new Float32Array([-0.5,-0.5, 0.5,-0.5, -0.5,0.5, -0.5,0.5, 0.5,-0.5, 0.5,0.5]);
  const base=new Float32Array(n*3), p0=new Float32Array(n*4), p1=new Float32Array(n*4);
  const p2=withP2?new Float32Array(n*4):null;
  const p3=withP3?new Float32Array(n*4):null;
  for(let i=0;i<n;i++) fill(i, base, p0, p1, p2, p3);
  const vao=gl.createVertexArray(); gl.bindVertexArray(vao);
  const bufs=[];
  function attr(loc, arr, size, divisor){
    const b=gl.createBuffer(); bufs.push(b);
    gl.bindBuffer(gl.ARRAY_BUFFER,b); gl.bufferData(gl.ARRAY_BUFFER,arr,gl.STATIC_DRAW);
    gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,size,gl.FLOAT,false,0,0);
    gl.vertexAttribDivisor(loc,divisor);
  }
  attr(0,quad,2,0); attr(1,base,3,1); attr(2,p0,4,1); attr(3,p1,4,1);
  if(p2) attr(4,p2,4,1);
  if(p3) attr(5,p3,4,1);
  gl.bindVertexArray(null);
  return {vao,bufs};
}
function buildShagNubs(st){
  detFreeVAO(shagVAO,shagBufs); detFreeVAO(nubVAO,nubBufs);
  shagVAO=null; nubVAO=null; shagBufs=[]; nubBufs=[];
  const rng=mulberry32((st.seed^0x51ab)>>>0);
  /* shag rug strands: fluffy pom-pom tufts on a jittered clump grid —
     fibers radiate outward from each tuft center with curl, S-wiggle and
     tip droop; deep shadowed valleys between tufts; per-tuft wave lean so
     neighboring tufts don't look stamped; soft fringe edge */
  const counts=[8000,8500,14000,7000];
  const n=counts[st.rug|0]||6500;
  const cw=0.45, cl=[];
  for(let gx=-2.45; gx<1.85; gx+=cw) for(let gz=-0.4; gz<2.6; gz+=cw)
    cl.push([gx+cw*0.5+(rng()-0.5)*cw*0.6, gz+cw*0.5+(rng()-0.5)*cw*0.6,
             0.72+rng()*0.60, rng()*Math.PI*2]);
    /* cx, cz, heightMul, wavePhase */
  const r=detBuild(n,(i,base,p0,p1,p2,p3)=>{
    let x=-0.3+(rng()-0.5)*4.3, z=1.1+(rng()-0.5)*3.0, c=null;
    if(rng()<0.90){ /* most strands snap toward a tuft center -> pom-poms */
      c=cl[(rng()*cl.length)|0];
      const pull=0.60+rng()*0.35;
      x+=(c[0]-x)*pull; z+=(c[1]-z)*pull;
    }
    const dxe=Math.min(x+2.45,1.85-x), dze=Math.min(z+0.4,2.6-z), de=Math.min(dxe,dze);
    const fr=de<0.38 ? 1-de/0.38 : 0; /* fringe band at the rug border */
    base[i*3]=x; base[i*3+1]=0.065; base[i*3+2]=z;
    let la, lean, hMul, wMul, toneMul, cdX, cdZ, cAmp, cPh;
    if(c){
      let rx=x-c[0], rz=z-c[1];
      const rd=Math.hypot(rx,rz), rmax=cw*0.80, vn=Math.min(rd/rmax,1);
      const vsh=vn*vn*(3-2*vn); /* 0 at tuft center -> 1 at cell border */
      hMul=(1.0-0.85*vsh)*c[2]; /* carve deep valleys between tufts */
      wMul=1.0-0.35*vsh;
      toneMul=1.0-0.50*vsh; /* shadowed valleys */
      if(rd<1e-4){ rx=1; rz=0; }
      const ra=Math.atan2(rz,rx);
      const wave=Math.sin(c[0]*5.3+c[1]*3.7+c[3]); /* per-tuft wave lean */
      la=ra+(rng()-0.5)*0.55+wave*0.55; /* radial pom-pom + jitter + tuft wave */
      lean=(0.015+vn*0.075)*(0.70+rng()*0.60); /* edge fibers lean outward */
      cdX=Math.cos(la); cdZ=Math.sin(la); /* curl follows the radial flow */
      cAmp=0.50+rng()*0.50;
      cPh=c[3]+rng()*0.8; /* per-tuft phase coherence */
    }else{
      /* un-snapped: short dark underlayer so no backing shows through */
      hMul=0.30; wMul=1.0; toneMul=0.50;
      la=rng()*Math.PI*2; lean=0.004+rng()*0.008;
      cdX=Math.cos(la); cdZ=Math.sin(la);
      cAmp=0.40+rng()*0.40; cPh=rng()*Math.PI*2;
    }
    let hgt=(0.030+rng()*0.032)*hMul; /* shorter fibers that flop instead of spike */
    if(fr>0){ /* fringe: longer strands leaning outward, soft wavy silhouette */
      const ox=dxe<dze?(x<-0.3?-1:1):0, oz=dxe<dze?0:(z<1.1?-1:1);
      la=Math.atan2(oz,ox)+(rng()-0.5)*0.9;
      lean+=fr*(0.020+rng()*0.022);
      hgt*=1.0+fr*0.7;
    }
    p0[i*4]=Math.cos(la)*lean; p0[i*4+1]=Math.sin(la)*lean;
    p0[i*4+2]=hgt; p0[i*4+3]=(0.008+rng()*0.007)*wMul; /* wider, softer ribbons: no needles */
    p2[i*4]=cdX; p2[i*4+1]=cdZ;
    p2[i*4+2]=cAmp*hgt*(1+fr*0.3); p2[i*4+3]=cPh;
    p3[i*4]=1.0; p3[i*4+1]=1.0; p3[i*4+2]=0; p3[i*4+3]=0; /* fur shading: AO + sheen */
    const tv=(0.72+rng()*0.56)*toneMul, tw=0.90+rng()*0.20;
    const hj=(rng()-0.5)*2; /* subtle per-strand hue jitter: warm/cool shift */
    p1[i*4]=rng()*Math.PI*2;
    p1[i*4+1]=0.55*tv*tw*(1+hj*0.05); p1[i*4+2]=0.50*tv*tw*(1-hj*0.02); p1[i*4+3]=0.44*tv*(1-hj*0.045);
  },true,true);
  shagVAO=r.vao; shagBufs=r.bufs; shagCount=n; S.shagN=n;
  /* couch micro-tufts: mattress + two fabric seats, 8-14mm tall */
  const spots=[
    {x:-2.3,y:0.535,z:2.75,sx:2.5,sz:1.03,n:380},
    {x:1.15,y:0.27,z:1.9,sx:0.62,sz:0.62,n:130},
    {x:0.45,y:0.25,z:2.30,sx:0.56,sz:0.56,n:110},
  ];
  let total=0; for(const s of spots) total+=s.n;
  const r2=detBuild(total,(i,base,p0,p1)=>{
    let k=i, sp=spots[0];
    for(const s of spots){ if(k<s.n){ sp=s; break; } k-=s.n; }
    const x=sp.x+(rng()-0.5)*sp.sx, z=sp.z+(rng()-0.5)*sp.sz;
    base[i*3]=x; base[i*3+1]=sp.y; base[i*3+2]=z;
    const la=rng()*Math.PI*2, lean=0.002+rng()*0.006;
    p0[i*4]=Math.cos(la)*lean; p0[i*4+1]=Math.sin(la)*lean;
    p0[i*4+2]=0.008+rng()*0.006; p0[i*4+3]=0.004+rng()*0.004;
    const tv=0.75+rng()*0.5;
    p1[i*4]=rng()*Math.PI*2;
    p1[i*4+1]=0.72*tv; p1[i*4+2]=0.68*tv; p1[i*4+3]=0.62*tv;
  });
  nubVAO=r2.vao; nubBufs=r2.bufs; nubCount=total; S.nubN=total;
}

/* ============================================================================
   MASTER RENDER — fixed 8-pass pipeline
   ============================================================================ */
function renderPasses(te, frame){
  const w=canvas.width, h=canvas.height;

  const proj=mPersp(cam.fov,aspect,0.1,500);
  const view=mLookAt(cam.eye,cam.tgt);
  S.proj=proj; S.view=view;

  /* 1. shadow map */
  {
    const R=S.rig;
    const L=[-R.sunDir[0]*38,-R.sunDir[1]*38,-R.sunDir[2]*38];

    gl.clearDepth(1); gl.clear(gl.DEPTH_BUFFER_BIT);

      gl.uniformMatrix4fv(HU("uModel"),false,d.model);
      gl.bindVertexArray(d.mesh.vao);
      gl.drawElements(gl.TRIANGLES,d.mesh.count,gl.UNSIGNED_INT,0);
    }

  /* 2. half-res packed linear depth */
  {
    gl.bindFramebuffer(gl.FRAMEBUFFER,depFBO);

    gl.clearColor(1,1,1,1); gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST); gl.depthMask(true);
    gl.useProgram(depthProg);
    gl.uniformMatrix4fv(DU("uView"),false,view);
    gl.uniformMatrix4fv(DU("uProj"),false,proj);
    gl.uniform3fv(DU("uCamPos"),cam.eye);
    gl.uniform1f(DU("uIsMtn"),0.0);
    for(const d of S.draws){
      gl.uniformMatrix4fv(DU("uModel"),false,d.model);
      gl.bindVertexArray(d.mesh.vao);
      gl.drawElements(gl.TRIANGLES,d.mesh.count,gl.UNSIGNED_INT,0);
    }
    gl.uniform1f(DU("uIsMtn"),1.0);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D,TEX.mtnH);
    gl.uniform1i(DU("uHeight"),0);
    for(const m of S.mtns){
      gl.uniformMatrix4fv(DU("uModel"),false,mMul(mT(m.x,m.y,m.z),mS(m.w,m.h,1)));
      gl.uniform1f(DU("uHScale"),m.hs);
      gl.bindVertexArray(M_MTNWALL.vao);
      gl.drawElements(gl.TRIANGLES,M_MTNWALL.count,gl.UNSIGNED_INT,0);
    }
    gl.bindVertexArray(null);
    gl.uniform1f(DU("uIsMtn"),0.0);
  }
  /* 3. MSAA: sky + mountains + opaque */
  {
    gl.bindFramebuffer(gl.FRAMEBUFFER,msFBO);
    gl.viewport(0,0,w,h);
    gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST); gl.depthMask(true);
    drawSky(view,proj,te);
    drawMtns(view,proj,te);
    drawLit(view,proj,te);
    drawInstDetail(view,proj,te);
    if (window.__FH && window.__frames && window.__FH.nquads) {
      FPFrames.render(window.__FH, view, proj, FPFrames.lightingFromRig(S.rig, S.fireCol, S.flick, dressCeil()));
    }
    if (window.__mantleFH && window.__mantleFH.nquads) {
      FPFrames.render(window.__mantleFH, view, proj, FPFrames.lightingFromRig(S.rig, S.fireCol, S.flick, dressCeil()));
    }
  }

  {
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER,msFBO);
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER,resFBO);
    gl.blitFramebuffer(0,0,w,h,0,0,w,h,gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT,gl.NEAREST);
  }
  /* 5. water back into MSAA */
  {
    gl.bindFramebuffer(gl.FRAMEBUFFER,msFBO);
    gl.enable(gl.DEPTH_TEST); gl.depthMask(true);
    drawWater(view,proj,te);
  }
  /* 6. glass + particles into MSAA */
  {
    lifeDraw(view,proj,te);
    drawGlass(view,proj,te);
    drawParticles(view,proj,te);
  }
  /* 7. final resolve into MSAA->canvas FBO then 8. post to canvas */
  {
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER,msFBO);
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER,resFBO);
    gl.blitFramebuffer(0,0,w,h,0,0,w,h,gl.COLOR_BUFFER_BIT,gl.NEAREST);
    gl.bindFramebuffer(gl.FRAMEBUFFER,null);
    gl.viewport(0,0,w,h);
    gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.disable(gl.DEPTH_TEST); gl.depthMask(false);
    gl.useProgram(postProg);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,resTex); gl.uniform1i(OU("uTex"),0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,depTex); gl.uniform1i(OU("uDepth"),1);
    gl.uniform1f(OU("uFrame"),frame);
    gl.uniform2f(OU("uRes"),w,h);
    gl.uniform1f(OU("uExposure"),S.rig.exposure);
    gl.uniform1f(OU("uVig"),S.cam&&S.cam.vig!=null?S.cam.vig:0.32);
    const GI=[[0.020,0.028],[0,0],[0.006,0.008],[0.012,0.016],[0.035,0.045]][settings.grain|0]||[0.020,0.028];
    gl.uniform1f(OU("uGrain"),S.rig.night?GI[1]:GI[0]);
    gl.uniform1f(OU("uWarm"),S.rig.warmth);
    gl.uniform1f(OU("uNight"),S.rig.night);
    gl.uniform1f(OU("uAO"),0.75);
    gl.bindVertexArray(postVAO);
    gl.drawArrays(gl.TRIANGLES,0,3);

/* ============================================================================
   FRAME LOOP — fixed time; wall clock never touches render pixels
   ============================================================================ */
const FIXED_DT=1/30;
/* Smooth deterministic fire flicker: multi-octave value noise, pure function of te */
function flickHash(n){ const s=Math.sin(n*127.1+311.7)*43758.5453; return s-Math.floor(s); }
function flickNoise(x){ const i=Math.floor(x), f=x-i, u=f*f*(3-2*f);
  return flickHash(i)*(1-u)+flickHash(i+1)*u; }
function fireFlick(te){
  const ph=S.flamePhase;
  const n=flickNoise(te*3.1+ph[0])*0.55+flickNoise(te*7.3+ph[1])*0.30+flickNoise(te*15.7+ph[2])*0.15;
  return 0.62+0.76*n;
}
function tickFrame(){
  const te=S.frame*FIXED_DT;
  const fl=[0.6,1.0,1.5][settings.fire|0];
  S.flick=fireFlick(te)*fl;

  lifeTick(te);
  renderPasses(te,S.frame);
  S.frame++;
}
function frameLoop(){
  if(document.hidden){ requestAnimationFrame(frameLoop); return; }

/* ============================================================================
   SEED WIRING — v3 mixed-radix: the seed number packs all 13 params exactly,
   so a "#3XXXXXXXX" seed always rebuilds the identical scene. Legacy seeds
   keep their number and are hashed into the nearest v3 scene.
   ============================================================================ */
const PARAM_KEYS=["stone","floor","wood","rug","weather","time","water","camera","motion","fire","deck","sparks","grain"];
const PARAM_SIZES=[4,4,3,4,5,3,3,6,3,3,3,101,5];
function hashMix(n){ n=Math.imul(n^0x9e3779b9,0x85ebca6b)>>>0; n^=n>>>13; n=Math.imul(n,0xc2b2ae35)>>>0; n^=n>>>16; return n>>>0; }

  const out={}; let k=n>>>0;
  for(let i=0;i<PARAM_SIZES.length;i++){ out[PARAM_KEYS[i]]=k%PARAM_SIZES[i]; k=Math.floor(k/PARAM_SIZES[i]); }
  return out;
}
function paramsToNum(p){
  let n=0,mult=1;
  for(let i=0;i<PARAM_KEYS.length;i++){ n+=clamp(Math.round(p[PARAM_KEYS[i]]||0),0,PARAM_SIZES[i]-1)*mult; mult*=PARAM_SIZES[i]; }
  return n>>>0;
}
function randomSeedString(){
  const p={};
  for(let i=0;i<PARAM_KEYS.length;i++) p[PARAM_KEYS[i]]=(cryptoUint32()>>>0)%PARAM_SIZES[i];
  return "#3"+paramsToNum(p).toString(16).toUpperCase().padStart(8,"0");
}
function settingsSeedString(){
  return "#3"+paramsToNum(settings).toString(16).toUpperCase().padStart(8,"0");
}
function applySeedParams(ps){
  const raw=(ps.ver===3)?(ps.n>>>0):hashMix(ps.n>>>0);
  const q=decodeParams(raw);
  for(const k of PARAM_KEYS) settings[k]=q[k];
  settings.seed=ps.n>>>0; settings.ver=ps.ver;
}

}

/* ============================================================================

function rmBookkeep(RM){
  if(RM.phase==="warmup"){ RM.frame++; if(RM.frame>=RM.warmup&&RM.onPhase){ try{RM.onPhase("reset");}catch(e){} } }
  else if(RM.phase==="record"){ if(RM.onFrame){ try{RM.onFrame(RM.frame);}catch(e){} } RM.frame++; if(RM.frame>=RM.totalFrames&&RM.onPhase){ try{RM.onPhase("done");}catch(e){} } }

    'font-family:-apple-system,system-ui,sans-serif;padding:24px;text-align:center;';
  overlay.innerHTML =
    '<div style="font-size:15px;color:#8b95ab;margin-bottom:6px">\uD83C\uDFAC Rendering</div>' +
    '<div style="font-size:22px;font-weight:800;margin-bottom:4px">' + esc(studioLabel) + '</div>' +
    '<div style="font-size:13px;color:#8b95ab;margin-bottom:18px;font-family:ui-monospace,monospace">seed ' + esc(seed) + ' \u00B7 ' + W + '\u00D7' + H + ' \u00B7 ' + fps + 'fps \u00B7 ' + fmtDur(seconds) + '</div>' +
    '<div style="width:min(320px,80vw);height:10px;background:#1a2236;border-radius:99px;overflow:hidden;margin-bottom:10px">' +
    '<div id="rmBar" style="height:100%;width:0%;background:#2f7bff;border-radius:99px;transition:width .3s"></div></div>' +
    '<div id="rmStatus" style="font-size:14px;color:#c6cfe4;margin-bottom:4px">Preparing\u2026</div>' +
    '<div id="rmEta" style="font-size:12px;color:#8b95ab;margin-bottom:22px"></div>' +
    '<div style="display:flex;gap:10px">' +
    '<button id="rmPause" style="font-size:16px;font-weight:700;border:0;border-radius:12px;padding:14px 22px;background:#1a2236;color:#fff">\u23F8 Pause</button>' +
    '<button id="rmCancel" style="font-size:16px;font-weight:700;border:0;border-radius:12px;padding:14px 22px;background:#3a1d1d;color:#ff9c9c">\u2715 Cancel</button>' +
    '</div>' +
    '<div style="font-size:12px;color:#5b6b8c;margin-top:18px;max-width:300px;line-height:1.6">Keep this tab open while rendering.<br>You can pause anytime \u2014 but closing this tab loses the render.</div>';
  document.body.appendChild(overlay);

  function setStatus(s) { var el = document.getElementById('rmStatus'); if (el) el.textContent = s; }
  function fail(msg) {
    RM.phase = 'cancelled'; RM.onFrame = null;
    try { if (encoder) encoder.close(); } catch (e) {}
    setStatus('\u26A0\uFE0F ' + msg);
    var b = document.getElementById('rmEta');
    if (b) b.textContent = 'Nothing was rendered.';
  }

  /* ---- encoder ---- */
  var encoder = null, muxer = null, encodedFrames = 0, t0 = 0;
  /* Counters that prove the iOS path actually produced media. A finished
     render with zero muxed chunks is a 581-byte empty shell, not a video. */
  var framesAttempted = 0, encodeErrors = 0, muxedChunks = 0;

  /* If the device encoder rejects frames, say so fast and plainly instead of
     spending the whole render on output that can only come out empty. */
  function noteEncodeError() {
    encodeErrors++;
    if (encodeErrors >= 20 && muxedChunks === 0 && RM.phase === 'record') {
      fail('This device\u2019s video encoder rejected ' + encodeErrors +
        ' frames and recorded nothing, so the video can\u2019t be made here. ' +
        'Try a lower resolution, or close and reopen Safari and try again.');
    }
  }
  var rcanvas = window.__renderCanvas || document.querySelector('canvas');

  /* ---- iOS-safe frame source ----
     Never hand the encoder a VideoFrame taken straight from the studio's
     WebGL canvas: on iOS Safari the hardware H.264 encoder silently drops
     those frames (no error, zero output chunks — the classic 581-byte empty
     MP4). Copying through a plain 2D canvas first works everywhere. */
  var frame2d = null, fctx = null;
  function ensureFrame2d() {
    if (frame2d && frame2d.width === W && frame2d.height === H && fctx) return true;
    try {
      frame2d = document.createElement('canvas');
      frame2d.width = W; frame2d.height = H;
      fctx = frame2d.getContext('2d');
      return !!fctx;
    } catch (e) { frame2d = null; fctx = null; return false; }
  }

  /* Shared "empty video" message: 60+ frames drained through the encoder,
     zero chunks came out. Used both mid-render (fail fast) and at finish. */
  function failEmpty() {
    fail('The video came out empty \u2014 ' + framesAttempted + ' frames went in, but this device\u2019s encoder recorded 0 of them' +
      (encodeErrors ? ' (' + encodeErrors + ' were rejected).' : '.') +
      ' Please try again; if it keeps happening, use a lower resolution.');
  }
  var _avcDc = null;
  function withAvcDecoderConfig(chunk, meta) {
    meta = meta || {};
    if (meta.decoderConfig) { _avcDc = meta.decoderConfig; return meta; }
    if (_avcDc) return { decoderConfig: _avcDc };
    var dc = null;
    try {
      if (chunk && chunk.type === 'key' && chunk.byteLength > 0) {
        var buf = new Uint8Array(chunk.byteLength);
        chunk.copyTo(buf);
        dc = avcDcFromNalUnits(buf);
      }
    } catch (e) { dc = null; }
    if (dc) { _avcDc = dc; return { decoderConfig: dc }; }
    return meta;
  }
  function avcDcFromNalUnits(buf) {
    var nals = [], i, j, k, m, p, len, sc, scLen, end, t;
    var annexB = buf.length > 4 && buf[0] === 0 && buf[1] === 0 &&
      (buf[2] === 1 || (buf[2] === 0 && buf[3] === 1));
    if (annexB) {
      i = 0;
      while (i + 3 < buf.length) {
        sc = -1; scLen = 0;
        for (j = i; j + 3 < buf.length; j++) {
          if (buf[j] === 0 && buf[j + 1] === 0 && buf[j + 2] === 1) { sc = j; scLen = 3; break; }
          if (buf[j] === 0 && buf[j + 1] === 0 && buf[j + 2] === 0 && buf[j + 3] === 1) { sc = j; scLen = 4; break; }
        }
        if (sc < 0) break;
        end = buf.length;
        for (m = sc + scLen; m + 3 < buf.length; m++) {
          if (buf[m] === 0 && buf[m + 1] === 0 &&
            (buf[m + 2] === 1 || (buf[m + 2] === 0 && buf[m + 3] === 1))) { end = m; break; }
        }
        if (sc + scLen < end) nals.push(buf.subarray(sc + scLen, end));
        i = end;
      }
    } else {
      p = 0;
      while (p + 4 <= buf.length) {
        len = (buf[p] << 24) | (buf[p + 1] << 16) | (buf[p + 2] << 8) | buf[p + 3];
        if (len <= 0 || p + 4 + len > buf.length) break;
        nals.push(buf.subarray(p + 4, p + 4 + len));
        p += 4 + len;
      }
    }
    var sps = null, pps = null;
    for (k = 0; k < nals.length; k++) {
      t = nals[k][0] & 31;
      if (t === 7 && !sps) sps = nals[k];
      else if (t === 8 && !pps) pps = nals[k];
      if (sps && pps) break;
    }
    if (!sps || !pps || sps.length < 4) return null;
    var avcC = new Uint8Array(11 + sps.length + pps.length);
    avcC[0] = 1; avcC[1] = sps[1]; avcC[2] = sps[2]; avcC[3] = sps[3];
    avcC[4] = 0xFF; avcC[5] = 0xE1;
    avcC[6] = (sps.length >> 8) & 255; avcC[7] = sps.length & 255;
    avcC.set(sps, 8);
    var o = 8 + sps.length;
    avcC[o] = 1; avcC[o + 1] = (pps.length >> 8) & 255; avcC[o + 2] = pps.length & 255;
    avcC.set(pps, o + 3);
    function hx(b) { return ('0' + b.toString(16)).slice(-2); }
    return { codec: 'avc1.' + hx(sps[1]) + hx(sps[2]) + hx(sps[3]), description: avcC };
  }

  RM.onPhase = function (phase) {
    if (phase === 'reset') doReset();
    else if (phase === 'done') finishRender();
  };

  function doReset() {
    RM.phase = 'reset';
    try { if (typeof window.__renderReset === 'function') window.__renderReset(); } catch (e) {}
    RM.frame = 0;
    if (!setupEncoder()) return;
    RM.phase = 'record';
    t0 = performance.now();
    setStatus('Rendering\u2026');
  }

  function setupEncoder() {
    if (typeof VideoEncoder === 'undefined') {
      fail('This browser can\u2019t do headless rendering (needs WebCodecs). Try Safari on iOS 17.4+.');
      return false;
    }
    if (typeof Mp4Muxer === 'undefined') { fail('Video muxer failed to load.'); return false; }
    try {
      muxer = new Mp4Muxer.Muxer({
        target: new Mp4Muxer.ArrayBufferTarget(),
        video: { codec: 'avc', width: W, height: H },
        fastStart: 'in-memory',
        firstTimestampBehavior: 'offset'
      });
      encoder = new VideoEncoder({
        output: function (chunk, meta) {
          try { muxer.addVideoChunk(chunk, withAvcDecoderConfig(chunk, meta)); muxedChunks++; } catch (e) {}
          if (RM._bp && encoder.encodeQueueSize < 20) RM._bp = false;
        },
        error: function (e) { fail('Encoder error: ' + (e && e.message)); }
      });
      /* Note: iOS Safari's isConfigSupported can falsely report H.264 as
         unsupported, so we skip the check and just configure. */
      encoder.configure({
        codec: 'avc1.640028', width: W, height: H,
        bitrate: Math.min(40000000, Math.round(12000000 * (W * H) / (1280 * 720))),
        framerate: fps
      });
      ensureFrame2d();
      RM.onFrame = encodeFrame;
      return true;
    } catch (e) {
      fail('Couldn\u2019t start the encoder: ' + e.message);
      return false;
    }
  }

  function encodeFrame(idx) {
    if (!encoder || RM.phase !== 'record' || !rcanvas) return;
    if (encoder.encodeQueueSize > 90) { RM._bp = true; return; }
    var src = rcanvas;
    if (fctx && frame2d) {
      try { fctx.drawImage(rcanvas, 0, 0, W, H); src = frame2d; }
      catch (e) { noteEncodeError(); return; }
    }
    var vf = null;
    try { vf = new VideoFrame(src, { timestamp: Math.round(idx * 1e6 / fps), alpha: 'discard' }); }
    catch (e) { noteEncodeError(); return; }
    framesAttempted++;
    try { encoder.encode(vf, { keyFrame: idx % (fps * 5) === 0 }); }
    catch (e) { noteEncodeError(); }
    try { vf.close(); } catch (e) {}
    encodedFrames = idx + 1;
    /* Fail fast on a silently stalled encoder: 60 frames fully drained,
       nothing recorded. Saves the user sitting through a doomed render. */
    if (framesAttempted >= 60 && muxedChunks === 0 && encoder.encodeQueueSize === 0) {
      failEmpty();
      return;
    }
    if ((idx & 15) === 0) updateProgress();
  }

  function updateProgress() {
    var pct = Math.min(100, (encodedFrames / totalFrames) * 100);
    var bar = document.getElementById('rmBar');
    if (bar) bar.style.width = pct.toFixed(1) + '%';
    var el = (performance.now() - t0) / 1000;
    var rate = encodedFrames / Math.max(el, 0.1);
    var remain = rate > 0.01 ? (totalFrames - encodedFrames) / rate : 0;
    setStatus('Frame ' + encodedFrames.toLocaleString() + ' / ' + totalFrames.toLocaleString() + ' (' + pct.toFixed(0) + '%)');
    var eta = document.getElementById('rmEta');
    if (eta) eta.textContent = '\u2248 ' + fmtTime(remain) + ' left \u00B7 ' + rate.toFixed(1) + ' fps wall \u00B7 ' + muxedChunks + ' chunks \u00B7 q' + encoder.encodeQueueSize;
  }

  async function finishRender() {
    RM.phase = 'done'; RM.onFrame = null;
    updateProgress();
    setStatus('Finishing video\u2026');
    try {
      if (encoder) await encoder.flush();
      if (muxer) muxer.finalize();
    } catch (e) { fail('Couldn\u2019t finish the video: ' + e.message); return; }
    var buf = muxer.target.buffer;
    if (!buf || !buf.byteLength) { fail('The video came out empty.'); return; }
    if (muxedChunks === 0) { failEmpty(); return; }
    try { window.__renderResult = buf; } catch (e) {} /* lets automated tests grab the MP4 */
    var blob = new Blob([buf], { type: 'video/mp4' });
    var cleanSeed = seed.replace(/[^A-Za-z0-9]+/g, '').slice(0, 14) || 'seed';
    var name = studioLabel.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') +
      '-' + cleanSeed + '-' + seconds + 's.mp4';
    showDone(blob, name);
    markQueueDone();
  }

  function showDone(blob, name) {
    var url = URL.createObjectURL(blob);
    var mb = (blob.size / 1048576).toFixed(1);
    overlay.innerHTML =
      '<div style="font-size:44px;margin-bottom:10px">\u2705</div>' +
      '<div style="font-size:20px;font-weight:800;margin-bottom:6px">Your video is ready</div>' +
      '<div style="font-size:13px;color:#8b95ab;margin-bottom:20px;font-family:ui-monospace,monospace">' + esc(name) + ' \u00B7 ' + mb + ' MB</div>' +
      '<button id="rmShare" style="font-size:17px;font-weight:800;border:0;border-radius:14px;padding:16px 30px;background:#2f7bff;color:#fff;margin-bottom:12px">Share video</button>' +
      '<div style="font-size:12px;color:#8b95ab;max-width:300px;line-height:1.6">Share \u2192 Save to Files \u2192 your SSD.<br>Or use the download link below.</div>' +
      '<a id="rmDl" href="' + url + '" download="' + esc(name) + '" style="margin-top:14px;color:#9cc3ff;font-size:14px">Download instead</a>';
    document.getElementById('rmShare').onclick = function () {
      var file = new File([blob], name, { type: 'video/mp4' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: name }).catch(function () {});
      } else {
        document.getElementById('rmDl').click();
      }
    };
  }

  async function markQueueDone() {
    var token = null;
    try { token = localStorage.getItem('rq_token'); } catch (e) {}
    if (!token || !qid) return;
    try {
      var api = 'https://api.github.com/repos/bassseamoor/render-queue/contents/queue.json';
      var h = { Authorization: 'Bearer ' + token };
      var r = await fetch(api, { headers: h });
      if (!r.ok) return;
      var j = await r.json();
      var data = JSON.parse(atob(j.content));
      var it = (data.items || []).find(function (x) { return x.id === qid; });
      if (!it) return;
      it.status = 'done';
      await fetch(api, {
        method: 'PUT', headers: Object.assign({ 'Content-Type': 'application/json' }, h),
        body: JSON.stringify({
          message: 'Mark render done', sha: j.sha,
          content: btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))))
        })
      });
    } catch (e) {}
  }

  document.getElementById('rmPause').onclick = function () {
    if (RM.phase !== 'record' && RM.phase !== 'warmup') return;
    RM.paused = !RM.paused;
    this.textContent = RM.paused ? '\u25B6 Resume' : '\u23F8 Pause';
    setStatus(RM.paused ? 'Paused \u2014 nothing is lost.' : (RM.phase === 'record' ? 'Rendering\u2026' : 'Preparing\u2026'));
  };
  document.getElementById('rmCancel').onclick = function () {
    RM.phase = 'cancelled'; RM.onFrame = null;
    try { if (encoder) encoder.close(); } catch (e) {}
    overlay.innerHTML =
      '<div style="font-size:20px;font-weight:800;margin-bottom:8px">Cancelled</div>' +
      '<div style="font-size:13px;color:#8b95ab;margin-bottom:18px">No video was saved.</div>' +
      '<button id="rmBack" ' +
      'style="font-size:16px;font-weight:700;border:0;border-radius:12px;padding:14px 24px;background:#1a2236;color:#fff">Back to queue</button>';
    /* Was: inline onclick with curly quotes around the URL — a JS syntax
       error, so tapping the button silently did nothing. */
    document.getElementById('rmBack').onclick = function () {
      location.href = 'https://bassseamoor.github.io/render-queue/';
    };
  };

  /* ---- force render-size drawing buffer, keep screen awake ----
     Set the buffer directly (reliable) and also try the studio's own
     resize path if it exposes one (it may reallocate its targets). */
  try {
    if (rcanvas) { rcanvas.width = W; rcanvas.height = H; }
    if (typeof loop !== 'undefined' && loop && loop.resize) { try { loop.resize(); } catch (e) {} }
  } catch (e) {}
  try {
    if (navigator.wakeLock) {
      var keepAwake = function () { navigator.wakeLock.request('screen').catch(function () {}); };
      keepAwake();
      document.addEventListener('visibilitychange', function () { if (!document.hidden) keepAwake(); });
    }
  } catch (e) {}
  setStatus('Preparing\u2026 (warming up)');
})();

</script>
</body>
</html>
