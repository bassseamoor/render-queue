<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0805">
<title>Fireplace Studio v3 — Real 3D</title>
<style>
  :root{
    --accent:#ffb35c; --accent2:#ff7a2f;
    --ink:#f5e9d8; --ink-dim:rgba(240,220,195,.60);
    --glass:rgba(16,10,6,.60); --glass-brd:rgba(255,180,120,.20);
    --pill:rgba(30,20,12,.72);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;background:#0d0805;overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
  #stage{position:fixed;inset:0;overflow:hidden;background:#0d0805}
  #scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .glass{background:var(--glass);border:1px solid var(--glass-brd);border-radius:18px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 10px 34px rgba(0,0,0,.45)}
  #topbar{position:absolute;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:10px;padding:8px 10px 8px 16px;z-index:10;
    max-width:calc(100vw - 24px);flex-wrap:wrap;justify-content:center}
  .brand{font-weight:700;font-size:15px;letter-spacing:.4px;white-space:nowrap}
  .brand .ver{font-size:10px;font-weight:600;color:var(--ink-dim);border:1px solid var(--glass-brd);
    border-radius:8px;padding:2px 6px;margin-left:6px;vertical-align:2px}
  .iconbtn{border:1px solid transparent;background:transparent;color:var(--ink);font-size:16px;
    border-radius:10px;padding:5px 8px;cursor:pointer;line-height:1}
  .iconbtn:hover{background:rgba(255,180,120,.14)}
  #hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:9;
    font-size:11.5px;color:rgba(240,220,195,.40);letter-spacing:.6px;white-space:nowrap}
  #nogl{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:30px;
    color:#f5e9d8;font-size:15px;z-index:20}
  #stage:fullscreen #topbar,#stage:fullscreen #hint{display:none}
  #stage:fullscreen #scene{cursor:none}
  @media (max-width:760px){ .brand span.t{display:none} #hint{display:none} }
</style>
</head>
<body>
<div id="stage">
  <canvas id="scene"></canvas>
  <header id="topbar" class="glass">
    <div class="brand">🔥 Fireplace Studio <span class="ver">v3 · 3D</span></div>
    <button class="iconbtn" id="fullBtn" title="Fullscreen (F)">⛶</button>
  </header>
  <div id="hint">H hide UI &nbsp;·&nbsp; F fullscreen &nbsp;·&nbsp; drag seed pill for console</div>
  <div id="nogl"><div><h2>WebGL2 unavailable</h2><p>This studio needs WebGL2. Try a different browser.</p></div></div>
</div>
<script>
"use strict";
/* =====================================================================
   Fireplace Studio v5 — alpine lake house. Wholesale rebuild (2026-09-23).
   Raw WebGL2, zero runtime dependencies, one self-contained file.
   Massive dark stone fireplace wall + wide firebox + log niche, floor-to-
   ceiling glass, calm lake, forested snowy mountains, timber deck, daybed.
   Seed format "#3" + 8 hex digits. Deterministic ?render=1 fixed-step export.
   ===================================================================== */
const canvas = document.getElementById("scene");
const gl = canvas.getContext("webgl2", { antialias:false, alpha:false, powerPreference:"high-performance" });
if (!gl) { document.getElementById("nogl").style.display = "flex"; throw new Error("WebGL2 unavailable"); }

/* ---------------- utils ---------------- */
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function sstep(a,b,v){ const t=clamp((v-a)/(b-a),0,1); return t*t*(3-2*t); }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function cryptoUint32(){ const b=new Uint32Array(1); crypto.getRandomValues(b); return b[0]; }

/* ---------------- matrices (column-major Float32Array[16]) ---------------- */
function mIdent(){ const m=new Float32Array(16); m[0]=m[5]=m[10]=m[15]=1; return m; }
function mMul(a,b){ const o=new Float32Array(16);
  for (let c=0;c<4;c++) for (let r=0;r<4;r++){ let s=0; for (let k=0;k<4;k++) s+=a[k*4+r]*b[c*4+k]; o[c*4+r]=s; }
  return o; }
function mT(x,y,z){ const m=mIdent(); m[12]=x;m[13]=y;m[14]=z; return m; }
function mS(x,y,z){ const m=mIdent(); m[0]=x;m[5]=y;m[10]=z; return m; }
function mRx(a){ const m=mIdent(),c=Math.cos(a),s=Math.sin(a); m[5]=c;m[6]=s;m[9]=-s;m[10]=c; return m; }
function mRy(a){ const m=mIdent(),c=Math.cos(a),s=Math.sin(a); m[0]=c;m[2]=-s;m[8]=s;m[10]=c; return m; }
function mRz(a){ const m=mIdent(),c=Math.cos(a),s=Math.sin(a); m[0]=c;m[1]=s;m[4]=-s;m[5]=c; return m; }
function mPersp(fovy,aspect,near,far){
  const m=new Float32Array(16), f=1/Math.tan(fovy*Math.PI/360);
  m[0]=f/aspect; m[5]=f; m[10]=(far+near)/(near-far); m[11]=-1;
  m[14]=2*far*near/(near-far); return m; }
function mLookAt(eye,ctr,up){
  up=up||[0,1,0];
  let zx=eye[0]-ctr[0], zy=eye[1]-ctr[1], zz=eye[2]-ctr[2];
  let l=Math.hypot(zx,zy,zz); zx/=l;zy/=l;zz/=l;
  let xx=up[1]*zz-up[2]*zy, xy=up[2]*zx-up[0]*zz, xz=up[0]*zy-up[1]*zx;
  l=Math.hypot(xx,xy,xz); xx/=l;xy/=l;xz/=l;
  const yx=zy*xz-zz*xy, yy=zz*xx-zx*xz, yz=zx*xy-zy*xx;
  const m=new Float32Array(16);
  m[0]=xx;m[1]=yx;m[2]=zx;m[4]=xy;m[5]=yy;m[6]=zy;m[8]=xz;m[9]=yz;m[10]=zz;m[15]=1;
  m[12]=-(xx*eye[0]+xy*eye[1]+xz*eye[2]);
  m[13]=-(yx*eye[0]+yy*eye[1]+yz*eye[2]);
  m[14]=-(zx*eye[0]+zy*eye[1]+zz*eye[2]);
  return m; }
function mOrtho(l,r,b,t,n,f){
  const m=new Float32Array(16);
  m[0]=2/(r-l); m[5]=2/(t-b); m[10]=-2/(f-n); m[15]=1;
  m[12]=-(r+l)/(r-l); m[13]=-(t+b)/(t-b); m[14]=-(f+n)/(f-n);
  return m; }
function mInverse(m){
  const o=new Float32Array(16);
  const a00=m[0],a01=m[1],a02=m[2],a03=m[3],a10=m[4],a11=m[5],a12=m[6],a13=m[7],
        a20=m[8],a21=m[9],a22=m[10],a23=m[11],a30=m[12],a31=m[13],a32=m[14],a33=m[15];
  const b00=a00*a11-a01*a10,b01=a00*a12-a02*a10,b02=a00*a13-a03*a10,b03=a01*a12-a02*a11,
        b04=a01*a13-a03*a11,b05=a02*a13-a03*a12,b06=a20*a31-a21*a30,b07=a20*a32-a22*a30,
        b08=a20*a33-a23*a30,b09=a21*a32-a22*a31,b10=a21*a33-a23*a31,b11=a22*a33-a23*a32;
  let det=b00*b11-b01*b10+b02*b09+b03*b08-b04*b07+b05*b06;
  if(!det) return mIdent();
  det=1/det;
  o[0]=(a11*b11-a12*b10+a13*b09)*det; o[1]=(a02*b10-a01*b11-a03*b09)*det;
  o[2]=(a31*b05-a32*b04+a33*b03)*det; o[3]=(a22*b04-a21*b05-a23*b03)*det;
  o[4]=(a12*b08-a10*b11-a13*b07)*det; o[5]=(a00*b11-a02*b08+a03*b07)*det;
  o[6]=(a32*b02-a30*b05-a33*b01)*det; o[7]=(a20*b05-a22*b02+a23*b01)*det;
  o[8]=(a10*b10-a11*b08+a13*b06)*det; o[9]=(a01*b08-a00*b10-a03*b06)*det;
  o[10]=(a30*b04-a31*b02+a32*b01)*det; o[11]=(a21*b02-a20*b04-a22*b01)*det;
  o[12]=(a11*b07-a10*b09-a12*b06)*det; o[13]=(a00*b09-a01*b07+a02*b06)*det;
  o[14]=(a31*b01-a30*b03-a32*b00)*det; o[15]=(a20*b03-a21*b01+a22*b00)*det;
  return o; }

/* ---------------- settings / enums ---------------- */
const STONES = ["dark slate","fieldstone","limestone","basalt"];
const FLOORS = ["polished concrete","dark wood","oak","stone tile"];
const WOODS  = ["walnut","oak","charred black"];
const RUGS   = ["wool weave","jute","high-pile shag","flat kilim"];
const WEATHERS = ["clear","overcast","rain","snowfall","lake mist"];
const TIMES  = ["day","golden dusk","night"];
const CAMS   = ["reference","fireside","lakeside","daybed","deck","ember macro"];
const MOTIONS= ["still","drift","slow push"];
const FIRES  = ["low","medium","roaring"];
const WATERS = ["calm","rippled","choppy"];
const DECKS  = ["slatted lounger","bench","minimal"];
const GRAINS = ["Heavy","Off","Subtle","Medium","Max"]; /* 0=Heavy keeps legacy seeds identical */
const settings = {
  seed: 0, ver: 3,
  stone:0, floor:0, wood:0, rug:0, weather:0, time:0, water:0,
  camera:0, motion:1, fire:1, sparks:60, glow:0, deck:0, grain:0
};
function parseSeed(s){
  s = String(s||"").trim();
  let m = s.match(/^#3([0-9A-Fa-f]{8})$/);
  if (m) return { n: parseInt(m[1],16)>>>0, ver: 3 };
  m = s.match(/^#([0-9A-Fa-f]{8})$/);
  if (m) return { n: parseInt(m[1],16)>>>0, ver: 2 }; /* legacy: remap to closest v3 */
  m = s.match(/^(\d{1,10})$/);
  if (m) return { n: (parseInt(m[1],10)>>>0), ver: 1 };
  return { n: cryptoUint32(), ver: 3 };
}
function seedText(){ return "#3" + (settings.seed>>>0).toString(16).toUpperCase().padStart(8,"0"); }

/* ---------------- global scene state ---------------- */
const S = {
  draws: [], mtns: [], water: null, glass: null, parts: [],
  rig: null, cam: null, proj: null, simT: 0,
  texSeed: 1, camPhase: 0, flamePhase: [0,0,0],
  firePos: [-4.25,0.85,-0.9], fireCol: [1.0,0.42,0.12], flick: 1.0,
  shadowM: null, bakedKey: "",
};
const TEX = {};   /* name -> {alb,nrm,rgh} */
const MAT_TEX = ["stone","wood","bark","concrete","tile","fabric","rug","metal"];

/* ============================================================================
   TEXTURE BAKING — albedo (+baked AO in alpha), height->normal, roughness.
   All deterministic: seeded per baker tag. Sizes kept small for phone GPUs.
   ============================================================================ */
function bakeRng(tag){ let h=2166136261; for(let i=0;i<tag.length;i++){ h^=tag.charCodeAt(i); h=Math.imul(h,16777619); } return mulberry32(h>>>0); }
/* proper Perlin-style gradient noise (deterministic, tileable-ish) */
function makeVNoise(rng){
  const perm=[...Array(256).keys()];
  for(let i=255;i>0;i--){ const j=(rng()*(i+1))|0; const t=perm[i]; perm[i]=perm[j]; perm[j]=t; }
  const p=new Uint8Array(512); for(let i=0;i<512;i++) p[i]=perm[i&255];
  const fade=t=>t*t*(3-2*t);
  function grad(h,x,y){ switch(h&15){ case 0:case 1:return x+y; case 2:case 3:return -x+y; case 4:case 5:return x-y;
    case 6:case 7:return -x-y; case 8:case 9:return x; case 10:case 11:return -x; case 12:case 13:return y; default:return -y; } }
  return function(x,y){
    const X=Math.floor(x)&255, Y=Math.floor(y)&255;
    x-=Math.floor(x); y-=Math.floor(y);
    const u=fade(x), v=fade(y);
    const aa=p[(p[X]+Y)&255], ab=p[(p[X]+Y+1)&255], ba=p[(p[X+1&255]+Y)&255], bb=p[(p[X+1&255]+Y+1)&255];
    return lerp(lerp(grad(aa,x,y),grad(ba,x-1,y),u), lerp(grad(ab,x,y-1),grad(bb,x-1,y-1),u), v)*0.7+0.5;
  };
}
function fbmFactory(nz){ return function(x,y,oct){ let s=0,a=0.5,f=1,nm=0; for(let i=0;i<oct;i++){ s+=a*nz(x*f,y*f); nm+=a; a*=0.5; f*=2.03; } return s/nm; }; }

function heightToNormal(h, size, strength){
  const out=new Uint8Array(size*size*4);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const xm=h[y*size+((x-1+size)%size)], xp=h[y*size+((x+1)%size)];
    const ym=h[((y-1+size)%size)*size+x], yp=h[((y+1)%size)*size+x];
    const dx=(xm-xp)*strength, dy=(ym-yp)*strength;
    const inv=1/Math.sqrt(dx*dx+dy*dy+1);
    const i=(y*size+x)*4;
    out[i]=clamp(-dx*inv*0.5+0.5,0,1)*255;
    out[i+1]=clamp(-dy*inv*0.5+0.5,0,1)*255;
    out[i+2]=clamp(inv*0.5+0.5,0,1)*255;
    out[i+3]=255;
  }
  return out;
}
let anisoExt=null, anisoMax=1;
function ensureAniso(){
  if(!anisoExt){ anisoExt=gl.getExtension("EXT_texture_filter_anisotropic");
    if(anisoExt) anisoMax=Math.min(4,gl.getParameter(anisoExt.MAX_TEXTURE_MAX_ANISOTROPY_EXT)); }
}
function glTex3(data,size,srgb){
  const t=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texImage2D(gl.TEXTURE_2D,0,srgb?gl.SRGB8_ALPHA8:gl.RGBA8,size,size,0,gl.RGBA,gl.UNSIGNED_BYTE,data);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.REPEAT);
  if(anisoExt) gl.texParameterf(gl.TEXTURE_2D,anisoExt.TEXTURE_MAX_ANISOTROPY_EXT,anisoMax);
  return t;
}
function makeTexSet(name, alb, nrm, rgh, size){
  TEX[name]={ alb:glTex3(alb,size,true), nrm:glTex3(nrm,size,false), rgh:glTex3(rgh,size,false) };
}
/* ---- stone: coursed blocks, recessed mortar, per-block variation ---- */
function bakeStone(v){
  const size=256, rng=bakeRng("stone"+v), nz=makeVNoise(rng), fbm=fbmFactory(nz);
  const cfg=[
    {base:[0.145,0.14,0.15], mort:[0.045,0.045,0.05], rows:7, var:0.10, relief:0.5},
    {base:[0.40,0.36,0.31],  mort:[0.15,0.14,0.12],  rows:6, var:0.16, relief:0.8},
    {base:[0.60,0.57,0.51],  mort:[0.33,0.31,0.27],  rows:8, var:0.08, relief:0.35},
    {base:[0.09,0.09,0.10],  mort:[0.028,0.028,0.032],rows:7, var:0.07, relief:0.4},
  ][v];
  const rows=[]; let y0=0;
  for(let r=0;r<cfg.rows;r++){
    const rh=size/cfg.rows*(0.85+rng()*0.3); const off=(r%2)*0.5+rng()*0.3;
    const blocks=[]; let x=-off*size/cfg.rows;
    while(x<size){ const w=size/cfg.rows*(0.9+rng()*0.9); blocks.push([x,x+w,rng()]); x+=w; }
    rows.push({y0,y1:y0+rh,blocks}); y0+=rh;
  }
  const alb=new Uint8Array(size*size*4), hgt=new Float32Array(size*size), rgh=new Uint8Array(size*size*4);
  const mPx=size/cfg.rows*0.055;
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    let row=rows[rows.length-1]; for(const r of rows){ if(y<r.y1){ row=r; break; } }
    let blk=row.blocks[row.blocks.length-1];
    for(const b of row.blocks){ if(x>=b[0]&&x<b[1]){ blk=b; break; } }
    const dEdge=Math.min(x-blk[0],blk[1]-x,y-row.y0,row.y1-y);
    const mortar=sstep(mPx*1.6,mPx*0.4,dEdge);
    const bv=blk[2];
    const det=fbm(x*0.05,y*0.05,4);
    const tone=1+(bv-0.5)*cfg.var*2+(det-0.5)*0.22;
    const i=(y*size+x)*4;
    const col=mortar>0.5?cfg.mort:cfg.base;
    const sh=mortar>0.5?1:(1-mortar*0.55);
    alb[i]=clamp(col[0]*tone*sh,0,1)*255; alb[i+1]=clamp(col[1]*tone*sh,0,1)*255; alb[i+2]=clamp(col[2]*tone*sh,0,1)*255;
    alb[i+3]=clamp(1-mortar*0.62,0,1)*255; /* baked AO in mortar */
    hgt[y*size+x]=(1-mortar)*cfg.relief+det*0.25;
    const r=clamp(0.85-mortar*0.1+(det-0.5)*0.2,0.05,1);
    rgh[i]=r*255; rgh[i+1]=255; rgh[i+2]=255; rgh[i+3]=255;
  }
  return {alb, nrm:heightToNormal(hgt,size,2.2), rgh, size};
}
/* ---- wood planks: grain, knots, seams (neutral oak; tinted per use) ---- */
function bakeWood(){
  const size=256, rng=bakeRng("wood"), nz=makeVNoise(rng), fbm=fbmFactory(nz);
  const planks=5, ph=size/planks;
  const alb=new Uint8Array(size*size*4), hgt=new Float32Array(size*size), rgh=new Uint8Array(size*size*4);
  const knots=[]; for(let k=0;k<7;k++) knots.push([rng()*size,rng()*size,3+rng()*5]);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const pl=Math.min(planks-1,(y/ph)|0);
    const seam=sstep(2.2,0.6,Math.min(y-pl*ph,(pl+1)*ph-y));
    const g=fbm(x*0.012,(y+pl*37)*0.09,4);
    const g2=fbm(x*0.05,y*0.35+pl*11,3);
    let tone=0.82+g*0.36+(g2-0.5)*0.14;
    let kd=1e9; for(const k of knots){ const d=Math.hypot(x-k[0],y-k[1])/k[2]; if(d<kd)kd=d; }
    const knot=sstep(1.4,0.5,kd);
    tone*=1-knot*0.45;
    const i=(y*size+x)*4;
    const sh=1-seam*0.55;
    alb[i]=clamp(0.46*tone*sh,0,1)*255; alb[i+1]=clamp(0.33*tone*sh,0,1)*255; alb[i+2]=clamp(0.21*tone*sh,0,1)*255;
    alb[i+3]=clamp(1-seam*0.5-knot*0.2,0,1)*255;
    hgt[y*size+x]=(1-seam)*0.5+g*0.2-knot*0.25;
    const r=clamp(0.62+(g-0.5)*0.2+seam*0.15,0.05,1);
    rgh[i]=r*255; rgh[i+1]=255; rgh[i+2]=255; rgh[i+3]=255;
  }
  return {alb, nrm:heightToNormal(hgt,size,1.6), rgh, size};
}
/* ---- polished concrete: pores, trowel sweep ---- */
function bakeConcrete(){
  const size=256, rng=bakeRng("concrete"), nz=makeVNoise(rng), fbm=fbmFactory(nz);
  const alb=new Uint8Array(size*size*4), hgt=new Float32Array(size*size), rgh=new Uint8Array(size*size*4);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const d=fbm(x*0.02,y*0.02,4), d2=fbm(x*0.11+9,y*0.11,3);
    const pore=sstep(0.72,0.9,fbm(x*0.35,y*0.35,2))*sstep(0.4,0.2,d2);
    const tone=0.92+(d-0.5)*0.16-pore*0.5;
    const i=(y*size+x)*4;
    alb[i]=clamp(0.56*tone,0,1)*255; alb[i+1]=clamp(0.55*tone,0,1)*255; alb[i+2]=clamp(0.53*tone,0,1)*255;
    alb[i+3]=clamp(1-pore*0.35,0,1)*255;
    hgt[y*size+x]=d*0.3-pore*0.4;
    const r=clamp(0.42+(d-0.5)*0.25+pore*0.4,0.05,1);
    rgh[i]=r*255; rgh[i+1]=255; rgh[i+2]=255; rgh[i+3]=255;
  }
  return {alb, nrm:heightToNormal(hgt,size,1.2), rgh, size};
}
/* ---- large stone tile ---- */
function bakeTile(){
  const size=256, rng=bakeRng("tile"), nz=makeVNoise(rng), fbm=fbmFactory(nz);
  const n=2, ts=size/n;
  const alb=new Uint8Array(size*size*4), hgt=new Float32Array(size*size), rgh=new Uint8Array(size*size*4);
  const tv=[]; for(let k=0;k<n*n;k++) tv.push(0.9+rng()*0.2);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const tx=(x/ts)|0, ty=(y/ts)|0;
    const lx=x-tx*ts, ly=y-ty*ts;
    const grout=sstep(3.2,1.0,Math.min(lx,ly,ts-lx,ts-ly));
    const d=fbm(x*0.04,y*0.04,4);
    const tone=tv[ty*n+tx]*(0.9+(d-0.5)*0.2);
    const i=(y*size+x)*4;
    const sh=1-grout*0.45;
    alb[i]=clamp(0.50*tone*sh,0,1)*255; alb[i+1]=clamp(0.49*tone*sh,0,1)*255; alb[i+2]=clamp(0.47*tone*sh,0,1)*255;
    alb[i+3]=clamp(1-grout*0.6,0,1)*255;
    hgt[y*size+x]=(1-grout)*0.4+d*0.15;
    const r=clamp(0.55+(d-0.5)*0.2+grout*0.2,0.05,1);
    rgh[i]=r*255; rgh[i+1]=255; rgh[i+2]=255; rgh[i+3]=255;

/* ---- bark: vertical ridged plates ---- */
function bakeBark(){
  const size=256, rng=bakeRng("bark"), nz=makeVNoise(rng), fbm=fbmFactory(nz);
  const alb=new Uint8Array(size*size*4), hgt=new Float32Array(size*size), rgh=new Uint8Array(size*size*4);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const r1=1-Math.abs(2*fbm(x*0.06,y*0.008,4)-1);
    const r2=1-Math.abs(2*fbm(x*0.16+7,y*0.02,3)-1);
    const ridge=Math.pow(r1*0.65+r2*0.35,1.5);
    const tone=0.55+ridge*0.7+(fbm(x*0.2,y*0.2,2)-0.5)*0.2;
    const i=(y*size+x)*4;
    alb[i]=clamp(0.30*tone,0,1)*255; alb[i+1]=clamp(0.21*tone,0,1)*255; alb[i+2]=clamp(0.14*tone,0,1)*255;
    alb[i+3]=clamp(0.45+ridge*0.55,0,1)*255;
    hgt[y*size+x]=ridge*0.9;
    rgh[i]=clamp(0.9-ridge*0.1,0.05,1)*255; rgh[i+1]=255; rgh[i+2]=255; rgh[i+3]=255;
  }
  return {alb, nrm:heightToNormal(hgt,size,2.4), rgh, size};
}
/* ---- rugs: 4 weaves ---- */
function bakeRug(v){
  const size=256, rng=bakeRng("rug"+v), nz=makeVNoise(rng), fbm=fbmFactory(nz);
  const alb=new Uint8Array(size*size*4), hgt=new Float32Array(size*size), rgh=new Uint8Array(size*size*4);
  const pals=[
    [[0.52,0.48,0.42],[0.40,0.36,0.31]],  /* wool weave */
    [[0.55,0.47,0.33],[0.44,0.37,0.25]],  /* jute */
    [[0.48,0.44,0.40],[0.36,0.33,0.30]],  /* shag */
    [[0.45,0.38,0.30],[0.30,0.26,0.22]],  /* kilim */
  ];
  const pal=pals[v];
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const i=(y*size+x)*4;
    let h=0.5, mix=0, rough=0.95;
    if(v===0){ const w=Math.sin(x*0.55)*Math.sin(y*0.55); mix=sstep(-0.3,0.3,w); h=0.55+w*0.2; }
    else if(v===1){ const row=Math.sin(y*0.42+fbm(x*0.03,y*0.03,2)*4); mix=sstep(-0.4,0.4,row); h=0.5+row*0.25; rough=0.9; }
    else if(v===2){ const c=fbm(x*0.09,y*0.09,4); mix=sstep(0.3,0.7,c); h=0.35+c*0.65; }
    else { const d=Math.abs(((x+y*0.5)%64+64)%64-32)/32; const band=sstep(0.75,0.95,Math.sin(y*0.10)*0.5+0.5);
      mix=Math.max(sstep(0.55,0.75,d),band*0.8); h=0.5; rough=0.92; }
    const det=(fbm(x*0.3,y*0.3,2)-0.5)*0.25;
    const t=clamp(mix+det,0,1);
    alb[i]=clamp(lerp(pal[0][0],pal[1][0],t),0,1)*255;
    alb[i+1]=clamp(lerp(pal[0][1],pal[1][1],t),0,1)*255;
    alb[i+2]=clamp(lerp(pal[0][2],pal[1][2],t),0,1)*255;
    alb[i+3]=clamp(0.75+h*0.25,0,1)*255;
    hgt[y*size+x]=h;
    rgh[i]=rough*255; rgh[i+1]=255; rgh[i+2]=255; rgh[i+3]=255;
  }
  return {alb, nrm:heightToNormal(hgt,size,2.0), rgh, size};
}
/* ---- linen fabric ---- */
function bakeFabric(){
  const size=256, rng=bakeRng("fabric"), nz=makeVNoise(rng), fbm=fbmFactory(nz);
  const alb=new Uint8Array(size*size*4), hgt=new Float32Array(size*size), rgh=new Uint8Array(size*size*4);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const w=Math.sin(x*0.9)*0.5+Math.sin(y*0.9)*0.5;
    const d=fbm(x*0.05,y*0.05,3);
    const tone=0.94+w*0.05+(d-0.5)*0.1;
    const i=(y*size+x)*4;
    alb[i]=clamp(0.78*tone,0,1)*255; alb[i+1]=clamp(0.75*tone,0,1)*255; alb[i+2]=clamp(0.70*tone,0,1)*255;
    alb[i+3]=255;
    hgt[y*size+x]=0.5+w*0.12;
    rgh[i]=235; rgh[i+1]=255; rgh[i+2]=255; rgh[i+3]=255;
  }

}
/* ---- blackened metal (mullions, table, planter) ---- */
function bakeMetal(){
  const size=128, rng=bakeRng("metal"), nz=makeVNoise(rng), fbm=fbmFactory(nz);
  const alb=new Uint8Array(size*size*4), hgt=new Float32Array(size*size), rgh=new Uint8Array(size*size*4);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){

    const tone=0.9+(brush-0.5)*0.25;
    const i=(y*size+x)*4;
    alb[i]=0.05*tone*255; alb[i+1]=0.05*tone*255; alb[i+2]=0.055*tone*255; alb[i+3]=255;
    hgt[y*size+x]=0.5;
    const r=clamp(0.38+(brush-0.5)*0.3,0.05,1);

/* ---- mountain heightfield ---- */
function bakeMountainH(){
  const size=256, rng=bakeRng("mtn"), nz=makeVNoise(rng), fbm=fbmFactory(nz);
  const h=new Float32Array(size*size);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const u=x/size, v=y/size;
    let r=1-Math.abs(2*fbm(u*7,v*3.0,6)-1);
    r=Math.pow(r,2.1);
    const p1=Math.exp(-Math.pow((u-0.30)*3.4,2)), p2=Math.exp(-Math.pow((u-0.72)*2.8,2)), p3=Math.exp(-Math.pow((u-0.52)*5.2,2));

    hgt*=1.0-sstep(0.78,0.98,v); /* valley carve near the lake line (v=1 = wall base) */
    h[y*size+x]=clamp(hgt,0,1);
  }
  return h;
}

/* ============================================================================
   GEOMETRY — indexed meshes with position/normal/uv, VAOs cached.
   ============================================================================ */
function geoPlane(w,h,sx,sz){
  const pos=[],nrm=[],uv=[],idx=[];
  for(let j=0;j<=sz;j++)for(let i=0;i<=sx;i++){
    const x=(i/sx-0.5)*w, z=(j/sz-0.5)*h;
    pos.push(x,0,z); nrm.push(0,1,0); uv.push(i/sx,j/sz);
  }
  for(let j=0;j<sz;j++)for(let i=0;i<sx;i++){
    const a=j*(sx+1)+i, b=a+1, c=a+sx+1, d=c+1;
    idx.push(a,c,b, b,c,d);
  }
  return {pos,nrm,uv,idx};
}
/* vertical wall plane (faces +z), y in [0,1], subdivided */
function geoWall(w,h,sx,sy){
  const g=geoPlane(w,h,sx,sy);
  for(let i=0;i<g.pos.length;i+=3){ const z=g.pos[i+2]; g.pos[i+1]=-z+0.5; g.pos[i+2]=0; }
  for(let i=0;i<g.nrm.length;i+=3){ g.nrm[i]=0; g.nrm[i+1]=0; g.nrm[i+2]=1; }
  for(let i=0;i<g.idx.length;i+=3){ const t=g.idx[i+1]; g.idx[i+1]=g.idx[i+2]; g.idx[i+2]=t; }
  return g;
}
function geoBox(){
  /* 24-vert box, proper face normals/uvs, unit cube centered at origin */
  const pos=[],nrm=[],uv=[],idx=[];
  const corners=[[-0.5,-0.5,-0.5],[0.5,-0.5,-0.5],[0.5,0.5,-0.5],[-0.5,0.5,-0.5],
                 [-0.5,-0.5,0.5],[0.5,-0.5,0.5],[0.5,0.5,0.5],[-0.5,0.5,0.5]];
  const faces=[[4,5,6,7],[1,0,3,2],[0,4,7,3],[5,1,2,6],[7,6,2,3],[0,1,5,4]]; /* +z,-z,-x,+x,+y,-y */
  const norms=[[0,0,1],[0,0,-1],[-1,0,0],[1,0,0],[0,1,0],[0,-1,0]];
  for(let f=0;f<6;f++){
    const base=pos.length/3;
    for(let k=0;k<4;k++){ const c=corners[faces[f][k]]; pos.push(c[0],c[1],c[2]); nrm.push(...norms[f]); uv.push(k===0||k===3?0:1, k<2?0:1); }
    idx.push(base,base+1,base+2, base,base+2,base+3);
  }
  return {pos,nrm,uv,idx};
}
function geoRBox(r,seg){
  /* true rounded box: per-face grids projected onto the rounded surface,
     analytic normals. Gives genuinely soft highlights on furniture edges. */
  r=clamp(r||0.06,0.004,0.24); seg=seg||3;
  const pos=[],nrm=[],uv=[],idx=[];
  const faces=[
    {n:[0,0,1], u:[1,0,0], v:[0,1,0]},
    {n:[0,0,-1],u:[-1,0,0],v:[0,1,0]},
    {n:[1,0,0], u:[0,0,-1],v:[0,1,0]},
    {n:[-1,0,0],u:[0,0,1], v:[0,1,0]},
    {n:[0,1,0], u:[1,0,0], v:[0,0,-1]},
    {n:[0,-1,0],u:[1,0,0], v:[0,0,1]}
  ];
  const inner=0.5-r;
  for(const f of faces){
    const base=pos.length/3;
    for(let j=0;j<=seg;j++)for(let i=0;i<=seg;i++){
      const a=i/seg-0.5, b=j/seg-0.5;
      const px=f.n[0]*0.5+f.u[0]*a+f.v[0]*b;
      const py=f.n[1]*0.5+f.u[1]*a+f.v[1]*b;
      const pz=f.n[2]*0.5+f.u[2]*a+f.v[2]*b;
      const qx=clamp(px,-inner,inner), qy=clamp(py,-inner,inner), qz=clamp(pz,-inner,inner);
      let nx=px-qx, ny=py-qy, nz=pz-qz;
      const l=Math.hypot(nx,ny,nz);
      if(l>1e-6){ nx/=l; ny/=l; nz/=l; } else { nx=f.n[0]; ny=f.n[1]; nz=f.n[2]; }
      pos.push(qx+nx*r, qy+ny*r, qz+nz*r);
      nrm.push(nx,ny,nz);
      uv.push(i/seg, j/seg);
    }
    for(let j=0;j<seg;j++)for(let i=0;i<seg;i++){
      const a0=base+j*(seg+1)+i, b0=a0+1, c0=a0+seg+1, d0=c0+1;
      idx.push(a0,b0,c0, b0,d0,c0);
    }
  }
  return {pos,nrm,uv,idx};
}
function geoCyl(radial,hgt){
  const pos=[],nrm=[],uv=[],idx=[];
  const R=0.5;
  for(let j=0;j<=hgt;j++)for(let i=0;i<=radial;i++){
    const a=i/radial*Math.PI*2;
    pos.push(Math.cos(a)*R,(j/hgt-0.5),Math.sin(a)*R);
    nrm.push(Math.cos(a),0,Math.sin(a)); uv.push(i/radial,j/hgt);
  }
  for(let j=0;j<hgt;j++)for(let i=0;i<radial;i++){
    const a=j*(radial+1)+i,b=a+1,c=a+radial+1,d=c+1;
    idx.push(a,b,c, b,d,c);
  }
  /* top cap fan */
  const tc=pos.length/3;
  pos.push(0,0.5,0); nrm.push(0,1,0); uv.push(0.5,0.5);
  for(let i=0;i<radial;i++) idx.push(tc, i, i+1);
  /* bottom cap fan */
  const bc=pos.length/3;
  pos.push(0,-0.5,0); nrm.push(0,-1,0); uv.push(0.5,0.5);
  const bs=hgt*(radial+1);
  for(let i=0;i<radial;i++) idx.push(bc, bs+i+1, bs+i);
  return {pos,nrm,uv,idx};
}
function geoSphere(rad,radial,vertical){
  const pos=[],nrm=[],uv=[],idx=[];
  for(let j=0;j<=vertical;j++)for(let i=0;i<=radial;i++){
    const th=i/radial*Math.PI*2, ph=j/vertical*Math.PI;
    const x=Math.sin(ph)*Math.cos(th), y=Math.cos(ph), z=Math.sin(ph)*Math.sin(th);
    pos.push(x*rad,y*rad,z*rad); nrm.push(x,y,z); uv.push(i/radial,j/vertical);
  }
  for(let j=0;j<vertical;j++)for(let i=0;i<radial;i++){
    const a=j*(radial+1)+i,b=a+1,c=a+radial+1,d=c+1;
    idx.push(a,c,b, b,c,d);
  }
  return {pos,nrm,uv,idx};
}
function makeMesh(g){

const GLSL_NOISE = `
float hash12(vec2 p){ vec3 p3=fract(vec3(p.xyx)*0.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }

const SKY_FN = `
vec3 skyColor(vec3 d, float t){

  vec3 zen = mix(vec3(0.16,0.30,0.52), vec3(0.008,0.015,0.045), uNight);
  vec3 mid = mix(vec3(0.42,0.55,0.70), vec3(0.020,0.035,0.080), uNight);
  vec3 hor = mix(vec3(0.75,0.72,0.68), vec3(0.050,0.070,0.120), uNight);
  float sunAz = max(dot(normalize(d.xz+vec2(1e-4)), normalize(sd.xz+vec2(1e-4))), 0.0);
  vec3 warm = vec3(1.0,0.45,0.18)*pow(sunAz,3.0)*dayF*clamp(1.0-abs(sdY)*4.0,0.0,1.0);
  vec3 col = mix(hor, mid, smoothstep(0.0,0.25,d.y));
  col = mix(col, zen, smoothstep(0.2,0.9,d.y));

  col += uSunCol*(pow(cosA,1500.0)*8.0+pow(cosA,24.0)*0.35)*uSunI*dayF;

    col += vec3(0.9,0.95,1.0)*star*(0.5+0.5*sin(t*2.0+h*40.0))*uNight;

  float cl = fbm(cuv*1.6);

  vec3 cloudCol = mix(vec3(0.85,0.87,0.90), vec3(0.04,0.05,0.09), uNight);

  gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fsSrc));
  gl.linkProgram(p);

/* ============================================================================

   ============================================================================ */
let msFBO=null, msColorRB=null, msDepthRB=null, resFBO=null, resTex=null, resDepthRB=null;
let depFBO=null, depTex=null, depW=0, depH=0, fbW=0, fbH=0;
let shFBO=null, shTex=null;
let postVAO=null;
function ensureShadow(){
  if(shFBO) return;
  shTex=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,shTex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.DEPTH_COMPONENT24,1024,1024,0,gl.DEPTH_COMPONENT,gl.UNSIGNED_INT,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  shFBO=gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER,shFBO);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.TEXTURE_2D,shTex,0);
  gl.drawBuffers([gl.NONE]); gl.readBuffer(gl.NONE);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
}
let depRB=null;
function ensureDepth(w,h){
  const dw=Math.max(2,w>>1), dh=Math.max(2,h>>1);
  if(depFBO && dw===depW && dh===depH) return;
  if(depFBO){ gl.deleteTexture(depTex); gl.deleteRenderbuffer(depRB); gl.deleteFramebuffer(depFBO); }
  depW=dw; depH=dh;
  depTex=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,depTex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,dw,dh,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  depRB=gl.createRenderbuffer();
  gl.bindRenderbuffer(gl.RENDERBUFFER,depRB);
  gl.renderbufferStorage(gl.RENDERBUFFER,gl.DEPTH_COMPONENT24,dw,dh);
  depFBO=gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER,depFBO);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,depTex,0);
  gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.RENDERBUFFER,depRB);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
}
function ensureFBO(w,h){
  if(msFBO && w===fbW && h===fbH) return;
  for(const o of [msColorRB,msDepthRB,resDepthRB]) if(o) gl.deleteRenderbuffer(o);
  for(const o of [msFBO,resFBO]) if(o) gl.deleteFramebuffer(o);
  if(resTex) gl.deleteTexture(resTex);
  fbW=w; fbH=h;
  msColorRB=gl.createRenderbuffer(); gl.bindRenderbuffer(gl.RENDERBUFFER,msColorRB);
  gl.renderbufferStorageMultisample(gl.RENDERBUFFER,4,gl.RGBA8,w,h);
  msDepthRB=gl.createRenderbuffer(); gl.bindRenderbuffer(gl.RENDERBUFFER,msDepthRB);
  gl.renderbufferStorageMultisample(gl.RENDERBUFFER,4,gl.DEPTH_COMPONENT24,w,h);
  msFBO=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,msFBO);
  gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.RENDERBUFFER,msColorRB);
  gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.RENDERBUFFER,msDepthRB);
  resTex=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,resTex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  resDepthRB=gl.createRenderbuffer(); gl.bindRenderbuffer(gl.RENDERBUFFER,resDepthRB);
  gl.renderbufferStorage(gl.RENDERBUFFER,gl.DEPTH_COMPONENT24,w,h);
  resFBO=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,resFBO);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,resTex,0);
  gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.RENDERBUFFER,resDepthRB);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  ensureDepth(w,h);
  if(!postVAO){
    postVAO=gl.createVertexArray(); gl.bindVertexArray(postVAO);
    const b=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1, 3,-1, -1,3]),gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
    gl.bindVertexArray(null);
  }
}

function cameraAt(te){
  const A = CAMS_DEF[clamp(settings.camera|0,0,CAMS_DEF.length-1)];
  let ex=A.eye[0],ey=A.eye[1],ez=A.eye[2], tx=A.tgt[0],ty=A.tgt[1],tz=A.tgt[2];
  const mo=settings.motion|0;
  if (mo===1){ ex+=Math.sin(te*0.10+S.camPhase)*0.14; ey+=Math.sin(te*0.073+S.camPhase*1.7)*0.06; }
  else if (mo===2){ const k=0.5-0.5*Math.cos(te*2*Math.PI/50+S.camPhase); const dx=tx-ex,dy=ty-ey,dz=tz-ez; ex+=dx*0.16*k; ey+=dy*0.16*k; ez+=dz*0.16*k; }
  else { ex+=Math.sin(te*0.05)*0.015; }
  tx+=Math.sin(te*0.09+S.camPhase)*0.03;
  return { eye:[ex,ey,ez], tgt:[tx,ty,tz], fov:A.fov };

function computeRig(st){
  const w=st.weather|0, t=st.time|0;
  const W = [
    {cloud:0.22,haze:0.22,rain:0,snow:0,mist:0.0,sunMul:1.0},
    {cloud:0.85,haze:0.55,rain:0,snow:0,mist:0.15,sunMul:0.42},
    {cloud:0.96,haze:0.72,rain:1,snow:0,mist:0.30,sunMul:0.30},
    {cloud:0.72,haze:0.62,rain:0,snow:1,mist:0.35,sunMul:0.55},
    {cloud:0.45,haze:0.95,rain:0,snow:0,mist:1.0,sunMul:0.60},
  ][w];
  const R = { W, night:0, cloud:W.cloud, haze:W.haze, rain:W.rain, snow:W.snow, mist:W.mist };
  const az = (S.texSeed*2.7)%(Math.PI*2);
  if (t===0){
    const el=0.95;
    R.sunDir=[Math.sin(az)*Math.cos(el)*0.9+0.35, -Math.sin(el), Math.cos(az)*Math.cos(el)*0.4-0.75];
    const l=Math.hypot(...R.sunDir); R.sunDir=R.sunDir.map(v=>v/l);
    R.sunCol=[1.0,0.96,0.90]; R.sunI=3.2*W.sunMul;
    R.moonI=0; R.exposure=1.0; R.warmth=0.35; R.amb=[0.62,0.60,0.58];
  } else if (t===1){
    const el=0.16;
    R.sunDir=[Math.sin(az)*0.9-0.55, -Math.sin(el), Math.cos(az)*0.4-0.5];
    const l=Math.hypot(...R.sunDir); R.sunDir=R.sunDir.map(v=>v/l);
    R.sunCol=[1.0,0.52,0.24]; R.sunI=2.2*W.sunMul;
    R.moonI=0; R.exposure=1.06; R.warmth=0.75; R.amb=[0.50,0.42,0.38];
  } else {
    R.night=1;
    const el=0.66;
    R.sunDir=[Math.sin(az+2.4)*0.6, -Math.sin(el), Math.cos(az+2.4)*0.5-0.4];
    const l=Math.hypot(...R.sunDir); R.sunDir=R.sunDir.map(v=>v/l);
    R.sunCol=[0.55,0.68,0.92]; R.sunI=0.70;
    R.moonI=1.0; R.exposure=1.45; R.warmth=0.25; R.amb=[0.36,0.40,0.50];
  }
  R.moonDir=R.sunDir.slice();
  R.moonCol=[0.62,0.74,0.95];
  const fi=[0.7,1.0,1.45][st.fire|0]*(t===2?1.6:1.0);
  R.fireI=fi;
  S.rig=R;
  return R;
}

      draw(M_BOX, cx+px*s-Math.sin(ry)*0.95,0.18,cz+pz*s-Math.cos(ry)*0.95, 0.07,0.36,0.07, 1, {tintA:woodT, ry});
      draw(M_BOX, cx+px*s+Math.sin(ry)*0.75,0.18,cz+pz*s+Math.cos(ry)*0.75, 0.07,0.36,0.07, 1, {tintA:woodT, ry});
    }
    for(let i=0;i<5;i++){
      const t=0.15+i*0.16;
      draw(M_BOX, cx-Math.sin(ry)*0.85, 0.62+t*0.55, cz-Math.cos(ry)*0.85-t*0.28,
        0.60,0.035,0.13, 1, {tintA:woodT, ry, rx:-0.5, uv:0.6});
    }
  } else if(dv===1){
    draw(M_RBOX, -1.6,0.30,6.6, 1.9,0.09,0.55, 1, {tintA:woodT, uv:0.5, ry:0.1});
    draw(M_BOX, -2.3,0.14,6.6, 0.09,0.28,0.5, 1, {tintA:woodT, ry:0.1});
    draw(M_BOX, -0.9,0.14,6.6, 0.09,0.28,0.5, 1, {tintA:woodT, ry:0.1});
  }
  draw(M_CYL, 3.7,0.28,5.3, 0.56,0.56,0.56, 7, {tintA:[0.06,0.06,0.065], rough:0.45});
  draw(M_CYL, 3.7,0.56,5.3, 0.50,0.03,0.50, 3, {tintA:[0.12,0.10,0.08], rough:1});

  /* ============ WATER + MOUNTAINS ============ */
  const chop=[0.25,0.7,1.4][st.water|0]*(R.rain?1.5:1)*(R.snow?0.5:1);
  S.water={ x0:-70, x1:70, z0:10, z1:68, y:-0.38, chop, seedF:S.texSeed };
  S.mtns=[
    { x:0,   y:-1.2, z:72,  w:520, h:30, hs:0.95, haze:0.35, snow:1.0 },
    { x:-40, y:-1.6, z:135, w:620, h:48, hs:1.0,  haze:0.65, snow:1.0 },
    { x:60,  y:-2.0, z:210, w:760, h:70, hs:1.05, haze:0.9,  snow:1.0 },
  ];
  draw(M_BOX, 0,-0.30,9.7, 140,0.25,1.2, 3, {tintA:[0.22,0.21,0.20], uv:0.4, shadow:false}); /* shore */

  S.firePos=[4.25,0.85,-0.9];
  S.fireCol=[1.0,0.42,0.12];
  S.flick=1.0;
}

/* ============================================================================
   PARTICLES
   ============================================================================ */
function makePartSystem(o){
  const n=o.count, seeds=new Float32Array(n*4);
  const r=mulberry32((o.seed^0x1234)>>>0);
  for(let i=0;i<n*4;i++) seeds[i]=r();
  return { mode:o.mode, count:n, origin:o.origin, rise:o.rise||1, size:o.size||0.1,
    spread:o.spread||0.5, rate:o.rate||0.3, sway:o.sway||0.05, grow:o.grow||1,
    alpha:o.alpha==null?1:o.alpha, seeds };
}
function buildParticles(st){
  S.parts.length=0;
  const sd=st.seed>>>0;
  const fl=[14,26,40][st.fire|0];
  S.parts.push(makePartSystem({mode:0, count:fl, seed:sd^0xF1, origin:[4.45,0.42,-0.9],
    rise:0.85, size:0.34, spread:0.42, rate:0.9, sway:0.10, grow:1.5, alpha:0.95}));
  const emN=Math.round((st.sparks|0)/100*46);
  if(emN>0) S.parts.push(makePartSystem({mode:1, count:emN, seed:sd^0xE2, origin:[4.45,0.55,-0.9],
    rise:1.7, size:0.022, spread:0.35, rate:0.5, sway:0.16, grow:0.6, alpha:0.9}));
  S.parts.push(makePartSystem({mode:2, count:9, seed:sd^0x5E, origin:[4.45,1.35,-0.9],
    rise:1.5, size:0.5, spread:0.2, rate:0.22, sway:0.25, grow:2.6, alpha:0.30}));
  S.parts.push(makePartSystem({mode:3, count:1, seed:sd^0x60, origin:[4.30,0.85,-0.9],
    rise:0.01, size:2.6, spread:0.01, rate:0.05, sway:0, grow:1, alpha:0.16}));
  const w=st.weather|0;
  if(w===3) S.parts.push(makePartSystem({mode:4, count:420, seed:sd^0x5F, origin:[0,8.5,6],
    rise:8.0, size:0.035, spread:17, rate:0.16, sway:0.35, grow:1, alpha:0.85}));
  else if(w===2) S.parts.push(makePartSystem({mode:5, count:520, seed:sd^0x2A, origin:[0,9,6],
    rise:9.0, size:0.30, spread:17, rate:0.9, sway:0.02, grow:1, alpha:0.5}));
}
/* ============================================================================
   DRAW PASSES
   ============================================================================ */
function setSkyUniforms(LU2, te){
  const R=S.rig;
  gl.uniform1f(LU2("uTime"),te);
  gl.uniform3fv(LU2("uSunDir"),R.sunDir); gl.uniform3fv(LU2("uSunCol"),R.sunCol); gl.uniform1f(LU2("uSunI"),R.sunI);
  gl.uniform3fv(LU2("uMoonDir"),R.moonDir); gl.uniform3fv(LU2("uMoonCol"),R.moonCol); gl.uniform1f(LU2("uMoonI"),R.moonI);
  gl.uniform1f(LU2("uCloud"),R.cloud); gl.uniform1f(LU2("uHaze"),R.haze);
  gl.uniform1f(LU2("uNight"),R.night); gl.uniform1f(LU2("uSeedF"),S.texSeed);
}
function bindMatTex(LU2, mat){
  const T=TEX[MAT_TEX[mat]]||TEX.concrete;
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,T.alb); gl.uniform1i(LU2("uTexAlb"),0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,T.nrm); gl.uniform1i(LU2("uTexNrm"),1);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D,T.rgh); gl.uniform1i(LU2("uTexRgh"),2);
}
function drawLit(view, proj, te){
  gl.useProgram(litProg);
  gl.uniformMatrix4fv(LU("uView"),false,view);
  gl.uniformMatrix4fv(LU("uProj"),false,proj);
  gl.uniformMatrix4fv(LU("uShadowM"),false,S.shadowM);
  gl.uniform3fv(LU("uCamPos"),S.cam.eye);
  setSkyUniforms(LU,te);
  gl.uniform3fv(LU("uFirePos"),S.firePos);
  gl.uniform1f(LU("uFlick"),S.flick);
  gl.uniform3fv(LU("uFireCol"),S.fireCol);
  gl.uniform1f(LU("uFireI"),S.rig.fireI*2.0);
  gl.uniform3fv(LU("uAmbTint"),S.rig.amb);
  gl.uniform3fv(LU("uFillCol"),[0.5,0.56,0.62]);
  gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D,shTex); gl.uniform1i(LU("uShadow"),3);
  let lastMat=-1;
  for(const d of S.draws){
    gl.uniformMatrix4fv(LU("uModel"),false,d.model);
    if(d.mat!==lastMat){ bindMatTex(LU,d.mat); lastMat=d.mat; }
    gl.uniform3fv(LU("uTintA"),d.tintA);
    gl.uniform3fv(LU("uEmis"),d.emis);
    gl.uniform1f(LU("uRoughMul"),d.rough);
    gl.uniform1f(LU("uUvScale"),d.uv);
    gl.uniform1f(LU("uMode"),d.mode);
    gl.bindVertexArray(d.mesh.vao);
    gl.drawElements(gl.TRIANGLES,d.mesh.count,gl.UNSIGNED_INT,0);
  }
  gl.bindVertexArray(null);
}
function drawSky(view, proj, te){
  gl.disable(gl.DEPTH_TEST); gl.depthMask(false);
  gl.useProgram(skyProg);
  gl.uniformMatrix4fv(KU("uView"),false,mT(S.cam.eye[0],S.cam.eye[1],S.cam.eye[2]));
  gl.uniformMatrix4fv(KU("uProj"),false,proj);
  setSkyUniforms(KU,te);
  gl.bindVertexArray(M_SPH.vao);
  gl.drawElements(gl.TRIANGLES,M_SPH.count,gl.UNSIGNED_INT,0);

}
function drawMtns(view, proj, te){
  gl.useProgram(mtnProg);
  gl.uniformMatrix4fv(NU("uView"),false,view);
  gl.uniformMatrix4fv(NU("uProj"),false,proj);
  gl.uniform3fv(NU("uCamPos"),S.cam.eye);
  setSkyUniforms(NU,te);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,TEX.mtnH); gl.uniform1i(NU("uHeight"),0);
  for(const m of S.mtns){
    gl.uniformMatrix4fv(NU("uModel"),false,mMul(mT(m.x,m.y,m.z),mS(m.w,m.h,1)));
    gl.uniform1f(NU("uHScale"),m.hs);
    gl.uniform1f(NU("uHazeM"),m.haze*(0.5+S.rig.haze));
    gl.uniform1f(NU("uSnow"),m.snow*(S.rig.snow?1.15:1.0));
    gl.uniform1f(NU("uRelief"),9.0);
    gl.bindVertexArray(M_MTNWALL.vao);
    gl.drawElements(gl.TRIANGLES,M_MTNWALL.count,gl.UNSIGNED_INT,0);
  }
  gl.bindVertexArray(null);
}
function drawWater(view, proj, te){
  const Wd=S.water; if(!Wd) return;
  gl.useProgram(waterProg);
  gl.uniformMatrix4fv(WU("uViewM"),false,view);
  gl.uniformMatrix4fv(WU("uProjM"),false,proj);
  gl.uniformMatrix4fv(WU("uViewI"),false,mInverse(view));
  gl.uniform3fv(WU("uCamPos"),S.cam.eye);
  setSkyUniforms(WU,te);
  gl.uniform1f(WU("uChop"),Wd.chop);
  let wspd=1/6; if(S.rig.mist>0.01) wspd*=0.5; if(S.rig.rain>0.01) wspd*=1.4;
  gl.uniform1f(WU("uWSpd"),wspd);
  gl.uniform1f(WU("uRain"),S.rig.rain);
  gl.uniform1f(WU("uMist"),S.rig.mist);
  gl.uniform1f(WU("uShoreX"),10.0);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,resTex); gl.uniform1i(WU("uScene"),0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,depTex); gl.uniform1i(WU("uDepth"),1);
  gl.uniformMatrix4fv(WU("uModel"),false,
    mMul(mT((Wd.x0+Wd.x1)/2,Wd.y,(Wd.z0+Wd.z1)/2),mS(Wd.x1-Wd.x0,1,Wd.z1-Wd.z0)));
  gl.uniformMatrix4fv(WU("uView"),false,view);
  gl.uniformMatrix4fv(WU("uProj"),false,proj);
  gl.bindVertexArray(M_WATERMESH.vao);
  gl.drawElements(gl.TRIANGLES,M_WATERMESH.count,gl.UNSIGNED_INT,0);
  gl.bindVertexArray(null);
  gl.activeTexture(gl.TEXTURE0);
}
function drawGlass(view, proj, te){
  const G=S.glass; if(!G) return;
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
  gl.depthMask(false);
  gl.useProgram(glassProg);
  gl.uniformMatrix4fv(GU("uView"),false,view);
  gl.uniformMatrix4fv(GU("uProj"),false,proj);
  gl.uniform3fv(GU("uCamPos"),S.cam.eye);
  setSkyUniforms(GU,te);
  gl.uniform1f(GU("uRain"),S.rig.rain); gl.uniform1f(GU("uMist"),S.rig.mist);
  const spans=[[-5,-3.725],[-3.175,-1.4],[-1.4,0.2],[0.2,1.8],[1.8,3.4],[3.4,5.0]];

    gl.uniformMatrix4fv(GU("uModel"),false,

}
function drawParticles(view, proj, te){
  gl.enable(gl.BLEND);
  gl.depthMask(false);
  gl.useProgram(partProg);
  gl.uniformMatrix4fv(PU("uProj"),false,proj);
  gl.uniformMatrix4fv(PU("uView"),false,view);
  gl.uniform1f(PU("uTime"),te);
  gl.uniform1f(PU("uFlick"),S.flick);
  gl.bindVertexArray(partVAO.vao);
  for(const p of S.parts){
    if(p.mode===3) gl.blendFunc(gl.SRC_ALPHA,gl.ONE);
    else gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
    gl.uniform3fv(PU("uOrigin"),p.origin);
    gl.uniform1f(PU("uMode"),p.mode);
    gl.uniform1f(PU("uRise"),p.rise);
    gl.uniform1f(PU("uSize"),p.size);
    gl.uniform1f(PU("uSpread"),p.spread);
    gl.uniform1f(PU("uRate"),p.rate);
    gl.uniform1f(PU("uSway"),p.sway);
    gl.uniform1f(PU("uGrow"),p.grow);
    gl.uniform1f(PU("uAlpha"),p.alpha);
    gl.bindBuffer(gl.ARRAY_BUFFER,partVAO.seedBuf);
    gl.bufferData(gl.ARRAY_BUFFER,p.seeds,gl.DYNAMIC_DRAW);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,p.count);
  }
  gl.bindVertexArray(null);
  gl.depthMask(true); gl.disable(gl.BLEND);
}

/* ============================================================================
   MASTER RENDER — fixed 8-pass pipeline
   ============================================================================ */
function renderPasses(te, frame){
  const w=canvas.width, h=canvas.height;
  ensureShadow(); ensureFBO(w,h);
  const cam=S.cam, aspect=w/h;
  const proj=mPersp(cam.fov,aspect,0.1,900);
  const view=mLookAt(cam.eye,cam.tgt);
  S.proj=proj; S.view=view;

  /* 1. shadow map */
  {
    const R=S.rig;
    const L=[-R.sunDir[0]*38,-R.sunDir[1]*38,-R.sunDir[2]*38];
    const lightM=mMul(mOrtho(-13,13,-13,13,1,90),mLookAt(L,[0,1,0]));
    S.shadowM=lightM;
    gl.bindFramebuffer(gl.FRAMEBUFFER,shFBO);
    gl.viewport(0,0,1024,1024);
    gl.clearDepth(1); gl.clear(gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST); gl.depthMask(true);
    gl.useProgram(shadProg);
    gl.uniformMatrix4fv(HU("uLightM"),false,lightM);
    for(const d of S.draws){
      if(!d.shadow) continue;
      gl.uniformMatrix4fv(HU("uModel"),false,d.model);
      gl.bindVertexArray(d.mesh.vao);
      gl.drawElements(gl.TRIANGLES,d.mesh.count,gl.UNSIGNED_INT,0);
    }
    gl.bindVertexArray(null);
  }
  /* 2. half-res packed linear depth */
  {
    gl.bindFramebuffer(gl.FRAMEBUFFER,depFBO);
    gl.viewport(0,0,depW,depH);
    gl.clearColor(1,1,1,1); gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST); gl.depthMask(true);
    gl.useProgram(depthProg);
    gl.uniformMatrix4fv(DU("uView"),false,view);
    gl.uniformMatrix4fv(DU("uProj"),false,proj);
    gl.uniform3fv(DU("uCamPos"),cam.eye);
    gl.uniform1f(DU("uIsMtn"),0.0);
    for(const d of S.draws){
      gl.uniformMatrix4fv(DU("uModel"),false,d.model);
      gl.bindVertexArray(d.mesh.vao);
      gl.drawElements(gl.TRIANGLES,d.mesh.count,gl.UNSIGNED_INT,0);
    }
    gl.uniform1f(DU("uIsMtn"),1.0);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D,TEX.mtnH);
    gl.uniform1i(DU("uHeight"),0);
    for(const m of S.mtns){
      gl.uniformMatrix4fv(DU("uModel"),false,mMul(mT(m.x,m.y,m.z),mS(m.w,m.h,1)));
      gl.uniform1f(DU("uHScale"),m.hs);
      gl.bindVertexArray(M_MTNWALL.vao);
      gl.drawElements(gl.TRIANGLES,M_MTNWALL.count,gl.UNSIGNED_INT,0);
    }
    gl.bindVertexArray(null);
    gl.uniform1f(DU("uIsMtn"),0.0);
  }
  /* 3. MSAA: sky + mountains + opaque */
  {
    gl.bindFramebuffer(gl.FRAMEBUFFER,msFBO);
    gl.viewport(0,0,w,h);
    gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST); gl.depthMask(true);
    drawSky(view,proj,te);
    drawMtns(view,proj,te);
    drawLit(view,proj,te);
  }
  /* 4. resolve opaque color+depth */
  {
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER,msFBO);
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER,resFBO);
    gl.blitFramebuffer(0,0,w,h,0,0,w,h,gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT,gl.NEAREST);
  }
  /* 5. water back into MSAA */
  {
    gl.bindFramebuffer(gl.FRAMEBUFFER,msFBO);
    gl.enable(gl.DEPTH_TEST); gl.depthMask(true);
    drawWater(view,proj,te);
  }
  /* 6. glass + particles into MSAA */
  {
    drawGlass(view,proj,te);
    drawParticles(view,proj,te);
  }
  /* 7. final resolve into MSAA->canvas FBO then 8. post to canvas */
  {
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER,msFBO);
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER,resFBO);
    gl.blitFramebuffer(0,0,w,h,0,0,w,h,gl.COLOR_BUFFER_BIT,gl.NEAREST);
    gl.bindFramebuffer(gl.FRAMEBUFFER,null);
    gl.viewport(0,0,w,h);
    gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.disable(gl.DEPTH_TEST); gl.depthMask(false);
    gl.useProgram(postProg);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,resTex); gl.uniform1i(OU("uTex"),0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,depTex); gl.uniform1i(OU("uDepth"),1);
    gl.uniform1f(OU("uFrame"),frame);
    gl.uniform2f(OU("uRes"),w,h);
    gl.uniform1f(OU("uExposure"),S.rig.exposure);
    gl.uniform1f(OU("uVig"),0.32);
    const GI=[[0.020,0.028],[0,0],[0.006,0.008],[0.012,0.016],[0.035,0.045]][settings.grain|0]||[0.020,0.028];
    gl.uniform1f(OU("uGrain"),S.rig.night?GI[1]:GI[0]);
    gl.uniform1f(OU("uWarm"),S.rig.warmth);
    gl.uniform1f(OU("uNight"),S.rig.night);
    gl.uniform1f(OU("uAO"),0.75);
    gl.bindVertexArray(postVAO);
    gl.drawArrays(gl.TRIANGLES,0,3);
    gl.bindVertexArray(null);
    gl.depthMask(true); gl.enable(gl.DEPTH_TEST);
    gl.activeTexture(gl.TEXTURE0);
  }
}

/* ============================================================================
   FRAME LOOP — fixed time; wall clock never touches render pixels
   ============================================================================ */
const FIXED_DT=1/30;
function tickFrame(){
  const te=S.frame*FIXED_DT;
  const fl=[0.6,1.0,1.5][settings.fire|0];
  S.flick=(0.72+0.28*Math.sin(te*11.7)*Math.sin(te*5.3+1.7)+0.10*Math.sin(te*23.1))*fl;
  S.cam=cameraAt(te);
  renderPasses(te,S.frame);
  S.frame++;
}
function frameLoop(){
  if(document.hidden){ requestAnimationFrame(frameLoop); return; }
  tickFrame();
  requestAnimationFrame(frameLoop);
}

/* ============================================================================
   SEED WIRING — v3 mixed-radix: the seed number packs all 13 params exactly,
   so a "#3XXXXXXXX" seed always rebuilds the identical scene. Legacy seeds
   keep their number and are hashed into the nearest v3 scene.
   ============================================================================ */
const PARAM_KEYS=["stone","floor","wood","rug","weather","time","water","camera","motion","fire","deck","sparks","grain"];
const PARAM_SIZES=[4,4,3,4,5,3,3,6,3,3,3,101,5];
function hashMix(n){ n=Math.imul(n^0x9e3779b9,0x85ebca6b)>>>0; n^=n>>>13; n=Math.imul(n,0xc2b2ae35)>>>0; n^=n>>>16; return n>>>0; }
function decodeParams(n){
  const out={}; let k=n>>>0;
  for(let i=0;i<PARAM_SIZES.length;i++){ out[PARAM_KEYS[i]]=k%PARAM_SIZES[i]; k=Math.floor(k/PARAM_SIZES[i]); }
  return out;
}
function paramsToNum(p){
  let n=0,mult=1;
  for(let i=0;i<PARAM_KEYS.length;i++){ n+=clamp(Math.round(p[PARAM_KEYS[i]]||0),0,PARAM_SIZES[i]-1)*mult; mult*=PARAM_SIZES[i]; }
  return n>>>0;
}
function randomSeedString(){
  const p={};
  for(let i=0;i<PARAM_KEYS.length;i++) p[PARAM_KEYS[i]]=(cryptoUint32()>>>0)%PARAM_SIZES[i];
  return "#3"+paramsToNum(p).toString(16).toUpperCase().padStart(8,"0");
}
function settingsSeedString(){
  return "#3"+paramsToNum(settings).toString(16).toUpperCase().padStart(8,"0");
}
function applySeedParams(ps){
  const raw=(ps.ver===3)?(ps.n>>>0):hashMix(ps.n>>>0);
  const q=decodeParams(raw);
  for(const k of PARAM_KEYS) settings[k]=q[k];
  settings.seed=ps.n>>>0; settings.ver=ps.ver;
}
function applySeedString(seedStr){
  applySeedParams(parseSeed(seedStr));
  generateScene(settings);
  buildParticles(settings);
  S.frame=0; liveT=0; lastNow=0;
  tickFrame(0,0);
  document.title="Fireplace — "+settingsSeedString();
  try{ localStorage.setItem("fireplace-studio-v3-seed",settingsSeedString()); }catch(e){}
}
function resetSim(){ S.frame=0; liveT=0; lastNow=0; tickFrame(0,0); }
let regenTimer=0;
function setParamLive(key,val){
  settings[key]=val;
  clearTimeout(regenTimer);
  regenTimer=setTimeout(function(){ generateScene(settings); buildParticles(settings); },180);
}

/* ============================================================================
   FRAME LOOP — honors window.__renderMode for deterministic ?render=1 export.
   Wall clock never touches render pixels: live mode integrates its own dt,
   render mode uses fixed te = RM.frame/RM.fps and the fixed frame index.
   ============================================================================ */
let lastNow=0, liveT=0;
function rmBookkeep(RM){
  if(RM.phase==="warmup"){ RM.frame++; if(RM.frame>=RM.warmup&&RM.onPhase){ try{RM.onPhase("reset");}catch(e){} } }
  else if(RM.phase==="record"){ if(RM.onFrame){ try{RM.onFrame(RM.frame);}catch(e){} } RM.frame++; if(RM.frame>=RM.totalFrames&&RM.onPhase){ try{RM.onPhase("done");}catch(e){} } }
}
function tickFrame(te,frameNo){
  const fl=[0.6,1.0,1.5][settings.fire|0];
  S.flick=(0.72+0.28*Math.sin(te*11.7)*Math.sin(te*5.3+1.7)+0.10*Math.sin(te*23.1))*fl;
  S.cam=cameraAt(te);
  renderPasses(te,frameNo);
}
function frameLoop(nowMs){
  requestAnimationFrame(frameLoop);
  const RM=window.__renderMode;
  const active=RM&&!RM.paused&&RM.phase!=="done"&&RM.phase!=="cancelled"&&RM.phase!=="reset"&&!RM._bp;
  let te,frameNo;
  if(active){
    if(canvas.width!==RM.W||canvas.height!==RM.H){ canvas.width=RM.W; canvas.height=RM.H; }
    te=RM.frame/RM.fps; frameNo=RM.frame;
  }else{
    sizeCanvas();
    const now=nowMs/1000;
    if(!lastNow) lastNow=now;
    const dt=Math.min(Math.max(now-lastNow,0),0.1); lastNow=now;
    liveT+=dt; te=liveT; frameNo=S.frame; S.frame++;
  }
  tickFrame(te,frameNo);
  if(RM) rmBookkeep(RM);
}

window.__fpRemixSeed=function(s){
  const ps=parseSeed(s);
  const q=decodeParams(ps.ver===3?(ps.n>>>0):hashMix(ps.n>>>0));
  const r=mulberry32(cryptoUint32());
  const idx=[]; const nCh=3+((r()*3)|0);
  while(idx.length<nCh){ const ii=(r()*PARAM_KEYS.length)|0; if(idx.indexOf(ii)<0) idx.push(ii); }
  for(const ii of idx) q[PARAM_KEYS[ii]]=(r()*PARAM_SIZES[ii])|0;
  return "#3"+paramsToNum(q).toString(16).toUpperCase().padStart(8,"0");
};

/* resize */
function sizeCanvas(){
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const w=Math.round(canvas.clientWidth*dpr)||Math.round(window.innerWidth*dpr);
  const h=Math.round(canvas.clientHeight*dpr)||Math.round(window.innerHeight*dpr);
  if(w&&h&&(canvas.width!==w||canvas.height!==h)){ canvas.width=w; canvas.height=h; }
}

(function boot(){

      return true;
    } catch (e) {
      fail('Couldn\u2019t start the encoder: ' + e.message);
      return false;
    }
  }

  function encodeFrame(idx) {
    if (!encoder || RM.phase !== 'record' || !rcanvas) return;
    if (encoder.encodeQueueSize > 90) { RM._bp = true; return; }
    var src = rcanvas;
    if (fctx && frame2d) {
      try { fctx.drawImage(rcanvas, 0, 0, W, H); src = frame2d; }
      catch (e) { noteEncodeError(); return; }
    }
    var vf = null;
    try { vf = new VideoFrame(src, { timestamp: Math.round(idx * 1e6 / fps), alpha: 'discard' }); }
    catch (e) { noteEncodeError(); return; }
    framesAttempted++;
    try { encoder.encode(vf, { keyFrame: idx % (fps * 5) === 0 }); }
    catch (e) { noteEncodeError(); }
    try { vf.close(); } catch (e) {}
    encodedFrames = idx + 1;
    /* Fail fast on a silently stalled encoder: 60 frames fully drained,
       nothing recorded. Saves the user sitting through a doomed render. */
    if (framesAttempted >= 60 && muxedChunks === 0 && encoder.encodeQueueSize === 0) {
      failEmpty();
      return;
    }
    if ((idx & 15) === 0) updateProgress();
  }

  function updateProgress() {
    var pct = Math.min(100, (encodedFrames / totalFrames) * 100);
    var bar = document.getElementById('rmBar');
    if (bar) bar.style.width = pct.toFixed(1) + '%';
    var el = (performance.now() - t0) / 1000;
    var rate = encodedFrames / Math.max(el, 0.1);
    var remain = rate > 0.01 ? (totalFrames - encodedFrames) / rate : 0;
    setStatus('Frame ' + encodedFrames.toLocaleString() + ' / ' + totalFrames.toLocaleString() + ' (' + pct.toFixed(0) + '%)');
    var eta = document.getElementById('rmEta');
    if (eta) eta.textContent = '\u2248 ' + fmtTime(remain) + ' left \u00B7 ' + rate.toFixed(1) + ' fps wall \u00B7 ' + muxedChunks + ' chunks \u00B7 q' + encoder.encodeQueueSize;
  }

  async function finishRender() {
    RM.phase = 'done'; RM.onFrame = null;
    updateProgress();
    setStatus('Finishing video\u2026');
    try {
      if (encoder) await encoder.flush();
      if (muxer) muxer.finalize();
    } catch (e) { fail('Couldn\u2019t finish the video: ' + e.message); return; }
    var buf = muxer.target.buffer;
    if (!buf || !buf.byteLength) { fail('The video came out empty.'); return; }
    if (muxedChunks === 0) { failEmpty(); return; }
    try { window.__renderResult = buf; } catch (e) {} /* lets automated tests grab the MP4 */
    var blob = new Blob([buf], { type: 'video/mp4' });
    var cleanSeed = seed.replace(/[^A-Za-z0-9]+/g, '').slice(0, 14) || 'seed';
    var name = studioLabel.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') +
      '-' + cleanSeed + '-' + seconds + 's.mp4';
    showDone(blob, name);
    markQueueDone();
  }

  function showDone(blob, name) {
    var url = URL.createObjectURL(blob);
    var mb = (blob.size / 1048576).toFixed(1);
    overlay.innerHTML =
      '<div style="font-size:44px;margin-bottom:10px">\u2705</div>' +
      '<div style="font-size:20px;font-weight:800;margin-bottom:6px">Your video is ready</div>' +
      '<div style="font-size:13px;color:#8b95ab;margin-bottom:20px;font-family:ui-monospace,monospace">' + esc(name) + ' \u00B7 ' + mb + ' MB</div>' +
      '<button id="rmShare" style="font-size:17px;font-weight:800;border:0;border-radius:14px;padding:16px 30px;background:#2f7bff;color:#fff;margin-bottom:12px">Share video</button>' +
      '<div style="font-size:12px;color:#8b95ab;max-width:300px;line-height:1.6">Share \u2192 Save to Files \u2192 your SSD.<br>Or use the download link below.</div>' +
      '<a id="rmDl" href="' + url + '" download="' + esc(name) + '" style="margin-top:14px;color:#9cc3ff;font-size:14px">Download instead</a>';
    document.getElementById('rmShare').onclick = function () {
      var file = new File([blob], name, { type: 'video/mp4' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: name }).catch(function () {});
      } else {
        document.getElementById('rmDl').click();
      }
    };
  }

  async function markQueueDone() {
    var token = null;
    try { token = localStorage.getItem('rq_token'); } catch (e) {}
    if (!token || !qid) return;
    try {
      var api = 'https://api.github.com/repos/bassseamoor/render-queue/contents/queue.json';
      var h = { Authorization: 'Bearer ' + token };
      var r = await fetch(api, { headers: h });
      if (!r.ok) return;
      var j = await r.json();
      var data = JSON.parse(atob(j.content));
      var it = (data.items || []).find(function (x) { return x.id === qid; });
      if (!it) return;
      it.status = 'done';
      await fetch(api, {
        method: 'PUT', headers: Object.assign({ 'Content-Type': 'application/json' }, h),
        body: JSON.stringify({
          message: 'Mark render done', sha: j.sha,
          content: btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))))
        })
      });
    } catch (e) {}
  }

  document.getElementById('rmPause').onclick = function () {
    if (RM.phase !== 'record' && RM.phase !== 'warmup') return;
    RM.paused = !RM.paused;
    this.textContent = RM.paused ? '\u25B6 Resume' : '\u23F8 Pause';
    setStatus(RM.paused ? 'Paused \u2014 nothing is lost.' : (RM.phase === 'record' ? 'Rendering\u2026' : 'Preparing\u2026'));
  };
  document.getElementById('rmCancel').onclick = function () {
    RM.phase = 'cancelled'; RM.onFrame = null;
    try { if (encoder) encoder.close(); } catch (e) {}
    overlay.innerHTML =
      '<div style="font-size:20px;font-weight:800;margin-bottom:8px">Cancelled</div>' +
      '<div style="font-size:13px;color:#8b95ab;margin-bottom:18px">No video was saved.</div>' +
      '<button id="rmBack" ' +
      'style="font-size:16px;font-weight:700;border:0;border-radius:12px;padding:14px 24px;background:#1a2236;color:#fff">Back to queue</button>';
    /* Was: inline onclick with curly quotes around the URL — a JS syntax
       error, so tapping the button silently did nothing. */
    document.getElementById('rmBack').onclick = function () {
      location.href = 'https://bassseamoor.github.io/render-queue/';
    };
  };

  /* ---- force render-size drawing buffer, keep screen awake ----
     Set the buffer directly (reliable) and also try the studio's own
     resize path if it exposes one (it may reallocate its targets). */
  try {
    if (rcanvas) { rcanvas.width = W; rcanvas.height = H; }
    if (typeof loop !== 'undefined' && loop && loop.resize) { try { loop.resize(); } catch (e) {} }
  } catch (e) {}
  try {
    if (navigator.wakeLock) {
      var keepAwake = function () { navigator.wakeLock.request('screen').catch(function () {}); };
      keepAwake();
      document.addEventListener('visibilitychange', function () { if (!document.hidden) keepAwake(); });
    }
  } catch (e) {}
  setStatus('Preparing\u2026 (warming up)');
})();

</script>
</body>
</html>
