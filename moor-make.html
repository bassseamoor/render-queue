<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Moor — What do you want to make?</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root { --bg:#0a0e0a; --ink:#f2f5f1; --dim:rgba(242,245,241,.62); --acc:#4ade80; }
  html, body { height: 100%; }
  body { margin:0; background: radial-gradient(90% 60% at 50% 0%, #122016 0%, var(--bg) 60%) fixed, var(--bg);
    color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased; }
  .view { display:none; }
  .view.on { display:block; }
  #landing.on { min-height: 100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 28px 22px; max-width: 640px; margin: 0 auto; }
  .logo { font-weight: 800; letter-spacing: .4em; font-size: 13px; color: var(--acc); margin-bottom: 26px; text-indent:.4em; }
  .sentence { font-size: clamp(21px, 5vw, 30px); line-height: 1.35; text-align:center; margin: 0 0 30px; font-weight: 650;
    letter-spacing:-.01em; }
  #makeform { display:flex; width:100%; gap:8px; background: rgba(255,255,255,.055);
    border:1px solid rgba(74,222,128,.35); border-radius: 20px; padding: 8px; box-shadow: 0 0 50px rgba(74,222,128,.08); }
  #makeinput { flex:1; min-width:0; background:transparent; border:0; outline:none; color:var(--ink);
    font-size:18px; font-family:inherit; padding: 12px 10px 12px 14px; }
  #makeinput::placeholder { color: rgba(242,245,241,.35); }
  #makeform button { flex:none; border:0; cursor:pointer; background: var(--acc); color:#06240f; font-weight:800;
    font-size:16px; font-family:inherit; border-radius: 14px; padding: 12px 24px; }
  #makeform button:active { transform: scale(.96); }
  .examples { display:flex; flex-wrap:wrap; gap:9px; justify-content:center; margin-top: 22px; }
  .chip { border:1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.04); color: var(--dim);
    border-radius: 999px; padding: 10px 17px; font-size: 14.5px; cursor:pointer; font-family:inherit; }
  .chip:active { transform: scale(.95); border-color: rgba(74,222,128,.5); color: var(--ink); }
  #nomatch { margin-top: 18px; color: #f2b8b8; font-size: 14.5px; text-align:center; min-height: 22px; }
  #building.on { min-height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; }
  .spin { width:44px; height:44px; border-radius:50%; border:3px solid rgba(74,222,128,.25);
    border-top-color: var(--acc); animation: sp 0.8s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  #building p { color: var(--dim); font-size: 16px; margin:0; }
  #resultbar { position:fixed; top:0; left:0; right:0; height:58px; display:flex; align-items:center; gap:10px;
    padding: 0 12px; background: rgba(10,14,10,.92); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border-bottom: 1px solid rgba(255,255,255,.08); z-index: 20; }
  #resultbar .tbtn { flex:none; border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.05); color:var(--ink);
    border-radius: 11px; padding: 9px 14px; font-size: 14px; font-weight:700; cursor:pointer; font-family:inherit; }
  #resultbar .tbtn:active { transform: scale(.94); }
  #sharebtn { background: var(--acc); border-color: transparent; color:#06240f; }
  #appname { flex:1; min-width:0; text-align:center; font-weight:700; font-size:16px; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; }
  #appframe { position:fixed; top:58px; left:0; width:100%; height: calc(100% - 58px); border:0; background:#0a0e0a; }
  #receipt { position:fixed; top:66px; left:50%; transform:translateX(-50%) translateY(-8px); width:min(480px,92vw);
    background: rgba(14,20,14,.96); border:1px solid rgba(74,222,128,.35); border-radius:16px; padding:14px 40px 14px 16px;
    font-size:14px; line-height:1.55; z-index:30; opacity:0; pointer-events:none; transition: opacity .3s, transform .3s;
    box-shadow: 0 18px 50px rgba(0,0,0,.5); }
  #receipt.on { opacity:1; pointer-events:auto; transform:translateX(-50%) translateY(0); }
  #receipt .rsub { color: var(--dim); font-size:13px; }
  #receipt .rsub.dim { opacity:.75; }
  #receiptx { position:absolute; top:8px; right:8px; border:0; background:none; color:var(--dim); font-size:17px;
    cursor:pointer; padding:6px 10px; }
  #toast { position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(10px); background:#16241a;
    border:1px solid rgba(74,222,128,.4); color:var(--ink); border-radius:999px; padding:11px 22px; font-size:14px;
    opacity:0; pointer-events:none; transition: opacity .3s, transform .3s; z-index:40; white-space:nowrap; }
  #toast.on { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <div id="landing" class="view on">
    <div class="logo">MOOR</div>
    <h1 class="sentence">Moor is a personal OS that builds software from plain words &mdash; describe what you want to make, and it&rsquo;s ready in seconds.</h1>
    <form id="makeform">
      <input id="makeinput" placeholder="What do you want to make?" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <button type="submit">Make it</button>
    </form>
    <div class="examples">
      <button class="chip" data-p="a budget tracker">a budget tracker</button>
      <button class="chip" data-p="a habit tracker with streaks">a habit tracker with streaks</button>
      <button class="chip" data-p="a focus timer for deep work">a focus timer for deep work</button>
      <button class="chip" data-p="a drum machine">a drum machine</button>
    </div>
    <div id="nomatch"></div>
  </div>
  <div id="building" class="view">
    <div class="spin"></div>
    <p>Building your app&hellip;</p>
  </div>
  <div id="result" class="view">
    <div id="resultbar">
      <button class="tbtn" id="backbtn">&larr; Make another</button>
      <div id="appname"></div>
      <button class="tbtn" id="sharebtn">Share</button>
    </div>
    <div id="receipt"><button id="receiptx">&times;</button><div id="receiptbody"></div></div>
    <iframe id="appframe" title="Your app"></iframe>
  </div>
  <div id="toast"></div>

function buildAppName(text, kitName){
  let t = (text||'').toLowerCase()
    .replace(/^(please\s+)?(build|make|create|give me|i want|i need|can you|could you)\s+/,'')
    .replace(/^(me\s+)?(a|an|the)\s+/,'')
    .replace(/\s+(for|to)\s+(my|me)\b.*$/,'')
    .replace(/\s+please\s*$/,'').trim();
  if(!t || t.length < 3 || /^(app|game|tool|thing|one|it)$/.test(t)) return kitName;
  t = t.replace(/\blike\b.*$/,'').trim() || t;
  t = t.replace(/\b\w/g, c=>c.toUpperCase());
  return t.length > 26 ? t.slice(0,26).trim() : t;
}

const Kits = {
  base: (window.MOOR_KITS_BASE || 'https://bassseamoor.github.io/render-queue/kits/'),
  index: null, _kits: {},
  async load(){
    if(this.index) return this.index;
    this.index = (typeof KITS_BUNDLED!=='undefined' && KITS_BUNDLED.index) || null;
    if(this.index){
      fetch(this.base + 'index.json', {cache:'no-cache'}).then(r=>r.ok?r.json():null)
        .then(j=>{ if(j && j.kits && j.kits.length) this.index = j; }).catch(()=>{});
      return this.index;
    }
    const r = await fetch(this.base + 'index.json', {cache:'no-cache'});
    if(!r.ok) throw new Error('kit catalog unavailable');
    this.index = await r.json();
    return this.index;
  },
  async getKit(id){
    if(this._kits[id]) return this._kits[id];
    if(typeof KITS_BUNDLED!=='undefined' && KITS_BUNDLED.quiz[id]){
      const e = (KITS_BUNDLED.index.kits||[]).find(k=>k.id===id) || {id};
      const k = Object.assign({}, e, {quiz: KITS_BUNDLED.quiz[id]});
      this._kits[id] = k; return k;
    }
    const r = await fetch(this.base + id + '/kit.json', {cache:'no-cache'});
    if(!r.ok) throw new Error('kit not found');
    const k = await r.json(); this._kits[id] = k; return k;
  },
  match(text){
    const ix = this.index || ((typeof KITS_BUNDLED!=='undefined') ? KITS_BUNDLED.index : null);
    if(!ix || !ix.kits) return null;
    const words = text.toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(w=>w.length>2);
    if(!words.length) return null;
    let best=null, bestScore=0;
    ix.kits.forEach(k=>{
      const hay = ((k.keywords||[]).join(' ')+' '+k.name+' '+(k.description||'')).toLowerCase();
      let s=0;
      words.forEach(w=>{ if(hay.indexOf(w)>=0) s += ((k.keywords||[]).indexOf(w)>=0 ? 3 : 1); });
      const nm = (k.name||'').toLowerCase(), kid = (k.id||'').replace(/-/g,' ');
      words.forEach(w=>{ if(w===nm || w===kid) s += 4; });
      if(s>bestScore){ bestScore=s; best=k; }
    });
    return bestScore>=2 ? best : null;
  },
  defaults(kit){
    const c={};
    (kit.quiz||[]).forEach(q=>{ c[q.id] = (q.default!==undefined ? q.default : (q.type==='toggles'?[]:null)); });
    return c;
  },
  async buildHTML(kit, config){
    const ck = 'moor.asm.' + kit.id;
    let code = null;
    try{ code = localStorage.getItem(ck); }catch(e){}
    if(!code){
      const r = await fetch(this.base + kit.id + '/assembler.js', {cache:'no-cache'});
      if(!r.ok) throw new Error('assembler unavailable');
      code = await r.text();
      try{ localStorage.setItem(ck, code); }catch(e){}
    }
    const prev = window.MoorKit;
    try{
      (0,eval)(code);
      if(!window.MoorKit || typeof window.MoorKit.build!=='function') throw new Error('bad assembler');
      const html = window.MoorKit.build(config||{});
      if(typeof html!=='string' || html.indexOf('<!DOCTYPE html>')!==0) throw new Error('bad build output');
      return html;
    }finally{ if(prev===undefined){ try{delete window.MoorKit;}catch(e){} } else window.MoorKit = prev; }
  }
};

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function kitIndex(id){
  const e = (KITS_BUNDLED.index.kits||[]).find(k=>k.id===id);
  return e ? Object.assign({}, e, {quiz: KITS_BUNDLED.quiz[id]||[]}) : null;
}
function planForKit(kitId, text){
  const kit = kitIndex(kitId); if(!kit) return null;
  const t = (text||'').trim();
  const config = Kits.defaults(kit);
  const rules = KIT_RULES[kit.id]||{};
  (kit.quiz||[]).forEach(q=>{
    (rules[q.id]||[]).forEach(([re, val])=>{
      if(!re.test(t)) return;
      if(q.type==='toggles'){
        let arr = (config[q.id]||[]).slice();
        if(val[0]==='+'){ if(arr.indexOf(val.slice(1))<0) arr.push(val.slice(1)); }
        else if(val[0]==='-'){ arr = arr.filter(x=>x!==val.slice(1)); }
        config[q.id] = arr;
      }else config[q.id] = val;
    });
  });
  const req = (KIT_DELIVERS[kit.id]||[]).map(d=>[d,1,'']);
  const missing = [];
  BUILD_NOTES.forEach(n=>{
    if(n.re.test(t) && (!n.kits || n.kits.indexOf(kit.id)>=0)) missing.push(n.note);
  });
  return {kit, config, name:buildAppName(t, kit.name), req, missing};
}
function plan(text){
  const t = (text||'').trim(); if(!t) return null;
  for(const s of BUILD_SPECIALS){
    if(s.re.test(t)){
      const kit = kitIndex(s.kit); if(!kit) continue;
      const config = Object.assign(Kits.defaults(kit), s.config||{});
      return {kit, config, name:s.name, req:s.req||[], missing:[]};
    }
  }
  const m = Kits.match(t); if(!m) return null;
  return planForKit(m.id, t);
}
async function buildHTMLFor(kitId, config){
  const kit = kitIndex(kitId); if(!kit) throw new Error('unknown kit');
  return await Kits.buildHTML(kit, config||Kits.defaults(kit));
}

function encConfig(c){
  return btoa(unescape(encodeURIComponent(JSON.stringify(c))))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function decConfig(s){
  s = s.replace(/-/g,'+').replace(/_/g,'/');
  while(s.length % 4) s += '=';
  return JSON.parse(decodeURIComponent(escape(atob(s))));
}
function shareURL(kitId, config){
  return location.href.split('#')[0] + '#make=' + encodeURIComponent(kitId) + '&c=' + encConfig(config);
}
function parseHash(){
  const h = location.hash.replace(/^#/,'');
  if(!h.startsWith('make=')) return null;
  const p = {};
  h.split('&').forEach(kv=>{ const i = kv.indexOf('='); p[kv.slice(0,i)] = decodeURIComponent(kv.slice(i+1)); });
  if(!p.make || !kitIndex(p.make)) return null;
  let config = null;
  try{ config = p.c ? decConfig(p.c) : null; }catch(e){ config = null; }
  return {kitId:p.make, config};
}
/* ---------- UI ---------- */
const $ = id => document.getElementById(id);
const landingEl = $('landing'), buildingEl = $('building'), resultEl = $('result'),
      appFrame = $('appframe'), appNameEl = $('appname'), receiptEl = $('receipt'),
      toastEl = $('toast');
let current = null; // {kitId, config, name}

function show(view){
  [landingEl, buildingEl, resultEl].forEach(e=>e.classList.remove('on'));
  ({landing:landingEl, building:buildingEl, result:resultEl})[view].classList.add('on');
  window.scrollTo(0,0);
}
function toast(msg){
  toastEl.textContent = msg; toastEl.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(()=>toastEl.classList.remove('on'), 2600);
}
function receiptHTML(plan){
  const has = (plan.req||[]).filter(r=>r[1]).map(r=>esc(r[0].toLowerCase()));
  const hasnt = (plan.req||[]).filter(r=>!r[1]);
  (plan.missing||[]).forEach(m=>hasnt.push(['',0,m]));
  let h = '<div style="font-weight:700;margin-bottom:6px">✓ Built <b>'+esc(plan.name)+'</b></div>';
  if(has.length) h += '<div class="rsub">It has: '+has.join(' · ')+'</div>';
  hasnt.forEach(r=>{
    const txt = r[2] ? (r[0] ? r[0]+' — '+r[2] : r[2]) : r[0];
    h += '<div class="rsub dim">Not in this build: '+esc(txt)+'</div>';
  });
  h += '<div class="rsub dim" style="margin-top:8px">Tap Share to send this app to anyone with the link.</div>';
  return h;
}
async function makeFromText(text){
  const p = plan(text);
  if(!p){
    $('nomatch').textContent = 'I don\u2019t know how to make that yet — try one of the examples below.';
    return;
  }
  $('nomatch').textContent = '';
  await openResult(p.kit.id, p.config, p.name, p);
}
async function openResult(kitId, config, name, plan){
  current = {kitId, config, name};
  show('building');
  try{
    const html = await buildHTMLFor(kitId, config);
    appNameEl.textContent = name || kitId;
    const rbody = document.getElementById('receiptbody');
    if(plan){ rbody.innerHTML = receiptHTML(plan); receiptEl.classList.add('on'); }
    else { rbody.innerHTML = ''; receiptEl.classList.remove('on'); }
    appFrame.srcdoc = html;
    show('result');
  }catch(e){
    show('landing');
    $('nomatch').textContent = 'Couldn\u2019t build that ('+(e.message||'offline?')+'). Kits need internet the first time.';
  }
}
async function shareCurrent(){
  if(!current) return;
  const url = shareURL(current.kitId, current.config);
  try{ await navigator.clipboard.writeText(url); toast('Shareable link copied'); }
  catch(e){
    prompt('Copy this link:', url);
  }
}
$('makeform').addEventListener('submit', e=>{
  e.preventDefault();
  const t = $('makeinput').value.trim();
  if(t) makeFromText(t);
});
document.querySelectorAll('.chip').forEach(ch=>{
  ch.addEventListener('click', ()=>{ $('makeinput').value = ch.dataset.p; makeFromText(ch.dataset.p); });
});
$('backbtn').addEventListener('click', ()=>{
  appFrame.removeAttribute('srcdoc'); current = null;
  history.replaceState(null,'',location.pathname);
  show('landing');
});
$('sharebtn').addEventListener('click', shareCurrent);
$('receiptx').addEventListener('click', ()=>receiptEl.classList.remove('on'));
/* deep link: open a shared app straight away, on load and on hash change */
let _lastHash = null;
async function handleHash(){
  if(location.hash === _lastHash) return;
  const h = parseHash();
  if(!h) return;
  _lastHash = location.hash;
  const kit = kitIndex(h.kitId);
  await openResult(h.kitId, h.config || Kits.defaults(kit), kit.name, null);
}
window.addEventListener('hashchange', handleHash);
handleHash();

</script>
</body>
